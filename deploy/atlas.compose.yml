name: atlas-diary
services:
  atlas:
    image: ${ATLAS_IMAGE:?Provide verified Atlas image}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3112:3000"
    environment:
      DATABASE_PATH: /data/atlas-school.sqlite
      PUBLIC_APP_ORIGIN: ${ATLAS_PUBLIC_ORIGIN:?Configure Atlas origin}
      ARTHELLO_PUBLIC_ORIGIN: ${ARTHELLO_PUBLIC_ORIGIN:?Configure central origin}
      CENTRAL_ACCESS_SECRET: ${ATLAS_CENTRAL_ACCESS_SECRET:?Use a dedicated Atlas key}
      PASSWORDLESS_PEPPER: ${ATLAS_PASSWORDLESS_PEPPER:?Use a dedicated Atlas pepper}
    volumes:
      - atlas_data:/data
      - atlas_backups:/backups
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  atlas_data:
  atlas_backups:
