services:
  school:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: school-1-11
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_PATH: /data/school-1-11.sqlite
      PUBLIC_APP_ORIGIN: ${PUBLIC_APP_ORIGIN:-https://school-188-225-38-55.sslip.io}
      CENTRAL_ACCESS_SECRET: ${CENTRAL_ACCESS_SECRET:?CENTRAL_ACCESS_SECRET must be set}
    ports:
      - "127.0.0.1:3111:3000"
    volumes:
      - school_data:/data
      - school_backups:/backups
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true

volumes:
  school_data:
  school_backups:
