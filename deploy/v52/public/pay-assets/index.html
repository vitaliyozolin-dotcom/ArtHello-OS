<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <meta
      name="description"
      content="Безопасное управление оплатами образовательной группы ArtHello."
    />
    <title>ArtHello Pay</title>
    <link rel="stylesheet" href="/pay-assets/styles.css" />
  </head>
  <body data-arthello-pay-shell="d168">
    <div id="app" aria-live="polite">
      <main class="loading-page">
        <section class="loading-card">
          <div class="spinner" aria-hidden="true"></div>
          <strong>Открываем ArtHello Pay</strong>
          <noscript>
            <p>Для работы защищённого окна оплаты включите JavaScript.</p>
          </noscript>
        </section>
      </main>
    </div>
    <div id="toast-root" class="toast-root" aria-live="assertive"></div>
    <script type="module" src="/pay-assets/app.js"></script>
  </body>
</html>
