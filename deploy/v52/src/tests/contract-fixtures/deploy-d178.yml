# D178 is a one-time, owner-authorized activation of the already verified D177
# AlfaCRM image. It runs only after the exact D178 main commit passes the hosted
# verifier and changes only the fail-closed import runtime flag. The connector
# remains read-only towards AlfaCRM and every module still requires a fresh
# preview token before it can write an ArtHello projection.
name: Activate ArtHello AlfaCRM import D178

'on':
  workflow_run:
    workflows:
      - Verify ArtHello v52 release
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: read

concurrency:
  group: gateway-38-55-arthello-production
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: vitaliyozolin-dotcom/ArtHello-OS
  ACTIVATION_SHA: ${{ github.event.workflow_run.head_sha }}
  TRIGGER_VERIFY_RUN_ID: ${{ github.event.workflow_run.id }}
  EXPECTED_LIVE_RELEASE_SHA: 6ef7a3dc82e4644d1991d5454e61b62149b3738b
  EXPECTED_LIVE_IMAGE_ID: sha256:8bda721095c7b178ea5721115bd2146269a07fd30eb91f905abe59b889306000
  PUBLIC_URL: https://arthello-188-225-38-55.sslip.io
  SCHOOL_URL: https://school-188-225-38-55.sslip.io
  PAY_URL: https://pay-188-225-38-55.sslip.io
  CADDY_CONTAINER: stroios-caddy-1
  DATA_VOLUME: arthello-direct-v44-data

jobs:
  activate:
    if: >-
      github.event_name == 'workflow_run' &&
      github.repository == 'vitaliyozolin-dotcom/ArtHello-OS' &&
      github.repository_owner == 'vitaliyozolin-dotcom' &&
      github.event.workflow_run.name == 'Verify ArtHello v52 release' &&
      (github.event.workflow_run.path == '.github/workflows/verify-arthello-v52.yml' ||
       github.event.workflow_run.path == '.github/workflows/verify-arthello-v52.yml@main') &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.actor.login == 'vitaliyozolin-dotcom' &&
      github.event.workflow_run.triggering_actor.login == 'vitaliyozolin-dotcom' &&
      github.run_attempt == 1 &&
      startsWith(github.event.workflow_run.head_commit.message, 'D178: activate AlfaCRM controlled import')
    runs-on: [self-hosted, linux, x64, arthello-gateway]
    environment: production-ru
    timeout-minutes: 30
    outputs:
      candidate: ${{ steps.publish.outputs.candidate }}
    steps:
      - name: Check out exact activation controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.ACTIVATION_SHA }}
          fetch-depth: 1
          clean: true
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Verify owner authorization, current main and hosted verification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          [[ "$ACTIVATION_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$TRIGGER_VERIFY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          test "$(git rev-parse HEAD)" = "$ACTIVATION_SHA"
          test "$(git log -1 --format=%s)" = 'D178: activate AlfaCRM controlled import'
          current_main="$(curl --fail-with-body --silent --show-error --max-time 30 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" | jq -er '.object.sha')"
          test "$current_main" = "$ACTIVATION_SHA"
          curl --fail-with-body --silent --show-error --max-time 30 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$TRIGGER_VERIFY_RUN_ID" \
            | jq -e --arg sha "$ACTIVATION_SHA" --argjson id "$TRIGGER_VERIFY_RUN_ID" '
                .id==$id and .name=="Verify ArtHello v52 release" and
                .path==".github/workflows/verify-arthello-v52.yml" and
                .head_sha==$sha and .head_branch=="main" and .run_attempt==1 and
                .event=="push" and .status=="completed" and .conclusion=="success" and
                .repository.full_name=="vitaliyozolin-dotcom/ArtHello-OS" and
                .head_repository.full_name=="vitaliyozolin-dotcom/ArtHello-OS" and
                .actor.login=="vitaliyozolin-dotcom" and
                .triggering_actor.login=="vitaliyozolin-dotcom"
              ' >/dev/null

      - name: Verify preview evidence, snapshot and activate controlled imports
        id: publish
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_LIVE_RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_LIVE_IMAGE_ID" =~ ^sha256:[a-f0-9]{64}$ ]]

          run_key="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          candidate="arthello-direct-$run_key"
          rollback_volume="arthello-rollback-$run_key"
          state_root="$HOME/.config/arthello/release-state"
          expected_live_receipt="$state_root/production-d177-$EXPECTED_LIVE_RELEASE_SHA.json"
          work="$state_root/d178-$run_key"
          runtime_env="$work/runtime.env"
          candidate_env="$work/candidate.env"
          route_before="$work/external-routes.before.caddy"
          route_after="$work/external-routes.after.caddy"
          route_stage="/data/.external-routes.d178-$run_key"
          route_backup="/data/external-routes.caddy.pre-d178-$run_key"
          evidence="$work/preview-evidence.json"
          receipt="$state_root/production-d178-$ACTIVATION_SHA.json"
          mkdir -p "$state_root"
          chmod 0700 "$state_root"
          test ! -e "$work" && test ! -e "$receipt"
          mkdir -p "$work"
          chmod 0700 "$work"

          test "$(docker inspect "$CADDY_CONTAINER" --format '{{.State.Running}}')" = true
          test "$(docker volume inspect "$DATA_VOLUME" --format '{{.Name}}')" = "$DATA_VOLUME"
          docker exec "$CADDY_CONTAINER" sh -ceu 'cat /data/external-routes.caddy' > "$route_before"
          chmod 0600 "$route_before"

          test -s "$expected_live_receipt"
          jq -e --arg release "$EXPECTED_LIVE_RELEASE_SHA" '
            .schemaVersion==1 and .state=="verified" and .decision=="D177" and
            .releaseSha==$release and (.sourceTree|test("^[a-f0-9]{40}$")) and
            (.imageId|test("^sha256:[a-f0-9]{64}$")) and
            (.candidateContainerId|test("^[a-f0-9]{64}$")) and
            (.activeRouteSha256|test("^[a-f0-9]{64}$")) and
            .moneyAcceptanceEnabled==false and .fiscalizationEnabled==false
          ' "$expected_live_receipt" >/dev/null
          expected_live_image_id="$(jq -er '.imageId' "$expected_live_receipt")"
          test "$expected_live_image_id" = "$EXPECTED_LIVE_IMAGE_ID"

          readarray -t route_identity < <(python3 -I - "$route_before" <<'PY'
          from pathlib import Path
          import re, sys
          body=Path(sys.argv[1]).read_text(encoding='utf-8')
          upstreams=set(re.findall(r'reverse_proxy\s+(arthello-direct-[1-9][0-9]*-[1-9][0-9]*):8081',body))
          if len(upstreams)!=1: raise SystemExit('expected one active ArtHello upstream')
          print(next(iter(upstreams)))
          PY
          )
          test "${#route_identity[@]}" -eq 1
          live_name="${route_identity[0]}"
          live_id="$(docker inspect "$live_name" --format '{{.Id}}')"
          image_id="$(docker inspect "$live_id" --format '{{.Image}}')"
          [[ "$live_id" =~ ^[a-f0-9]{64}$ ]]
          test "$(docker inspect "$live_id" --format '{{.State.Running}}')" = true
          test "$image_id" = "$expected_live_image_id"
          test "$(jq -er '.candidateContainerId' "$expected_live_receipt")" = "$live_id"
          test "$(jq -er '.activeRouteSha256' "$expected_live_receipt")" = "$(sha256sum "$route_before" | cut -d ' ' -f 1)"
          test "$(docker image inspect "$image_id" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$EXPECTED_LIVE_RELEASE_SHA"
          test "$(docker inspect "$live_id" --format '{{range .Mounts}}{{if eq .Destination "/data"}}{{.Name}}{{end}}{{end}}')" = "$DATA_VOLUME"
          test "$(docker inspect "$live_id" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -Ec '^ALFACRM_IMPORT_ENABLED=(1|true|yes)$')" -eq 0

          docker exec -i "$live_id" python3 -I -B - <<'PY' > "$evidence"
          import datetime, glob, json, sqlite3
          candidates=[]
          for path in glob.glob('/data/d1/**/*.sqlite',recursive=True):
              try:
                  db=sqlite3.connect(f'file:{path}?mode=ro',uri=True)
                  tables={row[0] for row in db.execute("select name from sqlite_master where type='table'")}
                  if {'system_runtime_state','integration_connections'} <= tables: candidates.append(db)
                  else: db.close()
              except sqlite3.Error: pass
          assert len(candidates)==1
          db=candidates[0]
          row=db.execute("select state_value from system_runtime_state where state_key='alfacrm_connector:v1'").fetchone()
          assert row is not None
          state=json.loads(row[0])
          connected=state.get('connected') is True
          credential_stored=db.execute("select 1 from system_runtime_state where state_key='integration_credential:v2:INT-T-ALFACRM:ARTHELLO:ALFACRM-V2'").fetchone() is not None
          mapping_count=sum(1 for value in state.get('branchMappings',{}).values() if value)
          families=state.get('modules',{}).get('families',{})
          staff=state.get('modules',{}).get('staff',{})
          assert connected and credential_stored and mapping_count >= 1
          assert families["status"] == "previewed" and families["previewCount"] > 0
          assert staff["status"] == "previewed" and staff["previewCount"] > 0
          assert families.get('previewToken') and families.get('previewSignature')
          assert staff.get('previewToken') and staff.get('previewSignature')
          last_checked_at=datetime.datetime.fromisoformat(state['lastCheckedAt'].replace('Z','+00:00'))
          d176=datetime.datetime.fromisoformat('2026-09-13T22:51:10+00:00')
          assert last_checked_at >= d176
          print(json.dumps({'mappingCount':mapping_count,'familiesPreview':families['previewCount'],'staffPreview':staff['previewCount'],'checkedAfterD176':True},separators=(',',':')))
          PY
          jq -e '.mappingCount>=1 and .familiesPreview>0 and .staffPreview>0 and .checkedAfterD176==true' "$evidence" >/dev/null
          printf 'ARTHELLO_D178_PREVIEW_EVIDENCE=VERIFIED mappings=%s families=%s staff=%s\n' \
            "$(jq -r .mappingCount "$evidence")" "$(jq -r .familiesPreview "$evidence")" "$(jq -r .staffPreview "$evidence")"

          network="$(docker inspect "$live_id" | jq -er '.[0].NetworkSettings.Networks | keys | select(length==1) | .[0]')"
          [[ "$network" =~ ^[A-Za-z0-9_.-]+$ ]]
          old_restart="$(docker inspect "$live_id" --format '{{.HostConfig.RestartPolicy.Name}}')"
          old_restart_max="$(docker inspect "$live_id" --format '{{.HostConfig.RestartPolicy.MaximumRetryCount}}')"
          case "$old_restart" in no|always|unless-stopped|on-failure) ;; *) exit 1 ;; esac
          [[ "$old_restart_max" =~ ^[0-9]+$ ]]
          docker inspect "$live_id" --format '{{range .Config.Env}}{{println .}}{{end}}' \
            | awk -F= '$1!="ALFACRM_IMPORT_ENABLED"' > "$runtime_env"
          chmod 0600 "$runtime_env"
          if grep -Eq '^(ARTHELLO_BOOTSTRAP_PASSWORD|INTEGRATION_CREDENTIALS_KEY|CENTRAL_ACCESS_SECRET|OPENAI_API_KEY)=' "$runtime_env"; then
            echo 'Plaintext secret environment is not permitted' >&2
            exit 1
          fi
          mount_args=()
          while IFS= read -r spec; do mount_args+=(--mount "$spec"); done < <(
            docker inspect "$live_id" | jq -er '.[0].Mounts[] |
              if .Type=="volume" then "type=volume,src="+.Name+",dst="+.Destination+(if .RW then "" else ",readonly" end)+",volume-nocopy"
              elif .Type=="bind" then "type=bind,src="+.Source+",dst="+.Destination+(if .RW then "" else ",readonly" end)
              else empty end'
          )
          test "${#mount_args[@]}" -ge 6

          candidate_started=0
          route_swapped=0
          success=0
          restore_restart() {
            local target="$1"
            if [ "$old_restart" = on-failure ] && [ "$old_restart_max" -gt 0 ]; then
              docker update --restart="on-failure:$old_restart_max" "$target" >/dev/null
            else
              docker update --restart="$old_restart" "$target" >/dev/null
            fi
          }
          rollback() {
            status=$?
            trap - EXIT INT TERM HUP
            if [ "$success" -ne 1 ]; then
              if [ "$route_swapped" -eq 1 ]; then
                docker exec --user 0:0 -e BACKUP="$route_backup" "$CADDY_CONTAINER" sh -ceu '
                  test -f "$BACKUP" && cp "$BACKUP" /data/external-routes.caddy
                ' || true
                docker exec "$CADDY_CONTAINER" caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile >/dev/null 2>&1 || true
                docker restart --time 20 "$CADDY_CONTAINER" >/dev/null 2>&1 || true
              fi
              if [ "$candidate_started" -eq 1 ]; then docker rm -f "$candidate" >/dev/null 2>&1 || true; fi
              docker start "$live_id" >/dev/null 2>&1 || true
              restore_restart "$live_id" || true
            fi
            rm -f "$runtime_env" "$candidate_env"
            exit "$status"
          }
          trap rollback EXIT INT TERM HUP

          docker update --restart=no "$live_id" >/dev/null
          docker stop --time 30 "$live_id" >/dev/null
          test "$(docker inspect "$live_id" --format '{{.State.Running}}')" = false

          docker volume create \
            --label arthello.scope=production-rollback \
            --label arthello.decision=D178 \
            --label "arthello.rollback.source-container=$live_id" \
            "$rollback_volume" >/dev/null
          docker run --rm --network none --user 0:0 --read-only --cap-drop ALL \
            --cap-add DAC_OVERRIDE --cap-add CHOWN --cap-add FOWNER --cap-add FSETID \
            --security-opt no-new-privileges:true --pids-limit 64 --memory 256m --cpus 0.5 \
            --mount "type=volume,src=$DATA_VOLUME,dst=/source,readonly,volume-nocopy" \
            --mount "type=volume,src=$rollback_volume,dst=/target,volume-nocopy" \
            --entrypoint /bin/sh "$image_id" -ceu 'cp -a /source/. /target/ && sync'
          test "$(docker run --rm --network none --user 0:0 --read-only --cap-drop ALL --cap-add DAC_OVERRIDE \
            --mount "type=volume,src=$rollback_volume,dst=/snapshot,readonly,volume-nocopy" \
            --entrypoint /bin/sh "$image_id" -ceu 'find /snapshot -type f | wc -l')" -gt 0
          printf 'ARTHELLO_D178_ROLLBACK_SNAPSHOT=VERIFIED volume=%s\n' "$rollback_volume"

          docker run -d --name "$candidate" --restart no --read-only \
            --tmpfs /tmp --tmpfs /app/node_modules/.mf:rw,uid=1000,gid=1000,mode=0700 \
            --network "$network" --env-file "$runtime_env" \
            -e ALFACRM_IMPORT_ENABLED=true \
            "${mount_args[@]}" \
            --label arthello.activation.decision=D178 \
            --label "arthello.activation.controller=$ACTIVATION_SHA" \
            --label "arthello.activation.run=$GITHUB_RUN_ID" \
            "$image_id" >/dev/null
          candidate_started=1
          ready=0
          for attempt in $(seq 1 90); do
            if docker exec "$candidate" node -e "fetch('http://127.0.0.1:8081/api/health',{signal:AbortSignal.timeout(5000)}).then(async r=>{const b=await r.json();if(!r.ok||b.status!=='ok'||b.database!=='available')process.exit(1)}).catch(()=>process.exit(1))"; then ready=1; break; fi
            sleep 2
          done
          test "$ready" -eq 1
          test "$(docker inspect "$candidate" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -Fxc 'ALFACRM_IMPORT_ENABLED=true')" -eq 1
          docker inspect "$candidate" --format '{{range .Config.Env}}{{println .}}{{end}}' \
            | awk -F= '$1!="ALFACRM_IMPORT_ENABLED"' | sort > "$candidate_env"
          cmp -s <(sort "$runtime_env") "$candidate_env"
          rm -f "$candidate_env"

          python3 -I - "$route_before" "$route_after" "$live_name" "$candidate" <<'PY'
          from pathlib import Path
          import re, sys
          source,target,old_upstream,new_upstream=sys.argv[1:]
          for value in (old_upstream,new_upstream):
              assert re.fullmatch(r'arthello-direct-[1-9][0-9]*-[1-9][0-9]*',value)
          body=Path(source).read_text(encoding='utf-8')
          assert body.count(old_upstream+':8081')>=2
          body=body.replace(old_upstream+':8081',new_upstream+':8081')
          assert old_upstream+':8081' not in body and body.count(new_upstream+':8081')>=2
          Path(target).write_text(body,encoding='utf-8')
          PY
          chmod 0600 "$route_after"
          route_owner="$(docker exec "$CADDY_CONTAINER" stat -c '%u:%g' /data/external-routes.caddy)"
          docker cp "$route_before" "$CADDY_CONTAINER:$route_backup"
          docker cp "$route_after" "$CADDY_CONTAINER:$route_stage"
          docker exec --user 0:0 -e OWNER="$route_owner" -e STAGE="$route_stage" "$CADDY_CONTAINER" sh -ceu '
            chown "$OWNER" "$STAGE" && chmod 0600 "$STAGE" && mv "$STAGE" /data/external-routes.caddy
          '
          route_swapped=1
          docker exec "$CADDY_CONTAINER" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile >/dev/null
          docker exec "$CADDY_CONTAINER" caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile >/dev/null
          docker restart --time 20 "$CADDY_CONTAINER" >/dev/null

          public_acceptance() {
            docker exec -i -e PUBLIC_URL="$PUBLIC_URL" -e SCHOOL_URL="$SCHOOL_URL" -e PAY_URL="$PAY_URL" "$candidate" node - <<'NODE'
          const get=async url=>{const response=await fetch(url,{signal:AbortSignal.timeout(10000),headers:{'cache-control':'no-cache'}});return {response,body:await response.text()}};
          const health=await get(process.env.PUBLIC_URL+'/api/health');
          const root=await get(process.env.PUBLIC_URL+'/?release=d178');
          const school=await get(process.env.SCHOOL_URL+'/api/health');
          const pay=await get(process.env.PAY_URL+'/?release=d178');
          let healthBody={},schoolBody={};
          try{healthBody=JSON.parse(health.body)}catch{}
          try{schoolBody=JSON.parse(school.body)}catch{}
          if(health.response.status!==200||healthBody.status!=='ok'||root.response.status!==200||school.response.status!==200||schoolBody.status!=='ok'||pay.response.status!==200)process.exit(1);
          NODE
          }
          public_ready=0
          for attempt in $(seq 1 30); do
            if [ "$(docker inspect "$CADDY_CONTAINER" --format '{{.State.Running}}')" = true ] && public_acceptance; then public_ready=1; break; fi
            sleep 2
          done
          test "$public_ready" -eq 1
          restore_restart "$candidate"
          restart_count="$(docker inspect "$candidate" --format '{{.RestartCount}}')"
          for observation in $(seq 1 13); do
            sleep 5
            docker exec "$candidate" node -e "fetch('http://127.0.0.1:8081/api/health',{signal:AbortSignal.timeout(5000)}).then(async r=>{const b=await r.json();if(!r.ok||b.status!=='ok'||b.database!=='available')process.exit(1)}).catch(()=>process.exit(1))"
            test "$(docker inspect "$candidate" --format '{{.RestartCount}}')" = "$restart_count"
            test "$(docker inspect "$CADDY_CONTAINER" --format '{{.State.Running}}')" = true
          done
          public_acceptance
          printf 'ARTHELLO_D178_EDGE_STABILITY=VERIFIED seconds=65\n'

          jq -n --arg controller "$ACTIVATION_SHA" --arg runtime "$EXPECTED_LIVE_RELEASE_SHA" \
            --arg image "$image_id" --arg candidate "$(docker inspect "$candidate" --format '{{.Id}}')" \
            --arg previous "$live_id" --arg rollback "$rollback_volume" --argjson evidence "$(cat "$evidence")" '
              {schemaVersion:1,state:"verified",decision:"D178",controllerSha:$controller,runtimeReleaseSha:$runtime,
               imageId:$image,candidateContainerId:$candidate,previousContainerId:$previous,rollbackVolume:$rollback,
               alfaCrmImportEnabled:true,previewEvidence:$evidence,reverseWriteEnabled:false}
            ' > "$receipt"
          chmod 0600 "$receipt"
          success=1
          rm -f "$runtime_env" "$candidate_env"
          trap - EXIT INT TERM HUP
          printf 'candidate=%s\n' "$candidate" >> "$GITHUB_OUTPUT"
          printf 'ARTHELLO_D178_PRODUCTION=VERIFIED controller=%s runtime=%s candidate=%s\n' "$ACTIVATION_SHA" "$EXPECTED_LIVE_RELEASE_SHA" "$candidate"

      - name: Publish activation summary
        if: success()
        shell: bash
        run: |
          {
            echo '## ArtHello AlfaCRM controlled import D178'
            echo
            echo '- Owner authorization and fresh connected preview evidence were verified before production stopped.'
            echo '- The D177 image and data mounts were retained; only ALFACRM_IMPORT_ENABLED=true was activated.'
            echo '- Reverse writes to AlfaCRM remain absent; module dependencies and 30-minute preview tokens remain enforced.'
            echo '- A stopped pre-activation container and a current data-volume snapshot remain available for recovery.'
          } >> "$GITHUB_STEP_SUMMARY"

  verify-external:
    needs: activate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify ArtHello, School and Pay from an independent network
        shell: bash
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 12); do
            arthello="$(curl --silent --show-error --output /dev/null --max-time 15 --write-out '%{http_code}' "$PUBLIC_URL/api/health" || true)"
            school="$(curl --silent --show-error --output /dev/null --max-time 15 --write-out '%{http_code}' "$SCHOOL_URL/api/health" || true)"
            pay="$(curl --silent --show-error --output /dev/null --max-time 15 --write-out '%{http_code}' "$PAY_URL/?release=d178-external-$GITHUB_RUN_ID" || true)"
            if [ "$arthello" = 200 ] && [ "$school" = 200 ] && [ "$pay" = 200 ]; then
              printf 'ARTHELLO_D178_EXTERNAL=VERIFIED arthello=200 school=200 pay=200\n'
              exit 0
            fi
            sleep 5
          done
          exit 1
