kind = "web"
previewPath = "/"
title = "AlphaCRM Sync Sandbox"
version = "1.0.0"
id = "artifacts/alpha-crm-sync"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21987

[services.development]
run = "pnpm --filter @workspace/alpha-crm-sync run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/alpha-crm-sync", "run", "build" ]
publicDir = "artifacts/alpha-crm-sync/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21987"
BASE_PATH = "/"
