openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: AlphaCRM Sync Sandbox API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: sync
  - name: branches
  - name: marketing
  - name: integrations
  - name: webhooks
  - name: identity
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /branches:
    get:
      operationId: getBranches
      tags: [branches]
      summary: List all synced branches
      responses:
        "200":
          description: All branches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Branch"

  /branches/set-atlas:
    post:
      operationId: setAtlasBranch
      tags: [branches]
      summary: Manually set the Atlas branch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetAtlasBranchInput"
      responses:
        "200":
          description: Atlas branch saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"

  /sync/google-leads:
    post:
      operationId: syncGoogleLeads
      tags: [sync]
      summary: Sync leads from Google Sheets into lead_events + marketing_leads
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleLeadsSyncInput"
      responses:
        "200":
          description: Sync stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleLeadsSyncResult"

  /marketing/stats:
    get:
      operationId: getMarketingStats
      tags: [marketing]
      summary: Lead/marketing summary stats
      responses:
        "200":
          description: Marketing statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketingStats"

  /marketing/leads:
    get:
      operationId: getMarketingLeads
      tags: [marketing]
      summary: List marketing leads from Google Sheets
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: List of marketing leads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketingLead"

  /marketing/lead-events:
    get:
      operationId: getLeadEvents
      tags: [marketing]
      summary: List all lead events (all channels)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: List of lead events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeadEvent"

  /marketing/sources:
    get:
      operationId: getMarketingSources
      tags: [marketing]
      summary: List source normalisation mappings
      responses:
        "200":
          description: List of source mappings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketingSource"

  /marketing/sources/normalize:
    post:
      operationId: normalizeMarketingSource
      tags: [marketing]
      summary: Create or update a source normalisation mapping
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NormalizeSourceInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"

  /finance/stats:
    get:
      operationId: getFinanceStats
      tags: [finance]
      summary: Finance dashboard header stats
      responses:
        "200":
          description: Finance summary stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceStats"

  /finance/bank/transactions:
    get:
      operationId: getBankTransactions
      tags: [finance]
      summary: List bank transactions with filters
      parameters:
        - name: branch
          in: query
          schema:
            type: string
        - name: direction
          in: query
          schema:
            type: string
            enum: [income, expense]
        - name: unclear
          in: query
          schema:
            type: string
        - name: dateFrom
          in: query
          schema:
            type: string
        - name: dateTo
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Paginated bank transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankTransactionsPage"

  /finance/bank/unclear:
    get:
      operationId: getUnclearTransactions
      tags: [finance]
      summary: List unclear (uncategorised) transactions
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Unclear transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankTransactionsPage"

  /finance/bank/transactions/{id}:
    patch:
      operationId: categorizeBankTransaction
      tags: [finance]
      summary: Manually categorise a bank transaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategorizeTransactionInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"

  /finance/bank/rules:
    get:
      operationId: getFinanceCategorizationRules
      tags: [finance]
      summary: List categorisation rules
      responses:
        "200":
          description: All rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategorizationRule"
    post:
      operationId: createCategorizationRule
      tags: [finance]
      summary: Create a new categorisation rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRuleInput"
      responses:
        "200":
          description: Created rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategorizationRule"

  /finance/bank/autocategorize:
    post:
      operationId: autoCategorize
      tags: [finance]
      summary: Re-run auto-categorisation on all unclear transactions
      responses:
        "200":
          description: Categorisation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoCategorizeResult"

  /finance/dds:
    get:
      operationId: getDdsReport
      tags: [finance]
      summary: DDS (cash flow) monthly aggregation from bank transactions
      parameters:
        - name: branch
          in: query
          schema:
            type: string
        - name: year
          in: query
          schema:
            type: string
      responses:
        "200":
          description: DDS report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DdsReport"

  /finance/opiu:
    get:
      operationId: getOpiuReport
      tags: [finance]
      summary: P&L (ОПиУ) monthly data
      parameters:
        - name: branch
          in: query
          schema:
            type: string
        - name: year
          in: query
          schema:
            type: string
      responses:
        "200":
          description: P&L report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpiuReport"

  /finance/categories/dds:
    get:
      operationId: getDdsCategories
      tags: [finance]
      summary: List DDS categories
      responses:
        "200":
          description: DDS categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DdsCategory"

  /finance/categories/opiu:
    get:
      operationId: getOpiuCategories
      tags: [finance]
      summary: List OPIU categories
      responses:
        "200":
          description: OPIU categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpiuCategory"

  /integrations/connectors:
    get:
      operationId: getConnectors
      tags: [integrations]
      summary: List all source connectors
      responses:
        "200":
          description: All connectors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SourceConnector"

  /integrations/connectors/{id}:
    patch:
      operationId: updateConnector
      tags: [integrations]
      summary: Update connector config or status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                config:
                  type: object
                  additionalProperties: true
                status:
                  type: string
      responses:
        "200":
          description: Updated connector
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceConnector"

  /integrations/stats:
    get:
      operationId: getIntegrationStats
      tags: [integrations]
      summary: Integration layer statistics
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationStats"

  /integrations/google-sheets/status:
    get:
      operationId: getGoogleSheetsStatus
      tags: [integrations]
      summary: Check Google Sheets connector status
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleSheetsStatus"

  /integrations/google-sheets/sheets:
    get:
      operationId: listGoogleSheets
      tags: [integrations]
      summary: List sheets in the configured spreadsheet
      responses:
        "200":
          description: Sheet list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GoogleSheetsSheetItem"

  /integrations/google-sheets/preview:
    get:
      operationId: previewGoogleSheet
      tags: [integrations]
      summary: Preview first 20 rows of a sheet
      parameters:
        - name: sheetName
          in: query
          required: true
          schema:
            type: string
        - name: headerRow
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleSheetsPreview"

  /integrations/google-sheets/import:
    post:
      operationId: importGoogleSheet
      tags: [integrations]
      summary: Import rows from a Google Sheet into raw_events + lead_events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sheetName:
                  type: string
                headerRow:
                  type: integer
                mapping:
                  type: object
                  additionalProperties: true
                branchCrmId:
                  type: string
                branchName:
                  type: string
              required: [sheetName, mapping]
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleSheetsImportResult"

  /webhooks/website-lead:
    post:
      operationId: submitWebsiteLead
      tags: [webhooks]
      summary: Receive a website form lead
      security: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
        - name: X-ArtHello-Signature
          in: header
          required: true
          schema: { type: string }
        - name: X-ArtHello-Key-Id
          in: header
          required: true
          schema: { type: string }
        - name: X-ArtHello-Timestamp
          in: header
          required: true
          schema: { type: string }
        - name: X-ArtHello-Event-Id
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebsiteLeadInput"
      responses:
        "200":
          description: Lead saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsiteLeadResult"
        "401":
          description: Webhook authentication failed
        "409":
          description: Event identity or idempotency conflict
        "503":
          description: Webhook authentication or replay store unavailable

  /identity/run-matching:
    post:
      operationId: runIdentityMatching
      tags: [identity]
      summary: Run identity matching engine on all unprocessed events
      responses:
        "200":
          description: Matching result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityMatchingResult"

  /identity/stats:
    get:
      operationId: getIdentityStats
      tags: [identity]
      summary: Identity Resolution Center statistics
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityStats"

  /identity/persons:
    get:
      operationId: getPersons
      tags: [identity]
      summary: List persons
      parameters:
        - name: limit
          in: query
          schema:
            type: string
        - name: offset
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Persons page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonsPage"

  /identity/persons/{id}:
    get:
      operationId: getPerson
      tags: [identity]
      summary: Get person with all links and contacts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Person detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonDetail"

  /identity/queue:
    get:
      operationId: getIdentityQueue
      tags: [identity]
      summary: List identity match queue items
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: string
        - name: offset
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Queue items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityQueuePage"

  /identity/queue/{id}:
    patch:
      operationId: resolveQueueItem
      tags: [identity]
      summary: Approve, reject or force-create person for a queue item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [approve, reject, new_person]
              required: [action]
      responses:
        "200":
          description: Resolved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required: [success]

  /identity/unmatched-leads:
    get:
      operationId: getUnmatchedLeads
      tags: [identity]
      summary: Lead events not yet linked to any person
      parameters:
        - name: limit
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Unmatched leads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeadEvent"

  /identity/orphan-students:
    get:
      operationId: getOrphanStudents
      tags: [identity]
      summary: CRM students not yet linked to any person
      parameters:
        - name: limit
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Orphan students
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CrmStudent"

  /identity/duplicates:
    get:
      operationId: getIdentityDuplicates
      tags: [identity]
      summary: Persons sharing a phone or email — split into real duplicates vs family-shared
      responses:
        "200":
          description: Duplicate groups split by type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityDuplicatesResponse"

  /identity/families:
    get:
      operationId: getIdentityFamilies
      tags: [identity]
      summary: List all families (students grouped by guardian phone)
      parameters:
        - name: limit
          in: query
          schema:
            type: string
        - name: offset
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Family list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyListResponse"

  /identity/families/{id}:
    get:
      operationId: getIdentityFamily
      tags: [identity]
      summary: Full family card — guardian, children, payments
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Family detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyDetail"

  /identity/build-families:
    post:
      operationId: buildFamilies
      tags: [identity]
      summary: Group students into families by guardian phone (idempotent)
      responses:
        "200":
          description: Build result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildFamiliesResult"

  /identity/quality-check:
    get:
      operationId: getIdentityQualityCheck
      tags: [identity]
      summary: Identity data quality report — 8 checks
      parameters:
        - name: section
          in: query
          schema:
            type: string
        - name: format
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Quality check result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityQualityReport"

  /identity/build-timeline:
    post:
      operationId: buildTimeline
      tags: [identity]
      summary: Populate timeline_events from all CRM data (idempotent)
      responses:
        "200":
          description: Events created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildTimelineResult"

  /identity/calc-health:
    post:
      operationId: calcHealth
      tags: [identity]
      summary: Calculate health scores and alerts for all families
      responses:
        "200":
          description: Health calculated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalcHealthResult"

  /identity/at-risk:
    get:
      operationId: getFamiliesAtRisk
      tags: [identity]
      summary: Families sorted by health score (worst first)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: At-risk families
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamiliesAtRiskResponse"

  /identity/families/{id}/timeline:
    get:
      operationId: getFamilyTimeline
      tags: [identity]
      summary: Timeline events for a single family
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: event_type
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Family timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyTimelineResponse"

  /identity/families/{id}/health:
    get:
      operationId: getFamilyHealth
      tags: [identity]
      summary: Health score and alerts for a single family
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Family health detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyHealthDetail"
        "404":
          description: Not found

  /identity/families/{id}/stats:
    get:
      operationId: getFamilyStats
      tags: [identity]
      summary: Financial and behavioral stats for a single family
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Family stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyStats"
        "404":
          description: Not found

  /identity/timeline-stats:
    get:
      operationId: getTimelineStats
      tags: [identity]
      summary: Aggregated timeline and health distribution stats
      responses:
        "200":
          description: Timeline stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineStats"

  /identity/student-raw-preview:
    get:
      operationId: getStudentRawPreview
      tags: [identity]
      summary: Student records with raw AlphaCRM fields for diagnostic
      parameters:
        - name: limit
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Student raw preview rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudentRawPreviewRow"

  /banking/connectors:
    get:
      operationId: getBankConnectors
      tags: [banking]
      summary: List all bank connectors with status and balance summary
      responses:
        "200":
          description: Connector list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BankConnectorRow"
    post:
      operationId: createBankConnector
      tags: [banking]
      summary: Create a bank connector
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBankConnectorInput"
      responses:
        "201":
          description: Created connector
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankConnectorRow"

  /banking/connectors/{id}:
    patch:
      operationId: updateBankConnector
      tags: [banking]
      summary: Update connector config or status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBankConnectorInput"
      responses:
        "200":
          description: Updated connector
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankConnectorRow"
    delete:
      operationId: deleteBankConnector
      tags: [banking]
      summary: Delete a connector
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean

  /banking/connectors/{id}/health:
    get:
      operationId: getBankConnectorHealth
      tags: [banking]
      summary: Detailed health check — auth, scopes, accounts access, diagnostics
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Health detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorHealthDetail"

  /banking/connectors/{id}/customers:
    get:
      operationId: getTochkaCustomers
      tags: [banking]
      summary: "Tochka: fetch customer list from /customers endpoint using hybrid token"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of customers (companies) available to this OAuth token
          content:
            application/json:
              schema:
                type: object
                properties:
                  customers:
                    type: array
                    items:
                      $ref: "#/components/schemas/TochkaCustomer"
                  resolvedCustomerCode:
                    type: ["string", "null"]
                required: [customers]

  /banking/connectors/{id}/resolve-customer:
    post:
      operationId: resolveTochkaCustomer
      tags: [banking]
      summary: "Tochka: save selected customerCode to connector config"
      parameters:
