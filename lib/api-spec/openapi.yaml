      responses:
        "200":
          description: Evotor coverage audit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvotorCoverageAuditResponse"

components:
  schemas:

    ImportStatementInput:
      type: object
      properties:
        bankName: { type: string }
        fileName: { type: string }
        format: { type: string }
        rawText: { type: string }
        notes: { type: string }
      required: [rawText, bankName]
    ImportStatementResult:
      type: object
      properties:
        batchId: { type: string }
        inserted: { type: integer }
        duplicates: { type: integer }
        errors: { type: integer }
    ImportBatch:
      type: object
      properties:
        id: { type: string }
        bankName: { type: string }
        fileName: { type: string }
        format: { type: string }
        dateFrom: { type: string, nullable: true }
        dateTo: { type: string, nullable: true }
        transactionCount: { type: integer }
        importedAt: { type: string }
        notes: { type: string, nullable: true }
    BankTxWithMatch:
      type: object
      properties:
        id: { type: string }
        importBatchId: { type: string, nullable: true }
        bankName: { type: string, nullable: true }
        accountName: { type: string, nullable: true }
        accountNumber: { type: string, nullable: true }
        operationDate: { type: string, nullable: true }
        amount: { type: string, nullable: true }
        direction: { type: string, nullable: true }
        counterpartyName: { type: string, nullable: true }
        purpose: { type: string, nullable: true }
        matchStatus: { type: string }
        matchType: { type: string, nullable: true }
        matchConfidence: { type: integer, nullable: true }
        matchedOperationId: { type: string, nullable: true }
        matchedAt: { type: string, nullable: true }
        isIgnored: { type: boolean }
        createdAt: { type: string }
        matchedOperation:
          type: object
          nullable: true
          additionalProperties: true
    ReconciliationTransactionList:
      type: object
      properties:
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/BankTxWithMatch"
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
        pages: { type: integer }
    ReconciliationStats:
      type: object
      properties:
        total: { type: integer }
        matched: { type: integer }
        unmatched: { type: integer }
        ignored: { type: integer }
        matchedPct: { type: number }
        totalAmountIn: { type: number }
        totalAmountOut: { type: number }
        unmatchedAmountIn: { type: number }
        unmatchedAmountOut: { type: number }
    AutoMatchResult:
      type: object
      properties:
        matched: { type: integer }
        alreadyMatched: { type: integer }
        noMatch: { type: integer }
    CreateMatchInput:
      type: object
      properties:
        bankTxId: { type: string }
        operationId: { type: string }
      required: [bankTxId, operationId]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Branch:
      type: object
      properties:
        crmId:
          type: string
        name:
          type: ["string", "null"]
        raw:
          type: ["object", "null"]
          additionalProperties: true
        syncedAt:
          type: ["string", "null"]
      required: [crmId]

    SetAtlasBranchInput:
      type: object
      properties:
        branchCrmId:
          type: string
      required: [branchCrmId]

    NormalizeStudentsFromRawResponse:
      type: object
      properties:
        success:     { type: boolean }
        message:     { type: string }
        rawFound:    { type: integer }
        created:     { type: integer }
        updated:     { type: integer }
        skipped:     { type: integer }
        failed:      { type: integer }
        withoutFamily: { type: integer }
        lifecycleSummary:
          type: object
          properties:
            active:   { type: integer }
            inactive: { type: integer }
