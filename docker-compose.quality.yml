services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: arthello_test
      POSTGRES_USER: arthello_test
      POSTGRES_PASSWORD: sandbox-only-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arthello_test -d arthello_test"]
      interval: 5s
      timeout: 5s
      retries: 12
    tmpfs:
      - /var/lib/postgresql/data

  quality:
    build:
      context: .
      dockerfile: Dockerfile.quality
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CI: "1"
      NODE_ENV: test
      DATABASE_URL: postgresql://arthello_test:sandbox-only-password@postgres:5432/arthello_test
      TEST_DATABASE_URL: postgresql://arthello_test:sandbox-only-password@postgres:5432/arthello_test
    command: ["run", "test:full"]
