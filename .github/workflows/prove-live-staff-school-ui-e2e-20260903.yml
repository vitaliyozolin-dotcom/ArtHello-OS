name: Prove live staff School UI end to end

on:
  push:
    branches:
      - codex/verify-fix-staff-school-sso-20260903
    paths:
      - .github/workflows/prove-live-staff-school-ui-e2e-20260903.yml

permissions:
  contents: read

concurrency:
  group: prove-live-staff-school-ui-e2e-20260903
  cancel-in-progress: false

jobs:
  prove:
    if: >-
      github.repository == 'vitaliyozolin-dotcom/ArtHello-OS' &&
      github.actor == 'vitaliyozolin-dotcom' &&
      github.triggering_actor == 'vitaliyozolin-dotcom'
    runs-on: [self-hosted, linux, x64, arthello-gateway]
    timeout-minutes: 20

    steps:
      - name: Prove snapshot and rendered page for every active staff account
        shell: bash
        run: |
          set -Eeuo pipefail
          exec 9>/var/lock/arthello-staff-school-ui-live-e2e.lock
          flock -n 9

          live="$(docker ps --filter 'name=^/arthello-direct-' --format '{{.Names}}' | head -n1)"
          test -n "$live"
          test "$(docker inspect "$live" --format '{{.State.Running}}')" = true
          image="$(docker inspect "$live" --format '{{.Config.Image}}')"
          revision="$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' 2>/dev/null || true)"
          printf 'LIVE_UI_E2E_ARTHELLO_REVISION=%s\n' "${revision:-unknown}"

          docker exec -i \
            -e ARTHELLO_ORIGIN='https://arthello-188-225-38-55.sslip.io' \
            -e SCHOOL_ORIGIN='https://school-188-225-38-55.sslip.io' \
            "$live" node --input-type=module - <<'NODE'
          import { createHash, randomBytes } from 'node:crypto';
          import { readdirSync, statSync } from 'node:fs';
          import { join } from 'node:path';
          import { DatabaseSync } from 'node:sqlite';

          const arthelloOrigin=process.env.ARTHELLO_ORIGIN;
          const schoolOrigin=process.env.SCHOOL_ORIGIN;
          const files=[];
          function walk(path,depth=0){
            if(depth>8)return;
            let entries=[];
            try{entries=readdirSync(path,{withFileTypes:true});}catch{return;}
            for(const entry of entries){
              const next=join(path,entry.name);
              if(entry.isDirectory())walk(next,depth+1);
              else if(entry.isFile()&&/\.sqlite(?:3)?$/i.test(entry.name)){
                try{if(statSync(next).size>8192)files.push(next);}catch{}
              }
            }
          }
          walk('/data/d1');
          let databasePath='';
          for(const file of files){
            let candidate;
            try{
              candidate=new DatabaseSync(file,{readOnly:true});
              const tables=new Set(candidate.prepare("SELECT name FROM sqlite_master WHERE type='table'").all().map((row)=>String(row.name)));
              candidate.close();
              if(tables.has('app_users')&&tables.has('user_system_access')&&tables.has('production_auth_sessions')&&tables.has('production_auth_credentials')){
                databasePath=file;
                break;
              }
            }catch{try{candidate?.close();}catch{}}
          }
          if(!databasePath)throw new Error('ArtHello D1 not found');

          const db=new DatabaseSync(databasePath);
          const accounts=db.prepare(`SELECT u.id AS appUserId,u.display_name AS displayName,
            school.role AS schoolGrantRole,c.user_id AS authUserId,
            central.access_version AS accessVersion
            FROM app_users u
            JOIN user_system_access central ON central.user_id=u.id AND central.system_id='SYS-ARTHELLO-OS'
            JOIN user_system_access school ON school.user_id=u.id AND school.system_id='SYS-SCHOOL-1-11'
            JOIN production_auth_credentials c ON c.user_id=CASE WHEN u.id='USR-OWNER' THEN 'AUTH-OWNER' ELSE u.id END
            WHERE u.status='Активен' AND central.status='Активен' AND school.status='Активен'
              AND u.access_version=central.access_version AND u.access_version=school.access_version
              AND COALESCE(c.must_change_password,0)=0
            ORDER BY u.display_name,u.id`).all();
          if(accounts.length<1){db.close();throw new Error('No eligible staff accounts');}
          const insert=db.prepare(`INSERT INTO production_auth_sessions
            (token_hash,user_id,csrf_token,expires_at,access_version,created_at)
            VALUES (?,?,?,?,?,?)`);
          const now=Math.floor(Date.now()/1000);
          const sessions=[];
          for(const account of accounts){
            const token=randomBytes(32).toString('base64url');
            const tokenHash=createHash('sha256').update(token).digest('base64url');
            insert.run(tokenHash,account.authUserId,randomBytes(24).toString('base64url'),now+900,account.accessVersion,now);
            sessions.push({...account,token,tokenHash});
          }
          db.close();

          const codeHashes=[];
          const results=[];
          const redirects=new Set([302,303,307,308]);
          function getSetCookies(response){
            if(typeof response.headers.getSetCookie==='function')return response.headers.getSetCookie();
            const value=response.headers.get('set-cookie');
            return value?[value]:[];
          }
          function mergeCookies(jar,items){
            for(const raw of items){
              const pair=raw.split(';',1)[0];
              const split=pair.indexOf('=');
              if(split<=0)continue;
              const name=pair.slice(0,split);
              const value=pair.slice(split+1);
              if(value&&!/Max-Age=0/i.test(raw))jar.set(name,value);
              else jar.delete(name);
            }
          }
          function cookieHeader(jar){return [...jar].map(([name,value])=>`${name}=${value}`).join('; ');}
          function safeText(value){return String(value??'').replace(/\s+/g,' ').trim().slice(0,220);}
          function safePath(value,base){try{const url=new URL(value,base);return `${url.origin}${url.pathname}`;}catch{return safeText(value);}}

          try{
            for(const account of sessions){
              const stages={};
              const schoolCookies=new Map();
              let logoutStatus=null;
              try{
                const start=await fetch(`${schoolOrigin}/auth/central/start?returnTo=/`,{redirect:'manual',headers:{'cache-control':'no-store'}});
                stages.start=start.status;
                mergeCookies(schoolCookies,getSetCookies(start));
                if(!redirects.has(start.status))throw new Error(`start_http_${start.status}`);
                const authorizeUrl=new URL(start.headers.get('location')||'',schoolOrigin);
                if(authorizeUrl.origin!==arthelloOrigin||authorizeUrl.pathname!=='/api/school-sso/authorize')throw new Error(`start_location_${safePath(authorizeUrl,schoolOrigin)}`);
                if(!schoolCookies.has('school_sso_tx'))throw new Error('transaction_cookie_missing');

                const authorize=await fetch(authorizeUrl,{redirect:'manual',headers:{cookie:`__Host-arthello_session=${account.token}`,'cache-control':'no-store'}});
                stages.authorize=authorize.status;
                if(!redirects.has(authorize.status))throw new Error(`authorize_http_${authorize.status}`);
                const callbackUrl=new URL(authorize.headers.get('location')||'',arthelloOrigin);
                if(callbackUrl.searchParams.get('authError')==='central_denied')throw new Error(`central_denied:${safeText(callbackUrl.searchParams.get('reason'))}`);
                if(callbackUrl.origin!==schoolOrigin||callbackUrl.pathname!=='/auth/central/callback')throw new Error(`callback_location_${safePath(callbackUrl,arthelloOrigin)}`);
                const code=callbackUrl.searchParams.get('code')||'';
                if(!code)throw new Error('authorization_code_missing');
                codeHashes.push(createHash('sha256').update(code).digest('base64url'));

                const callback=await fetch(callbackUrl,{redirect:'manual',headers:{cookie:cookieHeader(schoolCookies),'cache-control':'no-store'}});
                stages.callback=callback.status;
                mergeCookies(schoolCookies,getSetCookies(callback));
                if(!redirects.has(callback.status)){
                  const text=safeText(await callback.text());
                  throw new Error(`callback_http_${callback.status}:${text}`);
                }
                const finalLocation=new URL(callback.headers.get('location')||'/',schoolOrigin);
                if(finalLocation.origin!==schoolOrigin)throw new Error(`final_location_${safePath(finalLocation,schoolOrigin)}`);

                const snapshotResponse=await fetch(`${schoolOrigin}/api/school`,{redirect:'manual',headers:{cookie:cookieHeader(schoolCookies),'cache-control':'no-store','accept':'application/json'}});
                stages.snapshot=snapshotResponse.status;
                const snapshot=await snapshotResponse.json().catch(()=>({}));
                if(!snapshotResponse.ok)throw new Error(`snapshot_http_${snapshotResponse.status}:${safeText(snapshot.error||snapshot.message)}`);
                const viewer=snapshot.viewer&&typeof snapshot.viewer==='object'?snapshot.viewer:null;
                if(!viewer)throw new Error(`snapshot_viewer_missing:keys=${Object.keys(snapshot).slice(0,20).join(',')}`);
                const resolvedRole=String(viewer.role||'');
                const resolvedName=String(viewer.displayName||'');
                if(!resolvedRole)throw new Error(`snapshot_role_missing:viewerKeys=${Object.keys(viewer).join(',')}`);
                if(resolvedName&&resolvedName!==account.displayName)throw new Error(`snapshot_identity_mismatch:${safeText(resolvedName)}`);

                const page=await fetch(finalLocation,{redirect:'manual',headers:{cookie:cookieHeader(schoolCookies),'cache-control':'no-store','accept':'text/html'}});
                stages.page=page.status;
                const html=await page.text();
                const contentType=page.headers.get('content-type')||'';
                if(!page.ok)throw new Error(`page_http_${page.status}:${safeText(html)}`);
                if(!contentType.includes('text/html'))throw new Error(`page_content_type_${contentType}`);
                if(html.length<1000)throw new Error(`page_too_small_${html.length}`);
                const assets=[...new Set([...html.matchAll(/(?:src|href)=["'](\/[^"']+\.(?:js|css)(?:\?[^"']*)?)["']/g)].map((match)=>match[1]))];
                if(!assets.length)throw new Error('page_assets_missing');
                for(const asset of assets.slice(0,30)){
                  const response=await fetch(new URL(asset,schoolOrigin),{headers:{'cache-control':'no-store'}});
                  if(!response.ok)throw new Error(`asset_http_${response.status}:${asset.split('?')[0]}`);
                  await response.arrayBuffer();
                }

                const logout=await fetch(`${schoolOrigin}/api/auth/logout`,{redirect:'manual',headers:{cookie:cookieHeader(schoolCookies),'cache-control':'no-store'}});
                logoutStatus=logout.status;
                if(!redirects.has(logout.status)&&logout.status!==204)throw new Error(`logout_http_${logout.status}`);

                results.push({
                  appUserId:account.appUserId,
                  displayName:account.displayName,
                  schoolGrantRole:account.schoolGrantRole,
                  resolvedRole,
                  resolvedName:resolvedName||account.displayName,
                  snapshotKeys:Object.keys(snapshot).slice(0,24),
                  counts:{students:Array.isArray(snapshot.students)?snapshot.students.length:null,classes:Array.isArray(snapshot.classes)?snapshot.classes.length:null,lessons:Array.isArray(snapshot.lessons)?snapshot.lessons.length:null},
                  page:{status:page.status,contentType,bytes:html.length,assets:assets.length},
                  logoutStatus,
                  stages,
                  status:'PASS',
                });
              }catch(error){
                if(schoolCookies.size&&logoutStatus===null){
                  try{const logout=await fetch(`${schoolOrigin}/api/auth/logout`,{redirect:'manual',headers:{cookie:cookieHeader(schoolCookies),'cache-control':'no-store'}});logoutStatus=logout.status;}catch{}
                }
                results.push({appUserId:account.appUserId,displayName:account.displayName,schoolGrantRole:account.schoolGrantRole,stages,logoutStatus,status:'FAIL',reason:error instanceof Error?error.message.slice(0,320):'unknown'});
              }
            }
          }finally{
            const cleanupDb=new DatabaseSync(databasePath);
            const removeSession=cleanupDb.prepare('DELETE FROM production_auth_sessions WHERE token_hash=?');
            for(const session of sessions)removeSession.run(session.tokenHash);
            const tables=new Set(cleanupDb.prepare("SELECT name FROM sqlite_master WHERE type='table'").all().map((row)=>String(row.name)));
            if(tables.has('school_sso_codes')){
              const removeCode=cleanupDb.prepare('DELETE FROM school_sso_codes WHERE code_hash=?');
              for(const hash of codeHashes)removeCode.run(hash);
            }
            cleanupDb.close();
            console.log('LIVE_STAFF_UI_EPHEMERAL_ARTHELLO_DATA_CLEANED=PASS');
          }

          console.log('LIVE_STAFF_UI_RESULTS_BEGIN');
          console.log(JSON.stringify(results,null,2));
          console.log('LIVE_STAFF_UI_RESULTS_END');
          const failed=results.filter((item)=>item.status!=='PASS');
          console.log(`LIVE_STAFF_UI_TOTAL=${results.length}`);
          console.log(`LIVE_STAFF_UI_PASS=${results.length-failed.length}`);
          console.log(`LIVE_STAFF_UI_FAIL=${failed.length}`);
          if(failed.length)process.exit(2);
          NODE

          printf 'LIVE_STAFF_SCHOOL_UI_E2E=PASS\n'
