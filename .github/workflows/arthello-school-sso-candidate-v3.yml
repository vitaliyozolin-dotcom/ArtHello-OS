name: ArtHello School SSO candidate v3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/arthello-school-sso-candidate-v3.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: arthello-school-sso-candidate-v3
  cancel-in-progress: false

env:
  CANDIDATE_SHA: 91cdc00b3b9ebbee3c1bec68ca8c126b19ebd6f0
  APP_IMAGE: arthello-school-sso-v3-app:91cdc00b3b9e
  RUNTIME_IMAGE: arthello-school-sso-v3-runtime:91cdc00b3b9e
  TEST_ORIGIN: http://127.0.0.1:3451

jobs:
  candidate:
    runs-on: [self-hosted, linux, x64, arthello-gateway]
    timeout-minutes: 60
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
          path: candidate

      - name: Record immutable production baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t live < <(docker ps --filter 'name=^/arthello-direct-' --format '{{.Names}}')
          test "${#live[@]}" -eq 1
          live_name="${live[0]}"
          test "$(docker inspect "$live_name" --format '{{.State.Running}}')" = true
          printf 'live_name=%s\n' "$live_name" >> "$GITHUB_ENV"
          printf 'live_id=%s\n' "$(docker inspect "$live_name" --format '{{.Id}}')" >> "$GITHUB_ENV"
          printf 'live_image=%s\n' "$(docker inspect "$live_name" --format '{{.Image}}')" >> "$GITHUB_ENV"
          printf 'live_started=%s\n' "$(docker inspect "$live_name" --format '{{.State.StartedAt}}')" >> "$GITHUB_ENV"
          printf 'live_health=%s\n' "$(docker inspect "$live_name" --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}')" >> "$GITHUB_ENV"
          printf 'ARTHELLO_SSO_V3_PRODUCTION_BASELINE=RECORDED\n'

      - name: Build exact application and run complete tests
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          docker build --file candidate/deploy/v52/Dockerfile --target application --tag "$APP_IMAGE" candidate
          docker run --rm --network none --entrypoint npm "$APP_IMAGE" test
          docker run --rm --network none --entrypoint node "$APP_IMAGE" --test /app/tests/school-sso-contract.test.mjs
          docker run --rm --entrypoint sh "$APP_IMAGE" -euc '
            grep -F "Открыть дневник" /app/app/components/EducationWorkspace.tsx >/dev/null
            grep -F "SCHOOL_DIARY_SSO_URL" /app/app/components/EducationWorkspace.tsx >/dev/null
            grep -F "Завершить входы" /app/app/components/SettingsWorkspace.tsx >/dev/null
            ! grep -F "Сбросить пароль" /app/app/components/SettingsWorkspace.tsx >/dev/null
            grep -F "Завершить входы" /app/tests/central-staff-access.test.mjs >/dev/null
            ! grep -F "assert.match(settingsSource, /Сбросить пароль/);" /app/tests/central-staff-access.test.mjs >/dev/null
            printf "ARTHELLO_SSO_V3_PASSWORDLESS_STAFF_LIFECYCLE=OK\n"
          '
          docker build --file candidate/deploy/v52/Dockerfile --tag "$RUNTIME_IMAGE" candidate
          printf 'ARTHELLO_SSO_V3_BUILD=OK\n'

      - name: Run isolated SSO authorization and replay test
        shell: bash
        run: |
          set -Eeuo pipefail
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container="arthello-school-sso-v3-${suffix}"
          volume="arthello_school_sso_v3_${suffix}_data"
          admin_password="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32) + "A1")')"
          work=""
          cleanup() {
            rc=$?
            set +e
            docker rm -f "$container" >/dev/null 2>&1
            docker volume rm "$volume" >/dev/null 2>&1
            case "$work" in
              "$RUNNER_TEMP"/arthello-school-sso-v3-*) rm -rf -- "$work" ;;
            esac
            exit "$rc"
          }
          trap cleanup EXIT
          test -z "$(docker ps -q --filter publish=3451)"
          docker volume create "$volume" >/dev/null
          docker run -d \
            --name "$container" \
            --network bridge \
            -p 127.0.0.1:3451:8081 \
            --security-opt no-new-privileges:true \
            -e NODE_ENV=production \
            -e PORT=8081 \
            -e ARTHELLO_D1_PATH=/data/d1 \
            -e ARTHELLO_BOOTSTRAP_ADMIN_LOGIN=sso-owner \
            -e ARTHELLO_BOOTSTRAP_ADMIN_PASSWORD="$admin_password" \
            -e ARTHELLO_BOOTSTRAP_ADMIN_NAME='SSO Owner' \
            -v "$volume:/data" \
            "$RUNTIME_IMAGE" >/dev/null
          ready=0
          for attempt in $(seq 1 90); do
            if curl -fsS --max-time 4 "$TEST_ORIGIN/api/health" | grep -F '"status":"ok"' >/dev/null; then ready=1; break; fi
            test "$(docker inspect "$container" --format '{{.State.Running}}' 2>/dev/null || true)" = true || break
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then docker logs "$container" --tail 180 >&2 || true; exit 1; fi
          work="$(mktemp -d "$RUNNER_TEMP/arthello-school-sso-v3-XXXXXX")"
          python3 - "$admin_password" > "$work/login.json" <<'PY'
          import json, sys
          print(json.dumps({'login': 'sso-owner', 'password': sys.argv[1]}))
          PY
          login_status="$(curl -sS --max-time 20 -D "$work/login.headers" -o "$work/login-result.json" -w '%{http_code}' -X POST "$TEST_ORIGIN/api/auth/login" -H "Origin: $TEST_ORIGIN" -H 'Content-Type: application/json' --data-binary @"$work/login.json")"
          test "$login_status" = 200
          session_cookie="$(tr -d '\r' < "$work/login.headers" | sed -n 's/^set-cookie: \(__Host-arthello_session=[^;]*\).*/\1/ip' | head -n1)"
          test -n "$session_cookie"
          verifier='bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb'
          challenge="$(python3 - "$verifier" <<'PY'
          import base64, hashlib, sys
          print(base64.urlsafe_b64encode(hashlib.sha256(sys.argv[1].encode()).digest()).decode().rstrip('='))
          PY
          )"
          state='aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
          authorize="$TEST_ORIGIN/api/school-sso/authorize?state=$state&code_challenge=$challenge&return_to=%2F"
          authorize_status="$(curl -sS --max-time 20 -D "$work/authorize.headers" -o /dev/null -w '%{http_code}' -H "Cookie: $session_cookie" "$authorize")"
          test "$authorize_status" = 303
          location="$(tr -d '\r' < "$work/authorize.headers" | sed -n 's/^location: //ip' | tail -n1)"
          code="$(python3 - "$location" "$state" <<'PY'
          import sys, urllib.parse
          url = urllib.parse.urlparse(sys.argv[1])
          assert url.scheme == 'https' and url.netloc == 'school-188-225-38-55.sslip.io'
          assert url.path == '/auth/central/callback'
          query = urllib.parse.parse_qs(url.query)
          assert query.get('state') == [sys.argv[2]]
          code = query.get('code', [''])[0]
          assert len(code) >= 40
          print(code)
          PY
          )"
          python3 - "$code" "$verifier" > "$work/exchange.json" <<'PY'
          import json, sys
          print(json.dumps({'code': sys.argv[1], 'codeVerifier': sys.argv[2]}))
          PY
          exchange_status="$(curl -sS --max-time 20 -o "$work/exchange-result.json" -w '%{http_code}' -X POST "$TEST_ORIGIN/api/school-sso/exchange" -H 'Content-Type: application/json' --data-binary @"$work/exchange.json")"
          test "$exchange_status" = 200
          python3 - "$work/exchange-result.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          assert data['ok'] is True
          assert data['identity']['role'] == 'director'
          assert data['identity']['displayName'] == 'SSO Owner'
          assert data['identity']['centralUserId']
          PY
          replay_status="$(curl -sS --max-time 20 -o "$work/replay.json" -w '%{http_code}' -X POST "$TEST_ORIGIN/api/school-sso/exchange" -H 'Content-Type: application/json' --data-binary @"$work/exchange.json")"
          test "$replay_status" = 401
          printf 'ARTHELLO_SSO_V3_RUNTIME=OK\n'
          printf 'ARTHELLO_SSO_V3_REPLAY=REJECTED\n'

      - name: Verify production remained unchanged
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${live_name:-}"
          test "$(docker inspect "$live_name" --format '{{.Id}}')" = "$live_id"
          test "$(docker inspect "$live_name" --format '{{.Image}}')" = "$live_image"
          test "$(docker inspect "$live_name" --format '{{.State.StartedAt}}')" = "$live_started"
          test "$(docker inspect "$live_name" --format '{{.State.Running}}')" = true
          test "$(docker inspect "$live_name" --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}')" = "$live_health"
          printf 'ARTHELLO_SSO_V3_PRODUCTION_UNCHANGED=YES\n'

      - name: Cleanup candidate images
        if: always()
        shell: bash
        run: |
          docker image rm "$RUNTIME_IMAGE" "$APP_IMAGE" >/dev/null 2>&1 || true

      - name: Report candidate status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: process.env.CANDIDATE_SHA,
              state: process.env.JOB_STATUS === 'success' ? 'success' : 'failure',
              context: 'arthello/school-sso-candidate-v3',
              description: 'ArtHello School SSO candidate v3 ' + process.env.JOB_STATUS,
              target_url: process.env.GITHUB_SERVER_URL + '/' + process.env.GITHUB_REPOSITORY + '/actions/runs/' + process.env.GITHUB_RUN_ID,
            });
