name: Build ArtHello v44 on the RU origin

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Verified ArtHello source commit
        required: true
        default: 49b1545aa0993d4f082ade227287305835034522

permissions:
  contents: read

concurrency:
  group: arthello-origin-build-ru
  cancel-in-progress: false

jobs:
  build-origin:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production-ru
    env:
      PUBLIC_URL: https://arthello-188-225-38-55.sslip.io
      DEPLOY_HOST: ${{ secrets.ARTHELLO_RU_DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.ARTHELLO_RU_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.ARTHELLO_RU_DEPLOY_PORT }}
    steps:
      - name: Validate source contract
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -Eeuo pipefail
          printf '%s' "$TARGET_SHA" | grep -Eq '^[0-9a-f]{40}$'

      - name: Configure the confirmed SSH host identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ARTHELLO_RU_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          install -m 0700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

          route_device="$(ip -4 route show default | awk '{print $5; exit}')"
          test -n "$route_device"
          sudo ip link set dev "$route_device" mtu 1200
          deploy_port="${DEPLOY_PORT:-2222}"
          scanned_hosts="$RUNNER_TEMP/arthello-known-hosts"
          : > "$scanned_hosts"
          chmod 0600 "$scanned_hosts"
          for attempt in 1 2 3 4 5; do
            printf 'ARTHELLO_SSH_HOST_PROBE_ATTEMPT=%s\n' "$attempt"
            timeout --signal=TERM --kill-after=5s 40s \
              ssh -p "$deploy_port" \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile="$scanned_hosts" \
              -o GlobalKnownHostsFile=/dev/null \
              -o PreferredAuthentications=none \
              -o PubkeyAuthentication=no \
              -o PasswordAuthentication=no \
              -o KbdInteractiveAuthentication=no \
              -o ConnectTimeout=30 \
              -o HostKeyAlgorithms=ssh-ed25519 \
              "$DEPLOY_USER@$DEPLOY_HOST" true </dev/null >/dev/null 2>&1 || true
            test -s "$scanned_hosts" && break
            sleep 5
          done
          test -s "$scanned_hosts"
          actual_fingerprint="$(ssh-keygen -lf "$scanned_hosts" -E sha256 | awk '{print $2; exit}')"
          printf 'ARTHELLO_SSH_HOST_FINGERPRINT=%s\n' "$actual_fingerprint"
          test "$actual_fingerprint" = 'SHA256:/kBNohTF+5g8U+jQt+PzOCoWZ9yCSFjBnEP3Oc3MwRI'
          mv "$scanned_hosts" ~/.ssh/known_hosts
      - name: Start an immutable build on the RU origin
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -Eeuo pipefail
          deploy_port="${DEPLOY_PORT:-2222}"
          route_device="$(ip -4 route show default | awk '{print $5; exit}')"
          test -n "$route_device"
          sudo ip link set dev "$route_device" mtu 1200
          ssh_args=(
            -p "$deploy_port"
            -i ~/.ssh/id_ed25519
            -o IdentitiesOnly=yes
            -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no
            -o KbdInteractiveAuthentication=no
            -o BatchMode=yes
            -o ConnectTimeout=20
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=20
            -o IPQoS=none
            -o Compression=no
            -o KexAlgorithms=curve25519-sha256
            -o HostKeyAlgorithms=ssh-ed25519
            -o PubkeyAcceptedAlgorithms=ssh-ed25519
            -o Ciphers=aes128-ctr
            -o MACs=hmac-sha2-256
          )
          job_dir="/srv/arthello/origin-build-jobs/$TARGET_SHA"
          build_payload="$(base64 -w0 <<'REMOTE'
          set -Eeuo pipefail

          root=/srv/arthello
          repository=vitaliyozolin-dotcom/ArtHello-OS
          target_sha="${TARGET_SHA:?TARGET_SHA is required}"
          job_dir="${JOB_DIR:?JOB_DIR is required}"
          token_file="$root/shared/github-release-token"
          build_root="$root/origin-builds/$target_sha"
          source_root="$build_root/source"
          archive="$build_root/source.tar.gz"
          curl_config="$job_dir/curl.config"
          status_file="$job_dir/status"

          install -d -m 0750 "$job_dir" "$build_root"
          finish() {
            rc=$?
            if [ "$rc" -eq 0 ]; then
              printf 'success:%s\n' "$target_sha" > "$status_file.tmp"
            else
              printf 'failed:%s\n' "$rc" > "$status_file.tmp"
            fi
            mv "$status_file.tmp" "$status_file"
            rm -f -- "$curl_config"
            trap - EXIT
            exit "$rc"
          }
          trap finish EXIT

          test -s "$token_file"
          chmod 0600 "$curl_config"
          {
            printf 'header = "Authorization: Bearer %s"\n' "$(cat "$token_file")"
            printf 'header = "X-GitHub-Api-Version: 2022-11-28"\n'
            printf 'proto = "=https"\n'
            printf 'tlsv1.2\n'
            printf 'silent\nshow-error\nfail\n'
          } > "$curl_config"
          curl --config "$curl_config" --location --retry 5 --retry-all-errors \
            --connect-timeout 25 --max-time 1800 \
            --output "$archive" \
            "https://api.github.com/repos/$repository/tarball/$target_sha"
          test -s "$archive"
          rm -rf -- "$source_root"
          install -d -m 0750 "$source_root"
          tar -xzf "$archive" --strip-components=1 -C "$source_root"
          test -f "$source_root/deploy/v44/Dockerfile"
          test -f "$source_root/deploy/v44/compose.ui.yml"
          source_digest="$(cat "$source_root"/deploy/v44/arthello-sites-v44-source.tar.gz.part-* | sha256sum | awk '{print $1}')"
          test "$source_digest" = 'c72c6c7ced52f0d533be16ff8a8aa2d11fad8d0743b6f1229bde7f034a057062'

          if docker image inspect "arthello-os-ui:$target_sha" >/dev/null 2>&1; then
            printf 'ARTHELLO_ORIGIN_IMAGE=CACHED\n'
          else
            cd "$source_root"
            docker build \
              --label "org.opencontainers.image.revision=$target_sha" \
              --tag "arthello-os-ui:$target_sha" \
              --file deploy/v44/Dockerfile .
          fi

          cd "$source_root"
          export ARTHELLO_UI_IMAGE="arthello-os-ui:$target_sha"
          docker compose -p arthello-os -f deploy/v44/compose.ui.yml config >/dev/null
          docker compose -p arthello-os -f deploy/v44/compose.ui.yml up -d --no-deps newui
          ready=0
          for attempt in $(seq 1 120); do
            if docker exec arthello-os-newui node -e \
              "fetch('http://127.0.0.1:8081/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" -eq 1
          test "$(docker inspect --format '{{index .Config.Labels \"org.opencontainers.image.revision\"}}' arthello-os-newui)" = "$target_sha"
          printf 'ARTHELLO_ORIGIN_IMAGE=READY\n'
          REMOTE
          )"
          test -n "$build_payload"

          ssh_rc=0
          ssh_started_at="$(date +%s)"
          timeout --signal=TERM --kill-after=5s 150s \
            ssh -n "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
              "set -Eeuo pipefail; install -d -m 0750 '$job_dir'; printf '%s' '$build_payload' | base64 -d > '$job_dir/build-origin.sh'; chmod 0500 '$job_dir/build-origin.sh'; rm -f '$job_dir/status' '$job_dir/status.tmp'; nohup setsid env TARGET_SHA='$TARGET_SHA' JOB_DIR='$job_dir' bash '$job_dir/build-origin.sh' > '$job_dir/build.log' 2>&1 < /dev/null &" \
              </dev/null >/dev/null 2>&1 || ssh_rc=$?
          ssh_elapsed="$(( $(date +%s) - ssh_started_at ))"
          case "$ssh_rc" in
            0|124|137) ;;
            255)
              test "$ssh_elapsed" -ge 90
              ;;
            *) exit "$ssh_rc" ;;
          esac

      - name: Verify the live route accepts the origin-built UI
        run: |
          set -Eeuo pipefail
          ready=0
          for attempt in $(seq 1 330); do
            nonce="${GITHUB_RUN_ID}-${attempt}"
            root_html="$(curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' "$PUBLIC_URL/?probe=$nonce" || true)"
            health_body="$(curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' "$PUBLIC_URL/api/healthz?probe=$nonce" || true)"
            auth_code="$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' -H 'Cache-Control: no-cache' "$PUBLIC_URL/api/auth/me?probe=$nonce" || true)"
            protected_code="$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' -H 'Cache-Control: no-cache' "$PUBLIC_URL/api/settings?probe=$nonce" || true)"
            if grep -Eq 'Проверяем защищённую сессию|Закрытая операционная система образовательной группы' <<<"$root_html" \
              && grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' <<<"$health_body" \
              && [ "$auth_code" = 401 ] \
              && [ "$protected_code" = 401 ]; then
              ready=1
              break
            fi
            sleep 10
          done
          test "$ready" -eq 1
          printf 'ARTHELLO_ORIGIN_BUILD_PUBLIC=OK\n'
