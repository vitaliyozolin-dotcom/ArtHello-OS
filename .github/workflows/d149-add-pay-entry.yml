name: D149 add ArtHello Pay entry

on:
  push:
    branches:
      - codex/arthello-pay-web-d149-20260911

permissions:
  contents: write

jobs:
  add-entry:
    if: github.actor == 'vitaliyozolin-dotcom'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Install exact workspace
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm install --frozen-lockfile
      - name: Add owner-only ArtHello Pay entry
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'artifacts/alpha-crm-sync/src/AppShell.tsx';
          let source = fs.readFileSync(path, 'utf8');
          const anchor = `        <UserBadge />`;
          if (!source.includes(anchor)) throw new Error('Sidebar UserBadge anchor not found');
          if (!source.includes('pay-188-225-38-55.sslip.io')) {
            source = source.replace(anchor, `        {user?.role === 'owner' && (\n          <a\n            href="https://pay-188-225-38-55.sslip.io"\n            className="w-full flex items-center gap-2.5 px-2.5 py-1.5 rounded-lg text-[13px] font-medium text-gray-500 hover:bg-violet-50 hover:text-violet-700 transition-colors"\n          >\n            <Receipt className="w-4 h-4 text-violet-500 shrink-0" />\n            ArtHello Pay\n          </a>\n        )}\n${anchor}`);
          }
          fs.writeFileSync(path, source);
          NODE
          pnpm exec prettier --write artifacts/alpha-crm-sync/src/AppShell.tsx
          grep -F 'https://pay-188-225-38-55.sslip.io' artifacts/alpha-crm-sync/src/AppShell.tsx
          grep -F "user?.role === 'owner'" artifacts/alpha-crm-sync/src/AppShell.tsx
      - name: Verify main ArtHello UI still typechecks
        run: |
          pnpm run typecheck:libs
          pnpm --filter @workspace/alpha-crm-sync run typecheck
      - name: Commit entry once and retire workflow
        run: |
          git config user.name "arthello-pay-bot"
          git config user.email "arthello-pay-bot@users.noreply.github.com"
          git rm .github/workflows/d149-add-pay-entry.yml
          git add artifacts/alpha-crm-sync/src/AppShell.tsx .github/workflows/d149-add-pay-entry.yml
          git commit -m "D149: link ArtHello Pay from owner shell"
          git push origin HEAD:${GITHUB_REF_NAME}
