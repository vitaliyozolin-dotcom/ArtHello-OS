name: Diagnose live School SSO callback

on:
  push:
    branches:
      - ops/diagnose-school-sso-live-20260902
    paths:
      - .github/workflows/diagnose-school-sso-live-20260902.yml

permissions:
  contents: read

concurrency:
  group: diagnose-school-sso-live-20260902
  cancel-in-progress: true

jobs:
  diagnose:
    if: >-
      github.repository == 'vitaliyozolin-dotcom/ArtHello-OS' &&
      github.actor == 'vitaliyozolin-dotcom' &&
      github.triggering_actor == 'vitaliyozolin-dotcom'
    runs-on: [self-hosted, linux, x64, arthello-gateway]
    timeout-minutes: 12
    steps:
      - name: Inspect gateway ArtHello SSO path without mutations
        shell: bash
        run: |
          set -Eeuo pipefail
          sanitize() {
            python3 -c '
          import re, sys
          text=sys.stdin.read()
          text=re.sub(r"([?&](?:code|state|code_challenge|code_verifier|token|session)=)[^&[:space:]\"\\]+", r"\1[REDACTED]", text, flags=re.I)
          text=re.sub(r"(?i)(authorization|cookie|set-cookie)([=:][ \t]*)([^\r\n]+)", r"\1\2[REDACTED]", text)
          text=re.sub(r"[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}", "[EMAIL]", text)
          text=re.sub(r"\b[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}\b", "[UUID]", text, flags=re.I)
          text=re.sub(r"\b[A-Za-z0-9_-]{43,}\b", "[TOKEN]", text)
          sys.stdout.write(text)
          '
          }

          printf 'GATEWAY_SSO_CONTAINER_INVENTORY_BEGIN\n'
          docker ps -a --format 'name={{.Names}} image={{.Image}} status={{.Status}} ports={{.Ports}}' \
            | grep -Ei 'arthello|school|caddy' | sanitize
          printf 'GATEWAY_SSO_CONTAINER_INVENTORY_END\n'

          printf 'GATEWAY_SSO_CADDY_ROUTE_BEGIN\n'
          caddy="$(docker ps --format '{{.Names}}' | grep -E 'caddy' | head -n1 || true)"
          if [ -n "$caddy" ]; then
            docker exec "$caddy" sh -lc \
              "grep -RInE -C 4 'arthello-188-225-38-55|school-188-225-38-55|reverse_proxy' /etc/caddy /data 2>/dev/null | head -n 260" \
              | sanitize || true
          fi
          printf 'GATEWAY_SSO_CADDY_ROUTE_END\n'

          printf 'GATEWAY_SSO_LOGS_BEGIN\n'
          while IFS= read -r container; do
            [ -n "$container" ] || continue
            printf 'container=%s\n' "$container"
            docker logs --since 5h "$container" 2>&1 \
              | grep -Ei 'school-sso|/api/school|authorize|exchange|callback|central|statusCode.:40[013]|statusCode.:50[0-9]|error|denied|invalid' \
              | tail -n 320 \
              | sanitize || true
          done < <(docker ps --format '{{.Names}}' | grep -Ei 'arthello' | sort -u)
          printf 'GATEWAY_SSO_LOGS_END\n'

          printf 'GATEWAY_SSO_CODE_BEGIN\n'
          while IFS= read -r container; do
            [ -n "$container" ] || continue
            printf 'container=%s image=%s workdir=%s\n' \
              "$container" \
              "$(docker inspect "$container" --format '{{.Config.Image}}')" \
              "$(docker inspect "$container" --format '{{.Config.WorkingDir}}')"
            printf 'env_keys='
            docker inspect "$container" --format '{{range .Config.Env}}{{println .}}{{end}}' \
              | cut -d= -f1 | grep -Ei 'SCHOOL|SSO|ORIGIN|AUTH|SESSION|DATABASE' | sort -u | paste -sd, - || true
            docker exec "$container" sh -lc '
              for root in /app /workspace /srv /opt/app; do
                [ -d "$root" ] || continue
                grep -RIl --include="*.js" --include="*.mjs" --include="*.cjs" --include="*.ts" "school-sso" "$root" 2>/dev/null | head -n 16
              done
            ' 2>/dev/null | while IFS= read -r file; do
              [ -n "$file" ] || continue
              printf 'route_file=%s\n' "$file"
              docker exec "$container" sh -lc "grep -nE -m 32 -C 7 'school-sso|codeVerifier|code_challenge|accessVersion|centralUserId|return_to' '$file' 2>/dev/null | head -n 320" \
                | sanitize || true
            done
          done < <(docker ps --format '{{.Names}}' | grep -Ei 'arthello' | sort -u)
          printf 'GATEWAY_SSO_CODE_END\n'
          printf 'GATEWAY_SSO_INSPECTION=PASS\n'
