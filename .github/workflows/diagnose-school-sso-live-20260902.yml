name: Diagnose live School SSO callback

on:
  push:
    branches:
      - ops/diagnose-school-sso-live-20260902
    paths:
      - .github/workflows/diagnose-school-sso-live-20260902.yml

permissions:
  contents: read

concurrency:
  group: diagnose-school-sso-live-20260902
  cancel-in-progress: true

jobs:
  diagnose:
    if: >-
      github.repository == 'vitaliyozolin-dotcom/ArtHello-OS' &&
      github.actor == 'vitaliyozolin-dotcom' &&
      github.triggering_actor == 'vitaliyozolin-dotcom'
    runs-on: [self-hosted, linux, x64, arthello-gateway]
    timeout-minutes: 12
    steps:
      - name: Inspect live ArtHello D1 tables and SSO aggregates without mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          container="$(docker ps --format '{{.Names}}' | grep -E '^arthello-direct-' | head -n1)"
          test -n "$container"
          printf 'ARTHELLO_D1_TABLE_AUDIT_BEGIN\n'
          docker exec -i "$container" node --input-type=module <<'NODE'
          import { readdirSync, statSync } from 'node:fs';
          import { join } from 'node:path';
          import { DatabaseSync } from 'node:sqlite';

          const roots=['/data/d1','/data'];
          const files=[];
          function walk(path, depth=0){
            if(depth>8) return;
            let entries=[];
            try{entries=readdirSync(path,{withFileTypes:true});}catch{return;}
            for(const entry of entries){
              const next=join(path,entry.name);
              if(entry.isDirectory()) walk(next,depth+1);
              else if(entry.isFile() && /\.(sqlite3?|db)$/i.test(entry.name)){
                try{if(statSync(next).size>8192) files.push(next);}catch{}
              }
            }
          }
          for(const root of roots) walk(root);
          for(const file of [...new Set(files)]){
            let db;
            try{
              db=new DatabaseSync(file,{readOnly:true});
              const tables=db.prepare("SELECT name FROM sqlite_master WHERE type='table' ORDER BY name").all().map(row=>String(row.name));
              const relevant=tables.filter(name=>/app_users|user_system_access|production_auth|school_sso|audit/i.test(name));
              if(!relevant.length){db.close();continue;}
              const result={file:file.replace(/[^/]+\.sqlite(?:3)?$/i,'[DB].sqlite'),tables:relevant};
              const counts={};
              for(const table of relevant){
                if(!/^[A-Za-z0-9_]+$/.test(table)) continue;
                try{counts[table]=db.prepare(`SELECT count(*) AS count FROM ${table}`).get().count;}catch{}
              }
              if(tables.includes('school_sso_codes')){
                counts.schoolSsoAggregate=db.prepare(`SELECT count(*) AS total,
                  sum(CASE WHEN used_at>0 THEN 1 ELSE 0 END) AS used,
                  sum(CASE WHEN used_at=0 AND expires_at>unixepoch() THEN 1 ELSE 0 END) AS open,
                  max(created_at) AS latestCreated,max(used_at) AS latestUsed,max(expires_at) AS latestExpiry
                  FROM school_sso_codes`).get();
              }
              if(tables.includes('production_auth_sessions')){
                counts.sessionAggregate=db.prepare(`SELECT count(*) AS total,max(created_at) AS latestCreated,max(expires_at) AS latestExpiry FROM production_auth_sessions`).get();
              }
              if(tables.includes('user_system_access')){
                counts.schoolGrantAggregate=db.prepare(`SELECT count(*) AS total,
                  sum(CASE WHEN status='Активен' THEN 1 ELSE 0 END) AS active,
                  max(access_version) AS maxVersion
                  FROM user_system_access WHERE system_id='SYS-SCHOOL-1-11'`).get();
              }
              console.log(JSON.stringify({...result,counts},null,2));
              db.close();
            }catch(error){try{db?.close()}catch{}}
          }
          NODE
          printf 'ARTHELLO_D1_TABLE_AUDIT_END\n'
          printf 'ARTHELLO_D1_SSO_AUDIT=PASS\n'
