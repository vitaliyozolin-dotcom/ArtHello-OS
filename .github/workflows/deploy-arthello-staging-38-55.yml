name: Deploy ArtHello STAGING 38.55

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: arthello-staging-38-55
  cancel-in-progress: true

jobs:
  staging:
    runs-on: [self-hosted, arthello-gateway]
    permissions:
      contents: read
    env:
      STAGING_URL: https://test-arthello-188-225-38-55.sslip.io
      STAGING_HOST: test-arthello-188-225-38-55.sslip.io
      CADDY_CONTAINER: stroios-caddy-1
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname -I | tr ' ' '\n' | grep -Fx '188.225.38.55' | head -n1)" = '188.225.38.55'
          docker version >/dev/null
          test "$(docker inspect --format '{{.State.Running}}' "$CADDY_CONTAINER")" = true
          docker exec "$CADDY_CONTAINER" test -s /data/external-routes.caddy

      - name: Build staging image
        shell: bash
        run: |
          set -Eeuo pipefail
          image="arthello-staging:$GITHUB_SHA"
          docker build --file deploy/v44/Dockerfile --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag "$image" .
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"

      - name: Start staging candidate
        id: candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          image="arthello-staging:$GITHUB_SHA"
          candidate="arthello-staging-$GITHUB_RUN_ID"
          network="$(docker inspect "$CADDY_CONTAINER" --format '{{range $name, $_ := .NetworkSettings.Networks}}{{println $name}}{{end}}' | head -n1)"
          secret_file="$HOME/.config/arthello/bootstrap-password"
          test -s "$secret_file"
          bootstrap_password="$(cat "$secret_file")"
          echo "::add-mask::$bootstrap_password"
          docker rm -f "$candidate" >/dev/null 2>&1 || true
          docker volume create arthello-staging-v44-data >/dev/null
          docker run -d \
            --name "$candidate" \
            --restart unless-stopped \
            --read-only \
            --tmpfs /tmp \
            --tmpfs /app/node_modules/.mf:rw,uid=1000,gid=1000,mode=0700 \
            --network "$network" \
            -e NODE_ENV=production \
            -e PORT=8081 \
            -e ARTHELLO_D1_PATH=/data/d1 \
            -e ARTHELLO_BOOTSTRAP_LOGIN=owner \
            -e ARTHELLO_BOOTSTRAP_PASSWORD="$bootstrap_password" \
            -v arthello-staging-v44-data:/data \
            "$image" >/dev/null
          ready=0
          for attempt in $(seq 1 45); do
            if docker exec -i "$candidate" node - <<'NODE'
          const base='http://127.0.0.1:8081';
          try {
            const health=await fetch(base+'/api/health');
            if(!health.ok || !(await health.text()).includes('"status":"ok"')) process.exit(1);
            const settings=await fetch(base+'/settings/access');
            if(!settings.ok) process.exit(1);
            const invite=await fetch(base+'/api/access/invitations/not-a-real-token');
            if(invite.status !== 410) process.exit(1);
          } catch { process.exit(1); }
          NODE
            then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo '=== STAGING CANDIDATE STATE ==='
            docker inspect "$candidate" --format '{{json .State}}' || true
            echo '=== STAGING CANDIDATE LOGS ==='
            docker logs --tail 200 "$candidate" || true
            exit 1
          fi
          echo "name=$candidate" >> "$GITHUB_OUTPUT"

      - name: Publish staging route only
        shell: bash
        env:
          CANDIDATE: ${{ steps.candidate.outputs.name }}
        run: |
          set -Eeuo pipefail
          test -n "$CANDIDATE"
          work="$RUNNER_TEMP/arthello-staging-$GITHUB_RUN_ID"
          mkdir -p "$work"
          current="$work/external-routes.current.caddy"
          next="$work/external-routes.next.caddy"
          docker cp "$CADDY_CONTAINER:/data/external-routes.caddy" "$current"
          awk '
            BEGIN { skip=0 }
            /^test-arthello-188-225-38-55\.sslip\.io[[:space:]]*\{/ { skip=1; depth=1; next }
            skip {
              opens=gsub(/\{/,"{"); closes=gsub(/\}/,"}"); depth+=opens-closes;
              if(depth<=0) skip=0;
              next
            }
            { print }
          ' "$current" > "$next"
          cat >> "$next" <<EOF

          $STAGING_HOST {
            encode zstd gzip
            reverse_proxy $CANDIDATE:8081
            header {
              X-Robots-Tag "noindex, nofollow, noarchive"
              X-ArtHello-Environment "staging"
              -Server
            }
          }
          EOF
          docker cp "$next" "$CADDY_CONTAINER:/data/external-routes.caddy.new"
          docker exec "$CADDY_CONTAINER" sh -lc "sed 's#/data/external-routes.caddy#/data/external-routes.caddy.new#' /etc/caddy/Caddyfile > /tmp/Caddyfile.staging-candidate"
          docker exec "$CADDY_CONTAINER" caddy validate --config /tmp/Caddyfile.staging-candidate --adapter caddyfile >/dev/null
          docker exec "$CADDY_CONTAINER" sh -lc 'mv /data/external-routes.caddy.new /data/external-routes.caddy'
          docker exec "$CADDY_CONTAINER" caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile >/dev/null

      - name: Verify public staging
        shell: bash
        run: |
          set -Eeuo pipefail
          ok=0
          for attempt in $(seq 1 40); do
            if curl -fsS --max-time 20 "$STAGING_URL/api/health" | grep -F '"status":"ok"' >/dev/null \
              && curl -fsS --max-time 20 "$STAGING_URL/settings/access" | grep -F 'Пользователи и доступы' >/dev/null; then
              ok=1; break
            fi
            sleep 3
          done
          test "$ok" -eq 1
          curl -fsSI --max-time 20 "$STAGING_URL/settings/access" | grep -i '^x-arthello-environment: staging' >/dev/null
          printf 'ARTHELLO_STAGING=OK\nSTAGING_URL=%s\n' "$STAGING_URL"

      - name: Cleanup superseded staging containers
        shell: bash
        env:
          CANDIDATE: ${{ steps.candidate.outputs.name }}
        run: |
          set -Eeuo pipefail
          while IFS= read -r old; do
            [ -n "$old" ] || continue
            [ "$old" = "$CANDIDATE" ] && continue
            docker rm -f "$old" >/dev/null 2>&1 || true
          done < <(docker ps -a --filter 'name=^/arthello-staging-' --format '{{.Names}}')
          docker image prune -f >/dev/null || true
