name: Deploy School 1-11 production

on:
  push:
    branches:
      - codex/school-diary-delivery-sslip

permissions:
  contents: read
  issues: write

concurrency:
  group: school-1-11-production
  cancel-in-progress: false

jobs:
  announce:
    runs-on: [self-hosted, linux, x64, arthello-gateway]
    outputs:
      issue_number: ${{ steps.issue.outputs.issue_number }}
    steps:
      - name: Create production run record
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          payload="$(jq -n \
            --arg title "[school-production] run $GITHUB_RUN_ID" \
            --arg body "Deployment is queued for commit $GITHUB_SHA. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{title: $title, body: $body}')"
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues")"
          issue_number="$(jq -r '.number' <<<"$response")"
          test "$issue_number" != null
          printf 'issue_number=%s\n' "$issue_number" >> "$GITHUB_OUTPUT"

  deploy:
    needs: announce
    runs-on: [self-hosted, linux, x64, arthello-gateway]
    timeout-minutes: 35
    environment: production-ru
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configure pinned SSH host
        id: configure_ssh
        continue-on-error: true
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ARTHELLO_RU_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ARTHELLO_RU_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          ssh_dir="$RUNNER_TEMP/school-deploy-ssh"
          install -m 0700 -d "$ssh_dir"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_dir/id_ed25519"
          chmod 0600 "$ssh_dir/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          test -s "$ssh_dir/id_ed25519"
          test -s "$ssh_dir/known_hosts"
          ssh-keygen -y -f "$ssh_dir/id_ed25519" >/dev/null
          printf 'key_path=%s\n' "$ssh_dir/id_ed25519" >> "$GITHUB_OUTPUT"
          printf 'known_hosts_path=%s\n' "$ssh_dir/known_hosts" >> "$GITHUB_OUTPUT"

      - name: Deploy immutable school release
        id: deploy_school
        if: steps.configure_ssh.outcome == 'success'
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.ARTHELLO_RU_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ARTHELLO_RU_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.ARTHELLO_RU_DEPLOY_PORT }}
          SSH_KEY_PATH: ${{ steps.configure_ssh.outputs.key_path }}
          SSH_KNOWN_HOSTS_PATH: ${{ steps.configure_ssh.outputs.known_hosts_path }}
        run: |
          set -Eeuo pipefail
          log_file="$RUNNER_TEMP/school-deploy.log"
          deploy_port="${DEPLOY_PORT:-2222}"
          set +e
          ssh -T \
            -p "$deploy_port" \
            -i "$SSH_KEY_PATH" \
            -o UserKnownHostsFile="$SSH_KNOWN_HOSTS_PATH" \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=40 \
            -o IPQoS=none \
            -o Compression=no \
            -o KexAlgorithms=curve25519-sha256 \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o PubkeyAcceptedAlgorithms=ssh-ed25519 \
            -o Ciphers=aes128-ctr \
            -o MACs=hmac-sha2-256 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "DELIVERY_REF=$GITHUB_SHA SCHOOL_HOST=school-188-225-38-55.sslip.io VERIFY_PUBLIC=0 bash -s" \
            < deploy/repair-deploy.sh 2>&1 | tee "$log_file"
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Verify public full-screen release
        id: verify_public
        if: steps.deploy_school.outcome == 'success'
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          origin=https://school-188-225-38-55.sslip.io
          healthy=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error "$origin/api/health" | grep -F '"status":"ok"' >/dev/null; then
              healthy=1
              break
            fi
            sleep 3
          done
          test "$healthy" -eq 1
          login_html="$RUNNER_TEMP/school-login.html"
          css_file="$RUNNER_TEMP/school-globals.css"
          curl --fail --silent --show-error "$origin/login" > "$login_html"
          css_path="$(grep -oE '/_next/static/css/[^"?]+\.css' "$login_html" | head -1)"
          test -n "$css_path"
          curl --fail --silent --show-error "$origin$css_path" > "$css_file"
          grep -F '.l0-stage{width:100%;height:100svh;overflow:hidden' "$css_file" >/dev/null
          grep -F 'student-dashboard-hero-v1.webp' "$css_file" >/dev/null
          printf 'SCHOOL_PUBLIC_HTTPS=OK\n'
          printf 'SCHOOL_FULLSCREEN_CSS=VERIFIED\n'

      - name: Remove temporary SSH material
        if: always()
        run: |
          rm -f \
            "$RUNNER_TEMP/school-deploy-ssh/id_ed25519" \
            "$RUNNER_TEMP/school-deploy-ssh/known_hosts"

      - name: Publish sanitized production result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIGURE_OUTCOME: ${{ steps.configure_ssh.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy_school.outcome }}
          PUBLIC_OUTCOME: ${{ steps.verify_public.outcome }}
        run: |
          set -Eeuo pipefail
          log_file="$RUNNER_TEMP/school-deploy.log"
          report_file="$RUNNER_TEMP/school-report.md"
          {
            printf 'School deployment run: %s\n\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- SSH configuration: `%s`\n' "$CONFIGURE_OUTCOME"
            printf -- '- Release deployment: `%s`\n' "$DEPLOY_OUTCOME"
            printf -- '- Public full-screen verification: `%s`\n\n' "$PUBLIC_OUTCOME"
            printf 'Sanitized deployment markers:\n\n```text\n'
            if [ -f "$log_file" ]; then
              grep -E '^(SCHOOL_|Error:|error:|curl:|ssh:|Permission denied|Host key|Connection closed)' "$log_file" \
                | tail -n 100 \
                | sed -E 's/(PASSWORD|TOKEN|SECRET|PRIVATE_KEY)=.*/\1=[REDACTED]/Ig' || true
            else
              printf 'No deployment log was produced.\n'
            fi
            printf '```\n'
          } > "$report_file"
          issue_number="${{ needs.announce.outputs.issue_number }}"
          test -n "$issue_number"
          payload="$(jq -n --rawfile body "$report_file" '{body: $body}')"
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$issue_number" \
            >/dev/null

      - name: Enforce successful production result
        if: always()
        env:
          CONFIGURE_OUTCOME: ${{ steps.configure_ssh.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy_school.outcome }}
          PUBLIC_OUTCOME: ${{ steps.verify_public.outcome }}
        run: |
          set -Eeuo pipefail
          test "$CONFIGURE_OUTCOME" = success
          test "$DEPLOY_OUTCOME" = success
          test "$PUBLIC_OUTCOME" = success
