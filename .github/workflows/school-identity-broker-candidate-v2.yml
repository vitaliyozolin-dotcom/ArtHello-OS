name: School identity broker candidate v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/school-identity-broker-candidate-v2.yml
      - scripts/school-candidate-secrets.mjs
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: school-identity-broker-candidate-v2
  cancel-in-progress: false

env:
  CANDIDATE_SHA: 21960d50ab2047cf83cc2ea304e70195064e8157
  BUILDER_IMAGE: school-identity-v2-builder:21960d50ab20
  RUNTIME_IMAGE: school-identity-v2-runtime:21960d50ab20
  SCHOOL_ORIGIN: http://127.0.0.1:3432
  BROKER_HOST_ORIGIN: http://127.0.0.1:3440
  BROKER_INTERNAL_ORIGIN: http://broker:3340

jobs:
  candidate:
    runs-on: [self-hosted, linux, x64, arthello-gateway]
    timeout-minutes: 60
    steps:
      - name: Check out validation controls
        uses: actions/checkout@v4

      - name: Generate ephemeral masked candidate secrets
        run: node scripts/school-candidate-secrets.mjs

      - name: Check out exact School candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
          path: candidate

      - name: Record immutable School production baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          production=school-1-11
          test "$(docker inspect "$production" --format '{{.State.Running}}')" = true
          test "$(docker inspect "$production" --format '{{.State.Health.Status}}')" = healthy
          printf 'school_live_id=%s\n' "$(docker inspect "$production" --format '{{.Id}}')" >> "$GITHUB_ENV"
          printf 'school_live_image=%s\n' "$(docker inspect "$production" --format '{{.Image}}')" >> "$GITHUB_ENV"
          printf 'school_live_started=%s\n' "$(docker inspect "$production" --format '{{.State.StartedAt}}')" >> "$GITHUB_ENV"
          printf 'SCHOOL_IDENTITY_PRODUCTION_BASELINE=RECORDED\n'

      - name: Build exact candidate and run contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          install -d -m 0755 candidate/.openai
          cp .github/fixtures/school-hosting.json candidate/.openai/hosting.json
          cp .github/fixtures/school-dockerignore candidate/.dockerignore
          test "$(sha256sum candidate/.openai/hosting.json | cut -d' ' -f1)" = 496e738fab42ede81bc826d1b5319609192bf4af7474777d66c9b5c8f8d5c16f
          test "$(sha256sum candidate/.dockerignore | cut -d' ' -f1)" = c727c5d0f01245e7b3c488e6cb01429e0beee23b798eee8ae4dc7df46a2c4446
          docker build \
            --build-arg NEXT_PUBLIC_SCHOOL_DESIGN_V1=true \
            --target builder \
            --tag "$BUILDER_IMAGE" \
            --file candidate/Dockerfile candidate
          docker run --rm --network none --entrypoint node "$BUILDER_IMAGE" \
            --test \
            tests/phone-auth-contract.test.mjs \
            tests/central-access-contract.test.mjs \
            tests/central-family-directory.test.mjs \
            tests/identity-broker-contract.test.mjs \
            tests/design-code-contract.test.mjs
          docker run --rm --network none --entrypoint npm "$BUILDER_IMAGE" run lint
          docker build \
            --build-arg NEXT_PUBLIC_SCHOOL_DESIGN_V1=true \
            --tag "$RUNTIME_IMAGE" \
            --file candidate/Dockerfile candidate
          printf 'SCHOOL_IDENTITY_V2_BUILD=OK\n'

      - name: Run isolated passwordless, magic-link and employee SSO flows
        shell: bash
        run: |
          set -Eeuo pipefail
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          network="school-identity-v2-${suffix}"
          school="school-identity-v2-app-${suffix}"
          broker="school-identity-v2-broker-${suffix}"
          volume="school_identity_v2_${suffix}_data"
          broker_script="$RUNNER_TEMP/school-identity-v2-broker-${suffix}.mjs"
          work=""

          cleanup() {
            rc=$?
            set +e
            docker rm -f "$school" "$broker" >/dev/null 2>&1
            docker volume rm "$volume" >/dev/null 2>&1
            docker network rm "$network" >/dev/null 2>&1
            rm -f "$broker_script"
            case "$work" in
              "$RUNNER_TEMP"/school-identity-v2-*) rm -rf -- "$work" ;;
            esac
            exit "$rc"
          }
          trap cleanup EXIT

          for port in 3432 3440; do
            if ss -ltn | awk '{print $4}' | grep -Eq "(^|:)$port$"; then
              printf 'Required isolated port %s is occupied\n' "$port" >&2
              exit 1
            fi
          done

          cat > "$broker_script" <<'NODE'
          import { createHash, createHmac, randomBytes, timingSafeEqual } from 'node:crypto';
          import http from 'node:http';

          const port = 3340;
          const schoolOrigin = process.env.SCHOOL_ORIGIN;
          const deliveryToken = process.env.DELIVERY_TOKEN;
          const codes = new Map();
          let lastDelivery = null;

          const readBody = (request) => new Promise((resolve, reject) => {
            const chunks = [];
            request.on('data', (chunk) => chunks.push(chunk));
            request.on('end', () => resolve(Buffer.concat(chunks).toString('utf8')));
            request.on('error', reject);
          });
          const sendJson = (response, status, value) => {
            const body = JSON.stringify(value);
            response.writeHead(status, {
              'content-type': 'application/json; charset=utf-8',
              'content-length': Buffer.byteLength(body),
              'cache-control': 'no-store',
            });
            response.end(body);
          };
          const sha256url = (value) => createHash('sha256').update(value).digest('base64url');

          const server = http.createServer(async (request, response) => {
            try {
              const url = new URL(request.url, `http://127.0.0.1:${port}`);
              if (request.method === 'GET' && url.pathname === '/health')
                return sendJson(response, 200, { status: 'ok' });
              if (request.method === 'GET' && url.pathname === '/last-delivery')
                return lastDelivery
                  ? sendJson(response, 200, lastDelivery)
                  : sendJson(response, 404, { error: 'empty' });

              if (request.method === 'POST' && url.pathname === '/delivery') {
                const body = await readBody(request);
                const timestamp = String(request.headers['x-arthello-timestamp'] || '');
                const signature = String(request.headers['x-arthello-signature'] || '');
                const expected = createHmac('sha256', deliveryToken)
                  .update(`${timestamp}.${body}`)
                  .digest('hex');
                const expectedBuffer = Buffer.from(expected, 'hex');
                const actualBuffer = /^[a-f0-9]{64}$/i.test(signature)
                  ? Buffer.from(signature, 'hex')
                  : Buffer.alloc(0);
                const issuedAt = Number(timestamp) * 1000;
                if (
                  expectedBuffer.length !== actualBuffer.length ||
                  !timingSafeEqual(expectedBuffer, actualBuffer) ||
                  !Number.isFinite(issuedAt) ||
                  Math.abs(Date.now() - issuedAt) > 300_000
                ) return sendJson(response, 401, { error: 'invalid signature' });
                lastDelivery = JSON.parse(body);
                return sendJson(response, 200, { ok: true });
              }

              if (request.method === 'GET' && url.pathname === '/api/school-sso/authorize') {
                const state = url.searchParams.get('state') || '';
                const challenge = url.searchParams.get('code_challenge') || '';
                if (!state || !challenge)
                  return sendJson(response, 400, { error: 'invalid authorization' });
                const code = randomBytes(32).toString('base64url');
                codes.set(code, challenge);
                const callback = new URL('/auth/central/callback', schoolOrigin);
                callback.searchParams.set('code', code);
                callback.searchParams.set('state', state);
                response.writeHead(303, {
                  location: callback.toString(),
                  'cache-control': 'no-store',
                });
                return response.end();
              }

              if (request.method === 'POST' && url.pathname === '/api/school-sso/exchange') {
                const payload = JSON.parse(await readBody(request));
                const expectedChallenge = codes.get(payload.code);
                if (
                  !expectedChallenge ||
                  sha256url(String(payload.codeVerifier || '')) !== expectedChallenge
                ) return sendJson(response, 401, { error: 'invalid or used code' });
                codes.delete(payload.code);
                return sendJson(response, 200, {
                  ok: true,
                  identity: {
                    centralUserId: 'staff-sso-1',
                    displayName: 'Тестовый сотрудник',
                    contact: '+79995550022',
                    role: 'teacher',
                    accessVersion: 1,
                  },
                });
              }
              return sendJson(response, 404, { error: 'not found' });
            } catch (error) {
              return sendJson(response, 500, { error: String(error) });
            }
          });
          server.listen(port, '0.0.0.0', () => console.log(`BROKER_READY=${port}`));
          const close = () => server.close(() => process.exit(0));
          process.on('SIGTERM', close);
          process.on('SIGINT', close);
          NODE

          docker network create "$network" >/dev/null
          docker volume create "$volume" >/dev/null
          docker run -d \
            --name "$broker" \
            --network "$network" \
            --network-alias broker \
            -p 127.0.0.1:3440:3340 \
            --security-opt no-new-privileges:true \
            -e SCHOOL_ORIGIN="$SCHOOL_ORIGIN" \
            -e DELIVERY_TOKEN="$DELIVERY_TOKEN" \
            -v "$broker_script:/srv/broker.mjs:ro" \
            node:24-bookworm-slim node /srv/broker.mjs >/dev/null

          broker_ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 3 "$BROKER_HOST_ORIGIN/health" | grep -F '"status":"ok"' >/dev/null; then
              broker_ready=1
              break
            fi
            test "$(docker inspect "$broker" --format '{{.State.Running}}' 2>/dev/null || true)" = true || break
            sleep 1
          done
          if [ "$broker_ready" -ne 1 ]; then
            docker logs "$broker" --tail 160 >&2 || true
            exit 1
          fi

          docker run -d \
            --name "$school" \
            --network "$network" \
            -p 127.0.0.1:3432:3000 \
            --security-opt no-new-privileges:true \
            -e NODE_ENV=test \
            -e PORT=3000 \
            -e HOSTNAME=0.0.0.0 \
            -e DATABASE_PATH=/data/school-1-11.sqlite \
            -e PUBLIC_APP_ORIGIN="$SCHOOL_ORIGIN" \
            -e ARTHELLO_PUBLIC_ORIGIN="$BROKER_INTERNAL_ORIGIN" \
            -e CENTRAL_ACCESS_SECRET="$CENTRAL_SECRET" \
            -e PASSWORDLESS_PEPPER="$PASSWORDLESS_PEPPER" \
            -e PASSWORDLESS_DELIVERY_URL="$BROKER_INTERNAL_ORIGIN/delivery" \
            -e PASSWORDLESS_DELIVERY_TOKEN="$DELIVERY_TOKEN" \
            -v "$volume:/data" \
            "$RUNTIME_IMAGE" >/dev/null

          ready=0
          for attempt in $(seq 1 90); do
            if curl -fsS --max-time 4 "$SCHOOL_ORIGIN/api/health" | grep -F '"status":"ok"' >/dev/null; then
              ready=1
              break
            fi
            test "$(docker inspect "$school" --format '{{.State.Running}}' 2>/dev/null || true)" = true || break
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker logs "$school" --tail 200 >&2 || true
            exit 1
          fi

          work="$(mktemp -d "$RUNNER_TEMP/school-identity-v2-XXXXXX")"
          curl -fsS --max-time 20 "$SCHOOL_ORIGIN/login" > "$work/login.html"
          grep -F 'Получить код' "$work/login.html" >/dev/null
          grep -F 'Вход для сотрудников' "$work/login.html" >/dev/null
          grep -F 'Постоянный пароль не нужен' "$work/login.html" >/dev/null
          ! grep -F 'name="password"' "$work/login.html" >/dev/null
          ! grep -F 'ArtHello OS' "$work/login.html" >/dev/null
          ! grep -F 'Виталий' "$work/login.html" >/dev/null

          docker exec -i "$school" node --input-type=module <<'SEED'
          import { DatabaseSync } from 'node:sqlite';
          const db = new DatabaseSync('/data/school-1-11.sqlite');
          db.prepare(`INSERT INTO users
            (id, email, display_name, role, linked_student_id, status,
             phone, password_hash, password_state, auth_version,
             failed_login_count, central_user_id, identity_source,
             central_access_version)
            VALUES (?, ?, ?, 'parent', NULL, 'active', ?, NULL, 'external',
              1, 0, ?, 'arthello_os', 1)`)
            .run(
              'parent-passwordless-1',
              'parent.identity@example.test',
              'Тестовый родитель',
              '+79995550011',
              'guardian-central-1',
            );
          db.close();
          SEED

          request_status="$(curl -sS --max-time 20 -o "$work/request.json" -w '%{http_code}' -X POST "$SCHOOL_ORIGIN/api/auth/passwordless/request" -H "Origin: $SCHOOL_ORIGIN" -H 'Content-Type: application/json' --data '{"identifier":"+79995550011","returnTo":"/"}')"
          test "$request_status" = 200
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 3 "$BROKER_HOST_ORIGIN/last-delivery" > "$work/delivery.json"; then break; fi
            sleep 1
          done
          test -s "$work/delivery.json"
          challenge_id="$(python3 - "$work/request.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          assert data['challengeId'].startswith('passwordless-')
          assert data['channel'] == 'sms'
          assert data['expiresInSeconds'] == 600
          print(data['challengeId'])
          PY
          )"
          code="$(python3 - "$work/delivery.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          assert data['channel'] == 'sms'
          assert data['target'] == '+79995550011'
          assert len(data['code']) == 6 and data['code'].isdigit()
          assert data['magicLink'].startswith('http://127.0.0.1:3432/api/auth/passwordless/magic?token=')
          print(data['code'])
          PY
          )"
          python3 - "$challenge_id" "$code" > "$work/verify-body.json" <<'PY'
          import json, sys
          print(json.dumps({
            'identifier': '+79995550011',
            'challengeId': sys.argv[1],
            'code': sys.argv[2],
          }))
          PY
          verify_status="$(curl -sS --max-time 20 -c "$work/family.cookies" -o "$work/verify.json" -w '%{http_code}' -X POST "$SCHOOL_ORIGIN/api/auth/passwordless/verify" -H "Origin: $SCHOOL_ORIGIN" -H 'Content-Type: application/json' --data-binary @"$work/verify-body.json")"
          test "$verify_status" = 200
          curl -fsS --max-time 20 -b "$work/family.cookies" "$SCHOOL_ORIGIN/api/school" > "$work/family-snapshot.json"
          replay_status="$(curl -sS --max-time 20 -o "$work/replay.json" -w '%{http_code}' -X POST "$SCHOOL_ORIGIN/api/auth/passwordless/verify" -H "Origin: $SCHOOL_ORIGIN" -H 'Content-Type: application/json' --data-binary @"$work/verify-body.json")"
          test "$replay_status" = 401

          request2_status="$(curl -sS --max-time 20 -o "$work/request2.json" -w '%{http_code}' -X POST "$SCHOOL_ORIGIN/api/auth/passwordless/request" -H "Origin: $SCHOOL_ORIGIN" -H 'Content-Type: application/json' --data '{"identifier":"parent.identity@example.test","returnTo":"/"}')"
          test "$request2_status" = 200
          sleep 1
          curl -fsS --max-time 5 "$BROKER_HOST_ORIGIN/last-delivery" > "$work/delivery2.json"
          magic_link="$(python3 - "$work/delivery2.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          assert data['channel'] == 'email'
          print(data['magicLink'])
          PY
          )"
          magic_status="$(curl -sS --max-time 20 -c "$work/magic.cookies" -D "$work/magic.headers" -o /dev/null -w '%{http_code}' "$magic_link")"
          test "$magic_status" = 303
          curl -fsS --max-time 20 -b "$work/magic.cookies" "$SCHOOL_ORIGIN/api/school" > "$work/magic-snapshot.json"
          magic_replay_status="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "$magic_link")"
          test "$magic_replay_status" = 303
          magic_replay_location="$(curl -sS --max-time 20 -D - -o /dev/null "$magic_link" | tr -d '\r' | sed -n 's/^location: //ip' | tail -n1)"
          case "$magic_replay_location" in
            /login?authError=expired_link*|http://127.0.0.1:3432/login?authError=expired_link*) ;;
            *) printf 'Magic-link replay was not rejected: %s\n' "$magic_replay_location" >&2; exit 1 ;;
          esac

          legacy_status="$(curl -sS --max-time 20 -o "$work/legacy.json" -w '%{http_code}' -X POST "$SCHOOL_ORIGIN/api/auth/login" -H "Origin: $SCHOOL_ORIGIN" -H 'Content-Type: application/json' --data '{"login":"parent.identity@example.test","password":"InvalidPassword1"}')"
          test "$legacy_status" = 410
          unknown_status="$(curl -sS --max-time 20 -o "$work/unknown.json" -w '%{http_code}' -X POST "$SCHOOL_ORIGIN/api/auth/passwordless/request" -H "Origin: $SCHOOL_ORIGIN" -H 'Content-Type: application/json' --data '{"identifier":"nobody@example.invalid","returnTo":"/"}')"
          test "$unknown_status" = 200
          python3 - "$work/unknown.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          assert data['challengeId'].startswith('unresolved-')
          PY

          curl -sS --max-time 20 -c "$work/sso.cookies" -D "$work/sso-start.headers" -o /dev/null "$SCHOOL_ORIGIN/auth/central/start"
          start_status="$(awk 'NR==1 {print $2}' "$work/sso-start.headers")"
          test "$start_status" = 303
          internal_authorize="$(tr -d '\r' < "$work/sso-start.headers" | sed -n 's/^location: //ip' | tail -n1)"
          host_authorize="$(python3 - "$internal_authorize" "$BROKER_HOST_ORIGIN" <<'PY'
          import sys, urllib.parse
          source = urllib.parse.urlparse(sys.argv[1])
          print(sys.argv[2] + source.path + ('?' + source.query if source.query else ''))
          PY
          )"
          curl -sS --max-time 20 -D "$work/authorize.headers" -o /dev/null "$host_authorize"
          authorize_status="$(awk 'NR==1 {print $2}' "$work/authorize.headers")"
          test "$authorize_status" = 303
          callback="$(tr -d '\r' < "$work/authorize.headers" | sed -n 's/^location: //ip' | tail -n1)"
          callback_status="$(curl -sS --max-time 20 -b "$work/sso.cookies" -c "$work/sso.cookies" -D "$work/callback.headers" -o /dev/null -w '%{http_code}' "$callback")"
          test "$callback_status" = 303
          curl -fsS --max-time 20 -b "$work/sso.cookies" "$SCHOOL_ORIGIN/api/school" > "$work/staff-snapshot.json"

          docker exec -i "$school" node --input-type=module <<'VERIFY_DB'
          import { DatabaseSync } from 'node:sqlite';
          const db = new DatabaseSync('/data/school-1-11.sqlite', { readOnly: true });
          const integrity = db.prepare('PRAGMA integrity_check').get().integrity_check;
          const brokerTable = db.prepare("SELECT count(*) AS count FROM sqlite_master WHERE type='table' AND name='passwordless_challenges'").get().count;
          const staff = db.prepare("SELECT identity_source AS source, password_state AS passwordState, role FROM users WHERE central_user_id = 'staff-sso-1'").get();
          db.close();
          if (integrity !== 'ok' || brokerTable !== 1)
            throw new Error('Identity broker database validation failed');
          if (!staff || staff.source !== 'arthello_os' || staff.passwordState !== 'external' || staff.role !== 'teacher')
            throw new Error('Central staff reconciliation failed');
          console.log('SCHOOL_IDENTITY_V2_DATABASE=OK');
          VERIFY_DB

          printf 'SCHOOL_IDENTITY_V2_PASSWORDLESS=OK\n'
          printf 'SCHOOL_IDENTITY_V2_MAGIC_LINK_REPLAY=REJECTED\n'
          printf 'SCHOOL_IDENTITY_V2_STAFF_SSO=OK\n'

      - name: Verify School production remained unchanged
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          production=school-1-11
          test "$(docker inspect "$production" --format '{{.Id}}')" = "$school_live_id"
          test "$(docker inspect "$production" --format '{{.Image}}')" = "$school_live_image"
          test "$(docker inspect "$production" --format '{{.State.StartedAt}}')" = "$school_live_started"
          test "$(docker inspect "$production" --format '{{.State.Running}}')" = true
          test "$(docker inspect "$production" --format '{{.State.Health.Status}}')" = healthy
          printf 'SCHOOL_IDENTITY_PRODUCTION_UNCHANGED=YES\n'

      - name: Cleanup candidate images
        if: always()
        shell: bash
        run: |
          docker image rm "$RUNTIME_IMAGE" "$BUILDER_IMAGE" >/dev/null 2>&1 || true

      - name: Report candidate status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: process.env.CANDIDATE_SHA,
              state: process.env.JOB_STATUS === 'success' ? 'success' : 'failure',
              context: 'school/identity-broker-candidate-v2',
              description: 'School identity broker candidate v2 ' + process.env.JOB_STATUS,
              target_url: process.env.GITHUB_SERVER_URL + '/' + process.env.GITHUB_REPOSITORY + '/actions/runs/' + process.env.GITHUB_RUN_ID,
            });
