name: Temporary KTP source export

on:
  push:
    branches:
      - codex/school-ktp-xlsx-import-20260831
    paths:
      - .github/workflows/tmp-ktp-source-export.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Package exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '%s\n' "$(git rev-parse HEAD)" > SOURCE_SHA
          tar --exclude-vcs --exclude='node_modules' --exclude='.next' --exclude='dist' -czf ktp-source-export.tgz .
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: ktp-source-export
          path: ktp-source-export.tgz
          if-no-files-found: error
          retention-days: 1
