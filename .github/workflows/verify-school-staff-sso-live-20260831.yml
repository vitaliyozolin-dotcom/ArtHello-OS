name: Verify live School staff SSO path

on:
  push:
    branches:
      - ops/verify-school-staff-sso-live-20260831
    paths:
      - .github/workflows/verify-school-staff-sso-live-20260831.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-school-staff-sso-live-20260831
  cancel-in-progress: true

jobs:
  arthello-local:
    runs-on: [self-hosted, linux, x64, arthello-gateway]
    timeout-minutes: 15
    steps:
      - name: Check out controls
        uses: actions/checkout@v4

      - name: Verify ArtHello production SSO surface without mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          origin='https://arthello-188-225-38-55.sslip.io'
          work="$(mktemp -d "$RUNNER_TEMP/arthello-school-sso-live-XXXXXX")"
          trap 'rm -rf -- "$work"' EXIT

          mapfile -t candidates < <(
            docker ps --format '{{.Names}}' | grep -E '^arthello-direct-' || true
          )
          test "${#candidates[@]}" -eq 1
          live="${candidates[0]}"
          printf 'ARTHELLO_CONTAINER=%s\n' "$live"
          printf 'ARTHELLO_IMAGE_REF=%s\n' "$(docker inspect "$live" --format '{{.Config.Image}}')"
          printf 'ARTHELLO_IMAGE_ID=%s\n' "$(docker inspect "$live" --format '{{.Image}}')"
          printf 'ARTHELLO_HEALTH=%s\n' "$(docker inspect "$live" --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}')"
          printf 'ARTHELLO_STARTED_AT=%s\n' "$(docker inspect "$live" --format '{{.State.StartedAt}}')"
          printf 'ARTHELLO_REVISION=%s\n' "$(docker inspect "$live" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"

          curl -fsS --max-time 20 "$origin/api/health" > "$work/health.json"
          grep -F '"status":"ok"' "$work/health.json" >/dev/null
          printf 'ARTHELLO_PUBLIC_HEALTH=OK\n'

          curl -sS --max-time 20 -D "$work/authorize.headers" -o "$work/authorize.body" \
            "$origin/api/school-sso/authorize?state=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa&code_challenge=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb&return_to=%2F"
          status="$(awk 'NR==1{print $2}' "$work/authorize.headers")"
          location="$(tr -d '\r' < "$work/authorize.headers" | sed -n 's/^location: //Ip' | tail -n1)"
          printf 'ARTHELLO_SSO_UNAUTH_STATUS=%s\n' "$status"
          printf 'ARTHELLO_SSO_UNAUTH_LOCATION_PATH=%s\n' "$(python3 - "$location" <<'PY'
          import sys, urllib.parse
          value=sys.argv[1]
          print(urllib.parse.urlparse(value).path if value else '')
          PY
          )"
          case "$status" in 302|303|307|308|401|403) ;; *) exit 1 ;; esac

          if timeout 30s docker exec "$live" sh -lc \
            "grep -R -F -m1 'Открыть дневник' /app 2>/dev/null" > "$work/button.txt"; then
            printf 'ARTHELLO_DIARY_BUTTON_SOURCE=yes\n'
          else
            printf 'ARTHELLO_DIARY_BUTTON_SOURCE=no\n'
          fi
          if timeout 30s docker exec "$live" sh -lc \
            "grep -R -F -m1 '/api/school-sso/authorize' /app 2>/dev/null" > "$work/route.txt"; then
            printf 'ARTHELLO_SSO_ROUTE_SOURCE=yes\n'
          else
            printf 'ARTHELLO_SSO_ROUTE_SOURCE=no\n'
          fi

          printf 'ARTHELLO_LOCAL_DIAGNOSTIC=PASS\n'

  school-remote:
    runs-on: [self-hosted, linux, x64, arthello-gateway]
    timeout-minutes: 20
    environment: production-ru
    env:
      DEPLOY_HOST: ${{ secrets.ARTHELLO_RU_DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.ARTHELLO_RU_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.ARTHELLO_RU_DEPLOY_PORT }}
      SSH_PRIVATE_KEY: ${{ secrets.ARTHELLO_RU_SSH_PRIVATE_KEY }}
    steps:
      - name: Configure confirmed SSH identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$SSH_PRIVATE_KEY"
          ssh_dir="$RUNNER_TEMP/school-sso-remote-$GITHUB_RUN_ID"
          install -m 0700 -d "$ssh_dir"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_dir/id_ed25519"
          chmod 0600 "$ssh_dir/id_ed25519"
          ssh-keygen -y -f "$ssh_dir/id_ed25519" >/dev/null
          port="${DEPLOY_PORT:-2222}"
          scan="$ssh_dir/known_hosts.scan"
          : > "$scan"
          chmod 0600 "$scan"
          for attempt in 1 2 3; do
            timeout --signal=TERM --kill-after=5s 150s \
              ssh -p "$port" \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile="$scan" \
              -o GlobalKnownHostsFile=/dev/null \
              -o PreferredAuthentications=none \
              -o PubkeyAuthentication=no \
              -o PasswordAuthentication=no \
              -o KbdInteractiveAuthentication=no \
              -o ConnectTimeout=140 \
              -o HostKeyAlgorithms=ssh-ed25519 \
              "$DEPLOY_USER@$DEPLOY_HOST" true </dev/null >/dev/null 2>&1 || true
            test -s "$scan" && break
            sleep 5
          done
          test -s "$scan"
          fingerprint="$(ssh-keygen -lf "$scan" -E sha256 | awk '{print $2; exit}')"
          test "$fingerprint" = 'SHA256:/kBNohTF+5g8U+jQt+PzOCoWZ9yCSFjBnEP3Oc3MwRI'
          mv "$scan" "$ssh_dir/known_hosts"
          printf 'SSH_DIR=%s\n' "$ssh_dir" >> "$GITHUB_ENV"
          printf 'SSH_PORT=%s\n' "$port" >> "$GITHUB_ENV"

      - name: Verify School production SSO surface without mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_args=(
            -p "$SSH_PORT"
            -i "$SSH_DIR/id_ed25519"
            -o IdentitiesOnly=yes
            -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no
            -o KbdInteractiveAuthentication=no
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$SSH_DIR/known_hosts"
            -o GlobalKnownHostsFile=/dev/null
            -o ConnectTimeout=140
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=12
            -o IPQoS=none
            -o Compression=no
            -o KexAlgorithms=curve25519-sha256
            -o HostKeyAlgorithms=ssh-ed25519
            -o PubkeyAcceptedAlgorithms=ssh-ed25519
            -o Ciphers=aes128-ctr
            -o MACs=hmac-sha2-256
          )
          timeout --signal=TERM --kill-after=15s 900s \
            ssh -T "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          origin='https://school-188-225-38-55.sslip.io'
          work="$(mktemp -d /tmp/school-sso-live.XXXXXX)"
          trap 'rm -rf -- "$work"' EXIT
          live=school-1-11
          test "$(docker inspect "$live" --format '{{.State.Running}}')" = true
          printf 'SCHOOL_CONTAINER=%s\n' "$live"
          printf 'SCHOOL_IMAGE_REF=%s\n' "$(docker inspect "$live" --format '{{.Config.Image}}')"
          printf 'SCHOOL_IMAGE_ID=%s\n' "$(docker inspect "$live" --format '{{.Image}}')"
          printf 'SCHOOL_HEALTH=%s\n' "$(docker inspect "$live" --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}')"
          printf 'SCHOOL_STARTED_AT=%s\n' "$(docker inspect "$live" --format '{{.State.StartedAt}}')"
          printf 'SCHOOL_CANDIDATE_SHA=%s\n' "$(docker inspect "$live" --format '{{index .Config.Labels "school.candidate-sha"}}')"
          printf 'SCHOOL_IDENTITY_LABEL=%s\n' "$(docker inspect "$live" --format '{{index .Config.Labels "school.identity-core"}}')"
          for key in SCHOOL_STAFF_SSO_ENABLED SCHOOL_PARENT_OTP_ENABLED SCHOOL_LEGACY_PASSWORD_LOGIN ENABLE_LEGACY_PASSWORD_LOGIN; do
            value="$(docker inspect "$live" --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n "s/^${key}=//p" | head -n1)"
            printf '%s=%s\n' "$key" "$value"
          done
          has_secret="$(docker inspect "$live" --format '{{range .Config.Env}}{{println .}}{{end}}' | awk -F= '$1=="IDENTITY_CORE_SECRET" || $1=="CENTRAL_ACCESS_SECRET" {found=1} END {print found?"yes":"no"}')"
          printf 'SCHOOL_HAS_IDENTITY_SECRET=%s\n' "$has_secret"

          curl -fsS --max-time 20 "$origin/api/health" > "$work/health.json"
          grep -F '"status":"ok"' "$work/health.json" >/dev/null
          printf 'SCHOOL_PUBLIC_HEALTH=OK\n'
          curl -fsS --max-time 20 "$origin/login" > "$work/login.html"
          printf 'SCHOOL_LOGIN_BYTES=%s\n' "$(wc -c < "$work/login.html")"
          for marker in 'data-auth-mode="identity-core-v1"' 'Вход для сотрудников' 'Получить код' 'Постоянный пароль не нужен'; do
            key="$(printf '%s' "$marker" | sha256sum | cut -c1-10)"
            if grep -F "$marker" "$work/login.html" >/dev/null; then
              printf 'SCHOOL_LOGIN_MARKER_%s=yes\n' "$key"
            else
              printf 'SCHOOL_LOGIN_MARKER_%s=no\n' "$key"
            fi
          done
          if grep -E 'name=["'"']password["'"']|type=["'"']password["'"']' "$work/login.html" >/dev/null; then
            printf 'SCHOOL_PUBLIC_PASSWORD_FIELD=yes\n'
          else
            printf 'SCHOOL_PUBLIC_PASSWORD_FIELD=no\n'
          fi

          curl -sS --max-time 20 -D "$work/start.headers" -o /dev/null \
            "$origin/auth/central/start"
          status="$(awk 'NR==1{print $2}' "$work/start.headers")"
          location="$(tr -d '\r' < "$work/start.headers" | sed -n 's/^location: //Ip' | tail -n1)"
          printf 'SCHOOL_SSO_START_STATUS=%s\n' "$status"
          printf 'SCHOOL_SSO_START_LOCATION_HOST=%s\n' "$(python3 - "$location" <<'PY'
          import sys, urllib.parse
          value=sys.argv[1]
          print(urllib.parse.urlparse(value).netloc if value else '')
          PY
          )"
          case "$status" in 302|303|307|308) ;; *) exit 1 ;; esac

          if timeout 30s docker exec "$live" sh -lc \
            "grep -R -F -m1 '/auth/central/start' /app 2>/dev/null" > "$work/start-source.txt"; then
            printf 'SCHOOL_SSO_START_SOURCE=yes\n'
          else
            printf 'SCHOOL_SSO_START_SOURCE=no\n'
          fi
          printf 'SCHOOL_REMOTE_DIAGNOSTIC=PASS\n'
          REMOTE

      - name: Remove temporary SSH material
        if: always()
        shell: bash
        run: |
          set +e
          case "${SSH_DIR:-}" in
            "$RUNNER_TEMP"/school-sso-remote-*) rm -rf -- "$SSH_DIR" ;;
          esac
