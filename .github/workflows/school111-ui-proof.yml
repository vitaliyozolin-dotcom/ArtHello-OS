name: School111 native UI preview proof
on:
  push:
    branches: [build/school111-ui-proof-20260926]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: mobile/school111
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize exact source
        run: |
          python3 - <<'PY'
          import pathlib,lzma,hashlib,json,shutil
          base=pathlib.Path('mobile/school111');packed=b''.join(p.read_bytes() for p in sorted(base.glob('source.part-*')))
          assert hashlib.sha256(packed).hexdigest()=='eaa2985bad3525fa80da2919023b2fe84abe8e0774a7a6efa7d2f0c31b760cf8'
          d=json.loads(lzma.decompress(packed));root=pathlib.Path('native-app');root.mkdir()
          for n,v in d.items():
            p=pathlib.PurePosixPath(n);assert not p.is_absolute() and '..' not in p.parts
            f=root/n;f.parent.mkdir(parents=True,exist_ok=True);f.write_text(v)
          shutil.copy(base/'browser-proof.mts',root/'browser-proof.mts')
          (root/'preview').mkdir();(root/'proof').mkdir()
          PY
      - name: Build preview and test with synthetic API
        working-directory: native-app
        run: |
          set -o pipefail
          npm install --ignore-scripts --no-audit --no-fund
          node -e 'const sharp=require("sharp");sharp("assets/school-logo.svg").resize(768,768).png().toBuffer().then(x=>sharp({create:{width:1024,height:1024,channels:3,background:"#F8F7F4"}}).composite([{input:x,left:128,top:128}]).png().toFile("assets/app-icon-1024.png"))'
          npx playwright install --with-deps chromium
          npx expo export --platform web --output-dir dist-web
          python3 -m http.server 8787 --bind 127.0.0.1 --directory dist-web > proof/http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          node --experimental-transform-types browser-proof.mts 2>&1 | tee proof/browser-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: school111-ui-preview-and-proof
          path: |
            native-app/preview
            native-app/proof
            native-app/browser-proof.mts
          retention-days: 14
