            fi
            BUILDER_STATE_JSON="$state_json" python3 - <<'BUILDER_STATE'
          import json
          import os

          state = json.loads(os.environ["BUILDER_STATE_JSON"])
          if state.get("Running") is not True or state.get("Status") != "running":
              raise RuntimeError("Builder is not running")
          if state.get("Dead") is not False or state.get("Restarting") is not False:
