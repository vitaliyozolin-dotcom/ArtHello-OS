              raise RuntimeError("Control process environment is not empty/allowlisted")
          if role == "installer":
              if command[3:5] != ["bash", "-lc"] or len(command) != 6:
                  raise RuntimeError("Installer process command mismatch")
              if "npm ci" not in command[5] or "--ignore-scripts" not in command[5]:
                  raise RuntimeError("Installer is not exact lockfile-only retrieval")
          else:
