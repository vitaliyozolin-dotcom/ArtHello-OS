          container_present() {
            local inventory
            local name
            local container_id
            local extra
            local matches=0
            if ! inventory="$(
              docker container ls -a --no-trunc --format '{{.Names}}|{{.ID}}'
            )"; then
              return 1
            fi
            PROBED_CONTAINER_ID=""
            while IFS='|' read -r name container_id extra; do
              if [ "$name" = "$container_name" ]; then
                if [ -n "$extra" ] || [[ ! "$container_id" =~ ^[a-f0-9]{64}$ ]]; then
                  return 1
                fi
                matches=$((matches + 1))
                PROBED_CONTAINER_ID="$container_id"
              fi
