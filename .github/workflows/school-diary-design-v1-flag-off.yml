          assert_run_directory() {
            local path="$1"
            local expected_owner="$2"
            local expected_mode="$3"
            local sentinel="$path/owner"
            [ -d "$path" ] && [ ! -L "$path" ] || return 1
            [ "$(stat -c '%u:%g:%a' "$path")" = \
              "$expected_owner:$expected_mode" ] || return 1
            [ -f "$sentinel" ] && [ ! -L "$sentinel" ] || return 1
            [ "$(cat "$sentinel")" = "$owner_value" ] || return 1
          }

          cleanup_exchange() {
            local entry
            local inventory
            local invalid=0
            if [ ! -e "$browser_exchange" ] && [ ! -L "$browser_exchange" ]; then
              return 0
            fi
            assert_run_directory "$browser_exchange" "$runtime_identity" 700 || return 1
            if ! inventory="$(
              find -P "$browser_exchange" -mindepth 1 -maxdepth 1 \
                -printf '%f\n'
            )"; then return 1; fi
            while IFS= read -r entry; do
              [ -n "$entry" ] || continue
              case "$entry" in
                owner|active-side|ready.json|request-base.json|captured-base.json|request-candidate.json|captured-candidate.json|complete.json|failed.json) ;;
                active-side.host.tmp|ready.json.[0-9]*.tmp|captured-base.json.[0-9]*.tmp|captured-candidate.json.[0-9]*.tmp|complete.json.[0-9]*.tmp|failed.json.[0-9]*.tmp|request-base.json.host.tmp|request-candidate.json.host.tmp) ;;
                *) invalid=1 ;;
              esac
              [ -f "$browser_exchange/$entry" ] && \
                [ ! -L "$browser_exchange/$entry" ] || invalid=1
            done <<< "$inventory"
            [ "$invalid" -eq 0 ] || return 1
            [ "${CLEANUP_VALIDATE_ONLY:-no}" = yes ] && return 0
            while IFS= read -r entry; do
              [ -n "$entry" ] || continue
              rm -f -- "$browser_exchange/$entry" || return 1
            done <<< "$inventory"
            rmdir -- "$browser_exchange" || return 1
          }

          cleanup_runtime() {
            local unexpected
            if [ ! -e "$browser_runtime" ] && [ ! -L "$browser_runtime" ]; then
              return 0
            fi
            assert_run_directory "$browser_runtime" "$runtime_identity" 700 || return 1
            if ! unexpected="$(
              find -P "$browser_runtime" -mindepth 1 -maxdepth 1 \
                ! -name owner ! -name package.json ! -name package-lock.json \
                ! -name browser-proxy.mjs ! -name node_modules -print -quit
            )"; then return 1; fi
            [ -z "$unexpected" ] || return 1
            if [ -e "$browser_runtime/node_modules" ] || \
              [ -L "$browser_runtime/node_modules" ]; then
              [ -d "$browser_runtime/node_modules" ] && \
                [ ! -L "$browser_runtime/node_modules" ] || return 1
            fi
            for path in \
              "$browser_runtime/package.json" \
              "$browser_runtime/package-lock.json" \
              "$browser_runtime/browser-proxy.mjs" \
              "$browser_runtime/owner"; do
              if [ -e "$path" ] || [ -L "$path" ]; then
                [ -f "$path" ] && [ ! -L "$path" ] || return 1
              fi
            done
            [ "${CLEANUP_VALIDATE_ONLY:-no}" = yes ] && return 0
            if [ -e "$browser_runtime/node_modules" ]; then
              rm -rf -- "$browser_runtime/node_modules" || return 1
            fi
            for path in \
              "$browser_runtime/package.json" \
              "$browser_runtime/package-lock.json" \
              "$browser_runtime/browser-proxy.mjs" \
              "$browser_runtime/owner"; do
              if [ -e "$path" ]; then rm -f -- "$path" || return 1; fi
            done
            rmdir -- "$browser_runtime" || return 1
          }

          cleanup_transport() {
            local unexpected
            if [ ! -e "$transport_root" ] && [ ! -L "$transport_root" ]; then
              return 0
            fi
            assert_run_directory "$transport_root" "$runtime_identity" 700 || return 1
            if ! unexpected="$(
              find -P "$transport_root" -mindepth 1 -maxdepth 1 \
                ! -name owner ! -name base ! -name candidate -print -quit
            )"; then return 1; fi
            [ -z "$unexpected" ] || return 1
            for side in base candidate; do
              [ -d "$transport_root/$side" ] && \
                [ ! -L "$transport_root/$side" ] || return 1
              [ "$(stat -c '%u:%g:%a' "$transport_root/$side")" = \
                "$runtime_identity:700" ] || return 1
              if ! unexpected="$(
                find -P "$transport_root/$side" -mindepth 1 -maxdepth 1 \
                  -print -quit
              )"; then return 1; fi
              [ -z "$unexpected" ] || return 1
            done
            [ "${CLEANUP_VALIDATE_ONLY:-no}" = yes ] && return 0
            for side in base candidate; do
              rmdir -- "$transport_root/$side" || return 1
            done
            rm -f -- "$transport_root/owner" || return 1
            rmdir -- "$transport_root" || return 1
          }

          cleanup_logs() {
            local entry
            local inventory
            local invalid=0
            if [ ! -e "$log_root" ] && [ ! -L "$log_root" ]; then return 0; fi
            assert_run_directory "$log_root" "$host_uid:$host_gid" 700 || return 1
            if ! inventory="$(
              find -P "$log_root" -mindepth 1 -maxdepth 1 -printf '%f\n'
            )"; then return 1; fi
            while IFS= read -r entry; do
              [ -n "$entry" ] || continue
              case "$entry" in
                owner|browser.log|installer.log|base-prepare.log|base-cleanup.log|candidate-prepare.log|candidate-cleanup.log) ;;
                *) invalid=1 ;;
              esac
              [ -f "$log_root/$entry" ] && [ ! -L "$log_root/$entry" ] || \
                invalid=1
            done <<< "$inventory"
            [ "$invalid" -eq 0 ] || return 1
            [ "${CLEANUP_VALIDATE_ONLY:-no}" = yes ] && return 0
            while IFS= read -r entry; do
              [ -n "$entry" ] || continue
              rm -f -- "$log_root/$entry" || return 1
            done <<< "$inventory"
            rmdir -- "$log_root" || return 1
          }

          validate_control_state() {
            local entry
            local inventory
            local invalid=0
            if [ ! -e "$control_state" ] && [ ! -L "$control_state" ]; then
              return 0
            fi
            assert_run_directory "$control_state" "$host_uid:$host_gid" 700 || return 1
            if ! inventory="$(
              find -P "$control_state" -mindepth 1 -maxdepth 1 -printf '%f\n'
            )"; then return 1; fi
            while IFS= read -r entry; do
              [ -n "$entry" ] || continue
              case "$entry" in
                owner|installer.intent.json|browser.intent.json|installer.cid|browser.cid|installer.cid.pending|browser.cid.pending|fixture.snapshot.sh|fixture.snapshot.sha256) ;;
                *) invalid=1 ;;
              esac
              [ -f "$control_state/$entry" ] && \
                [ ! -L "$control_state/$entry" ] || invalid=1
            done <<< "$inventory"
            [ "$invalid" -eq 0 ] || return 1
            return 0
          }

          emit_failure_logs() {
            local path
            for path in \
              "$installer_log" "$browser_log" \
              "$base_prepare_log" "$base_cleanup_log" \
              "$candidate_prepare_log" "$candidate_cleanup_log"; do
              if [ -f "$path" ] && [ ! -L "$path" ]; then
                printf '===== %s =====\n' "$(basename "$path")" >&2
                tail -n 300 "$path" >&2 || :
              fi
            done
          }

          snapshot_control_logs() {
            if [ -n "$playwright_image_id" ] && \
              [ -n "$installer_container_id" ] && \
              [ -f "$installer_log" ] && [ ! -L "$installer_log" ] && \
              assert_control_container "$installer_name" installer \
                "$playwright_image_id" "$installer_container_id"; then
              docker logs "$installer_container_id" > "$installer_log" 2>&1 || :
            fi
            if [ -n "$playwright_image_id" ] && \
              [ -n "$browser_container_id" ] && \
              [ -f "$browser_log" ] && [ ! -L "$browser_log" ] && \
              assert_control_container "$browser_name" browser \
                "$playwright_image_id" "$browser_container_id"; then
              docker logs "$browser_container_id" > "$browser_log" 2>&1 || :
            fi
          }

          cleanup_all() {
            local cleanup_rc=0
            local controls_absent=yes
            local browser_absent=yes
            local fixtures_absent=yes
            local target
            local side
            local log_path

            if [ -n "$playwright_image_id" ]; then
              if ! remove_control_container \
                "$browser_name" browser "$playwright_image_id" \
                "$browser_container_id" validate; then cleanup_rc=1; fi
              if ! remove_control_container \
                "$installer_name" installer "$playwright_image_id" \
                "$installer_container_id" validate; then cleanup_rc=1; fi
              if [ "$cleanup_rc" -eq 0 ]; then
                remove_control_container "$browser_name" browser \
                  "$playwright_image_id" "$browser_container_id" mutate || \
                  cleanup_rc=1
                if [ "$cleanup_rc" -eq 0 ]; then
                  remove_control_container "$installer_name" installer \
                    "$playwright_image_id" "$installer_container_id" mutate || \
                    cleanup_rc=1
                fi
              fi
            fi
            for target in "$browser_name" "$installer_name"; do
              PROBED_CONTAINER_PRESENT=yes
              if ! probe_exact_container "$target"; then
                controls_absent=no
                cleanup_rc=1
                if [ "$target" = "$browser_name" ]; then browser_absent=no; fi
              elif [ "$PROBED_CONTAINER_PRESENT" != no ]; then
                controls_absent=no
                cleanup_rc=1
                if [ "$target" = "$browser_name" ]; then browser_absent=no; fi
              fi
            done

            for side in base candidate; do
              if [ "$side" = base ]; then
                audit_sha="$BASE_SHA"
                audit_image="$BASE_OFF_IMAGE"
                audit_image_id="$BASE_IMAGE_ID"
                audit_source=base-migrations-only
                log_path="$base_cleanup_log"
              else
                audit_sha="$REVIEWED_CANDIDATE_SHA"
                audit_image="$CANDIDATE_OFF_IMAGE"
                audit_image_id="$CANDIDATE_IMAGE_ID"
                audit_source=candidate-migrations-only
                log_path="$candidate_cleanup_log"
              fi
              if [ -d "$log_root" ] && [ ! -L "$log_root" ]; then
                if ! local_fixture cleanup "$side" "$audit_sha" "$audit_image" \
                  "$audit_image_id" "$audit_source" >> "$log_path" 2>&1; then
                  cleanup_rc=1
                fi
              elif ! local_fixture cleanup "$side" "$audit_sha" "$audit_image" \
                "$audit_image_id" "$audit_source" >/dev/null 2>&1; then
                cleanup_rc=1
              fi
            done
            for side in base candidate; do
              for target in \
                "school-1-11-authorized-visual-$run_instance-$side" \
                "school-1-11-authorized-visual-$run_instance-$side-proxy"; do
                PROBED_CONTAINER_PRESENT=yes
                if ! probe_exact_container "$target"; then
                  fixtures_absent=no
                  cleanup_rc=1
                elif [ "$PROBED_CONTAINER_PRESENT" != no ]; then
                  fixtures_absent=no
                  cleanup_rc=1
                fi
              done
              for path in \
                "$RUNNER_TEMP/school-authorized-visual-$run_instance-$side" \
                "$RUNNER_TEMP/school-authorized-visual-$run_instance-$side.pending"; do
                if [ -e "$path" ] || [ -L "$path" ]; then
                  fixtures_absent=no
                  cleanup_rc=1
                fi
              done
            done

            # Phase one is read-only and common to every eligible filesystem
            # target. No file is removed if any validation or prior cleanup failed.
            if [ "$browser_absent" = yes ] && \
              ! CLEANUP_VALIDATE_ONLY=yes cleanup_exchange; then cleanup_rc=1; fi
            if [ "$controls_absent" = yes ] && \
              ! CLEANUP_VALIDATE_ONLY=yes cleanup_runtime; then cleanup_rc=1; fi
            if [ "$browser_absent" = yes ] && [ "$fixtures_absent" = yes ] && \
              ! CLEANUP_VALIDATE_ONLY=yes cleanup_transport; then cleanup_rc=1; fi
            if ! CLEANUP_VALIDATE_ONLY=yes cleanup_logs; then cleanup_rc=1; fi

            # Phase two mutates only after the whole read-only plan passed.
            if [ "$cleanup_rc" -eq 0 ]; then
              if [ "$browser_absent" = yes ]; then cleanup_exchange || cleanup_rc=1; fi
              if [ "$controls_absent" = yes ]; then cleanup_runtime || cleanup_rc=1; fi
              if [ "$browser_absent" = yes ] && [ "$fixtures_absent" = yes ]; then
                cleanup_transport || cleanup_rc=1
              fi
              cleanup_logs || cleanup_rc=1
            fi
            return "$cleanup_rc"
          }

          finish_capture() {
            local rc=$?
            local cleanup_rc=0
            trap - EXIT INT TERM HUP
            if [ "$rc" -ne 0 ]; then
              snapshot_control_logs
              emit_failure_logs
            fi
            if ! cleanup_all; then cleanup_rc=1; fi
            if [ "$rc" -eq 0 ] && [ "$cleanup_rc" -ne 0 ]; then rc=1; fi
            exit "$rc"
          }

          # No mutable action and no external helper execution is allowed until
          # all three controls are bound byte-for-byte to this exact commit and
          # to the evidence owner sentinel.
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          for control_path in \
            .github/workflows/school-diary-design-v1-flag-off.yml \
            .github/scripts/school-authorized-visual-fixture.sh \
            .github/scripts/school-flag-off-capture.mjs; do
            test -f "$control_path"
            test ! -L "$control_path"
            control_blob="$(git rev-parse "$GITHUB_SHA:$control_path")"
            [[ "$control_blob" =~ ^[a-f0-9]{40}$ ]]
            test "$(git cat-file -t "$control_blob")" = blob
            test "$(git hash-object -- "$control_path")" = "$control_blob"
          done
          workflow_sha256="$(sha256sum \
            .github/workflows/school-diary-design-v1-flag-off.yml | cut -d' ' -f1)"
          fixture_sha256="$(sha256sum \
            .github/scripts/school-authorized-visual-fixture.sh | cut -d' ' -f1)"
          capture_sha256="$(sha256sum \
            .github/scripts/school-flag-off-capture.mjs | cut -d' ' -f1)"
          WORKFLOW_SHA256="$workflow_sha256" \
          FIXTURE_SHA256="$fixture_sha256" \
          CAPTURE_SHA256="$capture_sha256" \
          python3 - <<'OWNER'
          import json
          import os
          import pathlib
          import re

          root = pathlib.Path(os.environ["EVIDENCE_DIR"])
          owner_path = root / "evidence-owner.json"
          owner = json.loads(owner_path.read_text(encoding="utf-8"))
          if set(owner) != {
              "version", "repository", "runId", "runAttempt", "controlSha", "controls"
          }:
              raise RuntimeError("Wrong evidence owner schema")
          controls = {
              "workflowSha256": os.environ["WORKFLOW_SHA256"],
              "fixtureSha256": os.environ["FIXTURE_SHA256"],
              "captureSha256": os.environ["CAPTURE_SHA256"],
          }
          if any(not re.fullmatch(r"[a-f0-9]{64}", value) for value in controls.values()):
              raise RuntimeError("Wrong control digest")
          expected = {
              "version": "1.1.0",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "runId": os.environ["GITHUB_RUN_ID"],
              "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "controlSha": os.environ["GITHUB_SHA"],
              "controls": controls,
          }
          if owner != expected:
              raise RuntimeError("Wrong evidence owner provenance")
          if owner_path.is_symlink() or owner_path.stat().st_mode & 0o777 != 0o600:
              raise RuntimeError("Wrong evidence owner file")
          entries = sorted(path.name for path in root.iterdir())
          if entries != ["evidence-owner.json"]:
              raise RuntimeError("Evidence was mutated before capture")
          OWNER

          # From this point a bootstrap trap retains every partial recovery
          # journal. It deliberately cannot call the fixture helper or Docker.
          finish_bootstrap() {
            local rc=$?
            trap - EXIT INT TERM HUP
            exit "$rc"
          }
          trap finish_bootstrap EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM HUP

          for path in "$control_state" "$docker_config"; do
            test ! -e "$path"
            test ! -L "$path"
          done
          install -m 0700 -d "$control_state"
          printf '%s\n' "$owner_value" > "$control_state/owner"
          chmod 0600 "$control_state/owner"
          install -m 0500 \
            .github/scripts/school-authorized-visual-fixture.sh \
            "$fixture_snapshot.tmp"
          test "$(sha256sum "$fixture_snapshot.tmp" | cut -d' ' -f1)" = \
            "$fixture_sha256"
          mv -T -- "$fixture_snapshot.tmp" "$fixture_snapshot"
          printf '%s\n' "$fixture_sha256" > "$fixture_snapshot_digest"
          chmod 0400 "$fixture_snapshot_digest"
          test -f "$fixture_snapshot"
          test ! -L "$fixture_snapshot"
          test "$(stat -c '%u:%g:%a' "$fixture_snapshot")" = \
            "$host_uid:$host_gid:500"
          test "$(stat -c '%u:%g:%a' "$fixture_snapshot_digest")" = \
            "$host_uid:$host_gid:400"
          test "$(cat "$fixture_snapshot_digest")" = "$fixture_sha256"
          test "$(sha256sum "$fixture_snapshot" | cut -d' ' -f1)" = \
            "$fixture_sha256"
          helper_trusted=yes

          test -S /var/run/docker.sock
          test ! -L /var/run/docker.sock
          test "$(realpath -e /var/run/docker.sock)" = /var/run/docker.sock
          install -m 0700 -d "$docker_config"
          printf '%s\n' "$owner_value" > "$docker_config/owner"
          chmod 0600 "$docker_config/owner"
          printf '{}\n' > "$docker_config/config.json"
          chmod 0600 "$docker_config/config.json"
          test "$(cat "$docker_config/config.json")" = '{}'
          test "$(stat -c '%u:%g:%a' "$docker_config")" = \
            "$host_uid:$host_gid:700"
          docker_boundary_ready=yes
          docker version --format '{{.Server.Version}}' | \
            grep -E '^[0-9]+\.[0-9]+\.[0-9]+' >/dev/null

          # The full trap is installed only after the helper snapshot and local
          # Docker UDS boundary have independently passed validation.
          trap finish_capture EXIT
          printf '::add-mask::%s\n' "$audit_password"
          printf '::add-mask::%s\n' "$handshake_token"
          printf 'AUDIT_SEED_DATE=%s\n' "$audit_seed_date" >> "$GITHUB_ENV"

          for path in \
            "$browser_exchange" "$browser_runtime" "$transport_root" \
            "$log_root"; do
            test ! -e "$path"
            test ! -L "$path"
          done
          install -m 0700 -d \
            "$browser_exchange" "$browser_runtime" \
            "$transport_root" "$transport_root/base" "$transport_root/candidate" \
            "$log_root"
          chown "$runtime_identity" \
            "$browser_exchange" "$browser_runtime" \
            "$transport_root" "$transport_root/base" "$transport_root/candidate"
          chown "$runtime_identity" "$EVIDENCE_DIR"
          for path in \
            "$browser_exchange" "$browser_runtime" \
            "$transport_root" "$transport_root/base" "$transport_root/candidate"; do
            test "$(stat -c '%u:%g:%a' "$path")" = "$runtime_identity:700"
          done
          test "$(stat -c '%u:%g:%a' "$log_root")" = "$host_uid:$host_gid:700"
          test "$(stat -c '%u:%g:%a' "$control_state")" = \
            "$host_uid:$host_gid:700"
          test "$(stat -c '%u:%g:%a' "$EVIDENCE_DIR")" = "$runtime_identity:700"

          for path in "$browser_exchange" "$browser_runtime" "$transport_root"; do
            printf '%s\n' "$owner_value" > "$path/owner"
            chown "$runtime_identity" "$path/owner"
            chmod 0600 "$path/owner"
          done
          printf '%s\n' "$owner_value" > "$log_root/owner"
          chmod 0600 "$log_root/owner"
          for path in \
            "$browser_log" "$installer_log" \
            "$base_prepare_log" "$base_cleanup_log" \
            "$candidate_prepare_log" "$candidate_cleanup_log"; do
            install -m 0600 /dev/null "$path"
          done

          cat > "$browser_runtime/package.json" <<'PACKAGE'
          {
            "name": "school-flag-off-browser-control",
            "private": true,
            "version": "1.0.0",
            "dependencies": {
              "playwright": "1.55.0"
            }
          }
          PACKAGE
          cat > "$browser_runtime/package-lock.json" <<'PACKAGE_LOCK'
          {
            "name": "school-flag-off-browser-control",
            "version": "1.0.0",
            "lockfileVersion": 3,
            "requires": true,
            "packages": {
              "": {
                "name": "school-flag-off-browser-control",
                "version": "1.0.0",
                "dependencies": {"playwright": "1.55.0"}
              },
              "node_modules/fsevents": {
                "version": "2.3.2",
                "resolved": "https://registry.npmjs.org/fsevents/-/fsevents-2.3.2.tgz",
                "integrity": "sha512-xiqMQR4xAeHTuB9uWm+fFRcIOgKBMiOBP+eXiyT7jsgVCq1bkVygt00oASowB7EdtpOHaaPgKt812P9ab+DDKA==",
                "hasInstallScript": true,
                "license": "MIT",
                "optional": true,
                "os": ["darwin"],
                "engines": {"node": "^8.16.0 || ^10.6.0 || >=11.0.0"}
              },
              "node_modules/playwright": {
                "version": "1.55.0",
                "resolved": "https://registry.npmjs.org/playwright/-/playwright-1.55.0.tgz",
                "integrity": "sha512-sdCWStblvV1YU909Xqx0DhOjPZE4/5lJsIS84IfN9dAZfcl/CIZ5O8l3o0j7hPMjDvqoTF8ZUcc+i/GL5erstA==",
                "license": "Apache-2.0",
                "dependencies": {"playwright-core": "1.55.0"},
                "bin": {"playwright": "cli.js"},
                "engines": {"node": ">=18"},
                "optionalDependencies": {"fsevents": "2.3.2"}
              },
              "node_modules/playwright-core": {
                "version": "1.55.0",
                "resolved": "https://registry.npmjs.org/playwright-core/-/playwright-core-1.55.0.tgz",
                "integrity": "sha512-GvZs4vU3U5ro2nZpeiwyb0zuFaqb9sUiAJuyrWpcGouD8y9/HLgGbNRjIph7zU9D3hnPaisMl9zG9CgFi/biIg==",
                "license": "Apache-2.0",
                "bin": {"playwright-core": "cli.js"},
                "engines": {"node": ">=18"}
              }
            }
          }
          PACKAGE_LOCK
          cat > "$browser_runtime/browser-proxy.mjs" <<'BROWSER_PROXY'
          import { readFileSync } from 'node:fs';
          import { createServer, connect } from 'node:net';

          const server = createServer((client) => {
            let side;
            try {
              side = readFileSync('/exchange/active-side', 'utf8').trim();
            } catch {
              client.destroy();
              return;
            }
            if (!new Set(['base', 'candidate']).has(side)) {
              client.destroy();
              return;
            }
            const upstream = connect({ path: `/transport/${side}/audit.sock` });
            client.on('error', () => upstream.destroy());
            upstream.on('error', () => client.destroy());
            client.pipe(upstream);
            upstream.pipe(client);
          });
          server.listen(33212, '127.0.0.1', () => {
            console.log('SCHOOL_FLAG_OFF_BROWSER_PROXY=READY');
          });
          BROWSER_PROXY
          chown "$runtime_identity" \
            "$browser_runtime/package.json" \
            "$browser_runtime/package-lock.json" \
            "$browser_runtime/browser-proxy.mjs"
          chmod 0600 "$browser_runtime/package.json"
          chmod 0400 "$browser_runtime/package-lock.json"
          chmod 0444 "$browser_runtime/browser-proxy.mjs"

          proxy_sha256="$(sha256sum "$browser_runtime/browser-proxy.mjs" | \
            cut -d' ' -f1)"
          package_sha256="$(sha256sum "$browser_runtime/package.json" | \
            cut -d' ' -f1)"
          lock_sha256="$(sha256sum "$browser_runtime/package-lock.json" | \
            cut -d' ' -f1)"
          [[ "$proxy_sha256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$package_sha256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$lock_sha256" =~ ^[a-f0-9]{64}$ ]]

          # The only networked control is this public dependency installer. It
          # receives neither repository credentials nor project/runtime secrets.
          # A registry-IP firewall would be brittle because the public registry
          # uses changing CDN addresses. On the ephemeral ubuntu-24.04 runner the
          # bridge has no ArtHello private LAN; retrieval is therefore reduced to
          # `npm ci` over the three exact lockfile URLs, with pinned integrity and
          # lifecycle scripts disabled. The evidence browser remains network none.
          docker_bounded 600 pull "$PLAYWRIGHT_IMAGE"
          playwright_image_id="$(
            docker image inspect "$PLAYWRIGHT_IMAGE" --format '{{.Id}}'
          )"
          [[ "$playwright_image_id" =~ ^sha256:[a-f0-9]{64}$ ]]
          PLAYWRIGHT_REPO_DIGESTS="$(
            docker image inspect "$PLAYWRIGHT_IMAGE" \
              --format '{{json .RepoDigests}}'
          )" python3 - <<'PLAYWRIGHT_PROVENANCE'
          import json
          import os

          digests = json.loads(os.environ["PLAYWRIGHT_REPO_DIGESTS"])
          if os.environ["PLAYWRIGHT_IMAGE"] not in digests:
              raise RuntimeError("Pinned Playwright digest is absent")
          PLAYWRIGHT_PROVENANCE
          playwright_image_env_json="$(
            docker image inspect "$PLAYWRIGHT_IMAGE" \
              --format '{{json .Config.Env}}'
          )"
          PLAYWRIGHT_IMAGE_ENV_JSON="$playwright_image_env_json" \
            python3 - <<'IMAGE_ENV'
          import json
          import os

          values = json.loads(os.environ["PLAYWRIGHT_IMAGE_ENV_JSON"])
          if not isinstance(values, list):
              raise RuntimeError("Pinned image environment is unavailable")
          seen = set()
          forbidden = (
              "PROXY", "TOKEN", "PASSWORD", "SECRET", "CREDENTIAL", "AUTH",
              "DOCKER", "GITHUB", "BUILDKIT", "AUDIT_",
          )
          for entry in values:
              key, separator, _ = entry.partition("=")
              if not separator or not key or key in seen:
                  raise RuntimeError("Pinned image environment schema mismatch")
              seen.add(key)
              if any(fragment in key.upper() for fragment in forbidden):
                  raise RuntimeError(f"Forbidden pinned image environment: {key}")
          IMAGE_ENV

          probe_exact_container "$installer_name"
          test "$PROBED_CONTAINER_PRESENT" = no
          installer_script='set -Eeuo pipefail
          umask 077
          install -m 0700 -d "$HOME"
          cd /runtime
          npm ci --silent --ignore-scripts --no-audit --no-fund'
          installer_process_args=(
            -i
            PATH=/usr/local/bin:/usr/bin:/bin
            HOME=/tmp/home
            bash -lc "$installer_script"
          )
          write_control_intent installer "${installer_process_args[@]}"
          test ! -e "$control_state/installer.cid.pending"
          test ! -L "$control_state/installer.cid.pending"
          installer_container_id="$(
            docker create \
              --cidfile "$control_state/installer.cid.pending" \
              --name "$installer_name" \
              --network bridge \
              --user "$runtime_identity" \
              --read-only \
              --tmpfs "/tmp:rw,noexec,nosuid,nodev,size=536870912,mode=1770,uid=$runtime_uid,gid=$runtime_gid" \
              --memory 1073741824 \
              --memory-swap 1073741824 \
              --cpus 1.0 \
              --pids-limit 256 \
              --security-opt no-new-privileges:true \
              --cap-drop ALL \
              --restart=no \
              --log-driver local \
              --log-opt max-size=10m \
              --log-opt max-file=1 \
              --label school.system=school-1-11 \
              --label school.environment=synthetic \
              --label school.purpose=flag-off-browser-control \
              --label school.browser-role=installer \
              --label "school.audit-repository=$GITHUB_REPOSITORY" \
              --label "school.audit-run-id=$GITHUB_RUN_ID" \
              --label "school.audit-run-attempt=$GITHUB_RUN_ATTEMPT" \
              --label "school.runtime-uid=$runtime_uid" \
              --label "school.runtime-gid=$runtime_gid" \
              --label "school.control-sha=$GITHUB_SHA" \
              --mount \
                type=bind,source="$browser_runtime",target=/runtime \
              --entrypoint /usr/bin/env "$playwright_image_id" \
              "${installer_process_args[@]}"
          )"
          [[ "$installer_container_id" =~ ^[a-f0-9]{64}$ ]]
          record_control_id installer "$installer_container_id"
          assert_control_config "$installer_name" installer \
            "$playwright_image_id" "$installer_container_id"
          docker start "$installer_container_id" >/dev/null

          wait_control_exit() {
            local target="$1"
            local role="$2"
            local expected_id="$3"
            local max_seconds="$4"
            local status
            local attempt
            for ((attempt = 0; attempt < max_seconds; attempt++)); do
              assert_control_container "$target" "$role" \
                "$playwright_image_id" "$expected_id" || return 1
              if ! status="$(docker inspect "$expected_id" \
                --format '{{.State.Status}}')"; then return 1; fi
              case "$status" in
                exited) return 0 ;;
                created|running) ;;
                *) printf 'Unexpected %s state: %s\n' \
                     "$role" "$status" >&2; return 1 ;;
              esac
              sleep 1
            done
            printf '%s did not exit within %s seconds\n' \
              "$role" "$max_seconds" >&2
            return 1
          }

          wait_control_exit "$installer_name" installer \
            "$installer_container_id" 300
          docker logs "$installer_container_id" > "$installer_log" 2>&1 || {
            cat "$installer_log" >&2 || :
            exit 1
          }
          cat "$installer_log"
          test "$(docker inspect "$installer_container_id" \
            --format '{{.State.ExitCode}}')" = 0
          test "$(docker inspect "$installer_container_id" \
            --format '{{.State.OOMKilled}}')" = false
          test -z "$(docker inspect "$installer_container_id" \
            --format '{{.State.Error}}')"
          remove_control_container "$installer_name" installer \
            "$playwright_image_id" "$installer_container_id" validate
          remove_control_container "$installer_name" installer \
            "$playwright_image_id" "$installer_container_id" mutate

          for path in \
            "$browser_runtime/package.json" \
            "$browser_runtime/package-lock.json" \
            "$browser_runtime/browser-proxy.mjs"; do
            test -f "$path"
            test ! -L "$path"
            test "$(stat -c '%u:%g' "$path")" = "$runtime_identity"
          done
          test -d "$browser_runtime/node_modules"
          test ! -L "$browser_runtime/node_modules"
          test "$(stat -c '%u:%g' "$browser_runtime/node_modules")" = \
            "$runtime_identity"
          test "$(sha256sum "$browser_runtime/browser-proxy.mjs" | \
            cut -d' ' -f1)" = "$proxy_sha256"
          test "$(sha256sum "$browser_runtime/package.json" | \
            cut -d' ' -f1)" = "$package_sha256"
          test "$(sha256sum "$browser_runtime/package-lock.json" | \
            cut -d' ' -f1)" = "$lock_sha256"
          chmod 0444 \
            "$browser_runtime/package.json" \
            "$browser_runtime/package-lock.json" \
            "$browser_runtime/browser-proxy.mjs"
          RUNTIME="$browser_runtime" node - <<'VERIFY_RUNTIME'
          const fs = require('node:fs');
          const path = process.env.RUNTIME;
          const rootPackage = JSON.parse(fs.readFileSync(path + '/package.json', 'utf8'));
          if (JSON.stringify(Object.keys(rootPackage).sort()) !==
              JSON.stringify(['dependencies', 'name', 'private', 'version'])) {
            throw new Error('Wrong browser root package schema');
          }
          if (rootPackage.name !== 'school-flag-off-browser-control' ||
              rootPackage.private !== true || rootPackage.version !== '1.0.0' ||
              JSON.stringify(rootPackage.dependencies) !==
                JSON.stringify({playwright: '1.55.0'})) {
            throw new Error('Wrong browser root package');
          }
          const lock = JSON.parse(fs.readFileSync(path + '/package-lock.json', 'utf8'));
          if (lock.name !== 'school-flag-off-browser-control' ||
              lock.version !== '1.0.0' || lock.lockfileVersion !== 3 ||
              lock.requires !== true) {
            throw new Error('Wrong browser lock root');
          }
          const packages = lock.packages;
          const expectedPackageKeys = [
            '', 'node_modules/fsevents', 'node_modules/playwright',
            'node_modules/playwright-core',
          ];
          if (JSON.stringify(Object.keys(packages).sort()) !==
              JSON.stringify(expectedPackageKeys.sort())) {
            throw new Error('Unexpected browser lock package');
          }
          if (JSON.stringify(packages[''].dependencies) !==
              JSON.stringify({playwright: '1.55.0'})) {
            throw new Error('Wrong browser lock dependency');
          }
          const expected = {
            'node_modules/playwright': [
              '1.55.0',
              'sha512-sdCWStblvV1YU909Xqx0DhOjPZE4/5lJsIS84IfN9dAZfcl/CIZ5O8l3o0j7hPMjDvqoTF8ZUcc+i/GL5erstA==',
            ],
            'node_modules/playwright-core': [
              '1.55.0',
              'sha512-GvZs4vU3U5ro2nZpeiwyb0zuFaqb9sUiAJuyrWpcGouD8y9/HLgGbNRjIph7zU9D3hnPaisMl9zG9CgFi/biIg==',
            ],
          };
          for (const [key, [version, integrity]] of Object.entries(expected)) {
            if (packages[key]?.version !== version ||
                packages[key]?.integrity !== integrity) {
              throw new Error('Wrong browser package provenance: ' + key);
            }
          }
          if (packages['node_modules/fsevents'].version !== '2.3.2' ||
              packages['node_modules/fsevents'].resolved !==
                'https://registry.npmjs.org/fsevents/-/fsevents-2.3.2.tgz' ||
              packages['node_modules/fsevents'].integrity !==
                'sha512-xiqMQR4xAeHTuB9uWm+fFRcIOgKBMiOBP+eXiyT7jsgVCq1bkVygt00oASowB7EdtpOHaaPgKt812P9ab+DDKA==' ||
              packages['node_modules/fsevents'].optional !== true ||
              JSON.stringify(packages['node_modules/fsevents'].os) !==
                JSON.stringify(['darwin'])) {
            throw new Error('Wrong fsevents platform guard');
          }
          for (const [file, version] of [
            ['node_modules/playwright/package.json', '1.55.0'],
            ['node_modules/playwright-core/package.json', '1.55.0'],
          ]) {
            if (JSON.parse(fs.readFileSync(path + '/' + file, 'utf8')).version !== version) {
              throw new Error('Wrong installed browser package: ' + file);
            }
          }
          const topLevel = fs.readdirSync(path + '/node_modules').sort();
          if (JSON.stringify(topLevel) !==
              JSON.stringify(['.bin', '.package-lock.json', 'playwright', 'playwright-core'])) {
            throw new Error('Unexpected installed browser package');
          }
          const cliLink = path + '/node_modules/.bin/playwright';
          if (!fs.lstatSync(cliLink).isSymbolicLink() ||
              fs.readlinkSync(cliLink) !== '../playwright/cli.js') {
            throw new Error('Wrong Playwright executable link');
          }
          VERIFY_RUNTIME

          wait_browser_marker() {
            local marker="$1"
            local max_seconds="$2"
            local attempt
            local status
            for ((attempt = 0; attempt < max_seconds; attempt++)); do
              if [ -s "$marker" ] && [ -f "$marker" ] && [ ! -L "$marker" ]; then
                return 0
              fi
              if [ -s "$browser_exchange/failed.json" ] && \
                [ -f "$browser_exchange/failed.json" ] && \
                [ ! -L "$browser_exchange/failed.json" ]; then
                cat "$browser_exchange/failed.json" >&2
                docker logs "$browser_container_id" >&2 || :
                return 1
              fi
              assert_control_container "$browser_name" browser \
                "$playwright_image_id" "$browser_container_id" || return 1
              if ! status="$(docker inspect "$browser_container_id" \
                --format '{{.State.Status}}')"; then return 1; fi
              case "$status" in
                created|running) ;;
                exited)
                  docker logs "$browser_container_id" >&2 || :
                  return 1
                  ;;
                *) printf 'Unexpected browser state: %s\n' "$status" >&2; return 1 ;;
              esac
              sleep 1
            done
            printf 'Browser marker timeout: %s\n' "$marker" >&2
            return 1
          }

          validate_browser_marker() {
            local marker="$1"
            local expected_state="$2"
            local expected_side="${3:-}"
            local expected_sha="${4:-}"
            local expected_id="${5:-}"
            MARKER="$marker" EXPECTED_STATE="$expected_state" \
              EXPECTED_SIDE="$expected_side" EXPECTED_SHA="$expected_sha" \
              EXPECTED_ID="$expected_id" BROWSER_SESSION="$browser_session" \
              HANDSHAKE_TOKEN="$handshake_token" python3 - <<'MARKER'
          import json
          import os
          import pathlib
          import re

          path = pathlib.Path(os.environ["MARKER"])
          if not path.is_file() or path.is_symlink():
              raise RuntimeError("Invalid browser marker file")
          with path.open(encoding="utf-8") as source:
              marker = json.load(source)
          state = os.environ["EXPECTED_STATE"]
          common = {
              "version": "1.0.0",
              "runId": os.environ["GITHUB_RUN_ID"],
              "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "controlSha": os.environ["GITHUB_SHA"],
              "token": os.environ["HANDSHAKE_TOKEN"],
              "state": state,
          }
          if state == "ready":
              keys = set(common) | {"browserSessionId", "expectedSides"}
          elif state == "captured":
              keys = set(common) | {
                  "browserSessionId", "side", "auditSha", "auditImageId", "captures",
              }
          elif state == "complete":
              keys = set(common) | {"browserSessionId", "sides"}
          else:
              raise RuntimeError("Unsupported marker state")
          if set(marker) != keys:
              raise RuntimeError("Wrong browser marker schema")
          if any(marker.get(key) != value for key, value in common.items()):
              raise RuntimeError("Wrong browser marker provenance")
          session = marker["browserSessionId"]
          if not re.fullmatch(
              r"[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}",
              session,
          ):
              raise RuntimeError("Invalid browser session")
          expected_session = os.environ["BROWSER_SESSION"]
          if expected_session and session != expected_session:
              raise RuntimeError("Browser process changed")
          if state == "ready" and marker["expectedSides"] != ["base", "candidate"]:
              raise RuntimeError("Wrong browser side order")
          if state == "captured" and (
              marker["side"] != os.environ["EXPECTED_SIDE"]
              or marker["auditSha"] != os.environ["EXPECTED_SHA"]
              or marker["auditImageId"] != os.environ["EXPECTED_ID"]
              or marker["captures"] != 12
          ):
              raise RuntimeError("Wrong captured marker")
          if state == "complete" and marker["sides"] != ["base", "candidate"]:
              raise RuntimeError("Incomplete browser run")
          print(session)
          MARKER
          }

          signal_browser_capture() {
            local side="$1"
            local audit_sha="$2"
            local audit_image_id="$3"
            local active="$browser_exchange/active-side"
            local active_tmp="$browser_exchange/active-side.host.tmp"
            local request="$browser_exchange/request-$side.json"
            local request_tmp="$request.host.tmp"
            for path in "$active_tmp" "$request" "$request_tmp"; do
              [ ! -e "$path" ] && [ ! -L "$path" ] || return 1
            done
            if [ -e "$active" ] || [ -L "$active" ]; then
              [ -f "$active" ] && [ ! -L "$active" ] || return 1
            fi
            (set -C; printf '%s\n' "$side" > "$active_tmp") || return 1
            chmod 0600 "$active_tmp" || return 1
            mv -T -- "$active_tmp" "$active" || return 1
            REQUEST_TMP="$request_tmp" SIDE="$side" AUDIT_SHA="$audit_sha" \
              AUDIT_IMAGE_ID="$audit_image_id" \
              BROWSER_SESSION="$browser_session" \
              HANDSHAKE_TOKEN="$handshake_token" \
              python3 - <<'REQUEST'
          import json
          import os
          import pathlib

          path = pathlib.Path(os.environ["REQUEST_TMP"])
          descriptor = os.open(
              path,
              os.O_WRONLY | os.O_CREAT | os.O_EXCL | getattr(os, "O_NOFOLLOW", 0),
              0o600,
          )
          payload = {
              "version": "1.0.0",
              "runId": os.environ["GITHUB_RUN_ID"],
              "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "controlSha": os.environ["GITHUB_SHA"],
              "token": os.environ["HANDSHAKE_TOKEN"],
              "browserSessionId": os.environ["BROWSER_SESSION"],
              "side": os.environ["SIDE"],
              "auditSha": os.environ["AUDIT_SHA"],
              "auditImageId": os.environ["AUDIT_IMAGE_ID"],
              "seedDate": os.environ["AUDIT_SEED_DATE"],
          }
          with os.fdopen(descriptor, "w", encoding="utf-8") as target:
              json.dump(payload, target, separators=(",", ":"), sort_keys=True)
              target.write("\n")
              target.flush()
              os.fsync(target.fileno())
          REQUEST
            mv -T -- "$request_tmp" "$request" || return 1
          }

          probe_exact_container "$browser_name"
          test "$PROBED_CONTAINER_PRESENT" = no
          browser_script="$(cat <<'BROWSER_COMMAND'
          set -Eeuo pipefail
          umask 077
          install -m 0700 -d "$HOME"
          work="$(mktemp -d /tmp/school-flag-off-capture.XXXXXX)"
          proxy_pid=""
          finish_inner() {
            rc=$?
            trap - EXIT INT TERM HUP
            if [ -n "$proxy_pid" ]; then
              kill "$proxy_pid" >/dev/null 2>&1 || :
              wait "$proxy_pid" >/dev/null 2>&1 || :
            fi
            rm -rf -- "$work"
            exit "$rc"
          }
          trap finish_inner EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM HUP
          cd "$work"
          ln -s /runtime/node_modules ./node_modules
          cp /control/capture.mjs ./capture.mjs
          node /runtime/browser-proxy.mjs &
          proxy_pid=$!
          node capture.mjs
          BROWSER_COMMAND
          )"
          browser_process_args=(
            -i
            PATH=/usr/local/bin:/usr/bin:/bin
            HOME=/tmp/home
            "AUDIT_ORIGIN=$AUDIT_ORIGIN"
            "AUDIT_PASSWORD=$audit_password"
            "AUDIT_RUN_ID=$GITHUB_RUN_ID"
            "AUDIT_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
            "AUDIT_SEED_DATE=$audit_seed_date"
            "AUDIT_CONTROL_SHA=$GITHUB_SHA"
            "AUDIT_BASE_SHA=$BASE_SHA"
            "AUDIT_BASE_IMAGE_ID=$BASE_IMAGE_ID"
            "AUDIT_CANDIDATE_SHA=$REVIEWED_CANDIDATE_SHA"
            "AUDIT_CANDIDATE_IMAGE_ID=$CANDIDATE_IMAGE_ID"
            "AUDIT_HANDSHAKE_TOKEN=$handshake_token"
            AUDIT_EXCHANGE_DIR=/exchange
            AUDIT_OUTPUT_ROOT=/output
            PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
            bash -lc "$browser_script"
          )
          write_control_intent browser "${browser_process_args[@]}"
          test ! -e "$control_state/browser.cid.pending"
          test ! -L "$control_state/browser.cid.pending"
          browser_container_id="$(
            docker create \
              --cidfile "$control_state/browser.cid.pending" \
              --name "$browser_name" \
              --init \
              --network none \
              --user "$runtime_identity" \
              --read-only \
              --tmpfs "/tmp:rw,nosuid,nodev,size=2147483648,mode=1770,uid=$runtime_uid,gid=$runtime_gid" \
              --shm-size 1073741824 \
              --memory 4294967296 \
              --memory-swap 4294967296 \
              --cpus 2.5 \
              --pids-limit 512 \
              --security-opt no-new-privileges:true \
              --cap-drop ALL \
              --restart=no \
              --log-driver local \
              --log-opt max-size=20m \
              --log-opt max-file=1 \
              --label school.system=school-1-11 \
              --label school.environment=synthetic \
              --label school.purpose=flag-off-browser-control \
              --label school.browser-role=browser \
              --label "school.audit-repository=$GITHUB_REPOSITORY" \
              --label "school.audit-run-id=$GITHUB_RUN_ID" \
              --label "school.audit-run-attempt=$GITHUB_RUN_ATTEMPT" \
              --label "school.runtime-uid=$runtime_uid" \
              --label "school.runtime-gid=$runtime_gid" \
              --label "school.control-sha=$GITHUB_SHA" \
              --mount \
                type=bind,source="$PWD/.github/scripts/school-flag-off-capture.mjs",target=/control/capture.mjs,readonly \
              --mount \
                type=bind,source="$browser_runtime",target=/runtime,readonly \
              --mount \
                type=bind,source="$browser_exchange",target=/exchange \
              --mount \
                type=bind,source="$PWD/$EVIDENCE_DIR",target=/output \
              --mount \
                type=bind,source="$transport_root",target=/transport,readonly \
              --entrypoint /usr/bin/env "$playwright_image_id" \
              "${browser_process_args[@]}"
          )"
          [[ "$browser_container_id" =~ ^[a-f0-9]{64}$ ]]
          record_control_id browser "$browser_container_id"
          AUDIT_PASSWORD="$audit_password" HANDSHAKE_TOKEN="$handshake_token" \
            AUDIT_SEED_DATE="$audit_seed_date" \
            assert_control_config "$browser_name" browser \
              "$playwright_image_id" "$browser_container_id"
          docker start "$browser_container_id" >/dev/null
          wait_browser_marker "$browser_exchange/ready.json" 600
          browser_session="$(
            validate_browser_marker "$browser_exchange/ready.json" ready
          )"

          capture_side() {
            local side="$1"
            local audit_sha="$2"
            local audit_image="$3"
            local audit_image_id="$4"
            local audit_source="$5"
            local prepare_log
            local cleanup_log
            case "$side" in
              base)
                prepare_log="$base_prepare_log"
                cleanup_log="$base_cleanup_log"
                ;;
              candidate)
                prepare_log="$candidate_prepare_log"
                cleanup_log="$candidate_cleanup_log"
                ;;
              *) return 1 ;;
            esac
            local_fixture prepare "$side" "$audit_sha" "$audit_image" \
              "$audit_image_id" "$audit_source" | tee "$prepare_log"
            test "$(sed -n 's/^SCHOOL_AUTHORIZED_VISUAL_FIXTURE=//p' \
              "$prepare_log" | tail -n1)" = READY
            test "$(sed -n 's/^SCHOOL_AUTHORIZED_VISUAL_DATA=//p' \
              "$prepare_log" | tail -n1)" = SYNTHETIC
            test "$(sed -n 's/^SCHOOL_AUTHORIZED_VISUAL_ROLES=//p' \
              "$prepare_log" | tail -n1)" = SEEDED
            test "$(sed -n 's/^SCHOOL_AUTHORIZED_VISUAL_SOURCE=//p' \
              "$prepare_log" | tail -n1)" = "$audit_source"
            test "$(sed -n 's/^SCHOOL_AUTHORIZED_VISUAL_AUDIT_SHA=//p' \
              "$prepare_log" | tail -n1)" = "$audit_sha"
            test "$(sed -n 's/^SCHOOL_AUTHORIZED_VISUAL_AUDIT_IMAGE_ID=//p' \
              "$prepare_log" | tail -n1)" = "$audit_image_id"
            test "$(sed -n 's/^SCHOOL_AUTHORIZED_VISUAL_DESIGN_FLAG=//p' \
              "$prepare_log" | tail -n1)" = false
            test "$(sed -n 's/^SCHOOL_AUTHORIZED_VISUAL_IMAGE_PIN=//p' \
              "$prepare_log" | tail -n1)" = IMMUTABLE
            test "$(sed -n 's/^SCHOOL_AUTHORIZED_VISUAL_NETWORK_MODE=//p' \
              "$prepare_log" | tail -n1)" = none
            test "$(sed -n 's/^SCHOOL_AUTHORIZED_VISUAL_EGRESS=//p' \
              "$prepare_log" | tail -n1)" = none-network
            test "$(sed -n 's/^SCHOOL_AUTHORIZED_VISUAL_DATA_STORAGE=//p' \
              "$prepare_log" | tail -n1)" = tmpfs-capped-256m
            test "$(sed -n 's/^SCHOOL_AUTHORIZED_VISUAL_TRANSPORT=//p' \
              "$prepare_log" | tail -n1)" = unix-socket
            test "$(sed -n 's/^SCHOOL_AUTHORIZED_VISUAL_BINDING=//p' \
              "$prepare_log" | tail -n1)" = unix-socket-only
            test "$(sed -n 's/^SCHOOL_AUTHORIZED_VISUAL_SEED_DATE=//p' \
              "$prepare_log" | tail -n1)" = "$audit_seed_date"
            test -S "$transport_root/$side/audit.sock"
            signal_browser_capture "$side" "$audit_sha" "$audit_image_id"
            wait_browser_marker "$browser_exchange/captured-$side.json" 600
            test "$(
              validate_browser_marker \
                "$browser_exchange/captured-$side.json" captured \
                "$side" "$audit_sha" "$audit_image_id"
            )" = "$browser_session"
            local_fixture cleanup "$side" "$audit_sha" "$audit_image" \
              "$audit_image_id" "$audit_source" | tee "$cleanup_log"
            test "$(sed -n 's/^SCHOOL_AUTHORIZED_VISUAL_CLEANUP=//p' \
              "$cleanup_log" | tail -n1)" = OK
            test ! -e "$transport_root/$side/audit.sock"
            test ! -L "$transport_root/$side/audit.sock"
            test ! -e \
              "$RUNNER_TEMP/school-authorized-visual-$run_instance-$side"
            test ! -L \
              "$RUNNER_TEMP/school-authorized-visual-$run_instance-$side"
            test ! -e \
              "$RUNNER_TEMP/school-authorized-visual-$run_instance-$side.pending"
            test ! -L \
              "$RUNNER_TEMP/school-authorized-visual-$run_instance-$side.pending"
          }

          capture_side base \
            "$BASE_SHA" "$BASE_OFF_IMAGE" "$BASE_IMAGE_ID" \
            base-migrations-only
          capture_side candidate \
            "$REVIEWED_CANDIDATE_SHA" "$CANDIDATE_OFF_IMAGE" \
            "$CANDIDATE_IMAGE_ID" candidate-migrations-only
          wait_browser_marker "$browser_exchange/complete.json" 120
          test "$(
            validate_browser_marker "$browser_exchange/complete.json" complete
          )" = "$browser_session"
          wait_control_exit "$browser_name" browser "$browser_container_id" 180
          docker logs "$browser_container_id" > "$browser_log" 2>&1 || {
            cat "$browser_log" >&2 || :
            exit 1
          }
          cat "$browser_log"
          test "$(docker inspect "$browser_container_id" \
            --format '{{.State.ExitCode}}')" = 0
          test "$(docker inspect "$browser_container_id" \
            --format '{{.State.OOMKilled}}')" = false
          test -z "$(docker inspect "$browser_container_id" \
            --format '{{.State.Error}}')"
          remove_control_container "$browser_name" browser \
            "$playwright_image_id" "$browser_container_id" validate
          remove_control_container "$browser_name" browser \
            "$playwright_image_id" "$browser_container_id" mutate
          cleanup_all
          trap - EXIT INT TERM HUP
          printf 'result=CAPTURED\n' >> "$GITHUB_OUTPUT"

      - name: Enforce local browser and fixture cleanup
        if: always()
        timeout-minutes: 20
        env:
          BASE_IMAGE_ID: ${{ steps.build.outputs.base_image_id }}
          CANDIDATE_IMAGE_ID: ${{ steps.build.outputs.candidate_image_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$GITHUB_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          host_uid="$(id -u)"
          host_gid="$(id -g)"
          if [ "$host_uid" -eq 0 ]; then
            runtime_uid=1001
            runtime_gid=1001
          else
            test "$host_uid" -ge 1
            test "$host_gid" -ge 1
            runtime_uid="$host_uid"
            runtime_gid="$host_gid"
          fi
          runtime_identity="$runtime_uid:$runtime_gid"
          run_instance="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          owner_value="$GITHUB_RUN_ID|$GITHUB_RUN_ATTEMPT|$GITHUB_SHA"
          browser_name="school-flag-off-browser-$run_instance"
          installer_name="school-flag-off-browser-installer-$run_instance"
          browser_exchange="$RUNNER_TEMP/school-flag-off-browser-$run_instance"
          browser_runtime="$RUNNER_TEMP/school-flag-off-runtime-$run_instance"
          transport_root="$RUNNER_TEMP/school-flag-off-transport-$run_instance"
          log_root="$RUNNER_TEMP/school-flag-off-logs-$run_instance"
          control_state="$RUNNER_TEMP/school-flag-off-controls-$run_instance"
