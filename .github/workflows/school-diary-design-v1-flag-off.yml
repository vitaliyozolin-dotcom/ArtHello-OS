          state_volume_unmounted() {
            local container_ids
            local inspected_id
            local mount_names
            local mount_name
            if ! container_ids="$(docker container ls -a --no-trunc --format '{{.ID}}')"; then
              return 1
            fi
            while IFS= read -r inspected_id; do
              if [ -z "$inspected_id" ]; then
                continue
              fi
              if ! mount_names="$(
                docker container inspect "$inspected_id" \
                  --format '{{range .Mounts}}{{println .Name}}{{end}}'
              )"; then
                return 1
              fi
              while IFS= read -r mount_name; do
                if [ "$mount_name" = "$state_volume" ]; then
                  return 1
                fi
              done <<< "$mount_names"
            done <<< "$container_ids"
