                  "AUDIT_ORIGIN", "AUDIT_PASSWORD", "AUDIT_RUN_ID",
                  "AUDIT_RUN_ATTEMPT", "AUDIT_SEED_DATE", "AUDIT_CONTROL_SHA",
                  "AUDIT_BASE_SHA", "AUDIT_BASE_IMAGE_ID", "AUDIT_CANDIDATE_SHA",
                  "AUDIT_CANDIDATE_IMAGE_ID", "AUDIT_HANDSHAKE_TOKEN",
                  "AUDIT_EXCHANGE_DIR", "AUDIT_OUTPUT_ROOT", "PLAYWRIGHT_BROWSERS_PATH",
              ]
              assignments = command[3:3 + len(expected_keys)]
              if [entry.split("=", 1)[0] for entry in assignments] != expected_keys:
                  raise RuntimeError("Browser process environment allowlist mismatch")
              if command[3 + len(expected_keys):5 + len(expected_keys)] != ["bash", "-lc"]:
                  raise RuntimeError("Browser process command mismatch")
              if len(command) != 6 + len(expected_keys):
                  raise RuntimeError("Unexpected browser process argument")
          if config.get("Tty") or config.get("OpenStdin") or config.get("StdinOnce"):
              raise RuntimeError("Interactive control container forbidden")

          expected = {
              "installer": {
                  "network": "bridge",
                  "memory": 1073741824,
                  "nano": 1000000000,
                  "pids": 256,
                  "shm": 67108864,
                  "init": False,
                  "tmp": {
                      "rw", "noexec", "nosuid", "nodev", "size=536870912",
                      "mode=1770", f"uid={runtime_uid}", f"gid={runtime_gid}",
                  },
              },
              "browser": {
                  "network": "none",
                  "memory": 4294967296,
                  "nano": 2500000000,
                  "pids": 512,
                  "shm": 1073741824,
                  "init": True,
                  "tmp": {
                      "rw", "nosuid", "nodev", "size=2147483648",
                      "mode=1770", f"uid={runtime_uid}", f"gid={runtime_gid}",
                  },
              },
          }[role]
          scalar_checks = {
              "NetworkMode": expected["network"],
              "ReadonlyRootfs": True,
              "Memory": expected["memory"],
              "MemorySwap": expected["memory"],
              "NanoCpus": expected["nano"],
              "PidsLimit": expected["pids"],
              "ShmSize": expected["shm"],
              "Privileged": False,
              "AutoRemove": False,
              "PublishAllPorts": False,
              "Init": expected["init"],
          }
          for key, value in scalar_checks.items():
              if host.get(key) != value:
                  raise RuntimeError(f"Control HostConfig mismatch: {key}")
          if host.get("RestartPolicy") != {"Name": "no", "MaximumRetryCount": 0}:
              raise RuntimeError("Control restart policy mismatch")
          if host.get("CapAdd") not in (None, []):
              raise RuntimeError("Control capability addition forbidden")
          if host.get("CapDrop") != ["ALL"]:
              raise RuntimeError("Control capability drop mismatch")
          if host.get("SecurityOpt") not in (
              ["no-new-privileges"], ["no-new-privileges:true"]
          ):
              raise RuntimeError("Control security option mismatch")
          if host.get("PortBindings") not in (None, {}):
              raise RuntimeError("Published control ports forbidden")
          if host.get("Devices") not in (None, []):
              raise RuntimeError("Control devices forbidden")
          if host.get("DeviceRequests") not in (None, []):
              raise RuntimeError("Control device requests forbidden")
          if host.get("PidMode") not in (None, ""):
              raise RuntimeError("Control PID namespace mismatch")
          log_config = host.get("LogConfig") or {}
          expected_log = {
              "installer": {"max-file": "1", "max-size": "10m"},
              "browser": {"max-file": "1", "max-size": "20m"},
          }[role]
          if log_config.get("Type") != "local" or log_config.get("Config") != expected_log:
              raise RuntimeError("Control log configuration mismatch")
          tmpfs = host.get("Tmpfs") or {}
          if set(tmpfs) != {"/tmp"} or set(tmpfs["/tmp"].split(",")) != expected["tmp"]:
              raise RuntimeError("Control tmpfs mismatch")

          mounts = item.get("Mounts") or []
          actual_mounts = {}
          for mount in mounts:
              destination = mount.get("Destination")
              if destination in actual_mounts:
                  raise RuntimeError("Duplicate control mount")
              actual_mounts[destination] = {
                  "Type": mount.get("Type"),
                  "Source": mount.get("Source"),
                  "RW": mount.get("RW"),
                  "Propagation": mount.get("Propagation"),
              }
          if role == "installer":
              expected_mounts = {
                  "/runtime": {
                      "Type": "bind",
                      "Source": os.environ["CONTROL_BROWSER_RUNTIME"],
                      "RW": True,
                      "Propagation": "rprivate",
                  }
              }
          else:
              expected_mounts = {
                  "/control/capture.mjs": {
                      "Type": "bind",
                      "Source": os.environ["CONTROL_CAPTURE_SCRIPT"],
                      "RW": False,
                      "Propagation": "rprivate",
                  },
                  "/runtime": {
                      "Type": "bind",
                      "Source": os.environ["CONTROL_BROWSER_RUNTIME"],
                      "RW": False,
                      "Propagation": "rprivate",
                  },
                  "/exchange": {
                      "Type": "bind",
                      "Source": os.environ["CONTROL_BROWSER_EXCHANGE"],
                      "RW": True,
                      "Propagation": "rprivate",
                  },
                  "/output": {
                      "Type": "bind",
                      "Source": os.environ["CONTROL_EVIDENCE_ROOT"],
                      "RW": True,
                      "Propagation": "rprivate",
                  },
                  "/transport": {
                      "Type": "bind",
                      "Source": os.environ["CONTROL_TRANSPORT_ROOT"],
                      "RW": False,
                      "Propagation": "rprivate",
                  },
              }
          if actual_mounts != expected_mounts:
              raise RuntimeError("Control mount set mismatch")

          if config.get("Env") != json.loads(os.environ["CONTROL_IMAGE_ENV_JSON"]):
              raise RuntimeError("Control Config.Env differs from pinned image allowlist")
          CONTROL_INSPECT
          }

          local_fixture() {
            local action="$1"
            local side="$2"
            local audit_sha="$3"
            local audit_image="$4"
            local audit_image_id="$5"
            local audit_source="$6"
            local password=()
            if [ "$action" = prepare ]; then
              password=(AUDIT_PASSWORD="$audit_password")
            fi
            [ "$helper_trusted" = yes ] || return 1
            assert_run_directory "$control_state" "$host_uid:$host_gid" 700 || \
