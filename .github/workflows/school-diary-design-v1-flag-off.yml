            if [ "$matches" -gt 1 ]; then
              return 1
            fi
          }

          container_id_absent() {
            local expected_id="$1"
            local inventory
            local container_id
            if [[ ! "$expected_id" =~ ^[a-f0-9]{64}$ ]]; then
              return 1
            fi
            if ! inventory="$(docker container ls -a --no-trunc --format '{{.ID}}')"; then
              return 1
            fi
            while IFS= read -r container_id; do
              if [ "$container_id" = "$expected_id" ]; then
                return 1
              fi
            done <<< "$inventory"
          }

          volume_present() {
            local inventory
            local name
            local matches=0
            if ! inventory="$(docker volume ls --format '{{.Name}}')"; then
              return 1
            fi
            while IFS= read -r name; do
              if [ "$name" = "$state_volume" ]; then
                matches=$((matches + 1))
              fi
            done <<< "$inventory"
            if [ "$matches" -gt 1 ]; then
              return 1
            fi
            if [ "$matches" -eq 1 ]; then
              PROBED_VOLUME_PRESENT=yes
            else
              PROBED_VOLUME_PRESENT=no
            fi
          }

          assert_or_record_volume_identity() {
            local mode="$1"
            if [ "$mode" != record ] && [ "$mode" != verify ]; then
              return 1
            fi
            if ! volume_present; then
              return 1
            fi
            if [ "$PROBED_VOLUME_PRESENT" != yes ]; then
              return 1
            fi
            volume_validate "$mode"
