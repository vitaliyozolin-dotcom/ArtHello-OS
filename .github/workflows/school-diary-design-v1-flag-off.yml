              "$recovery_root/container-id" "$PROBED_CONTAINER_ID" \
              '^[a-f0-9]{64}$'; then
              return 1
            fi
            if ! write_once \
              "$recovery_root/buildkit-image-id" "$buildkit_id" \
              '^sha256:[a-f0-9]{64}$'; then
              return 1
            fi
          }

          assert_builder_running() {
            local expected_id
            local state_json
            if ! read_exact "$recovery_root/container-id" '^[a-f0-9]{64}$'; then
              return 1
            fi
            expected_id="$READ_EXACT_VALUE"
