            if ! chmod 0500 "$recovery_root/volume-validator.py.tmp"; then
              return 1
            fi
            if ! mv -T \
              "$recovery_root/volume-validator.py.tmp" \
              "$recovery_root/volume-validator.py"; then
              return 1
            fi
            if ! nonce="$(openssl rand -hex 32)"; then
              return 1
