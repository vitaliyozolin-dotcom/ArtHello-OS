          def env_map(values):
              result = {}
              for item in values or []:
                  key, separator, value = item.partition("=")
                  if not separator or not key or key in result:
                      raise RuntimeError("Duplicate or malformed environment")
                  result[key] = value
              return result

          pinned_defaults = env_map(image_config.get("Env"))
          injected = {
              "SCHOOL_AUDIT_OWNER": "school-diary-flag-off",
              "SCHOOL_AUDIT_REPOSITORY": os.environ["GITHUB_REPOSITORY"],
              "SCHOOL_AUDIT_RUN_ID": os.environ["GITHUB_RUN_ID"],
              "SCHOOL_AUDIT_RUN_ATTEMPT": os.environ["GITHUB_RUN_ATTEMPT"],
              "SCHOOL_AUDIT_CONTROL_SHA": os.environ["GITHUB_SHA"],
              "SCHOOL_AUDIT_STATE_VOLUME": os.environ["STATE_VOLUME"],
              "SCHOOL_AUDIT_NONCE": os.environ["AUDIT_NONCE"],
