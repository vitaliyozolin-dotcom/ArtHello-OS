name: School diary design v1 flag-off parity

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/school-diary-design-v1-flag-off.yml
      - .github/scripts/school-flag-off-capture.mjs
      - .github/scripts/school-authorized-visual-fixture.sh
      - .github/fixtures/school-hosting.json
      - .github/fixtures/school-dockerignore
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Serialize this repository's audit publication; each job gets an ephemeral runner.
  group: school-diary-authorized-visual-audit
  cancel-in-progress: false

env:
  BASE_SHA: 48bdac0a95bf0560f9dbd9b4c4af7d9b2175edd4
  REVIEWED_CANDIDATE_SHA: 034be78c5cb30402ebb7d3786133d0f3be390be9
  BASE_OFF_IMAGE: school-1-11-design-v1-off-base:${{ github.run_id }}-${{ github.run_attempt }}-48bdac0a95bf
  CANDIDATE_OFF_IMAGE: school-1-11-design-v1-off-candidate:${{ github.run_id }}-${{ github.run_attempt }}-034be78c5cb3
  AUDIT_ORIGIN: http://127.0.0.1:33212
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright@sha256:b27e719ecbfef153e13fd24e8341736733bf2658b229677eb21ff57ff5d7fb29
  PLAYWRIGHT_VERSION: 1.55.0
  BUILDKIT_IMAGE: moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
  EVIDENCE_DIR: school-flag-off-evidence-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  exact-flag-off-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Pin isolated local Docker and verify capacity and empty output tags
        timeout-minutes: 10
        shell: bash
        run: |
          set -Eeuo pipefail
          # Standard private-repository ubuntu-24.04 runners have 14 GB SSD.
          # Keep an 8 GiB floor, matching the inter-build capacity gate.
          readonly minimum_kb=8388608
          readonly local_docker_host=unix:///var/run/docker.sock
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          test "${RUNNER_OS:-}" = Linux
          test "${RUNNER_ARCH:-}" = X64
          case "$RUNNER_TEMP" in
            /*) ;;
            *) exit 1 ;;
          esac
          test "$RUNNER_TEMP" != /
          test -d "$RUNNER_TEMP"
          test ! -L "$RUNNER_TEMP"
          test "$EVIDENCE_DIR" = \
            "school-flag-off-evidence-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$EVIDENCE_DIR"
          test ! -L "$EVIDENCE_DIR"

          inherited_override=0
          for variable in \
            DOCKER_HOST DOCKER_CONTEXT DOCKER_TLS_VERIFY DOCKER_CERT_PATH \
            DOCKER_TLS DOCKER_TLS_CERTDIR DOCKER_CONFIG DOCKER_AUTH_CONFIG \
            DOCKER_CUSTOM_HEADERS REGISTRY_AUTH_FILE BUILDKIT_HOST \
            BUILDX_BUILDER BUILDX_CONFIG; do
            if [[ -v $variable ]]; then
              printf 'Inherited Docker endpoint/TLS/auth override rejected: %s\n' \
                "$variable" >&2
              inherited_override=1
            fi
          done

          docker_config="$RUNNER_TEMP/school-flag-off-docker-config-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$docker_config"
          test ! -L "$docker_config"
          install -m 0700 -d "$docker_config"
          test ! -L "$docker_config"
          test "$(stat -c '%u:%g:%a' "$docker_config")" = \
            "$(id -u):$(id -g):700"
          test -z "$(find -P "$docker_config" -mindepth 1 -print -quit)"

          unset DOCKER_CONTEXT DOCKER_TLS_VERIFY DOCKER_CERT_PATH
          unset DOCKER_TLS DOCKER_TLS_CERTDIR DOCKER_AUTH_CONFIG
          unset DOCKER_CUSTOM_HEADERS REGISTRY_AUTH_FILE BUILDKIT_HOST
          unset BUILDX_BUILDER BUILDX_CONFIG
          export DOCKER_HOST="$local_docker_host"
          export DOCKER_CONFIG="$docker_config"
          {
            printf 'DOCKER_HOST=%s\n' "$DOCKER_HOST"
            printf 'DOCKER_CONFIG=%s\n' "$DOCKER_CONFIG"
            printf 'DOCKER_CONTEXT=\n'
            printf 'DOCKER_TLS_VERIFY=\n'
            printf 'DOCKER_CERT_PATH=\n'
            printf 'DOCKER_TLS=\n'
            printf 'DOCKER_TLS_CERTDIR=\n'
            printf 'DOCKER_AUTH_CONFIG=\n'
            printf 'DOCKER_CUSTOM_HEADERS=\n'
            printf 'REGISTRY_AUTH_FILE=\n'
            printf 'BUILDKIT_HOST=\n'
            printf 'BUILDX_BUILDER=\n'
            printf 'BUILDX_CONFIG=\n'
          } >> "$GITHUB_ENV"
          test "$inherited_override" -eq 0
          test "$DOCKER_HOST" = "$local_docker_host"
          test "$DOCKER_CONFIG" = "$docker_config"
          test -S /var/run/docker.sock
          test ! -L /var/run/docker.sock
          test "$(docker context inspect default \
            --format '{{.Endpoints.docker.Host}}')" = "$local_docker_host"
          docker_root="$(docker --host "$local_docker_host" info \
            --format '{{.DockerRootDir}}')"
          case "$docker_root" in
            /*) ;;
            *) exit 1 ;;
          esac
          test -d "$docker_root"
          free_kb() {
            local value
            value="$(df -Pk "$docker_root" | awk 'NR == 2 {print $4}')"
            [[ "$value" =~ ^[0-9]+$ ]]
            printf '%s\n' "$value"
          }
          probe_exact_image_tag() {
            local target="$1"
            local inventory
            local reference
            local image_id
            local extra
            local matches=0
            if ! inventory="$(
              docker image ls --no-trunc \
                --format '{{.Repository}}:{{.Tag}}|{{.ID}}'
            )"; then
              printf 'Docker image inventory failed\n' >&2
              return 1
            fi
            PROBED_IMAGE_ID=""
            while IFS='|' read -r reference image_id extra; do
              if [ "$reference" = "$target" ]; then
                test -z "$extra" || return 1
                [[ "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]] || return 1
                matches=$((matches + 1))
                PROBED_IMAGE_ID="$image_id"
              fi
            done <<< "$inventory"
            test "$matches" -le 1
          }
          probe_exact_image_tag "$BASE_OFF_IMAGE"
          test -z "$PROBED_IMAGE_ID"
          probe_exact_image_tag "$CANDIDATE_OFF_IMAGE"
          test -z "$PROBED_IMAGE_ID"
          available_kb="$(free_kb)"
          test "$available_kb" -ge "$minimum_kb"
          printf 'SCHOOL_FLAG_OFF_LOCAL_DOCKER_PREFLIGHT=OK host=%s config=isolated-empty available_kb=%s minimum_kb=%s output_tags=absent\n' \
            "$DOCKER_HOST" "$available_kb" "$minimum_kb"

      - name: Check out comparison controls
        timeout-minutes: 5
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: false

      - name: Check out exact flag-off base
        timeout-minutes: 5
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 1
          path: source-base
          clean: true
          persist-credentials: false

      - name: Check out exact reviewed candidate
        timeout-minutes: 5
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.REVIEWED_CANDIDATE_SHA }}
          fetch-depth: 0
          path: source-candidate
          clean: true
          persist-credentials: false

      - name: Initialize run-attempt evidence ownership
        timeout-minutes: 5
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$GITHUB_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          test "$EVIDENCE_DIR" = \
            "school-flag-off-evidence-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$EVIDENCE_DIR"
          test ! -L "$EVIDENCE_DIR"
          install -m 0700 -d "$EVIDENCE_DIR"
          test ! -L "$EVIDENCE_DIR"
          test "$(stat -c '%u:%g:%a' "$EVIDENCE_DIR")" = \
            "$(id -u):$(id -g):700"
          WORKFLOW_SHA256="$(sha256sum \
            .github/workflows/school-diary-design-v1-flag-off.yml | cut -d' ' -f1)" \
          FIXTURE_SHA256="$(sha256sum \
            .github/scripts/school-authorized-visual-fixture.sh | cut -d' ' -f1)" \
          CAPTURE_SHA256="$(sha256sum \
            .github/scripts/school-flag-off-capture.mjs | cut -d' ' -f1)" \
          python3 - <<'OWNER'
          import json
          import os
          import pathlib
          import re

          root = pathlib.Path(os.environ["EVIDENCE_DIR"])
          if not root.is_dir() or root.is_symlink():
              raise RuntimeError("Invalid evidence root")
          controls = {
              "workflowSha256": os.environ["WORKFLOW_SHA256"],
              "fixtureSha256": os.environ["FIXTURE_SHA256"],
              "captureSha256": os.environ["CAPTURE_SHA256"],
          }
          if any(not re.fullmatch(r"[a-f0-9]{64}", value) for value in controls.values()):
              raise RuntimeError("Invalid control digest")
          owner = {
              "version": "1.1.0",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "runId": os.environ["GITHUB_RUN_ID"],
              "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "controlSha": os.environ["GITHUB_SHA"],
              "controls": controls,
          }
          target = root / "evidence-owner.json"
          temporary = root / ".evidence-owner.tmp"
          temporary.write_text(
              json.dumps(owner, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          temporary.chmod(0o600)
          os.replace(temporary, target)
          if target.is_symlink() or target.stat().st_mode & 0o777 != 0o600:
              raise RuntimeError("Wrong evidence owner mode")
          OWNER
          actual="$({ find -P "$EVIDENCE_DIR" -mindepth 1 -maxdepth 1 -printf '%f\n'; } | LC_ALL=C sort)"
          test "$actual" = evidence-owner.json
          printf 'SCHOOL_FLAG_OFF_EVIDENCE_OWNER=BOUND run=%s attempt=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"

      - name: Verify boundary and build exact false images
        timeout-minutes: 90
        id: build
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077

          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$BUILDKIT_IMAGE" =~ ^moby/buildkit:v[0-9]+\.[0-9]+\.[0-9]+@sha256:[a-f0-9]{64}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C source-base rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C source-candidate rev-parse HEAD)" = "$REVIEWED_CANDIDATE_SHA"
          test "$(git -C source-candidate rev-parse "$BASE_SHA^{commit}")" = "$BASE_SHA"

          run_instance="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          control_short="${GITHUB_SHA:0:12}"
          builder_name="school-flagoff-$run_instance-$control_short"
          node_name="school-flagoff-node-$run_instance-$control_short"
          container_name="buildx_buildkit_$node_name"
          state_volume="${container_name}_state"
          build_root="$RUNNER_TEMP/school-flagoff-build-$run_instance-$control_short"
          recovery_root="$RUNNER_TEMP/school-flagoff-recovery-$run_instance-$control_short"
          recovery_tombstone="${recovery_root}.retired"
          docker_config="$build_root/docker"
          buildx_config="$build_root/buildx"
          owner_value="$GITHUB_REPOSITORY|$GITHUB_RUN_ID|$GITHUB_RUN_ATTEMPT|$GITHUB_SHA"
          audit_nonce=""
          readonly run_instance control_short builder_name node_name
          readonly container_name state_volume build_root docker_config
          readonly buildx_config owner_value recovery_root recovery_tombstone

          case "$build_root" in
            "$RUNNER_TEMP"/school-flagoff-build-"$run_instance"-"$control_short") ;;
            *) exit 1 ;;
          esac
          case "$recovery_root:$recovery_tombstone" in
            "$RUNNER_TEMP"/school-flagoff-recovery-"$run_instance"-"$control_short":"$RUNNER_TEMP"/school-flagoff-recovery-"$run_instance"-"$control_short".retired) ;;
            *) exit 1 ;;
          esac
          [[ "$builder_name" =~ ^school-flagoff-[0-9]+-[1-9][0-9]*-[a-f0-9]{12}$ ]]
          [[ "$node_name" =~ ^school-flagoff-node-[0-9]+-[1-9][0-9]*-[a-f0-9]{12}$ ]]
          test "$container_name" = "buildx_buildkit_$node_name"
          test "$state_volume" = "${container_name}_state"

          # Never inherit a remote daemon, TLS material, context, or builder.
          # Every Docker invocation below also carries the exact local Unix host.
          for inherited_name in \
            DOCKER_HOST DOCKER_CONTEXT DOCKER_TLS_VERIFY DOCKER_CERT_PATH \
            DOCKER_API_VERSION DOCKER_CONFIG BUILDX_BUILDER BUILDX_CONFIG \
            BUILDKIT_HOST; do
            if [[ -v "$inherited_name" ]]; then
              printf 'SCHOOL_FLAG_OFF_INHERITED_DOCKER_OVERRIDE=REJECTED name=%s\n' \
                "$inherited_name"
            fi
            unset "$inherited_name"
          done
          export DOCKER_HOST=unix:///var/run/docker.sock
          export DOCKER_CONFIG="$docker_config"
          export BUILDX_CONFIG="$buildx_config"
          docker() {
            command docker --host unix:///var/run/docker.sock "$@"
          }

          verify_local_docker_endpoint() {
            local context_host
            local server_version
            if [ "$DOCKER_HOST" != unix:///var/run/docker.sock ]; then
              return 1
            fi
            if [ "$DOCKER_CONFIG" != "$docker_config" ] || \
              [ "$BUILDX_CONFIG" != "$buildx_config" ]; then
              return 1
            fi
            if [[ -v DOCKER_CONTEXT ]] || [[ -v DOCKER_TLS_VERIFY ]] || \
              [[ -v DOCKER_CERT_PATH ]] || [[ -v DOCKER_API_VERSION ]] || \
              [[ -v BUILDX_BUILDER ]] || [[ -v BUILDKIT_HOST ]]; then
              return 1
            fi
            if [ ! -S /var/run/docker.sock ] || [ -L /var/run/docker.sock ]; then
              return 1
            fi
            if ! context_host="$(
              command docker --config "$DOCKER_CONFIG" context inspect default \
                --format '{{.Endpoints.docker.Host}}'
            )"; then
              return 1
            fi
            if [ "$context_host" != unix:///var/run/docker.sock ]; then
              return 1
            fi
            if ! server_version="$(
              docker version --format '{{.Server.Version}}'
            )"; then
              return 1
            fi
            if [ -z "$server_version" ]; then
              return 1
            fi
          }

          validate_cleanup_intent() {
            INTENT_PATH="$recovery_root/intent.json" \
            VALIDATOR_PATH="$recovery_root/volume-validator.py" \
            EXPECTED_BUILDER="$builder_name" EXPECTED_NODE="$node_name" \
            EXPECTED_CONTAINER="$container_name" EXPECTED_VOLUME="$state_volume" \
            EXPECTED_BUILD_ROOT="$build_root" EXPECTED_RECOVERY_ROOT="$recovery_root" \
              python3 - <<'VALIDATE_CLEANUP_INTENT'
          import hashlib, json, os, pathlib, re
          intent_path = pathlib.Path(os.environ["INTENT_PATH"])
          validator_path = pathlib.Path(os.environ["VALIDATOR_PATH"])
          if not intent_path.is_file() or intent_path.is_symlink():
              raise RuntimeError("Missing recovery intent")
          if not validator_path.is_file() or validator_path.is_symlink():
              raise RuntimeError("Missing shared validator")
          if intent_path.stat().st_mode & 0o777 != 0o600:
              raise RuntimeError("Wrong intent mode")
          if validator_path.stat().st_mode & 0o777 != 0o500:
              raise RuntimeError("Wrong validator mode")
          intent = json.loads(intent_path.read_text(encoding="utf-8"))
          keys = {"version", "repository", "runId", "runAttempt", "controlSha",
                  "runnerEnvironment", "builderName", "nodeName", "containerName",
                  "stateVolume", "buildRoot", "recoveryRoot", "buildkitImage",
                  "dockerHost", "nonce", "validatorSha256", "baseImage", "candidateImage"}
          if set(intent) != keys:
              raise RuntimeError("Wrong intent schema")
          expected = {"version": "1.0.0", "repository": os.environ["GITHUB_REPOSITORY"],
              "runId": os.environ["GITHUB_RUN_ID"], "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "controlSha": os.environ["GITHUB_SHA"],
              "runnerEnvironment": os.environ["RUNNER_ENVIRONMENT"],
              "builderName": os.environ["EXPECTED_BUILDER"], "nodeName": os.environ["EXPECTED_NODE"],
              "containerName": os.environ["EXPECTED_CONTAINER"],
              "stateVolume": os.environ["EXPECTED_VOLUME"], "buildRoot": os.environ["EXPECTED_BUILD_ROOT"],
              "recoveryRoot": os.environ["EXPECTED_RECOVERY_ROOT"],
              "buildkitImage": os.environ["BUILDKIT_IMAGE"], "dockerHost": "unix:///var/run/docker.sock",
              "baseImage": os.environ["BASE_OFF_IMAGE"], "candidateImage": os.environ["CANDIDATE_OFF_IMAGE"]}
          if any(intent.get(key) != value for key, value in expected.items()):
              raise RuntimeError("Intent binding changed")
          if not re.fullmatch(r"[a-f0-9]{64}", intent.get("nonce", "")):
              raise RuntimeError("Wrong nonce")
          if hashlib.sha256(validator_path.read_bytes()).hexdigest() != intent["validatorSha256"]:
              raise RuntimeError("Validator digest changed")
          print(intent["nonce"])
          VALIDATE_CLEANUP_INTENT
          }

          volume_validate_cleanup() {
            local mode="$1"
            local inspect_json
            local nonce_check
            if ! nonce_check="$(validate_cleanup_intent)"; then
              return 1
            fi
            if [ "$nonce_check" != "$audit_nonce" ]; then
              return 1
            fi
            if ! inspect_json="$(docker volume inspect "$state_volume")"; then
              return 1
            fi
            VOLUME_INSPECT_JSON="$inspect_json" VOLUME_MODE="$mode" \
            INTENT_PATH="$recovery_root/intent.json" \
            IDENTITY_PATH="$recovery_root/volume-identity.json" \
              python3 "$recovery_root/volume-validator.py"
          }

          prove_cleanup_daemon_exclusive() {
            local containers volumes networks docker_root
            if [ "${RUNNER_ENVIRONMENT-}" != github-hosted ] || \
              [ "${RUNNER_OS-}" != Linux ]; then
              return 1
            fi
            if ! docker_root="$(docker info --format '{{.DockerRootDir}}')"; then
              return 1
            fi
            if [ "$docker_root" != /var/lib/docker ]; then return 1; fi
            if ! containers="$(docker container ls -a --format '{{.Names}}')"; then return 1; fi
            if [ -n "$containers" ]; then return 1; fi
            if ! volumes="$(docker volume ls --format '{{.Name}}')"; then return 1; fi
            if [ "$volumes" != "$state_volume" ]; then return 1; fi
            if ! networks="$(docker network ls --format '{{.Name}}' | LC_ALL=C sort)"; then return 1; fi
            if [ "$networks" != $'bridge\nhost\nnone' ]; then return 1; fi
          }

          validate_recovery_intent() {
            INTENT_PATH="$recovery_root/intent.json" \
            VALIDATOR_PATH="$recovery_root/volume-validator.py" \
            EXPECTED_BUILDER="$builder_name" EXPECTED_NODE="$node_name" \
            EXPECTED_CONTAINER="$container_name" EXPECTED_VOLUME="$state_volume" \
            EXPECTED_BUILD_ROOT="$build_root" EXPECTED_RECOVERY_ROOT="$recovery_root" \
              python3 - <<'VALIDATE_INTENT'
          import hashlib
          import json
          import os
          import pathlib
          import re

          intent_path = pathlib.Path(os.environ["INTENT_PATH"])
          validator_path = pathlib.Path(os.environ["VALIDATOR_PATH"])
          if not intent_path.is_file() or intent_path.is_symlink():
              raise RuntimeError("Recovery intent is absent")
          if not validator_path.is_file() or validator_path.is_symlink():
              raise RuntimeError("Shared volume validator is absent")
          if intent_path.stat().st_mode & 0o777 != 0o600:
              raise RuntimeError("Wrong intent mode")
          if validator_path.stat().st_mode & 0o777 != 0o500:
              raise RuntimeError("Wrong validator mode")
          intent = json.loads(intent_path.read_text(encoding="utf-8"))
          exact_keys = {
              "version", "repository", "runId", "runAttempt", "controlSha",
              "runnerEnvironment", "builderName", "nodeName", "containerName",
              "stateVolume", "buildRoot", "recoveryRoot", "buildkitImage",
              "dockerHost", "nonce", "validatorSha256", "baseImage",
              "candidateImage",
          }
          if set(intent) != exact_keys:
              raise RuntimeError("Wrong intent schema")
          expected = {
              "version": "1.0.0",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "runId": os.environ["GITHUB_RUN_ID"],
              "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "controlSha": os.environ["GITHUB_SHA"],
              "runnerEnvironment": os.environ["RUNNER_ENVIRONMENT"],
              "builderName": os.environ["EXPECTED_BUILDER"],
              "nodeName": os.environ["EXPECTED_NODE"],
              "containerName": os.environ["EXPECTED_CONTAINER"],
              "stateVolume": os.environ["EXPECTED_VOLUME"],
              "buildRoot": os.environ["EXPECTED_BUILD_ROOT"],
              "recoveryRoot": os.environ["EXPECTED_RECOVERY_ROOT"],
              "buildkitImage": os.environ["BUILDKIT_IMAGE"],
              "dockerHost": "unix:///var/run/docker.sock",
              "baseImage": os.environ["BASE_OFF_IMAGE"],
              "candidateImage": os.environ["CANDIDATE_OFF_IMAGE"],
          }
          for key, value in expected.items():
              if intent.get(key) != value:
                  raise RuntimeError(f"Wrong intent {key}")
          if not re.fullmatch(r"[a-f0-9]{64}", intent.get("nonce", "")):
              raise RuntimeError("Wrong intent nonce")
          validator_sha = hashlib.sha256(validator_path.read_bytes()).hexdigest()
          if intent.get("validatorSha256") != validator_sha:
              raise RuntimeError("Shared validator digest changed")
          print(intent["nonce"])
          VALIDATE_INTENT
          }

          initialize_recovery_journal() {
            local nonce
            local validator_sha
            if [ -e "$recovery_root" ] || [ -L "$recovery_root" ] || \
              [ -e "$recovery_tombstone" ] || [ -L "$recovery_tombstone" ]; then
              return 1
            fi
            if ! install -m 0700 -d "$recovery_root"; then
              return 1
            fi
            cat > "$recovery_root/volume-validator.py.tmp" <<'VOLUME_VALIDATOR'
          import json
          import os
          import pathlib
          import re

          intent = json.loads(pathlib.Path(os.environ["INTENT_PATH"]).read_text(encoding="utf-8"))
          documents = json.loads(os.environ["VOLUME_INSPECT_JSON"])
          if not isinstance(documents, list) or len(documents) != 1:
              raise RuntimeError("Unexpected volume inspect cardinality")
          volume = documents[0]
          nonce = intent.get("nonce", "")
          if not re.fullmatch(r"[a-f0-9]{64}", nonce):
              raise RuntimeError("Invalid intent nonce")
          expected_labels = {
              "school.system": "school-1-11",
              "school.environment": "synthetic",
              "school.purpose": "flag-off-buildkit-state",
              "school.audit-owner": "school-diary-flag-off",
              "school.audit-repository": intent["repository"],
              "school.audit-run-id": intent["runId"],
              "school.audit-run-attempt": intent["runAttempt"],
              "school.control-sha": intent["controlSha"],
              "school.audit-nonce": nonce,
          }
          mountpoint = volume.get("Mountpoint")
