            fi
            if [ -z "$PROBED_CONTAINER_ID" ]; then
              return 1
            fi
            if [ "$expected_pids" = auto ]; then
              if assert_owned_builder_id "$PROBED_CONTAINER_ID" 1024; then
                expected_pids=1024
              elif assert_owned_builder_id "$PROBED_CONTAINER_ID" unset; then
                expected_pids=unset
