          }

          remove_recorded_control() {
            local target="$1"
            local role="$2"
            local expected_id="$3"
            local phase="${4:-mutate}"
            local inspect_rc
            local recovered_id
            local resolved_id=""
            case "$phase" in validate|mutate) ;; *) return 1 ;; esac
            if [ "$phase" = mutate ]; then
              if [ "$role" = browser ]; then
                resolved_id="$resolved_browser_id"
              else
                resolved_id="$resolved_installer_id"
              fi
              if [ -n "$resolved_id" ]; then
                assert_recovery_config "$target" "$role" "$resolved_id" || \
                  return 1
                docker logs "$resolved_id" >&2 || :
                docker_bounded 60 rm -f "$resolved_id" >/dev/null || return 1
                if docker inspect "$resolved_id" >/dev/null 2>&1; then return 1; fi
              fi
              probe_exact_container "$target" || return 1
              [ "$PROBED_CONTAINER_PRESENT" = no ] || return 1
              return 0
            fi
            if [[ "$expected_id" =~ ^[a-f0-9]{64}$ ]]; then
              set +e
              docker inspect "$expected_id" >/dev/null 2>&1
              inspect_rc=$?
              set -e
              case "$inspect_rc" in
                0)
                  assert_recovery_config "$target" "$role" "$expected_id" || \
                    return 1
                  resolved_id="$expected_id"
                  ;;
                1)
                  probe_exact_container "$target" || return 1
                  [ "$PROBED_CONTAINER_PRESENT" = no ] || return 1
                  ;;
                *) return 1 ;;
              esac
            else
              probe_exact_container "$target" || return 1
              if [ "$PROBED_CONTAINER_PRESENT" = yes ]; then
                recovered_id="$(docker inspect "$target" --format '{{.Id}}')" || \
                  return 1
                [[ "$recovered_id" =~ ^[a-f0-9]{64}$ ]] || return 1
                assert_recovery_config "$target" "$role" "$recovered_id" || \
                  return 1
                resolved_id="$recovered_id"
              fi
            fi
            if [ "$role" = browser ]; then
              resolved_browser_id="$resolved_id"
            else
              resolved_installer_id="$resolved_id"
            fi
          }

          if ! remove_recorded_control "$browser_name" browser \
            "$browser_container_id" validate; then cleanup_rc=1; fi
          if ! remove_recorded_control "$installer_name" installer \
            "$installer_container_id" validate; then cleanup_rc=1; fi
          if [ "$cleanup_rc" -eq 0 ]; then
            remove_recorded_control "$browser_name" browser \
              "$browser_container_id" mutate || cleanup_rc=1
            if [ "$cleanup_rc" -eq 0 ]; then
              remove_recorded_control "$installer_name" installer \
                "$installer_container_id" mutate || cleanup_rc=1
            fi
          fi

          browser_absent=yes
          controls_absent=yes
          for target in "$browser_name" "$installer_name"; do
            PROBED_CONTAINER_PRESENT=yes
            if ! probe_exact_container "$target"; then
              cleanup_rc=1
              controls_absent=no
              if [ "$target" = "$browser_name" ]; then browser_absent=no; fi
            elif [ "$PROBED_CONTAINER_PRESENT" != no ]; then
              cleanup_rc=1
              controls_absent=no
              if [ "$target" = "$browser_name" ]; then browser_absent=no; fi
            fi
          done

          cleanup_fixture_side() {
            local side="$1"
            local audit_sha="$2"
            local audit_image="$3"
            local audit_image_id="$4"
            local audit_source="$5"
            [ "$helper_trusted" = yes ] || return 1
            [[ "$trusted_fixture_sha256" =~ ^[a-f0-9]{64}$ ]] || return 1
            [ -f "$fixture_snapshot" ] && [ ! -L "$fixture_snapshot" ] || \
              return 1
            [ "$(cat "$fixture_snapshot_digest")" = \
              "$trusted_fixture_sha256" ] || return 1
            [ "$(sha256sum "$fixture_snapshot" | cut -d' ' -f1)" = \
              "$trusted_fixture_sha256" ] || return 1
            timeout --signal=TERM --kill-after=15s 300s env -i \
              PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
              LANG=C LC_ALL=C HOME="$RUNNER_TEMP" \
              RUNNER_TEMP="$RUNNER_TEMP" \
              DOCKER_HOST=unix:///var/run/docker.sock \
              DOCKER_CONFIG="$docker_config" \
              ACTION=cleanup \
              RUN_ID="$GITHUB_RUN_ID" \
              RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
              CONTROL_SHA="$GITHUB_SHA" \
              AUDIT_SIDE="$side" \
              AUDIT_RUNTIME_UID="$runtime_uid" \
              AUDIT_RUNTIME_GID="$runtime_gid" \
              CANDIDATE_SHA="$REVIEWED_CANDIDATE_SHA" \
              CANDIDATE_IMAGE="$CANDIDATE_OFF_IMAGE" \
              CANDIDATE_IMAGE_ID="$CANDIDATE_IMAGE_ID" \
              AUDIT_SHA="$audit_sha" \
              AUDIT_IMAGE="$audit_image" \
              AUDIT_IMAGE_ID="$audit_image_id" \
              AUDIT_EXPECTED_DESIGN_FLAG=false \
              AUDIT_SOURCE="$audit_source" \
              AUDIT_SEED_DATE="${AUDIT_SEED_DATE:-1970-01-01}" \
              AUDIT_PUBLIC_ORIGIN="$AUDIT_ORIGIN" \
              AUDIT_WORK_ROOT="$RUNNER_TEMP" \
              AUDIT_TRANSPORT_ROOT="$transport_root" \
              bash "$fixture_snapshot"
          }

          if [ "$helper_trusted" = yes ] && \
            [[ "$BASE_IMAGE_ID" =~ ^sha256:[a-f0-9]{64}$ ]] && \
            [[ "$CANDIDATE_IMAGE_ID" =~ ^sha256:[a-f0-9]{64}$ ]] && \
            [ -f "$fixture_snapshot" ] && [ ! -L "$fixture_snapshot" ]; then
            if ! cleanup_fixture_side base \
              "$BASE_SHA" "$BASE_OFF_IMAGE" "$BASE_IMAGE_ID" \
              base-migrations-only; then cleanup_rc=1; fi
            if ! cleanup_fixture_side candidate \
              "$REVIEWED_CANDIDATE_SHA" "$CANDIDATE_OFF_IMAGE" \
              "$CANDIDATE_IMAGE_ID" candidate-migrations-only; then cleanup_rc=1; fi
          fi

          fixtures_absent=yes
          for side in base candidate; do
            for target in \
              "school-1-11-authorized-visual-$run_instance-$side" \
              "school-1-11-authorized-visual-$run_instance-$side-proxy"; do
              PROBED_CONTAINER_PRESENT=yes
              if ! probe_exact_container "$target"; then
                cleanup_rc=1
                fixtures_absent=no
              elif [ "$PROBED_CONTAINER_PRESENT" != no ]; then
                cleanup_rc=1
                fixtures_absent=no
              fi
            done
            for path in \
              "$RUNNER_TEMP/school-authorized-visual-$run_instance-$side" \
              "$RUNNER_TEMP/school-authorized-visual-$run_instance-$side.pending"; do
              if [ -e "$path" ] || [ -L "$path" ]; then
                cleanup_rc=1
                fixtures_absent=no
              fi
            done
          done

          cleanup_exchange() {
            local inventory
            local entry
            local invalid=0
            if [ ! -e "$browser_exchange" ] && [ ! -L "$browser_exchange" ]; then
              return 0
            fi
            assert_run_directory "$browser_exchange" "$runtime_identity" 700 || return 1
            if ! inventory="$(find -P "$browser_exchange" -mindepth 1 \
              -maxdepth 1 -printf '%f\n')"; then return 1; fi
            while IFS= read -r entry; do
              [ -n "$entry" ] || continue
              case "$entry" in
                owner|active-side|ready.json|request-base.json|captured-base.json|request-candidate.json|captured-candidate.json|complete.json|failed.json) ;;
                active-side.host.tmp|ready.json.[0-9]*.tmp|captured-base.json.[0-9]*.tmp|captured-candidate.json.[0-9]*.tmp|complete.json.[0-9]*.tmp|failed.json.[0-9]*.tmp|request-base.json.host.tmp|request-candidate.json.host.tmp) ;;
                *) invalid=1 ;;
              esac
              [ -f "$browser_exchange/$entry" ] && \
                [ ! -L "$browser_exchange/$entry" ] || invalid=1
            done <<< "$inventory"
            [ "$invalid" -eq 0 ] || return 1
            [ "${CLEANUP_VALIDATE_ONLY:-no}" = yes ] && return 0
            while IFS= read -r entry; do
              [ -n "$entry" ] || continue
              rm -f -- "$browser_exchange/$entry" || return 1
            done <<< "$inventory"
            rmdir -- "$browser_exchange" || return 1
          }

          cleanup_runtime() {
            local unexpected
            local path
            if [ ! -e "$browser_runtime" ] && [ ! -L "$browser_runtime" ]; then
              return 0
            fi
            assert_run_directory "$browser_runtime" "$runtime_identity" 700 || return 1
            if ! unexpected="$(find -P "$browser_runtime" -mindepth 1 \
              -maxdepth 1 ! -name owner ! -name package.json \
              ! -name package-lock.json ! -name browser-proxy.mjs \
              ! -name node_modules -print -quit)"; then return 1; fi
            [ -z "$unexpected" ] || return 1
            if [ -e "$browser_runtime/node_modules" ] || \
              [ -L "$browser_runtime/node_modules" ]; then
              [ -d "$browser_runtime/node_modules" ] && \
                [ ! -L "$browser_runtime/node_modules" ] || return 1
            fi
            for path in package.json package-lock.json browser-proxy.mjs owner; do
              if [ -e "$browser_runtime/$path" ] || \
                [ -L "$browser_runtime/$path" ]; then
                [ -f "$browser_runtime/$path" ] && \
                  [ ! -L "$browser_runtime/$path" ] || return 1
              fi
            done
            [ "${CLEANUP_VALIDATE_ONLY:-no}" = yes ] && return 0
            if [ -e "$browser_runtime/node_modules" ]; then
              rm -rf -- "$browser_runtime/node_modules" || return 1
            fi
            for path in package.json package-lock.json browser-proxy.mjs owner; do
              if [ -e "$browser_runtime/$path" ]; then
                rm -f -- "$browser_runtime/$path" || return 1
              fi
            done
            rmdir -- "$browser_runtime" || return 1
          }

          cleanup_transport() {
            local unexpected
            local side
            if [ ! -e "$transport_root" ] && [ ! -L "$transport_root" ]; then
              return 0
            fi
            assert_run_directory "$transport_root" "$runtime_identity" 700 || return 1
            if ! unexpected="$(find -P "$transport_root" -mindepth 1 \
              -maxdepth 1 ! -name owner ! -name base ! -name candidate \
              -print -quit)"; then return 1; fi
            [ -z "$unexpected" ] || return 1
            for side in base candidate; do
              [ -d "$transport_root/$side" ] && \
                [ ! -L "$transport_root/$side" ] || return 1
              [ "$(stat -c '%u:%g:%a' "$transport_root/$side")" = \
                "$runtime_identity:700" ] || return 1
              if ! unexpected="$(find -P "$transport_root/$side" \
                -mindepth 1 -maxdepth 1 -print -quit)"; then return 1; fi
              [ -z "$unexpected" ] || return 1
            done
            [ "${CLEANUP_VALIDATE_ONLY:-no}" = yes ] && return 0
            for side in base candidate; do
              rmdir -- "$transport_root/$side" || return 1
            done
            rm -f -- "$transport_root/owner" || return 1
            rmdir -- "$transport_root" || return 1
          }

          cleanup_logs() {
            local inventory
            local entry
            local invalid=0
            if [ ! -e "$log_root" ] && [ ! -L "$log_root" ]; then return 0; fi
            assert_run_directory "$log_root" "$host_uid:$host_gid" 700 || return 1
            if ! inventory="$(find -P "$log_root" -mindepth 1 \
              -maxdepth 1 -printf '%f\n')"; then return 1; fi
            while IFS= read -r entry; do
              [ -n "$entry" ] || continue
              case "$entry" in
                owner|browser.log|installer.log|base-prepare.log|base-cleanup.log|candidate-prepare.log|candidate-cleanup.log) ;;
                *) invalid=1 ;;
              esac
              [ -f "$log_root/$entry" ] && [ ! -L "$log_root/$entry" ] || \
                invalid=1
            done <<< "$inventory"
            [ "$invalid" -eq 0 ] || return 1
            [ "${CLEANUP_VALIDATE_ONLY:-no}" = yes ] && return 0
            while IFS= read -r entry; do
              [ -n "$entry" ] || continue
              if [ "$entry" != owner ]; then
                printf '===== %s =====\n' "$entry" >&2
                tail -n 300 "$log_root/$entry" >&2 || :
              fi
              rm -f -- "$log_root/$entry" || return 1
            done <<< "$inventory"
            rmdir -- "$log_root" || return 1
          }

          validate_recovery_journals() {
            local inventory
            local entry
            if [ ! -e "$control_state" ] && [ ! -L "$control_state" ]; then
              return 0
            fi
            assert_run_directory "$control_state" "$host_uid:$host_gid" 700 || return 1
            if ! inventory="$(find -P "$control_state" -mindepth 1 \
              -maxdepth 1 -printf '%f\n')"; then return 1; fi
            while IFS= read -r entry; do
              [ -n "$entry" ] || continue
              case "$entry" in
                owner|installer.intent.json|browser.intent.json|installer.cid|browser.cid|installer.cid.pending|browser.cid.pending|fixture.snapshot.sh|fixture.snapshot.sha256) ;;
                *) return 1 ;;
              esac
              [ -f "$control_state/$entry" ] && \
                [ ! -L "$control_state/$entry" ] || return 1
            done <<< "$inventory"
            for path in "$capture_docker_config" "$docker_config"; do
              if [ -e "$path" ] || [ -L "$path" ]; then
                assert_run_directory "$path" "$host_uid:$host_gid" 700 || return 1
                [ -f "$path/config.json" ] && [ ! -L "$path/config.json" ] || \
                  return 1
                [ "$(cat "$path/config.json")" = '{}' ] || return 1
                [ "$(stat -c '%u:%g:%a' "$path/config.json")" = \
                  "$host_uid:$host_gid:600" ] || return 1
              fi
            done
          }

          # Common phase one: validate every eligible target byte-for-byte before
          # any filesystem deletion. Any prior Docker/helper failure blocks phase two.
          if [ "$browser_absent" = yes ] && \
            ! CLEANUP_VALIDATE_ONLY=yes cleanup_exchange; then cleanup_rc=1; fi
          if [ "$controls_absent" = yes ] && \
            ! CLEANUP_VALIDATE_ONLY=yes cleanup_runtime; then cleanup_rc=1; fi
          if [ "$browser_absent" = yes ] && [ "$fixtures_absent" = yes ] && \
            ! CLEANUP_VALIDATE_ONLY=yes cleanup_transport; then cleanup_rc=1; fi
          if ! CLEANUP_VALIDATE_ONLY=yes cleanup_logs; then cleanup_rc=1; fi
          if ! validate_recovery_journals; then cleanup_rc=1; fi

          # Common phase two. Recovery journals are intentionally never deleted;
          # the ubuntu-24.04 hosted runner is ephemeral, and retaining them makes
          # every late mutation failure recoverable and reviewable.
          if [ "$cleanup_rc" -eq 0 ]; then
            if [ "$browser_absent" = yes ]; then cleanup_exchange || cleanup_rc=1; fi
            if [ "$controls_absent" = yes ]; then cleanup_runtime || cleanup_rc=1; fi
            if [ "$browser_absent" = yes ] && [ "$fixtures_absent" = yes ]; then
              cleanup_transport || cleanup_rc=1
            fi
            cleanup_logs || cleanup_rc=1
          fi

          for target in "$browser_name" "$installer_name"; do
            PROBED_CONTAINER_PRESENT=yes
            if ! probe_exact_container "$target" || \
              [ "$PROBED_CONTAINER_PRESENT" != no ]; then cleanup_rc=1; fi
          done
          if [ "$fixtures_absent" = yes ]; then
            test ! -e "$transport_root" || cleanup_rc=1
            test ! -L "$transport_root" || cleanup_rc=1
          fi
          test ! -e "$log_root" || cleanup_rc=1
          test ! -L "$log_root" || cleanup_rc=1
          test "$cleanup_rc" -eq 0
          printf 'SCHOOL_FLAG_OFF_RECOVERY_JOURNALS=RETAINED_UNTIL_RUNNER_DISPOSAL\n'
          printf 'SCHOOL_FLAG_OFF_LOCAL_EPHEMERAL_CLEANUP=OK run=%s attempt=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
      - name: Compare all probe pixels DOM accessibility and geometry exactly
        timeout-minutes: 15
        id: compare
        env:
          BASE_IMAGE_ID: ${{ steps.build.outputs.base_image_id }}
          CANDIDATE_IMAGE_ID: ${{ steps.build.outputs.candidate_image_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'COMPARE'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import struct

          root = pathlib.Path(os.environ["EVIDENCE_DIR"])
          roles = [
              {"id": "director"},
              {"id": "teacher"},
              {"id": "parent"},
              {"id": "student"},
          ]
          probes = [
              {"id": "director-management", "role": "director", "route": "/management", "state": "default"},
              {"id": "teacher-journal", "role": "teacher", "route": "/journal", "state": "default"},
              {"id": "teacher-journal-modal", "role": "teacher", "route": "/journal", "state": "grade-modal"},
              {"id": "parent-homework", "role": "parent", "route": "/homework", "state": "default"},
              {"id": "parent-ranking", "role": "parent", "route": "/people", "state": "ranking"},
              {"id": "student-schedule", "role": "student", "route": "/schedule", "state": "first-weekday"},
          ]
          controls = [
              {"width": 390, "height": 844},
              {"width": 1440, "height": 1000},
          ]
          renderer_profile = "deterministic-cpu-serial-raster-v1"
          renderer_args = [
              "--disable-gpu-rasterization",
              "--disable-oop-rasterization",
              "--disable-partial-raster",
              "--num-raster-threads=1",
              "--disable-skia-runtime-opts",
              "--disable-gpu-compositing",
          ]
          screenshot_protocol = {
              "warmupFrames": 1,
              "evidenceFrames": 2,
              "evidenceByteIdentical": True,
              "retries": 0,
          }
          comparisons = []
          violations = []
          browser_session_id = None
          browser_version = None

          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def png_size(path):
              data = path.read_bytes()
              if len(data) < 24 or data[:8] != b"\x89PNG\r\n\x1a\n":
                  raise RuntimeError("Invalid PNG: " + str(path))
              return struct.unpack(">II", data[16:24])

          for probe in probes:
              for control in controls:
                  stem = f"{probe['id']}-{control['width']}"
                  files = {}
                  equality = {}
                  for suffix in ("png", "dom.html", "geometry.json", "aria.yml"):
                      base = root / "base" / f"{stem}.{suffix}"
                      candidate = root / "candidate" / f"{stem}.{suffix}"
                      if not base.is_file() or not candidate.is_file():
                          raise RuntimeError("Missing comparison pair: " + stem + "." + suffix)
                      same = base.read_bytes() == candidate.read_bytes()
                      equality[suffix] = same
                      files[suffix] = {
                          "base": str(base.relative_to(root)),
                          "candidate": str(candidate.relative_to(root)),
                          "baseSha256": digest(base),
                          "candidateSha256": digest(candidate),
                      }
                      if not same:
                          violations.append({
                              "probe": probe["id"],
                              "role": probe["role"],
                              "width": control["width"],
                              "surface": suffix,
                          })
                  base_size = png_size(root / "base" / f"{stem}.png")
                  candidate_size = png_size(root / "candidate" / f"{stem}.png")
                  if base_size != candidate_size or base_size[0] != control["width"]:
                      violations.append({
                          "probe": probe["id"],
                          "role": probe["role"],
                          "width": control["width"],
                          "surface": "png-dimensions",
                      })
                  comparisons.append({
                      "probe": probe["id"],
                      "role": probe["role"],
                      "route": probe["route"],
                      "state": probe["state"],
                      **control,
                      "renderedHeight": base_size[1],
                      # Byte-identical PNGs are stricter than decoded pixel equality.
                      "pixelExact": equality["png"],
                      "differingPixels": 0 if equality["png"] else None,
                      "domExact": equality["dom.html"],
                      "geometryExact": equality["geometry.json"],
                      "a11yExact": equality["aria.yml"],
                      "files": files,
                  })

          expected_variant_files = 1 + len(probes) * len(controls) * 4
          expected_provenance = {
              "base": (os.environ["BASE_SHA"], os.environ["BASE_IMAGE_ID"]),
              "candidate": (
                  os.environ["REVIEWED_CANDIDATE_SHA"],
                  os.environ["CANDIDATE_IMAGE_ID"],
              ),
          }
          for variant, (expected_sha, expected_id) in expected_provenance.items():
              expected_names = {"manifest.json"}
              for probe in probes:
                  for control in controls:
                      stem = f"{probe['id']}-{control['width']}"
                      expected_names.update({
                          stem + ".png",
                          stem + ".dom.html",
                          stem + ".geometry.json",
                          stem + ".aria.yml",
                      })
              actual = {
                  path.name for path in (root / variant).iterdir() if path.is_file()
              }
              if actual != expected_names or len(actual) != expected_variant_files:
                  raise RuntimeError(
                      f"Wrong {variant} artifact inventory: "
                      f"missing={sorted(expected_names - actual)} extra={sorted(actual - expected_names)}"
                  )
              capture = json.loads((root / variant / "manifest.json").read_text())
              if (
                  capture.get("version") != "1.3.0"
                  or capture.get("runId") != os.environ["GITHUB_RUN_ID"]
                  or capture.get("runAttempt") != os.environ["GITHUB_RUN_ATTEMPT"]
                  or capture.get("side") != variant
                  or capture.get("auditSha") != expected_sha
                  or capture.get("auditImageId") != expected_id
                  or capture.get("seedDate") != os.environ["AUDIT_SEED_DATE"]
                  or capture.get("flagValue") is not False
                  or capture.get("origin") != "loopback-unix-socket"
                  or capture.get("rendererProfile") != renderer_profile
                  or capture.get("rendererArgs") != renderer_args
                  or capture.get("screenshotProtocol") != screenshot_protocol
                  or capture.get("roles") != roles
                  or capture.get("probes") != probes
                  or capture.get("controls") != controls
                  or capture.get("captures") != 12
                  or len(capture.get("results", [])) != 12
              ):
                  raise RuntimeError("Capture provenance failed for " + variant)
              if not re.fullmatch(
                  r"[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}",
                  capture.get("browserSessionId", ""),
              ):
                  raise RuntimeError("Invalid browser session provenance for " + variant)
              if not re.fullmatch(r"\d+(?:\.\d+){1,3}", capture.get("browserVersion", "")):
                  raise RuntimeError("Invalid browser version provenance for " + variant)
              if browser_session_id is None:
                  browser_session_id = capture["browserSessionId"]
                  browser_version = capture["browserVersion"]
              elif (
                  capture["browserSessionId"] != browser_session_id
                  or capture["browserVersion"] != browser_version
              ):
                  raise RuntimeError("Base/candidate did not use one Chromium process")
              result_keys = {
                  (item.get("probe"), item.get("width"))
                  for item in capture["results"]
              }
              expected_result_keys = {
                  (probe["id"], control["width"])
                  for probe in probes for control in controls
              }
              if result_keys != expected_result_keys:
                  raise RuntimeError("Capture probe matrix failed for " + variant)

          manifest = {
              "version": "1.4.0",
              "runId": os.environ["GITHUB_RUN_ID"],
              "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "controlSha": os.environ["GITHUB_SHA"],
              "baseSha": os.environ["BASE_SHA"],
              "candidateSha": os.environ["REVIEWED_CANDIDATE_SHA"],
              "baseImageId": os.environ["BASE_IMAGE_ID"],
              "candidateImageId": os.environ["CANDIDATE_IMAGE_ID"],
              "designFlag": False,
              "seedDate": os.environ["AUDIT_SEED_DATE"],
              "source": (
                  "separate empty schemas from byte-identical migrations; "
                  "synthetic data only"
              ),
              "credentialsStored": False,
              "browserSessionId": browser_session_id,
              "browserVersion": browser_version,
              "rendererProfile": renderer_profile,
              "rendererArgs": renderer_args,
              "screenshotProtocol": screenshot_protocol,
              "roles": roles,
              "probes": probes,
              "controls": controls,
              "captureCountPerVariant": len(probes) * len(controls),
              "variantArtifactCount": expected_variant_files,
              "artifactFileCount": 101,
              "comparisons": comparisons,
              "executionBoundary": {
                  "mode": "local-runtime-only",
                  "runner": "github-hosted-ubuntu-24.04-ephemeral",
                  "dockerEndpoint": "unix:///var/run/docker.sock",
                  "dockerConfig": "run-attempt-isolated-no-auth",
                  "artHelloEnvironmentAccess": False,
                  "productionSecretsUsed": False,
                  "candidateRuntimeNetwork": "none",
                  "browserRuntimeNetwork": "none",
                  "dependencyRetrieval": "isolated-build-and-installer-no-secrets",
                  "transport": "unix-socket",
              },
              "validationStatus": "pending-strict-validation",
              "compliant": False,
              "violations": violations or [
                  {"surface": "strict-validation-not-completed"}
              ],
          }
          (root / "manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          if violations:
              raise RuntimeError(
                  "Flag-off parity failed: "
                  + json.dumps(violations, ensure_ascii=False)
              )
          print("SCHOOL_FLAG_OFF_EXACT_PARITY=OK comparisons=12 files_per_variant=49")
          COMPARE
          printf 'result=OK\n' >> "$GITHUB_OUTPUT"

      - name: Strictly validate evidence schema and inventory
        if: always()
        id: strict
        timeout-minutes: 15
        env:
          BASE_IMAGE_ID: ${{ steps.build.outputs.base_image_id }}
          CANDIDATE_IMAGE_ID: ${{ steps.build.outputs.candidate_image_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s "$EVIDENCE_DIR/manifest.json"
          python3 - <<'VALIDATE'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import stat
          import struct

          def reject_constant(value):
              raise RuntimeError("Non-finite JSON number: " + value)

          def reject_duplicates(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise RuntimeError("Duplicate JSON key: " + key)
                  result[key] = value
              return result

          def regular_file_record(path):
              descriptor = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)
              try:
                  before = os.fstat(descriptor)
                  if not stat.S_ISREG(before.st_mode):
                      raise RuntimeError("Expected regular evidence file: " + str(path))
                  digest = hashlib.sha256()
                  size = 0
                  while True:
                      chunk = os.read(descriptor, 1024 * 1024)
                      if not chunk:
                          break
                      digest.update(chunk)
                      size += len(chunk)
                  after = os.fstat(descriptor)
              finally:
                  os.close(descriptor)
              identity_before = (
                  before.st_dev, before.st_ino, before.st_size,
                  before.st_mtime_ns, before.st_ctime_ns,
              )
              identity_after = (
                  after.st_dev, after.st_ino, after.st_size,
                  after.st_mtime_ns, after.st_ctime_ns,
              )
              if identity_before != identity_after or size != before.st_size:
                  raise RuntimeError("Evidence file changed while hashing: " + str(path))
              return {"size": size, "sha256": digest.hexdigest()}

          def assert_exact_tree(root, expected_files, expected_dirs, phase):
              actual_files = set()
              actual_dirs = set()
              directory_flags = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW

              def visit(directory_fd, prefix):
                  with os.scandir(directory_fd) as entries:
                      for entry in entries:
                          relative = entry.name if not prefix else prefix + "/" + entry.name
                          metadata = entry.stat(follow_symlinks=False)
                          mode = metadata.st_mode
                          if stat.S_ISREG(mode):
                              actual_files.add(relative)
                          elif stat.S_ISDIR(mode):
                              actual_dirs.add(relative)
                              child_fd = os.open(
                                  entry.name,
                                  directory_flags,
                                  dir_fd=directory_fd,
                              )
                              try:
                                  visit(child_fd, relative)
                              finally:
                                  os.close(child_fd)
                          elif stat.S_ISLNK(mode):
                              raise RuntimeError(
                                  f"Symlink in {phase} evidence tree: {relative}"
                              )
                          else:
                              raise RuntimeError(
                                  f"Unsupported node in {phase} evidence tree: {relative}"
                              )

              root_fd = os.open(root, directory_flags)
              try:
                  visit(root_fd, "")
              finally:
                  os.close(root_fd)
              if actual_files != expected_files or actual_dirs != expected_dirs:
                  raise RuntimeError(
                      f"Wrong {phase} evidence tree; "
                      f"missing_files={sorted(expected_files - actual_files)} "
                      f"extra_files={sorted(actual_files - expected_files)} "
                      f"missing_dirs={sorted(expected_dirs - actual_dirs)} "
                      f"extra_dirs={sorted(actual_dirs - expected_dirs)}"
                  )

          def png_size(path):
              data = path.read_bytes()
              if len(data) < 24 or data[:8] != b"\x89PNG\r\n\x1a\n":
                  raise RuntimeError("Invalid PNG: " + str(path))
              return struct.unpack(">II", data[16:24])

          root = pathlib.Path(os.environ["EVIDENCE_DIR"])
          manifest = json.loads(
              (root / "manifest.json").read_text(),
              object_pairs_hook=reject_duplicates,
              parse_constant=reject_constant,
          )
          expected_keys = {
              "version", "runId", "runAttempt", "controlSha", "baseSha",
              "candidateSha", "baseImageId",
              "candidateImageId", "designFlag", "seedDate", "source",
              "credentialsStored", "roles", "probes", "controls",
              "captureCountPerVariant", "variantArtifactCount",
              "artifactFileCount", "comparisons", "executionBoundary",
              "compliant", "violations",
              "browserSessionId", "browserVersion", "rendererProfile",
              "rendererArgs", "screenshotProtocol",
              "validationStatus",
          }
          if set(manifest) != expected_keys:
              raise RuntimeError("Wrong strict manifest root schema")
          if manifest["version"] != "1.4.0":
              raise RuntimeError("Wrong manifest version")
          if manifest["runId"] != os.environ["GITHUB_RUN_ID"]:
              raise RuntimeError("Wrong run provenance")
          if manifest["runAttempt"] != os.environ["GITHUB_RUN_ATTEMPT"]:
              raise RuntimeError("Wrong run-attempt provenance")
          if manifest["controlSha"] != os.environ["GITHUB_SHA"]:
              raise RuntimeError("Wrong control provenance")
          if manifest["baseSha"] != os.environ["BASE_SHA"]:
              raise RuntimeError("Wrong base provenance")
          if manifest["candidateSha"] != os.environ["REVIEWED_CANDIDATE_SHA"]:
              raise RuntimeError("Wrong candidate provenance")
          if manifest["baseImageId"] != os.environ["BASE_IMAGE_ID"]:
              raise RuntimeError("Wrong base image provenance")
          if manifest["candidateImageId"] != os.environ["CANDIDATE_IMAGE_ID"]:
              raise RuntimeError("Wrong candidate image provenance")
          if manifest["designFlag"] is not False:
              raise RuntimeError("Design flag is not false")
          if manifest["seedDate"] != os.environ["AUDIT_SEED_DATE"]:
              raise RuntimeError("Wrong synthetic seed date")
          if manifest["source"] != (
              "separate empty schemas from byte-identical migrations; "
              "synthetic data only"
          ):
              raise RuntimeError("Wrong synthetic source provenance")
          if manifest["credentialsStored"] is not False:
              raise RuntimeError("Credential privacy provenance failed")
          expected_renderer_args = [
              "--disable-gpu-rasterization",
              "--disable-oop-rasterization",
              "--disable-partial-raster",
              "--num-raster-threads=1",
              "--disable-skia-runtime-opts",
              "--disable-gpu-compositing",
          ]
          expected_screenshot_protocol = {
              "warmupFrames": 1,
              "evidenceFrames": 2,
              "evidenceByteIdentical": True,
              "retries": 0,
          }
          if not re.fullmatch(
              r"[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}",
              manifest["browserSessionId"],
          ):
              raise RuntimeError("Invalid single-browser session provenance")
          if not re.fullmatch(r"\d+(?:\.\d+){1,3}", manifest["browserVersion"]):
              raise RuntimeError("Invalid Chromium version provenance")
          if (
              manifest["rendererProfile"] != "deterministic-cpu-serial-raster-v1"
              or manifest["rendererArgs"] != expected_renderer_args
              or manifest["screenshotProtocol"] != expected_screenshot_protocol
          ):
              raise RuntimeError("Wrong deterministic renderer provenance")
          if (
              manifest["validationStatus"] != "pending-strict-validation"
              or manifest["compliant"] is not False
              or manifest["violations"] != [
                  {"surface": "strict-validation-not-completed"}
              ]
          ):
              raise RuntimeError("Comparison stage did not leave fail-closed pending state")
          if manifest["executionBoundary"] != {
              "mode": "local-runtime-only",
              "runner": "github-hosted-ubuntu-24.04-ephemeral",
              "dockerEndpoint": "unix:///var/run/docker.sock",
              "dockerConfig": "run-attempt-isolated-no-auth",
              "artHelloEnvironmentAccess": False,
              "productionSecretsUsed": False,
              "candidateRuntimeNetwork": "none",
              "browserRuntimeNetwork": "none",
              "dependencyRetrieval": "isolated-build-and-installer-no-secrets",
              "transport": "unix-socket",
          }:
              raise RuntimeError("Wrong local-only execution boundary")
          expected_roles = [
              {"id": "director"},
              {"id": "teacher"},
              {"id": "parent"},
              {"id": "student"},
          ]
          expected_probes = [
              {"id": "director-management", "role": "director", "route": "/management", "state": "default"},
              {"id": "teacher-journal", "role": "teacher", "route": "/journal", "state": "default"},
              {"id": "teacher-journal-modal", "role": "teacher", "route": "/journal", "state": "grade-modal"},
              {"id": "parent-homework", "role": "parent", "route": "/homework", "state": "default"},
              {"id": "parent-ranking", "role": "parent", "route": "/people", "state": "ranking"},
              {"id": "student-schedule", "role": "student", "route": "/schedule", "state": "first-weekday"},
          ]
          expected_controls = [
              {"width": 390, "height": 844},
              {"width": 1440, "height": 1000},
          ]
          if (
              manifest["roles"] != expected_roles
              or manifest["probes"] != expected_probes
              or manifest["controls"] != expected_controls
              or manifest["captureCountPerVariant"] != 12
              or manifest["variantArtifactCount"] != 49
              or manifest["artifactFileCount"] != 101
          ):
              raise RuntimeError("Wrong role/viewport matrix")
          if len(manifest["comparisons"]) != 12:
              raise RuntimeError("Wrong comparison count")
          expected_comparison_keys = {
              "probe", "role", "route", "state", "width", "height",
              "renderedHeight", "pixelExact", "differingPixels", "domExact",
              "geometryExact", "a11yExact", "files",
          }
          expected_probe_by_id = {
              probe["id"]: probe for probe in expected_probes
          }
          expected_control_by_width = {
              control["width"]: control for control in expected_controls
          }
          for comparison in manifest["comparisons"]:
              if set(comparison) != expected_comparison_keys:
                  raise RuntimeError("Wrong strict comparison schema")
              probe = expected_probe_by_id.get(comparison["probe"])
              control = expected_control_by_width.get(comparison["width"])
              if probe is None or control is None:
                  raise RuntimeError("Unknown comparison probe/viewport")
              stem = f"{probe['id']}-{control['width']}"
              rendered_width, rendered_height = png_size(
                  root / "base" / (stem + ".png")
              )
              candidate_width, candidate_height = png_size(
                  root / "candidate" / (stem + ".png")
              )
              if (
                  comparison["role"] != probe["role"]
                  or comparison["route"] != probe["route"]
                  or comparison["state"] != probe["state"]
                  or comparison["height"] != control["height"]
                  or rendered_width != control["width"]
                  or rendered_height < control["height"]
                  or (candidate_width, candidate_height)
                      != (rendered_width, rendered_height)
                  or comparison["renderedHeight"] != rendered_height
                  or comparison["pixelExact"] is not True
                  or comparison["differingPixels"] != 0
                  or comparison["domExact"] is not True
                  or comparison["geometryExact"] is not True
                  or comparison["a11yExact"] is not True
              ):
                  raise RuntimeError("A comparison is not exact")
              if set(comparison["files"]) != {
                  "png", "dom.html", "geometry.json", "aria.yml",
              }:
                  raise RuntimeError("Wrong strict comparison file schema")
              for suffix, file_record in comparison["files"].items():
                  if set(file_record) != {
                      "base", "candidate", "baseSha256", "candidateSha256",
                  }:
                      raise RuntimeError("Wrong strict comparison digest schema")
                  if (
                      file_record["base"] != f"base/{stem}.{suffix}"
                      or file_record["candidate"] != f"candidate/{stem}.{suffix}"
                  ):
                      raise RuntimeError("Comparison file is not bound to its matrix record")
                  if file_record["baseSha256"] != file_record["candidateSha256"]:
                      raise RuntimeError("Exact comparison digests differ")
                  for side, digest_key in (
                      ("base", "baseSha256"),
                      ("candidate", "candidateSha256"),
                  ):
                      relative = pathlib.PurePosixPath(file_record[side])
                      if relative.is_absolute() or ".." in relative.parts or relative.parts[0] != side:
                          raise RuntimeError("Unsafe comparison artifact path")
                      actual_digest = hashlib.sha256((root / relative).read_bytes()).hexdigest()
                      if actual_digest != file_record[digest_key]:
                          raise RuntimeError("Comparison artifact digest mismatch")
          expected_comparison_matrix = {
              (probe["id"], control["width"])
              for probe in expected_probes
              for control in expected_controls
          }
          if {
              (item["probe"], item["width"])
              for item in manifest["comparisons"]
          } != expected_comparison_matrix:
              raise RuntimeError("Wrong strict comparison matrix")

          expected_side_keys = {
              "version", "runId", "runAttempt", "side", "auditSha", "auditImageId",
              "seedDate", "flagValue", "origin", "roles", "probes",
              "controls", "captures", "results",
              "browserSessionId", "browserVersion", "rendererProfile",
              "rendererArgs", "screenshotProtocol",
          }
          expected_result_keys = {
              "probe", "role", "route", "state", "width", "height",
              "screenshot", "screenshotSha256", "geometry",
              "geometrySha256", "dom", "domSha256", "aria",
              "ariaSha256", "fullPageHeight", "designCode", "helpButtons",
              "tabRoles", "ownedRoots", "anchors", "consoleErrors",
              "pageErrors", "externalRequests",
              "warmupScreenshotSha256", "verificationScreenshotSha256",
              "screenshotAttempts",
          }
          expected_anchor_keys = {
              "directorManagementRows", "directorLegacyTitles",
              "journalRows", "journalLegacyTitles", "rankingBoards",
              "rankingButtons", "rankingTypedButtons", "genericTabButtons",
              "genericTypedButtons", "modalBackdrops", "modalDialogs",
          }
          probe_by_id = {item["id"]: item for item in manifest["probes"]}
          anchor_matrix = {}
          for variant, expected_sha, expected_image_id in (
              ("base", os.environ["BASE_SHA"], os.environ["BASE_IMAGE_ID"]),
              (
                  "candidate",
                  os.environ["REVIEWED_CANDIDATE_SHA"],
                  os.environ["CANDIDATE_IMAGE_ID"],
              ),
          ):
              child = json.loads(
                  (root / variant / "manifest.json").read_text(),
                  object_pairs_hook=reject_duplicates,
                  parse_constant=reject_constant,
              )
              if set(child) != expected_side_keys:
                  raise RuntimeError("Wrong child manifest schema for " + variant)
              if (
                  child["version"] != "1.3.0"
                  or child["runId"] != os.environ["GITHUB_RUN_ID"]
                  or child["runAttempt"] != os.environ["GITHUB_RUN_ATTEMPT"]
                  or child["side"] != variant
                  or child["auditSha"] != expected_sha
                  or child["auditImageId"] != expected_image_id
                  or child["seedDate"] != manifest["seedDate"]
                  or child["flagValue"] is not False
                  or child["origin"] != "loopback-unix-socket"
                  or child["browserSessionId"] != manifest["browserSessionId"]
                  or child["browserVersion"] != manifest["browserVersion"]
                  or child["rendererProfile"] != manifest["rendererProfile"]
                  or child["rendererArgs"] != expected_renderer_args
                  or child["screenshotProtocol"] != expected_screenshot_protocol
                  or child["roles"] != manifest["roles"]
                  or child["probes"] != manifest["probes"]
                  or child["controls"] != manifest["controls"]
                  or child["captures"] != 12
                  or len(child["results"]) != 12
              ):
                  raise RuntimeError("Wrong child manifest provenance for " + variant)

              seen = set()
              anchor_matrix[variant] = {}
              for result in child["results"]:
                  if set(result) != expected_result_keys:
                      raise RuntimeError("Wrong child result schema for " + variant)
                  key = (result["probe"], result["width"])
                  if key in seen or result["probe"] not in probe_by_id:
                      raise RuntimeError("Duplicate or unknown child probe for " + variant)
                  seen.add(key)
                  probe = probe_by_id[result["probe"]]
                  if (
                      result["role"] != probe["role"]
                      or result["route"] != probe["route"]
                      or result["state"] != probe["state"]
                      or result["width"] not in (390, 1440)
                      or result["height"] != (844 if result["width"] == 390 else 1000)
                      or result["fullPageHeight"] < result["height"]
                      or result["fullPageHeight"] > 10000
                      or result["designCode"] is not None
                      or result["helpButtons"] != 0
                      or result["tabRoles"] != 0
                      or result["consoleErrors"] != []
                      or result["pageErrors"] != []
                      or result["externalRequests"] != []
                      or result["screenshotAttempts"] != 3
                      or not re.fullmatch(
                          r"[a-f0-9]{64}", result["warmupScreenshotSha256"]
                      )
                      or result["verificationScreenshotSha256"]
                          != result["screenshotSha256"]
                  ):
                      raise RuntimeError("Flag-off runtime result failed for " + repr(key))
                  stem = f"{result['probe']}-{result['width']}"
                  files_and_hashes = (
                      ("screenshot", "screenshotSha256", stem + ".png"),
                      ("dom", "domSha256", stem + ".dom.html"),
                      ("geometry", "geometrySha256", stem + ".geometry.json"),
                      ("aria", "ariaSha256", stem + ".aria.yml"),
                  )
                  for file_key, hash_key, expected_name in files_and_hashes:
                      if result[file_key] != expected_name:
                          raise RuntimeError("Wrong child file reference: " + expected_name)
                      payload = (root / variant / expected_name).read_bytes()
                      if hashlib.sha256(payload).hexdigest() != result[hash_key]:
                          raise RuntimeError("Wrong child digest: " + expected_name)
                  anchors = result["anchors"]
                  if set(anchors) != expected_anchor_keys:
                      raise RuntimeError("Wrong anchor schema for " + repr(key))
                  expected_owned_roots = 2 if result["probe"] == "teacher-journal-modal" else 1
                  if result["ownedRoots"] != expected_owned_roots:
                      raise RuntimeError("Wrong owned-root count for " + repr(key))
                  if result["probe"] == "director-management" and (
                      anchors["directorManagementRows"] != 16
                      or anchors["directorLegacyTitles"] != 0
                  ):
                      raise RuntimeError("Director title/count anchor failed")
                  if result["probe"].startswith("teacher-journal") and (
                      anchors["journalRows"] != 6
                      or anchors["journalLegacyTitles"] != 0
                      or anchors["genericTabButtons"] != 5
                      or anchors["genericTypedButtons"] != 0
                  ):
                      raise RuntimeError("Journal title/tab/count anchor failed")
                  if result["probe"] == "teacher-journal-modal" and (
                      anchors["modalBackdrops"] != 1
                      or anchors["modalDialogs"] != 1
                  ):
                      raise RuntimeError("Modal/root count anchor failed")
                  if result["probe"] == "parent-homework" and (
                      anchors["genericTabButtons"] != 5
                      or anchors["genericTypedButtons"] != 0
                  ):
                      raise RuntimeError("Parent legacy tab/count anchor failed")
                  if result["probe"] == "parent-ranking" and (
                      anchors["rankingBoards"] != 1
                      or anchors["rankingButtons"] != 3
                      or anchors["rankingTypedButtons"] != 0
                  ):
                      raise RuntimeError("Ranking ARIA/type/count anchor failed")
                  if result["probe"] == "student-schedule" and (
                      anchors["genericTabButtons"] != 5
                      or anchors["genericTypedButtons"] != 0
                  ):
                      raise RuntimeError("Student legacy tab/count anchor failed")
                  anchor_matrix[variant][key] = {
                      "ownedRoots": result["ownedRoots"],
                      "anchors": anchors,
                  }
              expected_matrix = {
                  (probe_id, width)
                  for probe_id in probe_by_id
                  for width in (390, 1440)
              }
              if seen != expected_matrix:
                  raise RuntimeError("Incomplete child probe matrix for " + variant)

          if anchor_matrix["base"] != anchor_matrix["candidate"]:
              raise RuntimeError("Base/candidate fail-closed anchor counts differ")

          owner_path = root / "evidence-owner.json"
          if not owner_path.is_file() or owner_path.is_symlink():
              raise RuntimeError("Missing regular evidence owner sentinel")
          owner = json.loads(
              owner_path.read_text(),
              object_pairs_hook=reject_duplicates,
              parse_constant=reject_constant,
          )
          expected_controls = {
              "workflowSha256": hashlib.sha256(pathlib.Path(
                  ".github/workflows/school-diary-design-v1-flag-off.yml"
              ).read_bytes()).hexdigest(),
              "fixtureSha256": hashlib.sha256(pathlib.Path(
                  ".github/scripts/school-authorized-visual-fixture.sh"
              ).read_bytes()).hexdigest(),
              "captureSha256": hashlib.sha256(pathlib.Path(
                  ".github/scripts/school-flag-off-capture.mjs"
              ).read_bytes()).hexdigest(),
          }
          if owner != {
              "version": "1.1.0",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "runId": os.environ["GITHUB_RUN_ID"],
              "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "controlSha": os.environ["GITHUB_SHA"],
              "controls": expected_controls,
          }:
              raise RuntimeError("Wrong evidence owner sentinel")

          expected_files = {"manifest.json", "evidence-owner.json"}
          expected_probe_ids = [
              "director-management",
              "teacher-journal",
              "teacher-journal-modal",
              "parent-homework",
              "parent-ranking",
              "student-schedule",
          ]
          for variant in ("base", "candidate"):
              expected_files.add(f"{variant}/manifest.json")
              for probe_id in expected_probe_ids:
                  for width in (390, 1440):
                      stem = f"{variant}/{probe_id}-{width}"
                      expected_files.update({
                          stem + ".png",
                          stem + ".dom.html",
                          stem + ".geometry.json",
                          stem + ".aria.yml",
                      })
          expected_dirs = {"base", "candidate"}
          assert_exact_tree(root, expected_files, expected_dirs, "strict-input")
          if len(expected_files) != 100:
              raise RuntimeError("Wrong total artifact count: " + str(len(expected_files)))
          manifest["validationStatus"] = "strict-validated-pending-finalization"
          manifest["compliant"] = False
          manifest["violations"] = [
              {"surface": "finalization-not-completed"}
          ]
          validated = root / ".manifest.validated.tmp"
          validated.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          os.replace(validated, root / "manifest.json")
          final_manifest = json.loads(
              (root / "manifest.json").read_text(),
              object_pairs_hook=reject_duplicates,
              parse_constant=reject_constant,
          )
          if (
              final_manifest["validationStatus"]
                  != "strict-validated-pending-finalization"
              or final_manifest["compliant"] is not False
              or final_manifest["violations"] != [
                  {"surface": "finalization-not-completed"}
              ]
          ):
              raise RuntimeError("Strict pending-finalization transition failed")
          immutable_files = sorted(expected_files)
          seal = {
              "version": "1.0.0",
              "state": "strict-validated-pending-finalization",
              "runId": os.environ["GITHUB_RUN_ID"],
              "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "controlSha": os.environ["GITHUB_SHA"],
              "files": {
                  name: regular_file_record(root / name)
                  for name in immutable_files
              },
          }
          seal_path = root / "integrity-seal.json"
          seal_temporary = root / ".integrity-seal.pending.tmp"
          seal_temporary.write_text(
              json.dumps(seal, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          os.replace(seal_temporary, seal_path)
          sealed_files = expected_files | {"integrity-seal.json"}
          assert_exact_tree(root, sealed_files, expected_dirs, "strict-sealed")
          if len(sealed_files) != 101:
              raise RuntimeError("Wrong sealed artifact count")
          print("SCHOOL_FLAG_OFF_ARTIFACT=STRICT_OK files=101")
          VALIDATE
          pending_seal_sha="$(sha256sum "$EVIDENCE_DIR/integrity-seal.json" | cut -d' ' -f1)"
          [[ "$pending_seal_sha" =~ ^[a-f0-9]{64}$ ]]
          printf 'pending_seal_sha=%s\n' "$pending_seal_sha" >> "$GITHUB_OUTPUT"

      - name: Remove local secondary images
        if: always()
        timeout-minutes: 10
        env:
          BASE_IMAGE_ID: ${{ steps.build.outputs.base_image_id }}
          CANDIDATE_IMAGE_ID: ${{ steps.build.outputs.candidate_image_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          case "$RUNNER_TEMP" in
            /*) ;;
            *) exit 1 ;;
          esac
          test "$RUNNER_TEMP" != /
          test -d "$RUNNER_TEMP"
          test ! -L "$RUNNER_TEMP"
          expected_docker_config="$RUNNER_TEMP/school-flag-off-docker-config-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test "${DOCKER_HOST:-}" = unix:///var/run/docker.sock
          test "${DOCKER_CONFIG:-}" = "$expected_docker_config"
          test -d "$expected_docker_config"
          test ! -L "$expected_docker_config"
          test "$(stat -c '%u:%g:%a' "$expected_docker_config")" = \
            "$(id -u):$(id -g):700"
          for variable in \
            DOCKER_CONTEXT DOCKER_TLS_VERIFY DOCKER_CERT_PATH \
            DOCKER_TLS DOCKER_TLS_CERTDIR DOCKER_AUTH_CONFIG \
            DOCKER_CUSTOM_HEADERS REGISTRY_AUTH_FILE DOCKER_API_VERSION \
            BUILDKIT_HOST BUILDX_BUILDER BUILDX_CONFIG; do
            if [[ -v $variable ]]; then
              test -z "${!variable}" || {
                printf 'Nonempty Docker endpoint/TLS/auth override rejected: %s\n' \
                  "$variable" >&2
                exit 1
              }
            fi
          done
          test -S /var/run/docker.sock
          test ! -L /var/run/docker.sock
          test "$(docker --host unix:///var/run/docker.sock \
            --config "$expected_docker_config" context inspect default \
            --format '{{.Endpoints.docker.Host}}')" = \
            unix:///var/run/docker.sock
          probe_exact_image_tag() {
            local target="$1"
            local inventory
            local reference
            local image_id
            local extra
            local matches=0
            if ! inventory="$(
              docker image ls --no-trunc \
                --format '{{.Repository}}:{{.Tag}}|{{.ID}}'
            )"; then
              printf 'Docker image inventory failed\n' >&2
              return 1
            fi
            PROBED_IMAGE_ID=""
            while IFS='|' read -r reference image_id extra; do
              if [ "$reference" = "$target" ]; then
                test -z "$extra" || return 1
                [[ "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]] || return 1
                matches=$((matches + 1))
                PROBED_IMAGE_ID="$image_id"
              fi
            done <<< "$inventory"
            test "$matches" -le 1
          }
          assert_saved_image() {
            local expected_id="$1"
            local side="$2"
            local audit_sha="$3"
            local container_refs
            local values
            [[ "$expected_id" =~ ^sha256:[a-f0-9]{64}$ ]] || return 1
            test "$(docker image inspect "$expected_id" --format '{{.Id}}')" = \
              "$expected_id" || return 1
            if ! container_refs="$(docker ps -aq --filter "ancestor=$expected_id")"; then
              return 1
            fi
            test -z "$container_refs" || return 1
            if ! values="$(
              docker image inspect "$expected_id" \
                --format '{{range .Config.Env}}{{println .}}{{end}}' |
                sed -n 's/^NEXT_PUBLIC_SCHOOL_DESIGN_V1=//p'
            )"; then return 1; fi
            test "$(printf '%s\n' "$values" | sed '/^$/d' | wc -l)" -eq 1 || return 1
            test "$values" = false || return 1
            test "$(docker image inspect "$expected_id" --format '{{index .Config.Labels "school.system"}}')" = school-1-11 || return 1
            test "$(docker image inspect "$expected_id" --format '{{index .Config.Labels "school.environment"}}')" = synthetic || return 1
            test "$(docker image inspect "$expected_id" --format '{{index .Config.Labels "school.purpose"}}')" = flag-off-secondary-image || return 1
            test "$(docker image inspect "$expected_id" --format '{{index .Config.Labels "school.audit-side"}}')" = "$side" || return 1
            test "$(docker image inspect "$expected_id" --format '{{index .Config.Labels "school.audit-sha"}}')" = "$audit_sha" || return 1
            test "$(docker image inspect "$expected_id" --format '{{index .Config.Labels "school.control-sha"}}')" = "$GITHUB_SHA" || return 1
            test "$(docker image inspect "$expected_id" --format '{{index .Config.Labels "school.audit-repository"}}')" = "$GITHUB_REPOSITORY" || return 1
            test "$(docker image inspect "$expected_id" --format '{{index .Config.Labels "school.audit-run-id"}}')" = "$GITHUB_RUN_ID" || return 1
            test "$(docker image inspect "$expected_id" --format '{{index .Config.Labels "school.audit-run-attempt"}}')" = "$GITHUB_RUN_ATTEMPT" || return 1
          }
          cleanup_one_image() {
            local record="$1"
            local tag expected side audit_sha
            local image_tags
            local tag_count
            local target_count
            IFS='|' read -r tag expected side audit_sha <<< "$record"
            probe_exact_image_tag "$tag" || return 1
            if [ -n "$PROBED_IMAGE_ID" ]; then
              [[ "$expected" =~ ^sha256:[a-f0-9]{64}$ ]] || return 1
              test "$PROBED_IMAGE_ID" = "$expected" || return 1
              assert_saved_image "$expected" "$side" "$audit_sha" || return 1
              if ! image_tags="$(docker image inspect "$expected" \
                --format '{{range .RepoTags}}{{println .}}{{end}}')"; then
                return 1
              fi
              tag_count="$(printf '%s\n' "$image_tags" | sed '/^$/d' | wc -l)"
              target_count="$(printf '%s\n' "$image_tags" | grep -Fxc -- "$tag" || true)"
              test "$target_count" -eq 1 || return 1
              probe_exact_image_tag "$tag" || return 1
              test "$PROBED_IMAGE_ID" = "$expected" || return 1
              test "$(docker image inspect "$tag" --format '{{.Id}}')" = \
                "$expected" || return 1
              if [ "$tag_count" -eq 1 ]; then
                docker image rm "$expected" >/dev/null || return 1
                if docker image inspect "$expected" >/dev/null 2>&1; then
                  return 1
                fi
              else
                docker image rm "$tag" >/dev/null || return 1
              fi
            elif [ -n "$expected" ]; then
              [[ "$expected" =~ ^sha256:[a-f0-9]{64}$ ]] || return 1
              if docker image inspect "$expected" >/dev/null 2>&1; then
                assert_saved_image "$expected" "$side" "$audit_sha" || return 1
                if ! image_tags="$(docker image inspect "$expected" \
                  --format '{{range .RepoTags}}{{println .}}{{end}}')"; then
                  return 1
                fi
                test -z "$image_tags" || return 1
                docker image rm "$expected" >/dev/null || return 1
                if docker image inspect "$expected" >/dev/null 2>&1; then
                  return 1
                fi
              fi
            fi
            probe_exact_image_tag "$tag" || return 1
            if [ -n "$PROBED_IMAGE_ID" ]; then
              printf 'Local audit image tag survived cleanup: %s\n' \
                "$tag" >&2
              return 1
            fi
          }
          cleanup_docker_config() {
            local expected="$RUNNER_TEMP/school-flag-off-docker-config-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            local auth_found=0
            test "$expected" = "$expected_docker_config" || return 1
            test "$DOCKER_CONFIG" = "$expected" || return 1
            case "$expected" in
              "$RUNNER_TEMP"/school-flag-off-docker-config-*) ;;
              *) return 1 ;;
            esac
            test -d "$expected" || return 1
            test ! -L "$expected" || return 1
            test "$(stat -c '%u:%g:%a' "$expected")" = \
              "$(id -u):$(id -g):700" || return 1
            if [ -e "$expected/config.json" ] || [ -L "$expected/config.json" ]; then
              auth_found=1
            fi
            find -P "$expected" -xdev -depth -mindepth 1 -delete || return 1
            rmdir -- "$expected" || return 1
            test ! -e "$expected" || return 1
            test ! -L "$expected" || return 1
            test "$auth_found" -eq 0
          }
          cleanup_rc=0
          for record in \
            "$BASE_OFF_IMAGE|$BASE_IMAGE_ID|base|$BASE_SHA" \
            "$CANDIDATE_OFF_IMAGE|$CANDIDATE_IMAGE_ID|candidate|$REVIEWED_CANDIDATE_SHA"; do
            cleanup_one_image "$record" || cleanup_rc=1
          done
          cleanup_docker_config || cleanup_rc=1
          test "$cleanup_rc" -eq 0
          printf 'SCHOOL_FLAG_OFF_LOCAL_CLEANUP=OK images=exact docker_config=removed\n'

      - name: Finalize compliant evidence after all gates
        id: finalize
        timeout-minutes: 5
        env:
          PENDING_SEAL_SHA: ${{ steps.strict.outputs.pending_seal_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'FINALIZE'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import stat

          def reject_constant(value):
              raise RuntimeError("Non-finite JSON number: " + value)

          def reject_duplicates(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise RuntimeError("Duplicate JSON key: " + key)
                  result[key] = value
              return result

          def read_regular_bytes(path):
              descriptor = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)
              try:
                  before = os.fstat(descriptor)
                  if not stat.S_ISREG(before.st_mode):
                      raise RuntimeError("Expected regular evidence file: " + str(path))
                  payload = bytearray()
                  while True:
                      chunk = os.read(descriptor, 1024 * 1024)
                      if not chunk:
                          break
                      payload.extend(chunk)
                  after = os.fstat(descriptor)
              finally:
                  os.close(descriptor)
              identity_before = (
                  before.st_dev, before.st_ino, before.st_size,
                  before.st_mtime_ns, before.st_ctime_ns,
              )
              identity_after = (
                  after.st_dev, after.st_ino, after.st_size,
                  after.st_mtime_ns, after.st_ctime_ns,
              )
              if identity_before != identity_after or len(payload) != before.st_size:
                  raise RuntimeError("Evidence file changed while reading: " + str(path))
              return bytes(payload)

          def load_json(path):
              return json.loads(
                  read_regular_bytes(path).decode("utf-8"),
                  object_pairs_hook=reject_duplicates,
                  parse_constant=reject_constant,
              )

          def file_record(path):
              data = read_regular_bytes(path)
              return {"size": len(data), "sha256": hashlib.sha256(data).hexdigest()}

          def write_new_regular(path, data):
              descriptor = os.open(
                  path,
                  os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW,
                  0o600,
              )
              try:
                  view = memoryview(data)
                  while view:
                      written = os.write(descriptor, view)
                      if written <= 0:
                          raise RuntimeError("Short evidence staging write: " + str(path))
                      view = view[written:]
                  os.fsync(descriptor)
              finally:
                  os.close(descriptor)

          def assert_exact_tree(root, expected_files, expected_dirs, phase):
              actual_files = set()
              actual_dirs = set()
              directory_flags = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW

              def visit(directory_fd, prefix):
                  with os.scandir(directory_fd) as entries:
                      for entry in entries:
                          relative = entry.name if not prefix else prefix + "/" + entry.name
                          metadata = entry.stat(follow_symlinks=False)
                          mode = metadata.st_mode
                          if stat.S_ISREG(mode):
                              actual_files.add(relative)
                          elif stat.S_ISDIR(mode):
                              actual_dirs.add(relative)
                              child_fd = os.open(
                                  entry.name,
                                  directory_flags,
                                  dir_fd=directory_fd,
                              )
                              try:
                                  visit(child_fd, relative)
                              finally:
                                  os.close(child_fd)
                          elif stat.S_ISLNK(mode):
                              raise RuntimeError(
                                  f"Symlink in {phase} evidence tree: {relative}"
                              )
                          else:
                              raise RuntimeError(
                                  f"Unsupported node in {phase} evidence tree: {relative}"
                              )

              root_fd = os.open(root, directory_flags)
              try:
                  visit(root_fd, "")
              finally:
                  os.close(root_fd)
              if actual_files != expected_files or actual_dirs != expected_dirs:
                  raise RuntimeError(
                      f"Wrong {phase} evidence tree; "
                      f"missing_files={sorted(expected_files - actual_files)} "
                      f"extra_files={sorted(actual_files - expected_files)} "
                      f"missing_dirs={sorted(expected_dirs - actual_dirs)} "
                      f"extra_dirs={sorted(actual_dirs - expected_dirs)}"
                  )

          root = pathlib.Path(os.environ["EVIDENCE_DIR"])
          expected_root_name = (
              "school-flag-off-evidence-"
              + os.environ["GITHUB_RUN_ID"]
              + "-"
              + os.environ["GITHUB_RUN_ATTEMPT"]
          )
          root_metadata = root.lstat()
          if root.name != expected_root_name or not stat.S_ISDIR(root_metadata.st_mode):
              raise RuntimeError("Wrong evidence root")

          expected_files = {"manifest.json", "integrity-seal.json", "evidence-owner.json"}
          probe_ids = [
              "director-management",
              "teacher-journal",
              "teacher-journal-modal",
              "parent-homework",
              "parent-ranking",
              "student-schedule",
          ]
          for variant in ("base", "candidate"):
              expected_files.add(f"{variant}/manifest.json")
              for probe_id in probe_ids:
                  for width in (390, 1440):
                      stem = f"{variant}/{probe_id}-{width}"
                      expected_files.update({
                          stem + ".png",
                          stem + ".dom.html",
                          stem + ".geometry.json",
                          stem + ".aria.yml",
                      })
          if len(expected_files) != 101:
              raise RuntimeError("Internal final inventory error")
          expected_dirs = {"base", "candidate"}
          assert_exact_tree(root, expected_files, expected_dirs, "pre-finalization")

          manifest_path = root / "manifest.json"
          seal_path = root / "integrity-seal.json"
          pending_seal_sha = os.environ["PENDING_SEAL_SHA"]
          if (
              not re.fullmatch(r"[a-f0-9]{64}", pending_seal_sha)
              or file_record(seal_path)["sha256"] != pending_seal_sha
          ):
              raise RuntimeError("Pending seal output binding failed")
          manifest = load_json(manifest_path)
          seal = load_json(seal_path)
          if (
              manifest.get("version") != "1.4.0"
              or manifest.get("runId") != os.environ["GITHUB_RUN_ID"]
              or manifest.get("runAttempt") != os.environ["GITHUB_RUN_ATTEMPT"]
              or manifest.get("controlSha") != os.environ["GITHUB_SHA"]
              or manifest.get("baseSha") != os.environ["BASE_SHA"]
              or manifest.get("candidateSha") != os.environ["REVIEWED_CANDIDATE_SHA"]
              or manifest.get("artifactFileCount") != 101
              or manifest.get("executionBoundary") != {
                  "mode": "local-runtime-only",
                  "runner": "github-hosted-ubuntu-24.04-ephemeral",
                  "dockerEndpoint": "unix:///var/run/docker.sock",
                  "dockerConfig": "run-attempt-isolated-no-auth",
                  "artHelloEnvironmentAccess": False,
                  "productionSecretsUsed": False,
                  "candidateRuntimeNetwork": "none",
                  "browserRuntimeNetwork": "none",
                  "dependencyRetrieval": "isolated-build-and-installer-no-secrets",
                  "transport": "unix-socket",
              }
              or manifest.get("validationStatus")
                  != "strict-validated-pending-finalization"
              or manifest.get("compliant") is not False
              or manifest.get("violations") != [
                  {"surface": "finalization-not-completed"}
              ]
          ):
              raise RuntimeError("Evidence is not in strict pending-finalization state")

          if set(seal) != {
              "version", "state", "runId", "runAttempt", "controlSha", "files"
          }:
              raise RuntimeError("Wrong pending seal schema")
          if (
              seal["version"] != "1.0.0"
              or seal["state"] != "strict-validated-pending-finalization"
              or seal["runId"] != os.environ["GITHUB_RUN_ID"]
              or seal["runAttempt"] != os.environ["GITHUB_RUN_ATTEMPT"]
              or seal["controlSha"] != os.environ["GITHUB_SHA"]
              or set(seal["files"]) != expected_files - {"integrity-seal.json"}
          ):
              raise RuntimeError("Wrong pending seal provenance")
          for name, expected in seal["files"].items():
              if (
                  set(expected) != {"size", "sha256"}
                  or type(expected["size"]) is not int
                  or expected["size"] < 0
                  or not re.fullmatch(r"[a-f0-9]{64}", expected["sha256"])
                  or file_record(root / name) != expected
              ):
                  raise RuntimeError("Pending seal mismatch: " + name)

          manifest["validationStatus"] = "passed"
          manifest["compliant"] = True
          manifest["violations"] = []
          manifest_bytes = (
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n"
          ).encode("utf-8")
          final_files = dict(seal["files"])
          final_files["manifest.json"] = {
              "size": len(manifest_bytes),
              "sha256": hashlib.sha256(manifest_bytes).hexdigest(),
          }
          final_seal = {
              "version": "1.0.0",
              "state": "passed",
              "runId": os.environ["GITHUB_RUN_ID"],
              "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "controlSha": os.environ["GITHUB_SHA"],
              "files": final_files,
          }
          manifest_temporary = root / ".manifest.finalized.tmp"
          seal_temporary = root / ".integrity-seal.finalized.tmp"
          final_seal_bytes = (
              json.dumps(final_seal, ensure_ascii=False, indent=2, sort_keys=True) + "\n"
          ).encode("utf-8")
          write_new_regular(manifest_temporary, manifest_bytes)
          write_new_regular(seal_temporary, final_seal_bytes)
          if load_json(manifest_temporary) != manifest:
              raise RuntimeError("Final manifest staging failed")
          if load_json(seal_temporary) != final_seal:
              raise RuntimeError("Final seal staging failed")
          staged_files = expected_files | {
              manifest_temporary.name,
              seal_temporary.name,
          }
          assert_exact_tree(root, staged_files, expected_dirs, "staged-finalization")
          if file_record(seal_path)["sha256"] != pending_seal_sha:
              raise RuntimeError("Pending seal changed before final transition")
          for name, expected in seal["files"].items():
              if file_record(root / name) != expected:
                  raise RuntimeError("Evidence changed before final transition: " + name)
          if file_record(manifest_temporary) != final_files["manifest.json"]:
              raise RuntimeError("Final manifest changed before transition")
          # Persist the seal first and publish compliant=true last. If the second
          # replace fails, the manifest remains fail-closed in its pending state.
          directory_flags = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW
          transition_fd = os.open(root, directory_flags)
          try:
              os.replace(
                  seal_temporary.name,
                  seal_path.name,
                  src_dir_fd=transition_fd,
                  dst_dir_fd=transition_fd,
              )
              os.fsync(transition_fd)
              assert_exact_tree(
                  root,
                  expected_files | {manifest_temporary.name},
                  expected_dirs,
                  "seal-persisted",
              )
              if load_json(seal_path) != final_seal:
                  raise RuntimeError("Final seal persistence failed")
              for name, expected in seal["files"].items():
                  if file_record(root / name) != expected:
                      raise RuntimeError(
                          "Evidence changed before compliant transition: " + name
                      )
              if file_record(manifest_temporary) != final_files["manifest.json"]:
                  raise RuntimeError("Final manifest changed before compliant transition")
              os.replace(
                  manifest_temporary.name,
                  manifest_path.name,
                  src_dir_fd=transition_fd,
                  dst_dir_fd=transition_fd,
              )
              os.fsync(transition_fd)
          finally:
              os.close(transition_fd)

          final_manifest = load_json(manifest_path)
          persisted_seal = load_json(seal_path)
          if (
              final_manifest != manifest
              or persisted_seal != final_seal
              or final_manifest["validationStatus"] != "passed"
              or final_manifest["compliant"] is not True
              or final_manifest["violations"] != []
          ):
              raise RuntimeError("Final compliant transition failed")
          assert_exact_tree(root, expected_files, expected_dirs, "post-finalization")
          for name, expected in final_seal["files"].items():
              if file_record(root / name) != expected:
                  raise RuntimeError("Final seal mismatch: " + name)
          print("SCHOOL_FLAG_OFF_MANIFEST=COMPLIANT files=101 sealed=100")
          FINALIZE
          printf 'evidence_ready=true\n' >> "$GITHUB_OUTPUT"

      - name: Upload strict flag-off evidence
        if: steps.finalize.outcome == 'success' && steps.finalize.outputs.evidence_ready == 'true'
        timeout-minutes: 10
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: school-design-v1-flag-off-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish flag-off result
        if: always()
        timeout-minutes: 5
        env:
          JOB_STATUS: ${{ job.status }}
          COMPARE_RESULT: ${{ steps.compare.outputs.result }}
          BASE_IMAGE_ID: ${{ steps.build.outputs.base_image_id }}
          CANDIDATE_IMAGE_ID: ${{ steps.build.outputs.candidate_image_id }}
        shell: bash
        run: |
          {
            echo '## School diary design v1 flag-off parity'
            echo
            printf -- '- Base: %s\n' "$BASE_SHA"
            printf -- '- Candidate: %s\n' "$REVIEWED_CANDIDATE_SHA"
            printf -- '- Base immutable image: %s\n' "${BASE_IMAGE_ID:-not-built}"
            printf -- '- Candidate immutable image: %s\n' "${CANDIDATE_IMAGE_ID:-not-built}"
            printf -- '- Build flag: NEXT_PUBLIC_SCHOOL_DESIGN_V1=false\n'
            printf -- '- Matrix: 6 fail-closed probes × 390/1440 px (12 captures per image)\n'
            printf -- '- Roles: director, teacher, parent, student\n'
            printf -- '- Probes: ranking ARIA/type; Journal/Admin titles; modal/root outside app\n'
            printf -- '- Exact surfaces: screenshot, owned-root DOM, body accessibility, geometry\n'
            printf -- '- Renderer: one long-lived Chromium browser launch; verified six-flag CPU/serial raster profile\n'
            printf -- '- Screenshot stability: one discarded warm-up + two byte-identical evidence frames; zero retries\n'
            printf -- '- Strict inventory: 49 files/image + owner + manifest + integrity seal = 101 files\n'
            printf -- '- Data: fixed-date synthetic only\n'
            printf -- '- Runner: ephemeral GitHub-hosted Ubuntu 24.04; no self-hosted ArtHello execution\n'
            printf -- '- Docker control: exact local unix:///var/run/docker.sock; isolated no-auth config removed\n'
            printf -- '- Production access material: no SSH, deployment key, environment, or production secret configured\n'
            printf -- '- Candidate/browser runtime: network none over a run-owned Unix socket\n'
            printf -- '- Dependency retrieval: isolated BuildKit and installer, with no project secrets\n'
            printf -- '- Exact comparison step: %s\n' "${COMPARE_RESULT:-not-completed}"
            printf -- '- Result: %s\n' "$JOB_STATUS"
          } >> "$GITHUB_STEP_SUMMARY"
