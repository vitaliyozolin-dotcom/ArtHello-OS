          expected_pids = (
              None
              if os.environ["EXPECTED_PIDS_LIMIT"] == "unset"
              else int(os.environ["EXPECTED_PIDS_LIMIT"])
          )
          expected_host = {
              "Memory": 6442450944,
              "MemorySwap": 6442450944,
              "CpuPeriod": 100000,
              "CpuQuota": 400000,
              "PidsLimit": expected_pids,
              "Privileged": True,
              "ReadonlyRootfs": False,
              "AutoRemove": False,
