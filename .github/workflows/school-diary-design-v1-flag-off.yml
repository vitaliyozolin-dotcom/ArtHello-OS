          assert_no_persisted_credentials .
          assert_no_persisted_credentials source-base
          assert_no_persisted_credentials source-candidate
          for control_path in \
            .github/workflows/school-diary-design-v1-flag-off.yml \
            .github/scripts/school-authorized-visual-fixture.sh \
            .github/scripts/school-flag-off-capture.mjs \
            .github/fixtures/school-hosting.json \
            .github/fixtures/school-dockerignore; do
