            "$(id -u):$(id -g):700" ]; then
            exit 1
          fi
          if [ "$(stat -c '%u:%g:%a' "$docker_config")" != \
            "$(id -u):$(id -g):700" ]; then
            exit 1
          fi
          if [ "$(stat -c '%u:%g:%a' "$buildx_config")" != \
            "$(id -u):$(id -g):700" ]; then
            exit 1
          fi
          if [ "$(cat "$build_root/owner")" != "$owner_value" ]; then
            exit 1
          fi
          if ! verify_local_docker_endpoint; then
            exit 1
          fi
          if ! container_present; then
            exit 1
          fi
          if [ -n "$PROBED_CONTAINER_ID" ]; then
            exit 1
          fi
          if ! volume_present; then
            exit 1
          fi
          if [ "$PROBED_VOLUME_PRESENT" != no ]; then
            exit 1
          fi

          assert_no_persisted_credentials() {
