          diff -u "$expected" "$actual"
          rm -f -- "$actual" "$expected"
          cmp source-base/Dockerfile source-candidate/Dockerfile
          cmp source-base/package.json source-candidate/package.json
          cmp source-base/package-lock.json source-candidate/package-lock.json
          diff -qr source-base/drizzle source-candidate/drizzle

          for source in source-base source-candidate; do
            install -m 0755 -d "$source/.openai"
            cp .github/fixtures/school-hosting.json "$source/.openai/hosting.json"
            cp .github/fixtures/school-dockerignore "$source/.dockerignore"
            test "$(sha256sum "$source/.openai/hosting.json" | cut -d' ' -f1)" \
              = 496e738fab42ede81bc826d1b5319609192bf4af7474777d66c9b5c8f8d5c16f
            test "$(sha256sum "$source/.dockerignore" | cut -d' ' -f1)" \
              = c727c5d0f01245e7b3c488e6cb01429e0beee23b798eee8ae4dc7df46a2c4446
          done

          created_volume="$(
            docker volume create \
              --driver local \
              --label school.system=school-1-11 \
              --label school.environment=synthetic \
              --label school.purpose=flag-off-buildkit-state \
              --label school.audit-owner=school-diary-flag-off \
              --label "school.audit-repository=$GITHUB_REPOSITORY" \
              --label "school.audit-run-id=$GITHUB_RUN_ID" \
              --label "school.audit-run-attempt=$GITHUB_RUN_ATTEMPT" \
              --label "school.control-sha=$GITHUB_SHA" \
              --label "school.audit-nonce=$audit_nonce" \
              "$state_volume"
          )"
          if [ "$created_volume" != "$state_volume" ]; then
            exit 1
          fi
          if ! assert_or_record_volume_identity record; then
            exit 1
          fi
          if ! assert_or_record_volume_identity verify; then
            exit 1
          fi

          created_builder="$(
            docker buildx create \
              --name "$builder_name" \
              --node "$node_name" \
              --driver docker-container \
              --buildkitd-flags \
                '--debug=false --oci-worker-gc=true --oci-worker-gc-keepstorage=6000' \
              --driver-opt "image=$BUILDKIT_IMAGE" \
              --driver-opt network=bridge \
              --driver-opt memory=6g \
              --driver-opt memory-swap=6g \
              --driver-opt cpu-period=100000 \
              --driver-opt cpu-quota=400000 \
              --driver-opt restart-policy=no \
              --driver-opt provenance-add-gha=false \
              --driver-opt env.SCHOOL_AUDIT_OWNER=school-diary-flag-off \
              --driver-opt "env.SCHOOL_AUDIT_REPOSITORY=$GITHUB_REPOSITORY" \
              --driver-opt "env.SCHOOL_AUDIT_RUN_ID=$GITHUB_RUN_ID" \
              --driver-opt "env.SCHOOL_AUDIT_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT" \
              --driver-opt "env.SCHOOL_AUDIT_CONTROL_SHA=$GITHUB_SHA" \
              --driver-opt "env.SCHOOL_AUDIT_STATE_VOLUME=$state_volume" \
              --driver-opt "env.SCHOOL_AUDIT_NONCE=$audit_nonce"
          )"
          if [ "$created_builder" != "$builder_name" ]; then
            exit 1
          fi
          docker buildx inspect "$builder_name" --bootstrap >/dev/null
          if ! container_present; then
            exit 1
          fi
          if [ -z "$PROBED_CONTAINER_ID" ]; then
            exit 1
          fi
          bootstrap_container_id="$PROBED_CONTAINER_ID"
          if ! assert_owned_builder_id "$bootstrap_container_id" unset; then
            exit 1
          fi
          bootstrap_buildkit_id="$(
            docker image inspect "$BUILDKIT_IMAGE" --format '{{.Id}}'
          )"
          if ! write_once \
            "$recovery_root/container-id" "$bootstrap_container_id" \
            '^[a-f0-9]{64}$'; then
            exit 1
          fi
          if ! write_once \
            "$recovery_root/buildkit-image-id" "$bootstrap_buildkit_id" \
            '^sha256:[a-f0-9]{64}$'; then
            exit 1
          fi
          if ! docker container update \
            --pids-limit 1024 "$bootstrap_container_id" >/dev/null; then
            exit 1
          fi
          if ! bind_builder_identity; then
            exit 1
          fi
          if ! assert_builder_running; then
            exit 1
          fi

          build_false_image() {
            local source="$1"
            local tag="$2"
            local side="$3"
            local audit_sha="$4"
            docker buildx build \
              --builder "$builder_name" \
              --progress=plain \
              --pull \
              --no-cache \
              --provenance=false \
              --load \
              --build-arg NEXT_PUBLIC_SCHOOL_DESIGN_V1=false \
              --label school.system=school-1-11 \
              --label school.environment=synthetic \
              --label school.purpose=flag-off-secondary-image \
              --label "school.audit-side=$side" \
              --label "school.audit-sha=$audit_sha" \
              --label "school.control-sha=$GITHUB_SHA" \
              --label "school.audit-repository=$GITHUB_REPOSITORY" \
              --label "school.audit-run-id=$GITHUB_RUN_ID" \
              --label "school.audit-run-attempt=$GITHUB_RUN_ATTEMPT" \
              -t "$tag" -f "$source/Dockerfile" "$source"
          }

          build_false_image source-base "$BASE_OFF_IMAGE" base "$BASE_SHA"
          if ! bind_builder_identity; then
            exit 1
          fi
          if ! assert_builder_running; then
            exit 1
          fi
          base_built_id="$(docker image inspect "$BASE_OFF_IMAGE" --format '{{.Id}}')"
          if ! write_once \
            "$recovery_root/base-image-id" "$base_built_id" \
            '^sha256:[a-f0-9]{64}$'; then
            exit 1
          fi
          if ! bind_builder_identity; then
            exit 1
          fi
          if ! assert_builder_running; then
            exit 1
          fi
          docker_root="$(docker info --format '{{.DockerRootDir}}')"
          case "$docker_root" in
            /*) ;;
            *) exit 1 ;;
          esac
          free_after_base_kb="$(df -Pk "$docker_root" | awk 'NR == 2 {print $4}')"
          if [[ ! "$free_after_base_kb" =~ ^[0-9]+$ ]] || \
            [ "$free_after_base_kb" -lt 8388608 ]; then
            exit 1
          fi
          build_false_image \
            source-candidate "$CANDIDATE_OFF_IMAGE" candidate \
            "$REVIEWED_CANDIDATE_SHA"
          if ! bind_builder_identity; then
            exit 1
          fi
          if ! assert_builder_running; then
            exit 1
          fi
          candidate_built_id="$(
            docker image inspect "$CANDIDATE_OFF_IMAGE" --format '{{.Id}}'
          )"
          if ! write_once \
            "$recovery_root/candidate-image-id" "$candidate_built_id" \
            '^sha256:[a-f0-9]{64}$'; then
            exit 1
          fi

          assert_false_image() {
            local expected_id="$1"
            local expected_tag="$2"
            local side="$3"
            local audit_sha="$4"
            local inspect_json
            if [[ ! "$expected_id" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              return 1
            fi
            if ! inspect_json="$(docker image inspect "$expected_id")"; then
              return 1
            fi
            IMAGE_INSPECT_JSON="$inspect_json" EXPECTED_IMAGE_ID="$expected_id" \
            EXPECTED_IMAGE_TAG="$expected_tag" \
            EXPECTED_SIDE="$side" EXPECTED_AUDIT_SHA="$audit_sha" \
              python3 - <<'IMAGE_ASSERT'
          import json
          import os
          import re

          documents = json.loads(os.environ["IMAGE_INSPECT_JSON"])
          if not isinstance(documents, list) or len(documents) != 1:
              raise RuntimeError("Unexpected output image cardinality")
          image = documents[0]
          image_id = image.get("Id")
          if image_id != os.environ["EXPECTED_IMAGE_ID"]:
              raise RuntimeError("Output image ID changed")
          if image.get("RepoTags") != [os.environ["EXPECTED_IMAGE_TAG"]]:
              raise RuntimeError("Output image tag set is not exact")
          config = image.get("Config") or {}
          values = [
              value.split("=", 1)[1]
              for value in config.get("Env") or []
              if value.startswith("NEXT_PUBLIC_SCHOOL_DESIGN_V1=")
          ]
          if values != ["false"]:
              raise RuntimeError("Flag-off build environment is not exact")
          labels = config.get("Labels") or {}
          school_labels = {
              key: value for key, value in labels.items() if key.startswith("school.")
          }
          expected_labels = {
              "school.system": "school-1-11",
              "school.environment": "synthetic",
              "school.purpose": "flag-off-secondary-image",
              "school.audit-side": os.environ["EXPECTED_SIDE"],
              "school.audit-sha": os.environ["EXPECTED_AUDIT_SHA"],
              "school.control-sha": os.environ["GITHUB_SHA"],
              "school.audit-repository": os.environ["GITHUB_REPOSITORY"],
              "school.audit-run-id": os.environ["GITHUB_RUN_ID"],
              "school.audit-run-attempt": os.environ["GITHUB_RUN_ATTEMPT"],
          }
          if school_labels != expected_labels:
              raise RuntimeError("Wrong output school labels")
          IMAGE_ASSERT
          }
          if ! read_exact "$recovery_root/base-image-id" '^sha256:[a-f0-9]{64}$'; then
            exit 1
          fi
          base_id="$READ_EXACT_VALUE"
          if ! read_exact "$recovery_root/candidate-image-id" '^sha256:[a-f0-9]{64}$'; then
            exit 1
          fi
          candidate_id="$READ_EXACT_VALUE"
          if ! assert_false_image "$base_id" "$BASE_OFF_IMAGE" base "$BASE_SHA"; then
            exit 1
          fi
          if ! assert_false_image \
            "$candidate_id" "$CANDIDATE_OFF_IMAGE" candidate \
            "$REVIEWED_CANDIDATE_SHA"; then
            exit 1
          fi
          if [ "$base_id" = "$candidate_id" ]; then
            exit 1
          fi
          printf 'base_image_id=%s\n' "$base_id" >> "$GITHUB_OUTPUT"
          printf 'candidate_image_id=%s\n' "$candidate_id" >> "$GITHUB_OUTPUT"
          printf 'SCHOOL_FLAG_OFF_BUILD=OK base=%s candidate=%s builder=%s\n' \
            "$base_id" "$candidate_id" "$builder_name"

      - name: Verify isolated builder cleanup and output images
        if: always()
        timeout-minutes: 10
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BASE_IMAGE_ID: ${{ steps.build.outputs.base_image_id }}
          CANDIDATE_IMAGE_ID: ${{ steps.build.outputs.candidate_image_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          run_instance="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          control_short="${GITHUB_SHA:0:12}"
          builder_name="school-flagoff-$run_instance-$control_short"
          node_name="school-flagoff-node-$run_instance-$control_short"
          container_name="buildx_buildkit_$node_name"
          state_volume="${container_name}_state"
          build_root="$RUNNER_TEMP/school-flagoff-build-$run_instance-$control_short"
          recovery_root="$RUNNER_TEMP/school-flagoff-recovery-$run_instance-$control_short"
          recovery_tombstone="${recovery_root}.retired"
          owner_value="$GITHUB_REPOSITORY|$GITHUB_RUN_ID|$GITHUB_RUN_ATTEMPT|$GITHUB_SHA"
          for inherited_name in \
            DOCKER_HOST DOCKER_CONTEXT DOCKER_TLS_VERIFY DOCKER_CERT_PATH \
            DOCKER_API_VERSION DOCKER_CONFIG BUILDX_BUILDER BUILDX_CONFIG \
            BUILDKIT_HOST; do
            if [[ -v "$inherited_name" ]]; then
              printf 'SCHOOL_FLAG_OFF_INHERITED_DOCKER_OVERRIDE=REJECTED name=%s\n' \
                "$inherited_name"
            fi
            unset "$inherited_name"
          done
          export DOCKER_HOST=unix:///var/run/docker.sock
          export DOCKER_CONFIG="$build_root/docker"
          export BUILDX_CONFIG="$build_root/buildx"
          docker() {
            command docker --host unix:///var/run/docker.sock "$@"
          }

          case "$build_root" in
            "$RUNNER_TEMP"/school-flagoff-build-"$run_instance"-"$control_short") ;;
            *) exit 1 ;;
          esac
          case "$recovery_root:$recovery_tombstone" in
            "$RUNNER_TEMP"/school-flagoff-recovery-"$run_instance"-"$control_short":"$RUNNER_TEMP"/school-flagoff-recovery-"$run_instance"-"$control_short".retired) ;;
            *) exit 1 ;;
          esac

          verify_local_docker_endpoint() {
            local context_host
            local server_version
            if [ "$DOCKER_HOST" != unix:///var/run/docker.sock ]; then
              return 1
            fi
            if [[ -v DOCKER_CONTEXT ]] || [[ -v DOCKER_TLS_VERIFY ]] || \
              [[ -v DOCKER_CERT_PATH ]] || [[ -v DOCKER_API_VERSION ]] || \
              [[ -v BUILDX_BUILDER ]] || [[ -v BUILDKIT_HOST ]]; then
              return 1
            fi
            if [ ! -S /var/run/docker.sock ] || [ -L /var/run/docker.sock ]; then
              return 1
            fi
            if ! context_host="$(
              command docker --config "$DOCKER_CONFIG" context inspect default \
                --format '{{.Endpoints.docker.Host}}'
            )"; then
              return 1
            fi
            if [ "$context_host" != unix:///var/run/docker.sock ]; then
              return 1
            fi
            if ! server_version="$(docker version --format '{{.Server.Version}}')"; then
              return 1
            fi
            if [ -z "$server_version" ]; then
              return 1
            fi
          }

          validate_cleanup_intent() {
            INTENT_PATH="$recovery_root/intent.json" \
            VALIDATOR_PATH="$recovery_root/volume-validator.py" \
            EXPECTED_BUILDER="$builder_name" EXPECTED_NODE="$node_name" \
            EXPECTED_CONTAINER="$container_name" EXPECTED_VOLUME="$state_volume" \
            EXPECTED_BUILD_ROOT="$build_root" EXPECTED_RECOVERY_ROOT="$recovery_root" \
              python3 - <<'VALIDATE_CLEANUP_INTENT'
          import hashlib, json, os, pathlib, re
          intent_path = pathlib.Path(os.environ["INTENT_PATH"])
          validator_path = pathlib.Path(os.environ["VALIDATOR_PATH"])
          if not intent_path.is_file() or intent_path.is_symlink(): raise RuntimeError("Missing intent")
          if not validator_path.is_file() or validator_path.is_symlink(): raise RuntimeError("Missing validator")
          if intent_path.stat().st_mode & 0o777 != 0o600: raise RuntimeError("Intent mode")
          if validator_path.stat().st_mode & 0o777 != 0o500: raise RuntimeError("Validator mode")
          intent = json.loads(intent_path.read_text(encoding="utf-8"))
          keys = {"version", "repository", "runId", "runAttempt", "controlSha",
              "runnerEnvironment", "builderName", "nodeName", "containerName", "stateVolume",
              "buildRoot", "recoveryRoot", "buildkitImage", "dockerHost", "nonce",
              "validatorSha256", "baseImage", "candidateImage"}
          if set(intent) != keys: raise RuntimeError("Intent schema")
          expected = {"version": "1.0.0", "repository": os.environ["GITHUB_REPOSITORY"],
              "runId": os.environ["GITHUB_RUN_ID"], "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "controlSha": os.environ["GITHUB_SHA"], "runnerEnvironment": os.environ["RUNNER_ENVIRONMENT"],
              "builderName": os.environ["EXPECTED_BUILDER"], "nodeName": os.environ["EXPECTED_NODE"],
              "containerName": os.environ["EXPECTED_CONTAINER"], "stateVolume": os.environ["EXPECTED_VOLUME"],
              "buildRoot": os.environ["EXPECTED_BUILD_ROOT"], "recoveryRoot": os.environ["EXPECTED_RECOVERY_ROOT"],
              "buildkitImage": os.environ["BUILDKIT_IMAGE"], "dockerHost": "unix:///var/run/docker.sock",
              "baseImage": os.environ["BASE_OFF_IMAGE"], "candidateImage": os.environ["CANDIDATE_OFF_IMAGE"]}
          if any(intent.get(k) != v for k, v in expected.items()): raise RuntimeError("Intent binding")
          if not re.fullmatch(r"[a-f0-9]{64}", intent.get("nonce", "")): raise RuntimeError("Nonce")
          if hashlib.sha256(validator_path.read_bytes()).hexdigest() != intent["validatorSha256"]:
              raise RuntimeError("Validator digest")
          print(intent["nonce"])
          VALIDATE_CLEANUP_INTENT
          }

          volume_validate_cleanup() {
            local mode="$1" inspect_json nonce_check
            if ! nonce_check="$(validate_cleanup_intent)"; then return 1; fi
            if [ "$nonce_check" != "$audit_nonce" ]; then return 1; fi
            if ! inspect_json="$(docker volume inspect "$state_volume")"; then return 1; fi
            VOLUME_INSPECT_JSON="$inspect_json" VOLUME_MODE="$mode" \
            INTENT_PATH="$recovery_root/intent.json" \
            IDENTITY_PATH="$recovery_root/volume-identity.json" \
              python3 "$recovery_root/volume-validator.py"
          }

          prove_cleanup_daemon_exclusive() {
            local containers volumes networks docker_root
            if [ "${RUNNER_ENVIRONMENT-}" != github-hosted ] || \
              [ "${RUNNER_OS-}" != Linux ]; then return 1; fi
            if ! docker_root="$(docker info --format '{{.DockerRootDir}}')"; then return 1; fi
            if [ "$docker_root" != /var/lib/docker ]; then return 1; fi
            if ! containers="$(docker container ls -a --format '{{.Names}}')"; then return 1; fi
            if [ -n "$containers" ]; then return 1; fi
            if ! volumes="$(docker volume ls --format '{{.Name}}')"; then return 1; fi
            if [ "$volumes" != "$state_volume" ]; then return 1; fi
            if ! networks="$(docker network ls --format '{{.Name}}' | LC_ALL=C sort)"; then return 1; fi
            if [ "$networks" != $'bridge\nhost\nnone' ]; then return 1; fi
          }

          audit_nonce=""
          if [ -d "$recovery_root" ] && [ ! -L "$recovery_root" ]; then
            if ! audit_nonce="$(validate_cleanup_intent)"; then exit 1; fi
          fi
          export AUDIT_NONCE="$audit_nonce"

          if [ -e "$build_root" ] || [ -L "$build_root" ]; then
            if [ ! -d "$build_root" ] || [ -L "$build_root" ] || \
              [ ! -f "$build_root/owner" ] || [ -L "$build_root/owner" ]; then
              exit 1
            fi
            if [ "$(cat "$build_root/owner")" != "$owner_value" ]; then
              exit 1
            fi
            if [ "$(stat -c '%u:%g:%a' "$build_root/owner")" != \
              "$(id -u):$(id -g):600" ]; then
              exit 1
            fi
            if [ "$(stat -c '%u:%g:%a' "$build_root")" != \
              "$(id -u):$(id -g):700" ]; then
              exit 1
            fi
          fi
          if ! verify_local_docker_endpoint; then
            exit 1
          fi

          container_present() {
            local inventory
            local name
            local container_id
            local extra
            local matches=0
            if ! inventory="$(
              docker container ls -a --no-trunc --format '{{.Names}}|{{.ID}}'
            )"; then
              return 1
            fi
            PROBED_CONTAINER_ID=""
            while IFS='|' read -r name container_id extra; do
              if [ "$name" = "$container_name" ]; then
                if [ -n "$extra" ] || [[ ! "$container_id" =~ ^[a-f0-9]{64}$ ]]; then
                  return 1
                fi
                matches=$((matches + 1))
                PROBED_CONTAINER_ID="$container_id"
              fi
            done <<< "$inventory"
            if [ "$matches" -gt 1 ]; then
              return 1
            fi
          }

          volume_present() {
            local inventory
            local name
            local matches=0
            if ! inventory="$(docker volume ls --format '{{.Name}}')"; then
              return 1
            fi
            while IFS= read -r name; do
              if [ "$name" = "$state_volume" ]; then
                matches=$((matches + 1))
              fi
            done <<< "$inventory"
            if [ "$matches" -gt 1 ]; then
              return 1
            fi
            if [ "$matches" -eq 1 ]; then
              PROBED_VOLUME_PRESENT=yes
            else
              PROBED_VOLUME_PRESENT=no
            fi
          }

          assert_owned_state_volume() {
            if ! volume_present; then
              return 1
            fi
            if [ "$PROBED_VOLUME_PRESENT" != yes ]; then
              return 1
            fi
            volume_validate_cleanup verify
          }

          assert_owned_builder_container() {
            local expected_id="$1"
            local expected_pids="${2:-1024}"
            local inspect_json
            local image_json
            local recorded_buildkit_id
            local must_record_buildkit=no
            if [[ ! "$expected_id" =~ ^[a-f0-9]{64}$ ]]; then
              return 1
            fi
            if ! inspect_json="$(docker container inspect "$expected_id")"; then
              return 1
            fi
            if ! image_json="$(docker image inspect "$BUILDKIT_IMAGE")"; then
              return 1
            fi
            if [ -f "$recovery_root/buildkit-image-id" ] && \
              [ ! -L "$recovery_root/buildkit-image-id" ]; then
              if [ "$(stat -c '%u:%g:%a' "$recovery_root/buildkit-image-id")" != \
                "$(id -u):$(id -g):600" ]; then
                return 1
              fi
              if ! recorded_buildkit_id="$(cat "$recovery_root/buildkit-image-id")"; then
                return 1
              fi
            else
              if [ -e "$recovery_root/buildkit-image-id" ] || \
                [ -L "$recovery_root/buildkit-image-id" ]; then
                return 1
              fi
              if ! recorded_buildkit_id="$(
                docker image inspect "$BUILDKIT_IMAGE" --format '{{.Id}}'
              )"; then
                return 1
              fi
              must_record_buildkit=yes
            fi
            if [[ ! "$recorded_buildkit_id" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              return 1
            fi
            CONTAINER_INSPECT_JSON="$inspect_json" \
            BUILDKIT_INSPECT_JSON="$image_json" \
            EXPECTED_CONTAINER_ID="$expected_id" \
            EXPECTED_PIDS_LIMIT="$expected_pids" \
            RECORDED_BUILDKIT_ID="$recorded_buildkit_id" \
            BUILDER_CONTAINER="$container_name" STATE_VOLUME="$state_volume" \
              python3 - <<'STRICT_BUILDER' || return 1
          import json
          import os

          containers = json.loads(os.environ["CONTAINER_INSPECT_JSON"])
          images = json.loads(os.environ["BUILDKIT_INSPECT_JSON"])
          if not isinstance(containers, list) or len(containers) != 1:
              raise RuntimeError("Unexpected builder cardinality")
          if not isinstance(images, list) or len(images) != 1:
              raise RuntimeError("Unexpected BuildKit image cardinality")
          container = containers[0]
          image = images[0]
          if container.get("Id") != os.environ["EXPECTED_CONTAINER_ID"]:
              raise RuntimeError("Builder ID changed")
          if container.get("Name") != "/" + os.environ["BUILDER_CONTAINER"]:
              raise RuntimeError("Builder name changed")
          if image.get("Id") != os.environ["RECORDED_BUILDKIT_ID"]:
              raise RuntimeError("Pinned BuildKit image ID changed")
          if container.get("Image") != image.get("Id"):
              raise RuntimeError("Wrong builder image ID")
          config = container.get("Config") or {}
          image_config = image.get("Config") or {}
          if config.get("Image") != os.environ["BUILDKIT_IMAGE"]:
              raise RuntimeError("Wrong builder image reference")

          def env_map(values):
              result = {}
              for item in values or []:
                  key, separator, value = item.partition("=")
                  if not separator or not key or key in result:
                      raise RuntimeError("Malformed or duplicate environment")
                  result[key] = value
              return result

          defaults = env_map(image_config.get("Env"))
          injected = {
              "SCHOOL_AUDIT_OWNER": "school-diary-flag-off",
              "SCHOOL_AUDIT_REPOSITORY": os.environ["GITHUB_REPOSITORY"],
              "SCHOOL_AUDIT_RUN_ID": os.environ["GITHUB_RUN_ID"],
              "SCHOOL_AUDIT_RUN_ATTEMPT": os.environ["GITHUB_RUN_ATTEMPT"],
              "SCHOOL_AUDIT_CONTROL_SHA": os.environ["GITHUB_SHA"],
              "SCHOOL_AUDIT_STATE_VOLUME": os.environ["STATE_VOLUME"],
              "SCHOOL_AUDIT_NONCE": os.environ["AUDIT_NONCE"],
          }
          if set(defaults).intersection(injected):
              raise RuntimeError("Pinned defaults collide with audit environment")
          expected_env = dict(defaults)
          expected_env.update(injected)
          if env_map(config.get("Env")) != expected_env:
              raise RuntimeError("Builder environment is not exact")
          if config.get("Entrypoint") != image_config.get("Entrypoint"):
              raise RuntimeError("Builder entrypoint changed")
          if config.get("Cmd") != [
              "--debug=false",
              "--oci-worker-gc=true",
              "--oci-worker-gc-keepstorage=6000",
          ]:
              raise RuntimeError("Wrong BuildKit GC command")
          host = container.get("HostConfig") or {}
          expected_pids = (
              None
              if os.environ["EXPECTED_PIDS_LIMIT"] == "unset"
              else int(os.environ["EXPECTED_PIDS_LIMIT"])
          )
          expected_host = {
              "Memory": 6442450944,
              "MemorySwap": 6442450944,
              "CpuPeriod": 100000,
              "CpuQuota": 400000,
              "PidsLimit": expected_pids,
              "Privileged": True,
              "ReadonlyRootfs": False,
              "AutoRemove": False,
              "NetworkMode": "bridge",
          }
          for key, expected in expected_host.items():
              if host.get(key) != expected:
                  raise RuntimeError(f"Wrong builder HostConfig {key}")
          if host.get("RestartPolicy") != {"Name": "no", "MaximumRetryCount": 0}:
              raise RuntimeError("Wrong restart policy")
          mounts = container.get("Mounts")
          if not isinstance(mounts, list) or len(mounts) != 1:
              raise RuntimeError("Unexpected builder mounts")
          mount = mounts[0]
          expected_mount = {
              "Type": "volume",
              "Name": os.environ["STATE_VOLUME"],
              "Destination": "/var/lib/buildkit",
              "Driver": "local",
              "Mode": "",
              "RW": True,
              "Propagation": "",
          }
          if any(mount.get(key) != value for key, value in expected_mount.items()):
              raise RuntimeError("Wrong builder state mount")
          source = mount.get("Source")
          if not isinstance(source, str) or not source.startswith("/"):
              raise RuntimeError("Wrong builder mount source")
          digest = os.environ["BUILDKIT_IMAGE"].rsplit("@", 1)[1]
          repository = os.environ["BUILDKIT_IMAGE"].rsplit("@", 1)[0].rsplit(":", 1)[0]
          if f"{repository}@{digest}" not in (image.get("RepoDigests") or []):
              raise RuntimeError("Pinned BuildKit digest absent")
          STRICT_BUILDER
            if [ "$must_record_buildkit" = yes ]; then
              if ! printf '%s\n' "$recorded_buildkit_id" > \
                "$recovery_root/buildkit-image-id.tmp"; then
                return 1
              fi
              if ! chmod 0600 "$recovery_root/buildkit-image-id.tmp"; then
                return 1
              fi
              if ! mv -T "$recovery_root/buildkit-image-id.tmp" \
                "$recovery_root/buildkit-image-id"; then
                return 1
              fi
            fi
          }

          remove_build_root() {
            local unexpected
            local actual_owner
            if [ ! -e "$build_root" ] && [ ! -L "$build_root" ]; then
              return 0
            fi
            if [ ! -d "$build_root" ] || [ -L "$build_root" ]; then
              return 1
            fi
            if [ "$(stat -c '%u:%g:%a' "$build_root")" != \
              "$(id -u):$(id -g):700" ]; then
              return 1
            fi
            if [ -f "$build_root/owner" ] && [ ! -L "$build_root/owner" ]; then
              if ! actual_owner="$(cat "$build_root/owner")"; then
                return 1
              fi
              if [ "$actual_owner" != "$owner_value" ]; then
                return 1
              fi
            else
              if ! unexpected="$(find -P "$build_root" -mindepth 1 -maxdepth 1 -print -quit)"; then
                return 1
              fi
              if [ -n "$unexpected" ]; then
                return 1
              fi
            fi
            if ! unexpected="$(find -P "$build_root" -type l -print -quit)"; then
              return 1
            fi
            if [ -n "$unexpected" ]; then
              return 1
            fi
            if ! find -P "$build_root" -depth -delete; then
              return 1
            fi
            if [ -e "$build_root" ] || [ -L "$build_root" ]; then
              return 1
            fi
          }

          retire_recovery_journal() {
            local unexpected
            local remaining_containers
            local remaining_volumes
            local nonce_check
            if [ -e "$build_root" ] || [ -L "$build_root" ]; then
              return 1
            fi
            if ! remaining_containers="$(docker container ls -a --format '{{.Names}}')"; then
              return 1
            fi
            if [ -n "$remaining_containers" ]; then
              return 1
            fi
            if ! remaining_volumes="$(docker volume ls --format '{{.Name}}')"; then
              return 1
            fi
            if [ -n "$remaining_volumes" ]; then
              return 1
            fi
            if ! nonce_check="$(validate_cleanup_intent)"; then
              return 1
            fi
            if [ "$nonce_check" != "$audit_nonce" ]; then
              return 1
            fi
            if [ ! -d "$recovery_root" ] || [ -L "$recovery_root" ] || \
              [ -e "$recovery_tombstone" ] || [ -L "$recovery_tombstone" ]; then
              return 1
            fi
            if ! unexpected="$(find -P "$recovery_root" -type l -print -quit)"; then
              return 1
            fi
            if [ -n "$unexpected" ]; then
              return 1
            fi
            if ! mv -T "$recovery_root" "$recovery_tombstone"; then
              return 1
            fi
            if ! find -P "$recovery_tombstone" -depth -delete; then
              return 1
            fi
            if [ -e "$recovery_root" ] || [ -L "$recovery_root" ] || \
              [ -e "$recovery_tombstone" ] || [ -L "$recovery_tombstone" ]; then
              return 1
            fi
          }

          cleanup_rc=0
          saved_container_id=""
          if [ -f "$recovery_root/container-id" ] && [ ! -L "$recovery_root/container-id" ]; then
            if [ "$(stat -c '%u:%g:%a' "$recovery_root/container-id")" != \
              "$(id -u):$(id -g):600" ]; then
              cleanup_rc=1
            fi
            saved_container_id="$(cat "$recovery_root/container-id")"
            if [[ ! "$saved_container_id" =~ ^[a-f0-9]{64}$ ]]; then
              cleanup_rc=1
            fi
          fi
          if container_present; then
            if [ -n "$PROBED_CONTAINER_ID" ]; then
              if [ -z "$saved_container_id" ]; then
                adopted_id="$PROBED_CONTAINER_ID"
                if assert_owned_builder_container "$adopted_id" 1024; then
                  :
                elif assert_owned_builder_container "$adopted_id" unset; then
                  if ! docker container update \
                    --pids-limit 1024 "$adopted_id" >/dev/null; then
                    cleanup_rc=1
                  elif ! assert_owned_builder_container "$adopted_id" 1024; then
                    cleanup_rc=1
                  fi
                else
                  cleanup_rc=1
                fi
                if [ "$cleanup_rc" -eq 0 ]; then
                  if ! printf '%s\n' "$adopted_id" > \
                    "$recovery_root/container-id.tmp"; then
                    cleanup_rc=1
                  elif ! chmod 0600 "$recovery_root/container-id.tmp"; then
                    cleanup_rc=1
                  elif ! mv -T "$recovery_root/container-id.tmp" \
                    "$recovery_root/container-id"; then
                    cleanup_rc=1
                  else
                    saved_container_id="$adopted_id"
                  fi
                fi
              fi
              if [ -z "$saved_container_id" ] || \
                [ "$saved_container_id" != "$PROBED_CONTAINER_ID" ]; then
                cleanup_rc=1
              else
                builder_owned=no
                if assert_owned_builder_container "$saved_container_id" 1024; then
                  builder_owned=yes
                elif assert_owned_builder_container "$saved_container_id" unset; then
                  builder_owned=yes
                fi
                if [ "$builder_owned" != yes ]; then
                  cleanup_rc=1
                elif ! docker container rm \
                  --force "$saved_container_id" >/dev/null; then
                  cleanup_rc=1
                fi
              fi
            fi
          else
            cleanup_rc=1
          fi
          if container_present; then
            if [ -n "$PROBED_CONTAINER_ID" ]; then
              cleanup_rc=1
            fi
          else
            cleanup_rc=1
          fi
          if [ -n "$saved_container_id" ]; then
            if remaining_ids="$(
              docker container ls -a --no-trunc --format '{{.ID}}'
            )"; then
              while IFS= read -r remaining_id; do
                if [ "$remaining_id" = "$saved_container_id" ]; then
                  cleanup_rc=1
                fi
              done <<< "$remaining_ids"
            else
              cleanup_rc=1
            fi
          fi

          if volume_present; then
            if [ "$PROBED_VOLUME_PRESENT" = yes ]; then
              if [ ! -e "$recovery_root/volume-identity.json" ] && \
                [ ! -L "$recovery_root/volume-identity.json" ]; then
                if ! volume_validate_cleanup record; then
                  cleanup_rc=1
                fi
              fi
              if [ "$cleanup_rc" -eq 0 ]; then
                if ! mounted_refs="$(
                  docker container ls -a --filter "volume=$state_volume" \
                    --no-trunc --format '{{.ID}}'
                )"; then
                  cleanup_rc=1
                elif [ -n "$mounted_refs" ]; then
                  cleanup_rc=1
                elif ! prove_cleanup_daemon_exclusive; then
                  cleanup_rc=1
                elif ! volume_validate_cleanup verify; then
                  cleanup_rc=1
                elif ! docker volume rm "$state_volume" >/dev/null; then
                  cleanup_rc=1
                fi
              fi
            fi
          else
            cleanup_rc=1
          fi
          if volume_present; then
            if [ "$PROBED_VOLUME_PRESENT" != no ]; then
              cleanup_rc=1
            fi
          else
            cleanup_rc=1
          fi
          overall_cleanup_rc="$cleanup_rc"

          probe_exact_image_tag() {
            local target="$1"
            local inventory
            local reference
            local image_id
            local extra
            local matches=0
            if ! inventory="$(docker image ls --no-trunc \
              --format '{{.Repository}}:{{.Tag}}|{{.ID}}')"; then
              return 1
            fi
            PROBED_IMAGE_ID=""
            while IFS='|' read -r reference image_id extra; do
              if [ "$reference" = "$target" ]; then
                if [ -n "$extra" ] || \
                  [[ ! "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]]; then
                  return 1
                fi
                matches=$((matches + 1))
                PROBED_IMAGE_ID="$image_id"
              fi
            done <<< "$inventory"
            if [ "$matches" -gt 1 ]; then
              return 1
            fi
          }

          assert_owned_image() {
            local expected_id="$1"
            local tag="$2"
            local side="$3"
            local audit_sha="$4"
            local inspect_json
            if [[ ! "$expected_id" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              return 1
            fi
            if ! probe_exact_image_tag "$tag"; then
              return 1
            fi
            if [ "$PROBED_IMAGE_ID" != "$expected_id" ]; then
              return 1
            fi
            if ! inspect_json="$(docker image inspect "$expected_id")"; then
              return 1
            fi
            IMAGE_INSPECT_JSON="$inspect_json" EXPECTED_ID="$expected_id" \
            EXPECTED_TAG="$tag" \
            EXPECTED_SIDE="$side" EXPECTED_AUDIT_SHA="$audit_sha" \
              python3 - <<'OWNED_IMAGE'
          import json
          import os

          images = json.loads(os.environ["IMAGE_INSPECT_JSON"])
          if not isinstance(images, list) or len(images) != 1:
              raise RuntimeError("Unexpected image cardinality")
          image = images[0]
          if image.get("Id") != os.environ["EXPECTED_ID"]:
              raise RuntimeError("Output image ID changed")
          if image.get("RepoTags") != [os.environ["EXPECTED_TAG"]]:
              raise RuntimeError("Output image tag set is not exact")
          config = image.get("Config") or {}
          values = [
              value.split("=", 1)[1]
              for value in config.get("Env") or []
              if value.startswith("NEXT_PUBLIC_SCHOOL_DESIGN_V1=")
          ]
          if values != ["false"]:
              raise RuntimeError("Wrong flag environment")
          labels = config.get("Labels") or {}
          actual = {key: value for key, value in labels.items() if key.startswith("school.")}
          expected = {
              "school.system": "school-1-11",
              "school.environment": "synthetic",
              "school.purpose": "flag-off-secondary-image",
              "school.audit-side": os.environ["EXPECTED_SIDE"],
              "school.audit-sha": os.environ["EXPECTED_AUDIT_SHA"],
              "school.control-sha": os.environ["GITHUB_SHA"],
              "school.audit-repository": os.environ["GITHUB_REPOSITORY"],
              "school.audit-run-id": os.environ["GITHUB_RUN_ID"],
              "school.audit-run-attempt": os.environ["GITHUB_RUN_ATTEMPT"],
          }
          if actual != expected:
              raise RuntimeError("Wrong school image labels")
          OWNED_IMAGE
          }

          remove_failed_image() {
            local tag="$1"
            local side="$2"
            local audit_sha="$3"
            local identity_file="$4"
            local container_refs
            local image_ids
            local inspected_image_id
            local saved_id=""
            if [ -f "$identity_file" ] && [ ! -L "$identity_file" ]; then
              if [ "$(stat -c '%u:%g:%a' "$identity_file")" != \
                "$(id -u):$(id -g):600" ]; then
                return 1
              fi
              if ! saved_id="$(cat "$identity_file")"; then
                return 1
              fi
              if [[ ! "$saved_id" =~ ^sha256:[a-f0-9]{64}$ ]]; then
                return 1
              fi
            fi
            if ! probe_exact_image_tag "$tag"; then
              return 1
            fi
            if [ -n "$PROBED_IMAGE_ID" ]; then
              if [ -z "$saved_id" ]; then
                if ! assert_owned_image \
                  "$PROBED_IMAGE_ID" "$tag" "$side" "$audit_sha"; then
                  return 1
                fi
                if ! printf '%s\n' "$PROBED_IMAGE_ID" > "$identity_file.tmp"; then
                  return 1
                fi
                if ! chmod 0600 "$identity_file.tmp"; then
                  return 1
                fi
                if ! mv -T "$identity_file.tmp" "$identity_file"; then
                  return 1
                fi
                saved_id="$PROBED_IMAGE_ID"
              elif [ "$saved_id" != "$PROBED_IMAGE_ID" ]; then
                return 1
              fi
              if ! assert_owned_image "$saved_id" "$tag" "$side" "$audit_sha"; then
                return 1
              fi
              if ! container_refs="$(docker ps -aq --filter "ancestor=$saved_id")"; then
                return 1
              fi
              if [ -n "$container_refs" ]; then
                return 1
              fi
              if ! docker image rm "$saved_id" >/dev/null; then
                return 1
              fi
            fi
            if ! probe_exact_image_tag "$tag"; then
              return 1
            fi
            if [ -n "$PROBED_IMAGE_ID" ]; then
              return 1
            fi
            if [ -n "$saved_id" ]; then
              if ! image_ids="$(
                docker image ls -a --no-trunc --format '{{.ID}}'
              )"; then
                return 1
              fi
              while IFS= read -r inspected_image_id; do
                if [ "$inspected_image_id" = "$saved_id" ]; then
                  return 1
                fi
              done <<< "$image_ids"
            fi
          }

          if [ "$BUILD_OUTCOME" = success ]; then
            image_cleanup_rc=0
            if ! assert_owned_image \
              "$BASE_IMAGE_ID" "$BASE_OFF_IMAGE" base "$BASE_SHA"; then
              image_cleanup_rc=1
            fi
            if ! assert_owned_image \
              "$CANDIDATE_IMAGE_ID" "$CANDIDATE_OFF_IMAGE" candidate \
              "$REVIEWED_CANDIDATE_SHA"; then
              image_cleanup_rc=1
            fi
            if [ -f "$recovery_root/base-image-id" ]; then
              if [ -L "$recovery_root/base-image-id" ] || \
                [ "$(stat -c '%u:%g:%a' "$recovery_root/base-image-id")" != \
                  "$(id -u):$(id -g):600" ] || \
                [ "$(cat "$recovery_root/base-image-id")" != "$BASE_IMAGE_ID" ]; then
                image_cleanup_rc=1
              fi
            else
              image_cleanup_rc=1
            fi
            if [ -f "$recovery_root/candidate-image-id" ]; then
              if [ -L "$recovery_root/candidate-image-id" ] || \
                [ "$(stat -c '%u:%g:%a' "$recovery_root/candidate-image-id")" != \
                  "$(id -u):$(id -g):600" ] || \
                [ "$(cat "$recovery_root/candidate-image-id")" != \
                "$CANDIDATE_IMAGE_ID" ]; then
                image_cleanup_rc=1
              fi
            else
              image_cleanup_rc=1
            fi
          else
            image_cleanup_rc=0
            if ! remove_failed_image \
              "$BASE_OFF_IMAGE" base "$BASE_SHA" \
              "$recovery_root/base-image-id"; then
              image_cleanup_rc=1
            fi
            if ! remove_failed_image \
              "$CANDIDATE_OFF_IMAGE" candidate "$REVIEWED_CANDIDATE_SHA" \
              "$recovery_root/candidate-image-id"; then
              image_cleanup_rc=1
            fi
          fi
          if [ "$image_cleanup_rc" -ne 0 ]; then
            overall_cleanup_rc=1
          fi
          if [ "$overall_cleanup_rc" -eq 0 ]; then
            if ! remove_build_root; then
              overall_cleanup_rc=1
            fi
          fi
          if [ "$overall_cleanup_rc" -eq 0 ]; then
            if ! retire_recovery_journal; then
              overall_cleanup_rc=1
            fi
          fi
          if [ "$overall_cleanup_rc" -ne 0 ]; then
            printf 'SCHOOL_FLAG_OFF_BUILD_RECOVERY=PRESERVED path=%s\n' \
              "$build_root" >&2
            exit 1
          fi
          printf 'SCHOOL_FLAG_OFF_ISOLATED_BUILDER_CLEANUP=OK outcome=%s\n' \
            "$BUILD_OUTCOME"
      - name: Capture base and candidate sequentially
        id: capture
        timeout-minutes: 90
        env:
          BASE_IMAGE_ID: ${{ steps.build.outputs.base_image_id }}
          CANDIDATE_IMAGE_ID: ${{ steps.build.outputs.candidate_image_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077

          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$GITHUB_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$BASE_IMAGE_ID" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$CANDIDATE_IMAGE_ID" =~ ^sha256:[a-f0-9]{64}$ ]]
          test "$EVIDENCE_DIR" = \
            "school-flag-off-evidence-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test -d "$EVIDENCE_DIR"
          test ! -L "$EVIDENCE_DIR"
          test -f "$EVIDENCE_DIR/evidence-owner.json"
          test ! -L "$EVIDENCE_DIR/evidence-owner.json"

          reject_external_docker_state() {
            local key
            local expected_preflight_config
            expected_preflight_config="$RUNNER_TEMP/school-flag-off-docker-config-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            if [ -n "${DOCKER_HOST+x}" ] && \
              [ "$DOCKER_HOST" != unix:///var/run/docker.sock ]; then
              printf 'Unexpected inherited DOCKER_HOST\n' >&2
              return 1
            fi
            if [ -n "${DOCKER_CONFIG+x}" ] && \
              [ "$DOCKER_CONFIG" != "$expected_preflight_config" ]; then
              printf 'Unexpected inherited DOCKER_CONFIG\n' >&2
              return 1
            fi
            for key in \
              DOCKER_CONTEXT DOCKER_TLS_VERIFY DOCKER_CERT_PATH DOCKER_TLS \
              DOCKER_TLS_CERTDIR DOCKER_AUTH_CONFIG DOCKER_CONTENT_TRUST \
              BUILDKIT_HOST BUILDX_BUILDER REGISTRY_AUTH_FILE \
              HTTP_PROXY HTTPS_PROXY ALL_PROXY NO_PROXY \
              http_proxy https_proxy all_proxy no_proxy \
              NPM_CONFIG_PROXY NPM_CONFIG_HTTPS_PROXY \
              npm_config_proxy npm_config_https_proxy; do
              if [ -n "${!key:-}" ]; then
                printf 'Inherited Docker/network override is forbidden: %s\n' \
                  "$key" >&2
                return 1
              fi
            done
          }
          reject_external_docker_state

          host_uid="$(id -u)"
          host_gid="$(id -g)"
          [[ "$host_uid" =~ ^[0-9]+$ ]]
          [[ "$host_gid" =~ ^[0-9]+$ ]]
          if [ "$host_uid" -eq 0 ]; then
            runtime_uid=1001
            runtime_gid=1001
          else
            test "$host_uid" -ge 1
            test "$host_gid" -ge 1
            runtime_uid="$host_uid"
            runtime_gid="$host_gid"
          fi
          runtime_identity="$runtime_uid:$runtime_gid"
          run_instance="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

          browser_name="school-flag-off-browser-$run_instance"
          installer_name="school-flag-off-browser-installer-$run_instance"
          browser_exchange="$RUNNER_TEMP/school-flag-off-browser-$run_instance"
          browser_runtime="$RUNNER_TEMP/school-flag-off-runtime-$run_instance"
          transport_root="$RUNNER_TEMP/school-flag-off-transport-$run_instance"
          log_root="$RUNNER_TEMP/school-flag-off-logs-$run_instance"
          control_state="$RUNNER_TEMP/school-flag-off-controls-$run_instance"
          docker_config="$RUNNER_TEMP/school-flag-off-docker-$run_instance"
          fixture_snapshot="$control_state/fixture.snapshot.sh"
          fixture_snapshot_digest="$control_state/fixture.snapshot.sha256"
          browser_log="$log_root/browser.log"
          installer_log="$log_root/installer.log"
          base_prepare_log="$log_root/base-prepare.log"
          base_cleanup_log="$log_root/base-cleanup.log"
          candidate_prepare_log="$log_root/candidate-prepare.log"
          candidate_cleanup_log="$log_root/candidate-cleanup.log"
          owner_value="$GITHUB_RUN_ID|$GITHUB_RUN_ATTEMPT|$GITHUB_SHA"
          playwright_image_id=""
          playwright_image_env_json=""
          resolved_browser_id=""
          resolved_installer_id=""
          installer_container_id=""
          browser_container_id=""
          browser_session=""
          helper_trusted=no
          docker_boundary_ready=no
          docker_binary="$(command -v docker)"
          docker_binary="$(realpath -e "$docker_binary")"
          case "$docker_binary" in /*/docker) ;; *) exit 1 ;; esac
          test -x "$docker_binary"
          test ! -L "$docker_binary"
          cleanup_contract='school-flag-off-cleanup-v2|run-attempt|owner|intent+cid|id-first|exchange-runtime-transport-logs|validate-before-mutate|retain-journals-on-failure'
          test "$(printf %s "$cleanup_contract" | sha256sum | cut -d' ' -f1)" = \
            731fa732218938c09221362eb2387c4ccf500634cf24b393f21cf944876984b7

          docker() {
            local docker_config_inventory
            [ "$docker_boundary_ready" = yes ] || {
              printf 'Docker boundary is not initialized\n' >&2
              return 1
            }
            [ -d "$docker_config" ] && [ ! -L "$docker_config" ] || return 1
            [ -f "$docker_config/config.json" ] && \
              [ ! -L "$docker_config/config.json" ] || return 1
            [ "$(cat "$docker_config/config.json")" = '{}' ] || return 1
            docker_config_inventory="$(find -P "$docker_config" -mindepth 1 \
              -maxdepth 1 -printf '%f\n' | LC_ALL=C sort)" || return 1
            [ "$docker_config_inventory" = $'config.json\nowner' ] || return 1
            env -i \
              PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
              LANG=C LC_ALL=C HOME="$docker_config" \
              DOCKER_HOST=unix:///var/run/docker.sock \
              DOCKER_CONFIG="$docker_config" \
              "$docker_binary" "$@"
          }

          docker_bounded() {
            local seconds="$1"
            local docker_config_inventory
            shift
            [ "$docker_boundary_ready" = yes ] || return 1
            [[ "$seconds" =~ ^[1-9][0-9]*$ ]] || return 1
            [ -f "$docker_config/config.json" ] && \
              [ "$(cat "$docker_config/config.json")" = '{}' ] || return 1
            docker_config_inventory="$(find -P "$docker_config" -mindepth 1 \
              -maxdepth 1 -printf '%f\n' | LC_ALL=C sort)" || return 1
            [ "$docker_config_inventory" = $'config.json\nowner' ] || return 1
            timeout --signal=TERM --kill-after=10s "${seconds}s" env -i \
              PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
              LANG=C LC_ALL=C HOME="$docker_config" \
              DOCKER_HOST=unix:///var/run/docker.sock \
              DOCKER_CONFIG="$docker_config" \
              "$docker_binary" "$@"
          }

          for owned_path in \
            "$browser_exchange:school-flag-off-browser-$run_instance" \
            "$browser_runtime:school-flag-off-runtime-$run_instance" \
            "$transport_root:school-flag-off-transport-$run_instance" \
            "$log_root:school-flag-off-logs-$run_instance" \
            "$control_state:school-flag-off-controls-$run_instance" \
            "$docker_config:school-flag-off-docker-$run_instance"; do
            expected_suffix="${owned_path##*:}"
            actual_path="${owned_path%:*}"
            [ "$actual_path" = "$RUNNER_TEMP/$expected_suffix" ] || {
              printf 'Invalid local audit path: %s\n' "$actual_path" >&2
              exit 1
            }
          done

          audit_seed_date="$(date -u +%F)"
          [[ "$audit_seed_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          audit_password="FlagOff_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_$(openssl rand -hex 24)"
          [[ "$audit_password" =~ ^[A-Za-z0-9_-]{32,}$ ]]
          handshake_token="$(openssl rand -hex 32)"
          [[ "$handshake_token" =~ ^[a-f0-9]{64}$ ]]

          probe_exact_container() {
            local target="$1"
            local inventory
            local name
            local matches=0
            PROBED_CONTAINER_PRESENT=yes
            if ! inventory="$(docker ps -a --format '{{.Names}}')"; then
              printf 'Docker container inventory failed\n' >&2
              return 1
            fi
            PROBED_CONTAINER_PRESENT=no
            while IFS= read -r name; do
              if [ "$name" = "$target" ]; then
                matches=$((matches + 1))
                PROBED_CONTAINER_PRESENT=yes
              fi
            done <<< "$inventory"
            test "$matches" -le 1 || return 1
          }

          assert_control_container() {
            local target="$1"
            local role="$2"
            local expected_image="$3"
            local expected_container_id="$4"
            case "$target:$role" in
              "$browser_name:browser"|"$installer_name:installer") ;;
              *) return 1 ;;
            esac
            [[ "$expected_image" =~ ^sha256:[a-f0-9]{64}$ ]] || return 1
            [[ "$expected_container_id" =~ ^[a-f0-9]{64}$ ]] || return 1
            [ "$(docker inspect "$target" --format '{{.Id}}')" = \
              "$expected_container_id" ] || return 1
            [ "$(docker inspect "$target" --format '{{index .Config.Labels "school.system"}}')" = school-1-11 ] || return 1
            [ "$(docker inspect "$target" --format '{{index .Config.Labels "school.environment"}}')" = synthetic ] || return 1
            [ "$(docker inspect "$target" --format '{{index .Config.Labels "school.purpose"}}')" = flag-off-browser-control ] || return 1
            [ "$(docker inspect "$target" --format '{{index .Config.Labels "school.browser-role"}}')" = "$role" ] || return 1
            [ "$(docker inspect "$target" --format '{{index .Config.Labels "school.audit-repository"}}')" = "$GITHUB_REPOSITORY" ] || return 1
            [ "$(docker inspect "$target" --format '{{index .Config.Labels "school.audit-run-id"}}')" = "$GITHUB_RUN_ID" ] || return 1
            [ "$(docker inspect "$target" --format '{{index .Config.Labels "school.audit-run-attempt"}}')" = "$GITHUB_RUN_ATTEMPT" ] || return 1
            [ "$(docker inspect "$target" --format '{{index .Config.Labels "school.runtime-uid"}}')" = "$runtime_uid" ] || return 1
            [ "$(docker inspect "$target" --format '{{index .Config.Labels "school.runtime-gid"}}')" = "$runtime_gid" ] || return 1
            [ "$(docker inspect "$target" --format '{{index .Config.Labels "school.control-sha"}}')" = "$GITHUB_SHA" ] || return 1
            [ "$(docker inspect "$target" --format '{{.Image}}')" = "$expected_image" ] || return 1
          }

          remove_control_container() {
            local target="$1"
            local role="$2"
            local expected_image="$3"
            local expected_container_id="$4"
            local phase="${5:-mutate}"
            local inspect_rc
            local recovered_id
            local resolved_id=""
            case "$phase" in validate|mutate) ;; *) return 1 ;; esac
            if [ "$phase" = mutate ]; then
              if [ "$role" = browser ]; then
                resolved_id="$resolved_browser_id"
              else
                resolved_id="$resolved_installer_id"
              fi
              if [ -n "$resolved_id" ]; then
                assert_control_config "$target" "$role" "$expected_image" \
                  "$resolved_id" any || return 1
                docker_bounded 60 rm -f "$resolved_id" >/dev/null || return 1
                if docker inspect "$resolved_id" >/dev/null 2>&1; then return 1; fi
              fi
              probe_exact_container "$target" || return 1
              [ "$PROBED_CONTAINER_PRESENT" = no ] || return 1
              return 0
            fi
            if [[ "$expected_container_id" =~ ^[a-f0-9]{64}$ ]]; then
              set +e
              docker inspect "$expected_container_id" >/dev/null 2>&1
              inspect_rc=$?
              set -e
              case "$inspect_rc" in
                0)
                  assert_control_config "$target" "$role" "$expected_image" \
                    "$expected_container_id" any || return 1
                  resolved_id="$expected_container_id"
                  ;;
                1)
                  # A canonical ID cannot be replaced by a same-name object.
                  probe_exact_container "$target" || return 1
                  [ "$PROBED_CONTAINER_PRESENT" = no ] || return 1
                  ;;
                *) return 1 ;;
              esac
            else
              # Recovery is permitted only from a strict intent plus the exact
              # run-attempt name and a complete config reinspection.
              probe_exact_container "$target" || return 1
              if [ "$PROBED_CONTAINER_PRESENT" = yes ]; then
                recovered_id="$(docker inspect "$target" --format '{{.Id}}')" || \
                  return 1
                [[ "$recovered_id" =~ ^[a-f0-9]{64}$ ]] || return 1
                assert_control_config "$target" "$role" "$expected_image" \
                  "$recovered_id" any || return 1
                resolved_id="$recovered_id"
              fi
            fi
            if [ "$role" = browser ]; then
              resolved_browser_id="$resolved_id"
            else
              resolved_installer_id="$resolved_id"
            fi
          }

          record_control_id() {
            local role="$1"
            local container_id="$2"
            local target
            local pending
            case "$role" in
              installer|browser) ;;
              *) return 1 ;;
            esac
            [[ "$container_id" =~ ^[a-f0-9]{64}$ ]] || return 1
            assert_run_directory "$control_state" "$host_uid:$host_gid" 700 || return 1
            target="$control_state/$role.cid"
            pending="$target.pending"
            [ ! -e "$target" ] && [ ! -L "$target" ] || return 1
            [ -f "$pending" ] && [ ! -L "$pending" ] || return 1
            [ "$(cat "$pending")" = "$container_id" ] || return 1
            chmod 0600 "$pending" || return 1
            mv -T -- "$pending" "$target" || return 1
            [ -f "$target" ] && [ ! -L "$target" ] || return 1
            [ "$(stat -c '%u:%g:%a' "$target")" = \
              "$host_uid:$host_gid:600" ] || return 1
            [ "$(cat "$target")" = "$container_id" ] || return 1
          }

          write_control_intent() {
            local role="$1"
            local target="$control_state/$role.intent.json"
            shift
            case "$role" in installer|browser) ;; *) return 1 ;; esac
            [ ! -e "$target" ] && [ ! -L "$target" ] || return 1
            INTENT_ROLE="$role" INTENT_TARGET="$target.tmp" \
              INTENT_IMAGE="$playwright_image_id" \
              INTENT_USER="$runtime_identity" \
              python3 - "$@" <<'CONTROL_INTENT'
          import json
          import os
          import pathlib
          import sys

          role = os.environ["INTENT_ROLE"]
          expected_name = (
              f"school-flag-off-browser-installer-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
              if role == "installer"
              else f"school-flag-off-browser-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          )
          payload = {
              "version": "1.0.0",
              "owner": (
                  f"{os.environ['GITHUB_RUN_ID']}|{os.environ['GITHUB_RUN_ATTEMPT']}|"
                  f"{os.environ['GITHUB_SHA']}"
              ),
              "repository": os.environ["GITHUB_REPOSITORY"],
              "role": role,
              "name": expected_name,
              "imageId": os.environ["INTENT_IMAGE"],
              "user": os.environ["INTENT_USER"],
              "network": "bridge" if role == "installer" else "none",
              "entrypoint": ["/usr/bin/env"],
              "processArgs": sys.argv[1:],
          }
          target = pathlib.Path(os.environ["INTENT_TARGET"])
          descriptor = os.open(
              target,
              os.O_WRONLY | os.O_CREAT | os.O_EXCL | getattr(os, "O_NOFOLLOW", 0),
              0o600,
          )
          with os.fdopen(descriptor, "w", encoding="utf-8") as output:
              json.dump(payload, output, ensure_ascii=True, indent=2, sort_keys=True)
              output.write("\n")
              output.flush()
              os.fsync(output.fileno())
          CONTROL_INTENT
            mv -T -- "$target.tmp" "$target" || return 1
            [ -f "$target" ] && [ ! -L "$target" ] || return 1
            [ "$(stat -c '%u:%g:%a' "$target")" = \
              "$host_uid:$host_gid:600" ] || return 1
          }

          assert_control_config() {
            local target="$1"
            local role="$2"
            local expected_image="$3"
            local expected_container_id="$4"
            local expected_state="${5:-created}"
            local inspect_json
            assert_control_container "$target" "$role" "$expected_image" \
              "$expected_container_id" || return 1
            if ! inspect_json="$(docker inspect "$expected_container_id")"; then
              return 1
            fi
            CONTROL_INSPECT_JSON="$inspect_json" CONTROL_ROLE="$role" \
              CONTROL_EXPECTED_ID="$expected_container_id" \
              CONTROL_EXPECTED_IMAGE="$expected_image" \
              CONTROL_EXPECTED_STATE="$expected_state" \
              CONTROL_RUNTIME_UID="$runtime_uid" \
            CONTROL_RUNTIME_GID="$runtime_gid" \
              CONTROL_IMAGE_ENV_JSON="$playwright_image_env_json" \
              CONTROL_INTENT_PATH="$control_state/$role.intent.json" \
              CONTROL_BROWSER_RUNTIME="$(realpath -e "$browser_runtime")" \
              CONTROL_BROWSER_EXCHANGE="$(realpath -e "$browser_exchange")" \
              CONTROL_TRANSPORT_ROOT="$(realpath -e "$transport_root")" \
              CONTROL_EVIDENCE_ROOT="$(realpath -e "$EVIDENCE_DIR")" \
              CONTROL_CAPTURE_SCRIPT="$(realpath -e \
                .github/scripts/school-flag-off-capture.mjs)" \
              python3 - <<'CONTROL_INSPECT'
          import json
          import os

          payload = json.loads(os.environ["CONTROL_INSPECT_JSON"])
          if not isinstance(payload, list) or len(payload) != 1:
              raise RuntimeError("Control inspect cardinality failed")
          item = payload[0]
          role = os.environ["CONTROL_ROLE"]
          runtime_uid = os.environ["CONTROL_RUNTIME_UID"]
          runtime_gid = os.environ["CONTROL_RUNTIME_GID"]
          run_id = os.environ["GITHUB_RUN_ID"]
          run_attempt = os.environ["GITHUB_RUN_ATTEMPT"]
          control_sha = os.environ["GITHUB_SHA"]
          expected_id = os.environ["CONTROL_EXPECTED_ID"]
          expected_image = os.environ["CONTROL_EXPECTED_IMAGE"]
          intent_path = os.path.realpath(os.environ["CONTROL_INTENT_PATH"])
          if os.path.islink(os.environ["CONTROL_INTENT_PATH"]):
              raise RuntimeError("Control intent symlink forbidden")
          with open(intent_path, encoding="utf-8") as source:
              intent = json.load(source)
          if set(intent) != {
              "version", "owner", "role", "name", "imageId", "user",
              "repository", "network", "entrypoint", "processArgs",
          }:
              raise RuntimeError("Control intent schema mismatch")
          expected_name = (
              f"school-flag-off-browser-installer-{run_id}-{run_attempt}"
              if role == "installer"
              else f"school-flag-off-browser-{run_id}-{run_attempt}"
          )
          if item.get("Id") != expected_id or item.get("Name") != "/" + expected_name:
              raise RuntimeError("Control identity mismatch")
          if item.get("Image") != expected_image:
              raise RuntimeError("Control image mismatch")
          state = item.get("State", {}).get("Status")
          expected_state = os.environ["CONTROL_EXPECTED_STATE"]
          if expected_state == "created" and state != "created":
              raise RuntimeError("Control was executed before review")
          if expected_state == "any" and state not in {
              "created", "running", "exited", "dead",
          }:
              raise RuntimeError("Control lifecycle state mismatch")
          if expected_state not in {"created", "any"}:
              raise RuntimeError("Unsupported expected control state")
          if intent != {
              **intent,
              "version": "1.0.0",
              "owner": f"{run_id}|{run_attempt}|{control_sha}",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "role": role,
              "name": expected_name,
              "imageId": expected_image,
              "user": f"{runtime_uid}:{runtime_gid}",
              "network": "bridge" if role == "installer" else "none",
              "entrypoint": ["/usr/bin/env"],
          }:
              raise RuntimeError("Control intent provenance mismatch")

          config = item.get("Config", {})
          host = item.get("HostConfig", {})
          if config.get("User") != f"{runtime_uid}:{runtime_gid}":
              raise RuntimeError("Control user mismatch")
          labels = config.get("Labels") or {}
          expected_school_labels = {
              "school.system": "school-1-11",
              "school.environment": "synthetic",
              "school.purpose": "flag-off-browser-control",
              "school.browser-role": role,
              "school.audit-repository": os.environ["GITHUB_REPOSITORY"],
              "school.audit-run-id": run_id,
              "school.audit-run-attempt": run_attempt,
              "school.runtime-uid": runtime_uid,
              "school.runtime-gid": runtime_gid,
              "school.control-sha": control_sha,
          }
          school_labels = {
              key: value for key, value in labels.items() if key.startswith("school.")
          }
          if school_labels != expected_school_labels:
              raise RuntimeError("Control label set mismatch")
          if config.get("Entrypoint") != intent["entrypoint"]:
              raise RuntimeError("Control entrypoint mismatch")
          command = config.get("Cmd")
          if command != intent["processArgs"]:
              raise RuntimeError("Control command mismatch")
          if not isinstance(command, list) or command[:3] != [
              "-i", "PATH=/usr/local/bin:/usr/bin:/bin", "HOME=/tmp/home"
