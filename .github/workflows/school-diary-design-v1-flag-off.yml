                    saved_id="$READ_EXACT_VALUE"
                    if ! assert_owned_builder_id "$saved_id"; then
                      cleanup_rc=1
                    elif ! docker container rm --force "$saved_id" >/dev/null; then
                      cleanup_rc=1
                    fi
                  else
                    cleanup_rc=1
                  fi
                else
                  cleanup_rc=1
                fi
              fi
            else
              cleanup_rc=1
            fi

            if [ -z "$saved_id" ] && [ -f "$recovery_root/container-id" ]; then
