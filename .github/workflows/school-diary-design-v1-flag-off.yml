          prove_ephemeral_exclusive_daemon() {
            local containers
            local volumes
            local networks
            local docker_root
            if [ "${RUNNER_ENVIRONMENT-}" != github-hosted ] || \
              [ "${RUNNER_OS-}" != Linux ]; then
              return 1
            fi
            if ! docker_root="$(docker info --format '{{.DockerRootDir}}')"; then
              return 1
            fi
            if [ "$docker_root" != /var/lib/docker ]; then
              return 1
            fi
            if ! containers="$(docker container ls -a --format '{{.Names}}')"; then
              return 1
            fi
            if [ -n "$containers" ]; then
              return 1
            fi
            if ! volumes="$(docker volume ls --format '{{.Name}}')"; then
              return 1
            fi
            if [ "$volumes" != "$state_volume" ]; then
              return 1
            fi
            if ! networks="$(docker network ls --format '{{.Name}}' | LC_ALL=C sort)"; then
              return 1
            fi
            if [ "$networks" != $'bridge\nhost\nnone' ]; then
              return 1
            fi
          }

          write_once() {
            local target="$1"
            local value="$2"
            local pattern="$3"
            local existing
            if [[ ! "$value" =~ $pattern ]]; then
              return 1
            fi
            if [ -e "$target" ] || [ -L "$target" ]; then
              if [ ! -f "$target" ] || [ -L "$target" ]; then
                return 1
              fi
              if ! existing="$(cat "$target")"; then
                return 1
              fi
              if [ "$existing" != "$value" ]; then
                return 1
              fi
              if [ "$(stat -c '%u:%g:%a' "$target")" != \
                "$(id -u):$(id -g):600" ]; then
                return 1
              fi
              return 0
            fi
            if ! printf '%s\n' "$value" > "$target.tmp"; then
              return 1
            fi
            if ! chmod 0600 "$target.tmp"; then
              return 1
            fi
            if ! mv -T "$target.tmp" "$target"; then
              return 1
            fi
          }

          read_exact() {
            local target="$1"
            local pattern="$2"
            local value
            if [ ! -f "$target" ] || [ -L "$target" ]; then
              return 1
            fi
            if [ "$(stat -c '%u:%g:%a' "$target")" != \
              "$(id -u):$(id -g):600" ]; then
              return 1
            fi
            if ! value="$(cat "$target")"; then
              return 1
            fi
            if [[ ! "$value" =~ $pattern ]]; then
              return 1
            fi
            READ_EXACT_VALUE="$value"
