          assert_owned_builder_id() {
            local expected_id="$1"
            local expected_pids="${2:-1024}"
            local inspect_json
            local image_json
            if [[ ! "$expected_id" =~ ^[a-f0-9]{64}$ ]]; then
              return 1
            fi
            if ! inspect_json="$(docker container inspect "$expected_id")"; then
              return 1
            fi
            if ! image_json="$(docker image inspect "$BUILDKIT_IMAGE")"; then
              return 1
            fi
