              "version": "1.0.0", "repository": os.environ["GITHUB_REPOSITORY"],
              "runId": os.environ["GITHUB_RUN_ID"],
              "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "controlSha": os.environ["GITHUB_SHA"],
              "runnerEnvironment": os.environ["RUNNER_ENVIRONMENT"],
              "builderName": os.environ["EXPECTED_BUILDER"],
              "nodeName": os.environ["EXPECTED_NODE"],
              "containerName": os.environ["EXPECTED_CONTAINER"],
              "stateVolume": os.environ["EXPECTED_VOLUME"],
              "buildRoot": os.environ["EXPECTED_BUILD_ROOT"],
              "recoveryRoot": os.environ["EXPECTED_RECOVERY_ROOT"],
              "buildkitImage": os.environ["BUILDKIT_IMAGE"],
              "dockerHost": "unix:///var/run/docker.sock",
              "nonce": os.environ["AUDIT_NONCE"],
