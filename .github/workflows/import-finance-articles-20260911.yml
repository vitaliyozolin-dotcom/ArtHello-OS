name: Import approved finance articles D115

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/import-finance-articles.py"
      - ".github/scripts/test_import_finance_articles.py"
      - ".github/workflows/import-finance-articles-20260911.yml"
      - "docs/finance/article-catalog-2026-09-11.json"
      - "docs/acceptance/2026-09-11-finance-article-import.md"
      - "DECISIONS.md"
      - "CURRENT_STATE.md"
      - "BACKLOG.md"
      - "quality-gates/workflow-policy-ratchet.json"

permissions:
  contents: read

concurrency:
  group: gateway-38-55-arthello-finance-catalog
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      release_sha: ${{ steps.identity.outputs.release_sha }}
    steps:
      - name: Check out exact import source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify one-shot identity and scope
        id: identity
        env:
          EXPECTED_REPOSITORY: vitaliyozolin-dotcom/ArtHello-OS
          EXPECTED_ACTOR: vitaliyozolin-dotcom
          EXPECTED_PARENT: acceb6ffe0dbd6c8e34d25d573f042da1500d5cb
          EXPECTED_CATALOG_DIGEST: 945a5c824da3c136142ae209456a083e9a926369986ca79077359195a971187f
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_ACTOR" = "$EXPECTED_ACTOR"
          test "$GITHUB_TRIGGERING_ACTOR" = "$EXPECTED_ACTOR"
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list --count HEAD^)" -ge 1
          parents="$(git show -s --format=%P HEAD)"
          test "$parents" = "$EXPECTED_PARENT"
          test "$(git show -s --format=%s HEAD)" = 'D118: use live owner credential for finance import'
          python3 -I - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/import-finance-articles-20260911.yml',
              'docs/acceptance/2026-09-11-finance-article-import.md',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', 'HEAD^', 'HEAD'], text=True
          ).splitlines())
          if changed != expected:
              raise SystemExit('IMPORT_SCOPE_INVALID')
          PY
          result="$(ARTHELLO_IMPORT_APPLY=0 python3 -I .github/scripts/import-finance-articles.py)"
          jq -e --arg digest "$EXPECTED_CATALOG_DIGEST" \
            '.status == "validated" and .desired == 144 and .digest == $digest' <<<"$result" >/dev/null
          python3 -I .github/scripts/test_import_finance_articles.py
          printf 'release_sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Wait for exact main Quality
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.identity.outputs.release_sha }}
        run: |
          set -Eeuo pipefail
          python3 -I - <<'PY'
          import json, os, time, urllib.request
          repository = 'vitaliyozolin-dotcom/ArtHello-OS'
          sha = os.environ['RELEASE_SHA']
          api = f'https://api.github.com/repos/{repository}/actions/workflows/quality.yml/runs?head_sha={sha}&branch=main&event=push&per_page=20'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          deadline = time.monotonic() + 1500
          while time.monotonic() < deadline:
              with urllib.request.urlopen(urllib.request.Request(api, headers=headers), timeout=20) as response:
                  value = json.load(response)
              runs = [run for run in value.get('workflow_runs', []) if run.get('head_sha') == sha and run.get('head_branch') == 'main' and run.get('event') == 'push']
              if len(runs) > 1:
                  raise SystemExit('QUALITY_IDENTITY_AMBIGUOUS')
              if runs and runs[0].get('status') == 'completed':
                  if runs[0].get('conclusion') != 'success' or runs[0].get('run_attempt') != 1:
                      raise SystemExit('QUALITY_NOT_ACCEPTED')
                  print('ARTHELLO_D115_QUALITY=VERIFIED')
                  break
              time.sleep(15)
          else:
              raise SystemExit('QUALITY_TIMEOUT')
          PY

  import:
    needs: verify
    runs-on: [self-hosted, linux, x64, arthello-gateway]
    environment: production-ru
    timeout-minutes: 20
    steps:
      - name: Check out exact verified import source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.verify.outputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Create verified backup and import approved catalog
        env:
          ARTHELLO_PUBLIC_ORIGIN: https://arthello-188-225-38-55.sslip.io
          ARTHELLO_IMPORT_APPLY: "1"
          EXPECTED_LIVE_SOURCE_SHA: ff8559254faaedade63a9ee7567a45686d08c13a
        run: |
          set -Eeuo pipefail
          umask 077
          test "$GITHUB_REPOSITORY" = vitaliyozolin-dotcom/ArtHello-OS
          test "$GITHUB_ACTOR" = vitaliyozolin-dotcom
          test "$GITHUB_TRIGGERING_ACTOR" = vitaliyozolin-dotcom
          test "$(git rev-parse HEAD)" = "${{ needs.verify.outputs.release_sha }}"
          mapfile -t live_ids < <(docker ps --filter 'name=^/arthello-direct-' --format '{{.ID}}')
          test "${#live_ids[@]}" -eq 1
          live_id="$(docker inspect "${live_ids[0]}" --format '{{.Id}}')"
          [[ "$live_id" =~ ^[a-f0-9]{64}$ ]]
          test "$(docker inspect "$live_id" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$EXPECTED_LIVE_SOURCE_SHA"
          password_file="$(docker inspect "$live_id" --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^ARTHELLO_BOOTSTRAP_PASSWORD_FILE=//p')"
          test "$password_file" = /run/secrets/bootstrap-password
          owner_password="$(docker exec "$live_id" sh -c 'test "$ARTHELLO_BOOTSTRAP_PASSWORD_FILE" = /run/secrets/bootstrap-password && cat "$ARTHELLO_BOOTSTRAP_PASSWORD_FILE"')"
          test -n "$owner_password"
          test "${#owner_password}" -le 512
          export ARTHELLO_E2E_LOGIN=owner ARTHELLO_E2E_PASSWORD="$owner_password"
          cleanup() { unset owner_password ARTHELLO_E2E_PASSWORD; }
          trap cleanup EXIT
          set +e
          result="$(python3 -I .github/scripts/import-finance-articles.py)"
          import_status="$?"
          set -e
          printf '%s\n' "$result"
          test "$import_status" -eq 0
          jq -e '.status == "accepted" and .desired == 144 and .activeVerified == 144 and (.articlesToCreate | type == "number") and (.draftsToApprove | type == "number")' <<<"$result" >/dev/null
