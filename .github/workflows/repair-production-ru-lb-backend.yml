name: Repair RU backend behind Timeweb load balancer

on:
  pull_request:
    paths:
      - .github/workflows/repair-production-ru-lb-backend.yml
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-production-ru-lb-backend.yml
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/arthello-production-trigger
  workflow_run:
    workflows:
      - Quality gates
    types:
      - completed
    branches:
      - codex/trigger-arthello-production-ru

permissions:
  contents: read
  issues: write

concurrency:
  group: arthello-production-ru
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate recovery contract
        run: |
          set -Eeuo pipefail
          case "${{ github.event_name }}" in
            pull_request|push|pull_request_target|workflow_run) ;;
            *) exit 1 ;;
          esac
          printf '%s\n' 'Timeweb terminates TLS; ArtHello Caddy must listen on plain HTTP :80.'

  announce:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'codex/trigger-arthello-production-ru') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'codex/trigger-arthello-production-ru' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      issue_number: ${{ steps.create_issue.outputs.issue_number }}
    steps:
      - name: Create production run record
        id: create_issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          response="$(gh api "repos/$GITHUB_REPOSITORY/issues"             --method POST             -f "title=[production-ru] run $GITHUB_RUN_ID"             -f "body=Production repair is queued. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          issue_number="$(jq -r '.number' <<<"$response")"
          test "$issue_number" != null
          printf 'issue_number=%s\n' "$issue_number" >> "$GITHUB_OUTPUT"

  repair:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'codex/trigger-arthello-production-ru') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'codex/trigger-arthello-production-ru' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    needs:
      - validate
      - announce
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-ru
    steps:
      - name: Configure pinned SSH host
        id: configure_ssh
        continue-on-error: true
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ARTHELLO_RU_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ARTHELLO_RU_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 0700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          test -s ~/.ssh/id_ed25519
          test -s ~/.ssh/known_hosts

      - name: Restore HTTP backend and create first owner
        id: repair_backend
        if: steps.configure_ssh.outcome == 'success'
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.ARTHELLO_RU_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ARTHELLO_RU_DEPLOY_USER }}
        run: |
          set -Eeuo pipefail
          log_file="$RUNNER_TEMP/arthello-repair.log"
          set +e
          ssh -o BatchMode=yes -o ConnectTimeout=20 "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE' 2>&1 | tee "$log_file"
          set -Eeuo pipefail
          trap 'rc=$?; printf "ARTHELLO_REPAIR_FAILED line=%s rc=%s\n" "$LINENO" "$rc" >&2; exit "$rc"' ERR

          root=/srv/arthello
          env_file="$root/shared/.env.production"
          compose_file="$root/current/deploy/compose.production.yml"
          domain=os.arthelloteam.ru
          owner_login=ozolin@arthello.ru
          owner_name='Виталий Озолин'

          test -f "$env_file"
          test -f "$compose_file"
          test -L "$root/current"
          backup_file="$env_file.before-timeweb-lb.$(date -u +%Y%m%dT%H%M%SZ)"
          cp --preserve=mode,ownership,timestamps "$env_file" "$backup_file"

          python3 - "$env_file" "$domain" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          domain = sys.argv[2]
          lines = path.read_text(encoding="utf-8").splitlines()
          replacement = f"APP_ORIGINS=https://{domain}"
          result = []
          found = False
          for line in lines:
              if line.startswith("APP_ORIGINS="):
                  result.append(replacement)
                  found = True
              else:
                  result.append(line)
          if not found:
              result.append(replacement)
          path.write_text("\n".join(result) + "\n", encoding="utf-8")
          PY
          chmod 0600 "$env_file"

          cd "$root/current/deploy"
          export ARTHELLO_HOST=:80
          docker compose --env-file "$env_file" -f "$compose_file" config >/dev/null
          docker compose --env-file "$env_file" -f "$compose_file"             up -d --no-build --pull never --force-recreate api web

          healthy=0
          for _ in $(seq 1 36); do
            if curl --fail --silent --show-error http://127.0.0.1/api/healthz >/dev/null; then
              healthy=1
              break
            fi
            sleep 5
          done
          test "$healthy" -eq 1

          web_id="$(docker compose --env-file "$env_file" -f "$compose_file" ps -q web)"
          test -n "$web_id"
          docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$web_id"             | grep -Fx 'ARTHELLO_HOST=:80' >/dev/null
          test "$(curl --silent --show-error --output /dev/null             --write-out '%{http_code}' -H "Host: $domain" http://127.0.0.1/)" = 200

          owner_count="$(docker compose --env-file "$env_file" -f "$compose_file" exec -T db sh -lc             'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT COUNT(*) FROM auth_users WHERE role = '\''owner'\'' AND is_active = TRUE;"'             | tr -d '[:space:]')"
          case "$owner_count" in
            0)
              owner_password="$(python3 - <<'PY'
          import secrets
          print(secrets.token_urlsafe(24) + "Aa1!")
          PY
              )"
              docker compose --env-file "$env_file" -f "$compose_file" exec -T                 -e AUTH_BOOTSTRAP_OWNER_LOGIN="$owner_login"                 -e AUTH_BOOTSTRAP_OWNER_NAME="$owner_name"                 -e AUTH_BOOTSTRAP_OWNER_PASSWORD="$owner_password"                 api node --import tsx /app/artifacts/api-server/src/scripts/create-owner.ts >/dev/null
              umask 077
              {
                printf 'URL=https://%s\n' "$domain"
                printf 'LOGIN=%s\n' "$owner_login"
                printf 'TEMP_PASSWORD=%s\n' "$owner_password"
              } > "$root/shared/first-owner-access.txt"
              unset owner_password
              printf 'ARTHELLO_FIRST_OWNER=CREATED\n'
              ;;
            1)
              printf 'ARTHELLO_FIRST_OWNER=ALREADY_EXISTS\n'
              ;;
            *)
              printf 'ARTHELLO_OWNER_COUNT_INVALID=%s\n' "$owner_count" >&2
              exit 1
              ;;
          esac

          printf 'ARTHELLO_BACKEND_MODE=HTTP_80_BEHIND_TIMEWEB_LB\n'
          printf 'ARTHELLO_LOCAL_HEALTH=OK\n'
          printf 'ARTHELLO_REAL_DATA=NOT_LOADED\n'
          printf 'ARTHELLO_INTEGRATIONS=DISABLED\n'
          REMOTE
          remote_status=${PIPESTATUS[0]}
          set -e
          exit "$remote_status"

      - name: Verify public HTTPS
        id: verify_public
        if: steps.repair_backend.outcome == 'success'
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          healthy=0
          for _ in $(seq 1 36); do
            if curl --fail --silent --show-error https://os.arthelloteam.ru/api/healthz >/dev/null; then
              healthy=1
              break
            fi
            sleep 5
          done
          test "$healthy" -eq 1
          test "$(curl --silent --show-error --output /dev/null             --write-out '%{http_code}' https://os.arthelloteam.ru/)" = 200
          printf 'ARTHELLO_PUBLIC_HTTPS=OK\n'

      - name: Publish sanitized production result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIGURE_OUTCOME: ${{ steps.configure_ssh.outcome }}
          REPAIR_OUTCOME: ${{ steps.repair_backend.outcome }}
          PUBLIC_OUTCOME: ${{ steps.verify_public.outcome }}
        run: |
          set -Eeuo pipefail
          log_file="$RUNNER_TEMP/arthello-repair.log"
          report_file="$RUNNER_TEMP/arthello-report.md"
          {
            printf 'Production repair run: %s\n\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            printf -- '- SSH configuration: `%s`\n' "$CONFIGURE_OUTCOME"
            printf -- '- Backend repair: `%s`\n' "$REPAIR_OUTCOME"
            printf -- '- Public HTTPS: `%s`\n\n' "$PUBLIC_OUTCOME"
            printf 'Sanitized backend markers:\n\n```text\n'
            if [ -f "$log_file" ]; then
              grep -E '^(ARTHELLO_|Error:|error:|curl:|ssh:|Permission denied|Host key)' "$log_file"                 | tail -n 80                 | sed -E 's/(PASSWORD|TOKEN|SECRET|PRIVATE_KEY)=.*/\1=[REDACTED]/Ig' || true
            else
              printf 'No backend log was produced.\n'
            fi
            printf '```\n'
          } > "$report_file"
          issue_number="${{ needs.announce.outputs.issue_number }}"
          test -n "$issue_number"
          gh api "repos/$GITHUB_REPOSITORY/issues/$issue_number"             --method PATCH             -f "body=$(cat "$report_file")" >/dev/null

      - name: Enforce successful production result
        if: always()
        env:
          CONFIGURE_OUTCOME: ${{ steps.configure_ssh.outcome }}
          REPAIR_OUTCOME: ${{ steps.repair_backend.outcome }}
          PUBLIC_OUTCOME: ${{ steps.verify_public.outcome }}
        run: |
          set -Eeuo pipefail
          test "$CONFIGURE_OUTCOME" = success
          test "$REPAIR_OUTCOME" = success
          test "$PUBLIC_OUTCOME" = success
