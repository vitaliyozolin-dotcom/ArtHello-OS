name: Repair RU backend behind Timeweb load balancer

on:
  pull_request:
    paths:
      - .github/workflows/repair-production-ru-lb-backend.yml
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-production-ru-lb-backend.yml

permissions:
  contents: read

concurrency:
  group: arthello-production-ru
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate recovery contract
        run: |
          set -Eeuo pipefail
          test "${{ github.event_name }}" = pull_request -o "${{ github.event_name }}" = push
          printf '%s\n' 'Timeweb terminates TLS; ArtHello Caddy must listen on plain HTTP :80.'

  repair:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-ru
    steps:
      - name: Configure pinned SSH host
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ARTHELLO_RU_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ARTHELLO_RU_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 0700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          test -s ~/.ssh/id_ed25519
          test -s ~/.ssh/known_hosts

      - name: Restore HTTP backend and create first owner
        env:
          DEPLOY_HOST: ${{ secrets.ARTHELLO_RU_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ARTHELLO_RU_DEPLOY_USER }}
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail

          root=/srv/arthello
          env_file="$root/shared/.env.production"
          compose_file="$root/current/deploy/compose.production.yml"
          domain=os.arthelloteam.ru
          owner_login=ozolin@arthello.ru
          owner_name='Виталий Озолин'

          test -f "$env_file"
          test -f "$compose_file"
          test -L "$root/current"
          install -m 0600 "$env_file" "$env_file.before-timeweb-lb"

          python3 - "$env_file" "$domain" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          domain = sys.argv[2]
          lines = path.read_text(encoding="utf-8").splitlines()
          replacement = f"APP_ORIGINS=https://{domain}"
          found = False
          result = []
          for line in lines:
              if line.startswith("APP_ORIGINS="):
                  result.append(replacement)
                  found = True
              else:
                  result.append(line)
          if not found:
              result.append(replacement)
          path.write_text("\n".join(result) + "\n", encoding="utf-8")
          PY
          chmod 0600 "$env_file"

          cd "$root/current/deploy"
          ARTHELLO_HOST=:80 docker compose             --env-file "$env_file" -f "$compose_file"             up -d --no-build --pull never --force-recreate api web

          healthy=0
          for _ in $(seq 1 36); do
            if curl --fail --silent --show-error               http://127.0.0.1/api/healthz >/dev/null; then
              healthy=1
              break
            fi
            sleep 5
          done
          if [ "$healthy" -ne 1 ]; then
            ARTHELLO_HOST=:80 docker compose               --env-file "$env_file" -f "$compose_file" ps >&2 || true
            ARTHELLO_HOST=:80 docker compose               --env-file "$env_file" -f "$compose_file" logs               --tail=120 web api >&2 || true
            exit 1
          fi

          web_id="$(ARTHELLO_HOST=:80 docker compose             --env-file "$env_file" -f "$compose_file" ps -q web)"
          test -n "$web_id"
          docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$web_id"             | grep -Fx 'ARTHELLO_HOST=:80' >/dev/null
          test "$(curl --silent --show-error --output /dev/null             --write-out '%{http_code}' -H "Host: $domain" http://127.0.0.1/)" = 200

          owner_count="$(ARTHELLO_HOST=:80 docker compose             --env-file "$env_file" -f "$compose_file" exec -T db sh -lc             'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT COUNT(*) FROM auth_users WHERE role = '\''owner'\'' AND is_active = TRUE;"'             | tr -d '[:space:]')"
          case "$owner_count" in
            0)
              owner_password="$(python3 - <<'PY'
          import secrets
          print(secrets.token_urlsafe(24) + "Aa1!")
          PY
              )"
              ARTHELLO_HOST=:80 docker compose                 --env-file "$env_file" -f "$compose_file" exec -T                 -e AUTH_BOOTSTRAP_OWNER_LOGIN="$owner_login"                 -e AUTH_BOOTSTRAP_OWNER_NAME="$owner_name"                 -e AUTH_BOOTSTRAP_OWNER_PASSWORD="$owner_password"                 api node --import tsx                 /app/artifacts/api-server/src/scripts/create-owner.ts >/dev/null
              umask 077
              {
                printf 'URL=https://%s\n' "$domain"
                printf 'LOGIN=%s\n' "$owner_login"
                printf 'TEMP_PASSWORD=%s\n' "$owner_password"
              } > "$root/shared/first-owner-access.txt"
              unset owner_password
              printf 'ARTHELLO_FIRST_OWNER=CREATED\n'
              ;;
            1)
              printf 'ARTHELLO_FIRST_OWNER=ALREADY_EXISTS\n'
              ;;
            *)
              printf 'Unexpected active owner count: %s\n' "$owner_count" >&2
              exit 1
              ;;
          esac

          printf 'ARTHELLO_BACKEND_MODE=HTTP_80_BEHIND_TIMEWEB_LB\n'
          printf 'ARTHELLO_LOCAL_HEALTH=OK\n'
          printf 'ARTHELLO_REAL_DATA=NOT_LOADED\n'
          printf 'ARTHELLO_INTEGRATIONS=DISABLED\n'
          REMOTE

      - name: Verify public HTTPS
        run: |
          set -Eeuo pipefail
          healthy=0
          for _ in $(seq 1 36); do
            if curl --fail --silent --show-error               https://os.arthelloteam.ru/api/healthz >/dev/null; then
              healthy=1
              break
            fi
            sleep 5
          done
          test "$healthy" -eq 1
          test "$(curl --silent --show-error --output /dev/null             --write-out '%{http_code}' https://os.arthelloteam.ru/)" = 200
          printf 'ARTHELLO_PUBLIC_HTTPS=OK\n'
