name: School passwordless and SSO targeted

on:
  push:
    branches:
      - codex/school-passwordless-sso-20260831
    paths:
      - app/**
      - server/**
      - drizzle/**
      - tests/**
      - package.json
      - Dockerfile
      - .github/workflows/school-passwordless-targeted.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: school-passwordless-targeted
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, linux, x64, arthello-gateway]
    timeout-minutes: 50
    steps:
      - name: Check out exact School candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Build candidate and run auth contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          builder="school-passwordless-builder:${GITHUB_SHA}"
          runtime="school-passwordless-runtime:${GITHUB_SHA}"
          docker build --pull --target builder --tag "$builder" .
          docker run --rm --network none --entrypoint node "$builder" \
            --test \
            tests/phone-auth-contract.test.mjs \
            tests/central-access-contract.test.mjs \
            tests/central-family-directory.test.mjs \
            tests/identity-broker-contract.test.mjs \
            tests/design-code-contract.test.mjs
          docker build --tag "$runtime" .
          printf 'SCHOOL_PASSWORDLESS_BUILD=PASS\n'

      - name: Verify isolated runtime and retired local password
        shell: bash
        run: |
          set -Eeuo pipefail
          runtime="school-passwordless-runtime:${GITHUB_SHA}"
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container="school-passwordless-check-${suffix}"
          data="school_passwordless_check_${suffix}_data"
          secret="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          delivery="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            docker volume rm "$data" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker volume create "$data" >/dev/null
          docker run -d \
            --name "$container" \
            --network none \
            --security-opt no-new-privileges:true \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e DATABASE_PATH=/data/school-1-11.sqlite \
            -e PUBLIC_APP_ORIGIN=http://127.0.0.1:3000 \
            -e ARTHELLO_PUBLIC_ORIGIN=https://arthello.invalid \
            -e CENTRAL_ACCESS_SECRET="$secret" \
            -e PASSWORDLESS_PEPPER="$secret" \
            -e PASSWORDLESS_DELIVERY_URL=https://delivery.invalid/school-passwordless \
            -e PASSWORDLESS_DELIVERY_TOKEN="$delivery" \
            -v "$data:/data" \
            "$runtime" >/dev/null

          ready=0
          for attempt in $(seq 1 90); do
            if docker exec "$container" node -e "fetch('http://127.0.0.1:3000/api/health').then(async r=>{if(!r.ok)process.exit(1);const t=await r.text();if(!t.includes('status'))process.exit(1)}).catch(()=>process.exit(1))"; then
              ready=1
              break
            fi
            if [ "$(docker inspect "$container" --format '{{.State.Running}}' 2>/dev/null || true)" != true ]; then
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker logs "$container" --tail 160 >&2 || true
            exit 1
          fi

          docker exec -i "$container" node --input-type=module - <<'VERIFY_RUNTIME'
          import { DatabaseSync } from 'node:sqlite';
          const base = 'http://127.0.0.1:3000';
          const login = await fetch(base + '/login');
          const html = await login.text();
          if (!login.ok) throw new Error('Login page failed');
          for (const marker of [
            'Получить код',
            'Постоянный пароль не нужен',
            'Войти сотруднику через ArtHello OS',
          ]) if (!html.includes(marker)) throw new Error('Missing login marker: ' + marker);
          if (html.includes('name="password"'))
            throw new Error('Standalone diary password field is still exposed');

          const legacy = await fetch(base + '/api/auth/login', {
            method: 'POST',
            headers: { origin: base, 'content-type': 'application/json' },
            body: JSON.stringify({ login: 'nobody@example.invalid', password: 'InvalidPassword1' }),
          });
          const legacyPayload = await legacy.json();
          if (legacy.status !== 410 || !String(legacyPayload.error || '').includes('отключён'))
            throw new Error('Legacy password login is not retired');

          const unresolved = await fetch(base + '/api/auth/passwordless/request', {
            method: 'POST',
            headers: { origin: base, 'content-type': 'application/json' },
            body: JSON.stringify({ identifier: 'nobody@example.invalid', returnTo: '/' }),
          });
          const unresolvedPayload = await unresolved.json();
          if (!unresolved.ok || !String(unresolvedPayload.challengeId || '').startsWith('unresolved-'))
            throw new Error('Enumeration-safe passwordless response failed');

          const ssoStart = await fetch(base + '/auth/central/start', { redirect: 'manual' });
          if (ssoStart.status !== 303)
            throw new Error('Staff SSO start route failed');
          const location = ssoStart.headers.get('location') || '';
          if (!location.startsWith('https://arthello.invalid/api/school-sso/authorize'))
            throw new Error('Staff SSO audience is incorrect');

          const db = new DatabaseSync('/data/school-1-11.sqlite', { readOnly: true });
          const brokerTable = db.prepare(
            "SELECT count(*) AS count FROM sqlite_master WHERE type='table' AND name='passwordless_challenges'"
          ).get().count;
          const integrity = db.prepare('PRAGMA integrity_check').get().integrity_check;
          db.close();
          if (brokerTable !== 1 || integrity !== 'ok')
            throw new Error('Passwordless schema or SQLite integrity failed');
          console.log('SCHOOL_PASSWORDLESS_RUNTIME=PASS');
          VERIFY_RUNTIME

          cleanup
          trap - EXIT

      - name: Cleanup candidate images
        if: always()
        shell: bash
        run: |
          docker image rm "school-passwordless-runtime:${GITHUB_SHA}" >/dev/null 2>&1 || true
          docker image rm "school-passwordless-builder:${GITHUB_SHA}" >/dev/null 2>&1 || true

      - name: Publish commit status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.sha,
              state: process.env.JOB_STATUS === 'success' ? 'success' : 'failure',
              context: 'school/passwordless-sso-targeted',
              description: 'School passwordless and SSO targeted ' + process.env.JOB_STATUS,
              target_url: process.env.GITHUB_SERVER_URL + '/' + process.env.GITHUB_REPOSITORY + '/actions/runs/' + process.env.GITHUB_RUN_ID,
            });
