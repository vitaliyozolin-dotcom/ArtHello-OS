name: Verify ArtHello R13 continuation
'on':
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/scripts/**'
      - 'deploy/**'
      - 'scripts/test/retire-r12-browser.test.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/scripts/**'
      - 'deploy/**'
      - 'scripts/test/retire-r12-browser.test.mjs'
permissions:
  contents: read
concurrency:
  group: verify-arthello-r13-${{ github.ref }}
  cancel-in-progress: true
jobs:
  r13-candidate-tests:
    name: r13-candidate-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHECKED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      R13_CONTRACT_SHA256: d65d1aa20817ba4d7d07aa46ae1cce71bb14297b5744ab6872bea5482fe97885
    steps:
      - name: Check out exact unprivileged R13 verification source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CHECKED_SOURCE_SHA }}
          fetch-depth: 0
          clean: true
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify frozen contracts and bounded R13 continuation behavior
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(id -u)" -ne 0
          [[ "$CHECKED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CHECKED_SOURCE_SHA"
          [[ "$R13_CONTRACT_SHA256" =~ ^[a-f0-9]{64}$ ]]
          test "$(sha256sum deploy/v52/recovery-r13/check-contract.rb | cut -d ' ' -f 1)" = "$R13_CONTRACT_SHA256"
          ruby deploy/v52/recovery-r13/check-contract.rb
          python3 -I -B .github/scripts/test-r13-contract.py
          python3 -I -B .github/scripts/test-r13-history-gate.py
          python3 -I -B .github/scripts/test-r13-backup-adoption.py
          python3 -I -B .github/scripts/test-r13-backup-controller.py
          python3 -I -B .github/scripts/test-r13-continuation-adapters.py
          python3 -I -B .github/scripts/test-r13-live-baseline.py
          python3 -I -B .github/scripts/test-run-r13-live-browser.py
          node --test scripts/test/retire-r12-browser.test.mjs
          node --check deploy/browser/retire-r12-browser.mjs
