name: ArtHello School SSO candidate v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/arthello-school-sso-candidate-v2.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: arthello-school-sso-candidate-v2
  cancel-in-progress: false

env:
  CANDIDATE_SHA: 738f54ad6231286279f1001632abf23aedee03db
  APP_IMAGE: arthello-school-sso-v2-app:738f54ad6231
  RUNTIME_IMAGE: arthello-school-sso-v2-runtime:738f54ad6231
  TEST_ORIGIN: http://127.0.0.1:3431

jobs:
  candidate:
    runs-on: [self-hosted, linux, x64, arthello-gateway]
    timeout-minutes: 55
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
          path: candidate

      - name: Record immutable production baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t live < <(docker ps --filter 'name=^/arthello-direct-' --format '{{.Names}}')
          test "${#live[@]}" -eq 1
          live_name="${live[0]}"
          live_id="$(docker inspect "$live_name" --format '{{.Id}}')"
          live_image="$(docker inspect "$live_name" --format '{{.Image}}')"
          live_started="$(docker inspect "$live_name" --format '{{.State.StartedAt}}')"
          live_health="$(docker inspect "$live_name" --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}')"
          test "$(docker inspect "$live_name" --format '{{.State.Running}}')" = true
          printf 'live_name=%s\n' "$live_name" >> "$GITHUB_ENV"
          printf 'live_id=%s\n' "$live_id" >> "$GITHUB_ENV"
          printf 'live_image=%s\n' "$live_image" >> "$GITHUB_ENV"
          printf 'live_started=%s\n' "$live_started" >> "$GITHUB_ENV"
          printf 'live_health=%s\n' "$live_health" >> "$GITHUB_ENV"
          printf 'ARTHELLO_SSO_PRODUCTION_BASELINE=RECORDED\n'

      - name: Build exact application and runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          docker build --file candidate/deploy/v52/Dockerfile --target application --tag "$APP_IMAGE" candidate
          docker build --file candidate/deploy/v52/Dockerfile --tag "$RUNTIME_IMAGE" candidate
          docker run --rm --network none --entrypoint node "$APP_IMAGE" \
            --test /app/tests/school-sso-contract.test.mjs
          docker run --rm --entrypoint sh "$APP_IMAGE" -euc '
            for file in \
              /app/app/api/school-sso/authorize/route.ts \
              /app/app/api/school-sso/exchange/route.ts \
              /app/lib/school-sso.ts \
              /app/app/school-sso/login/page.tsx
            do
              test -s "$file"
              printf "ARTHELLO_SSO_FILE=OK:%s\n" "$file"
            done
            grep -F "Открыть дневник" /app/app/components/EducationWorkspace.tsx >/dev/null
            grep -F "SCHOOL_DIARY_SSO_URL" /app/app/components/EducationWorkspace.tsx >/dev/null
            grep -F "Завершить входы" /app/app/components/SettingsWorkspace.tsx >/dev/null
            if grep -F "Сбросить пароль" /app/app/components/SettingsWorkspace.tsx >/dev/null; then
              printf "LEGACY_DIARY_PASSWORD_ACTION=FOUND\n" >&2
              exit 1
            fi
            printf "ARTHELLO_SSO_LEGACY_PASSWORD_ACTION=ABSENT\n"
          '
          printf 'ARTHELLO_SCHOOL_SSO_BUILD=OK\n'

      - name: Run isolated SSO authorization and replay test
        shell: bash
        run: |
          set -Eeuo pipefail
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container="arthello-school-sso-v2-${suffix}"
          volume="arthello_school_sso_v2_${suffix}_data"
          work=""
          cleanup() {
            rc=$?
            set +e
            docker rm -f "$container" >/dev/null 2>&1
            docker volume rm "$volume" >/dev/null 2>&1
            case "$work" in
              "$RUNNER_TEMP"/arthello-school-sso-v2-*) rm -rf -- "$work" ;;
            esac
            exit "$rc"
          }
          trap cleanup EXIT

          test -z "$(docker ps -q --filter publish=3431)"
          docker volume create "$volume" >/dev/null
          docker run -d \
            --name "$container" \
            --network bridge \
            -p 127.0.0.1:3431:8081 \
            --security-opt no-new-privileges:true \
            -e NODE_ENV=production \
            -e PORT=8081 \
            -e ARTHELLO_D1_PATH=/data/d1 \
            -e ARTHELLO_BOOTSTRAP_ADMIN_LOGIN=sso-owner \
            -e ARTHELLO_BOOTSTRAP_ADMIN_PASSWORD=SchoolSsoCandidate2026A1 \
            -e ARTHELLO_BOOTSTRAP_ADMIN_NAME='SSO Owner' \
            -v "$volume:/data" \
            "$RUNTIME_IMAGE" >/dev/null

          ready=0
          for attempt in $(seq 1 90); do
            if curl -fsS --max-time 4 "$TEST_ORIGIN/api/health" | grep -F '"status":"ok"' >/dev/null; then
              ready=1
              break
            fi
            test "$(docker inspect "$container" --format '{{.State.Running}}' 2>/dev/null || true)" = true || break
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker logs "$container" --tail 180 >&2 || true
            exit 1
          fi

          work="$(mktemp -d "$RUNNER_TEMP/arthello-school-sso-v2-XXXXXX")"
          login_status="$(curl -sS --max-time 20 -D "$work/login.headers" -o "$work/login.json" -w '%{http_code}' -X POST "$TEST_ORIGIN/api/auth/login" -H "Origin: $TEST_ORIGIN" -H 'Content-Type: application/json' --data '{"login":"sso-owner","password":"SchoolSsoCandidate2026A1"}')"
          test "$login_status" = 200
          session_cookie="$(tr -d '\r' < "$work/login.headers" | sed -n 's/^set-cookie: \(__Host-arthello_session=[^;]*\).*/\1/ip' | head -n1)"
          test -n "$session_cookie"

          verifier='bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb'
          challenge="$(python3 - "$verifier" <<'PY'
          import base64, hashlib, sys
          print(base64.urlsafe_b64encode(hashlib.sha256(sys.argv[1].encode()).digest()).decode().rstrip('='))
          PY
          )"
          state='aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
          authorize="$TEST_ORIGIN/api/school-sso/authorize?state=$state&code_challenge=$challenge&return_to=%2F"
          authorize_status="$(curl -sS --max-time 20 -D "$work/authorize.headers" -o /dev/null -w '%{http_code}' -H "Cookie: $session_cookie" "$authorize")"
          test "$authorize_status" = 303
          location="$(tr -d '\r' < "$work/authorize.headers" | sed -n 's/^location: //ip' | tail -n1)"
          case "$location" in
            https://school-188-225-38-55.sslip.io/auth/central/callback*) ;;
            *) printf 'Unexpected School callback: %s\n' "$location" >&2; exit 1 ;;
          esac
          code="$(python3 - "$location" "$state" <<'PY'
          import sys, urllib.parse
          query = urllib.parse.parse_qs(urllib.parse.urlparse(sys.argv[1]).query)
          assert query.get('state') == [sys.argv[2]]
          code = query.get('code', [''])[0]
          assert len(code) >= 40
          print(code)
          PY
          )"
          python3 - "$code" "$verifier" > "$work/exchange.json" <<'PY'
          import json, sys
          print(json.dumps({'code': sys.argv[1], 'codeVerifier': sys.argv[2]}))
          PY
          exchange_status="$(curl -sS --max-time 20 -o "$work/exchange-result.json" -w '%{http_code}' -X POST "$TEST_ORIGIN/api/school-sso/exchange" -H 'Content-Type: application/json' --data-binary @"$work/exchange.json")"
          test "$exchange_status" = 200
          python3 - "$work/exchange-result.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          assert data['ok'] is True
          assert data['identity']['role'] == 'director'
          assert data['identity']['displayName'] == 'SSO Owner'
          assert data['identity']['centralUserId']
          assert data['identity']['accessVersion'] >= 1
          PY
          replay_status="$(curl -sS --max-time 20 -o "$work/replay.json" -w '%{http_code}' -X POST "$TEST_ORIGIN/api/school-sso/exchange" -H 'Content-Type: application/json' --data-binary @"$work/exchange.json")"
          test "$replay_status" = 401
          printf 'ARTHELLO_SCHOOL_SSO_RUNTIME=OK\n'
          printf 'ARTHELLO_SCHOOL_SSO_REPLAY=REJECTED\n'

      - name: Verify production remained unchanged
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${live_name:-}"
          test "$(docker inspect "$live_name" --format '{{.Id}}')" = "$live_id"
          test "$(docker inspect "$live_name" --format '{{.Image}}')" = "$live_image"
          test "$(docker inspect "$live_name" --format '{{.State.StartedAt}}')" = "$live_started"
          test "$(docker inspect "$live_name" --format '{{.State.Running}}')" = true
          current_health="$(docker inspect "$live_name" --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}')"
          test "$current_health" = "$live_health"
          printf 'ARTHELLO_SSO_PRODUCTION_UNCHANGED=YES\n'

      - name: Cleanup candidate images
        if: always()
        shell: bash
        run: |
          docker image rm "$RUNTIME_IMAGE" "$APP_IMAGE" >/dev/null 2>&1 || true

      - name: Report candidate status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: process.env.CANDIDATE_SHA,
              state: process.env.JOB_STATUS === 'success' ? 'success' : 'failure',
              context: 'arthello/school-sso-candidate-v2',
              description: 'ArtHello School SSO candidate v2 ' + process.env.JOB_STATUS,
              target_url: process.env.GITHUB_SERVER_URL + '/' + process.env.GITHUB_REPOSITORY + '/actions/runs/' + process.env.GITHUB_RUN_ID,
            });
