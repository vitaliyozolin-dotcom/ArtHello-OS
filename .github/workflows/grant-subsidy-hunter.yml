name: Grant & Subsidy Hunter

on:
  push:
    branches:
      - main
    paths:
      - ".company-os/agents/grant-subsidy-hunter/**"
      - "company-os/grants/**"
      - ".github/workflows/grant-subsidy-hunter.yml"
  schedule:
    - cron: "17 5 * * 1-5"
    - cron: "47 5 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: Scan depth
        required: true
        default: full
        type: choice
        options:
          - delta
          - full

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: grant-subsidy-hunter
  cancel-in-progress: true

jobs:
  discover:
    name: Scan, verify and build Company OS module
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      ISSUE_TITLE: "Grant Hunter — портфель возможностей"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run safety, quality and privacy tests
        shell: bash
        run: |
          python3 .company-os/agents/grant-subsidy-hunter/test_discovery.py
          python3 .company-os/agents/grant-subsidy-hunter/test_quality.py
          python3 .company-os/agents/grant-subsidy-hunter/test_dashboard.py
          python3 -m py_compile \
            .company-os/agents/grant-subsidy-hunter/discovery.py \
            .company-os/agents/grant-subsidy-hunter/quality.py \
            .company-os/agents/grant-subsidy-hunter/runtime.py \
            .company-os/agents/grant-subsidy-hunter/engine.py \
            .company-os/agents/grant-subsidy-hunter/build_dashboard.py

      - name: Select scan mode
        id: mode
        shell: bash
        run: |
          mode="delta"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            mode="${{ inputs.mode }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            mode="full"
          elif [[ "${{ github.event.schedule }}" == "47 5 * * 0" ]]; then
            mode="full"
          fi
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"

      - name: Load previous portfolio
        id: issue
        shell: bash
        run: |
          issue_number="$(
            gh issue list \
              --state open \
              --limit 100 \
              --json number,title \
              --jq '.[] | select(.title == "Grant Hunter — портфель возможностей") | .number' \
              | head -n 1 || true
          )"
          if [[ -n "${issue_number}" ]]; then
            gh issue view "${issue_number}" --json body --jq '.body' > previous-report.md
          else
            : > previous-report.md
          fi
          echo "issue_number=${issue_number}" >> "${GITHUB_OUTPUT}"

      - name: Discover opportunities
        shell: bash
        run: |
          python3 .company-os/agents/grant-subsidy-hunter/runtime.py \
            --mode "${{ steps.mode.outputs.mode }}" \
            --previous-report previous-report.md \
            --report grant-hunter-report.md \
            --json grant-hunter-candidates.json

      - name: Build anonymized Company OS interface
        shell: bash
        run: |
          python3 .company-os/agents/grant-subsidy-hunter/build_dashboard.py \
            --candidates grant-hunter-candidates.json \
            --profiles .company-os/agents/grant-subsidy-hunter/anonymized-profiles.json \
            --overrides .company-os/agents/grant-subsidy-hunter/verified-overrides.json \
            --ui-dir company-os/grants \
            --output _site

      - name: Publish portfolio issue
        shell: bash
        run: |
          issue_number="${{ steps.issue.outputs.issue_number }}"
          if [[ -n "${issue_number}" ]]; then
            gh issue edit "${issue_number}" \
              --title "${ISSUE_TITLE}" \
              --body-file grant-hunter-report.md
          else
            gh issue create \
              --title "${ISSUE_TITLE}" \
              --body-file grant-hunter-report.md
          fi

      - name: Configure Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v6

      - name: Upload Company OS module
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Add job summary
        if: always()
        shell: bash
        run: |
          echo "# Grant Hunter / Company OS" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Environment: production" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Data mode: anonymized" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Submission: blocked" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          if [[ -f grant-hunter-report.md ]]; then
            cat grant-hunter-report.md >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "Grant Hunter did not produce a report." >> "${GITHUB_STEP_SUMMARY}"
          fi

  deploy:
    name: Deploy Company OS grants interface
    needs: discover
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
