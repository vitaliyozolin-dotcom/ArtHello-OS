          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" true \
          </dev/null >/dev/null

        payload="$(base64 -w0 <<'REMOTE'
        set -Eeuo pipefail
        production=school-1-11
        exec 9>>/var/lock/school-1-11-production.lock
        flock -w 900 9
        school_container_id="$(docker container inspect "$production" --format '{{.Id}}')"
        [[ "$school_container_id" =~ ^[a-f0-9]{64}$ ]]
        test "$(docker container inspect "$school_container_id" --format '{{.State.Running}}')" = true
        test "$(docker container inspect "$school_container_id" --format '{{.State.Health.Status}}')" = healthy
        test "$(docker container inspect "$school_container_id" --format '{{index .Config.Labels "school.system"}}')" = school-1-11
        test "$(docker container inspect "$school_container_id" --format '{{index .Config.Labels "school.environment"}}')" = production
