# D-067: fresh R5 release for PR360 after verified School egress diagnosis.
# D059/D063/D064/D065/D066 controllers remain unchanged; failed repairs are not replayed.
# School config repair precedes fresh natural browser acceptance; no School rebuild.
name: Deploy ArtHello recovery R5 D067
'on':
  workflow_run:
    workflows:
    - Verify ArtHello v52 release
    types:
    - completed
    branches:
    - main
permissions:
  actions: read
  contents: read
  deployments: read
  pull-requests: read
concurrency:
  group: gateway-38-55-arthello-production
  cancel-in-progress: false
  queue: max
env:
  EXPECTED_REPOSITORY: vitaliyozolin-dotcom/ArtHello-OS
  EXPECTED_RELEASE_HEAD: codex/school-arthello-recovery-r5-20260908
  EXPECTED_RELEASE_PR: '360'
  PREVIOUS_RELEASE_SHA: ce7c50ba367fca14d71669305bf4e82b791ce4f7
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
  TRIGGER_VERIFY_RUN_ID: ${{ github.event.workflow_run.id }}
  PUBLIC_URL: https://arthello-188-225-38-55.sslip.io
  PUBLIC_HOST: arthello-188-225-38-55.sslip.io
  SCHOOL_URL: https://school-188-225-38-55.sslip.io
  CADDY_CONTAINER: stroios-caddy-1
  DATA_VOLUME: arthello-direct-v44-data
jobs:
  deploy:
    if: |-
      github.event_name == 'workflow_run' && github.repository == 'vitaliyozolin-dotcom/ArtHello-OS' && github.repository_owner == 'vitaliyozolin-dotcom' && github.event.workflow_run.name == 'Verify ArtHello v52 release' && (
        github.event.workflow_run.path == '.github/workflows/verify-arthello-v52.yml' ||
        github.event.workflow_run.path == '.github/workflows/verify-arthello-v52.yml@main'
      ) && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.repository.full_name == github.repository && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.actor.login == 'vitaliyozolin-dotcom' && github.event.workflow_run.triggering_actor.login == 'vitaliyozolin-dotcom' && github.run_attempt >= 1 && (
        github.event.workflow_run.pull_requests[0] == null ||
        (
          github.event.workflow_run.pull_requests[0].head.ref == 'codex/school-arthello-recovery-r5-20260908' &&
          github.event.workflow_run.pull_requests[0].number == fromJSON('360') &&
          github.event.workflow_run.pull_requests[0].head.repo.id == github.event.repository.id &&
          github.event.workflow_run.pull_requests[0].base.ref == 'main' &&
          github.event.workflow_run.pull_requests[0].base.repo.id == github.event.repository.id &&
          github.event.workflow_run.pull_requests[1] == null
        )
      )
    runs-on:
    - self-hosted
    - linux
    - x64
    - arthello-gateway
    timeout-minutes: 240
    environment: production-ru
    concurrency:
      group: school-1-11-production
      cancel-in-progress: false
      queue: max
    steps:
    - name: Verify D067 R5 identity and safe verified-School resume
      timeout-minutes: 4
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -Eeuo pipefail
        test "$GITHUB_EVENT_NAME" = workflow_run
        test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
        [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
        [[ "$TRIGGER_VERIFY_RUN_ID" =~ ^[0-9]+$ ]]
        [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
        [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
        [[ "$EXPECTED_RELEASE_PR" =~ ^[0-9]+$ ]]
        [[ "$PREVIOUS_RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
        test "$RELEASE_SHA" != "$PREVIOUS_RELEASE_SHA"

        api="https://api.github.com/repos/$GITHUB_REPOSITORY"
        headers=(
          --header "Authorization: Bearer $GH_TOKEN"
          --header "Accept: application/vnd.github+json"
          --header "X-GitHub-Api-Version: 2022-11-28"
        )
        trigger_json="$(curl --fail-with-body --silent --show-error --max-time 30 \
          "${headers[@]}" "$api/actions/runs/$TRIGGER_VERIFY_RUN_ID")"
        jq -e \
          --argjson run_id "$TRIGGER_VERIFY_RUN_ID" \
          --arg sha "$RELEASE_SHA" \
          --arg repository "$EXPECTED_REPOSITORY" '
            .id == $run_id and
            .name == "Verify ArtHello v52 release" and
            (.path == ".github/workflows/verify-arthello-v52.yml" or
             .path == ".github/workflows/verify-arthello-v52.yml@main") and
            .event == "push" and
            .head_branch == "main" and
            .head_sha == $sha and
            .run_attempt == 1 and
            .status == "completed" and
            .conclusion == "success" and
            .repository.full_name == $repository and
            .head_repository.full_name == $repository and
            .actor.login == "vitaliyozolin-dotcom" and
            .triggering_actor.login == "vitaliyozolin-dotcom"
          ' <<<"$trigger_json" >/dev/null

        release_pr_json="$(curl --fail-with-body --silent --show-error --max-time 30 \
          "${headers[@]}" "$api/pulls/$EXPECTED_RELEASE_PR")"
        jq -e \
          --arg sha "$RELEASE_SHA" \
          --arg repository "$EXPECTED_REPOSITORY" \
          --arg expected_head "$EXPECTED_RELEASE_HEAD" \
          --argjson expected_pr "$EXPECTED_RELEASE_PR" '
            .number == $expected_pr and
            .state == "closed" and
            .merged == true and
            .merged_at != null and
            .base.ref == "main" and
            .base.repo.full_name == $repository and
            .head.ref == $expected_head and
            .head.repo.full_name == $repository and
            .merge_commit_sha == $sha and
            .user.login == "vitaliyozolin-dotcom" and
            .merged_by.login == "vitaliyozolin-dotcom"
          ' <<<"$release_pr_json" >/dev/null

        python3 -I - <<'D067_REPLAY'
        import json, os, urllib.request

        def safe_previous_job(job):
            if job.get('status') != 'completed':
                return False
            if job.get('conclusion') == 'skipped' and not job.get('steps'):
                return True
            cutovers = [step for step in job.get('steps', []) if step.get('name') == 'Clone preflight and guarded production cutover']
            repairs = [step for step in job.get('steps', []) if step.get('name') == 'Repair School egress configuration with durable receipt']
            # No ArtHello cutover may have started. A completed School repair can resume
            # only through the remote script's exact verified-config read-only path.
            # A failed/cancelled/ambiguous repair is deliberately not auto-replayed.
            return (len(cutovers) == 1 and cutovers[0].get('conclusion') == 'skipped' and
                    len(repairs) == 1 and repairs[0].get('conclusion') in ('success', 'skipped'))

        def run():
            repository = os.environ['EXPECTED_REPOSITORY']
            release = os.environ['RELEASE_SHA']
            current_run = int(os.environ['GITHUB_RUN_ID'])
            current_attempt = int(os.environ['GITHUB_RUN_ATTEMPT'])
            api = 'https://api.github.com/repos/' + repository
            def get(path):
                request = urllib.request.Request(api + path, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
                with urllib.request.urlopen(request, timeout=30) as response:
                    return json.load(response)
            runs = get('/actions/workflows/deploy-arthello-recovery-r5-20260908.yml/runs?event=workflow_run&head_sha=' + release + '&per_page=100')
            assert runs['total_count'] == len(runs['workflow_runs']), 'Replay history pagination incomplete'
            assert 1 <= current_attempt <= 50
            for previous in runs['workflow_runs']:
                assert previous['head_sha'] == release and previous['repository']['full_name'] == repository
                assert previous['path'].split('@')[0] == '.github/workflows/deploy-arthello-recovery-r5-20260908.yml'
                attempt_count = int(previous['run_attempt'])
                assert 1 <= attempt_count <= 50
                if previous['id'] == current_run:
                    assert attempt_count == current_attempt
                    attempts = range(1, current_attempt)
                else:
                    assert previous['status'] == 'completed', 'Another release run is active'
                    assert previous['conclusion'] in ['failure', 'cancelled', 'skipped'], 'Successful or ambiguous release cannot be replayed'
                    attempts = range(1, attempt_count + 1)
                for attempt in attempts:
                    jobs = get('/actions/runs/' + str(previous['id']) + '/attempts/' + str(attempt) + '/jobs?per_page=100')
                    assert jobs['total_count'] == len(jobs['jobs']), 'Attempt jobs pagination incomplete'
                    assert len(jobs['jobs']) <= 1
                    for job in jobs['jobs']:
                        assert job['name'] == 'deploy' and job['run_attempt'] == attempt
                        assert safe_previous_job(job), 'A previous cutover started or its absence cannot be proven'
            print('ARTHELLO_D067_REPLAY_BOUNDARY=VERIFIED')

        if __name__ == '__main__':
            run()

        D067_REPLAY

        # GitHub evaluates the protected Environment before starting this job.
        # Its configuration is enforced by the platform and statically pinned
        # by the hosted verification workflow; GITHUB_TOKEN does not need
        # repository-administration permission to re-read that configuration.
        printf 'ARTHELLO_PRODUCTION_AUTHORIZATION=PLATFORM_ENVIRONMENT\n'
    - name: Wait for exact main Quality Proof and v52 verification
      id: provenance
      timeout-minutes: 28
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -Eeuo pipefail
        api="https://api.github.com/repos/$GITHUB_REPOSITORY"
        headers=(
          --header "Authorization: Bearer $GH_TOKEN"
          --header "Accept: application/vnd.github+json"
          --header "X-GitHub-Api-Version: 2022-11-28"
        )

        ref_json="$(curl --fail-with-body --silent --show-error --max-time 30 \
          "${headers[@]}" "$api/git/ref/heads/main")"
        test "$(jq -r '.object.sha' <<<"$ref_json")" = "$RELEASE_SHA"

        commit_json="$(curl --fail-with-body --silent --show-error --max-time 30 \
          "${headers[@]}" "$api/commits/$RELEASE_SHA")"
        jq -e \
          --arg sha "$RELEASE_SHA" \
          --arg previous_sha "$PREVIOUS_RELEASE_SHA" \
          '.sha == $sha and
           .commit.verification.verified == true and
           (.parents | length) == 1 and
           .parents[0].sha == $previous_sha' <<<"$commit_json" >/dev/null
        tree_sha="$(jq -r '.commit.tree.sha' <<<"$commit_json")"
        [[ "$tree_sha" =~ ^[a-f0-9]{40}$ ]]

        release_pr_json="$(curl --fail-with-body --silent --show-error --max-time 30 \
          "${headers[@]}" "$api/pulls/$EXPECTED_RELEASE_PR")"
        jq -e \
          --arg sha "$RELEASE_SHA" \
          --arg repository "$EXPECTED_REPOSITORY" \
          --arg expected_head "$EXPECTED_RELEASE_HEAD" \
          --argjson expected_pr "$EXPECTED_RELEASE_PR" \
          '.number == $expected_pr and
           .state == "closed" and
           .merged == true and
           .merged_at != null and
           .base.ref == "main" and
           .base.repo.full_name == $repository and
           .head.ref == $expected_head and
           .head.repo.full_name == $repository and
           .merge_commit_sha == $sha and
           .user.login == "vitaliyozolin-dotcom" and
           .merged_by.login == "vitaliyozolin-dotcom"' <<<"$release_pr_json" >/dev/null

        workflow_success() {
          local workflow_file="$1"
          local workflow_name="$2"
          local required_jobs_csv="$3"
          local expected_run_id="${4:-}"
          local runs_json run_json run_id jobs_json
          runs_json="$(curl --fail-with-body --silent --show-error --max-time 30 \
            "${headers[@]}" \
            "$api/actions/workflows/$workflow_file/runs?branch=main&event=push&head_sha=$RELEASE_SHA&per_page=20")" || return 1
          run_json="$(jq -c \
            --arg sha "$RELEASE_SHA" \
            --arg name "$workflow_name" \
            --arg path ".github/workflows/$workflow_file" \
            --arg repository "$EXPECTED_REPOSITORY" \
            '[.workflow_runs[] | select(
              .head_sha == $sha and
              .head_branch == "main" and
              .event == "push" and
              .name == $name and
              (.path == $path or .path == ($path + "@main")) and
              .repository.full_name == $repository
            )] | sort_by(.id) | last // empty' <<<"$runs_json")"
          test -n "$run_json" || return 1
          jq -e '.run_attempt == 1 and .status == "completed" and .conclusion == "success"' <<<"$run_json" >/dev/null || return 1
          run_id="$(jq -r '.id' <<<"$run_json")"
          [[ "$run_id" =~ ^[0-9]+$ ]] || return 1
          if [ -n "$expected_run_id" ]; then test "$run_id" = "$expected_run_id" || return 1; fi
          jobs_json="$(curl --fail-with-body --silent --show-error --max-time 30 \
            "${headers[@]}" "$api/actions/runs/$run_id/jobs?per_page=100")" || return 1
          jq -e --arg sha "$RELEASE_SHA" --argjson run "$run_id" '
          .total_count == (.jobs | length) and
          all(.jobs[]; .head_sha == $sha and .run_id == $run and .run_attempt == 1 and
            .status == "completed" and .conclusion == "success" and
            .labels == ["ubuntu-latest"] and .runner_group_name == "GitHub Actions")
        ' <<<"$jobs_json" >/dev/null || return 1
        IFS=',' read -r -a required_jobs <<<"$required_jobs_csv"
          for required_job in "${required_jobs[@]}"; do
            jq -e --arg name "$required_job" \
              '[.jobs[] | select(.name == $name and .status == "completed" and .conclusion == "success")] | length == 1' \
              <<<"$jobs_json" >/dev/null || return 1
          done
          printf '%s' "$run_id"
        }

        quality_run=""
        verify_run=""
        proof_run=""
        for attempt in $(seq 1 100); do
          if [ -z "$quality_run" ]; then
            quality_run="$(workflow_success quality.yml 'Quality gates' 'secret-scan,test' || true)"
          fi
          if [ -z "$verify_run" ]; then
            verify_run="$(workflow_success verify-arthello-v52.yml 'Verify ArtHello v52 release' 'verify-v52' "$TRIGGER_VERIFY_RUN_ID" || true)"
          fi
          if [ -z "$proof_run" ]; then
            proof_run="$(workflow_success proof-gates.yml 'ArtHello Proof Gates' 'prove' || true)"
          fi
          if [ -n "$quality_run" ] && [ -n "$verify_run" ] && [ -n "$proof_run" ]; then
            break
          fi
          sleep 15
        done
        test -n "$quality_run"
        test -n "$verify_run"
        test -n "$proof_run"

        ref_json="$(curl --fail-with-body --silent --show-error --max-time 30 \
          "${headers[@]}" "$api/git/ref/heads/main")"
        test "$(jq -r '.object.sha' <<<"$ref_json")" = "$RELEASE_SHA"

        printf 'tree_sha=%s\nquality_run=%s\nverify_run=%s\nproof_run=%s\n' \
          "$tree_sha" "$quality_run" "$verify_run" "$proof_run" >> "$GITHUB_OUTPUT"
        printf 'ARTHELLO_EXACT_SHA_GATES=VERIFIED\n'
    - name: Check out exact verified release
      timeout-minutes: 3
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event.workflow_run.head_sha }}
        fetch-depth: 1
        clean: true
        persist-credentials: false
    - name: Verify checkout and release contracts
      timeout-minutes: 4
      env:
        EXPECTED_TREE: ${{ steps.provenance.outputs.tree_sha }}
      run: |
        set -Eeuo pipefail
        test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
        test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
        test -s deploy/v52/Dockerfile
        test -s deploy/v52/maintenance/image-runtime-fingerprint.jq
        test -s deploy/v52/certificates/russian-trusted-root-ca.pem
        echo 'aa800ef345422d6158c6fafe1c06c429dbda21c3df4bb1ccb45a920ec1111399  deploy/v52/certificates/russian-trusted-root-ca.pem' | sha256sum -c -
        jq -n -f deploy/v52/maintenance/image-runtime-fingerprint.jq >/dev/null
        python3 -m py_compile deploy/v52/maintenance/production-data-inventory.py
        grep -F 'ARTHELLO_BOOTSTRAP_PASSWORD_FILE' deploy/v52/overrides/production/runtime-server.mjs >/dev/null
        grep -F 'ARTHELLO_PUBLIC_ORIGIN' deploy/v52/overrides/production/runtime-server.mjs >/dev/null
        grep -F 'cf: false' deploy/v52/overrides/production/runtime-server.mjs >/dev/null
        grep -F 'INTEGRATION_CREDENTIALS_KEY_FILE' deploy/v52/overrides/production/runtime-server.mjs >/dev/null
        grep -F 'INTEGRATION_CREDENTIALS_KEY' deploy/v52/overrides/production/runtime-server.mjs >/dev/null
        grep -F 'CENTRAL_ACCESS_SECRET_FILE' deploy/v52/overrides/production/runtime-server.mjs >/dev/null
        grep -F 'OPENAI_API_KEY_FILE' deploy/v52/overrides/production/runtime-server.mjs >/dev/null
        grep -F 'SCHOOL_PUBLIC_ORIGIN' deploy/v52/overrides/production/runtime-server.mjs >/dev/null
        grep -F 'SCHOOL_DIARY_SYNC_URL' deploy/v52/overrides/production/runtime-server.mjs >/dev/null
        grep -F 'SCHOOL_DIARY_ALLOWED_ORIGINS' deploy/v52/overrides/production/runtime-server.mjs >/dev/null
        grep -F 'OPENAI_OCR_MODEL' deploy/v52/overrides/production/runtime-server.mjs >/dev/null
        grep -F 'TBANK_EGRESS_IP' deploy/v52/overrides/production/runtime-server.mjs >/dev/null
        grep -F 'serviceBindings: { TOCHKA_TRANSPORT: createTochkaTransport(), BACKUP_TRANSPORT: createBackupTransport() }' deploy/v52/overrides/production/runtime-server.mjs >/dev/null
        grep -F 'return transport.fetch(input, { ...init, redirect: "manual" });' deploy/v52/overrides/app/api/integration-actions/route.ts >/dev/null
        test -s deploy/v52/overrides/production/tochka-transport.mjs
        grep -F 'const responseBody = await readBoundedResponseBody(upstream);' deploy/v52/overrides/production/tochka-transport.mjs >/dev/null
        grep -F 'workerd reaches the Node service binding through its supported internal redirect mode' deploy/v52/overrides/tests/tochka-node-transport.test.mjs >/dev/null
        grep -F 'COPY --from=application /app/production/tochka-transport.mjs /app/production/tochka-transport.mjs' deploy/v52/Dockerfile >/dev/null
        grep -F 'NODE_EXTRA_CA_CERTS=/app/production/russian-trusted-root-ca.pem' deploy/v52/Dockerfile >/dev/null
        if grep -E 'CENTRAL_ACCESS_SECRET:[[:space:]]*process\.env\.CENTRAL_ACCESS_SECRET([[:space:],}]|$)' deploy/v52/overrides/production/runtime-server.mjs; then
          echo 'Plaintext central access secret binding is forbidden' >&2
          exit 1
        fi
        if grep -E 'OPENAI_API_KEY:[[:space:]]*process\.env\.OPENAI_API_KEY([[:space:],}]|$)' deploy/v52/overrides/production/runtime-server.mjs; then
          echo 'Plaintext OpenAI key binding is forbidden' >&2
          exit 1
        fi
        printf 'ARTHELLO_CHECKOUT=%s\nARTHELLO_TREE=%s\n' "$RELEASE_SHA" "$EXPECTED_TREE"
    - name: Repair School egress configuration with durable receipt
      timeout-minutes: 20
      shell: bash
      env:
        SSH_PRIVATE_KEY: ${{ secrets.ARTHELLO_RU_SSH_PRIVATE_KEY }}
        DEPLOY_HOST: ${{ secrets.ARTHELLO_RU_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.ARTHELLO_RU_DEPLOY_USER }}
        DEPLOY_PORT: ${{ secrets.ARTHELLO_RU_DEPLOY_PORT }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -Eeuo pipefail
        umask 077
        : "${SSH_PRIVATE_KEY:?missing protected School SSH key}"
        : "${DEPLOY_HOST:?missing protected School deploy host}"
        : "${DEPLOY_USER:?missing protected School deploy user}"
        [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]{0,252}$ ]]
        [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]]
        deploy_port="${DEPLOY_PORT:-2222}"
        [[ "$deploy_port" =~ ^[0-9]{1,5}$ ]]
        test "$deploy_port" -ge 1
        test "$deploy_port" -le 65535

        ssh_dir="$RUNNER_TEMP/arthello-school-sync-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        case "$ssh_dir" in
          "$RUNNER_TEMP"/arthello-school-sync-*) ;;
          *) echo 'Unsafe School SSH work path' >&2; exit 1 ;;
        esac
        cleanup_school_ssh() {
          rm -f -- \
            "$ssh_dir/id_ed25519" \
            "$ssh_dir/known_hosts" \
            "$ssh_dir/known_hosts.scan" \
            "$ssh_dir/school-sync-probe-wrong.json" \
            "$ssh_dir/school-sync-probe-wrong.headers" \
            "$ssh_dir/school-sync-probe.json" \
            "$ssh_dir/school-sync-probe.headers" \
            >/dev/null 2>&1 || true
          rmdir -- "$ssh_dir" >/dev/null 2>&1 || true
        }
        trap cleanup_school_ssh EXIT
        trap 'exit 130' INT
        trap 'exit 143' TERM
        trap 'exit 129' HUP
        test ! -e "$ssh_dir"
        test ! -L "$ssh_dir"
        install -m 0700 -d "$ssh_dir"
        printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_dir/id_ed25519"
        unset SSH_PRIVATE_KEY
        chmod 0600 "$ssh_dir/id_ed25519"
        ssh-keygen -y -f "$ssh_dir/id_ed25519" >/dev/null

        scan="$ssh_dir/known_hosts.scan"
        : > "$scan"
        chmod 0600 "$scan"
        for attempt in 1 2 3; do
          timeout --signal=TERM --kill-after=5s 150s \
            ssh -p "$deploy_port" \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile="$scan" \
              -o GlobalKnownHostsFile=/dev/null \
              -o PreferredAuthentications=none \
              -o PubkeyAuthentication=no \
              -o PasswordAuthentication=no \
              -o KbdInteractiveAuthentication=no \
              -o ConnectTimeout=140 \
              -o HostKeyAlgorithms=ssh-ed25519 \
              "$DEPLOY_USER@$DEPLOY_HOST" true \
              </dev/null >/dev/null 2>&1 || true
          test -s "$scan" && break
          sleep 5
        done
        test -s "$scan"
        fingerprint="$(ssh-keygen -lf "$scan" -E sha256 | awk '{print $2; exit}')"
        test "$fingerprint" = 'SHA256:/kBNohTF+5g8U+jQt+PzOCoWZ9yCSFjBnEP3Oc3MwRI'
        mv "$scan" "$ssh_dir/known_hosts"

        ssh_options=(
          -T
          -p "$deploy_port"
          -i "$ssh_dir/id_ed25519"
          -o IdentitiesOnly=yes
          -o PreferredAuthentications=publickey
          -o PasswordAuthentication=no
          -o KbdInteractiveAuthentication=no
          -o BatchMode=yes
          -o StrictHostKeyChecking=yes
          -o UserKnownHostsFile="$ssh_dir/known_hosts"
          -o GlobalKnownHostsFile=/dev/null
          -o ConnectTimeout=140
          -o ServerAliveInterval=10
          -o ServerAliveCountMax=30
          -o IPQoS=none
          -o Compression=no
          -o KexAlgorithms=curve25519-sha256
          -o HostKeyAlgorithms=ssh-ed25519
          -o PubkeyAcceptedAlgorithms=ssh-ed25519
          -o Ciphers=aes128-ctr
          -o MACs=hmac-sha2-256
        )
        timeout --signal=TERM --kill-after=5s 180s \
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" true \
          </dev/null >/dev/null

        # This is reviewed configuration repair only. There is no application build,
        # School recreation, database mount or secret propagation into the relay.
        umask 077
        repair_bundle_file="$RUNNER_TEMP/school-r3-bundle-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
        repair_receipt_file="$RUNNER_TEMP/school-r3-receipt-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
        repair_bundle_meta="$RUNNER_TEMP/school-r3-bundle-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.meta"
        REPAIR_BUNDLE_FILE="$repair_bundle_file" python3 -I - <<'PY_BUNDLE' > "$repair_bundle_meta"
        import base64
        import hashlib
        import json
        import os
        from pathlib import Path
        import stat

        root=Path('deploy/school/sso-relay-r5')
        files={}
        for name in ('manifest.json','repair.py','relay.mjs','healthcheck.mjs'):
            path=root/name
            assert stat.S_ISREG(path.lstat().st_mode) and not path.is_symlink()
            data=path.read_bytes()
            assert 0 < len(data) <= 262144
            files[name]=base64.b64encode(data).decode('ascii')
        manifest=json.loads(base64.b64decode(files['manifest.json']))
        config=hashlib.sha256(json.dumps(manifest,sort_keys=True,separators=(',',':')).encode('utf-8')).hexdigest()
        raw=json.dumps({'schemaVersion':1,'files':files},sort_keys=True,separators=(',',':')).encode('utf-8')
        assert len(raw)<=1048576
        path=Path(os.environ['REPAIR_BUNDLE_FILE'])
        fd=os.open(path,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)
        with os.fdopen(fd,'wb') as stream:
            stream.write(raw)
            stream.flush()
            os.fsync(stream.fileno())
        print(config)
        print(hashlib.sha256(raw).hexdigest())
        PY_BUNDLE
        mapfile -t repair_digests < "$repair_bundle_meta"
        test "${#repair_digests[@]}" -eq 2
        repair_config_sha256="${repair_digests[0]}"
        repair_bundle_sha256="${repair_digests[1]}"
        [[ "$repair_config_sha256" =~ ^[a-f0-9]{64}$ ]]
        [[ "$repair_bundle_sha256" =~ ^[a-f0-9]{64}$ ]]
        [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
        [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
        [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,2}$ ]]
        bootstrap_base64="$(base64 -w0 .github/scripts/r4-school-repair-remote.py)"
        [[ "$bootstrap_base64" =~ ^[A-Za-z0-9+/=]+$ ]]
        # Public identities and a reviewed bootstrap are the only remote environment.
        # Bundle bytes use stdin, stay below the fixed size cap, and are hash checked
        # before any trusted repair source can execute on the School host.
        # Recheck current main immediately before the only mutating School SSH call.
        current_main="$(curl --fail-with-body --silent --show-error --max-time 30 \
          --header "Authorization: Bearer $GH_TOKEN" \
          --header 'Accept: application/vnd.github+json' \
          --header 'X-GitHub-Api-Version: 2022-11-28' \
          "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" | jq -er '.object.sha')"
        test "$current_main" = "$RELEASE_SHA"
        timeout --signal=TERM --kill-after=15s 720s \
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
          "RELEASE_SHA='$RELEASE_SHA' RELEASE_RUN_ID='$GITHUB_RUN_ID' RELEASE_ATTEMPT='$GITHUB_RUN_ATTEMPT' EXPECTED_REPAIR_CONFIG_SHA256='$repair_config_sha256' EXPECTED_REPAIR_BUNDLE_SHA256='$repair_bundle_sha256' R4_BOOTSTRAP_BASE64='$bootstrap_base64' python3 -I -c 'import base64,os; exec(base64.b64decode(os.environ[\"R4_BOOTSTRAP_BASE64\"]))'" \
          < "$repair_bundle_file" | tee "$repair_receipt_file"
        SCHOOL_REPAIR_CONFIG_SHA256="$repair_config_sha256" \
          python3 -I .github/scripts/check-school-repair-receipt-r3.py \
            --manifest deploy/school/sso-relay-r5/manifest.json \
            --receipt "$repair_receipt_file"
        printf 'config_sha256=%s\n' "$repair_config_sha256" >> "$GITHUB_OUTPUT"
        rm -f -- "$repair_bundle_file" "$repair_bundle_meta"
      id: school_repair
    - name: Read-only School diagnostic and real browser acceptance
      timeout-minutes: 15
      shell: bash
      env:
        SSH_PRIVATE_KEY: ${{ secrets.ARTHELLO_RU_SSH_PRIVATE_KEY }}
        DEPLOY_HOST: ${{ secrets.ARTHELLO_RU_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.ARTHELLO_RU_DEPLOY_USER }}
        DEPLOY_PORT: ${{ secrets.ARTHELLO_RU_DEPLOY_PORT }}
        GH_TOKEN: ${{ github.token }}
        SCHOOL_REPAIR_CONFIG_SHA256: ${{ steps.school_repair.outputs.config_sha256 }}
        SCHOOL_REPAIR_RECEIPT_FILE: ${{ runner.temp }}/school-r3-receipt-${{ github.run_id }}-${{ github.run_attempt }}.json
      run: |+
        set -Eeuo pipefail
        umask 077
        : "${SSH_PRIVATE_KEY:?missing protected School SSH key}"
        : "${DEPLOY_HOST:?missing protected School deploy host}"
        : "${DEPLOY_USER:?missing protected School deploy user}"
        [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]{0,252}$ ]]
        [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]]
        deploy_port="${DEPLOY_PORT:-2222}"
        [[ "$deploy_port" =~ ^[0-9]{1,5}$ ]]
        test "$deploy_port" -ge 1
        test "$deploy_port" -le 65535

        ssh_dir="$RUNNER_TEMP/arthello-school-sync-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        case "$ssh_dir" in
          "$RUNNER_TEMP"/arthello-school-sync-*) ;;
          *) echo 'Unsafe School SSH work path' >&2; exit 1 ;;
        esac
        cleanup_school_ssh() {
          rm -f -- \
            "$ssh_dir/id_ed25519" \
            "$ssh_dir/known_hosts" \
            "$ssh_dir/known_hosts.scan" \
            "$ssh_dir/school-sync-probe-wrong.json" \
            "$ssh_dir/school-sync-probe-wrong.headers" \
            "$ssh_dir/school-sync-probe.json" \
            "$ssh_dir/school-sync-probe.headers" \
            >/dev/null 2>&1 || true
          rmdir -- "$ssh_dir" >/dev/null 2>&1 || true
        }
        trap cleanup_school_ssh EXIT
        trap 'exit 130' INT
        trap 'exit 143' TERM
        trap 'exit 129' HUP
        test ! -e "$ssh_dir"
        test ! -L "$ssh_dir"
        install -m 0700 -d "$ssh_dir"
        printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_dir/id_ed25519"
        unset SSH_PRIVATE_KEY
        chmod 0600 "$ssh_dir/id_ed25519"
        ssh-keygen -y -f "$ssh_dir/id_ed25519" >/dev/null

        scan="$ssh_dir/known_hosts.scan"
        : > "$scan"
        chmod 0600 "$scan"
        for attempt in 1 2 3; do
          timeout --signal=TERM --kill-after=5s 150s \
            ssh -p "$deploy_port" \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile="$scan" \
              -o GlobalKnownHostsFile=/dev/null \
              -o PreferredAuthentications=none \
              -o PubkeyAuthentication=no \
              -o PasswordAuthentication=no \
              -o KbdInteractiveAuthentication=no \
              -o ConnectTimeout=140 \
              -o HostKeyAlgorithms=ssh-ed25519 \
              "$DEPLOY_USER@$DEPLOY_HOST" true \
              </dev/null >/dev/null 2>&1 || true
          test -s "$scan" && break
          sleep 5
        done
        test -s "$scan"
        fingerprint="$(ssh-keygen -lf "$scan" -E sha256 | awk '{print $2; exit}')"
        test "$fingerprint" = 'SHA256:/kBNohTF+5g8U+jQt+PzOCoWZ9yCSFjBnEP3Oc3MwRI'
        mv "$scan" "$ssh_dir/known_hosts"

        ssh_options=(
          -T
          -p "$deploy_port"
          -i "$ssh_dir/id_ed25519"
          -o IdentitiesOnly=yes
          -o PreferredAuthentications=publickey
          -o PasswordAuthentication=no
          -o KbdInteractiveAuthentication=no
          -o BatchMode=yes
          -o StrictHostKeyChecking=yes
          -o UserKnownHostsFile="$ssh_dir/known_hosts"
          -o GlobalKnownHostsFile=/dev/null
          -o ConnectTimeout=140
          -o ServerAliveInterval=10
          -o ServerAliveCountMax=30
          -o IPQoS=none
          -o Compression=no
          -o KexAlgorithms=curve25519-sha256
          -o HostKeyAlgorithms=ssh-ed25519
          -o PubkeyAcceptedAlgorithms=ssh-ed25519
          -o Ciphers=aes128-ctr
          -o MACs=hmac-sha2-256
        )
        timeout --signal=TERM --kill-after=5s 180s \
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" true \
          </dev/null >/dev/null

        diagnostic_file="$RUNNER_TEMP/arthello-school-sso-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.jsonl"
        test -s .github/scripts/school-sso-readonly-diagnostic.sh
        bash .github/scripts/school-sso-readonly-diagnostic.sh --self-test
        diagnostic_payload="$(base64 -w0 .github/scripts/school-sso-readonly-diagnostic.sh)"
        timeout --signal=TERM --kill-after=5s 180s \
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
          "printf '%s' '$diagnostic_payload' | base64 -d | bash" \
          </dev/null | tee "$diagnostic_file"
        legacy_probe_payload="$(base64 -w0 .github/scripts/r2-alfacrm-env-presence.sh)"
        timeout --signal=TERM --kill-after=5s 60s   ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST"   "printf '%s' '$legacy_probe_payload' | base64 -d | bash -s -- --school-legacy"   </dev/null
        mapfile -t acceptance_live_ids < <(docker ps --filter 'name=^/arthello-direct-' --format '{{.ID}}')
        test "${#acceptance_live_ids[@]}" -eq 1
        observed_arthello_sha="$(docker inspect "${acceptance_live_ids[0]}" --format '{{index .Config.Labels "arthello.release.sha"}}')"
        [[ "$observed_arthello_sha" =~ ^[a-f0-9]{40}$ ]]
        bash .github/scripts/r2-alfacrm-env-presence.sh --current-arthello "${acceptance_live_ids[0]}"

        SCHOOL_DIAGNOSTIC_FILE="$diagnostic_file" OBSERVED_LIVE_ARTHELLO_SHA="$observed_arthello_sha" \
          python3 -I .github/scripts/check-school-live-acceptance-r5.py

    - name: Download and load exact hosted-verified image
      timeout-minutes: 25
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: arthello-v52-verification-${{ env.TRIGGER_VERIFY_RUN_ID }}
        path: ${{ runner.temp }}/arthello-v52-release-${{ github.run_id }}
        github-token: ${{ github.token }}
        run-id: ${{ env.TRIGGER_VERIFY_RUN_ID }}
    - name: Verify and load exact hosted-verified image
      id: image_import
      timeout-minutes: 12
      env:
        EXPECTED_TREE: ${{ steps.provenance.outputs.tree_sha }}
      run: |
        set -Eeuo pipefail
        artifact="$RUNNER_TEMP/arthello-v52-release-$GITHUB_RUN_ID"
        evidence="$artifact/arthello-v52.json"
        archive="$artifact/arthello-v52-image.tar.gz"
        test -f "$evidence"
        test -f "$evidence.sha256"
        test -s "$archive"
        (cd "$artifact" && sha256sum -c arthello-v52.json.sha256)

        dockerfile_sha256="$(sha256sum deploy/v52/Dockerfile | cut -d ' ' -f 1)"
        runtime_lock_sha256="$(sha256sum deploy/v52/runtime/package-lock.json | cut -d ' ' -f 1)"
        inventory_sha256="$(sha256sum deploy/v52/maintenance/production-data-inventory.py | cut -d ' ' -f 1)"
        tochka_ca_sha256="$(sha256sum deploy/v52/certificates/russian-trusted-root-ca.pem | cut -d ' ' -f 1)"
        fingerprint_filter_sha256="$(sha256sum deploy/v52/maintenance/image-runtime-fingerprint.jq | cut -d ' ' -f 1)"
        archive_sha256="$(sha256sum "$archive" | cut -d ' ' -f 1)"
        jq -e \
          --arg repository "$EXPECTED_REPOSITORY" \
          --arg run "$TRIGGER_VERIFY_RUN_ID" \
          --arg sha "$RELEASE_SHA" \
          --arg tree "$EXPECTED_TREE" \
          --arg dockerfile "$dockerfile_sha256" \
          --arg lock "$runtime_lock_sha256" \
          --arg inventory "$inventory_sha256" \
          --arg tochka_ca "$tochka_ca_sha256" \
          --arg fingerprint_filter "$fingerprint_filter_sha256" \
          --arg archive "$archive_sha256" '
            .repository == $repository and
            .workflowRunId == $run and
            .workflowRunAttempt == "1" and
            .headSha == $sha and
            .treeSha == $tree and
            .dockerfileSha256 == $dockerfile and
            .runtimeLockSha256 == $lock and
            .inventorySha256 == $inventory and
            .tochkaCaSha256 == $tochka_ca and
            .fingerprintFilterSha256 == $fingerprint_filter and
            .imageArchiveSha256 == $archive and
            .runnerTrust == "github-hosted-ephemeral" and
            .productionCapability == false and
            (.runtimeFingerprintSha256 | test("^[a-f0-9]{64}$")) and
            (.imageId | test("^sha256:[a-f0-9]{64}$"))
          ' "$evidence" >/dev/null

        printf 'ARTHELLO_IMAGE_EVIDENCE=VERIFIED archive_sha256=%s\n' "$archive_sha256"
        gzip -t "$archive"
        docker_server_version="$(docker version --format '{{.Server.Version}}')"
        docker_root="$(docker info --format '{{.DockerRootDir}}')"
        test -n "$docker_server_version"
        test -d "$docker_root"
        available_kib="$(df -Pk "$docker_root" | awk 'NR == 2 { print $4 }')"
        [[ "$available_kib" =~ ^[0-9]+$ ]]
        printf 'ARTHELLO_DOCKER_PREFLIGHT=VERIFIED server_version=%s available_kib=%s\n' \
          "$docker_server_version" "$available_kib"

        verified_image="arthello-v52-verify:$RELEASE_SHA"
        image="arthello-direct:$RELEASE_SHA"
        while IFS='|' read -r repository tag image_id; do
          case "$repository" in
            arthello-direct|arthello-v52-verify) ;;
            *) continue ;;
          esac
          test "$tag" != '<none>' || continue
          ref="$repository:$tag"
          case "$ref" in
            "$verified_image"|"$image") continue ;;
          esac
          if [ -n "$(docker ps -aq --filter "ancestor=$image_id")" ]; then
            printf 'ARTHELLO_IMAGE_PRESERVED ref=%s reason=container-reference\n' "$ref"
            continue
          fi
          docker image rm "$ref"
          printf 'ARTHELLO_STALE_IMAGE_REMOVED ref=%s\n' "$ref"
        done < <(docker image ls --no-trunc --format '{{.Repository}}|{{.Tag}}|{{.ID}}')

        load_log="$RUNNER_TEMP/arthello-docker-load-$GITHUB_RUN_ID.log"
        if ! docker image load --input "$archive" >"$load_log" 2>&1; then
          sed -n '1,240p' "$load_log" >&2
          printf '::error::Docker rejected the verified image archive before production cutover\n'
          df -h "$docker_root" || true
          docker system df || true
          exit 1
        fi
        sed -n '1,120p' "$load_log"
        printf 'ARTHELLO_IMAGE_IMPORT=COMPLETE\n'
        expected_image_id="$(jq -r '.imageId' "$evidence")"
        actual_image_id="$(docker image inspect "$verified_image" --format '{{.Id}}')"
        [[ "$actual_image_id" =~ ^sha256:[a-f0-9]{64}$ ]]
        expected_runtime_fingerprint="$(jq -r '.runtimeFingerprintSha256' "$evidence")"
        actual_runtime_fingerprint="$(
          docker image inspect "$actual_image_id" \
            | jq -cS -f deploy/v52/maintenance/image-runtime-fingerprint.jq \
            | sha256sum \
            | cut -d ' ' -f 1
        )"
        if [ "$actual_runtime_fingerprint" != "$expected_runtime_fingerprint" ]; then
          printf '::error::Imported image runtime fingerprint does not match hosted evidence\n'
          exit 1
        fi
        printf 'ARTHELLO_IMAGE_ID_REPRESENTATION hosted=%s production=%s\n' \
          "$expected_image_id" "$actual_image_id"
        printf 'ARTHELLO_IMAGE_RUNTIME_FINGERPRINT=VERIFIED sha256=%s\n' \
          "$actual_runtime_fingerprint"
        test "$(docker image inspect "$actual_image_id" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$RELEASE_SHA"
        test "$(docker image inspect "$actual_image_id" --format '{{index .Config.Labels "org.opencontainers.image.source-tree"}}')" = "$EXPECTED_TREE"
        test "$(docker image inspect "$actual_image_id" --format '{{.Config.User}}')" = node
        test "$(docker image inspect "$actual_image_id" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -Fc 'NODE_EXTRA_CA_CERTS=/app/production/russian-trusted-root-ca.pem')" -eq 1
        docker tag "$actual_image_id" "$image"
        test "$(docker image inspect "$image" --format '{{.Id}}')" = "$actual_image_id"
        printf 'image_id=%s\nruntime_fingerprint=%s\n' \
          "$actual_image_id" "$actual_runtime_fingerprint" >> "$GITHUB_OUTPUT"
        printf 'ARTHELLO_HOSTED_IMAGE=VERIFIED image=%s id=%s\n' "$image" "$actual_image_id"
    - name: Resolve authoritative School sync secret
