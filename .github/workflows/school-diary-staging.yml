name: School diary isolated staging

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/school-diary-staging.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: school-diary-staging
  cancel-in-progress: false

env:
  SCHOOL_ORIGIN: https://school-188-225-38-55.sslip.io
  STAGING_ORIGIN: http://127.0.0.1:3211
  STAGING_PORT: "3211"

jobs:
  create-staging:
    runs-on: [self-hosted, linux, x64, arthello-gateway]
    timeout-minutes: 20
    environment: production-ru
    steps:
      - name: Configure confirmed School SSH host
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ARTHELLO_RU_SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.ARTHELLO_RU_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ARTHELLO_RU_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.ARTHELLO_RU_DEPLOY_PORT }}
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 0700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          test -s ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

          deploy_port="${DEPLOY_PORT:-2222}"
          scanned_hosts="$RUNNER_TEMP/school-staging-known-hosts"
          : > "$scanned_hosts"
          chmod 0600 "$scanned_hosts"
          for attempt in 1 2; do
            timeout --signal=TERM --kill-after=5s 150s \
              ssh -p "$deploy_port" \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile="$scanned_hosts" \
              -o GlobalKnownHostsFile=/dev/null \
              -o PreferredAuthentications=none \
              -o PubkeyAuthentication=no \
              -o PasswordAuthentication=no \
              -o KbdInteractiveAuthentication=no \
              -o ConnectTimeout=140 \
              -o HostKeyAlgorithms=ssh-ed25519 \
              "$DEPLOY_USER@$DEPLOY_HOST" true </dev/null >/dev/null 2>&1 || true
            test -s "$scanned_hosts" && break
            sleep 5
          done
          test -s "$scanned_hosts"
          actual_fingerprint="$(ssh-keygen -lf "$scanned_hosts" -E sha256 | awk '{print $2; exit}')"
          test "$actual_fingerprint" = 'SHA256:/kBNohTF+5g8U+jQt+PzOCoWZ9yCSFjBnEP3Oc3MwRI'
          mv "$scanned_hosts" ~/.ssh/known_hosts
          printf 'SCHOOL_STAGING_SSH=VERIFIED\n'

      - name: Create isolated staging from verified backup
        id: staging
        env:
          DEPLOY_HOST: ${{ secrets.ARTHELLO_RU_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ARTHELLO_RU_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.ARTHELLO_RU_DEPLOY_PORT }}
        shell: bash
        run: |
          set -Eeuo pipefail
          deploy_port="${DEPLOY_PORT:-2222}"
          ssh_args=(
            -p "$deploy_port"
            -i ~/.ssh/id_ed25519
            -o IdentitiesOnly=yes
            -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no
            -o KbdInteractiveAuthentication=no
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile=~/.ssh/known_hosts
            -o ConnectTimeout=140
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=12
            -o IPQoS=none
            -o Compression=no
            -o KexAlgorithms=curve25519-sha256
            -o HostKeyAlgorithms=ssh-ed25519
            -o PubkeyAcceptedAlgorithms=ssh-ed25519
            -o Ciphers=aes128-ctr
            -o MACs=hmac-sha2-256
          )
          log_file="$RUNNER_TEMP/school-staging.log"
          timeout --signal=TERM --kill-after=10s 900s \
            ssh -T "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
              "env RUN_ID='$GITHUB_RUN_ID' WORKFLOW_SHA='$GITHUB_SHA' SCHOOL_ORIGIN='$SCHOOL_ORIGIN' STAGING_ORIGIN='$STAGING_ORIGIN' STAGING_PORT='$STAGING_PORT' bash -s" \
              <<'REMOTE' | tee "$log_file"
          set -Eeuo pipefail
          exec 9>/var/lock/school-1-11-staging.lock
          flock -n 9

          production=school-1-11
          staging=school-1-11-staging
          data_volume=school-1-11_staging_data
          staging_backup_volume=school-1-11_staging_backups
          network=school-1-11-staging-internal
          success=0
          container_created=0
          data_created=0
          backup_created=0
          network_created=0

          validate_target() {
            case "$staging:$data_volume:$staging_backup_volume:$network" in
              school-1-11-staging:school-1-11_staging_data:school-1-11_staging_backups:school-1-11-staging-internal) ;;
              *) return 1 ;;
            esac
          }
          validate_target

          cleanup_failed_staging() {
            rc=$?
            trap - EXIT
            if [ "$success" -ne 1 ]; then
              if [ "$container_created" -eq 1 ]; then
                docker rm -f "$staging" >/dev/null 2>&1 || true
              fi
              if [ "$data_created" -eq 1 ]; then
                docker volume rm "$data_volume" >/dev/null 2>&1 || true
              fi
              if [ "$backup_created" -eq 1 ]; then
                docker volume rm "$staging_backup_volume" >/dev/null 2>&1 || true
              fi
              if [ "$network_created" -eq 1 ]; then
                docker network rm "$network" >/dev/null 2>&1 || true
              fi
            fi
            exit "$rc"
          }
          trap cleanup_failed_staging EXIT

          test "$(docker inspect "$production" --format '{{.State.Running}}')" = true
          test "$(docker inspect "$production" --format '{{.State.Health.Status}}')" = healthy
          started_before="$(docker inspect "$production" --format '{{.State.StartedAt}}')"
          image_ref="$(docker inspect "$production" --format '{{.Config.Image}}')"
          image_id="$(docker image inspect "$image_ref" --format '{{.Id}}')"
          production_backup_volume="$(docker inspect "$production" --format '{{range .Mounts}}{{if eq .Destination "/backups"}}{{.Name}}{{end}}{{end}}')"
          test -n "$production_backup_volume"

          if docker inspect "$staging" >/dev/null 2>&1; then
            printf 'Staging container already exists; refusing to overwrite it\n' >&2
            exit 1
          fi
          if docker volume inspect "$data_volume" >/dev/null 2>&1; then
            printf 'Staging data volume already exists; refusing to overwrite it\n' >&2
            exit 1
          fi
          if docker volume inspect "$staging_backup_volume" >/dev/null 2>&1; then
            printf 'Staging backup volume already exists; refusing to overwrite it\n' >&2
            exit 1
          fi
          if docker network inspect "$network" >/dev/null 2>&1; then
            printf 'Staging network already exists; refusing to overwrite it\n' >&2
            exit 1
          fi

          python3 - "$STAGING_PORT" <<'PY'
          import socket, sys
          port = int(sys.argv[1])
          with socket.socket() as sock:
              sock.bind(("127.0.0.1", port))
          PY

          latest="$(docker run --rm --network none \
            -v "$production_backup_volume:/backup:ro" \
            --entrypoint node "$image_ref" -e \
            "const{readFileSync}=require('node:fs');process.stdout.write(readFileSync('/backup/design-system/LATEST','utf8').trim())")"
          case "$latest" in
            design-system/*-run-*) ;;
            *) printf 'Invalid latest backup marker: %s\n' "$latest" >&2; exit 1 ;;
          esac

          docker network create --internal \
            --label school.system=school-1-11 \
            --label school.environment=staging \
            "$network" >/dev/null
          network_created=1
          test "$(docker network inspect "$network" --format '{{.Internal}}')" = true

          docker volume create \
            --label school.system=school-1-11 \
            --label school.environment=staging \
            --label school.purpose=data \
            "$data_volume" >/dev/null
          data_created=1
          docker volume create \
            --label school.system=school-1-11 \
            --label school.environment=staging \
            --label school.purpose=backups \
            "$staging_backup_volume" >/dev/null
          backup_created=1

          docker run --rm -i --network none --user 0:0 \
            -e SOURCE_REL="$latest" \
            -v "$production_backup_volume:/backup:ro" \
            -v "$data_volume:/data" \
            --entrypoint node "$image_ref" --input-type=module - <<'COPY_DATABASE'
          import { chmodSync, copyFileSync } from 'node:fs';
          import { DatabaseSync } from 'node:sqlite';
          const rel = process.env.SOURCE_REL;
          if (!/^design-system\/[0-9]{8}T[0-9]{6}Z-run-[0-9]+$/.test(rel)) throw new Error('Invalid source');
          const source = `/backup/${rel}/database.sqlite`;
          const target = '/data/school-1-11.sqlite';
          copyFileSync(source, target);
          chmodSync(target, 0o666);
          const db = new DatabaseSync(target, { readOnly: true });
          const rows = db.prepare('PRAGMA integrity_check').all();
          if (rows.length !== 1 || rows[0].integrity_check !== 'ok') throw new Error('Staging source integrity failed');
          db.close();
          console.log('SCHOOL_STAGING_DATABASE_COPY=OK');
          COPY_DATABASE

          staging_secret="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          test "${#staging_secret}" -eq 64
          docker run -d \
            --name "$staging" \
            --restart unless-stopped \
            --network "$network" \
            -p "127.0.0.1:$STAGING_PORT:3000" \
            --security-opt no-new-privileges:true \
            --label school.system=school-1-11 \
            --label school.environment=staging \
            --label school.source-backup="$latest" \
            --label school.workflow-sha="$WORKFLOW_SHA" \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e DATABASE_PATH=/data/school-1-11.sqlite \
            -e PUBLIC_APP_ORIGIN="$STAGING_ORIGIN" \
            -e CENTRAL_ACCESS_SECRET="$staging_secret" \
            -v "$data_volume:/data" \
            -v "$staging_backup_volume:/backups" \
            "$image_ref" >/dev/null
          container_created=1

          staging_healthy=0
          for attempt in $(seq 1 90); do
            if curl -fsS --max-time 5 "$STAGING_ORIGIN/api/health" | grep -F '"status":"ok"' >/dev/null; then
              staging_healthy=1
              break
            fi
            if [ "$(docker inspect "$staging" --format '{{.State.Running}}' 2>/dev/null || true)" != true ]; then
              break
            fi
            sleep 2
          done
          if [ "$staging_healthy" -ne 1 ]; then
            docker logs "$staging" --tail 120 >&2 || true
            exit 1
          fi

          docker exec -i "$staging" node --input-type=module - <<'VERIFY_STAGING'
          import { DatabaseSync } from 'node:sqlite';
          const db = new DatabaseSync('/data/school-1-11.sqlite', { readOnly: true });
          const rows = db.prepare('PRAGMA integrity_check').all();
          if (rows.length !== 1 || rows[0].integrity_check !== 'ok') throw new Error('Staging integrity failed');
          const tableCount = db.prepare("SELECT count(*) AS count FROM sqlite_master WHERE type='table'").get().count;
          db.close();
          const health = await fetch('http://127.0.0.1:3000/api/health');
          if (!health.ok || !(await health.text()).includes('"status":"ok"')) throw new Error('Staging health failed');
          const login = await fetch('http://127.0.0.1:3000/login');
          const html = await login.text();
          if (!login.ok || html.length < 1000 || !html.includes('<html')) throw new Error('Staging login failed');
          if (process.env.PUBLIC_APP_ORIGIN !== 'http://127.0.0.1:3211') throw new Error('Staging origin mismatch');
          console.log(`SCHOOL_STAGING_DB=OK tables=${tableCount}`);
          console.log('SCHOOL_STAGING_LOGIN=OK');
          console.log('SCHOOL_STAGING_ORIGIN=OK');
          VERIFY_STAGING

          binding="$(docker inspect "$staging" | python3 -c 'import json,sys; d=json.load(sys.stdin)[0]; b=d["HostConfig"]["PortBindings"]["3000/tcp"][0]; print(b["HostIp"]+":"+b["HostPort"])')"
          test "$binding" = "127.0.0.1:$STAGING_PORT"
          test "$(docker network inspect "$network" --format '{{.Internal}}')" = true

          docker run --rm --network none --user 0:0 \
            -e SOURCE_BACKUP="$latest" \
            -e IMAGE_ID="$image_id" \
            -e WORKFLOW_SHA="$WORKFLOW_SHA" \
            -v "$staging_backup_volume:/staging" \
            --entrypoint node "$image_ref" -e \
            "const{writeFileSync}=require('node:fs');writeFileSync('/staging/staging-manifest.json',JSON.stringify({createdUtc:new Date().toISOString(),sourceBackup:process.env.SOURCE_BACKUP,imageId:process.env.IMAGE_ID,workflowSha:process.env.WORKFLOW_SHA,origin:'http://127.0.0.1:3211',public:false,productionSecretsCopied:false},null,2)+'\\n',{mode:0o600})"

          test "$(docker inspect "$production" --format '{{.State.StartedAt}}')" = "$started_before"
          test "$(docker inspect "$production" --format '{{.State.Health.Status}}')" = healthy
          curl -fsS --max-time 30 "$SCHOOL_ORIGIN/api/health" | grep -F '"status":"ok"' >/dev/null

          success=1
          trap - EXIT
          printf 'SCHOOL_STAGING=OK container=%s\n' "$staging"
          printf 'SCHOOL_STAGING_SOURCE=%s\n' "$latest"
          printf 'SCHOOL_STAGING_BIND=%s\n' "$binding"
          printf 'SCHOOL_STAGING_NETWORK=internal\n'
          printf 'SCHOOL_STAGING_PUBLIC=no\n'
          printf 'SCHOOL_PRODUCTION_RESTARTED=no\n'
          printf 'SCHOOL_PRODUCTION_HEALTH=OK\n'
          REMOTE

          container="$(sed -n 's/^SCHOOL_STAGING=OK container=//p' "$log_file" | tail -n1)"
          test "$container" = school-1-11-staging
          printf 'container=%s\n' "$container" >> "$GITHUB_OUTPUT"

      - name: Publish staging result
        if: always()
        shell: bash
        env:
          CONTAINER: ${{ steps.staging.outputs.container }}
        run: |
          {
            echo '## School diary isolated staging'
            echo
            printf -- '- Container: %s\n' "${CONTAINER:-not-created}"
            printf -- '- Bind: 127.0.0.1:3211 only\n'
            printf -- '- Docker network: internal\n'
            printf -- '- Production data volume mounted: no\n'
            printf -- '- Production secrets copied: no\n'
            printf -- '- Result: %s\n' '${{ job.status }}'
          } >> "$GITHUB_STEP_SUMMARY"
