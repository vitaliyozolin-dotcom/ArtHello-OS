name: Verify ArtHello Tochka continuation
'on':
  pull_request:
    paths:
    - .github/workflows/**
    - .github/scripts/**
    - deploy/**
    - scripts/run-frozen-release-contract.py
    - scripts/run-r14-historical-contract.py
    - scripts/run-r15-historical-contract.py
    - scripts/test/**
  push:
    branches:
    - main
    paths:
    - .github/workflows/**
    - .github/scripts/**
    - deploy/**
    - scripts/run-frozen-release-contract.py
    - scripts/run-r14-historical-contract.py
    - scripts/run-r15-historical-contract.py
    - scripts/test/**
permissions:
  contents: read
concurrency:
  group: verify-arthello-r14-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  r12-candidate-tests:
    name: r12-candidate-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHECKED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
    - name: Check out exact unprivileged R13 verification source
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ env.CHECKED_SOURCE_SHA }}
        fetch-depth: 0
        clean: true
        persist-credentials: false
        submodules: false
        lfs: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24
    - name: Verify archived R12 contracts with current code
      shell: bash
      run: 'set -Eeuo pipefail

        test "$(id -u)" -ne 0

        test "$(git rev-parse HEAD)" = "$CHECKED_SOURCE_SHA"

        test "$(sha256sum deploy/v52/recovery-r12/check-contract.rb | cut -d '' '' -f 1)" = "594e30bc2adfd993e61d87aead3c1564d363c517122b8f70a63b47d276eb4b9b"

        python3 -I scripts/run-frozen-release-contract.py r12

        '
  r13-candidate-tests:
    name: r13-candidate-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHECKED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
    - name: Check out exact unprivileged R13 verification source
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ env.CHECKED_SOURCE_SHA }}
        fetch-depth: 0
        clean: true
        persist-credentials: false
        submodules: false
        lfs: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24
    - name: Verify archived R13 contracts with current code
      shell: bash
      run: 'set -Eeuo pipefail

        test "$(id -u)" -ne 0

        test "$(git rev-parse HEAD)" = "$CHECKED_SOURCE_SHA"

        test "$(sha256sum deploy/v52/recovery-r13/check-contract.rb | cut -d '' '' -f 1)" = "d65d1aa20817ba4d7d07aa46ae1cce71bb14297b5744ab6872bea5482fe97885"

        python3 -I scripts/run-frozen-release-contract.py r13

        '
  r14-candidate-tests:
    name: r14-candidate-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHECKED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      R14_CONTRACT_SHA256: 37614beafcbf18347d2429713301699bd4c5e3474cd4f7db840dc166b4c852a3
      R14_HISTORICAL_RUNNER_SHA256: ab0aeb384d5c5eb4859b86274f0a70778518b846620e4c2dbe47710c9c0fb48b
    steps:
    - name: Check out exact unprivileged R14 verification source
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ env.CHECKED_SOURCE_SHA }}
        fetch-depth: 0
        clean: true
        persist-credentials: false
        submodules: false
        lfs: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24
    - name: Verify current source and archived R14 protocol
      shell: bash
      run: 'set -Eeuo pipefail

        test "$(id -u)" -ne 0

        [[ "$CHECKED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]

        test "$(git rev-parse HEAD)" = "$CHECKED_SOURCE_SHA"

        [[ "$R14_CONTRACT_SHA256" =~ ^[a-f0-9]{64}$ ]]

        test "$(sha256sum deploy/v52/recovery-r14/check-contract.rb | cut -d '' '' -f 1)" = "$R14_CONTRACT_SHA256"

        test "$(sha256sum scripts/run-r14-historical-contract.py | cut -d '' '' -f 1)" = "$R14_HISTORICAL_RUNNER_SHA256"

        python3 -I -B scripts/test/r14-historical-contract.test.py

        python3 -I -B scripts/run-r14-historical-contract.py

        '
  r15-candidate-tests:
    name: r15-candidate-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHECKED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      R15_CONTRACT_SHA256: db8d577e4acd86180cb2a08234f99e654832918fcf29ad01697b25d57d700533
      R15_HISTORICAL_RUNNER_SHA256: 34412c90232e4d6660fbbef28c9278f163d2cd46b8da9e0bb1a9343b4e0f63e0
    steps:
    - name: Check out exact unprivileged R15 verification source
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ env.CHECKED_SOURCE_SHA }}
        fetch-depth: 0
        clean: true
        persist-credentials: false
        submodules: false
        lfs: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24
    - name: Verify complete R15 transformation and refusal boundaries
      shell: bash
      run: |
        set -Eeuo pipefail
        test "$(id -u)" -ne 0
        test "$(git rev-parse HEAD)" = "$CHECKED_SOURCE_SHA"
        test "$(sha256sum deploy/v52/recovery-r15/check-contract.rb | cut -d ' ' -f 1)" = "$R15_CONTRACT_SHA256"
        test "$(sha256sum scripts/run-r15-historical-contract.py | cut -d ' ' -f 1)" = "$R15_HISTORICAL_RUNNER_SHA256"
        python3 -I -B scripts/test/r15-historical-contract.test.py
        python3 -I -B scripts/run-r15-historical-contract.py
