# RETIRED: implicit main-path deployment could overwrite the accepted School production image.\nname: Deploy School 1-11 PC direct

on:
  push:
    branches: [main]
    paths:
      - app/**
      - public/**
      - deploy/**
      - package.json
      - pnpm-lock.yaml
      - next.config.*
      - .github/workflows/deploy-school-pc-direct.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  SCHOOL_ORIGIN: https://school-188-225-38-55.sslip.io

jobs:
  deploy:
    # Superseded by the immutable Design Code v1 cutover. Never run repair-deploy.sh implicitly.
    if: ${{ false }}
    runs-on: [self-hosted, linux, x64, school-prod]
    timeout-minutes: 45
    concurrency:
      group: school-1-11-production
      cancel-in-progress: false
    steps:
      - name: Checkout exact release
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Deploy locally with backup and rollback
        env:
          DELIVERY_REF: ${{ github.sha }}
          SOURCE_DIR: ${{ github.workspace }}
          SCHOOL_HOST: school-188-225-38-55.sslip.io
          VERIFY_PUBLIC: "1"
        run: |
          set -Eeuo pipefail
          test "$(id -u)" -eq 0 || docker info >/dev/null
          test -d /srv/school-1-11
          bash deploy/repair-deploy.sh

      - name: Verify public production and desktop UI
        run: |
          set -Eeuo pipefail
          health="$(curl --fail --silent --show-error --max-time 30 "$SCHOOL_ORIGIN/api/health")"
          grep -F '"status":"ok"' <<<"$health" >/dev/null

          html="$RUNNER_TEMP/login.html"
          css="$RUNNER_TEMP/all.css"
          curl --fail --silent --show-error --max-time 30 \
            -H 'Cache-Control: no-cache' \
            "$SCHOOL_ORIGIN/login?pc=$GITHUB_RUN_ID" > "$html"
          : > "$css"
          grep -oE '/_next/static/css/[^"?]+\.css' "$html" | sort -u | while read -r path; do
            curl --fail --silent --show-error --max-time 30 "$SCHOOL_ORIGIN$path" >> "$css"
            printf '\n' >> "$css"
          done
          test -s "$css"
          grep -F '.l0-stage' "$css" >/dev/null
          grep -F '.l0-sidebar' "$css" >/dev/null
          grep -F '.desktop-only' "$css" >/dev/null
          printf 'SCHOOL_PUBLIC_HTTPS=OK\n'
          printf 'SCHOOL_DESKTOP_UI=VERIFIED\n'
