name: Guarded runner checkout space

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect, or remove only completed temporary checkouts
        type: choice
        required: true
        options: [inspect, clean]
      confirmation:
        description: For clean type CLEAN ARTHELLO OLD CHECKOUTS
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: gateway-38-55-arthello-production
  cancel-in-progress: false

jobs:
  checkout-space:
    if: >-
      github.repository == 'vitaliyozolin-dotcom/ArtHello-OS' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'vitaliyozolin-dotcom' &&
      github.triggering_actor == 'vitaliyozolin-dotcom' &&
      github.run_attempt == 1 &&
      (inputs.operation == 'inspect' ||
       (inputs.operation == 'clean' && inputs.confirmation == 'CLEAN ARTHELLO OLD CHECKOUTS'))
    runs-on: [self-hosted, linux, x64, arthello-gateway]
    environment: production-ru
    timeout-minutes: 10
    steps:
      - name: Inspect and optionally remove completed temporary checkouts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation }}
        run: |
          set -Eeuo pipefail
          current_main="$(curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/vitaliyozolin-dotcom/ArtHello-OS/git/ref/heads/main | jq -er '.object.sha')"
          test "$current_main" = "$GITHUB_SHA"
          runner_root="$(realpath "$RUNNER_TEMP/../..")"
          checkout="$runner_root/_work/ArtHello-OS/ArtHello-OS"
          test "$GITHUB_WORKSPACE" = "$checkout"
          test "$(realpath -e "$checkout")" = "$checkout"
          test -d "$checkout/.git" && test ! -L "$checkout/.git"
          test "$(realpath -e "$checkout/.git")" = "$checkout/.git"
          echo '### Space before (KiB)'
          df -Pk -- "$checkout"
          echo '### Reproducible checkout paths (bytes)'
          du -x -B1 -d1 "$checkout" | sort -nr | sed -n '1,20p'
          shopt -s nullglob
          candidates=()
          bytes=0
          skipped=0
          skipped_path=0
          skipped_root=0
          skipped_origin=0
          skipped_status=0
          for path in "$checkout"/preflight-* "$checkout"/alfa-release-* "$checkout"/alfa-audit-* "$checkout"/alfa-sync-*; do
            name="${path##*/}"
            [[ "$name" =~ ^(preflight|alfa-release|alfa-audit|alfa-sync)-([0-9]+)-1$ ]] || continue
            test "${BASH_REMATCH[2]}" -lt "$GITHUB_RUN_ID" || continue
            if [ ! -d "$path" ] || [ -L "$path" ] || [ "$(realpath -e "$path")" != "$path" ] ||
               [ ! -d "$path/.git" ] || [ -L "$path/.git" ]; then
              skipped="$((skipped + 1))"; skipped_path="$((skipped_path + 1))"; continue
            fi
            if [ "$(git -C "$path" rev-parse --show-toplevel 2>/dev/null || true)" != "$path" ]; then
              skipped="$((skipped + 1))"; skipped_root="$((skipped_root + 1))"; continue
            fi
            origin="$(git -C "$path" remote get-url origin 2>/dev/null || true)"
            case "$origin" in
              https://github.com/vitaliyozolin-dotcom/ArtHello-OS|https://github.com/vitaliyozolin-dotcom/ArtHello-OS.git) ;;
              *) skipped="$((skipped + 1))"; skipped_origin="$((skipped_origin + 1))"; continue ;;
            esac
            if ! status="$(git -C "$path" status --porcelain 2>/dev/null)"; then
              skipped="$((skipped + 1))"; skipped_status="$((skipped_status + 1))"; continue
            fi
            if [ "$status" = '?? .github/scripts/__pycache__/' ]; then
              cache="$path/.github/scripts/__pycache__"
              if [ ! -d "$cache" ] || [ -L "$cache" ] ||
                 [ -n "$(find "$cache" -type l -print -quit)" ] ||
                 [ -n "$(find "$cache" -type f ! -name '*.pyc' -print -quit)" ]; then
                skipped="$((skipped + 1))"; skipped_status="$((skipped_status + 1))"; continue
              fi
            elif [ -n "$status" ]; then
              if [ "$OPERATION" = inspect ] && [ "$skipped_status" -eq 0 ]; then
                echo '### First changed checkout status (paths only, no contents)'
                printf '%s\n' "$status" | sed -n '1,20p'
              fi
              skipped="$((skipped + 1))"; skipped_status="$((skipped_status + 1))"; continue
            fi
            size="$(du -x -B1 -s "$path" | cut -f1)"
            bytes="$((bytes + size))"
            candidates+=("$path")
          done
          echo "OLD_CHECKOUT_COUNT=${#candidates[@]}"
          echo "OLD_CHECKOUT_BYTES=$bytes"
          echo "OLD_CHECKOUT_SKIPPED=$skipped"
          echo "OLD_CHECKOUT_SKIP_PATH=$skipped_path ROOT=$skipped_root ORIGIN=$skipped_origin STATUS=$skipped_status"
          if [ "$OPERATION" = inspect ]; then
            echo 'RUNNER_CHECKOUT_INSPECTED=1'
            exit 0
          fi
          test "$OPERATION" = clean
          test "${#candidates[@]}" -ge 15
          test "$bytes" -ge 800000000
          mapfile -t containers < <(docker ps -aq --no-trunc)
          if [ "${#containers[@]}" -gt 0 ]; then
            mounts="$(docker inspect "${containers[@]}" | jq -r '[.[] | .Mounts[]? | .Source] | .[]')"
            for path in "${candidates[@]}"; do
              if printf '%s\n' "$mounts" | grep -Fxq "$path"; then exit 2; fi
              if printf '%s\n' "$mounts" | grep -Fq "$path/"; then exit 2; fi
            done
          fi
          cd "$RUNNER_TEMP"
          for path in "${candidates[@]}"; do rm -rf -- "$path"; done
          for path in "${candidates[@]}"; do test ! -e "$path"; done
          echo '### Space after (KiB)'
          df -Pk -- "$checkout"
          available="$(df -Pk -- "$checkout" | awk 'NR==2 {print $4}')"
          test "$available" -ge 5242880
          echo 'RUNNER_OLD_CHECKOUTS_REMOVED=1'
