name: Guarded runner checkout space

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect, or remove only completed preflight checkouts
        type: choice
        required: true
        options: [inspect, clean]
      confirmation:
        description: For clean type CLEAN ARTHELLO PREFLIGHT CHECKOUTS
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: gateway-38-55-arthello-production
  cancel-in-progress: false

jobs:
  checkout-space:
    if: >-
      github.repository == 'vitaliyozolin-dotcom/ArtHello-OS' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'vitaliyozolin-dotcom' &&
      github.triggering_actor == 'vitaliyozolin-dotcom' &&
      github.run_attempt == 1 &&
      (inputs.operation == 'inspect' ||
       (inputs.operation == 'clean' && inputs.confirmation == 'CLEAN ARTHELLO PREFLIGHT CHECKOUTS'))
    runs-on: [self-hosted, linux, x64, arthello-gateway]
    environment: production-ru
    timeout-minutes: 10
    steps:
      - name: Inspect and optionally remove completed preflight checkouts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation }}
        run: |
          set -Eeuo pipefail
          current_main="$(curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/vitaliyozolin-dotcom/ArtHello-OS/git/ref/heads/main | jq -er '.object.sha')"
          test "$current_main" = "$GITHUB_SHA"
          runner_root="$(realpath "$RUNNER_TEMP/../..")"
          checkout="$runner_root/_work/ArtHello-OS/ArtHello-OS"
          test "$GITHUB_WORKSPACE" = "$checkout"
          test "$(realpath -e "$checkout")" = "$checkout"
          test -d "$checkout/.git" && test ! -L "$checkout/.git"
          test "$(realpath -e "$checkout/.git")" = "$checkout/.git"
          echo '### Space before (KiB)'
          df -Pk -- "$checkout"
          echo '### Reproducible checkout paths (bytes)'
          du -x -B1 -d1 "$checkout" | sort -nr | sed -n '1,20p'
          shopt -s nullglob
          candidates=()
          bytes=0
          for path in "$checkout"/preflight-*; do
            name="${path##*/}"
            [[ "$name" =~ ^preflight-([0-9]+)-1$ ]] || continue
            test "${BASH_REMATCH[1]}" -lt "$GITHUB_RUN_ID" || continue
            test -d "$path" && test ! -L "$path"
            test "$(realpath -e "$path")" = "$path"
            test -d "$path/.git" && test ! -L "$path/.git"
            test "$(git -C "$path" rev-parse --show-toplevel)" = "$path"
            test "$(git -C "$path" remote get-url origin)" = 'https://github.com/vitaliyozolin-dotcom/ArtHello-OS.git'
            if [ -n "$(git -C "$path" status --porcelain)" ]; then continue; fi
            size="$(du -x -B1 -s "$path" | cut -f1)"
            bytes="$((bytes + size))"
            candidates+=("$path")
          done
          echo "PREFLIGHT_CHECKOUT_COUNT=${#candidates[@]}"
          echo "PREFLIGHT_CHECKOUT_BYTES=$bytes"
          if [ "$OPERATION" = inspect ]; then
            echo 'RUNNER_CHECKOUT_INSPECTED=1'
            exit 0
          fi
          test "$OPERATION" = clean
          test "${#candidates[@]}" -ge 20
          test "$bytes" -ge 1600000000
          mapfile -t containers < <(docker ps -aq --no-trunc)
          if [ "${#containers[@]}" -gt 0 ]; then
            mounts="$(docker inspect "${containers[@]}" | jq -r '[.[] | .Mounts[]? | .Source] | .[]')"
            for path in "${candidates[@]}"; do
              if printf '%s\n' "$mounts" | grep -Fxq "$path"; then exit 2; fi
              if printf '%s\n' "$mounts" | grep -Fq "$path/"; then exit 2; fi
            done
          fi
          cd "$RUNNER_TEMP"
          for path in "${candidates[@]}"; do rm -rf -- "$path"; done
          for path in "${candidates[@]}"; do test ! -e "$path"; done
          echo '### Space after (KiB)'
          df -Pk -- "$checkout"
          available="$(df -Pk -- "$checkout" | awk 'NR==2 {print $4}')"
          test "$available" -ge 5242880
          echo 'RUNNER_PREFLIGHT_CHECKOUTS_REMOVED=1'
