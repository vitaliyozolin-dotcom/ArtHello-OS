name: Guarded runner checkout space

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect, remove completed checkouts, or retire two exact unused images
        type: choice
        required: true
        options: [inspect, inspect-images, inspect-autosync, inspect-snapshot, clean, images, images-extra, retire-e2e]
      confirmation:
        description: For clean type CLEAN ARTHELLO OLD CHECKOUTS; images RETIRE TWO UNUSED IMAGES; images-extra RETIRE TWO EXTRA UNUSED IMAGES; retire-e2e RETIRE EXACT UNUSED E2E IMAGE
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: gateway-38-55-arthello-production
  cancel-in-progress: false

jobs:
  checkout-space:
    if: >-
      github.repository == 'vitaliyozolin-dotcom/ArtHello-OS' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'vitaliyozolin-dotcom' &&
      github.triggering_actor == 'vitaliyozolin-dotcom' &&
      github.run_attempt == 1 &&
      (inputs.operation == 'inspect' || inputs.operation == 'inspect-images' || inputs.operation == 'inspect-snapshot' ||
       inputs.operation == 'inspect-autosync' ||
       (inputs.operation == 'clean' && inputs.confirmation == 'CLEAN ARTHELLO OLD CHECKOUTS') ||
       (inputs.operation == 'images' && inputs.confirmation == 'RETIRE TWO UNUSED IMAGES') ||
       (inputs.operation == 'images-extra' && inputs.confirmation == 'RETIRE TWO EXTRA UNUSED IMAGES') ||
       (inputs.operation == 'retire-e2e' && inputs.confirmation == 'RETIRE EXACT UNUSED E2E IMAGE'))
    runs-on: [self-hosted, linux, x64, arthello-gateway]
    environment: production-ru
    timeout-minutes: 10
    steps:
      - name: Inspect and optionally remove completed temporary checkouts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation }}
        run: |
          set -Eeuo pipefail
          current_main="$(curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/vitaliyozolin-dotcom/ArtHello-OS/git/ref/heads/main | jq -er '.object.sha')"
          test "$current_main" = "$GITHUB_SHA"
          if [ "$OPERATION" = inspect-snapshot ]; then
            # Read-only capacity diagnosis after D194 run 36120078514. No database content is printed.
            live_id='66cc912f6088bc1b929d23ee07fc906b94e82fdd2e747ce6419fb7b2fe3a7b91'
            image='sha256:70fc84b541c2bffebd8d3130544d98158d25ced0c788890511b7d96a39c50216'
            live="$(docker inspect "$live_id")"
            jq -e --arg id "$live_id" --arg image "$image" \
              'length == 1 and .[0].Id == $id and .[0].Image == $image and .[0].State.Running == true and
               .[0].Config.Labels["org.opencontainers.image.revision"] == "d83da0ce8311a4b60832031a217b91c7dd6bb1c8" and
               ([.[0].Mounts[] | select(.Destination == "/data" and .Type == "volume" and .RW == true)] | length) == 1' \
              <<<"$live" >/dev/null
            source_volume="$(jq -er '.[0].Mounts[] | select(.Destination == "/data" and .Type == "volume" and .RW == true) | .Name' <<<"$live")"
            backup_volume='arthello-d194-central-36120078514-1'
            docker volume inspect "$source_volume" "$backup_volume" | jq -e --arg backup "$backup_volume" \
              'length == 2 and .[1].Name == $backup and .[1].Labels["arthello.scope"] == "production-backup"' >/dev/null
            echo '### Root and mounted block devices (bytes)'
            df -Pk -- "$GITHUB_WORKSPACE"
            lsblk -b -o NAME,SIZE,FSTYPE,MOUNTPOINTS
            docker run --rm --network none --read-only --user 0:0 --cap-drop ALL --security-opt no-new-privileges:true \
              --pids-limit 32 --memory 256m \
              --mount "type=volume,src=$source_volume,dst=/source,readonly,volume-nocopy" \
              --mount "type=volume,src=$backup_volume,dst=/snapshot,readonly,volume-nocopy" \
              --entrypoint node "$image" -e '
                const fs=require("node:fs"), path=require("node:path");
                function total(root){let bytes=0, count=0; function walk(at){for(const name of fs.readdirSync(at)){
                  const item=path.join(at,name), stat=fs.lstatSync(item);
                  if(stat.isDirectory()) walk(item); else if(stat.isFile()){bytes+=stat.size;count++} else throw Error("unsupported source entry")
                }} walk(root); return {bytes,count}}
                const source=total("/source"), partial=total("/snapshot"), stat=fs.statfsSync("/snapshot");
                const free=stat.bavail*stat.bsize, required=source.bytes*3+512*1024*1024;
                console.log("SNAPSHOT_CAPACITY="+JSON.stringify({sourceBytes:source.bytes,sourceFiles:source.count,
                  partialBackupBytes:partial.bytes,partialBackupFiles:partial.count,freeBytes:free,
                  requiredBytes:required,capacitySatisfied:free>=required}));
              '
            echo 'SNAPSHOT_INSPECTED_READ_ONLY=1'
            exit 0
          fi
          if [ "$OPERATION" = inspect-autosync ]; then
            # Read only the exact central runtime installed by protected release #65.
            # Print allowlisted timer outcomes, never raw application logs or env values.
            live_id='443ee25945d269f43010dba4f40917a69ec2965ed8876834d632a2f7897d27f7'
            docker inspect "$live_id" | jq -e --arg id "$live_id" \
              --arg image 'sha256:0ce1f600d502c7ff052cc815cab493a39c4adc35f8f954d83af192a4c5f20f24' \
              --arg revision '4f745ce821a075081d09b36e6ef0ebf1ac26dcbc' \
              'length == 1 and .[0].Id == $id and .[0].Image == $image and
               .[0].State.Running == true and
               .[0].Config.Labels["org.opencontainers.image.revision"] == $revision and
               any(.[0].Config.Env[]; . == "ALFACRM_AUTOSYNC_ENABLED=1")' >/dev/null
            docker logs --since 30m "$live_id" 2>&1 | python3 -c '
          import collections, json, re, sys
          allowed = re.compile(r"ALFACRM_AUTOSYNC_TICK=(DISABLED|NOT_DUE|PENDING|COMPLETE|RETRY|PAUSED|FAILED|INVALID_RESPONSE|HTTP_[0-9]{3})")
          counts = collections.Counter()
          for line in sys.stdin:
              match = allowed.fullmatch(line.strip())
              if match:
                  counts[match.group(1)] += 1
              elif line.strip() == "alfacrm.autosync_tick_failed":
                  counts["HANDLER_FAILED"] += 1
          print("ALFA_AUTOSYNC_TIMER_OUTCOMES=" + json.dumps(dict(sorted(counts.items())), sort_keys=True))
          '
            echo 'ALFA_AUTOSYNC_RUNTIME_INSPECTED=1'
            exit 0
          fi
          if [ "$OPERATION" = retire-e2e ]; then
            # D227: the exact e2e test image was inventoried again in run 36056790516
            # with no container. This path never touches volumes, containers,
            # application images, caches, or any other tag.
            id='sha256:1d736341ca55199764149f61d0a5f1333412e1571225177e90b752cd18e2356e'
            tag='arthello-e2e:bcc36f2d5b098c55e686f69b48d389120c0bd1df'
            check_target() {
              local snapshot
              snapshot="$(docker image inspect "$id")"
              jq -e --arg id "$id" --arg tag "$tag" --arg rev 'bcc36f2d5b098c55e686f69b48d389120c0bd1df' \
                'length == 1 and .[0].Id == $id and .[0].RepoTags == [$tag] and
                 .[0].Config.Labels["org.opencontainers.image.revision"] == $rev' <<<"$snapshot" >/dev/null
              test "$(docker image inspect "$tag" --format '{{.Id}}')" = "$id"
              mapfile -t containers < <(docker ps -aq --no-trunc)
              if [ "${#containers[@]}" -gt 0 ]; then
                docker inspect "${containers[@]}" | jq -e --arg id "$id" 'all(.[]; .Image != $id)' >/dev/null
              fi
            }
            echo '### Space before (KiB)'
            df -Pk -- "$GITHUB_WORKSPACE"
            check_target
            current_main="$(curl --fail --silent --show-error --max-time 20 \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              https://api.github.com/repos/vitaliyozolin-dotcom/ArtHello-OS/git/ref/heads/main | jq -er '.object.sha')"
            test "$current_main" = "$GITHUB_SHA"
            check_target
            docker image rm --no-prune "$id"
            if docker image inspect "$id" >/dev/null 2>&1; then exit 2; fi
            echo '### Space after (KiB)'
            df -Pk -- "$GITHUB_WORKSPACE"
            available="$(df -Pk -- "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}')"
            test "$available" -ge 5242880
            echo 'EXACT_UNUSED_E2E_IMAGE_RETIRED=1'
            exit 0
          fi
          if [ "$OPERATION" = inspect-images ]; then
            echo '### Space (KiB)'
            df -Pk -- "$GITHUB_WORKSPACE"
            echo '### Exact local image inventory (bytes, tags, revision, container count)'
            mapfile -t image_ids < <(docker image ls -aq --no-trunc | sort -u)
            mapfile -t containers < <(docker ps -aq --no-trunc)
            consumers='[]'
            if [ "${#containers[@]}" -gt 0 ]; then
              consumers="$(docker inspect "${containers[@]}" | jq '[.[].Image]')"
            fi
            if [ "${#image_ids[@]}" -gt 0 ]; then
              docker image inspect "${image_ids[@]}" | jq -r --argjson consumers "$consumers" \
                '.[] | . as $image | [.Id, (.Size|tostring), ((.RepoTags // [])|join(",")),
                  (.Config.Labels["org.opencontainers.image.revision"] // ""),
                  ([ $consumers[] | select(. == $image.Id) ] | length | tostring)] | @tsv'
            fi
            echo 'RUNNER_IMAGES_INSPECTED=1'
            exit 0
          fi
          if [ "$OPERATION" = images ] || [ "$OPERATION" = images-extra ]; then
            # D226: both immutable IDs were inventoried with zero containers.
            # No volumes, containers, logs, build cache, or other images are touched.
            ids=(
              sha256:b05c91cccc9c3a05a0681aae9ad3075f938b49944f88db42b564b3ab4d5a8c39
              sha256:625d7c0332da71a7bd2c424d434500fe9dabf3ad8d851661c682ccf6ca012746
            )
            tags=(
              arthello-v52-verify:6c820c0d116ebfde0f0c3bef6dbde4eec0df5cc0
              arthello-directory-school:5876accedbdf3758971fdc383f1e0fad8c32a158
            )
            if [ "$OPERATION" = images-extra ]; then
              ids=(
                sha256:910a95f4a55ba33545177f404409401da57c30ae6822198ab8bf60d0e3730eeb
                sha256:cb656f5e70f504f14cbcdc2aa9e70d343d07604e9c59db1f08085f9b42f8b8d8
              )
              tags=(
                arthello-v52-verify:1c919896d974430295637ba9acaaafd4a6aa3d3d
                arthello-directory-school:5802a5e6fb6d254f1f67a3776ae0c47d43a68859
              )
            fi
            echo '### Space before (KiB)'
            df -Pk -- "$GITHUB_WORKSPACE"
            check_images() {
              local i id tag snapshot bound
              for i in 0 1; do
                id="${ids[$i]}"; tag="${tags[$i]}"
                snapshot="$(docker image inspect "$id")"
                jq -r --arg id "$id" --arg tag "$tag" \
                  '.[0] | "IMAGE_GUARD_INDEX='"$i"' ID_MATCH=\(.Id == $id) TAG_MATCH=\(.RepoTags == [$tag]) DIGEST_COUNT=\(.RepoDigests | length)"' \
                  <<<"$snapshot"
                jq -e --arg id "$id" --arg tag "$tag" \
                  'length == 1 and .[0].Id == $id and .[0].RepoTags == [$tag]' \
                  <<<"$snapshot" >/dev/null
                bound="$(docker image inspect "$tag" --format '{{.Id}}')"
                test "$bound" = "$id"
              done
              mapfile -t containers < <(docker ps -aq --no-trunc)
              if [ "${#containers[@]}" -gt 0 ]; then
                docker inspect "${containers[@]}" | jq -e --arg a "${ids[0]}" --arg b "${ids[1]}" \
                  'all(.[]; .Image != $a and .Image != $b)' >/dev/null
              fi
            }
            check_images
            test "$(docker inspect c458727c47647b9a04f414c4b1e7fbe27c1870c9e97a175832a14ceb6e8a5f7e --format '{{.State.Running}}|{{.Image}}')" = \
              'true|sha256:ff58abd131134b252989932f667fddba6dc5b1589c425512c7d7be0724a48f3d'
            current_main="$(curl --fail --silent --show-error --max-time 20 \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              https://api.github.com/repos/vitaliyozolin-dotcom/ArtHello-OS/git/ref/heads/main | jq -er '.object.sha')"
            test "$current_main" = "$GITHUB_SHA"
            check_images
            for id in "${ids[@]}"; do docker image rm --no-prune "$id"; done
            for id in "${ids[@]}"; do
              if docker image inspect "$id" >/dev/null 2>&1; then exit 2; fi
            done
            echo '### Space after (KiB)'
            df -Pk -- "$GITHUB_WORKSPACE"
            available="$(df -Pk -- "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}')"
            test "$available" -ge 5242880
            echo 'EXACT_UNUSED_IMAGES_RETIRED=1'
            exit 0
          fi
          runner_root="$(realpath "$RUNNER_TEMP/../..")"
          checkout="$runner_root/_work/ArtHello-OS/ArtHello-OS"
          test "$GITHUB_WORKSPACE" = "$checkout"
          test "$(realpath -e "$checkout")" = "$checkout"
          test -d "$checkout/.git" && test ! -L "$checkout/.git"
          test "$(realpath -e "$checkout/.git")" = "$checkout/.git"
          echo '### Space before (KiB)'
          df -Pk -- "$checkout"
          echo '### Reproducible checkout paths (bytes)'
          du -x -B1 -d1 "$checkout" | sort -nr | sed -n '1,20p'
          shopt -s nullglob
          candidates=()
          bytes=0
          skipped=0
          skipped_path=0
          skipped_root=0
          skipped_origin=0
          skipped_status=0
          for path in "$checkout"/preflight-* "$checkout"/alfa-release-* "$checkout"/alfa-audit-* "$checkout"/alfa-sync-*; do
            name="${path##*/}"
            [[ "$name" =~ ^(preflight|alfa-release|alfa-audit|alfa-sync)-([0-9]+)-1$ ]] || continue
            test "${BASH_REMATCH[2]}" -lt "$GITHUB_RUN_ID" || continue
            if [ ! -d "$path" ] || [ -L "$path" ] || [ "$(realpath -e "$path")" != "$path" ] ||
               [ ! -d "$path/.git" ] || [ -L "$path/.git" ]; then
              skipped="$((skipped + 1))"; skipped_path="$((skipped_path + 1))"; continue
            fi
            if [ "$(git -C "$path" rev-parse --show-toplevel 2>/dev/null || true)" != "$path" ]; then
              skipped="$((skipped + 1))"; skipped_root="$((skipped_root + 1))"; continue
            fi
            origin="$(git -C "$path" remote get-url origin 2>/dev/null || true)"
            case "$origin" in
              https://github.com/vitaliyozolin-dotcom/ArtHello-OS|https://github.com/vitaliyozolin-dotcom/ArtHello-OS.git) ;;
              *) skipped="$((skipped + 1))"; skipped_origin="$((skipped_origin + 1))"; continue ;;
            esac
            if ! status="$(git -C "$path" status --porcelain 2>/dev/null)"; then
              skipped="$((skipped + 1))"; skipped_status="$((skipped_status + 1))"; continue
            fi
            if [ "$status" = '?? .github/scripts/__pycache__/' ]; then
              cache="$path/.github/scripts/__pycache__"
              if [ ! -d "$cache" ] || [ -L "$cache" ] ||
                 [ -n "$(find "$cache" -type l -print -quit)" ] ||
                 [ -n "$(find "$cache" -type f ! -name '*.pyc' -print -quit)" ]; then
                skipped="$((skipped + 1))"; skipped_status="$((skipped_status + 1))"; continue
              fi
            elif [ -n "$status" ]; then
              if [ "$OPERATION" = inspect ] && [ "$skipped_status" -eq 0 ]; then
                echo '### First changed checkout status (paths only, no contents)'
                printf '%s\n' "$status" | sed -n '1,20p'
              fi
              skipped="$((skipped + 1))"; skipped_status="$((skipped_status + 1))"; continue
            fi
            size="$(du -x -B1 -s "$path" | cut -f1)"
            bytes="$((bytes + size))"
            candidates+=("$path")
          done
          echo "OLD_CHECKOUT_COUNT=${#candidates[@]}"
          echo "OLD_CHECKOUT_BYTES=$bytes"
          echo "OLD_CHECKOUT_SKIPPED=$skipped"
          echo "OLD_CHECKOUT_SKIP_PATH=$skipped_path ROOT=$skipped_root ORIGIN=$skipped_origin STATUS=$skipped_status"
          if [ "$OPERATION" = inspect ]; then
            echo 'RUNNER_CHECKOUT_INSPECTED=1'
            exit 0
          fi
          test "$OPERATION" = clean
          test "${#candidates[@]}" -ge 15
          test "$bytes" -ge 800000000
          mapfile -t containers < <(docker ps -aq --no-trunc)
          if [ "${#containers[@]}" -gt 0 ]; then
            mounts="$(docker inspect "${containers[@]}" | jq -r '[.[] | .Mounts[]? | .Source] | .[]')"
            for path in "${candidates[@]}"; do
              if printf '%s\n' "$mounts" | grep -Fxq "$path"; then exit 2; fi
              if printf '%s\n' "$mounts" | grep -Fq "$path/"; then exit 2; fi
            done
          fi
          cd "$RUNNER_TEMP"
          for path in "${candidates[@]}"; do rm -rf -- "$path"; done
          for path in "${candidates[@]}"; do test ! -e "$path"; done
          echo '### Space after (KiB)'
          df -Pk -- "$checkout"
          available="$(df -Pk -- "$checkout" | awk 'NR==2 {print $4}')"
          test "$available" -ge 5242880
          echo 'RUNNER_OLD_CHECKOUTS_REMOVED=1'
