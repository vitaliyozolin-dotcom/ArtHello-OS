# D185: retry D184 with root-only offline verification of the immutable backup.
# The product, image provenance and production boundaries remain unchanged.
name: Restore Atlas access and director UI D185

"on":
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact D185 main controller SHA
        required: true
        type: string
      quality_run_id:
        description: Successful exact-main Quality gates run ID
        required: true
        type: string
      proof_run_id:
        description: Successful exact-main ArtHello Proof Gates run ID
        required: true
        type: string
      confirmation:
        description: Type DEPLOY D185 TO PRODUCTION
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  CONTROLLER_SHA: ${{ inputs.release_sha }}
  QUALITY_RUN_ID: ${{ inputs.quality_run_id }}
  PROOF_RUN_ID: ${{ inputs.proof_run_id }}
  CUTOVER_CONFIRMATION: ${{ inputs.confirmation }}
  ATLAS_SOURCE_SHA: f856fb3bd098152bb6b02c4d0273c4c9170b130c
  ATLAS_SOURCE_TREE: e63e28520670527bc12d84abcd45cd8fffe2b876
  CENTRAL_URL: https://arthello-188-225-38-55.sslip.io
  ATLAS_URL: https://atlas-188-225-38-55.sslip.io
  SCHOOL_URL: https://school-188-225-38-55.sslip.io
  PAY_URL: https://pay-188-225-38-55.sslip.io

jobs:
  audit:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.sha == inputs.release_sha &&
      github.repository == 'vitaliyozolin-dotcom/ArtHello-OS' &&
      github.repository_owner == 'vitaliyozolin-dotcom' &&
      github.actor == 'vitaliyozolin-dotcom' &&
      github.triggering_actor == 'vitaliyozolin-dotcom' &&
      github.run_attempt == 1 &&
      inputs.confirmation == 'DEPLOY D185 TO PRODUCTION'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CONTROLLER_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact main, release contract and successful gates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = vitaliyozolin-dotcom/ArtHello-OS
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$CONTROLLER_SHA"
          test "$GITHUB_ACTOR" = vitaliyozolin-dotcom
          test "$GITHUB_TRIGGERING_ACTOR" = vitaliyozolin-dotcom
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$CUTOVER_CONFIRMATION" = "DEPLOY D185 TO PRODUCTION"
          [[ "$CONTROLLER_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$QUALITY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PROOF_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          test "$(git rev-parse HEAD)" = "$CONTROLLER_SHA"
          test "$(git log -1 --format=%s)" = "D185: verify Atlas backup as root"
          current="$(curl --fail-with-body --silent --show-error --max-time 30 --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' --header 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" | jq -er '.object.sha')"
          test "$current" = "$CONTROLLER_SHA"
          verify_run() {
            local run_id="$1" expected_name="$2" expected_path="$3"
            local payload
            payload="$(curl --fail-with-body --silent --show-error --max-time 30 --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' --header 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
            jq -e --arg repository "$GITHUB_REPOSITORY" --arg release "$CONTROLLER_SHA" --arg name "$expected_name" --arg path "$expected_path" '
                .name==$name and .path==$path and .event=="push" and .head_branch=="main" and
                .head_sha==$release and .status=="completed" and .conclusion=="success" and
                .run_attempt==1 and .repository.full_name==$repository and
                .head_repository.full_name==$repository and .actor.login=="vitaliyozolin-dotcom" and
                .triggering_actor.login=="vitaliyozolin-dotcom"
              ' <<<"$payload" >/dev/null
          }
          verify_run "$QUALITY_RUN_ID" "Quality gates" ".github/workflows/quality.yml"
          verify_run "$PROOF_RUN_ID" "ArtHello Proof Gates" ".github/workflows/proof-gates.yml"
          grep -F '## D185 —' DECISIONS.md >/dev/null
          grep -F 'ATLAS_PUBLIC_ORIGIN' deploy/release-atlas-d185.sh >/dev/null
          grep -F 'ATLAS_CENTRAL_ACCESS_SECRET_FILE' deploy/release-atlas-d185.sh >/dev/null
          grep -F 'ATLAS_IMAGE_RUNTIME_FINGERPRINT=VERIFIED' deploy/upgrade-atlas-d185.sh >/dev/null
          grep -F -- '--user 0:0 --security-opt no-new-privileges:true' deploy/upgrade-atlas-d185.sh >/dev/null
          bash -n deploy/release-atlas-d185.sh
          bash -n deploy/upgrade-atlas-d185.sh
          node --check deploy/atlas-runtime-recovery-d185.mjs
          node --test scripts/test/atlas-production-recovery.test.mjs scripts/test/atlas-owner-access-activation.test.mjs

  bundle-atlas:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CONTROLLER_SHA }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.ATLAS_SOURCE_SHA }}
          path: atlas
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify and test exact Atlas source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C controller rev-parse HEAD)" = "$CONTROLLER_SHA"
          test "$(git -C atlas rev-parse HEAD)" = "$ATLAS_SOURCE_SHA"
          test "$(git -C atlas rev-parse HEAD^{tree})" = "$ATLAS_SOURCE_TREE"
          (cd controller && node --test scripts/test/atlas-production-recovery.test.mjs scripts/test/atlas-owner-access-activation.test.mjs)
          (cd atlas && npm ci && npm run test:atlas)
      - name: Build and smoke immutable Atlas image
        shell: bash
        run: |
          set -Eeuo pipefail
          docker build --label "org.opencontainers.image.revision=$ATLAS_SOURCE_SHA" --label "org.opencontainers.image.source-tree=$ATLAS_SOURCE_TREE" --tag "atlas-diary:$ATLAS_SOURCE_SHA" atlas
          container="atlas-d185-smoke-$GITHUB_RUN_ID"
          data="atlas-d185-smoke-data-$GITHUB_RUN_ID"
          backups="atlas-d185-smoke-backups-$GITHUB_RUN_ID"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            docker volume rm "$data" "$backups" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker volume create "$data" >/dev/null
          docker volume create "$backups" >/dev/null
          docker run -d --name "$container" --network none --read-only --tmpfs /tmp:rw,uid=1001,gid=1001 -e PUBLIC_APP_ORIGIN="$ATLAS_URL" -e ARTHELLO_PUBLIC_ORIGIN="$CENTRAL_URL" -e CENTRAL_ACCESS_SECRET=atlas-ci-only-key-123456789012345678901234567890 -e PASSWORDLESS_PEPPER=atlas-ci-only-pepper-1234567890123456789012345678 -v "$data:/data" -v "$backups:/backups" "atlas-diary:$ATLAS_SOURCE_SHA"
          ready=0
          for _ in $(seq 1 40); do
            if docker exec "$container" node -e "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          docker exec "$container" node --input-type=module -e "import {DatabaseSync} from 'node:sqlite'; const db=new DatabaseSync('/data/atlas-school.sqlite'); if(db.prepare(\"SELECT institution_id FROM diary_identity WHERE id='primary'\").get()?.institution_id!=='atlas-school')throw Error('institution'); db.close();"
      - name: Package Atlas image with provenance
        shell: bash
        run: |
          set -Eeuo pipefail
          bundle="$RUNNER_TEMP/atlas-d185-bundle"
          mkdir -p "$bundle"
          docker save "atlas-diary:$ATLAS_SOURCE_SHA" | gzip -1 -n > "$bundle/atlas-image.tar.gz"
          image_id="$(docker image inspect "atlas-diary:$ATLAS_SOURCE_SHA" --format '{{.Id}}')"
          runtime_fingerprint="$(docker image inspect "$image_id" | jq -cS -f controller/deploy/v52/maintenance/image-runtime-fingerprint.jq | sha256sum | cut -d ' ' -f 1)"
          [[ "$runtime_fingerprint" =~ ^[a-f0-9]{64}$ ]]
          jq -n --arg controller "$CONTROLLER_SHA" --arg source "$ATLAS_SOURCE_SHA" --arg tree "$ATLAS_SOURCE_TREE" --arg image "$image_id" --arg fingerprint "$runtime_fingerprint" '{schemaVersion:1,controllerSha:$controller,sourceSha:$source,sourceTree:$tree,imageId:$image,runtimeFingerprintSha256:$fingerprint,builderTrust:"github-hosted-ephemeral",productionCapability:false}' > "$bundle/receipt.json"
          (cd "$bundle" && sha256sum atlas-image.tar.gz receipt.json > checksums.sha256)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-d185-bundle
          path: ${{ runner.temp }}/atlas-d185-bundle/
          retention-days: 30
          compression-level: 0

  deploy:
    needs: [audit, bundle-atlas]
    concurrency:
      group: gateway-38-55-arthello-production
      cancel-in-progress: false
    runs-on: [self-hosted, linux, x64, arthello-gateway]
    environment: production-ru
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CONTROLLER_SHA }}
          path: controller
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: atlas-d185-bundle
          path: ${{ runner.temp }}/atlas-d185-bundle
      - name: Restore Atlas access and publish director-first UI
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          ATLAS_BUNDLE_DIR: ${{ runner.temp }}/atlas-d185-bundle
          ARTHELLO_OWNER_LOGIN: ${{ secrets.ARTHELLO_FINANCE_IMPORT_LOGIN }}
          ARTHELLO_OWNER_PASSWORD: ${{ secrets.ARTHELLO_FINANCE_IMPORT_PASSWORD }}
        shell: bash
        run: |
          set -Eeuo pipefail
          log="$RUNNER_TEMP/atlas-d185-production.log"
          bash controller/deploy/release-atlas-d185.sh | tee "$log"
          grep -F 'ATLAS_D185_PRODUCTION=VERIFIED' "$log" >/dev/null
          candidate="$(sed -n 's/^candidate=//p' "$log")"
          receipt="$(sed -n 's/^receipt=//p' "$log")"
          [[ "$candidate" =~ ^arthello-direct-[1-9][0-9]*-1$ ]]
          test "$receipt" = "$HOME/.config/arthello/release-state/production-d185-$CONTROLLER_SHA.json"
          test -s "$receipt"
          cp "$receipt" "$ATLAS_BUNDLE_DIR/production-receipt.json"
          printf 'candidate=%s\nreceipt=%s\n' "$candidate" "$receipt" >> "$GITHUB_OUTPUT"
      - name: Verify exact D185 gateway state under the shared lock
        env:
          D185_CANDIDATE: ${{ steps.publish.outputs.candidate }}
          D185_RECEIPT: ${{ steps.publish.outputs.receipt }}
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -e --arg controller "$CONTROLLER_SHA" '
            .schemaVersion==1 and .state=="verified" and .decision=="D185" and
            .controllerSha==$controller and .atlas.sourceSha=="f856fb3bd098152bb6b02c4d0273c4c9170b130c" and
            .atlas.dataVolumePreserved==true and .atlas.ownerSso.ownerGrant=="director" and
            .atlas.ownerSso.atlasSso=="verified" and
            (.atlas.imageProof.archiveSha256|test("^[a-f0-9]{64}$")) and
            (.atlas.imageProof.builderImageId|test("^sha256:[a-f0-9]{64}$")) and
            (.atlas.imageProof.gatewayImageId|test("^sha256:[a-f0-9]{64}$")) and
            (.atlas.imageProof.runtimeFingerprintSha256|test("^[a-f0-9]{64}$"))
          ' "$D185_RECEIPT" >/dev/null
          live_id="$(docker inspect "$D185_CANDIDATE" --format '{{.Id}}')"
          test "$live_id" = "$(jq -er '.candidateContainerId' "$D185_RECEIPT")"
          test "$(docker inspect "$D185_CANDIDATE" --format '{{.State.Running}}')" = true
          docker exec stroios-caddy-1 sh -ceu 'cat /data/external-routes.caddy' | grep -F "$D185_CANDIDATE:8081" >/dev/null
          printf 'ATLAS_D185_LOCKED_ROUTE=VERIFIED candidate=%s\n' "$D185_CANDIDATE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: atlas-d185-production-receipts
          path: |
            ${{ runner.temp }}/atlas-d185-bundle/
            ${{ runner.temp }}/atlas-d185-production.log
          if-no-files-found: warn
          retention-days: 30

  verify-external:
    needs: deploy
    concurrency:
      group: gateway-38-55-arthello-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Verify exact D185 from an independent network
        shell: bash
        run: |
          set -Eeuo pipefail
          probe() {
            curl --fail --silent --show-error --max-time 15 "$CENTRAL_URL/api/health" | jq -e '.status=="ok" and .database=="available"' >/dev/null &&
            curl --fail --silent --show-error --max-time 15 "$ATLAS_URL/api/health" | jq -e '.status=="ok"' >/dev/null &&
            curl --fail --silent --show-error --max-time 15 "$SCHOOL_URL/api/health" | jq -e '.status=="ok"' >/dev/null &&
            curl --fail --silent --show-error --max-time 15 "$PAY_URL/pay-assets/release.json" | jq -e '.decision=="D182" and .releaseSha=="95873e519113e93d9d52ac08166eb46b317e5c6e"' >/dev/null &&
            test "$(curl --silent --show-error --max-time 15 --output /dev/null --write-out '%{http_code}' "$CENTRAL_URL/api/atlas-sso/open")" = 303 &&
            curl --silent --show-error --max-time 15 --output /dev/null --dump-header - "$CENTRAL_URL/api/atlas-sso/open" | tr -d '\r' | grep -Fxi "location: $ATLAS_URL/auth/central/start" >/dev/null
          }
          ready=0
          for _ in $(seq 1 18); do
            if probe; then ready=1; break; fi
            sleep 5
          done
          test "$ready" = 1
          html="$(curl --fail --silent --show-error --max-time 15 "$ATLAS_URL/?release=d185-$CONTROLLER_SHA")"
          readarray -t chunks < <(grep -oE 'src="/[^"]+\.js"' <<<"$html" | sed -E 's/^src="|"$//g' | sort -u)
          test "${#chunks[@]}" -gt 0
          ui_marker=0
          for chunk in "${chunks[@]}"; do
            chunk_body="$(curl --fail --silent --show-error --max-time 15 "$ATLAS_URL$chunk?release=d185-$CONTROLLER_SHA")"
            if grep -F 'Инструмент руководителя' <<<"$chunk_body" >/dev/null; then
              ui_marker=1
              break
            fi
          done
          test "$ui_marker" = 1
          printf 'ATLAS_D185_EXTERNAL=VERIFIED central_sso=303 atlas=200 director_ui=present school=200 pay=200\n'
