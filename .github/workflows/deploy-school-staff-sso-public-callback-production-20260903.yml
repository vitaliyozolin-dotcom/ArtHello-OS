name: Deploy School staff SSO public callback production

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/deploy-school-staff-sso-public-callback-production-20260903.yml
      - .github/scripts/school-staff-sso-workflow-controller-v4.sh.gz.b64.part-*
      - .github/scripts/school-staff-sso-production-cutover-v3.sh.gz.b64.part-*
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-school-staff-sso-public-callback-production-20260903.yml
      - .github/scripts/school-staff-sso-workflow-controller-v4.sh.gz.b64.part-*
      - .github/scripts/school-staff-sso-production-cutover-v3.sh.gz.b64.part-*
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: school-1-11-production
  cancel-in-progress: false

env:
  CANDIDATE_SHA: 54242340f2d9b6a9887d69ecc03520ddf9f7982c
  CANDIDATE_TREE: 65d2ab6b182d6c8218b1022fecd840dd9f9d7564
  VALIDATED_SHA: 43fda9852a7c39236c70f1f8ee7aad0edb6770aa
  VALIDATION_RUN_ID: "33746867643"
  SOURCE_PR: "322"
  SOURCE_BASE: school/staging-foundation-20260827
  CUTOVER_SCRIPT_SHA256: 6c8d945addce8644a0bcfbfaff555463042c6b2bbb46d09df06f52820fa93b25
  CONTROLLER_SCRIPT_SHA256: 69698b83b08e0bb806be6cbf4e1ae38e5373eb6bf0e3ebb56f65d13d0e275dce
  SCHOOL_ORIGIN: https://school-188-225-38-55.sslip.io
  ARTHELLO_ORIGIN: https://arthello-188-225-38-55.sslip.io

jobs:
  validate:
    if: >-
      github.repository == 'vitaliyozolin-dotcom/ArtHello-OS' &&
      github.actor == 'vitaliyozolin-dotcom' &&
      github.triggering_actor == 'vitaliyozolin-dotcom' &&
      (
        github.event_name != 'pull_request' ||
        (
          github.event.pull_request.user.login == 'vitaliyozolin-dotcom' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'ops/deploy-school-staff-sso-public-callback-20260903'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out exact controls candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable School release provenance and cutover controls
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf -- "$work"' EXIT

          mapfile -t controller_parts < <(
            printf '%s\n' .github/scripts/school-staff-sso-workflow-controller-v4.sh.gz.b64.part-* | sort
          )
          mapfile -t cutover_parts < <(
            printf '%s\n' .github/scripts/school-staff-sso-production-cutover-v3.sh.gz.b64.part-* | sort
          )
          test "${#controller_parts[@]}" -eq 5
          test "${#cutover_parts[@]}" -eq 10
          cat "${controller_parts[@]}" | tr -d '\r\n\t ' | base64 -d | gzip -d > "$work/controller.sh"
          cat "${cutover_parts[@]}" | tr -d '\r\n\t ' | base64 -d | gzip -d > "$work/cutover.sh"
          printf '%s  %s\n' "$CONTROLLER_SCRIPT_SHA256" "$work/controller.sh" | sha256sum -c -
          printf '%s  %s\n' "$CUTOVER_SCRIPT_SHA256" "$work/cutover.sh" | sha256sum -c -
          bash -n "$work/controller.sh"
          bash -n "$work/cutover.sh"
          grep -Fx 'data/*' "$work/controller.sh" >/dev/null
          grep -Fx '!data/schedules' "$work/controller.sh" >/dev/null
          grep -Fx '!data/schedules/**' "$work/controller.sh" >/dev/null
          grep -Fx '!data/curricula' "$work/controller.sh" >/dev/null
          grep -Fx '!data/curricula/**' "$work/controller.sh" >/dev/null
          ! grep -Fx 'data' "$work/controller.sh" >/dev/null

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VALIDATION_RUN_ID" > "$work/run.json"
          gh api "repos/$GITHUB_REPOSITORY/commits/$VALIDATED_SHA" > "$work/validated.json"
          gh api "repos/$GITHUB_REPOSITORY/commits/$CANDIDATE_SHA" > "$work/candidate.json"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$SOURCE_PR" > "$work/pr.json"
          python3 - "$work" "$VALIDATED_SHA" "$CANDIDATE_SHA" "$CANDIDATE_TREE" "$SOURCE_BASE" <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          validated_sha, candidate_sha, candidate_tree, source_base = sys.argv[2:]
          run = json.loads((root / "run.json").read_text())
          validated = json.loads((root / "validated.json").read_text())
          candidate = json.loads((root / "candidate.json").read_text())
          pr = json.loads((root / "pr.json").read_text())

          assert run.get("conclusion") == "success"
          assert run.get("head_sha") == validated_sha
          assert validated["commit"]["tree"]["sha"] == candidate_tree
          assert candidate["commit"]["tree"]["sha"] == candidate_tree
          assert pr.get("state") == "closed" and pr.get("merged_at")
          assert pr["head"]["sha"] == validated_sha
          assert pr["base"]["ref"] == source_base
          assert pr["merge_commit_sha"] == candidate_sha
          PY

          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'SCHOOL_STAFF_SSO_DEPLOY_CONTROLS=PASS\n'

  deploy:
    needs: validate
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'vitaliyozolin-dotcom/ArtHello-OS' &&
      github.actor == 'vitaliyozolin-dotcom' &&
      github.triggering_actor == 'vitaliyozolin-dotcom'
    runs-on: [self-hosted, linux, x64, arthello-gateway]
    timeout-minutes: 85
    environment: production-ru
    env:
      GH_TOKEN: ${{ github.token }}
      DEPLOY_HOST: ${{ secrets.ARTHELLO_RU_DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.ARTHELLO_RU_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.ARTHELLO_RU_DEPLOY_PORT }}
      SSH_PRIVATE_KEY: ${{ secrets.ARTHELLO_RU_SSH_PRIVATE_KEY }}

    steps:
      - name: Check out exact production controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: controls
          persist-credentials: false

      - name: Check out exact accepted School release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
          path: school-source

      - name: Execute verified backup-first School cutover
        shell: bash
        run: |
          set -Eeuo pipefail
          controller="$RUNNER_TEMP/school-staff-sso-controller-v4-$GITHUB_RUN_ID.sh"
          mapfile -t controller_parts < <(
            printf '%s\n' controls/.github/scripts/school-staff-sso-workflow-controller-v4.sh.gz.b64.part-* | sort
          )
          test "${#controller_parts[@]}" -eq 5
          cat "${controller_parts[@]}" | tr -d '\r\n\t ' | base64 -d | gzip -d > "$controller"
          chmod 0500 "$controller"
          printf '%s  %s\n' "$CONTROLLER_SCRIPT_SHA256" "$controller" | sha256sum -c -
          bash -n "$controller"
          grep -Fx '!data/schedules/**' "$controller" >/dev/null
          grep -Fx '!data/curricula/**' "$controller" >/dev/null
          exec "$controller"

      - name: Verify live SSO origin boundary after cutover
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$(mktemp -d "$RUNNER_TEMP/school-staff-sso-boundary-XXXXXX")"
          trap 'rm -rf -- "$work"' EXIT

          curl -fsS --max-time 30 "$SCHOOL_ORIGIN/api/health" |
            grep -F '"status":"ok"' >/dev/null
          curl -fsS --max-time 30 "$ARTHELLO_ORIGIN/api/health" |
            grep -F '"status":"ok"' >/dev/null

          curl -sS --max-time 30 -D "$work/start.headers" -o /dev/null \
            "$SCHOOL_ORIGIN/auth/central/start?returnTo=/"
          test "$(awk 'NR==1{print $2}' "$work/start.headers")" = 303
          location="$(tr -d '\r' < "$work/start.headers" | sed -n 's/^location: //Ip' | tail -n1)"
          python3 - "$location" <<'PY'
          import sys
          import urllib.parse

          target = urllib.parse.urlparse(sys.argv[1])
          assert target.scheme == "https"
          assert target.netloc == "arthello-188-225-38-55.sslip.io"
          assert target.path == "/api/school-sso/authorize"
          PY

          code="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          verifier="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          body="$(jq -nc --arg code "$code" --arg verifier "$verifier" '{code:$code,codeVerifier:$verifier}')"
          wrong_origin="$(curl -sS --max-time 30 \
            -o "$work/wrong-origin.json" -w '%{http_code}' \
            -X POST "$ARTHELLO_ORIGIN/api/school-sso/exchange" \
            -H 'content-type: application/json' \
            -H "origin: $ARTHELLO_ORIGIN" \
            --data "$body")"
          school_origin="$(curl -sS --max-time 30 \
            -o "$work/school-origin.json" -w '%{http_code}' \
            -X POST "$ARTHELLO_ORIGIN/api/school-sso/exchange" \
            -H 'content-type: application/json' \
            -H "origin: $SCHOOL_ORIGIN" \
            --data "$body")"
          test "$wrong_origin" = 403
          test "$school_origin" = 401
          grep -F 'Источник запроса не разрешён' "$work/wrong-origin.json" >/dev/null
          printf 'SCHOOL_STAFF_SSO_ORIGIN_BOUNDARY_LIVE=PASS\n'

      - name: Prove every active employee reaches the live diary UI
        shell: bash
        run: |
          set -Eeuo pipefail
          exec 9>/var/lock/school-staff-sso-production-e2e.lock
          flock -n 9

          arthello="$(docker ps --filter 'name=^/arthello-direct-' --format '{{.Names}}' | head -n1)"
          test -n "$arthello"
          test "$(docker inspect "$arthello" --format '{{.State.Running}}')" = true

          docker exec -i \
            -e ARTHELLO_ORIGIN="$ARTHELLO_ORIGIN" \
            -e SCHOOL_ORIGIN="$SCHOOL_ORIGIN" \
            "$arthello" node --input-type=module - <<'NODE'
          import { createHash, randomBytes } from 'node:crypto';
          import { readdirSync, statSync } from 'node:fs';
          import { join } from 'node:path';
          import { DatabaseSync } from 'node:sqlite';

          const arthelloOrigin = process.env.ARTHELLO_ORIGIN;
          const schoolOrigin = process.env.SCHOOL_ORIGIN;
          const files = [];
          function walk(path, depth = 0) {
            if (depth > 8) return;
            let entries = [];
            try { entries = readdirSync(path, { withFileTypes: true }); } catch { return; }
            for (const entry of entries) {
              const next = join(path, entry.name);
              if (entry.isDirectory()) walk(next, depth + 1);
              else if (entry.isFile() && /\.sqlite(?:3)?$/i.test(entry.name)) {
                try { if (statSync(next).size > 8192) files.push(next); } catch {}
              }
            }
          }
          walk('/data/d1');

          let databasePath = '';
          for (const file of files) {
            let candidate;
            try {
              candidate = new DatabaseSync(file, { readOnly: true });
              const tables = new Set(
                candidate.prepare("SELECT name FROM sqlite_master WHERE type='table'")
                  .all().map((row) => String(row.name)),
              );
              candidate.close();
              if (
                tables.has('app_users') &&
                tables.has('user_system_access') &&
                tables.has('production_auth_sessions') &&
                tables.has('production_auth_credentials')
              ) {
                databasePath = file;
                break;
              }
            } catch { try { candidate?.close(); } catch {} }
          }
          if (!databasePath) throw new Error('ArtHello production D1 not found');

          const db = new DatabaseSync(databasePath);
          const accounts = db.prepare(`
            SELECT
              u.id AS appUserId,
              u.display_name AS displayName,
              school.role AS schoolGrantRole,
              c.user_id AS authUserId,
              central.access_version AS accessVersion
            FROM app_users u
            JOIN user_system_access central
              ON central.user_id=u.id AND central.system_id='SYS-ARTHELLO-OS'
            JOIN user_system_access school
              ON school.user_id=u.id AND school.system_id='SYS-SCHOOL-1-11'
            JOIN production_auth_credentials c
              ON c.user_id=CASE WHEN u.id='USR-OWNER' THEN 'AUTH-OWNER' ELSE u.id END
            WHERE u.status='Активен'
              AND central.status='Активен'
              AND school.status='Активен'
              AND u.access_version=central.access_version
              AND u.access_version=school.access_version
              AND COALESCE(c.must_change_password,0)=0
            ORDER BY u.display_name,u.id
          `).all();
          if (accounts.length < 1) {
            db.close();
            throw new Error('No active employee accounts eligible for School SSO');
          }

          const insertSession = db.prepare(`
            INSERT INTO production_auth_sessions
              (token_hash,user_id,csrf_token,expires_at,access_version,created_at)
            VALUES (?,?,?,?,?,?)
          `);
          const now = Math.floor(Date.now() / 1000);
          const sessions = [];
          for (const account of accounts) {
            const token = randomBytes(32).toString('base64url');
            const tokenHash = createHash('sha256').update(token).digest('base64url');
            insertSession.run(
              tokenHash,
              account.authUserId,
              randomBytes(24).toString('base64url'),
              now + 900,
              account.accessVersion,
              now,
            );
            sessions.push({ ...account, token, tokenHash });
          }
          db.close();

          const results = [];
          const codeHashes = [];
          const redirects = new Set([302, 303, 307, 308]);

          function getSetCookies(response) {
            if (typeof response.headers.getSetCookie === 'function') {
              return response.headers.getSetCookie();
            }
            const value = response.headers.get('set-cookie');
            return value ? [value] : [];
          }
          function mergeCookies(jar, cookies) {
            for (const raw of cookies) {
              const pair = raw.split(';', 1)[0];
              const split = pair.indexOf('=');
              if (split <= 0) continue;
              const name = pair.slice(0, split);
              const value = pair.slice(split + 1);
              if (value && !/Max-Age=0/i.test(raw)) jar.set(name, value);
              else jar.delete(name);
            }
          }
          function cookieHeader(jar) {
            return [...jar].map(([name, value]) => `${name}=${value}`).join('; ');
          }
          function safe(value) {
            return String(value ?? '').replace(/\s+/g, ' ').trim().slice(0, 240);
          }

          try {
            for (const account of sessions) {
              const stages = {};
              const schoolCookies = new Map();
              try {
                const start = await fetch(`${schoolOrigin}/auth/central/start?returnTo=/`, {
                  redirect: 'manual',
                  headers: { 'cache-control': 'no-store' },
                });
                stages.start = start.status;
                mergeCookies(schoolCookies, getSetCookies(start));
                if (!redirects.has(start.status)) throw new Error(`start_http_${start.status}`);
                const authorizeUrl = new URL(start.headers.get('location') || '', schoolOrigin);
                if (
                  authorizeUrl.origin !== arthelloOrigin ||
                  authorizeUrl.pathname !== '/api/school-sso/authorize'
                ) throw new Error('authorize_location_invalid');
                if (!schoolCookies.has('school_sso_tx')) throw new Error('transaction_cookie_missing');

                const authorize = await fetch(authorizeUrl, {
                  redirect: 'manual',
                  headers: {
                    cookie: `__Host-arthello_session=${account.token}`,
                    'cache-control': 'no-store',
                  },
                });
                stages.authorize = authorize.status;
                if (!redirects.has(authorize.status)) throw new Error(`authorize_http_${authorize.status}`);
                const callbackUrl = new URL(authorize.headers.get('location') || '', arthelloOrigin);
                if (callbackUrl.searchParams.get('authError') === 'central_denied') {
                  throw new Error(`authorize_denied:${safe(callbackUrl.searchParams.get('reason'))}`);
                }
                if (
                  callbackUrl.origin !== schoolOrigin ||
                  callbackUrl.pathname !== '/auth/central/callback'
                ) throw new Error('public_callback_invalid');
                const code = callbackUrl.searchParams.get('code') || '';
                if (!code) throw new Error('authorization_code_missing');
                codeHashes.push(createHash('sha256').update(code).digest('base64url'));

                const callback = await fetch(callbackUrl, {
                  redirect: 'manual',
                  headers: {
                    cookie: cookieHeader(schoolCookies),
                    'cache-control': 'no-store',
                  },
                });
                stages.callback = callback.status;
                mergeCookies(schoolCookies, getSetCookies(callback));
                if (!redirects.has(callback.status)) {
                  throw new Error(`callback_http_${callback.status}:${safe(await callback.text())}`);
                }
                const finalLocation = new URL(callback.headers.get('location') || '', schoolOrigin);
                if (finalLocation.origin !== schoolOrigin || finalLocation.pathname !== '/') {
                  throw new Error(`final_location_${finalLocation.origin}${finalLocation.pathname}`);
                }
                if (['0.0.0.0', '127.0.0.1', 'localhost'].includes(finalLocation.hostname)) {
                  throw new Error('internal_callback_origin_exposed');
                }
                if (!schoolCookies.has('school_session')) throw new Error('school_session_cookie_missing');

                const snapshotResponse = await fetch(`${schoolOrigin}/api/school`, {
                  headers: {
                    cookie: cookieHeader(schoolCookies),
                    accept: 'application/json',
                    'cache-control': 'no-store',
                  },
                });
                stages.snapshot = snapshotResponse.status;
                const snapshot = await snapshotResponse.json().catch(() => ({}));
                if (!snapshotResponse.ok) {
                  throw new Error(`snapshot_http_${snapshotResponse.status}:${safe(snapshot.error)}`);
                }
                const viewer = snapshot.viewer;
                if (!viewer || viewer.displayName !== account.displayName) {
                  throw new Error(`viewer_identity_${safe(viewer?.displayName)}`);
                }
                if (!viewer.role) throw new Error('viewer_role_missing');

                const page = await fetch(`${schoolOrigin}/`, {
                  headers: {
                    cookie: cookieHeader(schoolCookies),
                    accept: 'text/html',
                    'cache-control': 'no-store',
                  },
                });
                stages.page = page.status;
                const html = await page.text();
                if (!page.ok || html.length < 1000) {
                  throw new Error(`page_invalid_${page.status}_${html.length}`);
                }
                const assets = [...new Set(
                  [...html.matchAll(/(?:src|href)=["'](\/_next\/[^"']+)["']/g)]
                    .map((match) => match[1]),
                )];
                if (!assets.length) throw new Error('page_assets_missing');
                for (const asset of assets.slice(0, 24)) {
                  const response = await fetch(new URL(asset, schoolOrigin), {
                    headers: { 'cache-control': 'no-store' },
                  });
                  if (!response.ok) throw new Error(`asset_http_${response.status}:${asset}`);
                  await response.arrayBuffer();
                }

                const logout = await fetch(`${schoolOrigin}/api/auth/logout`, {
                  redirect: 'manual',
                  headers: {
                    cookie: cookieHeader(schoolCookies),
                    'cache-control': 'no-store',
                  },
                });
                stages.logout = logout.status;
                if (!redirects.has(logout.status) && logout.status !== 204) {
                  throw new Error(`logout_http_${logout.status}`);
                }

                results.push({
                  appUserId: account.appUserId,
                  displayName: account.displayName,
                  schoolGrantRole: account.schoolGrantRole,
                  resolvedRole: viewer.role,
                  stages,
                  pageBytes: html.length,
                  assetCount: assets.length,
                  status: 'PASS',
                });
              } catch (error) {
                if (schoolCookies.has('school_session')) {
                  try {
                    await fetch(`${schoolOrigin}/api/auth/logout`, {
                      redirect: 'manual',
                      headers: { cookie: cookieHeader(schoolCookies) },
                    });
                  } catch {}
                }
                results.push({
                  appUserId: account.appUserId,
                  displayName: account.displayName,
                  schoolGrantRole: account.schoolGrantRole,
                  stages,
                  status: 'FAIL',
                  reason: error instanceof Error ? error.message.slice(0, 320) : 'unknown',
                });
              }
            }
          } finally {
            const cleanup = new DatabaseSync(databasePath);
            const removeSession = cleanup.prepare(
              'DELETE FROM production_auth_sessions WHERE token_hash=?',
            );
            for (const session of sessions) removeSession.run(session.tokenHash);
            const tables = new Set(
              cleanup.prepare("SELECT name FROM sqlite_master WHERE type='table'")
                .all().map((row) => String(row.name)),
            );
            if (tables.has('school_sso_codes')) {
              const removeCode = cleanup.prepare(
                'DELETE FROM school_sso_codes WHERE code_hash=?',
              );
              for (const hash of codeHashes) removeCode.run(hash);
            }
            cleanup.close();
            console.log('SCHOOL_STAFF_SSO_EPHEMERAL_DATA_CLEANED=PASS');
          }

          console.log('SCHOOL_STAFF_SSO_LIVE_RESULTS_BEGIN');
          console.log(JSON.stringify(results, null, 2));
          console.log('SCHOOL_STAFF_SSO_LIVE_RESULTS_END');
          const failed = results.filter((item) => item.status !== 'PASS');
          const natalias = results.filter((item) =>
            String(item.displayName || '').startsWith('Наталья '),
          );
          console.log(`SCHOOL_STAFF_SSO_LIVE_TOTAL=${results.length}`);
          console.log(`SCHOOL_STAFF_SSO_LIVE_PASS=${results.length - failed.length}`);
          console.log(`SCHOOL_STAFF_SSO_LIVE_FAIL=${failed.length}`);
          console.log(
            `SCHOOL_STAFF_SSO_LIVE_NATALIA_PASS=${natalias.filter((item) => item.status === 'PASS').length}`,
          );
          if (results.length !== 5) throw new Error(`Expected 5 active employees, got ${results.length}`);
          if (natalias.length !== 2) throw new Error(`Expected 2 Natalia accounts, got ${natalias.length}`);
          if (failed.length) process.exit(2);
          NODE

          printf 'SCHOOL_STAFF_SSO_LIVE_E2E=PASS\n'

      - name: Production summary
        if: always()
        shell: bash
        run: |
          {
            echo '## School employee SSO production cutover'
            echo
            echo "- Candidate: $CANDIDATE_SHA"
            echo "- Validated source: $VALIDATED_SHA"
            echo "- Source PR: #$SOURCE_PR"
            echo "- School: $SCHOOL_ORIGIN"
            echo "- ArtHello: $ARTHELLO_ORIGIN"
            echo "- Acceptance: all five employees, both Natalia accounts, live School session, snapshot, page and assets"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
