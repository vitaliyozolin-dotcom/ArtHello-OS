name: Read-only School R4 fingerprint diagnosis
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/school-r4-fingerprint-diagnostic-20260908.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: school-1-11-production
  cancel-in-progress: false
  queue: max
jobs:
  probe:
    if: github.event_name == 'push' && github.repository == 'vitaliyozolin-dotcom/ArtHello-OS' && github.ref == 'refs/heads/main'
      && github.actor == 'vitaliyozolin-dotcom' && github.triggering_actor == 'vitaliyozolin-dotcom'
    runs-on:
    - self-hosted
    - linux
    - x64
    - arthello-gateway
    timeout-minutes: 20
    environment: production-ru
    steps:
    - name: Confirm exact failed D066 attempt and unchanged main before read-only diagnosis
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -Eeuo pipefail
        api=https://api.github.com/repos/vitaliyozolin-dotcom/ArtHello-OS
        headers=(--header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' --header 'X-GitHub-Api-Version: 2022-11-28')
        main="$(curl --fail --silent --show-error --max-time 30 "${headers[@]}" "$api/git/ref/heads/main" | jq -er '.object.sha')"
        test "$main" = "$GITHUB_SHA"
        commit="$(curl --fail --silent --show-error --max-time 30 "${headers[@]}" "$api/commits/$GITHUB_SHA")"
        jq -e --arg sha "$GITHUB_SHA" '.sha == $sha and .commit.verification.verified == true and (.parents | length) == 1 and .parents[0].sha == "055773c73f214b43caddb643cbccbe4b3d3d1755"' <<<"$commit" >/dev/null
        run="$(curl --fail --silent --show-error --max-time 30 "${headers[@]}" "$api/actions/runs/34206196494")"
        jq -e '.run_attempt == 1 and .status == "completed" and .conclusion == "failure" and .head_sha == "d872842e1dd99f1ec90790af54c00e9ff964b61c"' <<<"$run" >/dev/null
        jobs="$(curl --fail --silent --show-error --max-time 30 "${headers[@]}" "$api/actions/runs/34206196494/attempts/1/jobs?per_page=100")"
        jq -e '.total_count == 1 and (.jobs | length) == 1 and .jobs[0].id == 101996459827 and .jobs[0].conclusion == "failure" and ([.jobs[0].steps[] | select(.name == "Repair School egress configuration with durable receipt" and .conclusion == "failure")] | length) == 1 and ([.jobs[0].steps[] | select(.name == "Clone preflight and guarded production cutover" and .conclusion == "skipped")] | length) == 1' <<<"$jobs" >/dev/null
        printf 'SCHOOL_R4_FINGERPRINT_DIAGNOSTIC_CONTEXT=VERIFIED\n'
    - name: Observe two fixed public health endpoints from the gateway
      shell: bash
      timeout-minutes: 1
      run: |
        set -Eeuo pipefail
        payload=''
        test "$(printf %s "$payload" | base64 -d | sha256sum | cut -d " " -f 1)" = 560c5e7872c4ceb491b1d98f1123840833661f74ff6657338023658a22a6a66e
        python3 -I -B -c 'import base64; exec(base64.b64decode("'"$payload"'"))'
    - name: Configure protected SSH transport
      id: ssh
      env:
        SSH_PRIVATE_KEY: ${{ secrets.ARTHELLO_RU_SSH_PRIVATE_KEY }}
        DEPLOY_HOST: ${{ secrets.ARTHELLO_RU_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.ARTHELLO_RU_DEPLOY_USER }}
        DEPLOY_PORT: ${{ secrets.ARTHELLO_RU_DEPLOY_PORT }}
      shell: bash
      run: |
        set -Eeuo pipefail
        umask 077
        test -n "$SSH_PRIVATE_KEY"
        test -n "$DEPLOY_HOST"
        test -n "$DEPLOY_USER"
        [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]{0,252}$ ]]
        [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]]
        deploy_port="${DEPLOY_PORT:-2222}"
        [[ "$deploy_port" =~ ^[0-9]{1,5}$ ]]
        test "$deploy_port" -ge 1
        test "$deploy_port" -le 65535
        ssh_dir="$RUNNER_TEMP/school-r4-fingerprint-diagnostic-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        test ! -e "$ssh_dir"
        test ! -L "$ssh_dir"
        install -m 0700 -d "$ssh_dir"
        printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_dir/id_ed25519"
        unset SSH_PRIVATE_KEY
        chmod 0600 "$ssh_dir/id_ed25519"
        ssh-keygen -y -f "$ssh_dir/id_ed25519" >/dev/null
        scan="$ssh_dir/known_hosts.scan"
        : > "$scan"
        chmod 0600 "$scan"
        for attempt in 1 2 3; do
          timeout --signal=TERM --kill-after=5s 150s \
            ssh -p "$deploy_port" \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile="$scan" \
              -o GlobalKnownHostsFile=/dev/null \
              -o PreferredAuthentications=none \
              -o PubkeyAuthentication=no \
              -o PasswordAuthentication=no \
              -o KbdInteractiveAuthentication=no \
              -o ConnectTimeout=140 \
              -o HostKeyAlgorithms=ssh-ed25519 \
              "$DEPLOY_USER@$DEPLOY_HOST" true \
              </dev/null >/dev/null 2>&1 || true
          test -s "$scan" && break
          sleep 5
        done
        test -s "$scan"
        fingerprint="$(ssh-keygen -lf "$scan" -E sha256 | awk '{print $2; exit}')"
        test "$fingerprint" = 'SHA256:/kBNohTF+5g8U+jQt+PzOCoWZ9yCSFjBnEP3Oc3MwRI'
        mv "$scan" "$ssh_dir/known_hosts"
        timeout --signal=TERM --kill-after=5s 180s \
          ssh -T \
            -p "$deploy_port" \
            -i "$ssh_dir/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o ConnectTimeout=140 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=30 \
            -o IPQoS=none \
            -o Compression=no \
            -o KexAlgorithms=curve25519-sha256 \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o PubkeyAcceptedAlgorithms=ssh-ed25519 \
            -o Ciphers=aes128-ctr \
            -o MACs=hmac-sha2-256 \
            "$DEPLOY_USER@$DEPLOY_HOST" true \
            </dev/null >/dev/null
        printf 'key=%s\n' "$ssh_dir/id_ed25519" >> "$GITHUB_OUTPUT"
        printf 'known_hosts=%s\n' "$ssh_dir/known_hosts" >> "$GITHUB_OUTPUT"
        printf 'port=%s\n' "$deploy_port" >> "$GITHUB_OUTPUT"
        printf 'SCHOOL_R4_FINGERPRINT_DIAGNOSTIC_SSH=VERIFIED\n'
    - name: Read twelve exact School fingerprints and cleanup metadata without mutation
      env:
        DEPLOY_HOST: ${{ secrets.ARTHELLO_RU_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.ARTHELLO_RU_DEPLOY_USER }}
        SSH_KEY: ${{ steps.ssh.outputs.key }}
        SSH_KNOWN_HOSTS: ${{ steps.ssh.outputs.known_hosts }}
        DEPLOY_PORT: ${{ steps.ssh.outputs.port }}
      shell: bash
      run: |
        set -Eeuo pipefail
        payload=''
        test "$(printf %s "$payload" | base64 -d | sha256sum | cut -d " " -f 1)" = a3fff36aa0a48a302f555a632aa322e608365125b642c570b4f943c3541dcef7
        timeout --signal=TERM --kill-after=5s 240s \
          ssh -T \
            -p "$DEPLOY_PORT" \
            -i "$SSH_KEY" \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$SSH_KNOWN_HOSTS" \
            -o GlobalKnownHostsFile=/dev/null \
            -o ConnectTimeout=140 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=30 \
            -o IPQoS=none \
            -o Compression=no \
            -o KexAlgorithms=curve25519-sha256 \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o PubkeyAcceptedAlgorithms=ssh-ed25519 \
            -o Ciphers=aes128-ctr \
            -o MACs=hmac-sha2-256 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "python3 -I -B -c 'import base64; exec(base64.b64decode(\"$payload\"))'" \
            </dev/null
    - name: Remove only this invocation SSH material
      if: always()
      shell: bash
      run: |
        set -Eeuo pipefail
        ssh_dir="$RUNNER_TEMP/school-r4-fingerprint-diagnostic-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        case "$ssh_dir" in "$RUNNER_TEMP"/school-r4-fingerprint-diagnostic-*) ;; *) exit 1 ;; esac
        if [ -d "$ssh_dir" ] && [ ! -L "$ssh_dir" ]; then
          rm -f -- "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts" "$ssh_dir/known_hosts.scan"
          rmdir -- "$ssh_dir"
        fi
