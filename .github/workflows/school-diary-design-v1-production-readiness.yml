name: School diary design v1 production readiness

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/school-diary-design-v1-production-readiness.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: school-1-11-production
  cancel-in-progress: false

env:
  CANDIDATE_SHA: 034be78c5cb30402ebb7d3786133d0f3be390be9
  CANDIDATE_IMAGE: school-1-11-design-v1:034be78c5cb3
  CANDIDATE_IMAGE_ID: sha256:b926e67b021a549bb694cc12a65f909c62e6228caf48ece4ef14f0b96457fede
  SCHOOL_ORIGIN: https://school-188-225-38-55.sslip.io
  STAGING_ORIGIN: http://127.0.0.1:3211
  STAGING_RUN_ID: "33336620387"
  STAGING_RUN_SHA: 38ff3d6f95f61624a770d488832242f75dcce987
  VISUAL_RUN_ID: "33336973598"
  FOUR_ROLE_RUN_ID: "33336973630"
  AUDIT_RUN_SHA: d3eda3981545d7a0aad16211efd5dc9080ff7844
  VISUAL_ARTIFACT_ID: "9739355097"
  VISUAL_ARTIFACT_DIGEST: sha256:b0bf33d09add71b5d79adca7bad94d4c90620d629505d345aa66de6450b8c60d

jobs:
  verify-production-readiness:
    runs-on: [self-hosted, linux, x64, arthello-gateway]
    timeout-minutes: 35
    environment: production-ru
    steps:
      - name: Check out release controls
        uses: actions/checkout@v4

      - name: Verify immutable release evidence
        uses: actions/github-script@v7
        env:
          CANDIDATE_SHA: ${{ env.CANDIDATE_SHA }}
          STAGING_RUN_ID: ${{ env.STAGING_RUN_ID }}
          STAGING_RUN_SHA: ${{ env.STAGING_RUN_SHA }}
          VISUAL_RUN_ID: ${{ env.VISUAL_RUN_ID }}
          FOUR_ROLE_RUN_ID: ${{ env.FOUR_ROLE_RUN_ID }}
          AUDIT_RUN_SHA: ${{ env.AUDIT_RUN_SHA }}
          VISUAL_ARTIFACT_ID: ${{ env.VISUAL_ARTIFACT_ID }}
          VISUAL_ARTIFACT_DIGEST: ${{ env.VISUAL_ARTIFACT_DIGEST }}
        with:
          script: |
            const expectedRuns = [
              [process.env.STAGING_RUN_ID, process.env.STAGING_RUN_SHA, "staging"],
              [process.env.VISUAL_RUN_ID, process.env.AUDIT_RUN_SHA, "visual"],
              [process.env.FOUR_ROLE_RUN_ID, process.env.AUDIT_RUN_SHA, "four-role"],
            ];
            for (const [id, sha, label] of expectedRuns) {
              const { data: run } = await github.rest.actions.getWorkflowRun({
                ...context.repo,
                run_id: Number(id),
              });
              if (run.conclusion !== "success" || run.head_sha !== sha) {
                core.setFailed(
                  label + " evidence mismatch: conclusion=" + run.conclusion +
                  " head_sha=" + run.head_sha
                );
                return;
              }
              core.info("SCHOOL_RELEASE_EVIDENCE_" + label.toUpperCase() + "=OK");
            }

            const { data: artifact } = await github.rest.actions.getArtifact({
              ...context.repo,
              artifact_id: Number(process.env.VISUAL_ARTIFACT_ID),
            });
            if (
              artifact.workflow_run?.id !== Number(process.env.VISUAL_RUN_ID) ||
              artifact.expired ||
              artifact.digest !== process.env.VISUAL_ARTIFACT_DIGEST
            ) {
              core.setFailed("Authorized visual artifact provenance mismatch");
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: 230,
            });
            if (
              pr.state !== "open" ||
              pr.head.sha !== process.env.CANDIDATE_SHA ||
              pr.changed_files !== 5
            ) {
              core.setFailed("Reviewed candidate PR provenance mismatch");
              return;
            }
            core.info("SCHOOL_RELEASE_EVIDENCE_ARTIFACT=OK");
            core.info("SCHOOL_RELEASE_CANDIDATE_PR=OK");

      - name: Configure confirmed School SSH host
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ARTHELLO_RU_SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.ARTHELLO_RU_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ARTHELLO_RU_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.ARTHELLO_RU_DEPLOY_PORT }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_dir="$RUNNER_TEMP/school-production-readiness-ssh-$GITHUB_RUN_ID"
          install -m 0700 -d "$ssh_dir"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_dir/id_ed25519"
          chmod 0600 "$ssh_dir/id_ed25519"
          ssh-keygen -y -f "$ssh_dir/id_ed25519" >/dev/null

          deploy_port="${DEPLOY_PORT:-2222}"
          scan="$ssh_dir/known_hosts.scan"
          : > "$scan"
          chmod 0600 "$scan"
          for attempt in 1 2; do
            timeout --signal=TERM --kill-after=5s 150s \
              ssh -p "$deploy_port" \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile="$scan" \
              -o GlobalKnownHostsFile=/dev/null \
              -o PreferredAuthentications=none \
              -o PubkeyAuthentication=no \
              -o PasswordAuthentication=no \
              -o KbdInteractiveAuthentication=no \
              -o ConnectTimeout=140 \
              -o HostKeyAlgorithms=ssh-ed25519 \
              "$DEPLOY_USER@$DEPLOY_HOST" true </dev/null >/dev/null 2>&1 || true
            test -s "$scan" && break
            sleep 5
          done
          test -s "$scan"
          actual_fingerprint="$(ssh-keygen -lf "$scan" -E sha256 | awk '{print $2; exit}')"
          test "$actual_fingerprint" = 'SHA256:/kBNohTF+5g8U+jQt+PzOCoWZ9yCSFjBnEP3Oc3MwRI'
          mv "$scan" "$ssh_dir/known_hosts"
          printf 'ssh_dir=%s\n' "$ssh_dir" >> "$GITHUB_ENV"
          printf 'deploy_port=%s\n' "$deploy_port" >> "$GITHUB_ENV"
          printf 'SCHOOL_PRODUCTION_READINESS_SSH=VERIFIED\n'

      - name: Inspect production and create verified cutover backup
        id: readiness
        env:
          DEPLOY_HOST: ${{ secrets.ARTHELLO_RU_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ARTHELLO_RU_DEPLOY_USER }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_args=(
            -p "$deploy_port"
            -i "$ssh_dir/id_ed25519"
            -o IdentitiesOnly=yes
            -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no
            -o KbdInteractiveAuthentication=no
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$ssh_dir/known_hosts"
            -o ConnectTimeout=140
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=12
            -o IPQoS=none
            -o Compression=no
            -o KexAlgorithms=curve25519-sha256
            -o HostKeyAlgorithms=ssh-ed25519
            -o PubkeyAcceptedAlgorithms=ssh-ed25519
            -o Ciphers=aes128-ctr
            -o MACs=hmac-sha2-256
          )
          log_file="$RUNNER_TEMP/school-production-readiness.log"
          timeout --signal=TERM --kill-after=15s 1500s \
            ssh -T "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
              "env RUN_ID='$GITHUB_RUN_ID' CANDIDATE_SHA='$CANDIDATE_SHA' CANDIDATE_IMAGE='$CANDIDATE_IMAGE' CANDIDATE_IMAGE_ID='$CANDIDATE_IMAGE_ID' SCHOOL_ORIGIN='$SCHOOL_ORIGIN' STAGING_ORIGIN='$STAGING_ORIGIN' bash -s" \
              <<'REMOTE' | tee "$log_file"
          set -Eeuo pipefail
          exec 9>/var/lock/school-1-11-production.lock
          flock -n 9

          production=school-1-11
          staging=school-1-11-staging
          preflight="school-1-11-design-readiness-$RUN_ID"
          preflight_data="school-1-11_design_readiness_${RUN_ID}_data"
          preflight_created=0
          data_created=0
          success=0

          case "$preflight:$preflight_data" in
            school-1-11-design-readiness-*:school-1-11_design_readiness_*_data) ;;
            *) printf 'Invalid readiness target names\n' >&2; exit 1 ;;
          esac

          cleanup() {
            rc=$?
            trap - EXIT
            set +e
            if [ "$preflight_created" -eq 1 ]; then
              docker rm -f "$preflight" >/dev/null 2>&1
            fi
            if [ "$data_created" -eq 1 ]; then
              docker volume rm "$preflight_data" >/dev/null 2>&1
            fi
            if [ "$success" -ne 1 ]; then
              printf 'SCHOOL_PRODUCTION_READINESS=FAIL\n' >&2
            fi
            exit "$rc"
          }
          trap cleanup EXIT

          env_value() {
            docker inspect "$1" --format '{{range .Config.Env}}{{println .}}{{end}}' |
              sed -n "s/^$2=//p" | head -n1
          }

          test -z "$(docker ps -aq --filter "name=^/$preflight$")"
          ! docker volume inspect "$preflight_data" >/dev/null 2>&1
          test "$(docker inspect "$production" --format '{{.State.Running}}')" = true
          test "$(docker inspect "$production" --format '{{.State.Health.Status}}')" = healthy
          production_started_before="$(docker inspect "$production" --format '{{.State.StartedAt}}')"
          curl -fsS --max-time 30 "$SCHOOL_ORIGIN/api/health" |
            grep -F '"status":"ok"' >/dev/null

          test "$(docker inspect "$staging" --format '{{.State.Running}}')" = true
          test "$(docker inspect "$staging" --format '{{.State.Health.Status}}')" = healthy
          test "$(docker inspect "$staging" --format '{{.Config.Image}}')" = "$CANDIDATE_IMAGE"
          test "$(docker inspect "$staging" --format '{{.Image}}')" = "$CANDIDATE_IMAGE_ID"
          test "$(docker inspect "$staging" --format '{{index .Config.Labels "school.candidate-sha"}}')" = "$CANDIDATE_SHA"
          curl -fsS --max-time 15 "$STAGING_ORIGIN/api/health" |
            grep -F '"status":"ok"' >/dev/null
          test "$(docker image inspect "$CANDIDATE_IMAGE" --format '{{.Id}}')" = "$CANDIDATE_IMAGE_ID"

          production_image_ref="$(docker inspect "$production" --format '{{.Config.Image}}')"
          production_image_id="$(docker inspect "$production" --format '{{.Image}}')"
          restart_policy="$(docker inspect "$production" --format '{{.HostConfig.RestartPolicy.Name}}')"
          network_mode="$(docker inspect "$production" --format '{{.HostConfig.NetworkMode}}')"
          port_binding="$(docker inspect "$production" | python3 -c 'import json,sys; d=json.load(sys.stdin)[0]; b=d["HostConfig"]["PortBindings"]["3000/tcp"][0]; print(b["HostIp"]+":"+b["HostPort"])')"
          data_volume="$(docker inspect "$production" --format '{{range .Mounts}}{{if eq .Destination "/data"}}{{.Name}}{{end}}{{end}}')"
          backup_volume="$(docker inspect "$production" --format '{{range .Mounts}}{{if eq .Destination "/backups"}}{{.Name}}{{end}}{{end}}')"
          security_opts="$(docker inspect "$production" --format '{{json .HostConfig.SecurityOpt}}')"
          health_test="$(docker inspect "$production" --format '{{json .Config.Healthcheck.Test}}')"
          secret="$(env_value "$production" CENTRAL_ACCESS_SECRET)"

          node_env="$(env_value "$production" NODE_ENV)"
          port_env="$(env_value "$production" PORT)"
          database_path="$(env_value "$production" DATABASE_PATH)"
          public_origin="$(env_value "$production" PUBLIC_APP_ORIGIN)"
          secret_length="${#secret}"

          printf 'SCHOOL_READINESS_OBSERVED_IMAGE_REF=%s\n' "$production_image_ref"
          printf 'SCHOOL_READINESS_OBSERVED_IMAGE_ID=%s\n' "$production_image_id"
          printf 'SCHOOL_READINESS_OBSERVED_RESTART=%s\n' "$restart_policy"
          printf 'SCHOOL_READINESS_OBSERVED_NETWORK=%s\n' "$network_mode"
          printf 'SCHOOL_READINESS_OBSERVED_BIND=%s\n' "$port_binding"
          printf 'SCHOOL_READINESS_OBSERVED_DATA_VOLUME=%s\n' "$data_volume"
          printf 'SCHOOL_READINESS_OBSERVED_BACKUP_VOLUME=%s\n' "$backup_volume"
          printf 'SCHOOL_READINESS_OBSERVED_SECURITY=%s\n' "$security_opts"
          printf 'SCHOOL_READINESS_OBSERVED_HEALTH_TEST=%s\n' "$health_test"
          printf 'SCHOOL_READINESS_OBSERVED_NODE_ENV=%s\n' "$node_env"
          printf 'SCHOOL_READINESS_OBSERVED_PORT_ENV=%s\n' "${port_env:-image-default}"
          printf 'SCHOOL_READINESS_OBSERVED_DATABASE_PATH=%s\n' "$database_path"
          printf 'SCHOOL_READINESS_OBSERVED_PUBLIC_ORIGIN=%s\n' "$public_origin"
          printf 'SCHOOL_READINESS_OBSERVED_SECRET_LENGTH=%s\n' "$secret_length"

          test -n "$production_image_ref"
          [[ "$production_image_id" =~ ^sha256:[a-f0-9]{64}$ ]]
          test "$restart_policy" = unless-stopped
          test -n "$network_mode"
          test -n "$port_binding"
          test -n "$data_volume"
          test -n "$backup_volume"
          case "$security_opts" in
            '["no-new-privileges:true"]'|'["no-new-privileges"]') ;;
            *) printf 'Unexpected security options\n' >&2; exit 1 ;;
          esac
          test "$health_test" != null
          test "$node_env" = production
          case "$port_env" in
            ""|3000) ;;
            *) printf 'Unexpected application port\n' >&2; exit 1 ;;
          esac
          test "$database_path" = /data/school-1-11.sqlite
          origin_repair_required=no
          case "$public_origin" in
            "$SCHOOL_ORIGIN") ;;
            https://school-188-225-47-207.sslip.io)
              origin_repair_required=yes
              ;;
            *)
              printf 'Unexpected production public Origin\n' >&2
              exit 1
              ;;
          esac
          test "$secret_length" -eq 64
          printf 'SCHOOL_READINESS_ORIGIN_REPAIR_REQUIRED=%s\n' "$origin_repair_required"

          backup_path="$(
            docker exec -e BACKUP_DIR=/backups/design-v1-cutover "$production" \
              node scripts/backup-db.mjs | tail -n1
          )"
          case "$backup_path" in
            /backups/design-v1-cutover/school-1-11-*.sqlite) ;;
            *) printf 'Unexpected cutover backup path\n' >&2; exit 1 ;;
          esac

          backup_proof="$(
            docker exec -i -e BACKUP_PATH="$backup_path" "$production" \
              node --input-type=module - <<'VERIFY_BACKUP'
          import { createHash } from 'node:crypto';
          import { readFileSync, statSync } from 'node:fs';
          import { DatabaseSync } from 'node:sqlite';
          const path = process.env.BACKUP_PATH;
          const stat = statSync(path);
          if (!stat.isFile() || stat.size < 4096) throw new Error('Cutover backup is empty');
          const db = new DatabaseSync(path, { readOnly: true });
          const rows = db.prepare('PRAGMA integrity_check').all();
          if (rows.length !== 1 || rows[0].integrity_check !== 'ok')
            throw new Error('Cutover backup integrity failed');
          db.close();
          const sha256 = createHash('sha256').update(readFileSync(path)).digest('hex');
          console.log(stat.size + ':' + sha256);
          VERIFY_BACKUP
          )"
          backup_bytes="${backup_proof%%:*}"
          backup_sha256="${backup_proof#*:}"
          [[ "$backup_bytes" =~ ^[0-9]+$ ]]
          [[ "$backup_sha256" =~ ^[a-f0-9]{64}$ ]]

          relative_backup="${backup_path#/backups/}"
          case "$relative_backup" in
            design-v1-cutover/school-1-11-*.sqlite) ;;
            *) exit 1 ;;
          esac

          docker volume create \
            --label school.system=school-1-11 \
            --label school.environment=production-readiness \
            --label school.run-id="$RUN_ID" \
            "$preflight_data" >/dev/null
          data_created=1

          docker run --rm --network none --user 0:0 \
            -e SOURCE_REL="$relative_backup" \
            -v "$backup_volume:/backup:ro" \
            -v "$preflight_data:/data" \
            --entrypoint node "$CANDIDATE_IMAGE" --input-type=module - <<'COPY_BACKUP'
          import { chmodSync, chownSync, copyFileSync } from 'node:fs';
          import { DatabaseSync } from 'node:sqlite';
          const rel = process.env.SOURCE_REL;
          if (!/^design-v1-cutover\/school-1-11-[0-9TZ-]+\.sqlite$/.test(rel))
            throw new Error('Invalid readiness backup path');
          const target = '/data/school-1-11.sqlite';
          copyFileSync('/backup/' + rel, target);
          chownSync('/data', 1001, 1001);
          chmodSync('/data', 0o750);
          chownSync(target, 1001, 1001);
          chmodSync(target, 0o640);
          const db = new DatabaseSync(target, { readOnly: true });
          const rows = db.prepare('PRAGMA integrity_check').all();
          if (rows.length !== 1 || rows[0].integrity_check !== 'ok')
            throw new Error('Readiness copy integrity failed');
          db.close();
          COPY_BACKUP

          preflight_secret="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          docker run -d \
            --name "$preflight" \
            --network none \
            --security-opt no-new-privileges:true \
            --health-cmd "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\"" \
            --health-interval 10s \
            --health-timeout 5s \
            --health-retries 9 \
            --health-start-period 20s \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e DATABASE_PATH=/data/school-1-11.sqlite \
            -e PUBLIC_APP_ORIGIN="$SCHOOL_ORIGIN" \
            -e CENTRAL_ACCESS_SECRET="$preflight_secret" \
            -v "$preflight_data:/data" \
            "$CANDIDATE_IMAGE" >/dev/null
          preflight_created=1

          ready=0
          for attempt in $(seq 1 90); do
            if [ "$(docker inspect "$preflight" --format '{{.State.Health.Status}}' 2>/dev/null || true)" = healthy ]; then
              ready=1
              break
            fi
            if [ "$(docker inspect "$preflight" --format '{{.State.Running}}' 2>/dev/null || true)" != true ]; then
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker logs "$preflight" --tail 120 >&2 || true
            exit 1
          fi

          docker exec -i -e EXPECTED_ORIGIN="$SCHOOL_ORIGIN" "$preflight" \
            node --input-type=module - <<'VERIFY_CANDIDATE'
          import { DatabaseSync } from 'node:sqlite';
          const db = new DatabaseSync('/data/school-1-11.sqlite', { readOnly: true });
          const rows = db.prepare('PRAGMA integrity_check').all();
          if (rows.length !== 1 || rows[0].integrity_check !== 'ok')
            throw new Error('Candidate DB integrity failed');
          const tableCount = db.prepare(
            "SELECT count(*) AS count FROM sqlite_master WHERE type='table'"
          ).get().count;
          db.close();

          const base = 'http://127.0.0.1:3000';
          const health = await fetch(base + '/api/health');
          if (!health.ok || !(await health.text()).includes('"status":"ok"'))
            throw new Error('Candidate health failed');
          const login = await fetch(base + '/login');
          const html = await login.text();
          if (!login.ok || !html.includes('data-design-code="v1"'))
            throw new Error('Candidate design flag missing');

          const body = JSON.stringify({
            login: '+79990000000',
            password: 'InvalidPassword1',
          });
          const accepted = await fetch(base + '/api/auth/login', {
            method: 'POST',
            headers: {
              origin: process.env.EXPECTED_ORIGIN,
              'content-type': 'application/json',
            },
            body,
          });
          const acceptedPayload = await accepted.json();
          if (
            accepted.status !== 401 ||
            acceptedPayload.error !== 'Неверный логин или пароль'
          ) throw new Error('Canonical Origin contract failed');

          const rejected = await fetch(base + '/api/auth/login', {
            method: 'POST',
            headers: {
              origin: 'https://evil.invalid',
              'content-type': 'application/json',
            },
            body,
          });
          const rejectedPayload = await rejected.json();
          if (
            rejected.status !== 401 ||
            rejectedPayload.error !== 'Запрос отклонён системой безопасности'
          ) throw new Error('Foreign Origin contract failed');
          console.log('SCHOOL_PRODUCTION_READINESS_PREFLIGHT=OK tables=' + tableCount);
          VERIFY_CANDIDATE

          docker rm -f "$preflight" >/dev/null
          preflight_created=0
          docker volume rm "$preflight_data" >/dev/null
          data_created=0

          test "$(docker inspect "$production" --format '{{.State.StartedAt}}')" = "$production_started_before"
          test "$(docker inspect "$production" --format '{{.Image}}')" = "$production_image_id"
          test "$(docker inspect "$production" --format '{{.State.Health.Status}}')" = healthy
          curl -fsS --max-time 30 "$SCHOOL_ORIGIN/api/health" |
            grep -F '"status":"ok"' >/dev/null

          success=1
          printf 'SCHOOL_PRODUCTION_READINESS=PASS\n'
          printf 'SCHOOL_PRODUCTION_IMAGE_REF=%s\n' "$production_image_ref"
          printf 'SCHOOL_PRODUCTION_IMAGE_ID=%s\n' "$production_image_id"
          printf 'SCHOOL_PRODUCTION_RESTART_POLICY=%s\n' "$restart_policy"
          printf 'SCHOOL_PRODUCTION_NETWORK=%s\n' "$network_mode"
          printf 'SCHOOL_PRODUCTION_BIND=%s\n' "$port_binding"
          printf 'SCHOOL_PRODUCTION_DATA_VOLUME=%s\n' "$data_volume"
          printf 'SCHOOL_PRODUCTION_BACKUP_VOLUME=%s\n' "$backup_volume"
          printf 'SCHOOL_PRODUCTION_SECURITY=%s\n' "$security_opts"
          printf 'SCHOOL_PRODUCTION_HEALTH_TEST=%s\n' "$health_test"
          printf 'SCHOOL_PRODUCTION_BACKUP_PATH=%s\n' "$backup_path"
          printf 'SCHOOL_PRODUCTION_BACKUP_BYTES=%s\n' "$backup_bytes"
          printf 'SCHOOL_PRODUCTION_BACKUP_SHA256=%s\n' "$backup_sha256"
          printf 'SCHOOL_PRODUCTION_RESTARTED=no\n'
          REMOTE

          test "$(sed -n 's/^SCHOOL_PRODUCTION_READINESS=//p' "$log_file" | tail -n1)" = PASS
          printf 'readiness=PASS\n' >> "$GITHUB_OUTPUT"

      - name: Publish production readiness result
        if: always()
        shell: bash
        env:
          READINESS: ${{ steps.readiness.outputs.readiness }}
        run: |
          {
            echo '## School diary design v1 production readiness'
            echo
            printf -- '- Candidate SHA: %s\n' "$CANDIDATE_SHA"
            printf -- '- Candidate image: %s\n' "$CANDIDATE_IMAGE_ID"
            printf -- '- Immutable evidence: verified\n'
            printf -- '- Fresh production backup: verified\n'
            printf -- '- Candidate against production backup: verified\n'
            printf -- '- Production restarted: no\n'
            printf -- '- Readiness: %s\n' "${READINESS:-FAIL}"
            printf -- '- Result: %s\n' '${{ job.status }}'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report readiness status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.sha,
              state: process.env.JOB_STATUS === "success" ? "success" : "failure",
              context: "school-diary/design-v1-production-readiness",
              description: "Design v1 production readiness " + process.env.JOB_STATUS,
              target_url:
                process.env.GITHUB_SERVER_URL + "/" +
                process.env.GITHUB_REPOSITORY + "/actions/runs/" +
                process.env.GITHUB_RUN_ID,
            });
