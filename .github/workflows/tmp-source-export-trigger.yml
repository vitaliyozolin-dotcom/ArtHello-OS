name: Temporary source export trigger

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-source-export-trigger.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main controls
        uses: actions/checkout@v4
        with:
          path: main
      - name: Check out exact School source
        uses: actions/checkout@v4
        with:
          ref: 034be78c5cb30402ebb7d3786133d0f3be390be9
          path: school
      - name: Package source
        shell: bash
        run: |
          set -Eeuo pipefail
          tar --exclude-vcs --exclude='node_modules' --exclude='.next' -czf source-export.tgz main school
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: temporary-source-export
          path: source-export.tgz
          if-no-files-found: error
          retention-days: 1
