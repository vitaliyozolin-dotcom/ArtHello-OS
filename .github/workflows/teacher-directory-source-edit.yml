name: Prepare teacher directory source correction
on:
  push:
    branches: [fix/school-teacher-directory-20261001]
permissions:
  contents: write
concurrency:
  group: teacher-directory-source-edit-20261001
  cancel-in-progress: false
jobs:
  edit-and-test:
    if: github.repository == 'vitaliyozolin-dotcom/ArtHello-OS' && github.ref == 'refs/heads/fix/school-teacher-directory-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/school-teacher-directory-20261001
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Apply exact reviewed edit and run directory regressions
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 ops/teacher-directory-edit.py
          node --experimental-strip-types --test tests/teacher-directory.test.mjs tests/directory-snapshot.test.mjs tests/central-family-directory.test.mjs
          git diff --check
      - name: Save tested source on this unprotected correction branch only
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/teacher-directory-source-edit.yml ops/teacher-directory-edit.py
          git add app/school-app.tsx app/teacher-directory.ts tests/teacher-directory.test.mjs
          git commit -m 'fix(school): separate pending directory imports from teaching staff'
          git push origin HEAD:refs/heads/fix/school-teacher-directory-20261001
          printf 'EDITED_SOURCE_SHA=%s\n' "$(git rev-parse HEAD)"
          printf 'EDITED_TREE_SHA=%s\n' "$(git rev-parse HEAD^{tree})"
          printf 'PRODUCTION_CHANGED=false\n'
