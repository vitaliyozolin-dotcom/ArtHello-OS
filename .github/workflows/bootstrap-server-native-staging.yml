name: Bootstrap server-native ArtHello STAGING

on:
  push:
    branches: [develop]
    paths:
      - 'ops/pull-deploy/**'
      - '.github/workflows/bootstrap-server-native-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: [self-hosted, arthello-gateway]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 1
          persist-credentials: false

      - name: Bootstrap standalone Docker controller
        shell: bash
        run: |
          set -Eeuo pipefail
          docker version >/dev/null

          token_source="$(docker run --rm -v /:/host:ro alpine:3.20 sh -lc '
            for p in \
              /srv/arthello/shared/github-http/token \
              /srv/arthello/shared/github-release-token \
              /root/.config/arthello/github-token \
              /home/github-runner/.config/arthello/github-token
            do
              if [ -s "/host$p" ]; then printf "%s" "$p"; exit 0; fi
            done
            exit 1
          ')" || true
          if [ -z "$token_source" ]; then
            echo 'NO_PERSISTENT_GITHUB_TOKEN_FOUND'
            exit 42
          fi

          bootstrap_source="$(docker run --rm -v /:/host:ro alpine:3.20 sh -lc '
            for p in \
              /home/github-runner/.config/arthello/bootstrap-password \
              /root/.config/arthello/bootstrap-password
            do
              if [ -s "/host$p" ]; then printf "%s" "$p"; exit 0; fi
            done
            exit 1
          ')" || true
          if [ -z "$bootstrap_source" ]; then
            echo 'NO_BOOTSTRAP_PASSWORD_FOUND'
            exit 43
          fi

          docker build -f ops/pull-deploy/Dockerfile.controller -t arthello-staging-controller:local .
          docker volume create arthello-staging-controller-state >/dev/null
          docker rm -f arthello-staging-controller >/dev/null 2>&1 || true
          docker run -d \
            --name arthello-staging-controller \
            --restart unless-stopped \
            -e ARTHELLO_POLL_INTERVAL=60 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$token_source:/etc/arthello/github-token:ro" \
            -v "$bootstrap_source:/run/secrets/bootstrap-password:ro" \
            -v arthello-staging-controller-state:/srv/arthello-staging-pull \
            arthello-staging-controller:local >/dev/null

          sleep 5
          test "$(docker inspect arthello-staging-controller --format '{{.State.Running}}')" = true
          docker logs --tail 120 arthello-staging-controller
