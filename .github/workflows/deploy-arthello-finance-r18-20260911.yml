        assert_exact_runtime_env "$(docker inspect "$candidate" --format '{{range .Config.Env}}{{println .}}{{end}}')" RELEASE_SHA "$RELEASE_SHA"
        assert_exact_runtime_env "$(docker inspect "$candidate" --format '{{range .Config.Env}}{{println .}}{{end}}')" TOCHKA_AUTOSYNC_ACTIVATION_ID "$autosync_activation_id"
        docker inspect "$candidate" | jq -e --arg control "$backup_control_volume" --arg activation "$bank_activation_volume" '
          [.[0].Mounts[] | select(.Destination == "/var/lib/arthello-v52-backup-control" or .Destination == "/var/lib/arthello-v52-tochka-activation")] as $mounts |
          ($mounts | length) == 2 and all($mounts[]; .Type == "volume" and .RW == false) and
          any($mounts[]; .Destination == "/var/lib/arthello-v52-backup-control" and .Name == $control) and
          any($mounts[]; .Destination == "/var/lib/arthello-v52-tochka-activation" and .Name == $activation)
        ' >/dev/null
        wait_local_candidate "$candidate"
        assert_active_d1_file_descriptors "$candidate" candidate
        assert_backup_consumers candidate
        docker pause "$candidate" >/dev/null
        candidate_paused=1
        assert_backup_consumers candidate-paused
        snapshot_volume "$DATA_VOLUME" "$work/live-after"
        python3 "$inventory_script" "$work/live-after" \
          --github-output "$work/inventory-live-after.env" >/dev/null
        test "$(sed -n 's/^encrypted_credentials_present=//p' "$work/inventory-live-after.env")" = "$encrypted_credentials_present"
        test "$(sed -n 's/^encrypted_credentials_count=//p' "$work/inventory-live-after.env")" = "$encrypted_credentials_count"
        test "$(sed -n 's/^encrypted_credentials_digest=//p' "$work/inventory-live-after.env")" = "$encrypted_credentials_digest"
        docker unpause "$candidate" >/dev/null
        candidate_paused=0

        verify_public "$run_key-internal" http://127.0.0.1:8081
        verify_school_sync_secret before-route-activation
        require_current_main_release
        apply_previous_restart_policy "$candidate"
        test "$(docker inspect "$candidate" --format '{{.State.Running}}')" = true
        test "$(docker inspect "$candidate" --format '{{range .Mounts}}{{if eq .Destination "/data"}}{{.Name}}{{end}}{{end}}')" = "$DATA_VOLUME"
        test "$(docker inspect "$candidate" --format '{{index .Config.Labels "arthello.release.sha"}}')" = "$RELEASE_SHA"

        # D080_MAINTENANCE_ACTIVATION_BEGIN
        # D084_GATEWAY_PRE_ACTIVATION_BEGIN
        test "$(docker inspect "$CADDY_CONTAINER" --format '{{.Id}}')" = "$(jq -er '.gatewayId' "$work/gateway-evidence.json")"
        python3 -I .github/scripts/d083-maintenance-route.py verify-gateway \
          --input "$work/external-routes.before.caddy" --main-config "$work/Caddyfile.before" \
          --gateway-env-evidence "$work/gateway-evidence.json"
        # D084_GATEWAY_PRE_ACTIVATION_END
        require_current_main_release
        docker cp "$work/external-routes.maintenance.caddy" "$CADDY_CONTAINER:$maintenance_route_new"
        docker exec "$CADDY_CONTAINER" sh -ceu \
          "sed 's#/data/external-routes.caddy#$maintenance_route_new#' /etc/caddy/Caddyfile > '$maintenance_config_new'"
        if ! docker exec "$CADDY_CONTAINER" caddy validate --config "$maintenance_config_new" --adapter caddyfile >/dev/null 2>&1; then
          printf 'ARTHELLO_D080_MAINTENANCE_CONFIG=BLOCKED\n' >&2
          exit 1
        fi
        original_route_sha="$(sha256sum "$work/external-routes.before.caddy" | cut -d ' ' -f 1)"
        maintenance_route_sha="$(sha256sum "$work/external-routes.maintenance.caddy" | cut -d ' ' -f 1)"
        candidate_route_sha="$(sha256sum "$work/external-routes.candidate.caddy" | cut -d ' ' -f 1)"
        candidate_id="$(docker inspect "$candidate" --format '{{.Id}}')"
        candidate_browser_id="$(docker image inspect "arthello-e2e:$BROWSER_SOURCE_SHA" --format '{{.Id}}')"
        install -d -m 0700 "$secret_dir/release-state"
        python3 -I - "$SCHOOL_REPAIR_RECEIPT_FILE" "$work/school-repair-receipt.json" <<'D080_RETAIN_REPAIR'
        import os, pathlib, stat, sys
        source, target = map(pathlib.Path, sys.argv[1:])
        assert source.resolve() == source
        fd = os.open(source, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
        info = os.fstat(fd)
        assert stat.S_ISREG(info.st_mode) and info.st_uid == os.getuid() and stat.S_IMODE(info.st_mode) == 0o600 and info.st_size <= 65536
        with os.fdopen(fd, 'rb') as stream: body = stream.read(65537)
        assert len(body) == info.st_size
        fd = os.open(target, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
        with os.fdopen(fd, 'wb') as stream:
            stream.write(body)
            stream.flush()
            os.fsync(stream.fileno())
        D080_RETAIN_REPAIR
        require_current_main_release
        assert_backup_consumers candidate
        backup_adoption_seal_attempted=1
        backup_runtime seal | tee "$work/backup-adoption-sealed.json"
        sealed_adoption="$(backup_controller digest)"
        backup_adoption_digest="$(jq -er 'select(.state == "sealed") | .backupAdoptionStateSha256' <<<"$sealed_adoption")"
        [[ "$backup_adoption_digest" =~ ^[a-f0-9]{64}$ ]]
        python3 -I - "$work/candidate-context.json" \
          "$RELEASE_SHA" \
          "$EXPECTED_TREE" \
          "$GITHUB_RUN_ID" \
          "$GITHUB_RUN_ATTEMPT" \
          "$candidate_id" \
          "$candidate" \
          "$live_id" \
          "$live_name" \
          "$immutable_image_id" \
          "$VALIDATED_RUNTIME_FINGERPRINT" \
          "$DATA_VOLUME" \
          "$rollback_volume" \
          "$backup_worker" \
          "$backup_volume" \
          "$backup_control_volume" \
          "$bank_activation_volume" \
          "$autosync_activation_id" \
          "$BROWSER_SOURCE_SHA" \
          "$candidate_browser_id" \
          "$BROWSER_FINGERPRINT" \
          "$original_route_sha" \
          "$maintenance_route_sha" \
          "$candidate_route_sha" \
          "$work" \
          "$work/external-routes.before.caddy" \
          "$work/external-routes.maintenance.caddy" \
          "$work/external-routes.candidate.caddy" \
          "$gate_nonce_file" \
          "$work/school-repair-receipt.json" \
          "$SCHOOL_REPAIR_CONFIG_SHA256" \
          "$OBSERVED_READONLY_SCHOOL_SHA" \
          "$backup_runtime_state" \
          "$backup_adoption_digest" <<'D080_PRIVATE_CONTEXT'
        import hashlib, json, os, sys
        keys = ['releaseSha', 'sourceTree', 'runId', 'runAttempt', 'candidateContainerId', 'candidateName', 'previousContainerId', 'previousName', 'imageId', 'runtimeFingerprint', 'dataVolume', 'rollbackVolume', 'backupWorker', 'backupVolume', 'backupControlVolume', 'bankActivationVolume', 'bankActivationId', 'browserSourceSha', 'browserImageId', 'browserFingerprint', 'originalRouteSha256', 'maintenanceRouteSha256', 'publicRouteSha256', 'workDirectory', 'originalRouteFile', 'maintenanceRouteFile', 'publicRouteFile', 'gateNonceFile', 'schoolRepairReceiptFile', 'schoolRepairConfigSha256', 'schoolSha', 'backupRuntimeStateFile', 'backupAdoptionStateSha256']
        assert len(sys.argv[2:]) == len(keys)
        context = dict(zip(keys, sys.argv[2:]))
        with open(context['schoolRepairReceiptFile'], encoding='utf-8') as receipt_file:
            repair = json.load(receipt_file)
        context['schoolRepairReceiptSha256'] = hashlib.sha256((json.dumps(repair, sort_keys=True, separators=(',', ':')) + '\n').encode()).hexdigest()
        # D084_GATEWAY_CONTEXT_BEGIN
        context['gatewayEvidenceFile'] = os.path.join(context['workDirectory'], 'gateway-evidence.json')
        with open(context['gatewayEvidenceFile'], encoding='utf-8') as gateway_file:
            gateway_evidence = json.load(gateway_file)
        context['gatewayEvidenceSha256'] = hashlib.sha256((json.dumps(gateway_evidence, sort_keys=True, separators=(',', ':')) + '\n').encode()).hexdigest()
        # D084_GATEWAY_CONTEXT_END
        descriptor = os.open(sys.argv[1], os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
        with os.fdopen(descriptor, 'w', encoding='utf-8') as stream:
            json.dump(context, stream, separators=(',', ':'))
            stream.write('\n')
            stream.flush()
            os.fsync(stream.fileno())
        D080_PRIVATE_CONTEXT
        python3 -I .github/scripts/r18-candidate-state.py begin \
          --context "$work/candidate-context.json" --state "$candidate_state_file"
        # The durable boundary is complete before any route can permit real authentication.
        candidate_auth_started=1
        require_current_main_release
        route_changed=1
        docker exec \
          -e EXPECTED_CURRENT_SHA="$original_route_sha" \
          -e CANDIDATE_ROUTE="$maintenance_route_new" \
          "$CADDY_CONTAINER" sh -ceu '
            current_sha="$(sha256sum /data/external-routes.caddy | cut -d " " -f 1)"
            test "$current_sha" = "$EXPECTED_CURRENT_SHA"
            mv "$CANDIDATE_ROUTE" /data/external-routes.caddy
          '
        if ! docker exec "$CADDY_CONTAINER" caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile >/dev/null 2>&1; then
          printf 'ARTHELLO_D080_MAINTENANCE_RELOAD=BLOCKED\n' >&2
          exit 1
        fi
        complete_candidate_release
        # D080_MAINTENANCE_ACTIVATION_END

        candidate_id="$(docker inspect "$candidate" --format '{{.Id}}')"
        release_active=1
        trap - EXIT INT TERM HUP
        cleanup_transient
    - name: School diagnostic and real browser acceptance after R18 cutover
      timeout-minutes: 15
      shell: bash
      env:
        SSH_PRIVATE_KEY: ${{ secrets.ARTHELLO_RU_SSH_PRIVATE_KEY }}
        DEPLOY_HOST: ${{ secrets.ARTHELLO_RU_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.ARTHELLO_RU_DEPLOY_USER }}
        DEPLOY_PORT: ${{ secrets.ARTHELLO_RU_DEPLOY_PORT }}
        GH_TOKEN: ${{ github.token }}
        ARTHELLO_E2E_LOGIN: ${{ secrets.ARTHELLO_E2E_LOGIN }}
        ARTHELLO_E2E_PASSWORD: ${{ secrets.ARTHELLO_E2E_PASSWORD }}
        BROWSER_PHASE: after
        SCHOOL_REPAIR_CONFIG_SHA256: ${{ steps.school_repair.outputs.config_sha256 }}
        SCHOOL_REPAIR_RECEIPT_FILE: ${{ runner.temp }}/school-r3-receipt-${{ github.run_id }}-${{ github.run_attempt }}.json
      run: |+
        set -Eeuo pipefail
        umask 077
        : "${SSH_PRIVATE_KEY:?missing protected School SSH key}"
        : "${DEPLOY_HOST:?missing protected School deploy host}"
        : "${DEPLOY_USER:?missing protected School deploy user}"
        [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]{0,252}$ ]]
        [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]]
        deploy_port="${DEPLOY_PORT:-2222}"
        [[ "$deploy_port" =~ ^[0-9]{1,5}$ ]]
        test "$deploy_port" -ge 1
        test "$deploy_port" -le 65535

        ssh_dir="$RUNNER_TEMP/arthello-school-sync-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        case "$ssh_dir" in
          "$RUNNER_TEMP"/arthello-school-sync-*) ;;
          *) echo 'Unsafe School SSH work path' >&2; exit 1 ;;
        esac
        cleanup_school_ssh() {
          rm -f -- \
            "$ssh_dir/id_ed25519" \
            "$ssh_dir/known_hosts" \
            "$ssh_dir/known_hosts.scan" \
            "$ssh_dir/school-sync-probe-wrong.json" \
            "$ssh_dir/school-sync-probe-wrong.headers" \
            "$ssh_dir/school-sync-probe.json" \
            "$ssh_dir/school-sync-probe.headers" \
            >/dev/null 2>&1 || true
          rmdir -- "$ssh_dir" >/dev/null 2>&1 || true
        }
        trap cleanup_school_ssh EXIT
        trap 'exit 130' INT
        trap 'exit 143' TERM
        trap 'exit 129' HUP
        test ! -e "$ssh_dir"
        test ! -L "$ssh_dir"
        install -m 0700 -d "$ssh_dir"
        printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_dir/id_ed25519"
        unset SSH_PRIVATE_KEY
        chmod 0600 "$ssh_dir/id_ed25519"
        ssh-keygen -y -f "$ssh_dir/id_ed25519" >/dev/null

        scan="$ssh_dir/known_hosts.scan"
        : > "$scan"
        chmod 0600 "$scan"
        for attempt in 1 2 3; do
          timeout --signal=TERM --kill-after=5s 150s \
            ssh -p "$deploy_port" \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile="$scan" \
              -o GlobalKnownHostsFile=/dev/null \
              -o PreferredAuthentications=none \
              -o PubkeyAuthentication=no \
              -o PasswordAuthentication=no \
              -o KbdInteractiveAuthentication=no \
              -o ConnectTimeout=140 \
              -o HostKeyAlgorithms=ssh-ed25519 \
              "$DEPLOY_USER@$DEPLOY_HOST" true \
              </dev/null >/dev/null 2>&1 || true
          test -s "$scan" && break
          sleep 5
        done
        test -s "$scan"
        fingerprint="$(ssh-keygen -lf "$scan" -E sha256 | awk '{print $2; exit}')"
        test "$fingerprint" = 'SHA256:/kBNohTF+5g8U+jQt+PzOCoWZ9yCSFjBnEP3Oc3MwRI'
        mv "$scan" "$ssh_dir/known_hosts"

        ssh_options=(
          -T
          -p "$deploy_port"
          -i "$ssh_dir/id_ed25519"
          -o IdentitiesOnly=yes
          -o PreferredAuthentications=publickey
          -o PasswordAuthentication=no
          -o KbdInteractiveAuthentication=no
          -o BatchMode=yes
          -o StrictHostKeyChecking=yes
          -o UserKnownHostsFile="$ssh_dir/known_hosts"
          -o GlobalKnownHostsFile=/dev/null
          -o ConnectTimeout=140
          -o ServerAliveInterval=10
          -o ServerAliveCountMax=30
          -o IPQoS=none
          -o Compression=no
          -o KexAlgorithms=curve25519-sha256
          -o HostKeyAlgorithms=ssh-ed25519
          -o PubkeyAcceptedAlgorithms=ssh-ed25519
          -o Ciphers=aes128-ctr
          -o MACs=hmac-sha2-256
        )
        timeout --signal=TERM --kill-after=5s 180s \
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" true \
          </dev/null >/dev/null

        diagnostic_file="$RUNNER_TEMP/arthello-school-sso-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.jsonl"
        test -s .github/scripts/school-sso-readonly-diagnostic.sh
        bash .github/scripts/school-sso-readonly-diagnostic.sh --self-test
        diagnostic_payload="$(base64 -w0 .github/scripts/school-sso-readonly-diagnostic.sh)"
        timeout --signal=TERM --kill-after=5s 180s \
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
          "printf '%s' '$diagnostic_payload' | base64 -d | bash" \
          </dev/null | tee "$diagnostic_file"
        python3 -I .github/scripts/r18-live-baseline.py school "$diagnostic_file"
        legacy_probe_payload="$(base64 -w0 .github/scripts/r2-alfacrm-env-presence.sh)"
        timeout --signal=TERM --kill-after=5s 60s   ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST"   "printf '%s' '$legacy_probe_payload' | base64 -d | bash -s -- --school-legacy"   </dev/null
        mapfile -t acceptance_live_ids < <(docker ps --filter 'name=^/arthello-direct-' --format '{{.ID}}')
        test "${#acceptance_live_ids[@]}" -eq 1
        observed_arthello_sha="$(docker inspect "${acceptance_live_ids[0]}" --format '{{index .Config.Labels "arthello.release.sha"}}')"
        [[ "$observed_arthello_sha" =~ ^[a-f0-9]{40}$ ]]
        bash .github/scripts/r2-alfacrm-env-presence.sh --current-arthello "${acceptance_live_ids[0]}"

        SCHOOL_DIAGNOSTIC_FILE="$diagnostic_file" OBSERVED_LIVE_ARTHELLO_SHA="$observed_arthello_sha" \
          python3 -I .github/scripts/run-r18-live-browser.py

    - name: Remove only this downloaded temporary archive
      if: always()
      shell: bash
      run: |
        set -Eeuo pipefail
        archive="$RUNNER_TEMP/browser-bundle-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/browser.tar.gz"
        rm -f -- "$archive"
    - name: Remove temporary School SSH material
      if: always()
      shell: bash
      run: |
        set -Eeuo pipefail
        ssh_dir="$RUNNER_TEMP/arthello-school-sync-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        case "$ssh_dir" in
          "$RUNNER_TEMP"/arthello-school-sync-*) ;;
          *) echo 'Unsafe School SSH cleanup path' >&2; exit 1 ;;
        esac
        rm -f -- \
          "$ssh_dir/id_ed25519" \
          "$ssh_dir/known_hosts" \
          "$ssh_dir/known_hosts.scan" \
          "$ssh_dir/school-sync-probe-wrong.json" \
          "$ssh_dir/school-sync-probe-wrong.headers" \
          "$ssh_dir/school-sync-probe.json" \
          "$ssh_dir/school-sync-probe.headers"
        rmdir -- "$ssh_dir" >/dev/null 2>&1 || true
    - name: Production summary
      if: always()
      shell: bash
      env:
        QUALITY_RUN: ${{ steps.provenance.outputs.quality_run }}
        VERIFY_RUN: ${{ steps.provenance.outputs.verify_run }}
        RELEASE_CONTAINER: ${{ steps.cutover.outputs.release_container }}
        ROLLBACK_VOLUME: ${{ steps.cutover.outputs.rollback_volume }}
        PROOF_RUN: ${{ steps.provenance.outputs.proof_run }}
        R14_RUN: ${{ steps.provenance.outputs.r14_run }}
        SCHOOL_REPAIR_CONFIG: ${{ steps.school_repair.outputs.config_sha256 }}
      run: |
        if ! {
          echo '## ArtHello R14 production deployment'
          echo
          echo "- Commit: $RELEASE_SHA"
          echo "- Quality run: $QUALITY_RUN"
          echo "- R14 regression run: $R14_RUN"
          echo "- Proof run: $PROOF_RUN"
          echo "- School relay config: ${SCHOOL_REPAIR_CONFIG:-not verified}"
          echo "- Relay verification is separate from natural browser SSO acceptance."
          echo "- v52 verification run: $VERIFY_RUN"
          echo "- Public: $PUBLIC_URL"
          echo "- Release container: ${RELEASE_CONTAINER:-not reported; inspect activation state before recovery}"
          echo "- Rollback volume: ${ROLLBACK_VOLUME:-not reported}"
          echo "- Result: ${{ job.status }}"
          echo "- After candidate authentication begins, automatic snapshot restore is forbidden; preserve current data."
          echo "- Failed candidate acceptance holds maintenance and the same candidate database."
          echo "- New-release natural diary browser acceptance remains mandatory."
        } >> "$GITHUB_STEP_SUMMARY"; then
          printf '::warning::Unable to write deployment summary\n'
        fi
