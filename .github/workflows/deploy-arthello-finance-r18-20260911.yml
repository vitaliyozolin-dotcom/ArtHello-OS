# D151: trigger the merged ArtHello Pay UI publication through a user-authored main push.
# Accepted R17 predecessor and complete R15/R13/R12 backup history are preserved.
# Prove the canonical D1 chain before recognizing its exact backup-control consumers.
# No database restore after seal/authentication/public boundaries.
name: Deploy ArtHello Pay R18 D151
'on':
  workflow_run:
    workflows:
    - Verify ArtHello v52 release
    types:
    - completed
    branches:
    - main
permissions:
  actions: read
  contents: read
  deployments: read
  pull-requests: read
concurrency:
  group: gateway-38-55-arthello-production
  cancel-in-progress: false
  queue: max
env:
  EXPECTED_REPOSITORY: vitaliyozolin-dotcom/ArtHello-OS
  EXPECTED_RELEASE_HEAD: codex/pay-production-trigger-d151-20260912
  EXPECTED_RELEASE_PR: '0'
  PREVIOUS_RELEASE_SHA: 'b9bf317fe4d2dfe8f39a7866c6c7a79ba0736a00'
  ACCEPTED_RELEASE_SHA: ff8559254faaedade63a9ee7567a45686d08c13a
  ACCEPTED_RELEASE_TREE: 6aeb7e6879b786a434d12f026f765bcaf9acb5a4
  ACCEPTED_RELEASE_RUN_ID: '34495273615'
  ACCEPTED_ATLAS_RUN_ID: '34529324387'
  ACCEPTED_ATLAS_SHA: 0c08fb32c53e787ab0d30f2dfcc8f22bdbf7b09b
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
  TRIGGER_VERIFY_RUN_ID: ${{ github.event.workflow_run.id }}
  PUBLIC_URL: https://arthello-188-225-38-55.sslip.io
  PUBLIC_HOST: arthello-188-225-38-55.sslip.io
  PAY_URL: https://pay-188-225-38-55.sslip.io
  PAY_HOST: pay-188-225-38-55.sslip.io
  SCHOOL_URL: https://school-188-225-38-55.sslip.io
  CADDY_CONTAINER: stroios-caddy-1
  DATA_VOLUME: arthello-direct-v44-data
  CHECKED_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
  BROWSER_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
jobs:
  bundle:
    if: |-
      github.event_name == 'workflow_run' && github.repository == 'vitaliyozolin-dotcom/ArtHello-OS' && github.repository_owner == 'vitaliyozolin-dotcom' && github.event.workflow_run.name == 'Verify ArtHello v52 release' && (
        github.event.workflow_run.path == '.github/workflows/verify-arthello-v52.yml' ||
        github.event.workflow_run.path == '.github/workflows/verify-arthello-v52.yml@main'
      ) && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.repository.full_name == github.repository && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.actor.login == 'vitaliyozolin-dotcom' && github.event.workflow_run.triggering_actor.login == 'vitaliyozolin-dotcom' && github.run_attempt == 1 && (
        github.event.workflow_run.pull_requests[0] == null ||
        (
          github.event.workflow_run.pull_requests[0].head.ref == 'codex/pay-production-trigger-d151-20260912' &&
          github.event.workflow_run.pull_requests[0].number == fromJSON('0') &&
          github.event.workflow_run.pull_requests[0].head.repo.id == github.event.repository.id &&
          github.event.workflow_run.pull_requests[0].base.ref == 'main' &&
          github.event.workflow_run.pull_requests[0].base.repo.id == github.event.repository.id &&
          github.event.workflow_run.pull_requests[1] == null
        )
      ) && startsWith(github.event.workflow_run.head_commit.message, 'D151: trigger ArtHello Pay production publication')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      archive_name: ${{ steps.bundle.outputs.archive_name }}
      archive_sha: ${{ steps.bundle.outputs.archive_sha }}
      fingerprint: ${{ steps.bundle.outputs.fingerprint }}
      archive_bytes: ${{ steps.bundle.outputs.archive_bytes }}
      expanded_bytes: ${{ steps.bundle.outputs.expanded_bytes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CHECKED_SOURCE_SHA }}
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Test browser policy and install locked package off the VPS
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$CHECKED_SOURCE_SHA"
          node --test scripts/test/server-browser.test.mjs scripts/test/browser-proxy.test.mjs scripts/test/retire-d145-browser.test.mjs
          bash -n scripts/run-server-browser.sh
          corepack enable
          corepack pnpm@11.7.0 --dir deploy/browser install --ignore-workspace --frozen-lockfile
      - name: Build immutable bundle and exercise Chromium sandbox and natural flow fixture
        id: bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          tag="arthello-e2e:$CHECKED_SOURCE_SHA"
          docker build --platform linux/amd64 --build-arg "SOURCE_SHA=$CHECKED_SOURCE_SHA" -t "$tag" deploy/browser
          image_id="$(docker image inspect "$tag" --format '{{.Id}}')"
          timeout --signal=TERM --kill-after=10 90 docker run --rm --init \
            --pull never --user 1000:1000 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --security-opt "seccomp=$PWD/deploy/browser/seccomp.json" \
            --memory 1g --memory-swap 1g --cpus 1 --pids-limit 256 --shm-size 128m \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m,uid=1000,gid=1000,mode=700 \
            "$image_id" --smoke
          mkdir -p "$RUNNER_TEMP/browser-bundle"
          docker save "$tag" | gzip -1 -n > "$RUNNER_TEMP/browser-bundle/browser.tar.gz"
          archive_sha="$(sha256sum "$RUNNER_TEMP/browser-bundle/browser.tar.gz" | cut -d ' ' -f 1)"
          fingerprint="$(docker image inspect "$image_id" | jq -cS -f deploy/v52/maintenance/image-runtime-fingerprint.jq | sha256sum | cut -d ' ' -f 1)"
          printf 'archive_sha=%s\nfingerprint=%s\n' "$archive_sha" "$fingerprint" >> "$GITHUB_OUTPUT"
          printf 'archive_name=server-browser-%s-%s-%s\n' "$CHECKED_SOURCE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          archive_bytes="$(stat -c %s "$RUNNER_TEMP/browser-bundle/browser.tar.gz")"
          expanded_bytes="$(gzip -cd "$RUNNER_TEMP/browser-bundle/browser.tar.gz" | wc -c)"
          printf 'archive_bytes=%s\nexpanded_bytes=%s\n' "$archive_bytes" "$expanded_bytes" >> "$GITHUB_OUTPUT"
          printf 'BROWSER_BUNDLE_BYTES archive=%s expanded=%s\n' "$archive_bytes" "$expanded_bytes"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.bundle.outputs.archive_name }}
          path: ${{ runner.temp }}/browser-bundle/browser.tar.gz
          compression-level: 0
          retention-days: 2
          if-no-files-found: error

  deploy:
    needs: bundle
    env:
      BROWSER_FINGERPRINT: ${{ needs.bundle.outputs.fingerprint }}
    if: |-
      github.event_name == 'workflow_run' && github.repository == 'vitaliyozolin-dotcom/ArtHello-OS' && github.repository_owner == 'vitaliyozolin-dotcom' && github.event.workflow_run.name == 'Verify ArtHello v52 release' && (
        github.event.workflow_run.path == '.github/workflows/verify-arthello-v52.yml' ||
        github.event.workflow_run.path == '.github/workflows/verify-arthello-v52.yml@main'
      ) && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.repository.full_name == github.repository && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.actor.login == 'vitaliyozolin-dotcom' && github.event.workflow_run.triggering_actor.login == 'vitaliyozolin-dotcom' && github.run_attempt == 1 && (
        github.event.workflow_run.pull_requests[0] == null ||
        (
          github.event.workflow_run.pull_requests[0].head.ref == 'codex/pay-production-trigger-d151-20260912' &&
          github.event.workflow_run.pull_requests[0].number == fromJSON('0') &&
          github.event.workflow_run.pull_requests[0].head.repo.id == github.event.repository.id &&
          github.event.workflow_run.pull_requests[0].base.ref == 'main' &&
          github.event.workflow_run.pull_requests[0].base.repo.id == github.event.repository.id &&
          github.event.workflow_run.pull_requests[1] == null
        )
      )
    runs-on:
    - self-hosted
    - linux
    - x64
    - arthello-gateway
    timeout-minutes: 240
    environment: production-ru
    concurrency:
      group: school-1-11-production
      cancel-in-progress: false
      queue: max
    steps:
    - name: Verify R18 identity and accepted R17 success history
      timeout-minutes: 4
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -Eeuo pipefail
        test "$GITHUB_EVENT_NAME" = workflow_run
        test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
        [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
        [[ "$TRIGGER_VERIFY_RUN_ID" =~ ^[0-9]+$ ]]
        [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
        [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
        [[ "$EXPECTED_RELEASE_PR" =~ ^[0-9]+$ ]]
        [[ "$PREVIOUS_RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
        test "$RELEASE_SHA" != "$PREVIOUS_RELEASE_SHA"

        api="https://api.github.com/repos/$GITHUB_REPOSITORY"
        headers=(
          --header "Authorization: Bearer $GH_TOKEN"
          --header "Accept: application/vnd.github+json"
          --header "X-GitHub-Api-Version: 2022-11-28"
        )
        trigger_json="$(curl --fail-with-body --silent --show-error --max-time 30 \
          "${headers[@]}" "$api/actions/runs/$TRIGGER_VERIFY_RUN_ID")"
        jq -e \
          --argjson run_id "$TRIGGER_VERIFY_RUN_ID" \
          --arg sha "$RELEASE_SHA" \
          --arg repository "$EXPECTED_REPOSITORY" '
            .id == $run_id and
            .name == "Verify ArtHello v52 release" and
            (.path == ".github/workflows/verify-arthello-v52.yml" or
             .path == ".github/workflows/verify-arthello-v52.yml@main") and
            .event == "push" and
            .head_branch == "main" and
            .head_sha == $sha and
            .run_attempt == 1 and
            .status == "completed" and
            .conclusion == "success" and
            .repository.full_name == $repository and
            .head_repository.full_name == $repository and
            .actor.login == "vitaliyozolin-dotcom" and
            .triggering_actor.login == "vitaliyozolin-dotcom"
          ' <<<"$trigger_json" >/dev/null

        release_pr_json="$(curl --fail-with-body --silent --show-error --max-time 30 \
          "${headers[@]}" "$api/pulls/$EXPECTED_RELEASE_PR")"
        jq -e \
          --arg sha "$RELEASE_SHA" \
          --arg repository "$EXPECTED_REPOSITORY" \
          --arg expected_head "$EXPECTED_RELEASE_HEAD" \
          --argjson expected_pr "$EXPECTED_RELEASE_PR" '
            .number == $expected_pr and
            .state == "closed" and
            .merged == true and
            .merged_at != null and
            .base.ref == "main" and
            .base.repo.full_name == $repository and
            .head.ref == $expected_head and
            .head.repo.full_name == $repository and
            .merge_commit_sha == $sha and
            .user.login == "vitaliyozolin-dotcom" and
            .merged_by.login == "vitaliyozolin-dotcom"
          ' <<<"$release_pr_json" >/dev/null

        current_main_json="$(curl --fail-with-body --silent --show-error --max-time 30 \
          "${headers[@]}" "$api/git/ref/heads/main")"
        jq -e --arg sha "$RELEASE_SHA" '.ref == "refs/heads/main" and .object.type == "commit" and .object.sha == $sha' \
          <<<"$current_main_json" >/dev/null

        accepted_run_json="$(curl --fail-with-body --silent --show-error --max-time 30 \
          "${headers[@]}" "$api/actions/runs/$ACCEPTED_RELEASE_RUN_ID")"
        jq -e \
          --argjson run_id "$ACCEPTED_RELEASE_RUN_ID" \
          --arg sha "$ACCEPTED_RELEASE_SHA" \
          --arg repository "$EXPECTED_REPOSITORY" '
            .id == $run_id and
            .name == "Deploy ArtHello Finance R17 D113" and
            .path == ".github/workflows/deploy-arthello-finance-r17-20260910.yml" and
            .event == "workflow_run" and
            .head_branch == "main" and
            .head_sha == $sha and
            .run_attempt == 1 and
            .status == "completed" and
            .conclusion == "success" and
            .repository.full_name == $repository and
            .head_repository.full_name == $repository and
            .actor.login == "vitaliyozolin-dotcom" and
            .triggering_actor.login == "vitaliyozolin-dotcom"
          ' <<<"$accepted_run_json" >/dev/null

        accepted_commit_json="$(curl --fail-with-body --silent --show-error --max-time 30 \
          "${headers[@]}" "$api/git/commits/$ACCEPTED_RELEASE_SHA")"
        jq -e --arg sha "$ACCEPTED_RELEASE_SHA" --arg tree "$ACCEPTED_RELEASE_TREE" \
          '.sha == $sha and .tree.sha == $tree and .verification.verified == true' \
          <<<"$accepted_commit_json" >/dev/null

        accepted_jobs_json="$(curl --fail-with-body --silent --show-error --max-time 30 \
          "${headers[@]}" "$api/actions/runs/$ACCEPTED_RELEASE_RUN_ID/attempts/1/jobs?per_page=100")"
        jq -e --arg sha "$ACCEPTED_RELEASE_SHA" --argjson run "$ACCEPTED_RELEASE_RUN_ID" '
          .total_count == 2 and (.jobs | length) == 2 and
          ([.jobs[].name] | sort) == ["bundle", "deploy"] and
          all(.jobs[];
            .run_id == $run and .run_attempt == 1 and .head_sha == $sha and
            .head_branch == "main" and .status == "completed" and .conclusion == "success") and
          ([.jobs[] | select(.name == "bundle") | .id] == [102932011920]) and
          ([.jobs[] | select(.name == "deploy") | .id] == [102932695823])
        ' <<<"$accepted_jobs_json" >/dev/null

        accepted_atlas_run_json="$(curl --fail-with-body --silent --show-error --max-time 30 \
          "${headers[@]}" "$api/actions/runs/$ACCEPTED_ATLAS_RUN_ID")"
        jq -e \
          --argjson run_id "$ACCEPTED_ATLAS_RUN_ID" \
          --arg sha "$ACCEPTED_ATLAS_SHA" \
          --arg repository "$EXPECTED_REPOSITORY" '
            .id == $run_id and
            .name == "Deploy Atlas diary D122" and
            .path == ".github/workflows/deploy-atlas-d122.yml" and
            .event == "workflow_run" and
            .head_branch == "main" and
            .head_sha == $sha and
            .run_attempt == 1 and
            .status == "completed" and
            .conclusion == "success" and
            .repository.full_name == $repository and
            .head_repository.full_name == $repository and
            .actor.login == "vitaliyozolin-dotcom" and
            .triggering_actor.login == "vitaliyozolin-dotcom"
          ' <<<"$accepted_atlas_run_json" >/dev/null

        accepted_atlas_jobs_json="$(curl --fail-with-body --silent --show-error --max-time 30 \
          "${headers[@]}" "$api/actions/runs/$ACCEPTED_ATLAS_RUN_ID/attempts/1/jobs?per_page=100")"
        jq -e --arg sha "$ACCEPTED_ATLAS_SHA" --argjson run "$ACCEPTED_ATLAS_RUN_ID" '
          .total_count == 2 and (.jobs | length) == 2 and
          ([.jobs[].name] | sort) == ["bundle", "deploy"] and
          all(.jobs[];
            .run_id == $run and .run_attempt == 1 and .head_sha == $sha and
            .head_branch == "main" and .status == "completed" and .conclusion == "success") and
          ([.jobs[] | select(.name == "bundle") | .id] == [103045976241]) and
          ([.jobs[] | select(.name == "deploy") | .id] == [103046467809])
        ' <<<"$accepted_atlas_jobs_json" >/dev/null

        current_history_json="$(curl --fail-with-body --silent --show-error --max-time 30 \
          "${headers[@]}" "$api/actions/workflows/deploy-arthello-finance-r18-20260911.yml/runs?event=workflow_run&head_sha=$RELEASE_SHA&per_page=100")"
        jq -e --argjson run "$GITHUB_RUN_ID" '
          .total_count == 1 and (.workflow_runs | length) == 1 and
          .workflow_runs[0].id == $run and .workflow_runs[0].run_attempt == 1 and
          .workflow_runs[0].status == "in_progress" and .workflow_runs[0].conclusion == null
        ' <<<"$current_history_json" >/dev/null
        printf 'R9_RESUME_CANDIDATE=0\n' >> "$GITHUB_ENV"

        # GitHub evaluates the protected Environment before starting this job.
        # Its configuration is enforced by the platform and statically pinned
        # by the hosted verification workflow; GITHUB_TOKEN does not need
        # repository-administration permission to re-read that configuration.
        printf 'ARTHELLO_PRODUCTION_AUTHORIZATION=PLATFORM_ENVIRONMENT\n'
    - name: Wait for exact main Quality Proof and v52 verification
      id: provenance
      timeout-minutes: 28
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -Eeuo pipefail
        api="https://api.github.com/repos/$GITHUB_REPOSITORY"
        headers=(
          --header "Authorization: Bearer $GH_TOKEN"
          --header "Accept: application/vnd.github+json"
          --header "X-GitHub-Api-Version: 2022-11-28"
        )

        ref_json="$(curl --fail-with-body --silent --show-error --max-time 30 \
          "${headers[@]}" "$api/git/ref/heads/main")"
        test "$(jq -r '.object.sha' <<<"$ref_json")" = "$RELEASE_SHA"

        commit_json="$(curl --fail-with-body --silent --show-error --max-time 30 \
          "${headers[@]}" "$api/commits/$RELEASE_SHA")"
        jq -e \
          --arg sha "$RELEASE_SHA" \
          --arg previous_sha "$PREVIOUS_RELEASE_SHA" \
          '.sha == $sha and
           .commit.verification.verified == true and
           (.parents | length) == 1 and
           .parents[0].sha == $previous_sha' <<<"$commit_json" >/dev/null
        tree_sha="$(jq -r '.commit.tree.sha' <<<"$commit_json")"
        [[ "$tree_sha" =~ ^[a-f0-9]{40}$ ]]

        release_pr_json="$(curl --fail-with-body --silent --show-error --max-time 30 \
          "${headers[@]}" "$api/pulls/$EXPECTED_RELEASE_PR")"
        jq -e \
          --arg sha "$RELEASE_SHA" \
          --arg repository "$EXPECTED_REPOSITORY" \
          --arg expected_head "$EXPECTED_RELEASE_HEAD" \
          --argjson expected_pr "$EXPECTED_RELEASE_PR" \
          '.number == $expected_pr and
           .state == "closed" and
           .merged == true and
           .merged_at != null and
           .base.ref == "main" and
           .base.repo.full_name == $repository and
           .head.ref == $expected_head and
           .head.repo.full_name == $repository and
           .merge_commit_sha == $sha and
           .user.login == "vitaliyozolin-dotcom" and
           .merged_by.login == "vitaliyozolin-dotcom"' <<<"$release_pr_json" >/dev/null

        workflow_success() {
          local workflow_file="$1"
          local workflow_name="$2"
          local required_jobs_csv="$3"
          local expected_run_id="${4:-}"
          local runs_json run_json run_id jobs_json
          runs_json="$(curl --fail-with-body --silent --show-error --max-time 30 \
            "${headers[@]}" \
            "$api/actions/workflows/$workflow_file/runs?branch=main&event=push&head_sha=$RELEASE_SHA&per_page=20")" || return 1
          run_json="$(jq -c \
            --arg sha "$RELEASE_SHA" \
            --arg name "$workflow_name" \
            --arg path ".github/workflows/$workflow_file" \
            --arg repository "$EXPECTED_REPOSITORY" \
            '[.workflow_runs[] | select(
              .head_sha == $sha and
              .head_branch == "main" and
              .event == "push" and
              .name == $name and
              (.path == $path or .path == ($path + "@main")) and
              .repository.full_name == $repository
            )] | sort_by(.id) | last // empty' <<<"$runs_json")"
          test -n "$run_json" || return 1
          jq -e '.run_attempt == 1 and .status == "completed" and .conclusion == "success"' <<<"$run_json" >/dev/null || return 1
          run_id="$(jq -r '.id' <<<"$run_json")"
          [[ "$run_id" =~ ^[0-9]+$ ]] || return 1
          if [ -n "$expected_run_id" ]; then test "$run_id" = "$expected_run_id" || return 1; fi
          jobs_json="$(curl --fail-with-body --silent --show-error --max-time 30 \
            "${headers[@]}" "$api/actions/runs/$run_id/jobs?per_page=100")" || return 1
          jq -e --arg sha "$RELEASE_SHA" --argjson run "$run_id" '
          .total_count == (.jobs | length) and
          all(.jobs[]; .head_sha == $sha and .run_id == $run and .run_attempt == 1 and
            .status == "completed" and .conclusion == "success" and
            .labels == ["ubuntu-latest"] and .runner_group_name == "GitHub Actions")
        ' <<<"$jobs_json" >/dev/null || return 1
        IFS=',' read -r -a required_jobs <<<"$required_jobs_csv"
          for required_job in "${required_jobs[@]}"; do
            jq -e --arg name "$required_job" \
              '[.jobs[] | select(.name == $name and .status == "completed" and .conclusion == "success")] | length == 1' \
              <<<"$jobs_json" >/dev/null || return 1
          done
          printf '%s' "$run_id"
        }

        quality_run=""
        verify_run=""
        proof_run=""
        for attempt in $(seq 1 100); do
          if [ -z "$quality_run" ]; then
            quality_run="$(workflow_success quality.yml 'Quality gates' 'secret-scan,test,d084-candidate-tests,d085-candidate-tests' || true)"
          fi
          if [ -z "$verify_run" ]; then
            verify_run="$(workflow_success verify-arthello-v52.yml 'Verify ArtHello v52 release' 'verify-v52' "$TRIGGER_VERIFY_RUN_ID" || true)"
          fi
          if [ -z "$proof_run" ]; then
            proof_run="$(workflow_success proof-gates.yml 'ArtHello Proof Gates' 'prove' || true)"
          fi
          if [ -n "$quality_run" ] && [ -n "$verify_run" ] && [ -n "$proof_run" ]; then
            break
          fi
          sleep 15
        done
        test -n "$quality_run"
        test -n "$verify_run"
        test -n "$proof_run"

        ref_json="$(curl --fail-with-body --silent --show-error --max-time 30 \
          "${headers[@]}" "$api/git/ref/heads/main")"
        test "$(jq -r '.object.sha' <<<"$ref_json")" = "$RELEASE_SHA"

        printf 'tree_sha=%s\nquality_run=%s\nverify_run=%s\nproof_run=%s\n' \
          "$tree_sha" "$quality_run" "$verify_run" "$proof_run" >> "$GITHUB_OUTPUT"
        printf 'ARTHELLO_EXACT_SHA_GATES=VERIFIED\n'
    - name: Check out exact verified release
      timeout-minutes: 3
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event.workflow_run.head_sha }}
        fetch-depth: 1
        clean: true
        persist-credentials: false
    - name: Verify R18 checkout and release contracts
      timeout-minutes: 4
      env:
        EXPECTED_TREE: ${{ steps.provenance.outputs.tree_sha }}
      run: |
        set -Eeuo pipefail
        test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
        test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
        git diff --exit-code --quiet HEAD --
        sha256sum -c <<'PINNED_RELEASE_HELPERS'
        4cdcd2771994fe8ea11bb731fa1ef5f997da489adfc89e3e78baff271096d659  deploy/v52/recovery-r18/r17-controller.yml
