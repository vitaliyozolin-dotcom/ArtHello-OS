name: Deploy ArtHello self-hosted RU

on:
  push:
    branches: [main]
    paths:
      - deploy/v44/**
      - .github/workflows/deploy-arthello-direct-38-55.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-38-55-arthello-production
  cancel-in-progress: false

env:
  PUBLIC_URL: https://arthello-188-225-38-55.sslip.io
  PUBLIC_HOST: arthello-188-225-38-55.sslip.io
  SCHOOL_URL: https://school-188-225-38-55.sslip.io
  CADDY_CONTAINER: stroios-caddy-1

jobs:
  deploy:
    runs-on:
      - self-hosted
      - linux
      - x64
      - arthello-gateway
    timeout-minutes: 45
    environment: production-ru

    steps:
      - name: Checkout exact release
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Preflight gateway
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname -I | tr ' ' '\n' | grep -Fx '188.225.38.55' | head -n1)" = '188.225.38.55'
          docker version >/dev/null
          docker compose version >/dev/null
          test "$(docker inspect --format '{{.State.Running}}' "$CADDY_CONTAINER")" = true
          docker exec "$CADDY_CONTAINER" sh -lc \
            "grep -F 'import /data/external-routes.caddy' /etc/caddy/Caddyfile >/dev/null"
          docker exec "$CADDY_CONTAINER" test -s /data/external-routes.caddy
          curl --fail --silent --show-error --max-time 20 \
            "$SCHOOL_URL/api/health" | grep -F '"status":"ok"' >/dev/null
          printf 'ARTHELLO_PREFLIGHT=OK\n'

      - name: Build candidate locally
        shell: bash
        run: |
          set -Eeuo pipefail
          image="arthello-direct:$GITHUB_SHA"
          docker build \
            --file deploy/v44/Dockerfile \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image" \
            .
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          printf 'ARTHELLO_BUILD=OK image=%s\n' "$image"

      - name: Start and verify candidate
        id: candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          image="arthello-direct:$GITHUB_SHA"
          candidate="arthello-direct-$GITHUB_RUN_ID"
          network="$(docker inspect "$CADDY_CONTAINER" --format '{{range $name, $_ := .NetworkSettings.Networks}}{{println $name}}{{end}}' | head -n1)"
          test -n "$network"

          docker rm -f "$candidate" >/dev/null 2>&1 || true
          docker volume create arthello-direct-v44-data >/dev/null
          docker run -d \
            --name "$candidate" \
            --restart unless-stopped \
            --read-only \
            --tmpfs /tmp \
            --network "$network" \
            -e NODE_ENV=production \
            -e PORT=8081 \
            -e ARTHELLO_D1_PATH=/data/d1 \
            -v arthello-direct-v44-data:/data \
            "$image" >/dev/null

          ready=0
          for attempt in $(seq 1 90); do
            if docker exec "$candidate" node -e \
              "fetch('http://127.0.0.1:8081/api/health').then(async r=>{if(!r.ok)process.exit(1);const t=await r.text();if(!t.includes('ok'))process.exit(1)}).catch(()=>process.exit(1))"; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker logs --tail 150 "$candidate" >&2 || true
            docker rm -f "$candidate" >/dev/null 2>&1 || true
            exit 1
          fi

          printf 'name=%s\n' "$candidate" >> "$GITHUB_OUTPUT"
          printf 'ARTHELLO_CANDIDATE=HEALTHY name=%s\n' "$candidate"

      - name: Atomic Caddy cutover with rollback
        id: cutover
        shell: bash
        env:
          CANDIDATE: ${{ steps.candidate.outputs.name }}
        run: |
          set -Eeuo pipefail
          test -n "$CANDIDATE"
          work="$RUNNER_TEMP/arthello-cutover-$GITHUB_RUN_ID"
          mkdir -p "$work"
          backup="$work/external-routes.before.caddy"
          candidate_routes="$work/external-routes.candidate.caddy"

          docker cp "$CADDY_CONTAINER:/data/external-routes.caddy" "$backup"
          test -s "$backup"

          rollback() {
            rc=$?
            if [ "$rc" -ne 0 ]; then
              printf 'ARTHELLO_ROLLBACK=START\n' >&2
              docker cp "$backup" "$CADDY_CONTAINER:/data/external-routes.caddy" >/dev/null 2>&1 || true
              docker exec "$CADDY_CONTAINER" caddy reload \
                --config /etc/caddy/Caddyfile --adapter caddyfile >/dev/null 2>&1 || true
              docker rm -f "$CANDIDATE" >/dev/null 2>&1 || true
              printf 'ARTHELLO_ROLLBACK=COMPLETE\n' >&2
            fi
            exit "$rc"
          }
          trap rollback EXIT

          cat > "$candidate_routes" <<EOF
          $PUBLIC_HOST {
            encode zstd gzip
            reverse_proxy $CANDIDATE:8081
            header {
              Strict-Transport-Security "max-age=31536000; includeSubDomains"
              X-Frame-Options "DENY"
              X-Content-Type-Options "nosniff"
              Referrer-Policy "same-origin"
              -Server
            }
          }

          school-188-225-38-55.sslip.io {
            encode zstd gzip
            reverse_proxy 188.225.47.207:443 {
              header_up Host school-188-225-47-207.sslip.io
              transport http {
                tls
                tls_server_name arthello-origin.internal
                tls_trust_pool file /data/arthello-origin-root.crt
              }
            }
            header {
              Strict-Transport-Security "max-age=31536000; includeSubDomains"
              X-Frame-Options "DENY"
              X-Content-Type-Options "nosniff"
              Referrer-Policy "same-origin"
              -Server
            }
          }
          EOF

          docker cp "$candidate_routes" "$CADDY_CONTAINER:/data/external-routes.caddy.new"
          docker exec "$CADDY_CONTAINER" sh -lc \
            "sed 's#/data/external-routes.caddy#/data/external-routes.caddy.new#' /etc/caddy/Caddyfile > /tmp/Caddyfile.arthello-candidate"
          docker exec "$CADDY_CONTAINER" caddy validate \
            --config /tmp/Caddyfile.arthello-candidate --adapter caddyfile >/dev/null

          docker exec "$CADDY_CONTAINER" sh -lc \
            'mv /data/external-routes.caddy.new /data/external-routes.caddy'
          docker exec "$CADDY_CONTAINER" caddy reload \
            --config /etc/caddy/Caddyfile --adapter caddyfile >/dev/null

          public_ok=0
          for attempt in $(seq 1 60); do
            nonce="$GITHUB_RUN_ID-$attempt"
            body="$(curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' "$PUBLIC_URL/?probe=$nonce" || true)"
            health="$(curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' "$PUBLIC_URL/api/health?probe=$nonce" || true)"
            if grep -F 'ArtHello' <<<"$body" >/dev/null \
              && grep -F '"status":"ok"' <<<"$health" >/dev/null; then
              public_ok=1
              break
            fi
            sleep 3
          done
          test "$public_ok" -eq 1

          curl --fail --silent --show-error --max-time 20 \
            "$SCHOOL_URL/api/health" | grep -F '"status":"ok"' >/dev/null

          trap - EXIT
          printf 'ARTHELLO_PUBLIC=OK\nSCHOOL_ROUTE_PRESERVED=OK\n'

      - name: Remove superseded ArtHello containers
        if: success()
        shell: bash
        env:
          CANDIDATE: ${{ steps.candidate.outputs.name }}
        run: |
          set -Eeuo pipefail
          while IFS= read -r old; do
            [ -n "$old" ] || continue
            [ "$old" = "$CANDIDATE" ] && continue
            docker rm -f "$old" >/dev/null 2>&1 || true
          done < <(docker ps -a --filter 'name=^/arthello-direct-' --format '{{.Names}}')

          docker image prune -f >/dev/null || true
          printf 'ARTHELLO_RELEASE_SHA=%s\nARTHELLO_RELEASE_CONTAINER=%s\n' "$GITHUB_SHA" "$CANDIDATE"

      - name: Production summary
        if: always()
        shell: bash
        run: |
          {
            echo '## ArtHello production deployment'
            echo
            echo "- Runner: arthello-gateway / 188.225.38.55"
            echo "- Commit: $GITHUB_SHA"
            echo "- Public: $PUBLIC_URL"
            echo "- School guard: $SCHOOL_URL"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
