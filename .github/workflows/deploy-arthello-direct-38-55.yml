name: Deploy ArtHello self-hosted RU

on:
  push:
    branches: [main]
    paths:
      - deploy/v52/**
      - .github/workflows/deploy-arthello-direct-38-55.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: gateway-38-55-arthello-production
  cancel-in-progress: false

env:
  PUBLIC_URL: https://arthello-188-225-38-55.sslip.io
  PUBLIC_HOST: arthello-188-225-38-55.sslip.io
  SCHOOL_URL: https://school-188-225-38-55.sslip.io
  CADDY_CONTAINER: stroios-caddy-1

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, arthello-gateway]
    timeout-minutes: 45
    environment: production-ru

    steps:
      - name: Checkout exact release
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Preflight gateway
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname -I | tr ' ' '\n' | grep -Fx '188.225.38.55' | head -n1)" = '188.225.38.55'
          docker version >/dev/null
          docker compose version >/dev/null
          test "$(docker inspect --format '{{.State.Running}}' "$CADDY_CONTAINER")" = true
          docker exec "$CADDY_CONTAINER" sh -lc "grep -F 'import /data/external-routes.caddy' /etc/caddy/Caddyfile >/dev/null"
          docker exec "$CADDY_CONTAINER" test -s /data/external-routes.caddy
          curl -fsS --max-time 20 "$SCHOOL_URL/api/health" | grep -F '"status":"ok"' >/dev/null
          printf 'ARTHELLO_PREFLIGHT=OK\n'

      - name: Inventory production data (read only)
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t live_containers < <(docker ps --filter 'name=^/arthello-direct-' --format '{{.Names}}')
          test "${#live_containers[@]}" -eq 1
          live="${live_containers[0]}"
          image="$(docker inspect "$live" --format '{{.Config.Image}}')"
          test -n "$image"
          test "$(docker inspect "$live" --format '{{range .Mounts}}{{if eq .Destination "/data"}}{{.Name}}{{end}}{{end}}')" = 'arthello-direct-v44-data'

          work="$RUNNER_TEMP/arthello-inventory-$GITHUB_RUN_ID"
          helper="arthello-inventory-$GITHUB_RUN_ID"
          snapshot="$work/d1"
          paused=0
          cleanup_inventory() {
            rc=$?
            docker rm -f "$helper" >/dev/null 2>&1 || true
            if [ "$paused" -eq 1 ]; then docker unpause "$live" >/dev/null 2>&1 || true; fi
            exit "$rc"
          }
          trap cleanup_inventory EXIT

          mkdir -p "$snapshot"
          docker pause "$live" >/dev/null
          paused=1
          docker create --name "$helper" --read-only -v arthello-direct-v44-data:/data:ro "$image" true >/dev/null
          docker cp "$helper:/data/d1/." "$snapshot"
          docker unpause "$live" >/dev/null
          paused=0
          docker rm -f "$helper" >/dev/null
          python3 deploy/v52/maintenance/production-data-inventory.py "$snapshot"
          curl -fsS --max-time 20 "$PUBLIC_URL/api/health" | grep -F '"status":"ok"' >/dev/null
          printf 'ARTHELLO_PRODUCTION_INVENTORY=OK\n'
          trap - EXIT

      - name: Build candidate locally
        shell: bash
        run: |
          set -Eeuo pipefail
          image="arthello-direct:$GITHUB_SHA"
          docker build --file deploy/v52/Dockerfile --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag "$image" .
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          printf 'ARTHELLO_BUILD=OK image=%s\n' "$image"

      - name: Start and verify candidate
        id: candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          image="arthello-direct:$GITHUB_SHA"
          candidate="arthello-direct-$GITHUB_RUN_ID"
          network="$(docker inspect "$CADDY_CONTAINER" --format '{{range $name, $_ := .NetworkSettings.Networks}}{{println $name}}{{end}}' | head -n1)"
          test -n "$network"

          secret_dir="$HOME/.config/arthello"
          secret_file="$secret_dir/bootstrap-password"
          mkdir -p "$secret_dir"
          chmod 700 "$secret_dir"
          if [ ! -s "$secret_file" ]; then
            umask 077
            python3 -c 'import secrets; print(secrets.token_urlsafe(24), end="")' > "$secret_file"
          fi
          chmod 600 "$secret_file"
          bootstrap_password="$(cat "$secret_file")"
          test -n "$bootstrap_password"
          echo "::add-mask::$bootstrap_password"

          docker rm -f "$candidate" >/dev/null 2>&1 || true
          docker volume create arthello-direct-v44-data >/dev/null
          docker run -d \
            --name "$candidate" \
            --restart unless-stopped \
            --read-only \
            --tmpfs /tmp \
            --tmpfs /app/node_modules/.mf:rw,uid=1000,gid=1000,mode=0700 \
            --network "$network" \
            -e NODE_ENV=production \
            -e PORT=8081 \
            -e ARTHELLO_D1_PATH=/data/d1 \
            -e ARTHELLO_BOOTSTRAP_LOGIN=owner \
            -e ARTHELLO_BOOTSTRAP_PASSWORD="$bootstrap_password" \
            -v arthello-direct-v44-data:/data \
            "$image" >/dev/null

          ready=0
          for attempt in $(seq 1 90); do
            if docker exec -i "$candidate" node - <<'NODE'
          const base = 'http://127.0.0.1:8081';
          try {
            const health = await fetch(base + '/api/health');
            if (!health.ok || !(await health.text()).includes('"status":"ok"')) process.exit(1);
            const root = await fetch(base + '/');
            if (!root.ok) process.exit(1);
            const html = await root.text();
            const refs = [...html.matchAll(/(?:src|href)="(\/assets\/[^"]+)"/g)].map((m) => m[1]);
            if (refs.length < 2) process.exit(1);
            for (const path of [...new Set(refs)]) {
              const asset = await fetch(base + path);
              if (!asset.ok) process.exit(1);
            }
            const me = await fetch(base + '/api/auth/me');
            if (me.status !== 401) process.exit(1);
            const forgedSettings = await fetch(base + '/api/settings', {
              headers: {
                'oai-authenticated-user-email': 'vitaliyozolin@gmail.com',
                'x-arthello-role': 'OWNER',
              },
            });
            if (forgedSettings.status !== 401) process.exit(1);
          } catch { process.exit(1); }
          NODE
            then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker logs --tail 200 "$candidate" >&2 || true
            docker rm -f "$candidate" >/dev/null 2>&1 || true
            exit 1
          fi

          printf 'name=%s\n' "$candidate" >> "$GITHUB_OUTPUT"
          printf 'ARTHELLO_CANDIDATE=READY_WITH_ASSETS_AND_AUTH name=%s\n' "$candidate"

      - name: Atomic Caddy cutover with rollback
        shell: bash
        env:
          CANDIDATE: ${{ steps.candidate.outputs.name }}
        run: |
          set -Eeuo pipefail
          test -n "$CANDIDATE"
          work="$RUNNER_TEMP/arthello-cutover-$GITHUB_RUN_ID"
          mkdir -p "$work"
          backup="$work/external-routes.before.caddy"
          candidate_routes="$work/external-routes.candidate.caddy"
          docker cp "$CADDY_CONTAINER:/data/external-routes.caddy" "$backup"
          test -s "$backup"

          rollback() {
            rc=$?
            if [ "$rc" -ne 0 ]; then
              printf 'ARTHELLO_ROLLBACK=START\n' >&2
              docker cp "$backup" "$CADDY_CONTAINER:/data/external-routes.caddy" >/dev/null 2>&1 || true
              docker exec "$CADDY_CONTAINER" caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile >/dev/null 2>&1 || true
              docker rm -f "$CANDIDATE" >/dev/null 2>&1 || true
              printf 'ARTHELLO_ROLLBACK=COMPLETE\n' >&2
            fi
            exit "$rc"
          }
          trap rollback EXIT

          cat > "$candidate_routes" <<EOF
          $PUBLIC_HOST {
            encode zstd gzip
            reverse_proxy $CANDIDATE:8081
            header {
              Strict-Transport-Security "max-age=31536000; includeSubDomains"
              X-Frame-Options "DENY"
              X-Content-Type-Options "nosniff"
              Referrer-Policy "same-origin"
              -Server
            }
          }

          school-188-225-38-55.sslip.io {
            encode zstd gzip
            reverse_proxy 188.225.47.207:443 {
              header_up Host school-188-225-47-207.sslip.io
              transport http {
                tls
                tls_server_name arthello-origin.internal
                tls_trust_pool file /data/arthello-origin-root.crt
              }
            }
            header {
              Strict-Transport-Security "max-age=31536000; includeSubDomains"
              X-Frame-Options "DENY"
              X-Content-Type-Options "nosniff"
              Referrer-Policy "same-origin"
              -Server
            }
          }
          EOF

          docker cp "$candidate_routes" "$CADDY_CONTAINER:/data/external-routes.caddy.new"
          docker exec "$CADDY_CONTAINER" sh -lc "sed 's#/data/external-routes.caddy#/data/external-routes.caddy.new#' /etc/caddy/Caddyfile > /tmp/Caddyfile.arthello-candidate"
          docker exec "$CADDY_CONTAINER" caddy validate --config /tmp/Caddyfile.arthello-candidate --adapter caddyfile >/dev/null
          docker exec "$CADDY_CONTAINER" sh -lc 'mv /data/external-routes.caddy.new /data/external-routes.caddy'
          docker exec "$CADDY_CONTAINER" caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile >/dev/null

          public_ok=0
          for attempt in $(seq 1 40); do
            if docker exec -i \
              -e PUBLIC_URL="$PUBLIC_URL" \
              -e SCHOOL_URL="$SCHOOL_URL" \
              -e PROBE="$GITHUB_RUN_ID-$attempt" \
              "$CANDIDATE" node - <<'NODE'
          const base = process.env.PUBLIC_URL;
          const school = process.env.SCHOOL_URL;
          try {
            const root = await fetch(`${base}/?probe=${process.env.PROBE}`, { headers: { 'cache-control': 'no-cache' } });
            const html = await root.text();
            const refs = [...html.matchAll(/(?:src|href)="(\/assets\/[^"]+)"/g)].map((m) => m[1]);
            if (!root.ok || refs.length < 2) process.exit(1);
            for (const path of [...new Set(refs)]) {
              const asset = await fetch(base + path, { headers: { 'cache-control': 'no-cache' } });
              if (!asset.ok) process.exit(1);
            }
            const health = await fetch(base + '/api/health', { headers: { 'cache-control': 'no-cache' } });
            if (!health.ok || !(await health.text()).includes('"status":"ok"')) process.exit(1);
            const me = await fetch(base + '/api/auth/me', { headers: { 'cache-control': 'no-cache' } });
            if (me.status !== 401) process.exit(1);
            const forgedSettings = await fetch(base + '/api/settings', {
              headers: {
                'cache-control': 'no-cache',
                'oai-authenticated-user-email': 'vitaliyozolin@gmail.com',
                'x-arthello-role': 'OWNER',
              },
            });
            if (forgedSettings.status !== 401) process.exit(1);
            const schoolHealth = await fetch(school + '/api/health', { headers: { 'cache-control': 'no-cache' } });
            if (!schoolHealth.ok || !(await schoolHealth.text()).includes('"status":"ok"')) process.exit(1);
          } catch { process.exit(1); }
          NODE
            then
              public_ok=1
              break
            fi
            sleep 3
          done
          test "$public_ok" -eq 1
          printf 'ARTHELLO_PUBLIC_ASSETS=OK\nARTHELLO_PUBLIC_AUTH=OK\nSCHOOL_ROUTE_PRESERVED=OK\n'
          trap - EXIT

      - name: Remove superseded ArtHello containers
        if: success()
        shell: bash
        env:
          CANDIDATE: ${{ steps.candidate.outputs.name }}
        run: |
          set -Eeuo pipefail
          while IFS= read -r old; do
            [ -n "$old" ] || continue
            [ "$old" = "$CANDIDATE" ] && continue
            docker rm -f "$old" >/dev/null 2>&1 || true
          done < <(docker ps -a --filter 'name=^/arthello-direct-' --format '{{.Names}}')
          docker image prune -f >/dev/null || true
          printf 'ARTHELLO_RELEASE_SHA=%s\nARTHELLO_RELEASE_CONTAINER=%s\n' "$GITHUB_SHA" "$CANDIDATE"

      - name: Production summary
        if: always()
        shell: bash
        run: |
          {
            echo '## ArtHello production deployment'
            echo
            echo "- Runner: arthello-gateway / 188.225.38.55"
            echo "- Commit: $GITHUB_SHA"
            echo "- Public: $PUBLIC_URL"
            echo "- School guard: $SCHOOL_URL"
            echo "- Acceptance: real asset loads + auth endpoint + health + School guard"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish deployment ledger
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_STATUS: ${{ job.status }}
          LEDGER_ISSUE: "159"
        run: |
          set -Eeuo pipefail
          payload="$(python3 - <<'PY'
          import json
          import os

          status = os.environ["DEPLOY_STATUS"]
          marker = "✅" if status == "success" else "❌"
          run_url = f'{os.environ["GITHUB_SERVER_URL"]}/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}'
          body = (
              f'{marker} **{status.upper()}** — `{os.environ["GITHUB_SHA"]}`\n\n'
              f'- run ID: `{os.environ["GITHUB_RUN_ID"]}`\n'
              f'- workflow: [{os.environ["GITHUB_WORKFLOW"]}]({run_url})\n'
              f'- production: {os.environ["PUBLIC_URL"]}\n'
              f'- school guard: {os.environ["SCHOOL_URL"]}'
          )
          print(json.dumps({"body": body}, ensure_ascii=False))
          PY
          )"
          if ! curl --fail-with-body --silent --show-error --retry 3 \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$LEDGER_ISSUE/comments" \
            --data "$payload" >/dev/null
          then
            printf '::warning::Unable to publish deployment ledger comment\n'
          fi
