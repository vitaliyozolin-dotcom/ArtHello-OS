              focus = metrics['focus']
              if type(focus) is not dict or set(focus) != {
                  'activeElement', 'focusVisible', 'outlineStyle',
                  'outlineWidth', 'outlineOffset', 'outlineAuthored',
                  'outlineParsed', 'renderedOutline', 'externalBackground',
                  'expectedOutline', 'outlineColorPass', 'effectiveOpacity',
                  'opacityPass', 'flatPaintPass', 'minimumContrast', 'ratio',
                  'externalPass', 'inactiveRatios', 'inactivePass',
                  'contrastPass', 'authoredPass', 'pass',
              }:
                  raise RuntimeError('Wrong School focus evidence schema')
              inactive_focus_ratios = focus['inactiveRatios']
              if (
                  focus['activeElement'] is not True
                  or focus['focusVisible'] is not True
                  or type(focus['outlineStyle']) is not str
                  or focus['outlineStyle'] in {'none', 'hidden'}
                  or not is_number(focus['outlineWidth'])
                  or focus['outlineWidth'] < 3
                  or not is_number(focus['outlineOffset'])
                  or focus['outlineOffset'] < 2
                  or focus['outlineColorPass'] is not True
                  or not is_number(focus['effectiveOpacity'])
                  or focus['effectiveOpacity'] != 1
                  or focus['opacityPass'] is not True
                  or focus['flatPaintPass'] is not True
                  or focus['authoredPass'] is not True
                  or not is_int(focus['minimumContrast'])
                  or focus['minimumContrast'] != 3
                  or not is_number(focus['ratio'])
                  or focus['ratio'] < 3
                  or focus['externalPass'] is not True
                  or type(inactive_focus_ratios) is not list
                  or len(inactive_focus_ratios) != 2
                  or focus['contrastPass'] is not True
                  or focus['pass'] is not True
              ):
                  raise RuntimeError(
                      'School focus invariant failed: ' +
                      json.dumps(focus, ensure_ascii=False)
                  )
              require_color(focus['outlineParsed'], 'Focus parsed outline')
              require_color(focus['renderedOutline'], 'Focus rendered outline')
              require_color(focus['externalBackground'], 'Focus external background')
              if (
                  not colors_close(focus['outlineParsed'], expected_colors['brand400'])
                  or not colors_close(focus['renderedOutline'], expected_colors['brand400'])
                  or not strict_equal(
                      focus['externalBackground'],
                      active_tab_evidence['externalBackground'],
                  )
              ):
                  raise RuntimeError('Focus token/background binding failed')
              require_ratio(
                  focus['ratio'],
                  focus['renderedOutline'],
                  focus['externalBackground'],
                  'Focus outline/external contrast',
              )
              if {entry.get('label') for entry in inactive_focus_ratios} != expected_inactive_labels:
                  raise RuntimeError('Focus inactive-tab labels failed')
              for entry in inactive_focus_ratios:
                  if (
                      type(entry) is not dict
                      or set(entry) != {'label', 'renderedBackground', 'ratio'}
                      or not is_number(entry['ratio'])
                      or entry['ratio'] < 3
                  ):
                      raise RuntimeError('Focus inactive-tab ratio failed')
                  require_color(
                      entry['renderedBackground'],
                      'Focus inactive-tab background',
                  )
                  if not colors_close(
                      entry['renderedBackground'],
                      expected_colors['surface'],
                  ):
                      raise RuntimeError('Focus inactive background token failed')
                  require_ratio(
                      entry['ratio'],
                      focus['renderedOutline'],
                      entry['renderedBackground'],
                      'Focus outline/inactive contrast',
                  )
              if focus['inactivePass'] is not True:
                  raise RuntimeError('Focus inactive-tab aggregate failed')

              cards = metrics['cards']
              if (
                  type(cards) is not list
                  or len(cards) != expected_items
                  or any(type(card) is not dict for card in cards)
                  or metrics['cardStylePass'] is not True
                  or metrics['inactiveTabsPass'] is not True
                  or metrics['schoolStatePass'] is not True
              ):
                  raise RuntimeError(
                      'School state aggregate failed: ' +
                      json.dumps(metrics, ensure_ascii=False)
                  )
              for index, card in enumerate(cards):
                  if set(card) != {
                      'index', 'backgroundAuthored', 'backgroundParsed',
                      'backgroundRendered', 'foregroundAuthored',
                      'foregroundParsed', 'foregroundRendered',
                      'effectiveOpacity', 'opacityPass', 'flatPaintPass',
                      'backgroundPass', 'textPass', 'pass',
                  }:
                      raise RuntimeError('Wrong School card evidence schema')
                  if (
                      not is_int(card['index'])
                      or card['index'] != index
                      or not is_number(card['effectiveOpacity'])
                      or card['effectiveOpacity'] != 1
                      or card['opacityPass'] is not True
                      or card['flatPaintPass'] is not True
                      or card['backgroundPass'] is not True
                      or card['textPass'] is not True
                      or card['pass'] is not True
                  ):
                      raise RuntimeError('School card opaque flat-paint contract failed')
                  require_color(card['backgroundParsed'], 'School card parsed background')
                  require_color(card['backgroundRendered'], 'School card background')
                  require_color(card['foregroundParsed'], 'School card parsed foreground')
                  require_color(card['foregroundRendered'], 'School card foreground')
                  if (
                      not colors_close(card['backgroundParsed'], expected_colors['surface'])
                      or not colors_close(card['foregroundParsed'], expected_colors['text'])
                  ):
                      raise RuntimeError('School card token binding failed')
          violation_records = manifest['violations']
          if type(violation_records) is not list:
              raise RuntimeError('Manifest violations must be a list')
          ds02_codes = {
              'DESIGN_CODE_FLAG', 'ROUTE', 'HORIZONTAL_OVERFLOW',
              'PHONE_RAIL', 'PHONE_NAV', 'PHONE_NAV_HEIGHT',
              'RAIL_VISIBLE', 'DESKTOP_NAV', 'TABLET_RAIL_WIDTH',
              'DESKTOP_RAIL_WIDTH', 'TOPBAR_HEIGHT', 'PAGE_PADDING_LEFT',
              'PAGE_PADDING_RIGHT', 'TABLET_RAIL_LABEL', 'TABLET_RAIL_TOOLTIP',
          }
          ds02_violations = [
              violation for violation in violation_records
              if violation['code'] in ds02_codes
          ]
          if ds02_violations:
              raise RuntimeError(
                  'DS-02 shell violations: ' +
                  json.dumps(ds02_violations, ensure_ascii=False)
              )
          ds03_codes = {
              'APP_FONT', 'VISIBLE_FONT_FIRST_FAMILY', 'FONT_READY',
              'FONT_PRELOAD', 'FONT_WOFF2_RESOURCE', 'FONT_TTF_FALLBACK',
              'STUDENT_THEME_TOKEN', 'NON_STUDENT_THEME_TOKEN',
              'STUDENT_THEME_PREPAINT', 'STUDENT_THEME_VALUE',
              'STUDENT_THEME_SURFACE', 'STUDENT_ROUTE',
              'STUDENT_ROUTE_ANCHOR', 'STUDENT_ROUTE_HEADING',
              'STUDENT_ROUTE_STATE_TAB', 'STUDENT_ROUTE_STATE_ACTIVE',
              'STUDENT_ROUTE_STATE_ANCHOR', 'STUDENT_ROUTE_STATE_ITEMS',
              'STUDENT_SCHOOL_TAB_STYLE', 'STUDENT_SCHOOL_CARD_STYLE',
              'STUDENT_SCHOOL_SELECTOR_COUNT',
              'STUDENT_SCHOOL_TEXT_CONTRAST',
              'STUDENT_SCHOOL_SELECTED_MAPPING',
              'STUDENT_SCHOOL_SELECTED_NONTEXT',
              'STUDENT_SCHOOL_FOCUS_STYLE',
              'STUDENT_SCHOOL_FOCUS_NONTEXT', 'CLS',
          }
          ds04_codes = {
              'HEADER_LOGO_WIDTH', 'HEADER_LOGO_HEIGHT',
              'H1_SIZE', 'H1_LINE_HEIGHT', 'H1_WEIGHT',
              'H2_SIZE', 'H2_LINE_HEIGHT',
              'PRIMARY_HEIGHT', 'PRIMARY_RADIUS', 'PRIMARY_FONT',
              'CARD_RADIUS', 'CARD_PADDING', 'RANDOM_RADIUS',
              'TOUCH_TARGETS', 'HELP_BUTTON', 'FOCUS_RING',
              'CONTENT_MAX_WIDTH',
          }
          all_known_codes = ds02_codes | ds03_codes | ds04_codes
          valid_roles = {role['id'] for role in expected_roles}
          valid_widths = {
              control['width'] for control in [*expected_controls, *expected_route_controls]
          }
          valid_routes = {
              route['route'] for route in [*expected_roles, *expected_student_routes]
          }
          for violation in violation_records:
              if type(violation) is not dict:
                  raise RuntimeError('Violation must be an object')
              required_keys = {
                  'role', 'width', 'severity', 'code',
                  'selector', 'expected', 'actual',
              }
              if set(violation) not in (required_keys, required_keys | {'route'}):
                  raise RuntimeError('Wrong violation schema')
              if (
                  type(violation['role']) is not str
                  or violation['role'] not in valid_roles
                  or not is_int(violation['width'])
                  or violation['width'] not in valid_widths
                  or type(violation['severity']) is not str
                  or violation['severity'] not in {'P0', 'P1'}
                  or type(violation['code']) is not str
                  or violation['code'] not in all_known_codes
                  or type(violation['selector']) is not str
                  or not violation['selector']
              ):
                  raise RuntimeError(
                      'Invalid or unknown violation: ' +
                      json.dumps(violation, ensure_ascii=False)
                  )
              if 'route' in violation and (
                  type(violation['route']) is not str
                  or violation['route'] not in valid_routes
              ):
                  raise RuntimeError('Invalid violation route')
          expected_severity_counts = dict(
              collections.Counter(item['severity'] for item in violation_records)
          )
          if not strict_equal(manifest['severityCounts'], expected_severity_counts):
              raise RuntimeError('Violation severity counts are inconsistent')
          if (
              type(manifest['compliant']) is not bool
              or manifest['compliant'] is not (len(violation_records) == 0)
          ):
              raise RuntimeError('Manifest compliant flag is inconsistent')
          ds03_violations = [
              violation for violation in violation_records
              if violation['code'] in ds03_codes
          ]
          if ds03_violations:
              raise RuntimeError(
                  'DS-03 theme/font/route violations: ' +
                  json.dumps(ds03_violations, ensure_ascii=False)
              )
          ds04_violations = [
              violation for violation in violation_records
              if violation['code'] in ds04_codes
          ]
          if ds04_violations:
              raise RuntimeError(
                  'DS-04 component violations: ' +
                  json.dumps(ds04_violations, ensure_ascii=False)
              )
          print(
              f"{len(manifest['violations'])} "
              f"{str(manifest['compliant']).lower()} "
              f"{len(ds02_violations)} "
              f"{len(ds03_violations)} "
              f"{len(ds04_violations)}"
          )
          READ_MANIFEST
          )"
          read -r violation_count compliant ds02_violation_count ds03_violation_count ds04_violation_count <<< "$manifest_values"

          kill "$tunnel_pid"
          wait "$tunnel_pid" >/dev/null 2>&1 || true
          tunnel_pid=""
          cleanup_log="$RUNNER_TEMP/school-authorized-visual-cleanup.log"
          remote_fixture cleanup | tee "$cleanup_log"
          test "$(sed -n 's/^SCHOOL_AUTHORIZED_VISUAL_CLEANUP=//p' "$cleanup_log" | tail -n1)" = OK
          remote_prepared=0

          printf 'result=OK\n' >> "$GITHUB_OUTPUT"
          printf 'violation_count=%s\n' "$violation_count" >> "$GITHUB_OUTPUT"
          printf 'compliant=%s\n' "$compliant" >> "$GITHUB_OUTPUT"
          printf 'ds02_violation_count=%s\n' "$ds02_violation_count" >> "$GITHUB_OUTPUT"
          printf 'ds03_violation_count=%s\n' "$ds03_violation_count" >> "$GITHUB_OUTPUT"
          printf 'ds04_violation_count=%s\n' "$ds04_violation_count" >> "$GITHUB_OUTPUT"
          printf 'SCHOOL_AUTHORIZED_VISUAL_CAPTURE=OK captures=51 ds02_violations=%s ds03_violations=%s ds04_violations=%s violations=%s compliant=%s\n' "$ds02_violation_count" "$ds03_violation_count" "$ds04_violation_count" "$violation_count" "$compliant"

      - name: Enforce remote teardown
        if: always()
        env:
          DEPLOY_HOST: ${{ secrets.ARTHELLO_RU_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ARTHELLO_RU_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.ARTHELLO_RU_DEPLOY_PORT }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          ssh_dir="$RUNNER_TEMP/school-authorized-visual-ssh-$GITHUB_RUN_ID"
          ssh_key="$ssh_dir/id_ed25519"
          known_hosts="$ssh_dir/known_hosts"
          test -s "$ssh_key"
          test -s "$known_hosts"
          deploy_port="${DEPLOY_PORT:-2222}"
          timeout --signal=TERM --kill-after=15s 900s \
            ssh -T \
              -p "$deploy_port" \
              -i "$ssh_key" \
              -o IdentitiesOnly=yes \
              -o PreferredAuthentications=publickey \
              -o PasswordAuthentication=no \
              -o KbdInteractiveAuthentication=no \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$known_hosts" \
              -o GlobalKnownHostsFile=/dev/null \
              -o ConnectTimeout=140 \
              -o ServerAliveInterval=10 \
              -o ServerAliveCountMax=12 \
              -o IPQoS=none \
              -o Compression=no \
              -o KexAlgorithms=curve25519-sha256 \
              -o HostKeyAlgorithms=ssh-ed25519 \
              -o PubkeyAcceptedAlgorithms=ssh-ed25519 \
              -o Ciphers=aes128-ctr \
              -o MACs=hmac-sha2-256 \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "env ACTION='cleanup' RUN_ID='$GITHUB_RUN_ID' CANDIDATE_SHA='$CANDIDATE_SHA' CANDIDATE_IMAGE='$CANDIDATE_IMAGE' CANDIDATE_IMAGE_ID='$CANDIDATE_IMAGE_ID' SCHOOL_ORIGIN='$SCHOOL_ORIGIN' STAGING_ORIGIN='$STAGING_ORIGIN' AUDIT_PUBLIC_ORIGIN='$AUDIT_ORIGIN' AUDIT_BIND_ORIGIN='$AUDIT_BIND_ORIGIN' bash -s" \
              < .github/scripts/school-authorized-visual-fixture.sh

      - name: Remove run-scoped SSH material
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          ssh_dir="$RUNNER_TEMP/school-authorized-visual-ssh-$GITHUB_RUN_ID"
          case "$ssh_dir" in
            "$RUNNER_TEMP"/school-authorized-visual-ssh-*) ;;
            *) exit 1 ;;
          esac
          if [ -d "$ssh_dir" ]; then
            rm -f -- \
              "$ssh_dir/id_ed25519" \
              "$ssh_dir/known_hosts" \
              "$ssh_dir/known_hosts.scan"
            rmdir -- "$ssh_dir"
          fi

      - name: Upload authorized visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: school-authorized-design-audit-${{ github.run_id }}
          path: school-authorized-visual-output
          if-no-files-found: error
          retention-days: 14

      - name: Publish authorized audit result
        if: always()
        env:
          CAPTURE_RESULT: ${{ steps.capture.outputs.result }}
          VIOLATION_COUNT: ${{ steps.capture.outputs.violation_count }}
          COMPLIANT: ${{ steps.capture.outputs.compliant }}
          DS02_VIOLATIONS: ${{ steps.capture.outputs.ds02_violation_count }}
          DS03_VIOLATIONS: ${{ steps.capture.outputs.ds03_violation_count }}
          DS04_VIOLATIONS: ${{ steps.capture.outputs.ds04_violation_count }}
        shell: bash
        run: |
          {
            echo '## School diary authorized design audit'
            echo
            printf -- '- Candidate: %s\n' "$CANDIDATE_SHA"
            printf -- '- Immutable image ID: %s\n' "$CANDIDATE_IMAGE_ID"
            printf -- '- Roles: director, teacher, parent, student\n'
            printf -- '- DS-02 boundary routes: /management, /journal, /homework, /schedule\n'
            printf -- '- DS-02 widths: 767, 768, 800, 801, 1199, 1200 px\n'
            printf -- '- DS-03 student routes: /, /schedule, /journal, /homework, /calendar, /school, /profile\n'
            printf -- '- DS-03 School states: Меню, Мероприятия, Доп. занятия\n'
            printf -- '- DS-03 School evidence schema: 1.3.0 selector/count/contrast/focus\n'
            printf -- '- DS-03 route widths: 390, 768, 1440 px\n'
            printf -- '- DS-04 components: logo, headings, primary controls, cards, touch targets, Help, focus ring, content width\n'
            printf -- '- Evidence: 51 screenshots plus computed-style manifest\n'
            printf -- '- Data: empty schema from candidate migrations; synthetic only\n'
            printf -- '- Exposure: isolated no-masquerade bridge, loopback port, SSH tunnel\n'
            printf -- '- Production/staging UI, data, restart changed: no\n'
            printf -- '- Capture result: %s\n' "${CAPTURE_RESULT:-failed}"
            printf -- '- Design compliant: %s\n' "${COMPLIANT:-not measured}"
            printf -- '- DS-02 shell violations: %s\n' "${DS02_VIOLATIONS:-not measured}"
            printf -- '- DS-03 theme/font/route violations: %s\n' "${DS03_VIOLATIONS:-not measured}"
            printf -- '- DS-04 component violations: %s\n' "${DS04_VIOLATIONS:-not measured}"
            printf -- '- All audited design violations: %s\n' "${VIOLATION_COUNT:-not measured}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report authorized capture as commit status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          CANDIDATE_SHA: ${{ env.CANDIDATE_SHA }}
        with:
          script: |
            const state =
              process.env.JOB_STATUS === "success" ? "success" : "failure";
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: process.env.CANDIDATE_SHA,
              state,
              context: "school-diary/authorized-visual-capture",
              description: "Authorized visual capture " + process.env.JOB_STATUS,
              target_url:
                process.env.GITHUB_SERVER_URL +
                "/" +
                process.env.GITHUB_REPOSITORY +
                "/actions/runs/" +
                process.env.GITHUB_RUN_ID,
            });
