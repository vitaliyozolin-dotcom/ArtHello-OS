name: School diary authorized design audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/school-diary-authorized-visual-audit.yml
      - .github/scripts/school-authorized-visual-fixture.sh
      - .github/scripts/school-authorized-visual-audit.mjs

permissions:
  contents: read
  statuses: write

concurrency:
  group: school-diary-authorized-visual-audit
  cancel-in-progress: false

env:
  CANDIDATE_SHA: b21363c5cd4b3756400eb665c41685d5dbcebc14
  CANDIDATE_IMAGE: school-1-11-design-v1:b21363c5cd4b
  CANDIDATE_IMAGE_ID: sha256:8d857f25cfdadc378c9897c1a9f6236dd2bbf34138c725a19c84f4427acb5382
  AUDIT_WIDTHS: "767,768,800,801,1199,1200"
  SCHOOL_ORIGIN: https://school-188-225-38-55.sslip.io
  STAGING_ORIGIN: http://127.0.0.1:3211
  AUDIT_BIND_ORIGIN: http://127.0.0.1:3212
  AUDIT_ORIGIN: http://127.0.0.1:33212
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.55.0-noble
  PLAYWRIGHT_VERSION: 1.55.0

jobs:
  authorized-visual-audit:
    runs-on: [self-hosted, linux, x64, arthello-gateway]
    timeout-minutes: 45
    environment: production-ru
    steps:
      - name: Check out authorized visual audit controls
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Configure confirmed School SSH host
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ARTHELLO_RU_SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.ARTHELLO_RU_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ARTHELLO_RU_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.ARTHELLO_RU_DEPLOY_PORT }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          ssh_dir="$RUNNER_TEMP/school-authorized-visual-ssh-$GITHUB_RUN_ID"
          ssh_key="$ssh_dir/id_ed25519"
          known_hosts="$ssh_dir/known_hosts"
          install -m 0700 -d "$ssh_dir"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_key"
          chmod 0600 "$ssh_key"
          test -s "$ssh_key"
          ssh-keygen -y -f "$ssh_key" >/dev/null

          deploy_port="${DEPLOY_PORT:-2222}"
          scanned_hosts="$ssh_dir/known_hosts.scan"
          : > "$scanned_hosts"
          chmod 0600 "$scanned_hosts"
          for attempt in 1 2; do
            printf 'SCHOOL_AUTHORIZED_VISUAL_SSH_PROBE_ATTEMPT=%s\n' "$attempt"
            timeout --signal=TERM --kill-after=5s 150s \
              ssh -p "$deploy_port" \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile="$scanned_hosts" \
              -o GlobalKnownHostsFile=/dev/null \
              -o PreferredAuthentications=none \
              -o PubkeyAuthentication=no \
              -o PasswordAuthentication=no \
              -o KbdInteractiveAuthentication=no \
              -o ConnectTimeout=140 \
              -o HostKeyAlgorithms=ssh-ed25519 \
              "$DEPLOY_USER@$DEPLOY_HOST" true </dev/null >/dev/null 2>&1 || true
            test -s "$scanned_hosts" && break
            sleep 5
          done
          test -s "$scanned_hosts"
          actual_fingerprint="$(ssh-keygen -lf "$scanned_hosts" -E sha256 | awk '{print $2; exit}')"
          test "$actual_fingerprint" = 'SHA256:/kBNohTF+5g8U+jQt+PzOCoWZ9yCSFjBnEP3Oc3MwRI'
          mv "$scanned_hosts" "$known_hosts"
          printf 'SCHOOL_AUTHORIZED_VISUAL_SSH=VERIFIED\n'

      - name: Capture four roles and all student routes
        id: capture
        env:
          DEPLOY_HOST: ${{ secrets.ARTHELLO_RU_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ARTHELLO_RU_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.ARTHELLO_RU_DEPLOY_PORT }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          ssh_dir="$RUNNER_TEMP/school-authorized-visual-ssh-$GITHUB_RUN_ID"
          ssh_key="$ssh_dir/id_ed25519"
          known_hosts="$ssh_dir/known_hosts"
          test -s "$ssh_key"
          test -s "$known_hosts"
          deploy_port="${DEPLOY_PORT:-2222}"
          ssh_args=(
            -p "$deploy_port"
            -i "$ssh_key"
            -o IdentitiesOnly=yes
            -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no
            -o KbdInteractiveAuthentication=no
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$known_hosts"
            -o GlobalKnownHostsFile=/dev/null
            -o ConnectTimeout=140
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=12
            -o ExitOnForwardFailure=yes
            -o IPQoS=none
            -o Compression=no
            -o KexAlgorithms=curve25519-sha256
            -o HostKeyAlgorithms=ssh-ed25519
            -o PubkeyAcceptedAlgorithms=ssh-ed25519
            -o Ciphers=aes128-ctr
            -o MACs=hmac-sha2-256
          )

          audit_password="Audit_${GITHUB_RUN_ID}_$(openssl rand -hex 24)"
          test "${#audit_password}" -ge 32
          printf '::add-mask::%s\n' "$audit_password"

          remote_fixture() {
            local fixture_action="$1"
            local remote_password=""
            if [ "$fixture_action" = prepare ]; then
              remote_password="AUDIT_PASSWORD='$audit_password'"
            fi
            timeout --signal=TERM --kill-after=15s 900s \
              ssh -T "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
                "env ACTION='$fixture_action' RUN_ID='$GITHUB_RUN_ID' CANDIDATE_SHA='$CANDIDATE_SHA' CANDIDATE_IMAGE='$CANDIDATE_IMAGE' CANDIDATE_IMAGE_ID='$CANDIDATE_IMAGE_ID' SCHOOL_ORIGIN='$SCHOOL_ORIGIN' STAGING_ORIGIN='$STAGING_ORIGIN' AUDIT_PUBLIC_ORIGIN='$AUDIT_ORIGIN' AUDIT_BIND_ORIGIN='$AUDIT_BIND_ORIGIN' $remote_password bash -s" \
                < .github/scripts/school-authorized-visual-fixture.sh
          }

          rm -rf -- school-authorized-visual-output
          install -m 0755 -d school-authorized-visual-output
          remote_prepared=0
          tunnel_pid=""
          cleanup() {
            rc=$?
            trap - EXIT INT TERM HUP
            set +e
            if [ -n "$tunnel_pid" ]; then
              kill "$tunnel_pid" >/dev/null 2>&1
              wait "$tunnel_pid" >/dev/null 2>&1
              tunnel_pid=""
            fi
            cleanup_rc=0
            if [ "$remote_prepared" -eq 1 ]; then
              remote_fixture cleanup | tee "$RUNNER_TEMP/school-authorized-visual-cleanup.log"
              cleanup_rc=${PIPESTATUS[0]}
            fi
            if [ "$rc" -eq 0 ] && [ "$cleanup_rc" -ne 0 ]; then
              rc="$cleanup_rc"
            fi
            exit "$rc"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM HUP

          prepare_log="$RUNNER_TEMP/school-authorized-visual-prepare.log"
          remote_fixture prepare | tee "$prepare_log"
          remote_prepared=1
          test "$(sed -n 's/^SCHOOL_AUTHORIZED_VISUAL_FIXTURE=//p' "$prepare_log" | tail -n1)" = READY
          test "$(sed -n 's/^SCHOOL_AUTHORIZED_VISUAL_SOURCE=//p' "$prepare_log" | tail -n1)" = candidate-migrations-only
          test "$(sed -n 's/^SCHOOL_AUTHORIZED_VISUAL_DATA=//p' "$prepare_log" | tail -n1)" = SYNTHETIC
          test "$(sed -n 's/^SCHOOL_AUTHORIZED_VISUAL_CANDIDATE_IMAGE_ID=//p' "$prepare_log" | tail -n1)" = "$CANDIDATE_IMAGE_ID"
          test "$(sed -n 's/^SCHOOL_AUTHORIZED_VISUAL_IMAGE_PIN=//p' "$prepare_log" | tail -n1)" = IMMUTABLE

          ssh -N "${ssh_args[@]}" \
            -L 127.0.0.1:33212:127.0.0.1:3212 \
            "$DEPLOY_USER@$DEPLOY_HOST" &
          tunnel_pid=$!

          tunnel_ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 3 "$AUDIT_ORIGIN/api/health" | grep -F '"status":"ok"' >/dev/null; then
              tunnel_ready=1
              break
            fi
            kill -0 "$tunnel_pid" >/dev/null 2>&1 || break
            sleep 1
          done
          test "$tunnel_ready" -eq 1

          docker pull "$PLAYWRIGHT_IMAGE"
          docker run --rm --network host \
            -e AUDIT_ORIGIN="$AUDIT_ORIGIN" \
            -e AUDIT_PASSWORD="$audit_password" \
            -e AUDIT_RUN_ID="$GITHUB_RUN_ID" \
            -e CANDIDATE_SHA="$CANDIDATE_SHA" \
            -e CANDIDATE_IMAGE_ID="$CANDIDATE_IMAGE_ID" \
            -e AUDIT_WIDTHS="$AUDIT_WIDTHS" \
            -e PLAYWRIGHT_VERSION="$PLAYWRIGHT_VERSION" \
            -e PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
            -v "$PWD/.github/scripts/school-authorized-visual-audit.mjs:/control/audit.mjs:ro" \
            -v "$PWD/school-authorized-visual-output:/output" \
            "$PLAYWRIGHT_IMAGE" bash -lc '
              set -Eeuo pipefail
              install -m 0755 -d /tmp/school-authorized-visual
              cd /tmp/school-authorized-visual
              npm init -y >/dev/null
              npm install --silent --no-audit --no-fund "playwright@$PLAYWRIGHT_VERSION"
              cp /control/audit.mjs ./audit.mjs
              node audit.mjs
            '

          test -s school-authorized-visual-output/manifest.json
          test "$(find school-authorized-visual-output -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 51
          manifest_values="$(python3 - <<'READ_MANIFEST'
          import collections
          import json
          import math
          import os
          import pathlib
          import struct

          def reject_constant(value):
              raise RuntimeError('Non-finite JSON number is forbidden: ' + value)

          def reject_duplicate_keys(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise RuntimeError('Duplicate JSON key is forbidden: ' + key)
                  result[key] = value
              return result

          def strict_equal(actual, expected):
              if type(actual) is not type(expected):
                  return False
              if type(expected) is dict:
                  return (
                      set(actual) == set(expected)
                      and all(strict_equal(actual[key], value) for key, value in expected.items())
                  )
              if type(expected) is list:
                  return (
                      len(actual) == len(expected)
                      and all(strict_equal(left, right) for left, right in zip(actual, expected))
                  )
              return actual == expected

          def is_int(value):
              return type(value) is int

          def is_number(value):
              return type(value) in (int, float) and math.isfinite(value)

          def require_exact_int(value, expected, label):
              if not is_int(value) or value != expected:
                  raise RuntimeError(label)

          def require_color(value, label):
              if type(value) is not dict or set(value) != {'r', 'g', 'b', 'a'}:
                  raise RuntimeError(label + ': invalid rendered color object')
              if any(not is_number(value[channel]) for channel in ('r', 'g', 'b', 'a')):
                  raise RuntimeError(label + ': non-finite rendered color channel')
              if any(not 0 <= value[channel] <= 1 for channel in ('r', 'g', 'b', 'a')):
                  raise RuntimeError(label + ': rendered color channel out of range')

          def color_luminance(value):
              channels = []
              for channel in ('r', 'g', 'b'):
                  component = value[channel]
                  channels.append(
                      component / 12.92
                      if component <= 0.04045
                      else ((component + 0.055) / 1.055) ** 2.4
                  )
              return 0.2126 * channels[0] + 0.7152 * channels[1] + 0.0722 * channels[2]

          def computed_contrast(foreground, background):
              foreground_luminance = color_luminance(foreground)
              background_luminance = color_luminance(background)
              lighter = max(foreground_luminance, background_luminance)
              darker = min(foreground_luminance, background_luminance)
              return (lighter + 0.05) / (darker + 0.05)

          def require_ratio(value, foreground, background, label):
              if not is_number(value) or not 1 <= value <= 21:
                  raise RuntimeError(label + ': invalid contrast ratio')
              if (
                  not math.isclose(foreground['a'], 1, rel_tol=0, abs_tol=1e-9)
                  or not math.isclose(background['a'], 1, rel_tol=0, abs_tol=1e-9)
              ):
                  raise RuntimeError(label + ': rendered colors must be opaque')
              expected = computed_contrast(foreground, background)
              if not math.isclose(value, expected, rel_tol=1e-9, abs_tol=1e-9):
                  raise RuntimeError(label + ': contrast ratio was not independently reproduced')

          def colors_close(actual, expected):
              return all(
                  math.isclose(actual[channel], expected[channel], rel_tol=0, abs_tol=1e-7)
                  for channel in ('r', 'g', 'b', 'a')
              )

          with open('school-authorized-visual-output/manifest.json', encoding='utf-8') as source:
              manifest = json.load(
                  source,
                  object_pairs_hook=reject_duplicate_keys,
                  parse_constant=reject_constant,
              )
          if type(manifest) is not dict:
              raise RuntimeError('Manifest root must be an object')
          expected_root_keys = {
              'version', 'auditRunId', 'capturedAt', 'candidateSha',
              'candidateImageId', 'sourceOfTruth', 'origin', 'fixture',
              'credentialsStored', 'controls', 'roles', 'studentRouteControls',
              'schoolStateSelectorRequirements', 'studentRoutes',
              'studentRouteStateCount', 'studentRouteStates',
              'boundaryCaptures', 'studentRouteCaptures',
              'studentRouteStateCaptures', 'schoolTabCaptures', 'captures',
              'compliant', 'severityCounts', 'results', 'violations',
          }
          if set(manifest) != expected_root_keys:
              raise RuntimeError('Wrong manifest 1.3.0 root schema')
          fixed_manifest_values = {
              'version': '1.3.0',
              'auditRunId': os.environ['GITHUB_RUN_ID'],
              'candidateSha': os.environ['CANDIDATE_SHA'],
              'candidateImageId': os.environ['CANDIDATE_IMAGE_ID'],
              'sourceOfTruth': 'School 1–11 design code 1.0.0, approved 2026-08-27, SHA-256 cebdc3f3ae76cb50103734c0e6144cef713108b4c6fd9b39de93cf3f8828dd48',
              'origin': 'loopback-ssh-tunnel',
              'fixture': 'empty schema from candidate migrations, seeded with synthetic data',
              'credentialsStored': False,
          }
          for key, expected in fixed_manifest_values.items():
              if not strict_equal(manifest[key], expected):
                  raise RuntimeError('Manifest provenance invariant failed: ' + key)
          if type(manifest['capturedAt']) is not str or not manifest['capturedAt'].endswith('Z'):
              raise RuntimeError('Capture timestamp invariant failed')

          expected_controls = [
              {'width': 767, 'height': 1024},
              {'width': 768, 'height': 1024},
              {'width': 800, 'height': 1024},
              {'width': 801, 'height': 1024},
              {'width': 1199, 'height': 960},
              {'width': 1200, 'height': 960},
          ]
          expected_roles = [
              {'id': 'director', 'route': '/management'},
              {'id': 'teacher', 'route': '/journal'},
              {'id': 'parent', 'route': '/homework'},
              {'id': 'student', 'route': '/schedule'},
          ]
          expected_route_controls = [
              {'width': 390, 'height': 844},
              {'width': 768, 'height': 1024},
              {'width': 1440, 'height': 1000},
          ]
          expected_student_routes = [
              {'id': 'home', 'route': '/', 'anchor': '.student-dashboard', 'heading': None},
              {'id': 'schedule', 'route': '/schedule', 'anchor': '.study-panel.schedule-editor', 'heading': 'Расписание'},
              {'id': 'journal', 'route': '/journal', 'anchor': '.study-panel', 'heading': 'Журнал'},
              {'id': 'homework', 'route': '/homework', 'anchor': '.study-panel', 'heading': 'Домашние задания'},
              {'id': 'calendar', 'route': '/calendar', 'anchor': '.calendar-toolbar', 'heading': 'Календарь школы'},
              {'id': 'school', 'route': '/school', 'anchor': '.compact-tabs', 'heading': 'Школа'},
              {'id': 'profile', 'route': '/profile', 'anchor': '.profile-head', 'heading': None},
          ]
          for actual, expected, label in (
              (manifest['controls'], expected_controls, 'DS-02 controls'),
              (manifest['roles'], expected_roles, 'role contract'),
              (manifest['studentRouteControls'], expected_route_controls, 'DS-03 controls'),
              (manifest['studentRoutes'], expected_student_routes, 'DS-03 routes'),
          ):
              if not strict_equal(actual, expected):
                  raise RuntimeError('Wrong ' + label)

          expected_state_descriptors = [
              {'id': 'home', 'route': '/', 'routeStateId': 'home', 'stateId': 'default', 'tab': None, 'anchor': '.student-dashboard', 'items': None, 'expectedItems': None, 'heading': None},
              {'id': 'schedule', 'route': '/schedule', 'routeStateId': 'schedule', 'stateId': 'default', 'tab': None, 'anchor': '.study-panel.schedule-editor', 'items': None, 'expectedItems': None, 'heading': 'Расписание'},
              {'id': 'journal', 'route': '/journal', 'routeStateId': 'journal', 'stateId': 'default', 'tab': None, 'anchor': '.study-panel', 'items': None, 'expectedItems': None, 'heading': 'Журнал'},
              {'id': 'homework', 'route': '/homework', 'routeStateId': 'homework', 'stateId': 'default', 'tab': None, 'anchor': '.study-panel', 'items': None, 'expectedItems': None, 'heading': 'Домашние задания'},
              {'id': 'calendar', 'route': '/calendar', 'routeStateId': 'calendar', 'stateId': 'default', 'tab': None, 'anchor': '.calendar-toolbar', 'items': None, 'expectedItems': None, 'heading': 'Календарь школы'},
              {'id': 'school', 'route': '/school', 'routeStateId': 'school-menu', 'stateId': 'menu', 'tab': 'Меню', 'anchor': '.menu-grid', 'items': '.menu-grid > article', 'expectedItems': 3, 'heading': 'Школа'},
              {'id': 'school', 'route': '/school', 'routeStateId': 'school-events', 'stateId': 'events', 'tab': 'Мероприятия', 'anchor': '.event-grid', 'items': '.event-grid > article', 'expectedItems': 2, 'heading': 'Школа'},
              {'id': 'school', 'route': '/school', 'routeStateId': 'school-activities', 'stateId': 'activities', 'tab': 'Доп. занятия', 'anchor': '.activity-grid', 'items': '.activity-grid > article', 'expectedItems': 2, 'heading': 'Школа'},
              {'id': 'profile', 'route': '/profile', 'routeStateId': 'profile', 'stateId': 'default', 'tab': None, 'anchor': '.profile-head', 'items': None, 'expectedItems': None, 'heading': None},
          ]
          state_identity_keys = tuple(expected_state_descriptors[0])
          state_descriptors = manifest['studentRouteStates']
          if type(state_descriptors) is not list or len(state_descriptors) != 9:
              raise RuntimeError('Wrong DS-03 route state descriptors')
          for actual, expected in zip(state_descriptors, expected_state_descriptors):
              if type(actual) is not dict or 'selectorRequirements' not in actual:
                  raise RuntimeError('Incomplete DS-03 route state descriptor')
              identity = {key: actual[key] for key in state_identity_keys}
              if not strict_equal(identity, expected):
                  raise RuntimeError('Wrong DS-03 route state identity')
              if expected['id'] != 'school' and actual['selectorRequirements'] is not None:
                  raise RuntimeError('Unexpected selector requirements outside School')

          results = manifest['results']
          if type(results) is not list or len(results) != 51:
              raise RuntimeError('Combined result list must contain exactly 51 records')
          if any(type(item) is not dict for item in results):
              raise RuntimeError('Every capture result must be an object')
          boundary_results = [item for item in results if 'routeStateId' not in item]
          student_results = [item for item in results if 'routeStateId' in item]
          if len(boundary_results) != 24 or len(student_results) != 27:
              raise RuntimeError('Wrong boundary/student result partition')

          expected_boundary_matrix = {}
          for role in expected_roles:
              for control in expected_controls:
                  width = control['width']
                  descriptor = {
                      'role': role['id'],
                      'route': role['route'],
                      'width': width,
                      'height': control['height'],
                      'shellMode': 'phone' if width <= 767 else 'tablet' if width < 1200 else 'desktop',
                      'screenshot': f"{role['id']}-{width}.png",
                  }
                  expected_boundary_matrix[(role['id'], width)] = descriptor
          actual_boundary_matrix = {}
          for item in boundary_results:
              if set(item) != {
                  'role', 'route', 'width', 'height', 'shellMode',
                  'metrics', 'ds03', 'focus', 'screenshot',
              }:
                  raise RuntimeError('Wrong DS-02 result schema')
              if (
                  type(item['metrics']) is not dict
                  or type(item['ds03']) is not dict
                  or item['focus'] is not None and type(item['focus']) is not dict
              ):
                  raise RuntimeError('Incomplete DS-02 result evidence')
              key = (item.get('role'), item.get('width'))
              if key in actual_boundary_matrix or key not in expected_boundary_matrix:
                  raise RuntimeError('Unknown or duplicate DS-02 result identity')
              actual_boundary_matrix[key] = item
              expected = expected_boundary_matrix[key]
              identity = {field: item.get(field) for field in expected}
              if not strict_equal(identity, expected):
                  raise RuntimeError('DS-02 result binding failed: ' + repr(key))
          if set(actual_boundary_matrix) != set(expected_boundary_matrix):
              raise RuntimeError('Incomplete DS-02 result matrix')

          expected_student_matrix = {}
          for state in expected_state_descriptors:
              for control in expected_route_controls:
                  width = control['width']
                  descriptor = {
                      'role': 'student',
                      'route': state['route'],
                      'routeId': state['id'],
                      'routeStateId': state['routeStateId'],
                      'stateId': state['stateId'],
                      'tab': state['tab'],
                      'width': width,
                      'height': control['height'],
                      'screenshot': f"student-route-{state['routeStateId']}-{width}.png",
                  }
                  expected_student_matrix[(state['routeStateId'], width)] = descriptor
          actual_student_matrix = {}
          for item in student_results:
              if set(item) != {
                  'role', 'route', 'routeId', 'routeStateId', 'stateId', 'tab',
                  'width', 'height', 'metrics', 'ds03', 'screenshot',
              }:
                  raise RuntimeError('Wrong DS-03 result schema')
              if type(item['metrics']) is not dict or type(item['ds03']) is not dict:
                  raise RuntimeError('Incomplete DS-03 result evidence')
              key = (item.get('routeStateId'), item.get('width'))
              if key in actual_student_matrix or key not in expected_student_matrix:
                  raise RuntimeError('Unknown or duplicate DS-03 result identity')
              actual_student_matrix[key] = item
              expected = expected_student_matrix[key]
              identity = {field: item.get(field) for field in expected}
              if not strict_equal(identity, expected):
                  raise RuntimeError('DS-03 result binding failed: ' + repr(key))
          if set(actual_student_matrix) != set(expected_student_matrix):
              raise RuntimeError('Incomplete DS-03 result matrix')

          expected_screenshots = {
              item['screenshot'] for item in expected_boundary_matrix.values()
          } | {
              item['screenshot'] for item in expected_student_matrix.values()
          }
          output_dir = pathlib.Path('school-authorized-visual-output')
          actual_png_paths = {path.name: path for path in output_dir.glob('*.png')}
          result_screenshots = [item.get('screenshot') for item in results]
          if (
              len(result_screenshots) != len(set(result_screenshots))
              or set(result_screenshots) != expected_screenshots
              or set(actual_png_paths) != expected_screenshots
          ):
              raise RuntimeError('Capture-to-screenshot matrix binding failed')
          expected_screenshot_sizes = {
              item['screenshot']: (item['width'], item['height'])
              for item in [*expected_boundary_matrix.values(), *expected_student_matrix.values()]
          }
          for name, path in actual_png_paths.items():
              if not path.is_file() or path.is_symlink() or path.stat().st_size <= 24:
                  raise RuntimeError('Missing or empty screenshot: ' + name)
              with path.open('rb') as screenshot_source:
                  header = screenshot_source.read(24)
              if (
                  header[:8] != b'\x89PNG\r\n\x1a\n'
                  or struct.unpack('>I', header[8:12])[0] != 13
                  or header[12:16] != b'IHDR'
              ):
                  raise RuntimeError('Invalid PNG header: ' + name)
              pixel_width, pixel_height = struct.unpack('>II', header[16:24])
              expected_width, minimum_height = expected_screenshot_sizes[name]
              if pixel_width != expected_width or pixel_height < minimum_height:
                  raise RuntimeError('Wrong screenshot dimensions: ' + name)

          require_exact_int(manifest['captures'], len(results), 'Incomplete combined capture matrix')
          require_exact_int(manifest['boundaryCaptures'], len(boundary_results), 'Incomplete DS-02 boundary matrix')
