name: School diary authorized design audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/school-diary-authorized-visual-audit.yml
      - .github/scripts/school-authorized-visual-fixture.sh
      - .github/scripts/school-authorized-visual-audit.mjs
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: school-diary-authorized-visual-audit
  cancel-in-progress: false

env:
  CANDIDATE_SHA: 0947e866afb0bcbbe1a33a3303e9168351f5e9f1
  CANDIDATE_IMAGE: school-1-11-design-v1:0947e866afb0
  CANDIDATE_IMAGE_ID: sha256:94bcaa9dfe45d1bbfc1042c397a4556cbacb258e810b7e56b581d7a2b44570ea
  AUDIT_WIDTHS: "767,768,800,801,1199,1200"
  SCHOOL_ORIGIN: https://school-188-225-38-55.sslip.io
  STAGING_ORIGIN: http://127.0.0.1:3211
  AUDIT_BIND_ORIGIN: http://127.0.0.1:3212
  AUDIT_ORIGIN: http://127.0.0.1:33212
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.55.0-noble
  PLAYWRIGHT_VERSION: 1.55.0

jobs:
  authorized-visual-audit:
    runs-on: [self-hosted, linux, x64, arthello-gateway]
    timeout-minutes: 45
    environment: production-ru
    steps:
      - name: Check out authorized visual audit controls
        uses: actions/checkout@v4

      - name: Configure confirmed School SSH host
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ARTHELLO_RU_SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.ARTHELLO_RU_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ARTHELLO_RU_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.ARTHELLO_RU_DEPLOY_PORT }}
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 0700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          test -s ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

          deploy_port="${DEPLOY_PORT:-2222}"
          scanned_hosts="$RUNNER_TEMP/school-known-hosts"
          : > "$scanned_hosts"
          chmod 0600 "$scanned_hosts"
          for attempt in 1 2; do
            printf 'SCHOOL_AUTHORIZED_VISUAL_SSH_PROBE_ATTEMPT=%s\n' "$attempt"
            timeout --signal=TERM --kill-after=5s 150s \
              ssh -p "$deploy_port" \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile="$scanned_hosts" \
              -o GlobalKnownHostsFile=/dev/null \
              -o PreferredAuthentications=none \
              -o PubkeyAuthentication=no \
              -o PasswordAuthentication=no \
              -o KbdInteractiveAuthentication=no \
              -o ConnectTimeout=140 \
              -o HostKeyAlgorithms=ssh-ed25519 \
              "$DEPLOY_USER@$DEPLOY_HOST" true </dev/null >/dev/null 2>&1 || true
            test -s "$scanned_hosts" && break
            sleep 5
          done
          test -s "$scanned_hosts"
          actual_fingerprint="$(ssh-keygen -lf "$scanned_hosts" -E sha256 | awk '{print $2; exit}')"
          test "$actual_fingerprint" = 'SHA256:/kBNohTF+5g8U+jQt+PzOCoWZ9yCSFjBnEP3Oc3MwRI'
          mv "$scanned_hosts" ~/.ssh/known_hosts
          printf 'SCHOOL_AUTHORIZED_VISUAL_SSH=VERIFIED\n'

      - name: Capture four roles and all student routes
        id: capture
        env:
          DEPLOY_HOST: ${{ secrets.ARTHELLO_RU_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ARTHELLO_RU_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.ARTHELLO_RU_DEPLOY_PORT }}
        shell: bash
        run: |
          set -Eeuo pipefail
          deploy_port="${DEPLOY_PORT:-2222}"
          ssh_args=(
            -p "$deploy_port"
            -i ~/.ssh/id_ed25519
            -o IdentitiesOnly=yes
            -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no
            -o KbdInteractiveAuthentication=no
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile=~/.ssh/known_hosts
            -o ConnectTimeout=140
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=12
            -o ExitOnForwardFailure=yes
            -o IPQoS=none
            -o Compression=no
            -o KexAlgorithms=curve25519-sha256
            -o HostKeyAlgorithms=ssh-ed25519
            -o PubkeyAcceptedAlgorithms=ssh-ed25519
            -o Ciphers=aes128-ctr
            -o MACs=hmac-sha2-256
          )

          audit_password="Audit_${GITHUB_RUN_ID}_$(openssl rand -hex 24)"
          test "${#audit_password}" -ge 32
          printf '::add-mask::%s\n' "$audit_password"

          remote_fixture() {
            local fixture_action="$1"
            local remote_password=""
            if [ "$fixture_action" = prepare ]; then
              remote_password="AUDIT_PASSWORD='$audit_password'"
            fi
            timeout --signal=TERM --kill-after=15s 900s \
              ssh -T "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
                "env ACTION='$fixture_action' RUN_ID='$GITHUB_RUN_ID' CANDIDATE_SHA='$CANDIDATE_SHA' CANDIDATE_IMAGE='$CANDIDATE_IMAGE' CANDIDATE_IMAGE_ID='$CANDIDATE_IMAGE_ID' SCHOOL_ORIGIN='$SCHOOL_ORIGIN' STAGING_ORIGIN='$STAGING_ORIGIN' AUDIT_PUBLIC_ORIGIN='$AUDIT_ORIGIN' AUDIT_BIND_ORIGIN='$AUDIT_BIND_ORIGIN' $remote_password bash -s" \
                < .github/scripts/school-authorized-visual-fixture.sh
          }

          rm -rf -- school-authorized-visual-output
          install -m 0755 -d school-authorized-visual-output
          remote_prepared=0
          tunnel_pid=""
          cleanup() {
            rc=$?
            trap - EXIT INT TERM HUP
            set +e
            if [ -n "$tunnel_pid" ]; then
              kill "$tunnel_pid" >/dev/null 2>&1
              wait "$tunnel_pid" >/dev/null 2>&1
              tunnel_pid=""
            fi
            cleanup_rc=0
            if [ "$remote_prepared" -eq 1 ]; then
              remote_fixture cleanup | tee "$RUNNER_TEMP/school-authorized-visual-cleanup.log"
              cleanup_rc=${PIPESTATUS[0]}
            fi
            if [ "$rc" -eq 0 ] && [ "$cleanup_rc" -ne 0 ]; then
              rc="$cleanup_rc"
            fi
            exit "$rc"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM HUP

          prepare_log="$RUNNER_TEMP/school-authorized-visual-prepare.log"
          remote_fixture prepare | tee "$prepare_log"
          remote_prepared=1
          test "$(sed -n 's/^SCHOOL_AUTHORIZED_VISUAL_FIXTURE=//p' "$prepare_log" | tail -n1)" = READY
          test "$(sed -n 's/^SCHOOL_AUTHORIZED_VISUAL_SOURCE=//p' "$prepare_log" | tail -n1)" = candidate-migrations-only
          test "$(sed -n 's/^SCHOOL_AUTHORIZED_VISUAL_DATA=//p' "$prepare_log" | tail -n1)" = SYNTHETIC
          test "$(sed -n 's/^SCHOOL_AUTHORIZED_VISUAL_CANDIDATE_IMAGE_ID=//p' "$prepare_log" | tail -n1)" = "$CANDIDATE_IMAGE_ID"
          test "$(sed -n 's/^SCHOOL_AUTHORIZED_VISUAL_IMAGE_PIN=//p' "$prepare_log" | tail -n1)" = IMMUTABLE

          ssh -N "${ssh_args[@]}" \
            -L 127.0.0.1:33212:127.0.0.1:3212 \
            "$DEPLOY_USER@$DEPLOY_HOST" &
          tunnel_pid=$!

          tunnel_ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 3 "$AUDIT_ORIGIN/api/health" | grep -F '"status":"ok"' >/dev/null; then
              tunnel_ready=1
              break
            fi
            kill -0 "$tunnel_pid" >/dev/null 2>&1 || break
            sleep 1
          done
          test "$tunnel_ready" -eq 1

          docker pull "$PLAYWRIGHT_IMAGE"
          docker run --rm --network host \
            -e AUDIT_ORIGIN="$AUDIT_ORIGIN" \
            -e AUDIT_PASSWORD="$audit_password" \
            -e AUDIT_RUN_ID="$GITHUB_RUN_ID" \
            -e CANDIDATE_SHA="$CANDIDATE_SHA" \
            -e CANDIDATE_IMAGE_ID="$CANDIDATE_IMAGE_ID" \
            -e AUDIT_WIDTHS="$AUDIT_WIDTHS" \
            -e PLAYWRIGHT_VERSION="$PLAYWRIGHT_VERSION" \
            -e PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
            -v "$PWD/.github/scripts/school-authorized-visual-audit.mjs:/control/audit.mjs:ro" \
            -v "$PWD/school-authorized-visual-output:/output" \
            "$PLAYWRIGHT_IMAGE" bash -lc '
              set -Eeuo pipefail
              install -m 0755 -d /tmp/school-authorized-visual
              cd /tmp/school-authorized-visual
              npm init -y >/dev/null
              npm install --silent --no-audit --no-fund "playwright@$PLAYWRIGHT_VERSION"
              cp /control/audit.mjs ./audit.mjs
              node audit.mjs
            '

          test -s school-authorized-visual-output/manifest.json
          test "$(find school-authorized-visual-output -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 51
          manifest_values="$(python3 - <<'READ_MANIFEST'
          import json
          import os

          with open('school-authorized-visual-output/manifest.json', encoding='utf-8') as source:
              manifest = json.load(source)
          if manifest['candidateSha'] != os.environ['CANDIDATE_SHA']:
              raise RuntimeError('Candidate SHA invariant failed')
          if manifest['candidateImageId'] != os.environ['CANDIDATE_IMAGE_ID']:
              raise RuntimeError('Candidate image ID invariant failed')
          if manifest['version'] != '1.3.0':
              raise RuntimeError('Wrong DS-03 manifest version')
          if manifest['captures'] != 51:
              raise RuntimeError('Incomplete combined capture matrix')
          if manifest['boundaryCaptures'] != 24:
              raise RuntimeError('Incomplete DS-02 boundary matrix')
          if manifest['studentRouteCaptures'] != 27:
              raise RuntimeError('Incomplete DS-03 student route matrix')
          if manifest['studentRouteStateCount'] != 9:
              raise RuntimeError('Wrong DS-03 route state count')
          if manifest['studentRouteStateCaptures'] != 27:
              raise RuntimeError('Incomplete DS-03 route state matrix')
          if manifest['schoolTabCaptures'] != 9:
              raise RuntimeError('Incomplete School tab matrix')
          if manifest['credentialsStored'] is not False:
              raise RuntimeError('Credential storage invariant failed')
          if manifest['fixture'] != 'empty schema from candidate migrations, seeded with synthetic data':
              raise RuntimeError('Fixture invariant failed')
          expected_widths = [767, 768, 800, 801, 1199, 1200]
          if [item['width'] for item in manifest['controls']] != expected_widths:
              raise RuntimeError('Wrong DS-02 boundary matrix')
          expected_route_widths = [390, 768, 1440]
          if [item['width'] for item in manifest['studentRouteControls']] != expected_route_widths:
              raise RuntimeError('Wrong DS-03 student route widths')
          expected_routes = [
              '/', '/schedule', '/journal', '/homework',
              '/calendar', '/school', '/profile',
          ]
          if [item['route'] for item in manifest['studentRoutes']] != expected_routes:
              raise RuntimeError('Wrong DS-03 student routes')
          expected_route_states = [
              'home', 'schedule', 'journal', 'homework', 'calendar',
              'school-menu', 'school-events', 'school-activities', 'profile',
          ]
          if [
              item['routeStateId'] for item in manifest['studentRouteStates']
          ] != expected_route_states:
              raise RuntimeError('Wrong DS-03 student route states')
          student_results = [
              item for item in manifest['results']
              if item.get('routeStateId')
          ]
          expected_state_matrix = {
              (route_state, width)
              for route_state in expected_route_states
              for width in expected_route_widths
          }
          actual_state_matrix = {
              (item['routeStateId'], item['width'])
              for item in student_results
          }
          if (
              len(student_results) != len(expected_state_matrix)
              or actual_state_matrix != expected_state_matrix
          ):
              raise RuntimeError('Incomplete or duplicate DS-03 route state matrix')
          expected_school_states = {
              'school-menu': ('Меню', 3),
              'school-events': ('Мероприятия', 2),
              'school-activities': ('Доп. занятия', 2),
          }
          common_selector_requirements = [
              {
                  'id': 'common-eyebrow',
                  'selector': '.page-heading .eyebrow',
                  'expectedCount': 1,
                  'textRole': 'accent',
                  'minimumContrast': 4.5,
              },
              {
                  'id': 'common-heading-primary',
                  'selector': '.page-heading h1',
                  'expectedCount': 1,
                  'textRole': 'primary',
                  'minimumContrast': 4.5,
              },
              {
                  'id': 'common-heading-secondary',
                  'selector': '.page-heading p',
                  'expectedCount': 1,
                  'textRole': 'secondary',
                  'minimumContrast': 4.5,
              },
              {
                  'id': 'common-tabs',
                  'selector': '.compact-tabs > button',
                  'expectedCount': 3,
                  'textRole': 'tab',
                  'minimumContrast': 4.5,
              },
              {
                  'id': 'common-active-tab',
                  'selector': '.compact-tabs > button.active',
                  'expectedCount': 1,
                  'textRole': None,
                  'minimumContrast': None,
              },
          ]
          expected_selector_requirements = {
              'school-menu': common_selector_requirements + [
                  {
                      'id': 'menu-articles',
                      'selector': '.menu-grid > article',
                      'expectedCount': 3,
                      'textRole': None,
                      'minimumContrast': None,
                  },
                  {
                      'id': 'menu-date-primary',
                      'selector': '.menu-grid > article > header > span:first-child',
                      'expectedCount': 3,
                      'textRole': 'primary',
                      'minimumContrast': 4.5,
                  },
                  {
                      'id': 'menu-term-accent',
                      'selector': '.menu-grid dt',
                      'expectedCount': 9,
                      'textRole': 'accent',
                      'minimumContrast': 4.5,
                  },
                  {
                      'id': 'menu-value-primary',
                      'selector': '.menu-grid dd',
                      'expectedCount': 9,
                      'textRole': 'primary',
                      'minimumContrast': 4.5,
                  },
                  {
                      'id': 'menu-footer-secondary',
                      'selector': '.menu-grid > article > footer',
                      'expectedCount': 3,
                      'textRole': 'secondary',
                      'minimumContrast': 4.5,
                  },
                  {
                      'id': 'menu-status',
                      'selector': '.menu-grid > article > header .status-pill',
                      'expectedCount': 1,
                      'textRole': 'status',
                      'minimumContrast': 4.5,
                  },
              ],
              'school-events': common_selector_requirements + [
                  {
                      'id': 'event-articles',
                      'selector': '.event-grid > article',
                      'expectedCount': 2,
                      'textRole': None,
                      'minimumContrast': None,
                  },
                  {
                      'id': 'event-dates',
                      'selector': '.event-grid .event-date',
                      'expectedCount': 2,
                      'textRole': None,
                      'minimumContrast': None,
                  },
                  {
                      'id': 'event-day-large',
                      'selector': '.event-grid .event-date > strong',
                      'expectedCount': 2,
                      'textRole': 'primary-large',
                      'minimumContrast': 3,
                  },
                  {
                      'id': 'event-month-secondary',
                      'selector': '.event-grid .event-date > span',
                      'expectedCount': 2,
                      'textRole': 'secondary',
                      'minimumContrast': 4.5,
                  },
                  {
                      'id': 'event-overline-secondary',
                      'selector': '.event-grid > article > div:last-child > .item-overline',
                      'expectedCount': 2,
                      'textRole': 'secondary',
                      'minimumContrast': 4.5,
                  },
                  {
                      'id': 'event-title-primary',
                      'selector': '.event-grid > article > div:last-child > h3',
                      'expectedCount': 2,
                      'textRole': 'primary',
                      'minimumContrast': 4.5,
                  },
                  {
                      'id': 'event-description-secondary',
                      'selector': '.event-grid > article > div:last-child > p',
                      'expectedCount': 2,
                      'textRole': 'secondary',
                      'minimumContrast': 4.5,
                  },
                  {
                      'id': 'event-status',
                      'selector': '.event-grid > article footer .status-pill',
                      'expectedCount': 2,
                      'textRole': 'status',
                      'minimumContrast': 4.5,
                  },
                  {
                      'id': 'event-capacity-secondary',
                      'selector': '.event-grid > article footer > small',
                      'expectedCount': 2,
                      'textRole': 'secondary',
                      'minimumContrast': 4.5,
                  },
              ],
              'school-activities': common_selector_requirements + [
                  {
                      'id': 'activity-articles',
                      'selector': '.activity-grid > article',
                      'expectedCount': 2,
                      'textRole': None,
                      'minimumContrast': None,
                  },
                  {
                      'id': 'activity-schedule-secondary',
                      'selector': '.activity-grid > article > div > small',
                      'expectedCount': 2,
                      'textRole': 'secondary',
                      'minimumContrast': 4.5,
                  },
                  {
                      'id': 'activity-title-primary',
                      'selector': '.activity-grid > article > div > h3',
                      'expectedCount': 2,
                      'textRole': 'primary',
                      'minimumContrast': 4.5,
                  },
                  {
                      'id': 'activity-teacher-secondary',
                      'selector': '.activity-grid > article > div > p',
                      'expectedCount': 2,
                      'textRole': 'secondary',
                      'minimumContrast': 4.5,
                  },
                  {
                      'id': 'activity-capacity-secondary',
                      'selector': '.activity-grid > article .capacity > small',
                      'expectedCount': 2,
                      'textRole': 'secondary',
                      'minimumContrast': 4.5,
                  },
                  {
                      'id': 'activity-price-primary',
                      'selector': '.activity-grid > article > footer > strong',
                      'expectedCount': 2,
                      'textRole': 'primary',
                      'minimumContrast': 4.5,
                  },
                  {
                      'id': 'activity-status',
                      'selector': '.activity-grid > article > footer .status-pill',
                      'expectedCount': 2,
                      'textRole': 'status',
                      'minimumContrast': 4.5,
                  },
              ],
          }
          manifest_requirements = manifest['schoolStateSelectorRequirements']
          if set(manifest_requirements) != {'menu', 'events', 'activities'}:
              raise RuntimeError('Wrong School selector requirement states')
          for route_state, state_id in {
              'school-menu': 'menu',
              'school-events': 'events',
              'school-activities': 'activities',
          }.items():
              if manifest_requirements[state_id] != expected_selector_requirements[route_state]:
                  raise RuntimeError(
                      'Wrong School selector requirement contract: ' + route_state
                  )
          school_results = [
              item for item in student_results
              if item['routeStateId'] in expected_school_states
          ]
          if len(school_results) != 9:
              raise RuntimeError('Incomplete School tab results')
          for item in school_results:
              expected_tab, expected_items = expected_school_states[
                  item['routeStateId']
              ]
              expected_checks = expected_selector_requirements[
                  item['routeStateId']
              ]
              metrics = item['metrics']
              if (
                  item['tab'] != expected_tab
                  or metrics['activeTab'] != expected_tab
                  or metrics['activeTabCount'] != 1
                  or metrics['stateAnchorPresent'] is not True
                  or metrics['itemCount'] != expected_items
                  or metrics['expectedItemCount'] != expected_items
              ):
                  raise RuntimeError(
                      'School tab state invariant failed: ' +
                      json.dumps(item, ensure_ascii=False)
                  )
              checks = metrics['selectorChecks']
              if len(checks) != len(expected_checks):
                  raise RuntimeError('Incomplete School selector checks')
              for check, expected_check in zip(checks, expected_checks):
                  contract_fields = {
                      key: check[key]
                      for key in (
                          'id', 'selector', 'expectedCount',
                          'textRole', 'minimumContrast',
                      )
                  }
                  if contract_fields != expected_check:
                      raise RuntimeError(
                          'School selector contract mismatch: ' +
                          json.dumps(check, ensure_ascii=False)
                      )
                  expected_count = expected_check['expectedCount']
                  if (
                      check['actualCount'] != expected_count
                      or check['visibleCount'] != expected_count
                      or check['hiddenCount'] != 0
                      or check['countPass'] is not True
                  ):
                      raise RuntimeError(
                          'School selector count/visibility failed: ' +
                          json.dumps(check, ensure_ascii=False)
                      )
                  minimum_contrast = expected_check['minimumContrast']
                  samples = check['samples']
                  if minimum_contrast is None:
                      if samples or check['contrastPass'] is not True:
                          raise RuntimeError('Unexpected non-text contrast samples')
                  else:
                      if len(samples) != expected_count:
                          raise RuntimeError('Incomplete School text samples')
                      for sample in samples:
                          ratio = sample['ratio']
                          if (
                              sample['minimumContrast'] != minimum_contrast
                              or not isinstance(ratio, (int, float))
                              or ratio < minimum_contrast
                              or sample['pass'] is not True
                              or not sample['text']
                              or sample['renderedForeground'] is None
                              or sample['renderedBackground'] is None
                          ):
                              raise RuntimeError(
                                  'School text contrast failed: ' +
                                  json.dumps(sample, ensure_ascii=False)
                              )
                      if check['contrastPass'] is not True:
                          raise RuntimeError('School selector contrast aggregate failed')
              selected = metrics['selected']
              mapping = selected['mapping']
              non_text = selected['nonText']
              if (
                  selected['activeCount'] != 1
                  or selected['label'] != expected_tab
                  or mapping['backgroundPass'] is not True
                  or mapping['borderPass'] is not True
                  or mapping['textPass'] is not True
                  or mapping['pass'] is not True
                  or non_text['minimumContrast'] != 3
                  or not isinstance(non_text['fillRatio'], (int, float))
                  or len(non_text['borderRatios']) != 4
                  or any(
                      not isinstance(ratio, (int, float))
                      for ratio in non_text['borderRatios']
                  )
                  or non_text['pass'] is not True
                  or not (
                      non_text['fillRatio'] >= 3
                      or any(ratio >= 3 for ratio in non_text['borderRatios'])
                  )
              ):
                  raise RuntimeError(
                      'School selected-state invariant failed: ' +
                      json.dumps(selected, ensure_ascii=False)
                  )
              focus = metrics['focus']
              if (
                  focus['activeElement'] is not True
                  or focus['focusVisible'] is not True
                  or focus['outlineStyle'] == 'none'
                  or not isinstance(focus['outlineWidth'], (int, float))
                  or focus['outlineWidth'] <= 0
                  or focus['outlineColorPass'] is not True
                  or focus['authoredPass'] is not True
                  or focus['minimumContrast'] != 3
                  or not isinstance(focus['ratio'], (int, float))
                  or focus['ratio'] < 3
                  or focus['contrastPass'] is not True
                  or focus['pass'] is not True
              ):
                  raise RuntimeError(
                      'School focus invariant failed: ' +
                      json.dumps(focus, ensure_ascii=False)
                  )
              cards = metrics['cards']
              if (
                  len(cards) != expected_items
                  or any(card['pass'] is not True for card in cards)
                  or metrics['cardStylePass'] is not True
                  or metrics['inactiveTabsPass'] is not True
                  or metrics['selectorCompletenessPass'] is not True
                  or metrics['textContrastPass'] is not True
                  or metrics['schoolStatePass'] is not True
              ):
                  raise RuntimeError(
                      'School state aggregate failed: ' +
                      json.dumps(metrics, ensure_ascii=False)
                  )
          ds02_codes = {
              'DESIGN_CODE_FLAG', 'ROUTE', 'HORIZONTAL_OVERFLOW',
              'PHONE_RAIL', 'PHONE_NAV', 'PHONE_NAV_HEIGHT',
              'RAIL_VISIBLE', 'DESKTOP_NAV', 'TABLET_RAIL_WIDTH',
              'DESKTOP_RAIL_WIDTH', 'TOPBAR_HEIGHT', 'PAGE_PADDING_LEFT',
              'PAGE_PADDING_RIGHT', 'TABLET_RAIL_LABEL', 'TABLET_RAIL_TOOLTIP',
          }
          ds02_violations = [
              violation for violation in manifest['violations']
              if violation['code'] in ds02_codes
          ]
          if ds02_violations:
              raise RuntimeError(
                  'DS-02 shell violations: ' +
                  json.dumps(ds02_violations, ensure_ascii=False)
              )
          ds03_codes = {
              'APP_FONT', 'VISIBLE_FONT_FIRST_FAMILY', 'FONT_READY',
              'FONT_PRELOAD', 'FONT_WOFF2_RESOURCE', 'FONT_TTF_FALLBACK',
              'STUDENT_THEME_TOKEN', 'NON_STUDENT_THEME_TOKEN',
              'STUDENT_THEME_PREPAINT', 'STUDENT_THEME_VALUE',
              'STUDENT_THEME_SURFACE', 'STUDENT_ROUTE',
              'STUDENT_ROUTE_ANCHOR', 'STUDENT_ROUTE_HEADING',
              'STUDENT_ROUTE_STATE_TAB', 'STUDENT_ROUTE_STATE_ACTIVE',
              'STUDENT_ROUTE_STATE_ANCHOR', 'STUDENT_ROUTE_STATE_ITEMS',
              'STUDENT_SCHOOL_TAB_STYLE', 'STUDENT_SCHOOL_CARD_STYLE',
              'STUDENT_SCHOOL_SELECTOR_COUNT',
              'STUDENT_SCHOOL_TEXT_CONTRAST',
              'STUDENT_SCHOOL_SELECTED_MAPPING',
              'STUDENT_SCHOOL_SELECTED_NONTEXT',
              'STUDENT_SCHOOL_FOCUS_STYLE',
              'STUDENT_SCHOOL_FOCUS_NONTEXT', 'CLS',
          }
          ds03_violations = [
              violation for violation in manifest['violations']
              if violation['code'] in ds03_codes
          ]
          if ds03_violations:
              raise RuntimeError(
                  'DS-03 theme/font/route violations: ' +
                  json.dumps(ds03_violations, ensure_ascii=False)
              )
          print(
              f"{len(manifest['violations'])} "
              f"{str(manifest['compliant']).lower()} "
              f"{len(ds02_violations)} "
              f"{len(ds03_violations)}"
          )
          READ_MANIFEST
          )"
          read -r violation_count compliant ds02_violation_count ds03_violation_count <<< "$manifest_values"

          kill "$tunnel_pid"
          wait "$tunnel_pid" >/dev/null 2>&1 || true
          tunnel_pid=""
          cleanup_log="$RUNNER_TEMP/school-authorized-visual-cleanup.log"
          remote_fixture cleanup | tee "$cleanup_log"
          test "$(sed -n 's/^SCHOOL_AUTHORIZED_VISUAL_CLEANUP=//p' "$cleanup_log" | tail -n1)" = OK
          remote_prepared=0

          printf 'result=OK\n' >> "$GITHUB_OUTPUT"
          printf 'violation_count=%s\n' "$violation_count" >> "$GITHUB_OUTPUT"
          printf 'compliant=%s\n' "$compliant" >> "$GITHUB_OUTPUT"
          printf 'ds02_violation_count=%s\n' "$ds02_violation_count" >> "$GITHUB_OUTPUT"
          printf 'ds03_violation_count=%s\n' "$ds03_violation_count" >> "$GITHUB_OUTPUT"
          printf 'SCHOOL_AUTHORIZED_VISUAL_CAPTURE=OK captures=51 ds02_violations=%s ds03_violations=%s violations=%s compliant=%s\n' "$ds02_violation_count" "$ds03_violation_count" "$violation_count" "$compliant"

      - name: Enforce remote teardown
        if: always()
        env:
          DEPLOY_HOST: ${{ secrets.ARTHELLO_RU_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ARTHELLO_RU_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.ARTHELLO_RU_DEPLOY_PORT }}
        shell: bash
        run: |
          set -Eeuo pipefail
          deploy_port="${DEPLOY_PORT:-2222}"
          timeout --signal=TERM --kill-after=15s 900s \
            ssh -T \
              -p "$deploy_port" \
              -i ~/.ssh/id_ed25519 \
              -o IdentitiesOnly=yes \
              -o PreferredAuthentications=publickey \
              -o PasswordAuthentication=no \
              -o KbdInteractiveAuthentication=no \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o ConnectTimeout=140 \
              -o ServerAliveInterval=10 \
              -o ServerAliveCountMax=12 \
              -o IPQoS=none \
              -o Compression=no \
              -o KexAlgorithms=curve25519-sha256 \
              -o HostKeyAlgorithms=ssh-ed25519 \
              -o PubkeyAcceptedAlgorithms=ssh-ed25519 \
              -o Ciphers=aes128-ctr \
              -o MACs=hmac-sha2-256 \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "env ACTION='cleanup' RUN_ID='$GITHUB_RUN_ID' CANDIDATE_SHA='$CANDIDATE_SHA' CANDIDATE_IMAGE='$CANDIDATE_IMAGE' CANDIDATE_IMAGE_ID='$CANDIDATE_IMAGE_ID' SCHOOL_ORIGIN='$SCHOOL_ORIGIN' STAGING_ORIGIN='$STAGING_ORIGIN' AUDIT_PUBLIC_ORIGIN='$AUDIT_ORIGIN' AUDIT_BIND_ORIGIN='$AUDIT_BIND_ORIGIN' bash -s" \
              < .github/scripts/school-authorized-visual-fixture.sh

      - name: Upload authorized visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: school-authorized-design-audit-${{ github.run_id }}
          path: school-authorized-visual-output
          if-no-files-found: error
          retention-days: 14

      - name: Publish authorized audit result
        if: always()
        env:
          CAPTURE_RESULT: ${{ steps.capture.outputs.result }}
          VIOLATION_COUNT: ${{ steps.capture.outputs.violation_count }}
          COMPLIANT: ${{ steps.capture.outputs.compliant }}
          DS02_VIOLATIONS: ${{ steps.capture.outputs.ds02_violation_count }}
          DS03_VIOLATIONS: ${{ steps.capture.outputs.ds03_violation_count }}
        shell: bash
        run: |
          {
            echo '## School diary authorized design audit'
            echo
            printf -- '- Candidate: %s\n' "$CANDIDATE_SHA"
            printf -- '- Immutable image ID: %s\n' "$CANDIDATE_IMAGE_ID"
            printf -- '- Roles: director, teacher, parent, student\n'
            printf -- '- DS-02 boundary routes: /management, /journal, /homework, /schedule\n'
            printf -- '- DS-02 widths: 767, 768, 800, 801, 1199, 1200 px\n'
            printf -- '- DS-03 student routes: /, /schedule, /journal, /homework, /calendar, /school, /profile\n'
            printf -- '- DS-03 School states: Меню, Мероприятия, Доп. занятия\n'
            printf -- '- DS-03 School evidence schema: 1.3.0 selector/count/contrast/focus\n'
            printf -- '- DS-03 route widths: 390, 768, 1440 px\n'
            printf -- '- Evidence: 51 screenshots plus computed-style manifest\n'
            printf -- '- Data: empty schema from candidate migrations; synthetic only\n'
            printf -- '- Exposure: isolated no-masquerade bridge, loopback port, SSH tunnel\n'
            printf -- '- Production/staging UI, data, restart changed: no\n'
            printf -- '- Capture result: %s\n' "${CAPTURE_RESULT:-failed}"
            printf -- '- Design compliant: %s\n' "${COMPLIANT:-not measured}"
            printf -- '- DS-02 shell violations: %s\n' "${DS02_VIOLATIONS:-not measured}"
            printf -- '- DS-03 theme/font/route violations: %s\n' "${DS03_VIOLATIONS:-not measured}"
            printf -- '- All-design violations (future stages included): %s\n' "${VIOLATION_COUNT:-not measured}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report authorized capture as commit status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          CANDIDATE_SHA: ${{ env.CANDIDATE_SHA }}
        with:
          script: |
            const state =
              process.env.JOB_STATUS === "success" ? "success" : "failure";
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: process.env.CANDIDATE_SHA,
              state,
              context: "school-diary/authorized-visual-capture",
              description: "Authorized visual capture " + process.env.JOB_STATUS,
              target_url:
                process.env.GITHUB_SERVER_URL +
                "/" +
                process.env.GITHUB_REPOSITORY +
                "/actions/runs/" +
                process.env.GITHUB_RUN_ID,
            });
