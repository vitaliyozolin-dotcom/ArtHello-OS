name: Verify Atlas diary
on:
  pull_request:
    branches: [atlas/foundation]
  push:
    branches: [codex/atlas-diary-foundation-20260910]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          NEXT_PUBLIC_SCHOOL_DESIGN_V1: 'true'
