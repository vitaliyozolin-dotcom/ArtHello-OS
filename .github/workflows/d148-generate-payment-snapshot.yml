name: D148 payment snapshot generator

on:
  push:
    branches:
      - codex/arthello-pay-d148-20260911

permissions:
  contents: write

jobs:
  generate-and-seal:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Reset only unsealed 0019 metadata in runner
        run: |
          rm -f lib/db/drizzle/0019_*.sql
          rm -f lib/db/drizzle/meta/0019_snapshot.json
          node <<'NODE'
          const fs = require('node:fs');
          const journalPath = 'lib/db/drizzle/meta/_journal.json';
          const journal = JSON.parse(fs.readFileSync(journalPath, 'utf8'));
          journal.entries = journal.entries.filter((entry) => entry.idx !== 19);
          fs.writeFileSync(journalPath, `${JSON.stringify(journal, null, 2)}\n`);
          NODE

      - name: Generate canonical migration and chained snapshot
        run: pnpm --filter @workspace/db run generate

      - name: Verify migration is additive and payment-only
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const dir = 'lib/db/drizzle';
          const files = fs.readdirSync(dir).filter((name) => /^0019_.*\.sql$/.test(name));
          if (files.length !== 1) throw new Error(`Expected exactly one 0019 migration, got ${files.length}`);
          if (!fs.existsSync('lib/db/drizzle/meta/0019_snapshot.json')) throw new Error('0019 snapshot missing');

          const sql = fs.readFileSync(path.join(dir, files[0]), 'utf8');
          const expectedTables = new Set([
            'fiscal_receipts',
            'payment_events',
            'payment_obligations',
            'payment_requests',
            'payment_routes',
          ]);
          const created = [...sql.matchAll(/CREATE TABLE "([^"]+)"/g)].map((match) => match[1]);
          if (created.length !== expectedTables.size || created.some((table) => !expectedTables.has(table))) {
            throw new Error(`Unexpected CREATE TABLE set: ${created.join(', ')}`);
          }
          const altered = [...sql.matchAll(/ALTER TABLE "([^"]+)"/g)].map((match) => match[1]);
          if (altered.some((table) => !expectedTables.has(table))) {
            throw new Error(`Migration alters a pre-existing table: ${altered.join(', ')}`);
          }
          if (/\b(DROP\s+(TABLE|COLUMN|CONSTRAINT|INDEX)|TRUNCATE\b|DELETE\s+FROM\b|UPDATE\s+")/i.test(sql)) {
            throw new Error('Destructive or data-mutating SQL detected');
          }

          const requiredGuards = [
            'payment_routes_active_scope_uniq',
            'payment_routes_provider_check',
            'payment_routes_fiscal_status_check',
            'payment_obligations_source_ref_uniq',
            'payment_obligations_amount_check',
            'payment_obligations_paid_check',
            'payment_obligations_currency_check',
            'payment_obligations_status_check',
            'payment_obligations_evidence_check',
            'payment_requests_amount_check',
            'payment_requests_currency_check',
            'payment_requests_status_check',
            'fiscal_receipts_kind_check',
            'fiscal_receipts_status_check',
          ];
          for (const guard of requiredGuards) {
            if (!sql.includes(guard)) throw new Error(`Required payment guard missing: ${guard}`);
          }
          NODE

      - name: Seal migration manifest
        run: |
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');

          const journalPath = 'lib/db/drizzle/meta/_journal.json';
          const manifestPath = 'lib/db/migration-manifest.json';
          const journal = JSON.parse(fs.readFileSync(journalPath, 'utf8'));
          const entry = journal.entries.find((item) => item.idx === 19);
          if (!entry) throw new Error('Generated journal entry 0019 is missing');
          const sqlPath = path.join('lib/db/drizzle', `${entry.tag}.sql`);
          if (!fs.existsSync(sqlPath)) throw new Error(`Generated SQL missing: ${sqlPath}`);
          const sha256 = crypto.createHash('sha256').update(fs.readFileSync(sqlPath)).digest('hex');

          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          manifest.migrations = manifest.migrations.filter((item) => !item.tag.startsWith('0019_'));
          manifest.migrations.push({ tag: entry.tag, timestamp: entry.when, sha256 });
          fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

      - name: Verify migration metadata contract
        run: node --test scripts/test/migration-metadata.test.mjs

      - name: Upload generated migration evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d148-sealed-payment-migration
          path: |
            lib/db/drizzle/0019_*.sql
            lib/db/drizzle/meta/0019_snapshot.json
            lib/db/drizzle/meta/_journal.json
            lib/db/migration-manifest.json
          if-no-files-found: error
          retention-days: 1

      - name: Commit generated migration and retire one-shot workflow
        run: |
          git config user.name "arthello-migration-bot"
          git config user.email "arthello-migration-bot@users.noreply.github.com"
          git rm .github/workflows/d148-generate-payment-snapshot.yml
          git add -A lib/db/drizzle lib/db/migration-manifest.json .github/workflows/d148-generate-payment-snapshot.yml
          git status --short
          git commit -m "D148: seal generated ArtHello Pay migration"
          git push origin HEAD:${GITHUB_REF_NAME}
