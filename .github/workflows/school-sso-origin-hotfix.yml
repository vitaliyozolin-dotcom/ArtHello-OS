name: School staff SSO origin hotfix

on:
  push:
    branches:
      - school/fix-sso-exchange-origin-20260902
    paths:
      - server/central-sso.ts
      - tests/identity-broker-contract.test.mjs
      - .github/workflows/school-sso-origin-hotfix.yml
      - Dockerfile
      - package.json
      - package-lock.json
  pull_request:
    branches:
      - school/staging-foundation-20260827
    paths:
      - server/central-sso.ts
      - tests/identity-broker-contract.test.mjs
      - .github/workflows/school-sso-origin-hotfix.yml

permissions:
  contents: read
  statuses: write

concurrency:
  group: school-sso-origin-${{ github.ref }}
  cancel-in-progress: true

env:
  ARTHELLO_ORIGIN: https://arthello-188-225-38-55.sslip.io

jobs:
  validate:
    runs-on: [self-hosted, linux, x64, arthello-gateway]
    timeout-minutes: 55
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify minimal source change
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          grep -F 'origin: exchangeUrl.origin' server/central-sso.ts >/dev/null
          ! grep -F 'origin: request' server/central-sso.ts >/dev/null
          printf 'SCHOOL_SSO_ORIGIN_SOURCE=PASS\n'

      - name: Build exact School candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 0755 -d .openai
          printf '%s\n' '{"d1": null, "r2": null}' > .openai/hosting.json
          image="school-sso-origin-hotfix:${GITHUB_SHA}"
          docker build \
            --build-arg NEXT_PUBLIC_SCHOOL_DESIGN_V1=true \
            --build-arg NEXT_PUBLIC_SCHOOL_PARENT_OTP_ENABLED=false \
            --target builder \
            --tag "$image" .
          docker run --rm --network none --entrypoint node "$image" \
            --test \
            tests/phone-auth-contract.test.mjs \
            tests/central-access-contract.test.mjs \
            tests/central-family-directory.test.mjs \
            tests/identity-broker-contract.test.mjs \
            tests/design-code-contract.test.mjs \
            tests/school-structure-contract.test.mjs \
            tests/methodist-role-contract.test.mjs
          printf 'SCHOOL_SSO_ORIGIN_BUILD=PASS\n'

      - name: Verify ArtHello production origin boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$(mktemp -d "$RUNNER_TEMP/school-sso-origin-XXXXXX")"
          trap 'rm -rf -- "$work"' EXIT
          code="$(printf 'a%.0s' $(seq 1 43))"
          verifier="$(printf 'b%.0s' $(seq 1 43))"
          body="{\"code\":\"$code\",\"codeVerifier\":\"$verifier\"}"

          no_origin="$(curl -sS --max-time 20 \
            -o "$work/no-origin.json" -w '%{http_code}' \
            -X POST "$ARTHELLO_ORIGIN/api/school-sso/exchange" \
            -H 'content-type: application/json' \
            --data "$body")"
          same_origin="$(curl -sS --max-time 20 \
            -o "$work/same-origin.json" -w '%{http_code}' \
            -X POST "$ARTHELLO_ORIGIN/api/school-sso/exchange" \
            -H 'content-type: application/json' \
            -H "origin: $ARTHELLO_ORIGIN" \
            --data "$body")"
          test "$no_origin" = 403
          test "$same_origin" = 401
          python3 - "$work/same-origin.json" <<'PY'
          import json, pathlib, sys
          payload=json.loads(pathlib.Path(sys.argv[1]).read_text())
          if not payload.get('error'):
              raise SystemExit('Expected application-level invalid-code error')
          PY
          printf 'SCHOOL_SSO_ORIGIN_BOUNDARY=PASS\n'

      - name: Cleanup candidate image
        if: always()
        shell: bash
        run: |
          docker image rm "school-sso-origin-hotfix:${GITHUB_SHA}" >/dev/null 2>&1 || true

      - name: Publish exact commit status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.sha,
              state: process.env.JOB_STATUS === 'success' ? 'success' : 'failure',
              context: 'school/sso-origin-hotfix',
              description: 'School SSO origin hotfix ' + process.env.JOB_STATUS,
              target_url: process.env.GITHUB_SERVER_URL + '/' + process.env.GITHUB_REPOSITORY + '/actions/runs/' + process.env.GITHUB_RUN_ID,
            });
