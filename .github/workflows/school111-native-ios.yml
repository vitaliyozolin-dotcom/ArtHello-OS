name: School111 native Keychain acceptance replay
# Pinned replay only; runtime changes require the full build at 2d18f6d8.
on:
  push:
    branches: [fix/school111-ios-keychain-release]
    paths: [mobile/school111/**, .github/workflows/school111-native-ios.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: school111-native-keychain-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 35
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: mobile/school111
      - uses: actions/download-artifact@v4
        with:
          name: school111-keychain-fixed-source-and-proof
          run-id: 36268330034
          github-token: ${{ github.token }}
          path: input/source
      - uses: actions/download-artifact@v4
        with:
          name: school111-production-origin-simulator
          run-id: 36268330034
          github-token: ${{ github.token }}
          path: input/app
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify native archive including executable modes
        run: python3 mobile/school111/replay-prepare.py
      - name: Build native test host and check source
        working-directory: native-app
        run: |
          set -o pipefail
          npm ci --ignore-scripts --no-audit --no-fund > proof/install.log 2>&1
          npm run typecheck 2>&1 | tee proof/typecheck.log
          npm test 2>&1 | tee proof/unit-tests.log
          npm run test:backend 2>&1 | tee proof/backend-tests.log
          npm run test:release 2>&1 | tee proof/release-tests.log
          ruby ci/replay-harness.rb
          xcodebuild -project ci/harness/AcceptanceHost.xcodeproj -scheme NativeAcceptance -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath harness-build CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= -jobs 3 build-for-testing 2>&1 | tee proof/harness-build.log
      - name: Boot native simulator with diagnostic evidence
        working-directory: native-app
        timeout-minutes: 15
        run: |
          set -o pipefail
          xcrun simctl list devices available -j > proof/available-simulators.json
          device=$(python3 -c 'import json;d=json.load(open("proof/available-simulators.json"));a=[x for g in d["devices"].values() for x in g if x.get("isAvailable") and x["name"].startswith("iPhone")];assert a;print(next((x for x in a if x["name"]=="iPhone 17 Pro"),a[0])["udid"])')
          echo "$device" > proof/simulator-id.txt
          xcrun simctl boot "$device" 2>&1 | tee proof/simulator-boot.log || true
          xcrun simctl bootstatus "$device" -b 2>&1 | tee proof/simulator-bootstatus.log
          codesign --verify --deep --strict --verbose=2 ci/real-production-app/111.app 2>&1 | tee proof/signature-verification.log
          xcrun simctl install "$device" ci/real-production-app/111.app 2>&1 | tee proof/simulator-install.log
      - name: Native startup of the exact production-origin app
        working-directory: native-app
        timeout-minutes: 7
        run: |
          set -o pipefail
          device=$(cat proof/simulator-id.txt)
          xcodebuild -project ci/harness/AcceptanceHost.xcodeproj -scheme NativeAcceptance -configuration Release -destination "platform=iOS Simulator,id=$device" -derivedDataPath harness-build -parallel-testing-enabled NO -resultBundlePath proof/production-startup.xcresult -only-testing:School111UITests/StartupTests CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= test-without-building 2>&1 | tee proof/production-startup.log
          xcrun simctl launch "$device" ru.arthello.school111
          sleep 3
          xcrun simctl io "$device" screenshot preview/production-login-fixed.png
      - name: Prepare isolated HTTPS native QA copy
        working-directory: native-app
        run: |
          mkdir -p ci/tls ci/qa-app
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 2 -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' -addext 'basicConstraints=critical,CA:TRUE' -keyout ci/tls/key.pem -out ci/tls/cert.pem
          xcrun simctl keychain "$(cat proof/simulator-id.txt)" add-root-cert ci/tls/cert.pem
          ditto ci/real-production-app/111.app ci/qa-app/111.app
          python3 - <<'PY'
          import pathlib,json,hashlib
          src=pathlib.Path('ci/real-production-app/111.app');dst=pathlib.Path('ci/qa-app/111.app')
          p=dst/'EXConstants.bundle/app.config';d=json.loads(p.read_text());assert d['extra']['apiOrigin']=='https://school-188-225-38-55.sslip.io';d['extra']['apiOrigin']='https://localhost:8843';p.write_text(json.dumps(d))
          h={}
          for n in ['111','main.jsbundle']:
            a=hashlib.sha256((src/n).read_bytes()).hexdigest();b=hashlib.sha256((dst/n).read_bytes()).hexdigest();assert a==b;h[n]=a
          pathlib.Path('proof/qa-runtime-code-hashes.json').write_text(json.dumps({'codeIdenticalToProductionArtifact':True,'sha256':h,'onlyResourceOverride':'EXConstants.bundle/app.config extra.apiOrigin','qaOrigin':'https://localhost:8843'},indent=2))
          PY
          codesign --force --sign - --preserve-metadata=identifier,entitlements,requirements --timestamp=none ci/qa-app/111.app
          codesign --verify --deep --strict --verbose=2 ci/qa-app/111.app
          otool -s __TEXT __entitlements ci/real-production-app/111.app/111 | tail -n +2 > proof/production-entitlements.hex
          otool -s __TEXT __entitlements ci/qa-app/111.app/111 | tail -n +2 > proof/qa-entitlements.hex
          diff -u proof/production-entitlements.hex proof/qa-entitlements.hex
          xcrun simctl terminate "$(cat proof/simulator-id.txt)" ru.arthello.school111 || true
          xcrun simctl install "$(cat proof/simulator-id.txt)" ci/qa-app/111.app
      - name: Real Keychain persistence, logout and native diary UI
        working-directory: native-app
        timeout-minutes: 10
        run: |
          set -o pipefail
          device=$(cat proof/simulator-id.txt)
          node --experimental-transform-types fixture-server.mts > proof/fixture-server.log 2>&1 &
          fixture=$!
          trap 'curl --cacert ci/tls/cert.pem -s https://localhost:8843/test/stats > proof/native-fixture-final.json || true; kill "$fixture" 2>/dev/null || true' EXIT
          xcodebuild -project ci/harness/AcceptanceHost.xcodeproj -scheme NativeAcceptance -configuration Release -destination "platform=iOS Simulator,id=$device" -derivedDataPath harness-build -parallel-testing-enabled NO -resultBundlePath proof/native-diary.xcresult -only-testing:School111UITests/NativeDiaryTests CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= test-without-building 2>&1 | tee proof/native-diary.log
          curl --cacert ci/tls/cert.pem -fsS https://localhost:8843/test/stats > proof/native-fixture-final.json
          python3 - <<'PY'
          import json,pathlib
          s=json.loads(pathlib.Path('proof/native-fixture-final.json').read_text())
          assert s['loginAccepted']>=3 and s['loginRejected']>=1 and s['logout']>=1 and s['cookiesObserved'] and s['authenticatedReads']>=5 and s['unauthenticatedDenied']>=1,s
          pathlib.Path('proof/native-verdict.json').write_text(json.dumps({'productionStartup':'PASS','nativeSessionScenario':'PASS','compiledBuildRun':36268330034,'storage':'actual iOS simulator Keychain','transport':'native HTTPS to isolated fixture','qaConfigOnlyOverride':True,'runtimeCodeUnchanged':True,'fictionalDataOnly':True,'realDevice':False,'signedDeviceIPA':False,'testflight':False,'productionChanged':False},indent=2))
          PY
      - name: Preserve native evidence and readable source
        if: always()
        run: |
          if [ -d native-app/proof/production-startup.xcresult ]; then xcrun xcresulttool export attachments --path native-app/proof/production-startup.xcresult --output-path native-app/preview/startup || true; fi
          if [ -d native-app/proof/native-diary.xcresult ]; then xcrun xcresulttool export attachments --path native-app/proof/native-diary.xcresult --output-path native-app/preview/diary || true; fi
          python3 - <<'PY'
          import pathlib,zipfile,hashlib,json,shutil
          root=pathlib.Path('native-app')
          if not root.exists():raise SystemExit(0)
          shutil.copy('.github/workflows/school111-native-ios.yml',root/'ci/acceptance-replay.yml')
          skip={'node_modules','Pods','harness-build','.expo','.git','tls','real-production-app','qa-app','prior-preview-r2'}
          files=[]
          for p in root.rglob('*'):
            if not p.is_file():continue
            r=p.relative_to(root)
            if any(t in skip or t.endswith('.xcresult') for t in r.parts) or p.suffix in {'.pem','.key','.p12','.mobileprovision','.ttf','.otf','.woff','.woff2','.db','.sqlite','.zip'} or p.name=='.xcode.env.local' or p.name.startswith('.env') and p.name!='.env.example':continue
            files.append(p)
          h=root/'proof/file-hashes.json';h.write_text(json.dumps({str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in files},indent=2));files.append(h)
          with zipfile.ZipFile('school111-ios-native-verified-source.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in files:z.write(p,'school111-native/'+str(p.relative_to(root)))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: school111-native-verified-source-and-proof
          path: school111-ios-native-verified-source.zip
          retention-days: 30
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: school111-production-origin-simulator
          path: native-app/school111-production-origin-simulator.app.zip
          retention-days: 30
          if-no-files-found: warn
