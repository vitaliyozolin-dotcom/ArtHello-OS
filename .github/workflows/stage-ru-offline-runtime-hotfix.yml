name: Build and stage RU offline runtime hotfix

on:
  push:
    branches:
      - codex/arthello-offline-runtime-hotfix
    paths:
      - .github/workflows/stage-ru-offline-runtime-hotfix.yml
      - deploy/Dockerfile
      - deploy/api-entrypoint.sh
      - deploy/activate-git-transport.sh

permissions:
  contents: write

concurrency:
  group: arthello-production-ru-offline-runtime
  cancel-in-progress: false

env:
  APPLICATION_REF: f7bb971f362bb8fe3f76209eba01237c602d9946
  TRANSPORT_BRANCH: transport/arthello-ru-f7bb971f362bb8fe3f76209eba01237c602d9946-offline-runtime-v1

jobs:
  build-test-and-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout immutable application source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APPLICATION_REF }}
          path: application
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact runtime infrastructure
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: runtime-infrastructure
          fetch-depth: 0
          persist-credentials: true

      - name: Verify immutable inputs and overlay offline entrypoint
        run: |
          set -Eeuo pipefail
          test "$(git -C application rev-parse HEAD)" = "$APPLICATION_REF"
          test "$(git -C runtime-infrastructure rev-parse HEAD)" = "$GITHUB_SHA"
          git -C runtime-infrastructure fsck --full --strict
          sh -n runtime-infrastructure/deploy/api-entrypoint.sh
          bash -n runtime-infrastructure/deploy/activate-git-transport.sh
          if grep -Eq '(^|[[:space:]])pnpm([[:space:]]|$)|corepack|registry\.npmjs\.org' \
            runtime-infrastructure/deploy/api-entrypoint.sh; then
            echo 'Runtime entrypoint still has a package-manager/network dependency.' >&2
            exit 1
          fi
          cp runtime-infrastructure/deploy/api-entrypoint.sh \
            application/deploy/api-entrypoint.sh
          cat > application/.dockerignore <<'EOF'
          .git
          .github
          node_modules
          **/node_modules
          coverage
          **/coverage
          EOF

      - name: Build immutable runtime images on GitHub
        run: |
          set -Eeuo pipefail
          docker build \
            --file runtime-infrastructure/deploy/Dockerfile \
            --target api \
            --label "org.opencontainers.image.revision=$APPLICATION_REF" \
            --label "org.opencontainers.image.runtime-revision=$GITHUB_SHA" \
            --tag "arthello-os-api:$APPLICATION_REF" \
            application
          docker build \
            --file runtime-infrastructure/deploy/Dockerfile \
            --target web \
            --label "org.opencontainers.image.revision=$APPLICATION_REF" \
            --label "org.opencontainers.image.runtime-revision=$GITHUB_SHA" \
            --tag "arthello-os-web:$APPLICATION_REF" \
            application
          docker pull postgres:16-alpine

      - name: Prove API startup without Internet egress
        run: |
          set -Eeuo pipefail
          network="arthello-offline-$GITHUB_RUN_ID"
          db_container="arthello-offline-db-$GITHUB_RUN_ID"
          api_container="arthello-offline-api-$GITHUB_RUN_ID"
          cleanup() {
            docker rm -f "$api_container" "$db_container" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker network create --internal "$network"
          docker run -d --name "$db_container" --network "$network" \
            --network-alias db \
            -e POSTGRES_DB=arthello_runtime \
            -e POSTGRES_USER=arthello_runtime \
            -e POSTGRES_PASSWORD=offline-smoke-only \
            postgres:16-alpine

          db_ready=0
          for _ in $(seq 1 60); do
            if docker exec "$db_container" \
              pg_isready -U arthello_runtime -d arthello_runtime >/dev/null 2>&1; then
              db_ready=1
              break
            fi
            sleep 2
          done
          test "$db_ready" -eq 1

          docker run -d --name "$api_container" --network "$network" \
            --read-only --tmpfs /tmp \
            -e NODE_ENV=production \
            -e PORT=8080 \
            -e TRUST_PROXY_HOPS=1 \
            -e APP_ORIGINS=https://offline.invalid \
            -e DATABASE_URL=postgresql://arthello_runtime:offline-smoke-only@db:5432/arthello_runtime \
            "arthello-os-api:$APPLICATION_REF"

          api_ready=0
          for _ in $(seq 1 120); do
            if [ "$(docker inspect -f '{{.State.Running}}' "$api_container")" != true ]; then
              break
            fi
            if docker exec "$api_container" node -e \
              "fetch('http://127.0.0.1:8080/api/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"; then
              api_ready=1
              break
            fi
            sleep 2
          done

          if [ "$api_ready" -ne 1 ]; then
            docker inspect "$api_container"
            docker logs "$api_container"
            exit 1
          fi

          api_logs="$(docker logs "$api_container" 2>&1)"
          if grep -Eqi 'registry\.npmjs\.org|corepack|pnpm/latest' <<<"$api_logs"; then
            printf '%s\n' "$api_logs" >&2
            echo 'Offline runtime attempted package-manager network access.' >&2
            exit 1
          fi
          printf 'ARTHELLO_OFFLINE_RUNTIME_CHECK=PASSED\n'

      - name: Package and checksum the verified runtime
        run: |
          set -Eeuo pipefail
          release_dir=/tmp/arthello-offline-release
          payload_dir="/tmp/arthello-offline-transport/$APPLICATION_REF"
          bundle="arthello-ru-images-$APPLICATION_REF.tar.gz"
          manifest="arthello-ru-images-$APPLICATION_REF.manifest"
          checksums="arthello-ru-images-$APPLICATION_REF.sha256"
          release_script="arthello-ru-pull-release-$APPLICATION_REF.sh"
          mkdir -p "$release_dir" "$payload_dir"

          docker image save \
            "arthello-os-api:$APPLICATION_REF" \
            "arthello-os-web:$APPLICATION_REF" \
            postgres:16-alpine | gzip -1 > "$release_dir/$bundle"

          {
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'source_sha=%s\n' "$APPLICATION_REF"
            printf 'source_tree=%s\n' "$(git -C application rev-parse HEAD^{tree})"
            printf 'runtime_infrastructure_sha=%s\n' "$GITHUB_SHA"
            printf 'runtime_infrastructure_tree=%s\n' \
              "$(git -C runtime-infrastructure rev-parse HEAD^{tree})"
            printf 'api_entrypoint_sha256=%s\n' \
              "$(sha256sum runtime-infrastructure/deploy/api-entrypoint.sh | cut -d ' ' -f 1)"
            printf 'api_image_id=%s\n' \
              "$(docker image inspect --format '{{.Id}}' "arthello-os-api:$APPLICATION_REF")"
            printf 'web_image_id=%s\n' \
              "$(docker image inspect --format '{{.Id}}' "arthello-os-web:$APPLICATION_REF")"
            printf 'postgres_image_id=%s\n' \
              "$(docker image inspect --format '{{.Id}}' postgres:16-alpine)"
            printf 'offline_runtime_check=passed\n'
            printf 'real_data=not_loaded\n'
            printf 'integrations=disabled\n'
            printf 'first_owner=not_created\n'
            printf 'dns=not_changed\n'
          } > "$release_dir/$manifest"

          cp runtime-infrastructure/deploy/pull-release.sh \
            "$release_dir/$release_script"
          chmod 0755 "$release_dir/$release_script"
          (
            cd "$release_dir"
            sha256sum "$bundle" "$manifest" "$release_script" > "$checksums"
            sha256sum --check "$checksums"
          )

          cp "$release_dir/$manifest" "$payload_dir/"
          cp "$release_dir/$checksums" "$payload_dir/"
          cp "$release_dir/$release_script" "$payload_dir/"
          cp runtime-infrastructure/deploy/activate-git-transport.sh \
            "$payload_dir/activate-git-transport.sh"
          chmod 0755 "$payload_dir/activate-git-transport.sh"
          split --bytes=45M --numeric-suffixes=0 --suffix-length=3 \
            "$release_dir/$bundle" "$payload_dir/$bundle.part-"

          part_count="$(find "$payload_dir" -maxdepth 1 -type f \
            -name "$bundle.part-*" | wc -l)"
          test "$part_count" -gt 1
          if find "$payload_dir" -maxdepth 1 -type f -size +46M | grep -q .; then
            echo 'A transport chunk exceeds the Git-safe size gate.' >&2
            exit 1
          fi

          {
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'application_sha=%s\n' "$APPLICATION_REF"
            printf 'runtime_infrastructure_sha=%s\n' "$GITHUB_SHA"
            printf 'transport_branch=%s\n' "$TRANSPORT_BRANCH"
            printf 'transport=git_chunks\n'
            printf 'chunk_size=45M\n'
            printf 'chunk_count=%s\n' "$part_count"
            printf 'offline_runtime_check=passed\n'
            printf 'real_data=not_loaded\n'
            printf 'integrations=disabled\n'
            printf 'first_owner=not_created\n'
            printf 'dns=not_changed\n'
          } > "$payload_dir/transport.manifest"
          (
            cd "$payload_dir"
            find . -maxdepth 1 -type f ! -name transport.sha256 -print0 \
              | sort -z | xargs -0 sha256sum > transport.sha256
            sha256sum --check transport.sha256
          )

      - name: Publish immutable private Git transport
        run: |
          set -Eeuo pipefail
          repo_dir="$GITHUB_WORKSPACE/runtime-infrastructure"
          payload_dir="/tmp/arthello-offline-transport/$APPLICATION_REF"
          transport_path=".arthello-transport/$APPLICATION_REF"
          cd "$repo_dir"

          if git ls-remote --exit-code --heads origin "$TRANSPORT_BRANCH" >/dev/null 2>&1; then
            git fetch --force --no-tags origin \
              "+refs/heads/$TRANSPORT_BRANCH:refs/remotes/origin/$TRANSPORT_BRANCH"
            existing_dir=/tmp/arthello-existing-offline-transport
            mkdir -p "$existing_dir"
            git archive "refs/remotes/origin/$TRANSPORT_BRANCH" "$transport_path" \
              | tar -x -C "$existing_dir"
            existing_payload="$existing_dir/$transport_path"
            (
              cd "$existing_payload"
              sha256sum --check transport.sha256
            )
            grep -Fx "application_sha=$APPLICATION_REF" \
              "$existing_payload/transport.manifest"
            grep -Fx "runtime_infrastructure_sha=$GITHUB_SHA" \
              "$existing_payload/transport.manifest"
            grep -Fx "transport_branch=$TRANSPORT_BRANCH" \
              "$existing_payload/transport.manifest"
            printf 'ARTHELLO_TRANSPORT_REUSED=YES\n'
            printf 'ARTHELLO_TRANSPORT_COMMIT=%s\n' \
              "$(git rev-parse "refs/remotes/origin/$TRANSPORT_BRANCH")"
            exit 0
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch --force --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main'
          git switch --detach refs/remotes/origin/main
          git switch -c "$TRANSPORT_BRANCH"
          mkdir -p "$transport_path"
          cp -a "$payload_dir/." "$transport_path/"
          git add -- "$transport_path"
          git commit -m "release: stage offline ArtHello RU runtime $APPLICATION_REF"
          git push origin "HEAD:refs/heads/$TRANSPORT_BRANCH"

          printf 'ARTHELLO_TRANSPORT_BRANCH=%s\n' "$TRANSPORT_BRANCH"
          printf 'ARTHELLO_TRANSPORT_COMMIT=%s\n' "$(git rev-parse HEAD)"
          printf 'ARTHELLO_APPLICATION_SHA=%s\n' "$APPLICATION_REF"
          printf 'ARTHELLO_RUNTIME_INFRASTRUCTURE_SHA=%s\n' "$GITHUB_SHA"
          printf 'ARTHELLO_OFFLINE_RUNTIME_CHECK=PASSED\n'
          printf 'ARTHELLO_REAL_DATA=NOT_LOADED\n'
          printf 'ARTHELLO_INTEGRATIONS=DISABLED\n'
          printf 'ARTHELLO_FIRST_OWNER=NOT_CREATED\n'
          printf 'ARTHELLO_DNS=NOT_CHANGED\n'
