name: School diary safety baseline

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/school-diary-safety-baseline.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/school-diary-safety-baseline.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: school-diary-safety-baseline
  cancel-in-progress: false

env:
  SCHOOL_ORIGIN: https://school-188-225-38-55.sslip.io
  BACKUP_ROOT: /backups/design-system
  CHECKPOINT_REF: checkpoint/pre-diary-design-2026-08-27
  EXPECTED_RELEASE_REF: cebe7be40383850ee821031245da8001c0503007

jobs:
  safety-baseline:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'ops/school-diary-safety-baseline-20260827')
    runs-on: [self-hosted, linux, x64, arthello-gateway]
    timeout-minutes: 20
    environment: production-ru
    steps:
      - name: Configure confirmed School SSH host
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ARTHELLO_RU_SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.ARTHELLO_RU_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ARTHELLO_RU_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.ARTHELLO_RU_DEPLOY_PORT }}
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 0700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          test -s ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

          deploy_port="${DEPLOY_PORT:-2222}"
          scanned_hosts="$RUNNER_TEMP/school-known-hosts"
          : > "$scanned_hosts"
          chmod 0600 "$scanned_hosts"
          for attempt in 1 2; do
            printf 'SCHOOL_SSH_HOST_PROBE_ATTEMPT=%s\n' "$attempt"
            timeout --signal=TERM --kill-after=5s 150s               ssh -p "$deploy_port"               -o StrictHostKeyChecking=accept-new               -o UserKnownHostsFile="$scanned_hosts"               -o GlobalKnownHostsFile=/dev/null               -o PreferredAuthentications=none               -o PubkeyAuthentication=no               -o PasswordAuthentication=no               -o KbdInteractiveAuthentication=no               -o ConnectTimeout=140               -o HostKeyAlgorithms=ssh-ed25519               "$DEPLOY_USER@$DEPLOY_HOST" true </dev/null >/dev/null 2>&1 || true
            test -s "$scanned_hosts" && break
            sleep 5
          done
          test -s "$scanned_hosts"
          actual_fingerprint="$(ssh-keygen -lf "$scanned_hosts" -E sha256 | awk '{print $2; exit}')"
          printf 'SCHOOL_SSH_HOST_FINGERPRINT=%s\n' "$actual_fingerprint"
          test "$actual_fingerprint" = 'SHA256:/kBNohTF+5g8U+jQt+PzOCoWZ9yCSFjBnEP3Oc3MwRI'
          mv "$scanned_hosts" ~/.ssh/known_hosts
          printf 'SCHOOL_SSH_HOST=VERIFIED\n'

      - name: Create and verify remote safety baseline
        id: backup
        env:
          DEPLOY_HOST: ${{ secrets.ARTHELLO_RU_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ARTHELLO_RU_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.ARTHELLO_RU_DEPLOY_PORT }}
        shell: bash
        run: |
          set -Eeuo pipefail
          deploy_port="${DEPLOY_PORT:-2222}"
          ssh_args=(
            -p "$deploy_port"
            -i ~/.ssh/id_ed25519
            -o IdentitiesOnly=yes
            -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no
            -o KbdInteractiveAuthentication=no
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile=~/.ssh/known_hosts
            -o ConnectTimeout=140
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=12
            -o IPQoS=none
            -o Compression=no
            -o KexAlgorithms=curve25519-sha256
            -o HostKeyAlgorithms=ssh-ed25519
            -o PubkeyAcceptedAlgorithms=ssh-ed25519
            -o Ciphers=aes128-ctr
            -o MACs=hmac-sha2-256
          )
          log_file="$RUNNER_TEMP/school-safety-baseline.log"
          timeout --signal=TERM --kill-after=10s 900s             ssh -T "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST"               "env RUN_ID='$GITHUB_RUN_ID' WORKFLOW_SHA='$GITHUB_SHA' CHECKPOINT_REF='$CHECKPOINT_REF' EXPECTED_RELEASE_REF='$EXPECTED_RELEASE_REF' SCHOOL_ORIGIN='$SCHOOL_ORIGIN' BACKUP_ROOT='$BACKUP_ROOT' bash -s"               <<'REMOTE' | tee "$log_file"
          set -Eeuo pipefail
          exec 9>/var/lock/school-1-11-safety-baseline.lock
          flock -n 9
          container=school-1-11

          test -d /srv/school-1-11
          test "$(docker inspect "$container" --format '{{.State.Running}}')" = true
          health="$(docker inspect "$container" --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}')"
          test "$health" = healthy
          data_volume="$(docker inspect "$container" --format '{{range .Mounts}}{{if eq .Destination "/data"}}{{if .Name}}{{.Name}}{{else}}{{.Source}}{{end}}{{end}}{{end}}')"
          backup_volume="$(docker inspect "$container" --format '{{range .Mounts}}{{if eq .Destination "/backups"}}{{if .Name}}{{.Name}}{{else}}{{.Source}}{{end}}{{end}}{{end}}')"
          release="$(readlink -f /srv/school-1-11/current)"
          test -n "$data_volume"
          test -n "$backup_volume"
          test -d "$release"
          curl -fsS --max-time 30 "$SCHOOL_ORIGIN/api/health" | grep -F '"status":"ok"' >/dev/null
          printf 'SCHOOL_PREFLIGHT=OK\n'
          printf 'SCHOOL_LIVE_RELEASE=%s\n' "$release"
          printf 'SCHOOL_DATA_MOUNT=%s\n' "$data_volume"
          printf 'SCHOOL_BACKUP_MOUNT=%s\n' "$backup_volume"

          started_before="$(docker inspect "$container" --format '{{.State.StartedAt}}')"
          image_ref="$(docker inspect "$container" --format '{{.Config.Image}}')"
          image_id="$(docker image inspect "$image_ref" --format '{{.Id}}')"
          backup_path="$(docker exec "$container" node scripts/backup-db.mjs | tail -n1)"
          case "$backup_path" in
            /backups/school-1-11-*.sqlite) ;;
            *) printf 'Unexpected backup path: %s\n' "$backup_path" >&2; exit 1 ;;
          esac

          docker exec -i -e BACKUP_PATH="$backup_path" "$container" node --input-type=module - <<'NODE'
          import { DatabaseSync } from 'node:sqlite';
          import { statSync } from 'node:fs';
          const path = process.env.BACKUP_PATH;
          const stat = statSync(path);
          if (!stat.isFile() || stat.size < 4096) throw new Error('Backup file is empty');
          const db = new DatabaseSync(path, { readOnly: true });
          const rows = db.prepare('PRAGMA quick_check').all();
          if (rows.length !== 1 || rows[0].quick_check !== 'ok') throw new Error('SQLite quick_check failed');
          const tableCount = db.prepare("SELECT count(*) AS count FROM sqlite_master WHERE type='table'").get().count;
          db.close();
          console.log(`SCHOOL_BACKUP_SQLITE=OK tables=${tableCount} bytes=${stat.size}`);
          NODE

          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          target="$BACKUP_ROOT/$stamp-run-$RUN_ID"
          target_rel="${target#/backups/}"
          case "$target_rel" in
            design-system/*-run-*) ;;
            *) printf 'Unexpected target: %s\n' "$target" >&2; exit 1 ;;
          esac
          work="$(mktemp -d /tmp/school-diary-safety.XXXXXX)"
          cleanup_work() {
            if [[ "$work" == /tmp/school-diary-safety.* ]]; then
              rm -rf -- "$work"
            fi
          }
          trap cleanup_work EXIT
          docker cp "$container:$backup_path" "$work/database.sqlite"
          chmod 0600 "$work/database.sqlite"

          curl -fsS --max-time 30 "$SCHOOL_ORIGIN/api/health" > "$work/health.json"
          curl -fsS --max-time 30 -H 'Cache-Control: no-cache' \
            "$SCHOOL_ORIGIN/login?baseline=$RUN_ID" > "$work/login.html"
          : > "$work/baseline.css"
          grep -oE '/_next/static/css/[^"?]+\.css' "$work/login.html" | sort -u > "$work/css-paths.txt"
          test -s "$work/css-paths.txt"
          while IFS= read -r css_path; do
            curl -fsS --max-time 30 "$SCHOOL_ORIGIN$css_path" >> "$work/baseline.css"
            printf '\n' >> "$work/baseline.css"
          done < "$work/css-paths.txt"
          test -s "$work/baseline.css"

          container_id="$(docker inspect "$container" --format '{{.Id}}')"
          container_created="$(docker inspect "$container" --format '{{.Created}}')"
          {
            printf 'created_utc=%s\n' "$stamp"
            printf 'workflow_sha=%s\n' "$WORKFLOW_SHA"
            printf 'checkpoint_ref=%s\n' "$CHECKPOINT_REF"
            printf 'expected_release_ref=%s\n' "$EXPECTED_RELEASE_REF"
            printf 'live_release=%s\n' "$release"
            printf 'container_name=%s\n' "$container"
            printf 'container_id=%s\n' "$container_id"
            printf 'container_created=%s\n' "$container_created"
            printf 'container_started=%s\n' "$started_before"
            printf 'image_ref=%s\n' "$image_ref"
            printf 'image_id=%s\n' "$image_id"
            printf 'data_volume=%s\n' "$data_volume"
            printf 'backup_volume=%s\n' "$backup_volume"
            printf 'native_backup_path=%s\n' "$backup_path"
            printf 'backup_target=%s\n' "$target"
            printf 'public_origin=%s\n' "$SCHOOL_ORIGIN"
            printf 'secrets_copied=no\n'
          } > "$work/manifest.txt"
          chmod 0600 "$work/manifest.txt"

          (
            cd "$work"
            sha256sum database.sqlite health.json login.html baseline.css css-paths.txt manifest.txt > SHA256SUMS
            sha256sum -c SHA256SUMS >/dev/null
          )

          helper="school-diary-backup-verify-$RUN_ID"
          docker rm -f "$helper" >/dev/null 2>&1 || true
          docker run --rm --name "$helper" --read-only --network none --user 0:0 \
            -v "$work:/verify:ro" --entrypoint node "$image_ref" --input-type=module -e "
              import { DatabaseSync } from 'node:sqlite';
              const db = new DatabaseSync('/verify/database.sqlite', { readOnly: true });
              const rows = db.prepare('PRAGMA integrity_check').all();
              if (rows.length !== 1 || rows[0].integrity_check !== 'ok') process.exit(1);
              db.close();
              console.log('SCHOOL_ISOLATED_DB_VERIFY=OK');
            "

          persist_helper="school-diary-backup-persist-$RUN_ID"
          docker rm -f "$persist_helper" >/dev/null 2>&1 || true
          docker run --rm -i --name "$persist_helper" --network none --user 0:0 \
            -e TARGET_REL="$target_rel" \
            -v "$work:/source:ro" -v "$backup_volume:/dest" \
            --entrypoint node "$image_ref" --input-type=module - <<'PERSIST'
          import { cpSync, existsSync, mkdirSync, renameSync, rmSync, writeFileSync } from 'node:fs';
          import { dirname } from 'node:path';
          const rel = process.env.TARGET_REL;
          if (!/^design-system\/[0-9]{8}T[0-9]{6}Z-run-[0-9]+$/.test(rel)) throw new Error('Invalid target');
          const target = `/dest/${rel}`;
          const pending = `${target}.pending`;
          if (existsSync(target) || existsSync(pending)) throw new Error('Target already exists');
          mkdirSync(dirname(target), { recursive: true, mode: 0o700 });
          cpSync('/source', pending, { recursive: true, errorOnExist: true, force: false });
          renameSync(pending, target);
          const marker = '/dest/design-system/LATEST';
          const markerTmp = `${marker}.tmp`;
          rmSync(markerTmp, { force: true });
          writeFileSync(markerTmp, `${rel}\n`, { mode: 0o600 });
          renameSync(markerTmp, marker);
          console.log('SCHOOL_BACKUP_PERSIST=OK');
          PERSIST

          docker run --rm -i --read-only --network none --user 0:0 \
            -e TARGET_REL="$target_rel" -v "$backup_volume:/verify:ro" \
            --entrypoint node "$image_ref" --input-type=module - <<'VERIFY_PERSISTED'
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          import { DatabaseSync } from 'node:sqlite';
          const rel = process.env.TARGET_REL;
          if (!/^design-system\/[0-9]{8}T[0-9]{6}Z-run-[0-9]+$/.test(rel)) throw new Error('Invalid target');
          const root = `/verify/${rel}`;
          const sums = readFileSync(`${root}/SHA256SUMS`, 'utf8').trim().split('\n');
          for (const line of sums) {
            const match = line.match(/^([0-9a-f]{64})  ([A-Za-z0-9._-]+)$/);
            if (!match) throw new Error('Invalid checksum manifest');
            const actual = createHash('sha256').update(readFileSync(`${root}/${match[2]}`)).digest('hex');
            if (actual !== match[1]) throw new Error(`Checksum mismatch: ${match[2]}`);
          }
          const db = new DatabaseSync(`${root}/database.sqlite`, { readOnly: true });
          const rows = db.prepare('PRAGMA integrity_check').all();
          if (rows.length !== 1 || rows[0].integrity_check !== 'ok') throw new Error('Persisted SQLite integrity_check failed');
          db.close();
          console.log('SCHOOL_PERSISTED_BACKUP_VERIFY=OK');
          VERIFY_PERSISTED

          started_after="$(docker inspect "$container" --format '{{.State.StartedAt}}')"
          test "$started_after" = "$started_before"
          test "$(docker inspect "$container" --format '{{.State.Running}}')" = true
          test "$(docker inspect "$container" --format '{{.State.Health.Status}}')" = healthy
          curl -fsS --max-time 30 "$SCHOOL_ORIGIN/api/health" | grep -F '"status":"ok"' >/dev/null
          printf 'SCHOOL_BACKUP=OK target=docker-volume://%s/%s\n' "$backup_volume" "$target_rel"
          printf 'SCHOOL_RESTARTED=no\n'
          printf 'SCHOOL_PUBLIC_HEALTH=OK\n'
          REMOTE

          target="$(sed -n 's/^SCHOOL_BACKUP=OK target=//p' "$log_file" | tail -n1)"
          test -n "$target"
          printf 'target=%s\n' "$target" >> "$GITHUB_OUTPUT"

      - name: Publish safety result
        if: always()
        shell: bash
        env:
          TARGET: ${{ steps.backup.outputs.target }}
        run: |
          {
            echo '## School diary safety baseline'
            echo
            printf -- '- Production UI changed: no\n'
            printf -- '- Production business data changed: no\n'
            printf -- '- Container restarted: no\n'
            printf -- '- Code checkpoint: %s\n' "$CHECKPOINT_REF"
            printf -- '- Backup target: %s\n' "${TARGET:-not-created}"
            printf -- '- Result: %s\n' '${{ job.status }}'
          } >> "$GITHUB_STEP_SUMMARY"
