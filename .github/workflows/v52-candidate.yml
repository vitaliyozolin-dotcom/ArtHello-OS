          mapfile -t stale_images < <(
            docker image ls --format '{{.Repository}}:{{.Tag}}' |
              grep -E '^(arthello-contractors-preview|arthello-ds-pilot-app|arthello-ds-pilot-runtime|arthello-ds-baseline-runtime):' || true
          )
          for image in "${stale_images[@]}"; do
            # A running preview protects its own image; all other targets are disposable.
            docker image rm "$image" >/dev/null 2>&1 || true
          done

          docker image prune --force >/dev/null
          docker builder prune --all --force >/dev/null
          after_kb="$(df -Pk "$docker_root" | awk 'NR == 2 { print $4 }')"
          printf 'ARTHELLO_RUNNER_SPACE_BEFORE_KB=%s\nARTHELLO_RUNNER_SPACE_AFTER_KB=%s\n' "$before_kb" "$after_kb"
          test "$after_kb" -ge 6291456
          curl -fsS --max-time 20 https://arthello-188-225-38-55.sslip.io/api/health | grep -F '"status":"ok"' >/dev/null
          curl -fsS --max-time 20 https://school-188-225-38-55.sslip.io/api/health | grep -F '"status":"ok"' >/dev/null
          curl -fsS --max-time 20 https://pilot-arthello-188-225-38-55.sslip.io/api/health | grep -F '"status":"ok"' >/dev/null
          printf 'ARTHELLO_RUNNER_RECLAIM=OK\nARTHELLO_PRODUCTION_PRESERVED=OK\nARTHELLO_PREVIEW_PRESERVED=OK\n'
          REMOTE
          )"
          test -n "$maintenance_payload"
          timeout --signal=TERM --kill-after=5s 300s \
            ssh -n "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
              "printf '%s' '$maintenance_payload' | base64 -d | bash" </dev/null

  candidate:
    needs: reclaim-runner
    runs-on: [self-hosted, linux, x64, arthello-gateway]
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false
          path: candidate

      - name: Checkout exact baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 1
          persist-credentials: false
          path: baseline

      - name: Verify exact source heads
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git -C baseline rev-parse HEAD)" = "$BASE_SHA"

      - name: Reclaim isolated pilot build space
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t stale_images < <(
            docker image ls --format '{{.Repository}}:{{.Tag}}' |
              grep -E '^(arthello-contractors-preview|arthello-ds-pilot-app|arthello-ds-pilot-runtime|arthello-ds-baseline-runtime):' || true
          )
          for image in "${stale_images[@]}"; do
            # Docker refuses to remove an image used by a running container.
            docker image rm "$image" >/dev/null 2>&1 || true
          done

          # BuildKit cache is disposable; reclaim it before the two exact builds
          # so the runner cannot run out of disk halfway through a Docker layer.
          docker image prune --force >/dev/null
          docker builder prune --all --force >/dev/null
          docker_root="$(docker info --format '{{.DockerRootDir}}')"
          available_kb="$(df -Pk "$docker_root" | awk 'NR == 2 { print $4 }')"
          printf 'ARTHELLO_BUILD_SPACE_KB=%s\n' "$available_kb"
          test "$available_kb" -ge 6291456

      - name: Build pilot application and runtime images
        shell: bash
        run: |
          set -Eeuo pipefail
          docker build --file candidate/deploy/v52/Dockerfile --target application --tag arthello-ds-pilot-app:${HEAD_SHA} candidate
          docker build --file candidate/deploy/v52/Dockerfile --tag arthello-ds-pilot-runtime:${HEAD_SHA} candidate

      - name: Verify Design System pilot source and artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s candidate/deploy/v52/visual/prepare-visual-fixture.mjs
          docker run --rm --entrypoint sh arthello-ds-pilot-app:${HEAD_SHA} -lc '
            test -s /app/app/components/ContractorWorkspace.tsx
            test -s /app/app/components/ContractorWorkspace.ds.css
            grep -F "from \"./design-system\"" /app/app/components/ContractorWorkspace.tsx >/dev/null
            grep -F "PageContainer" /app/app/components/ContractorWorkspace.tsx >/dev/null
            grep -F "KpiCard" /app/app/components/ContractorWorkspace.tsx >/dev/null
            grep -F "EmptyState" /app/app/components/ContractorWorkspace.tsx >/dev/null
            grep -F "SearchField" /app/app/components/ContractorWorkspace.tsx >/dev/null
            ! grep -F "ContractorWorkspace.module.css" /app/app/components/ContractorWorkspace.tsx >/dev/null
            ! grep -F 'className="ahContractorPage contractor-workspace"' /app/app/components/ContractorWorkspace.tsx >/dev/null
            grep -F 'className="ahContractorScope"' /app/app/components/ArtHelloShell.tsx >/dev/null
            ! grep -F 'className="contractor-workspace"' /app/app/components/ArtHelloShell.tsx >/dev/null
            test -d /app/dist
            test -s /app/production/runtime-server.mjs
          '

      - name: Reclaim pilot-only layers before baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          docker image rm arthello-ds-pilot-app:${HEAD_SHA} >/dev/null
          docker builder prune --all --force >/dev/null
          docker_root="$(docker info --format '{{.DockerRootDir}}')"
          available_kb="$(df -Pk "$docker_root" | awk 'NR == 2 { print $4 }')"
          printf 'ARTHELLO_BASELINE_BUILD_SPACE_KB=%s\n' "$available_kb"
          test "$available_kb" -ge 4194304

      - name: Build exact baseline runtime image
        shell: bash
        run: |
          set -Eeuo pipefail
          docker build --file baseline/deploy/v52/Dockerfile --tag arthello-ds-baseline-runtime:${BASE_SHA} baseline
          docker builder prune --all --force >/dev/null
          docker_root="$(docker info --format '{{.DockerRootDir}}')"
          available_kb="$(df -Pk "$docker_root" | awk 'NR == 2 { print $4 }')"
          printf 'ARTHELLO_VISUAL_SPACE_KB=%s\n' "$available_kb"
          test "$available_kb" -ge 2097152

      - name: Capture isolated A/B visual acceptance
        id: visual
        shell: bash
        run: |
          set -Eeuo pipefail
          network="arthello-ds-pilot-${GITHUB_RUN_ID}"
          baseline_container="arthello-ds-baseline-${GITHUB_RUN_ID}"
          pilot_container="arthello-ds-pilot-${GITHUB_RUN_ID}"
          baseline_volume="arthello-ds-baseline-data-${GITHUB_RUN_ID}"
          pilot_volume="arthello-ds-pilot-data-${GITHUB_RUN_ID}"
          out="$RUNNER_TEMP/arthello-ds-visual-${GITHUB_RUN_ID}"
          mkdir -p "$out"
          printf 'path=%s\n' "$out" >> "$GITHUB_OUTPUT"
          temp_password="$(python3 -c 'import secrets; print(secrets.token_urlsafe(24), end="")')"
          permanent_password="$(python3 -c 'import secrets; print(secrets.token_urlsafe(28), end="")')"
          echo "::add-mask::$temp_password"
          echo "::add-mask::$permanent_password"

          cleanup() {
            rc=$?
            docker rm -f "$baseline_container" "$pilot_container" >/dev/null 2>&1 || true
            docker volume rm -f "$baseline_volume" "$pilot_volume" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
            exit "$rc"
          }
          trap cleanup EXIT

          docker network create "$network" >/dev/null
          docker volume create "$baseline_volume" >/dev/null
          docker volume create "$pilot_volume" >/dev/null

          run_preview() {
            local name="$1" image="$2" volume="$3"
            docker run -d \
              --name "$name" \
              --read-only \
              --tmpfs /tmp \
              --tmpfs /app/node_modules/.mf:rw,uid=1000,gid=1000,mode=0700 \
              --network "$network" \
              -e NODE_ENV=production \
              -e PORT=8081 \
              -e ARTHELLO_D1_PATH=/data/d1 \
              -e ARTHELLO_BOOTSTRAP_LOGIN=owner \
              -e ARTHELLO_BOOTSTRAP_PASSWORD="$temp_password" \
              -v "$volume":/data \
              "$image" >/dev/null
          }

          wait_for_previews() {
            for container in "$baseline_container" "$pilot_container"; do
              ready=0
              for attempt in $(seq 1 90); do
                if docker exec "$container" node -e "fetch('http://127.0.0.1:8081/api/health').then(async r=>{if(!r.ok||!(await r.text()).includes('status'))process.exit(1)}).catch(()=>process.exit(1))"; then
                  ready=1
                  break
                fi
                sleep 2
              done
              if [ "$ready" -ne 1 ]; then
                docker logs --tail 200 "$container" >&2 || true
                exit 1
              fi
            done
          }

          run_preview "$baseline_container" "arthello-ds-baseline-runtime:${BASE_SHA}" "$baseline_volume"
          run_preview "$pilot_container" "arthello-ds-pilot-runtime:${HEAD_SHA}" "$pilot_volume"
          wait_for_previews

          docker stop --time 20 "$baseline_container" "$pilot_container" >/dev/null
          docker rm "$baseline_container" "$pilot_container" >/dev/null
          for volume in "$baseline_volume" "$pilot_volume"; do
            docker run --rm --user 0 \
              -e VISUAL_TEMP_PASSWORD="$temp_password" \
              -v "$volume:/data" \
              -v "$PWD/candidate/deploy/v52/visual/prepare-visual-fixture.mjs:/fixture.mjs:ro" \
              node:24-bookworm-slim node /fixture.mjs
          done

          run_preview "$baseline_container" "arthello-ds-baseline-runtime:${BASE_SHA}" "$baseline_volume"
          run_preview "$pilot_container" "arthello-ds-pilot-runtime:${HEAD_SHA}" "$pilot_volume"
          wait_for_previews

          docker run --rm --network "$network" \
            -e BASELINE_UPSTREAM="http://$baseline_container:8081" \
            -e PILOT_UPSTREAM="http://$pilot_container:8081" \
            -e TEMP_PASSWORD="$temp_password" \
            -e PERMANENT_PASSWORD="$permanent_password" \
            -e VISUAL_OUTPUT=/screens \
            -v "$out:/screens" \
            -v "$PWD/candidate:/repo:ro" \
            -w /tmp/visual \
            mcr.microsoft.com/playwright:v1.55.0-noble \
            bash -lc 'npm init -y >/dev/null 2>&1 && npm install --no-audit --no-fund --no-save playwright@1.55.0 pixelmatch@7.1.0 pngjs@7.0.0 >/dev/null && cp /repo/deploy/v52/visual/contractors-design-system.cjs ./capture.cjs && node capture.cjs'

          test -s "$out/manifest.json"
          test "$(find "$out" -maxdepth 1 -name '*.png' | wc -l | tr -d ' ')" -eq 32
          printf 'ARTHELLO_DS_VISUAL=OK path=%s\n' "$out"
          trap - EXIT
          cleanup

      - name: Upload contractors visual acceptance
        if: always() && steps.visual.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: contractors-design-system-visual-${{ env.HEAD_SHA }}
          path: ${{ steps.visual.outputs.path }}
          retention-days: 7
          if-no-files-found: warn

      - name: Cleanup candidate images
        if: always()
        shell: bash
        run: |
          docker image rm -f \
            arthello-ds-pilot-app:${HEAD_SHA} \
            arthello-ds-pilot-runtime:${HEAD_SHA} \
            arthello-ds-baseline-runtime:${BASE_SHA} >/dev/null 2>&1 || true
