name: ArtHello v52 candidate

on:
  pull_request:
    paths:
      - deploy/v52/**
      - .github/workflows/v52-candidate.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arthello-v52-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: [self-hosted, linux, x64, arthello-gateway]
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Build application candidate
        run: |
          set -Eeuo pipefail
          docker build \
            --file deploy/v52/Dockerfile \
            --target application \
            --tag arthello-v52-candidate:${GITHUB_SHA} \
            .

      - name: Verify Design System pilot source
        run: |
          set -Eeuo pipefail
          docker run --rm --entrypoint sh arthello-v52-candidate:${GITHUB_SHA} -lc '
            test -s /app/app/components/ContractorWorkspace.tsx
            grep -F "from \"./design-system\"" /app/app/components/ContractorWorkspace.tsx >/dev/null
            grep -F "PageContainer" /app/app/components/ContractorWorkspace.tsx >/dev/null
            grep -F "EmptyState" /app/app/components/ContractorWorkspace.tsx >/dev/null
          '

      - name: Verify application artifact
        run: |
          set -Eeuo pipefail
          docker run --rm --entrypoint sh arthello-v52-candidate:${GITHUB_SHA} -lc '
            test -d /app/dist
            test -s /app/production/runtime-server.mjs
            grep -R --include="*.js" -F "Все рабочие разделы доступны сразу" /app/dist >/dev/null
            grep -R --include="*.css" -F "data-ah-help-inline" /app/dist >/dev/null
          '

      - name: Cleanup candidate image
        if: always()
        run: docker image rm -f arthello-v52-candidate:${GITHUB_SHA} >/dev/null 2>&1 || true
