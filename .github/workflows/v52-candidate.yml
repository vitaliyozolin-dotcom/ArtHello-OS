name: ArtHello v52 candidate

on:
  pull_request:
    paths:
      - deploy/v52/**
      - .github/workflows/v52-candidate.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arthello-v52-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: [self-hosted, linux, x64, arthello-gateway]
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Inspect exact contractor source before pilot transform
        run: |
          set -Eeuo pipefail
          work="$RUNNER_TEMP/arthello-contractor-inspect-$GITHUB_RUN_ID"
          rm -rf "$work" && mkdir -p "$work"
          docker run --rm \
            -v "$PWD:/repo:ro" \
            -v "$work:/work" \
            node:24-bookworm-slim bash -lc '
              set -Eeuo pipefail
              mkdir -p /work/app /work/source-parts
              cp /repo/deploy/v52/arthello-sites-v52-source.tar.gz.b64.part-* /work/source-parts/
              cat /work/source-parts/arthello-sites-v52-source.tar.gz.b64.part-* | base64 -d > /work/source.tar.gz
              tar -xzf /work/source.tar.gz -C /work/app
              cp -a /repo/deploy/v44/overrides/. /work/app/
              cp -a /repo/deploy/v52/overrides/. /work/app/
              cd /work/app
              node scripts/patch-dashboard-personalization.mjs
              node scripts/patch-sales-operating-workspace.mjs
              node scripts/patch-system-foundation.mjs
              node scripts/normalize-system-patch-inputs.mjs
              node scripts/patch-system-content-legal.mjs
              node scripts/patch-system-analytics-readiness.mjs
              node scripts/patch-system-operational-modules.mjs
              node scripts/patch-system-dialog-portals.mjs
              node scripts/patch-mobile-visual-help-followup.mjs
              node scripts/prepare-help-finance-ux-v3.mjs
              node scripts/patch-help-finance-ux-v3.mjs
              node scripts/patch-mobile-canonical-v5.mjs
              echo "=== CONTRACTOR WORKSPACE SOURCE ==="
              cat app/components/ContractorWorkspace.tsx
            '

      - name: Build application candidate
        run: |
          set -Eeuo pipefail
          docker build \
            --file deploy/v52/Dockerfile \
            --target application \
            --tag arthello-v52-candidate:${GITHUB_SHA} \
            .

      - name: Verify Design System pilot source
        run: |
          set -Eeuo pipefail
          docker run --rm --entrypoint sh arthello-v52-candidate:${GITHUB_SHA} -lc '
            test -s /app/app/components/ContractorWorkspace.tsx
            grep -F "from \"./design-system\"" /app/app/components/ContractorWorkspace.tsx >/dev/null
            grep -F "PageContainer" /app/app/components/ContractorWorkspace.tsx >/dev/null
            grep -F "EmptyState" /app/app/components/ContractorWorkspace.tsx >/dev/null
          '

      - name: Verify application artifact
        run: |
          set -Eeuo pipefail
          docker run --rm --entrypoint sh arthello-v52-candidate:${GITHUB_SHA} -lc '
            test -d /app/dist
            test -s /app/production/runtime-server.mjs
            grep -R --include="*.js" -F "Все рабочие разделы доступны сразу" /app/dist >/dev/null
            grep -R --include="*.css" -F "data-ah-help-inline" /app/dist >/dev/null
          '

      - name: Cleanup candidate image
        if: always()
        run: docker image rm -f arthello-v52-candidate:${GITHUB_SHA} >/dev/null 2>&1 || true
