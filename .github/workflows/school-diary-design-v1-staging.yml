name: School diary design v1 staging

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/school-diary-design-v1-staging.yml
      - .github/scripts/school-design-v1-stage.sh
      - .github/fixtures/school-hosting.json
      - .github/fixtures/school-dockerignore
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: school-diary-design-v1-staging
  cancel-in-progress: false

env:
  CANDIDATE_SHA: 5b81b64f230c47e9059d74e69126525804ff1c9b
  CANDIDATE_IMAGE: school-1-11-design-v1:5b81b64f230c
  BUILDER_IMAGE: school-1-11-design-v1-builder:5b81b64f230c
  SCHOOL_ORIGIN: https://school-188-225-38-55.sslip.io
  STAGING_ORIGIN: http://127.0.0.1:3211
  STAGING_PORT: "3211"

jobs:
  build-and-stage:
    runs-on: [self-hosted, linux, x64, arthello-gateway]
    timeout-minutes: 45
    environment: production-ru
    steps:
      - name: Check out deployment controls
        uses: actions/checkout@v4

      - name: Check out exact reviewed School candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          clean: true
          fetch-depth: 1
          path: candidate

      - name: Build and test exact design candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          install -m 0755 -d candidate/.openai
          cp .github/fixtures/school-hosting.json candidate/.openai/hosting.json
          cp .github/fixtures/school-dockerignore candidate/.dockerignore
          test "$(sha256sum candidate/.openai/hosting.json | cut -d' ' -f1)" = "496e738fab42ede81bc826d1b5319609192bf4af7474777d66c9b5c8f8d5c16f"
          test "$(sha256sum candidate/.dockerignore | cut -d' ' -f1)" = "c727c5d0f01245e7b3c488e6cb01429e0beee23b798eee8ae4dc7df46a2c4446"
          docker build --pull --build-arg NEXT_PUBLIC_SCHOOL_DESIGN_V1=true --target builder -t "$BUILDER_IMAGE" -f candidate/Dockerfile candidate
          docker run --rm --network none --entrypoint node "$BUILDER_IMAGE" \
            --test tests/design-code-contract.test.mjs tests/phone-auth-contract.test.mjs
          docker build --build-arg NEXT_PUBLIC_SCHOOL_DESIGN_V1=true -t "$CANDIDATE_IMAGE" -f candidate/Dockerfile candidate
          image_id="$(docker image inspect "$CANDIDATE_IMAGE" --format '{{.Id}}')"
          test -n "$image_id"
          test "$(docker image inspect "$CANDIDATE_IMAGE" --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^NEXT_PUBLIC_SCHOOL_DESIGN_V1=//p' | head -n1)" = true
          printf 'SCHOOL_DESIGN_BUILD=OK sha=%s image=%s\n' "$CANDIDATE_SHA" "$image_id"

      - name: Configure confirmed School SSH host
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ARTHELLO_RU_SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.ARTHELLO_RU_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ARTHELLO_RU_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.ARTHELLO_RU_DEPLOY_PORT }}
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 0700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          test -s ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

          deploy_port="${DEPLOY_PORT:-2222}"
          scanned_hosts="$RUNNER_TEMP/school-known-hosts"
          : > "$scanned_hosts"
          chmod 0600 "$scanned_hosts"
          for attempt in 1 2; do
            printf 'SCHOOL_SSH_HOST_PROBE_ATTEMPT=%s\n' "$attempt"
            timeout --signal=TERM --kill-after=5s 150s \
              ssh -p "$deploy_port" \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile="$scanned_hosts" \
              -o GlobalKnownHostsFile=/dev/null \
              -o PreferredAuthentications=none \
              -o PubkeyAuthentication=no \
              -o PasswordAuthentication=no \
              -o KbdInteractiveAuthentication=no \
              -o ConnectTimeout=140 \
              -o HostKeyAlgorithms=ssh-ed25519 \
              "$DEPLOY_USER@$DEPLOY_HOST" true </dev/null >/dev/null 2>&1 || true
            test -s "$scanned_hosts" && break
            sleep 5
          done
          test -s "$scanned_hosts"
          actual_fingerprint="$(ssh-keygen -lf "$scanned_hosts" -E sha256 | awk '{print $2; exit}')"
          printf 'SCHOOL_SSH_HOST_FINGERPRINT=%s\n' "$actual_fingerprint"
          test "$actual_fingerprint" = 'SHA256:/kBNohTF+5g8U+jQt+PzOCoWZ9yCSFjBnEP3Oc3MwRI'
          mv "$scanned_hosts" ~/.ssh/known_hosts
          printf 'SCHOOL_SSH_HOST=VERIFIED\n'

      - name: Transfer candidate image to School contour
        env:
          DEPLOY_HOST: ${{ secrets.ARTHELLO_RU_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ARTHELLO_RU_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.ARTHELLO_RU_DEPLOY_PORT }}
        shell: bash
        run: |
          set -Eeuo pipefail
          deploy_port="${DEPLOY_PORT:-2222}"
          ssh_args=(
            -p "$deploy_port"
            -i ~/.ssh/id_ed25519
            -o IdentitiesOnly=yes
            -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no
            -o KbdInteractiveAuthentication=no
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile=~/.ssh/known_hosts
            -o ConnectTimeout=140
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=12
            -o IPQoS=none
            -o Compression=no
            -o KexAlgorithms=curve25519-sha256
            -o HostKeyAlgorithms=ssh-ed25519
            -o PubkeyAcceptedAlgorithms=ssh-ed25519
            -o Ciphers=aes128-ctr
            -o MACs=hmac-sha2-256
          )
          local_image_id="$(docker image inspect "$CANDIDATE_IMAGE" --format '{{.Id}}')"
          docker save "$CANDIDATE_IMAGE" | gzip -1 | \
            timeout --signal=TERM --kill-after=15s 1200s \
              ssh -T "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" 'gzip -dc | docker load'
          remote_image_id="$(timeout --signal=TERM --kill-after=10s 240s \
            ssh -T "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
              "docker image inspect '$CANDIDATE_IMAGE' --format '{{.Id}}'")"
          test "$remote_image_id" = "$local_image_id"
          printf 'SCHOOL_DESIGN_IMAGE_TRANSFER=OK image=%s\n' "$remote_image_id"

      - name: Validate and deploy candidate only to isolated staging
        id: deploy
        env:
          DEPLOY_HOST: ${{ secrets.ARTHELLO_RU_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ARTHELLO_RU_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.ARTHELLO_RU_DEPLOY_PORT }}
        shell: bash
        run: |
          set -Eeuo pipefail
          deploy_port="${DEPLOY_PORT:-2222}"
          ssh_args=(
            -p "$deploy_port"
            -i ~/.ssh/id_ed25519
            -o IdentitiesOnly=yes
            -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no
            -o KbdInteractiveAuthentication=no
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile=~/.ssh/known_hosts
            -o ConnectTimeout=140
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=12
            -o IPQoS=none
            -o Compression=no
            -o KexAlgorithms=curve25519-sha256
            -o HostKeyAlgorithms=ssh-ed25519
            -o PubkeyAcceptedAlgorithms=ssh-ed25519
            -o Ciphers=aes128-ctr
            -o MACs=hmac-sha2-256
          )
          log_file="$RUNNER_TEMP/school-design-v1-candidate.log"
          timeout --signal=TERM --kill-after=15s 1200s \
            ssh -T "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
              "env RUN_ID='$GITHUB_RUN_ID' WORKFLOW_SHA='$GITHUB_SHA' CANDIDATE_SHA='$CANDIDATE_SHA' CANDIDATE_IMAGE='$CANDIDATE_IMAGE' SCHOOL_ORIGIN='$SCHOOL_ORIGIN' STAGING_ORIGIN='$STAGING_ORIGIN' STAGING_PORT='$STAGING_PORT' bash -s" \
              < .github/scripts/school-design-v1-stage.sh | tee "$log_file"

          candidate="$(sed -n 's/^SCHOOL_DESIGN_CANDIDATE_SHA=//p' "$log_file" | tail -n1)"
          rollback="$(sed -n 's/^SCHOOL_DESIGN_ROLLBACK_READY=//p' "$log_file" | tail -n1)"
          test "$candidate" = "$CANDIDATE_SHA"
          test -n "$rollback"
          printf 'candidate=%s\n' "$candidate" >> "$GITHUB_OUTPUT"
          printf 'rollback=%s\n' "$rollback" >> "$GITHUB_OUTPUT"

      - name: Publish design v1 staging result
        if: always()
        shell: bash
        env:
          DEPLOYED_CANDIDATE: ${{ steps.deploy.outputs.candidate }}
          ROLLBACK_CONTAINER: ${{ steps.deploy.outputs.rollback }}
        run: |
          {
            echo '## School diary design v1 candidate'
            echo
            printf -- '- Reviewed candidate: %s\n' "$CANDIDATE_SHA"
            printf -- '- Deployed to staging: %s\n' "${DEPLOYED_CANDIDATE:-no}"
            printf -- '- Staging bind: 127.0.0.1:3211 only\n'
            printf -- '- Design flag: enabled only in candidate image\n'
            printf -- '- Auth Origin boundaries: tested\n'
            printf -- '- Rollback container: %s\n' "${ROLLBACK_CONTAINER:-not-created}"
            printf -- '- Production UI/data/restart changed: no\n'
            printf -- '- Result: %s\n' '${{ job.status }}'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report design v1 staging run as commit status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state =
              process.env.JOB_STATUS === "success" ? "success" : "failure";
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.sha,
              state,
              context: "school-diary/design-v1-staging",
              description: "Design v1 staging run " + process.env.JOB_STATUS,
              target_url:
                process.env.GITHUB_SERVER_URL +
                "/" +
                process.env.GITHUB_REPOSITORY +
                "/actions/runs/" +
                process.env.GITHUB_RUN_ID,
            });
