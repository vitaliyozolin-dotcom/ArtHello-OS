name: School diary design v1 production cutover

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/school-diary-design-v1-production-cutover.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: school-1-11-production
  cancel-in-progress: false

env:
  CANDIDATE_SHA: 034be78c5cb30402ebb7d3786133d0f3be390be9
  CANDIDATE_TREE: f404d3d94dd94df5f4e1937ad356a854d63cd578
  CANDIDATE_IMAGE: school-1-11-design-v1:034be78c5cb3
  CANDIDATE_IMAGE_ID: sha256:b926e67b021a549bb694cc12a65f909c62e6228caf48ece4ef14f0b96457fede
  CANDIDATE_PR: "261"
  CANDIDATE_MERGE_SHA: 1ed19e9c61e34dff1dd7315170730307c0066649
  CANDIDATE_BASE: school/staging-foundation-20260827
  SCHOOL_ORIGIN: https://school-188-225-38-55.sslip.io
  LEGACY_ORIGIN: https://school-188-225-47-207.sslip.io
  STAGING_ORIGIN: http://127.0.0.1:3211
  STAGING_RUN_ID: "33336620387"
  STAGING_RUN_SHA: 38ff3d6f95f61624a770d488832242f75dcce987
  VISUAL_RUN_ID: "33336973598"
  FOUR_ROLE_RUN_ID: "33336973630"
  AUDIT_RUN_SHA: d3eda3981545d7a0aad16211efd5dc9080ff7844
  FLAG_OFF_RUN_ID: "33337558127"
  FLAG_OFF_RUN_SHA: bf8e4c916ec3e1ae4711042af528199f9aa25fbd
  READINESS_RUN_ID: "33338167895"
  READINESS_RUN_SHA: 99275bb31ff415e0f5f66ded5f8861c790101e94
  VISUAL_ARTIFACT_ID: "9739355097"
  VISUAL_ARTIFACT_DIGEST: sha256:b0bf33d09add71b5d79adca7bad94d4c90620d629505d345aa66de6450b8c60d
  FLAG_OFF_ARTIFACT_ID: "9739635780"
  FLAG_OFF_ARTIFACT_DIGEST: sha256:d403130d458013279c460e7e2e866e4cca33399c910bd04e8864a1aaebaf70c0

jobs:
  cutover:
    runs-on: [self-hosted, linux, x64, arthello-gateway]
    timeout-minutes: 35
    environment: production-ru
    steps:
      - name: Check out cutover controls
        uses: actions/checkout@v4

      - name: Verify complete immutable release record
        uses: actions/github-script@v7
        env:
          CANDIDATE_SHA: ${{ env.CANDIDATE_SHA }}
          CANDIDATE_TREE: ${{ env.CANDIDATE_TREE }}
          CANDIDATE_PR: ${{ env.CANDIDATE_PR }}
          CANDIDATE_MERGE_SHA: ${{ env.CANDIDATE_MERGE_SHA }}
          CANDIDATE_BASE: ${{ env.CANDIDATE_BASE }}
          STAGING_RUN_ID: ${{ env.STAGING_RUN_ID }}
          STAGING_RUN_SHA: ${{ env.STAGING_RUN_SHA }}
          VISUAL_RUN_ID: ${{ env.VISUAL_RUN_ID }}
          FOUR_ROLE_RUN_ID: ${{ env.FOUR_ROLE_RUN_ID }}
          AUDIT_RUN_SHA: ${{ env.AUDIT_RUN_SHA }}
          FLAG_OFF_RUN_ID: ${{ env.FLAG_OFF_RUN_ID }}
          FLAG_OFF_RUN_SHA: ${{ env.FLAG_OFF_RUN_SHA }}
          READINESS_RUN_ID: ${{ env.READINESS_RUN_ID }}
          READINESS_RUN_SHA: ${{ env.READINESS_RUN_SHA }}
          VISUAL_ARTIFACT_ID: ${{ env.VISUAL_ARTIFACT_ID }}
          VISUAL_ARTIFACT_DIGEST: ${{ env.VISUAL_ARTIFACT_DIGEST }}
          FLAG_OFF_ARTIFACT_ID: ${{ env.FLAG_OFF_ARTIFACT_ID }}
          FLAG_OFF_ARTIFACT_DIGEST: ${{ env.FLAG_OFF_ARTIFACT_DIGEST }}
        with:
          script: |
            const expectedRuns = [
              [process.env.STAGING_RUN_ID, process.env.STAGING_RUN_SHA, "staging"],
              [process.env.VISUAL_RUN_ID, process.env.AUDIT_RUN_SHA, "visual"],
              [process.env.FOUR_ROLE_RUN_ID, process.env.AUDIT_RUN_SHA, "four-role"],
              [process.env.FLAG_OFF_RUN_ID, process.env.FLAG_OFF_RUN_SHA, "flag-off"],
              [process.env.READINESS_RUN_ID, process.env.READINESS_RUN_SHA, "readiness"],
            ];
            for (const [id, sha, label] of expectedRuns) {
              const { data: run } = await github.rest.actions.getWorkflowRun({
                ...context.repo,
                run_id: Number(id),
              });
              if (run.conclusion !== "success" || run.head_sha !== sha) {
                core.setFailed(
                  label + " evidence mismatch: conclusion=" + run.conclusion +
                  " head_sha=" + run.head_sha
                );
                return;
              }
              core.info("SCHOOL_CUTOVER_EVIDENCE_" + label.toUpperCase() + "=OK");
            }

            for (const [artifactId, runId, digest, label] of [
              [
                process.env.VISUAL_ARTIFACT_ID,
                process.env.VISUAL_RUN_ID,
                process.env.VISUAL_ARTIFACT_DIGEST,
                "visual",
              ],
              [
                process.env.FLAG_OFF_ARTIFACT_ID,
                process.env.FLAG_OFF_RUN_ID,
                process.env.FLAG_OFF_ARTIFACT_DIGEST,
                "flag-off",
              ],
            ]) {
              const { data: artifact } = await github.rest.actions.getArtifact({
                ...context.repo,
                artifact_id: Number(artifactId),
              });
              if (
                artifact.workflow_run?.id !== Number(runId) ||
                artifact.expired ||
                artifact.digest !== digest
              ) {
                core.setFailed(label + " artifact provenance mismatch");
                return;
              }
            }

            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: Number(process.env.CANDIDATE_PR),
            });
            if (
              pr.state !== "closed" ||
              !pr.merged_at ||
              pr.head.sha !== process.env.CANDIDATE_SHA ||
              pr.base.ref !== process.env.CANDIDATE_BASE ||
              pr.merge_commit_sha !== process.env.CANDIDATE_MERGE_SHA ||
              pr.changed_files !== 5
            ) {
              core.setFailed("Accepted source PR provenance mismatch");
              return;
            }

            const { data: commit } = await github.rest.repos.getCommit({
              ...context.repo,
              ref: process.env.CANDIDATE_SHA,
            });
            if (commit.commit.tree.sha !== process.env.CANDIDATE_TREE) {
              core.setFailed("Candidate tree mismatch");
              return;
            }
            core.info("SCHOOL_CUTOVER_ARTIFACTS=OK");
            core.info("SCHOOL_CUTOVER_ACCEPTED_SOURCE=OK");

      - name: Configure confirmed School SSH host
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ARTHELLO_RU_SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.ARTHELLO_RU_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ARTHELLO_RU_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.ARTHELLO_RU_DEPLOY_PORT }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_dir="$RUNNER_TEMP/school-production-cutover-ssh-$GITHUB_RUN_ID"
          install -m 0700 -d "$ssh_dir"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_dir/id_ed25519"
          chmod 0600 "$ssh_dir/id_ed25519"
          ssh-keygen -y -f "$ssh_dir/id_ed25519" >/dev/null

          deploy_port="${DEPLOY_PORT:-2222}"
          scan="$ssh_dir/known_hosts.scan"
          : > "$scan"
          chmod 0600 "$scan"
          for attempt in 1 2; do
            timeout --signal=TERM --kill-after=5s 150s \
              ssh -p "$deploy_port" \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile="$scan" \
              -o GlobalKnownHostsFile=/dev/null \
              -o PreferredAuthentications=none \
              -o PubkeyAuthentication=no \
              -o PasswordAuthentication=no \
              -o KbdInteractiveAuthentication=no \
              -o ConnectTimeout=140 \
              -o HostKeyAlgorithms=ssh-ed25519 \
              "$DEPLOY_USER@$DEPLOY_HOST" true </dev/null >/dev/null 2>&1 || true
            test -s "$scan" && break
            sleep 5
          done
          test -s "$scan"
          actual_fingerprint="$(ssh-keygen -lf "$scan" -E sha256 | awk '{print $2; exit}')"
          test "$actual_fingerprint" = 'SHA256:/kBNohTF+5g8U+jQt+PzOCoWZ9yCSFjBnEP3Oc3MwRI'
          mv "$scan" "$ssh_dir/known_hosts"
          printf 'ssh_dir=%s\n' "$ssh_dir" >> "$GITHUB_ENV"
          printf 'deploy_port=%s\n' "$deploy_port" >> "$GITHUB_ENV"
          printf 'SCHOOL_CUTOVER_SSH=VERIFIED\n'

      - name: Promote exact candidate with automatic rollback
        id: promote
        env:
          DEPLOY_HOST: ${{ secrets.ARTHELLO_RU_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ARTHELLO_RU_DEPLOY_USER }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_args=(
            -p "$deploy_port"
            -i "$ssh_dir/id_ed25519"
            -o IdentitiesOnly=yes
            -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no
            -o KbdInteractiveAuthentication=no
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$ssh_dir/known_hosts"
            -o ConnectTimeout=140
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=12
            -o IPQoS=none
            -o Compression=no
            -o KexAlgorithms=curve25519-sha256
            -o HostKeyAlgorithms=ssh-ed25519
            -o PubkeyAcceptedAlgorithms=ssh-ed25519
            -o Ciphers=aes128-ctr
            -o MACs=hmac-sha2-256
          )
          log_file="$RUNNER_TEMP/school-production-cutover.log"
          timeout --signal=TERM --kill-after=15s 1500s \
            ssh -T "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
              "env RUN_ID='$GITHUB_RUN_ID' WORKFLOW_SHA='$GITHUB_SHA' CANDIDATE_SHA='$CANDIDATE_SHA' CANDIDATE_IMAGE='$CANDIDATE_IMAGE' CANDIDATE_IMAGE_ID='$CANDIDATE_IMAGE_ID' SCHOOL_ORIGIN='$SCHOOL_ORIGIN' LEGACY_ORIGIN='$LEGACY_ORIGIN' STAGING_ORIGIN='$STAGING_ORIGIN' bash -s" \
              <<'REMOTE' | tee "$log_file"
          set -Eeuo pipefail
          exec 9>/var/lock/school-1-11-production.lock
          flock -n 9

          production=school-1-11
          staging=school-1-11-staging
          rollback="school-1-11-production-design-rollback-$RUN_ID"
          preflight="school-1-11-design-cutover-check-$RUN_ID"
          preflight_data="school-1-11_design_cutover_${RUN_ID}_data"
          work=""
          preflight_created=0
          data_created=0
          rollback_ready=0
          success=0

          case "$rollback:$preflight:$preflight_data" in
            school-1-11-production-design-rollback-*:school-1-11-design-cutover-check-*:school-1-11_design_cutover_*_data) ;;
            *) printf 'Invalid cutover target names\n' >&2; exit 1 ;;
          esac

          wait_for_production() {
            local expected_container="$1"
            local ready=0
            for attempt in $(seq 1 90); do
              if
                [ "$(docker inspect "$expected_container" --format '{{.State.Health.Status}}' 2>/dev/null || true)" = healthy ] &&
                curl -fsS --max-time 8 "$SCHOOL_ORIGIN/api/health" |
                  grep -F '"status":"ok"' >/dev/null
              then
                ready=1
                break
              fi
              if [ "$(docker inspect "$expected_container" --format '{{.State.Running}}' 2>/dev/null || true)" != true ]; then
                break
              fi
              sleep 2
            done
            test "$ready" -eq 1
          }

          cleanup() {
            rc=$?
            trap - EXIT
            set +e
            if [ "$preflight_created" -eq 1 ]; then
              docker rm -f "$preflight" >/dev/null 2>&1
            fi
            if [ "$data_created" -eq 1 ]; then
              docker volume rm "$preflight_data" >/dev/null 2>&1
            fi
            case "$work" in
              /tmp/school-design-cutover.*) rm -rf -- "$work" ;;
            esac
            if [ "$success" -ne 1 ] && [ "$rollback_ready" -eq 1 ]; then
              if docker inspect "$production" >/dev/null 2>&1; then
                docker rm -f "$production" >/dev/null 2>&1
              fi
              if docker inspect "$rollback" >/dev/null 2>&1; then
                docker rename "$rollback" "$production" >/dev/null 2>&1
                docker start "$production" >/dev/null 2>&1
                if wait_for_production "$production"; then
                  printf 'SCHOOL_CUTOVER_ROLLBACK=COMPLETED\n' >&2
                else
                  printf 'SCHOOL_CUTOVER_ROLLBACK=STARTED_BUT_HEALTH_UNPROVEN\n' >&2
                fi
              fi
            fi
            if [ "$success" -ne 1 ]; then
              printf 'SCHOOL_CUTOVER=FAIL\n' >&2
            fi
            exit "$rc"
          }
          trap cleanup EXIT

          env_value() {
            docker inspect "$1" --format '{{range .Config.Env}}{{println .}}{{end}}' |
              sed -n "s/^$2=//p" | head -n1
          }

          test -z "$(docker ps -aq --filter "name=^/$rollback$")"
          test -z "$(docker ps -aq --filter "name=^/$preflight$")"
          ! docker volume inspect "$preflight_data" >/dev/null 2>&1

          test "$(docker inspect "$production" --format '{{.State.Running}}')" = true
          test "$(docker inspect "$production" --format '{{.State.Health.Status}}')" = healthy
          curl -fsS --max-time 30 "$SCHOOL_ORIGIN/api/health" |
            grep -F '"status":"ok"' >/dev/null
          old_container_id="$(docker inspect "$production" --format '{{.Id}}')"
          old_image_ref="$(docker inspect "$production" --format '{{.Config.Image}}')"
          old_image_id="$(docker inspect "$production" --format '{{.Image}}')"
          old_started_at="$(docker inspect "$production" --format '{{.State.StartedAt}}')"
          restart_policy="$(docker inspect "$production" --format '{{.HostConfig.RestartPolicy.Name}}')"
          network_mode="$(docker inspect "$production" --format '{{.HostConfig.NetworkMode}}')"
          port_binding="$(docker inspect "$production" | python3 -c 'import json,sys; d=json.load(sys.stdin)[0]; b=d["HostConfig"]["PortBindings"]["3000/tcp"][0]; print(b["HostIp"]+":"+b["HostPort"])')"
          data_volume="$(docker inspect "$production" --format '{{range .Mounts}}{{if eq .Destination "/data"}}{{.Name}}{{end}}{{end}}')"
          backup_volume="$(docker inspect "$production" --format '{{range .Mounts}}{{if eq .Destination "/backups"}}{{.Name}}{{end}}{{end}}')"
          security_opts="$(docker inspect "$production" --format '{{json .HostConfig.SecurityOpt}}')"
          public_origin="$(env_value "$production" PUBLIC_APP_ORIGIN)"
          secret="$(env_value "$production" CENTRAL_ACCESS_SECRET)"
          aliases="$(
            docker inspect "$production" |
              python3 -c 'import json,sys; d=json.load(sys.stdin)[0]; n=d["NetworkSettings"]["Networks"].get(sys.argv[1]); assert n is not None; print(",".join(n.get("Aliases") or []))' "$network_mode"
          )"

          test "$old_image_ref" = school-1-11-school
          test "$old_image_id" = sha256:69602a49691c48f84c6736ee910a874693f70b6c592183af95acbfef254e6f96
          test "$restart_policy" = unless-stopped
          test "$network_mode" = arthello-os_backend
          test "$port_binding" = 127.0.0.1:3111
          test "$data_volume" = school-1-11_school_data
          test "$backup_volume" = school-1-11_school_backups
          test "$security_opts" = '["no-new-privileges:true"]'
          case ",$aliases," in
            *,school,*) ;;
            *) printf 'Production network alias school is absent\n' >&2; exit 1 ;;
          esac
          test "$(env_value "$production" NODE_ENV)" = production
          test "$(env_value "$production" PORT)" = 3000
          test "$(env_value "$production" DATABASE_PATH)" = /data/school-1-11.sqlite
          case "$public_origin" in
            "$LEGACY_ORIGIN"|"$SCHOOL_ORIGIN") ;;
            *) printf 'Unexpected current production Origin\n' >&2; exit 1 ;;
          esac
          test "${#secret}" -eq 64

          test "$(docker inspect "$staging" --format '{{.State.Running}}')" = true
          test "$(docker inspect "$staging" --format '{{.State.Health.Status}}')" = healthy
          test "$(docker inspect "$staging" --format '{{.Config.Image}}')" = "$CANDIDATE_IMAGE"
          test "$(docker inspect "$staging" --format '{{.Image}}')" = "$CANDIDATE_IMAGE_ID"
          test "$(docker inspect "$staging" --format '{{index .Config.Labels "school.candidate-sha"}}')" = "$CANDIDATE_SHA"
          curl -fsS --max-time 15 "$STAGING_ORIGIN/api/health" |
            grep -F '"status":"ok"' >/dev/null
          test "$(docker image inspect "$CANDIDATE_IMAGE" --format '{{.Id}}')" = "$CANDIDATE_IMAGE_ID"

          backup_path="$(
            docker exec -e BACKUP_DIR=/backups/design-v1-cutover "$production" \
              node scripts/backup-db.mjs | tail -n1
          )"
          case "$backup_path" in
            /backups/design-v1-cutover/school-1-11-*.sqlite) ;;
            *) printf 'Unexpected cutover backup path\n' >&2; exit 1 ;;
          esac
          backup_proof="$(
            docker exec -i -e BACKUP_PATH="$backup_path" "$production" \
              node --input-type=module - <<'VERIFY_BACKUP'
          import { createHash } from 'node:crypto';
          import { readFileSync, statSync } from 'node:fs';
          import { DatabaseSync } from 'node:sqlite';
          const path = process.env.BACKUP_PATH;
          const stat = statSync(path);
          if (!stat.isFile() || stat.size < 4096) throw new Error('Cutover backup is empty');
          const db = new DatabaseSync(path, { readOnly: true });
          const rows = db.prepare('PRAGMA integrity_check').all();
          if (rows.length !== 1 || rows[0].integrity_check !== 'ok')
            throw new Error('Cutover backup integrity failed');
          db.close();
          const sha256 = createHash('sha256').update(readFileSync(path)).digest('hex');
          console.log(stat.size + ':' + sha256);
          VERIFY_BACKUP
          )"
          backup_bytes="${backup_proof%%:*}"
          backup_sha256="${backup_proof#*:}"
          [[ "$backup_bytes" =~ ^[0-9]+$ ]]
          [[ "$backup_sha256" =~ ^[a-f0-9]{64}$ ]]
          relative_backup="${backup_path#/backups/}"
          case "$relative_backup" in
            design-v1-cutover/school-1-11-*.sqlite) ;;
            *) exit 1 ;;
          esac

          docker volume create \
            --label school.system=school-1-11 \
            --label school.environment=production-cutover-check \
            --label school.run-id="$RUN_ID" \
            "$preflight_data" >/dev/null
          data_created=1
          docker run --rm --network none --user 0:0 \
            -e SOURCE_REL="$relative_backup" \
            -v "$backup_volume:/backup:ro" \
            -v "$preflight_data:/data" \
            --entrypoint node "$CANDIDATE_IMAGE" --input-type=module - <<'COPY_BACKUP'
          import { chmodSync, chownSync, copyFileSync } from 'node:fs';
          import { DatabaseSync } from 'node:sqlite';
          const rel = process.env.SOURCE_REL;
          if (!/^design-v1-cutover\/school-1-11-[0-9TZ-]+\.sqlite$/.test(rel))
            throw new Error('Invalid cutover backup path');
          const target = '/data/school-1-11.sqlite';
          copyFileSync('/backup/' + rel, target);
          chownSync('/data', 1001, 1001);
          chmodSync('/data', 0o750);
          chownSync(target, 1001, 1001);
          chmodSync(target, 0o640);
          const db = new DatabaseSync(target, { readOnly: true });
          const rows = db.prepare('PRAGMA integrity_check').all();
          if (rows.length !== 1 || rows[0].integrity_check !== 'ok')
            throw new Error('Cutover copy integrity failed');
          db.close();
          COPY_BACKUP

          preflight_secret="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          docker run -d \
            --name "$preflight" \
            --network none \
            --security-opt no-new-privileges:true \
            --health-cmd "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\"" \
            --health-interval 10s \
            --health-timeout 5s \
            --health-retries 9 \
            --health-start-period 20s \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e DATABASE_PATH=/data/school-1-11.sqlite \
            -e PUBLIC_APP_ORIGIN="$SCHOOL_ORIGIN" \
            -e CENTRAL_ACCESS_SECRET="$preflight_secret" \
            -v "$preflight_data:/data" \
            "$CANDIDATE_IMAGE" >/dev/null
          preflight_created=1

          preflight_ready=0
          for attempt in $(seq 1 90); do
            if [ "$(docker inspect "$preflight" --format '{{.State.Health.Status}}' 2>/dev/null || true)" = healthy ]; then
              preflight_ready=1
              break
            fi
            if [ "$(docker inspect "$preflight" --format '{{.State.Running}}' 2>/dev/null || true)" != true ]; then
              break
            fi
            sleep 2
          done
          if [ "$preflight_ready" -ne 1 ]; then
            docker logs "$preflight" --tail 120 >&2 || true
            exit 1
          fi

          docker exec -i -e EXPECTED_ORIGIN="$SCHOOL_ORIGIN" "$preflight" \
            node --input-type=module - <<'VERIFY_PREFLIGHT'
          import { DatabaseSync } from 'node:sqlite';
          const db = new DatabaseSync('/data/school-1-11.sqlite', { readOnly: true });
          const rows = db.prepare('PRAGMA integrity_check').all();
          if (rows.length !== 1 || rows[0].integrity_check !== 'ok')
            throw new Error('Preflight DB integrity failed');
          const tableCount = db.prepare(
            "SELECT count(*) AS count FROM sqlite_master WHERE type='table'"
          ).get().count;
          db.close();

          const base = 'http://127.0.0.1:3000';
          const health = await fetch(base + '/api/health');
          if (!health.ok || !(await health.text()).includes('"status":"ok"'))
            throw new Error('Preflight health failed');
          const login = await fetch(base + '/login');
          const html = await login.text();
          if (!login.ok || !html.includes('data-design-code="v1"'))
            throw new Error('Preflight design flag missing');

          const body = JSON.stringify({
            login: '+79990000000',
            password: 'InvalidPassword1',
          });
          const accepted = await fetch(base + '/api/auth/login', {
            method: 'POST',
            headers: {
              origin: process.env.EXPECTED_ORIGIN,
              'content-type': 'application/json',
            },
            body,
          });
          const acceptedPayload = await accepted.json();
          if (
            accepted.status !== 401 ||
            acceptedPayload.error !== 'Неверный логин или пароль'
          ) throw new Error('Preflight canonical Origin contract failed');

          const rejected = await fetch(base + '/api/auth/login', {
            method: 'POST',
            headers: {
              origin: 'https://evil.invalid',
              'content-type': 'application/json',
            },
            body,
          });
          const rejectedPayload = await rejected.json();
          if (
            rejected.status !== 401 ||
            rejectedPayload.error !== 'Запрос отклонён системой безопасности'
          ) throw new Error('Preflight foreign Origin contract failed');
          console.log('SCHOOL_CUTOVER_PREFLIGHT=OK tables=' + tableCount);
          VERIFY_PREFLIGHT

          docker rm -f "$preflight" >/dev/null
          preflight_created=0
          docker volume rm "$preflight_data" >/dev/null
          data_created=0

          test "$(docker inspect "$production" --format '{{.Id}}')" = "$old_container_id"
          test "$(docker inspect "$production" --format '{{.State.StartedAt}}')" = "$old_started_at"
          test "$(docker inspect "$production" --format '{{.State.Health.Status}}')" = healthy

          docker rename "$production" "$rollback"
          rollback_ready=1
          docker stop -t 30 "$rollback" >/dev/null

          docker run -d \
            --name "$production" \
            --restart unless-stopped \
            --network "$network_mode" \
            --network-alias school \
            --network-alias school-1-11 \
            -p "127.0.0.1:3111:3000" \
            --security-opt no-new-privileges:true \
            --health-cmd "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\"" \
            --health-interval 30s \
            --health-timeout 5s \
            --health-retries 5 \
            --health-start-period 30s \
            --label school.system=school-1-11 \
            --label school.environment=production \
            --label school.design-code=1.0.0 \
            --label school.candidate-sha="$CANDIDATE_SHA" \
            --label school.candidate-image-id="$CANDIDATE_IMAGE_ID" \
            --label school.workflow-sha="$WORKFLOW_SHA" \
            --label school.rollback-container="$rollback" \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e DATABASE_PATH=/data/school-1-11.sqlite \
            -e PUBLIC_APP_ORIGIN="$SCHOOL_ORIGIN" \
            -e CENTRAL_ACCESS_SECRET="$secret" \
            -v "$data_volume:/data" \
            -v "$backup_volume:/backups" \
            "$CANDIDATE_IMAGE" >/dev/null

          if ! wait_for_production "$production"; then
            docker logs "$production" --tail 160 >&2 || true
            exit 1
          fi

          test "$(docker inspect "$production" --format '{{.Config.Image}}')" = "$CANDIDATE_IMAGE"
          test "$(docker inspect "$production" --format '{{.Image}}')" = "$CANDIDATE_IMAGE_ID"
          test "$(docker inspect "$production" --format '{{.HostConfig.RestartPolicy.Name}}')" = unless-stopped
          test "$(docker inspect "$production" --format '{{.HostConfig.NetworkMode}}')" = "$network_mode"
          new_binding="$(docker inspect "$production" | python3 -c 'import json,sys; d=json.load(sys.stdin)[0]; b=d["HostConfig"]["PortBindings"]["3000/tcp"][0]; print(b["HostIp"]+":"+b["HostPort"])')"
          test "$new_binding" = "$port_binding"
          test "$(docker inspect "$production" --format '{{range .Mounts}}{{if eq .Destination "/data"}}{{.Name}}{{end}}{{end}}')" = "$data_volume"
          test "$(docker inspect "$production" --format '{{range .Mounts}}{{if eq .Destination "/backups"}}{{.Name}}{{end}}{{end}}')" = "$backup_volume"
          test "$(docker inspect "$production" --format '{{.State.Health.Status}}')" = healthy
          test "$(env_value "$production" PUBLIC_APP_ORIGIN)" = "$SCHOOL_ORIGIN"
          test "$(env_value "$production" CENTRAL_ACCESS_SECRET)" = "$secret"
          test "$(docker inspect "$rollback" --format '{{.State.Running}}')" = false
          test "$(docker inspect "$rollback" --format '{{.Image}}')" = "$old_image_id"

          docker exec -i -e EXPECTED_ORIGIN="$SCHOOL_ORIGIN" "$production" \
            node --input-type=module - <<'VERIFY_PRODUCTION'
          import { DatabaseSync } from 'node:sqlite';
          const db = new DatabaseSync('/data/school-1-11.sqlite', { readOnly: true });
          const rows = db.prepare('PRAGMA integrity_check').all();
          if (rows.length !== 1 || rows[0].integrity_check !== 'ok')
            throw new Error('Production DB integrity failed');
          const tableCount = db.prepare(
            "SELECT count(*) AS count FROM sqlite_master WHERE type='table'"
          ).get().count;
          db.close();

          const base = 'http://127.0.0.1:3000';
          const health = await fetch(base + '/api/health');
          if (!health.ok || !(await health.text()).includes('"status":"ok"'))
            throw new Error('Production internal health failed');
          const login = await fetch(base + '/login');
          const html = await login.text();
          if (!login.ok || !html.includes('data-design-code="v1"'))
            throw new Error('Production design flag missing');

          const body = JSON.stringify({
            login: '+79990000000',
            password: 'InvalidPassword1',
          });
          const accepted = await fetch(base + '/api/auth/login', {
            method: 'POST',
            headers: {
              origin: process.env.EXPECTED_ORIGIN,
              'content-type': 'application/json',
            },
            body,
          });
          const acceptedPayload = await accepted.json();
          if (
            accepted.status !== 401 ||
            acceptedPayload.error !== 'Неверный логин или пароль'
          ) throw new Error('Production canonical Origin contract failed');

          const rejected = await fetch(base + '/api/auth/login', {
            method: 'POST',
            headers: {
              origin: 'https://evil.invalid',
              'content-type': 'application/json',
            },
            body,
          });
          const rejectedPayload = await rejected.json();
          if (
            rejected.status !== 401 ||
            rejectedPayload.error !== 'Запрос отклонён системой безопасности'
          ) throw new Error('Production foreign Origin contract failed');
          console.log('SCHOOL_CUTOVER_PRODUCTION_INTERNAL=OK tables=' + tableCount);
          VERIFY_PRODUCTION

          work="$(mktemp -d /tmp/school-design-cutover.XXXXXX)"
          chmod 0700 "$work"
          curl -fsS --max-time 30 "$SCHOOL_ORIGIN/api/health" |
            grep -F '"status":"ok"' >/dev/null
          curl -fsS --max-time 30 "$SCHOOL_ORIGIN/login" > "$work/login.html"
          grep -F 'data-design-code="v1"' "$work/login.html" >/dev/null

          accepted_status="$(
            curl -sS --max-time 30 \
              -o "$work/accepted.json" \
              -w '%{http_code}' \
              -X POST "$SCHOOL_ORIGIN/api/auth/login" \
              -H "Origin: $SCHOOL_ORIGIN" \
              -H 'Content-Type: application/json' \
              --data '{"login":"+79990000000","password":"InvalidPassword1"}'
          )"
          test "$accepted_status" = 401
          python3 - "$work/accepted.json" <<'VERIFY_ACCEPTED'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as file:
              payload = json.load(file)
          assert payload == {"error": "Неверный логин или пароль"}
          VERIFY_ACCEPTED

          rejected_status="$(
            curl -sS --max-time 30 \
              -o "$work/rejected.json" \
              -w '%{http_code}' \
              -X POST "$SCHOOL_ORIGIN/api/auth/login" \
              -H 'Origin: https://evil.invalid' \
              -H 'Content-Type: application/json' \
              --data '{"login":"+79990000000","password":"InvalidPassword1"}'
          )"
          test "$rejected_status" = 401
          python3 - "$work/rejected.json" <<'VERIFY_REJECTED'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as file:
              payload = json.load(file)
          assert payload == {"error": "Запрос отклонён системой безопасности"}
          VERIFY_REJECTED

          rm -rf -- "$work"
          work=""
          success=1
          printf 'SCHOOL_CUTOVER=SUCCESS\n'
          printf 'SCHOOL_CUTOVER_CANDIDATE_SHA=%s\n' "$CANDIDATE_SHA"
          printf 'SCHOOL_CUTOVER_IMAGE_ID=%s\n' "$CANDIDATE_IMAGE_ID"
          printf 'SCHOOL_CUTOVER_PREVIOUS_IMAGE_ID=%s\n' "$old_image_id"
          printf 'SCHOOL_CUTOVER_ROLLBACK_READY=%s\n' "$rollback"
          printf 'SCHOOL_CUTOVER_DATA_VOLUME=%s\n' "$data_volume"
          printf 'SCHOOL_CUTOVER_BACKUP_PATH=%s\n' "$backup_path"
          printf 'SCHOOL_CUTOVER_BACKUP_BYTES=%s\n' "$backup_bytes"
          printf 'SCHOOL_CUTOVER_BACKUP_SHA256=%s\n' "$backup_sha256"
          printf 'SCHOOL_CUTOVER_ORIGIN_REPAIRED=%s\n' "$SCHOOL_ORIGIN"
          printf 'SCHOOL_CUTOVER_PUBLIC_HEALTH=OK\n'
          printf 'SCHOOL_CUTOVER_PUBLIC_LOGIN=DESIGN_V1\n'
          printf 'SCHOOL_CUTOVER_PUBLIC_AUTH_ORIGIN=OK\n'
          REMOTE

          test "$(sed -n 's/^SCHOOL_CUTOVER=//p' "$log_file" | tail -n1)" = SUCCESS
          rollback="$(sed -n 's/^SCHOOL_CUTOVER_ROLLBACK_READY=//p' "$log_file" | tail -n1)"
          backup="$(sed -n 's/^SCHOOL_CUTOVER_BACKUP_PATH=//p' "$log_file" | tail -n1)"
          test -n "$rollback"
          test -n "$backup"
          printf 'result=SUCCESS\n' >> "$GITHUB_OUTPUT"
          printf 'rollback=%s\n' "$rollback" >> "$GITHUB_OUTPUT"
          printf 'backup=%s\n' "$backup" >> "$GITHUB_OUTPUT"

      - name: Publish cutover result
        if: always()
        shell: bash
        env:
          RESULT: ${{ steps.promote.outputs.result }}
          ROLLBACK: ${{ steps.promote.outputs.rollback }}
          BACKUP: ${{ steps.promote.outputs.backup }}
        run: |
          {
            echo '## School diary design v1 production cutover'
            echo
            printf -- '- Candidate SHA: %s\n' "$CANDIDATE_SHA"
            printf -- '- Candidate image: %s\n' "$CANDIDATE_IMAGE_ID"
            printf -- '- Accepted source PR: #%s / %s\n' "$CANDIDATE_PR" "$CANDIDATE_MERGE_SHA"
            printf -- '- Immutable release evidence: verified\n'
            printf -- '- Fresh cutover backup: %s\n' "${BACKUP:-not-created}"
            printf -- '- Rollback container: %s\n' "${ROLLBACK:-automatic rollback attempted or not-created}"
            printf -- '- Canonical public Origin: %s\n' "$SCHOOL_ORIGIN"
            printf -- '- Result: %s\n' "${RESULT:-FAIL}"
            printf -- '- Job: %s\n' '${{ job.status }}'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report production cutover status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.sha,
              state: process.env.JOB_STATUS === "success" ? "success" : "failure",
              context: "school-diary/design-v1-production-cutover",
              description: "Design v1 production cutover " + process.env.JOB_STATUS,
              target_url:
                process.env.GITHUB_SERVER_URL + "/" +
                process.env.GITHUB_REPOSITORY + "/actions/runs/" +
                process.env.GITHUB_RUN_ID,
            });
