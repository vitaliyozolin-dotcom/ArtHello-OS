name: Quality gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # Scan the immutable PR head and every commit reachable from it.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact source head and complete history
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          actual_head="$(git rev-parse HEAD)"
          test "$actual_head" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse --is-shallow-repository)" = "false"
          test "$(git rev-list --count HEAD)" -gt 0
          git fsck --full --strict
          git log -p --no-ext-diff --full-history HEAD >/dev/null

      - name: Scan current tree and reachable Git history
        env:
          # v8.30.1 is intentionally excluded: its official release has a
          # reported false-negative regression. This v8.30.0 image is pinned
          # to the immutable official GHCR manifest digest.
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
        run: |
          set -Eeuo pipefail

          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          cat > "$smoke_dir/gitleaks.toml" <<'EOF'
          title = "CI secret scanner self-test"

          [[rules]]
          id = "ci-synthetic-leak"
          description = "CI-only synthetic finding"
          regex = '''SYNTHETIC_LEAK_[A-Z0-9]{16}'''
          EOF
          printf '%s%s\n' 'SYNTHETIC_' 'LEAK_A1B2C3D4E5F6G7H8' > "$smoke_dir/synthetic-leak.txt"

          set +e
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$smoke_dir:/scan:ro" \
            "$GITLEAKS_IMAGE" dir --config /scan/gitleaks.toml --no-banner --redact --exit-code 23 /scan
          smoke_status=$?
          set -e
          if [[ "$smoke_status" -ne 23 ]]; then
            echo "Gitleaks fail-closed self-test failed with status $smoke_status" >&2
            exit 1
          fi

          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/repo:ro" \
            "$GITLEAKS_IMAGE" dir --no-banner --redact --verbose /repo

          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/repo:ro" \
            -w /repo \
            "$GITLEAKS_IMAGE" git --no-banner --redact --verbose --log-opts="--full-history HEAD" /repo

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: arthello_test
          POSTGRES_USER: arthello_test
          POSTGRES_PASSWORD: sandbox-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arthello_test -d arthello_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://arthello_test:sandbox-only-password@127.0.0.1:5432/arthello_test
      TEST_DATABASE_URL: postgresql://arthello_test:sandbox-only-password@127.0.0.1:5432/arthello_test
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
        with:
          # pull_request normally checks out a synthetic merge ref. Quality
          # evidence must describe the exact immutable PR head instead.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact source head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_head="$(git rev-parse HEAD)"
          test "$actual_head" = "$EXPECTED_HEAD_SHA"

      - name: Validate production pull-deployment script
        run: bash -n deploy/pull-release.sh

      - name: Validate offline API runtime contract
        run: |
          set -Eeuo pipefail
          bash -n deploy/activate-git-transport.sh
          sh -n deploy/api-entrypoint.sh
          python3 -I .github/scripts/test-d082-route-diagnostic.py
          grep -F 'db_workspace=/app/lib/db' deploy/api-entrypoint.sh
          grep -F 'cd "$db_workspace"' deploy/api-entrypoint.sh
          grep -F 'node "$checked_runner"' deploy/api-entrypoint.sh
          grep -F 'checked_migration_runner_missing' deploy/api-entrypoint.sh
          grep -F 'ARTHELLO_API_STARTUP_ERROR=alfacrm_domain_missing_with_credentials' deploy/api-entrypoint.sh
          grep -F 'export ALFACRM_DOMAIN=disabled.invalid' deploy/api-entrypoint.sh
          if grep -Eq '(^|[[:space:]])pnpm([[:space:]]|$)|corepack|registry\.npmjs\.org' \
            deploy/api-entrypoint.sh; then
            echo 'Production API entrypoint must not invoke a package manager or registry.' >&2
            exit 1
          fi
          api_stage="$(awk '
            /^FROM .* AS api$/ { in_api=1 }
            /^FROM .* AS web$/ { in_api=0 }
            in_api { print }
          ' deploy/Dockerfile)"
          if grep -Eq 'corepack|pnpm|registry\.npmjs\.org' <<<"$api_stage"; then
            echo 'Final API image stage must remain package-manager-free.' >&2
            exit 1
          fi
          grep -F 'test -r /app/lib/db/scripts/checked-migration-runner.mjs' \
            deploy/Dockerfile
          grep -F 'test -r /app/lib/db/migration-manifest.json' \
            deploy/Dockerfile

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: corepack enable

      - run: corepack prepare pnpm@11.7.0 --activate

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      - run: pnpm run test:full

      - run: pnpm run test:postgres

      - run: pnpm run build:full

      - name: Build immutable provenance evidence
        run: |
          mkdir -p ci-provenance
          head_sha="$(git rev-parse HEAD)"
          tree_sha="$(git rev-parse HEAD^{tree})"
          source_archive_sha256="$(git archive --format=tar HEAD | sha256sum | cut -d ' ' -f 1)"
          sites_artifact_sha256="$(tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -cf - dist | sha256sum | cut -d ' ' -f 1)"
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "workflow_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "head_sha=${head_sha}"
            echo "tree_sha=${tree_sha}"
            echo "source_archive_sha256=${source_archive_sha256}"
            echo "sites_artifact_sha256=${sites_artifact_sha256}"
          } | tee ci-provenance/provenance.txt
          sha256sum ci-provenance/provenance.txt > ci-provenance/provenance.txt.sha256

      - name: Upload immutable provenance evidence
        uses: actions/upload-artifact@v4
        with:
          name: arthello-provenance-${{ github.run_id }}
          path: ci-provenance/
          if-no-files-found: error
          retention-days: 30

  d084-candidate-tests:
    name: d084-candidate-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHECKED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      R10_CONTRACT_SHA256: '74a486b0e533d9d982bc24a1d5b308cf31b44339640e80a6bca4d44ef45d18e8'
    steps:
      - name: Check out exact unprivileged R10 verification source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CHECKED_SOURCE_SHA }}
          fetch-depth: 0
          clean: true
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify R10 preservation and candidate gateway boundaries
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$CHECKED_SOURCE_SHA"
          test "$(sha256sum deploy/v52/recovery-r10/check-contract.rb | cut -d ' ' -f 1)" = "$R10_CONTRACT_SHA256"
          ruby deploy/v52/recovery-r10/check-contract.rb
          python3 -I .github/scripts/test-d083-replay-guard.py
          python3 -I .github/scripts/test-d083-candidate-state.py
          python3 -I .github/scripts/test-d083-resume-candidate.py
          python3 -I .github/scripts/test-d083-public-audit.py
          python3 -I .github/scripts/test-d083-controller-boundary.py
          python3 -I .github/scripts/test-r10-live-browser-acceptance.py
          python3 -I .github/scripts/test-d083-maintenance-route.py
          node --test scripts/test/retire-r9-browser.test.mjs
          bash -n .github/scripts/run-r10-live-browser.sh
          bash -n .github/scripts/run-d083-hosted-caddy.sh
          bash -n .github/scripts/run-d083-target-caddy.sh
          bash .github/scripts/run-d083-hosted-caddy.sh

  d085-candidate-tests:
    name: d085-candidate-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CHECKED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      R11_CONTRACT_SHA256: '67c2f3165e8275c2610dee6619e67fc943cfb14e300b232a61e0d889e6da2ede'
    steps:
      - name: Check out exact unprivileged R11 verification source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CHECKED_SOURCE_SHA }}
          fetch-depth: 0
          clean: true
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify preserved R10 boundary and owned fixture cleanup
        run: |
          set -Eeuo pipefail
          test "$(id -u)" -ne 0
          test "$(git rev-parse HEAD)" = "$CHECKED_SOURCE_SHA"
          test "$(sha256sum deploy/v52/recovery-r11/check-contract.rb | cut -d ' ' -f 1)" = "$R11_CONTRACT_SHA256"
          ruby deploy/v52/recovery-r11/check-contract.rb
          python3 -I .github/scripts/test-r11-replay-guard.py
          node --test .github/scripts/test-r11-target-caddy.test.mjs
          bash -n .github/scripts/run-r11-target-caddy.sh
