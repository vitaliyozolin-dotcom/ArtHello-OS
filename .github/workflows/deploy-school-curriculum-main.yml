name: Deploy School curriculum production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY-SCHOOL-2026-2027 to deploy the accepted School release'
        required: true
        type: string

permissions:
  actions: read
  contents: read
  deployments: read
  issues: write
  pull-requests: read

concurrency:
  group: school-1-11-production
  cancel-in-progress: false

env:
  CONTROLS_PR: '300'
  CONTROLS_BASE_SHA: c3182d598fd7a7a00a5388003754293219e41096
  RELEASE_SHA: f41dfb5de4eeeed4ed26d94009a18388728f42b7
  RELEASE_TREE: 2ecda1a0a872caab7aadbc303c152c1207d3030a
  RELEASE_PR: '303'
  VALIDATED_SHA: 9da48a1d6eb12a257442d72808e770c739b7fcc4
  VALIDATION_RUN_ID: '33592942510'
  VALIDATION_WORKFLOW_ID: '346579718'
  VALIDATION_JOB_ID: '100130562121'
  OFFLINE_BASE_REF: 'node:24-bookworm-slim@sha256:ba849c60be29959425b8734d57b8b4b7d56f98edd9504c9af091d5281095a71e'
  CUTOVER_SHA256: c752965e3f4b41662718690850573aec5e5a6d81dcf164d146af8040337ad571
  VERIFY_SHA256: 9f2839de7fff8e573c3b7a44262eb90fd6bfe79c1fd41d75ed747ca0f75d4727
  SCHOOL_ORIGIN: https://school-188-225-38-55.sslip.io
  ARTHELLO_ORIGIN: https://arthello-188-225-38-55.sslip.io

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'DEPLOY-SCHOOL-2026-2027' &&
      github.actor == 'vitaliyozolin-dotcom' &&
      github.triggering_actor == 'vitaliyozolin-dotcom'
    runs-on: [self-hosted, linux, x64, arthello-gateway]
    timeout-minutes: 75
    environment: production-ru
    steps:
      - name: Verify typed production confirmation
        env:
          DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$DEPLOY_CONFIRMATION" = DEPLOY-SCHOOL-2026-2027
          printf 'SCHOOL_PRODUCTION_CONFIRMATION=VERIFIED\n'

      - name: Verify protected production environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          environment_json="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/environments/production-ru")"
          jq -e '
            .name == "production-ru" and
            .can_admins_bypass == false and
            ([.protection_rules[]? |
              select(.type == "required_reviewers" and
                .prevent_self_review == true and
                ((.reviewers // []) | length) > 0)] | length) == 1
          ' <<<"$environment_json" >/dev/null
          printf 'SCHOOL_PRODUCTION_ENVIRONMENT_REVIEWER=VERIFIED\n'

      - name: Verify immutable deployment controls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          headers=(
            --header "Authorization: Bearer $GH_TOKEN"
            --header "Accept: application/vnd.github+json"
            --header "X-GitHub-Api-Version: 2022-11-28"
          )
          controls_pr_json="$(curl --fail-with-body --silent --show-error "${headers[@]}" "$api/pulls/$CONTROLS_PR")"
          jq -e \
            --argjson controls_pr "$CONTROLS_PR" \
            --arg controls_base_sha "$CONTROLS_BASE_SHA" \
            --arg workflow_sha "$GITHUB_SHA" \
            --arg repository "$GITHUB_REPOSITORY" \
            '.number == $controls_pr and
             .state == "closed" and
             .merged == true and
             .base.ref == "main" and
             .base.sha == $controls_base_sha and
             .head.ref == "codex/school-curriculum-production-cutover-20260902" and
             .head.repo.full_name == $repository and
             .merge_commit_sha == $workflow_sha and
             .user.login == "vitaliyozolin-dotcom" and
             .merged_by.login == "vitaliyozolin-dotcom"' <<<"$controls_pr_json" >/dev/null

          controls_head_sha="$(jq -r '.head.sha' <<<"$controls_pr_json")"
          [[ "$controls_head_sha" =~ ^[a-f0-9]{40}$ ]]
          workflow_commit_json="$(curl --fail-with-body --silent --show-error "${headers[@]}" "$api/commits/$GITHUB_SHA")"
          controls_head_json="$(curl --fail-with-body --silent --show-error "${headers[@]}" "$api/commits/$controls_head_sha")"
          jq -e \
            --arg workflow_sha "$GITHUB_SHA" \
            --arg controls_base_sha "$CONTROLS_BASE_SHA" \
            '.sha == $workflow_sha and
             .commit.verification.verified == true and
             .author.login == "vitaliyozolin-dotcom" and
             (.parents | length) == 1 and
             .parents[0].sha == $controls_base_sha' <<<"$workflow_commit_json" >/dev/null
          test "$(jq -r '.commit.tree.sha' <<<"$workflow_commit_json")" = \
            "$(jq -r '.commit.tree.sha' <<<"$controls_head_json")"
          printf 'SCHOOL_DEPLOYMENT_CONTROLS=VERIFIED\n'

      - name: Verify accepted release provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          headers=(
            --header "Authorization: Bearer $GH_TOKEN"
            --header "Accept: application/vnd.github+json"
            --header "X-GitHub-Api-Version: 2022-11-28"
          )
          run_json="$(curl --fail-with-body --silent --show-error "${headers[@]}" "$api/actions/runs/$VALIDATION_RUN_ID")"
          jq -e \
            --argjson run_id "$VALIDATION_RUN_ID" \
            --argjson workflow_id "$VALIDATION_WORKFLOW_ID" \
            --arg validated_sha "$VALIDATED_SHA" \
            --arg release_tree "$RELEASE_TREE" \
            --arg repository "$GITHUB_REPOSITORY" \
            '.id == $run_id and
             .workflow_id == $workflow_id and
             .name == "School KTP import targeted" and
             .path == ".github/workflows/school-ktp-import-targeted.yml" and
             .event == "pull_request" and
             .status == "completed" and
             .conclusion == "success" and
             .run_attempt == 1 and
             .head_sha == $validated_sha and
             .head_commit.id == $validated_sha and
             .head_commit.tree_id == $release_tree and
             .actor.login == "vitaliyozolin-dotcom" and
             .triggering_actor.login == "vitaliyozolin-dotcom" and
             .repository.full_name == $repository' <<<"$run_json" >/dev/null

          jobs_json="$(curl --fail-with-body --silent --show-error "${headers[@]}" "$api/actions/runs/$VALIDATION_RUN_ID/jobs?per_page=100")"
          jq -e \
            --argjson validation_job_id "$VALIDATION_JOB_ID" \
            --argjson validation_run_id "$VALIDATION_RUN_ID" \
            '[.jobs[] | select(
              .id == $validation_job_id and
              .run_id == $validation_run_id and
              .name == "validate" and
              .status == "completed" and
              .conclusion == "success")] | length == 1' \
            <<<"$jobs_json" >/dev/null

          validation_log="$RUNNER_TEMP/school-accepted-validation.log"
          curl --fail-with-body --silent --show-error --location "${headers[@]}" \
            --output "$validation_log" \
            "$api/actions/jobs/$VALIDATION_JOB_ID/logs"
          test -s "$validation_log"
          base_digest="${OFFLINE_BASE_REF##*@}"
          [[ "$base_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          grep -aF "Digest: $base_digest" "$validation_log" >/dev/null

          pr_json="$(curl --fail-with-body --silent --show-error "${headers[@]}" "$api/pulls/$RELEASE_PR")"
          jq -e \
            --argjson release_pr "$RELEASE_PR" \
            --arg validated_sha "$VALIDATED_SHA" \
            --arg release_sha "$RELEASE_SHA" \
            '.number == $release_pr and
             .state == "closed" and
             .merged == true and
             .head.sha == $validated_sha and
             .merge_commit_sha == $release_sha and
             .user.login == "vitaliyozolin-dotcom" and
             .merged_by.login == "vitaliyozolin-dotcom"' <<<"$pr_json" >/dev/null

          commit_json="$(curl --fail-with-body --silent --show-error "${headers[@]}" "$api/commits/$RELEASE_SHA")"
          jq -e \
            --arg release_sha "$RELEASE_SHA" \
            --arg release_tree "$RELEASE_TREE" \
            '.sha == $release_sha and
             .commit.tree.sha == $release_tree and
             .commit.verification.verified == true and
             .author.login == "vitaliyozolin-dotcom"' <<<"$commit_json" >/dev/null
          printf 'SCHOOL_RELEASE_PROVENANCE=VERIFIED\n'

      - name: Create production run record
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          payload="$(jq -n \
            --arg title "[school-production] curriculum run $GITHUB_RUN_ID" \
            --arg body "Deployment is queued for immutable School release $RELEASE_SHA. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{title: $title, body: $body}')"
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues")"
          issue_number="$(jq -r '.number' <<<"$response")"
          test "$issue_number" != null
          printf 'issue_number=%s\n' "$issue_number" >> "$GITHUB_OUTPUT"

      - name: Check out deployment controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: controls

      - name: Check out exact accepted School release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 1
          persist-credentials: false
          path: school-source

      - name: Verify immutable release source
        run: |
          set -Eeuo pipefail
          test "$(git -C controls rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git -C controls status --porcelain --untracked-files=all)"
          test "$(sha256sum controls/deploy/school-curriculum-standalone-cutover.sh | cut -d ' ' -f 1)" = "$CUTOVER_SHA256"
          test "$(sha256sum controls/deploy/verify-school-release.mjs | cut -d ' ' -f 1)" = "$VERIFY_SHA256"
          bash -n controls/deploy/school-curriculum-standalone-cutover.sh
          node --check controls/deploy/verify-school-release.mjs
          test "$(git -C school-source rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git -C school-source rev-parse HEAD^{tree})" = "$RELEASE_TREE"
          test -z "$(git -C school-source status --porcelain --untracked-files=all)"
          test "$(sha256sum school-source/deploy/Dockerfile.offline | cut -d ' ' -f 1)" = 0a71ac38c94bbf66094ced04028da32397433cb19663c9dfb935a117933121a4
          test "$(sha256sum school-source/scripts/import-school-schedule.mjs | cut -d ' ' -f 1)" = 5fb94f8550c24ceb6a642ea0ad5b0d107b1b52fc3f25df11c3ad1cdad1b8c5fc
          test "$(grep -Fxc 'FROM node:24-bookworm-slim AS dependencies' school-source/Dockerfile)" -eq 1
          test "$(grep -Fxc 'FROM node:24-bookworm-slim AS builder' school-source/Dockerfile)" -eq 1
          test "$(grep -Fxc 'FROM node:24-bookworm-slim AS runner' school-source/Dockerfile)" -eq 1
          printf 'SCHOOL_RELEASE_SOURCE=VERIFIED\n'

      - name: Package exact School source
        id: source
        run: |
          set -Eeuo pipefail
          printf '%s\n' "$RELEASE_SHA" > school-source/.school-source-sha
          printf '%s\n' "$RELEASE_TREE" > school-source/.school-source-tree
          archive="$RUNNER_TEMP/school-curriculum-release.tar.gz"
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --exclude=.git \
            --exclude=.next \
            --exclude=node_modules \
            -C school-source \
            -cf - . | gzip -n > "$archive"
          test -s "$archive"
          source_sha="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"
          printf 'sha256=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          printf 'SCHOOL_RELEASE_ARCHIVE=VERIFIED\n'

      - name: Configure protected SSH transport
        id: configure_ssh
        continue-on-error: true
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ARTHELLO_RU_SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.ARTHELLO_RU_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ARTHELLO_RU_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.ARTHELLO_RU_DEPLOY_PORT }}
        run: |
          set -Eeuo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          deploy_port="${DEPLOY_PORT:-2222}"
          ssh_dir="$RUNNER_TEMP/school-curriculum-ssh"
          install -m 0700 -d "$ssh_dir"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_dir/id_ed25519"
          chmod 0600 "$ssh_dir/id_ed25519"
          test -s "$ssh_dir/id_ed25519"
          ssh-keygen -y -f "$ssh_dir/id_ed25519" >/dev/null

          scan="$ssh_dir/known_hosts.scan"
          : > "$scan"
          chmod 0600 "$scan"
          for attempt in 1 2 3; do
            timeout --signal=TERM --kill-after=5s 150s \
              ssh -p "$deploy_port" \
                -o StrictHostKeyChecking=accept-new \
                -o UserKnownHostsFile="$scan" \
                -o GlobalKnownHostsFile=/dev/null \
                -o PreferredAuthentications=none \
                -o PubkeyAuthentication=no \
                -o PasswordAuthentication=no \
                -o KbdInteractiveAuthentication=no \
                -o ConnectTimeout=140 \
                -o HostKeyAlgorithms=ssh-ed25519 \
                "$DEPLOY_USER@$DEPLOY_HOST" true \
                </dev/null >/dev/null 2>&1 || true
            test -s "$scan" && break
            sleep 5
          done
          test -s "$scan"
          fingerprint="$(ssh-keygen -lf "$scan" -E sha256 | awk '{print $2; exit}')"
          test "$fingerprint" = 'SHA256:/kBNohTF+5g8U+jQt+PzOCoWZ9yCSFjBnEP3Oc3MwRI'
          mv "$scan" "$ssh_dir/known_hosts"
          ssh-keygen -l -f "$ssh_dir/known_hosts" >/dev/null

          timeout --signal=TERM --kill-after=5s 180s \
            ssh -T \
              -p "$deploy_port" \
              -i "$ssh_dir/id_ed25519" \
              -o IdentitiesOnly=yes \
              -o PreferredAuthentications=publickey \
              -o PasswordAuthentication=no \
              -o KbdInteractiveAuthentication=no \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$ssh_dir/known_hosts" \
              -o GlobalKnownHostsFile=/dev/null \
              -o ConnectTimeout=140 \
              -o ServerAliveInterval=10 \
              -o ServerAliveCountMax=30 \
              -o IPQoS=none \
              -o Compression=no \
              -o KexAlgorithms=curve25519-sha256 \
              -o HostKeyAlgorithms=ssh-ed25519 \
              -o PubkeyAcceptedAlgorithms=ssh-ed25519 \
              -o Ciphers=aes128-ctr \
              -o MACs=hmac-sha2-256 \
              "$DEPLOY_USER@$DEPLOY_HOST" true \
              </dev/null >/dev/null
          transport_parent=/tmp/school-curriculum-deploy-jobs
          transport_probe="$transport_parent/probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          timeout --signal=TERM --kill-after=5s 180s \
            ssh -T \
              -p "$deploy_port" \
              -i "$ssh_dir/id_ed25519" \
              -o IdentitiesOnly=yes \
              -o PreferredAuthentications=publickey \
              -o PasswordAuthentication=no \
              -o KbdInteractiveAuthentication=no \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$ssh_dir/known_hosts" \
              -o GlobalKnownHostsFile=/dev/null \
              -o ConnectTimeout=140 \
              -o ServerAliveInterval=10 \
              -o ServerAliveCountMax=30 \
              -o IPQoS=none \
              -o Compression=no \
              -o KexAlgorithms=curve25519-sha256 \
              -o HostKeyAlgorithms=ssh-ed25519 \
              -o PubkeyAcceptedAlgorithms=ssh-ed25519 \
              -o Ciphers=aes128-ctr \
              -o MACs=hmac-sha2-256 \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "set -Eeuo pipefail; test '$transport_probe' = '$transport_parent/probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}'; if test ! -e '$transport_parent'; then mkdir -m 0700 '$transport_parent' 2>/dev/null || true; fi; test -d '$transport_parent'; test ! -L '$transport_parent'; test \"\$(stat -c %u '$transport_parent')\" = \"\$(id -u)\"; test \"\$(stat -c %a '$transport_parent')\" = 700; test ! -e '$transport_probe'; mkdir -m 0700 '$transport_probe'; trap 'rmdir -- $transport_probe >/dev/null 2>&1 || true' EXIT; command -v base64 >/dev/null; command -v setsid >/dev/null; command -v timeout >/dev/null; command -v docker >/dev/null; command -v python3 >/dev/null; command -v flock >/dev/null; docker info >/dev/null; docker inspect school-1-11 >/dev/null" \
              </dev/null >/dev/null
          printf 'key_path=%s\n' "$ssh_dir/id_ed25519" >> "$GITHUB_OUTPUT"
          printf 'known_hosts_path=%s\n' "$ssh_dir/known_hosts" >> "$GITHUB_OUTPUT"
          printf 'SCHOOL_PROTECTED_SSH=VERIFIED\n'

      - name: Deploy immutable School release
        id: deploy_school
        if: steps.configure_ssh.outcome == 'success'
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.ARTHELLO_RU_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ARTHELLO_RU_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.ARTHELLO_RU_DEPLOY_PORT }}
          SSH_KEY_PATH: ${{ steps.configure_ssh.outputs.key_path }}
          SSH_KNOWN_HOSTS_PATH: ${{ steps.configure_ssh.outputs.known_hosts_path }}
          SOURCE_ARCHIVE: ${{ steps.source.outputs.archive }}
          SOURCE_SHA256: ${{ steps.source.outputs.sha256 }}
        run: |
          set -Eeuo pipefail
          log_file="$RUNNER_TEMP/school-curriculum-deploy.log"
          deploy_port="${DEPLOY_PORT:-2222}"
          job_dir="/tmp/school-curriculum-deploy-jobs/${RELEASE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh_args=(
            -T
            -p "$deploy_port"
            -i "$SSH_KEY_PATH"
            -o UserKnownHostsFile="$SSH_KNOWN_HOSTS_PATH"
            -o GlobalKnownHostsFile=/dev/null
            -o StrictHostKeyChecking=yes
            -o IdentitiesOnly=yes
            -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no
            -o KbdInteractiveAuthentication=no
            -o BatchMode=yes
            -o ConnectTimeout=140
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=30
            -o IPQoS=none
            -o Compression=no
            -o KexAlgorithms=curve25519-sha256
            -o HostKeyAlgorithms=ssh-ed25519
            -o PubkeyAcceptedAlgorithms=ssh-ed25519
            -o Ciphers=aes128-ctr
            -o MACs=hmac-sha2-256
          )
          scp_args=(
            -O
            -P "$deploy_port"
            -i "$SSH_KEY_PATH"
            -o UserKnownHostsFile="$SSH_KNOWN_HOSTS_PATH"
            -o GlobalKnownHostsFile=/dev/null
            -o StrictHostKeyChecking=yes
            -o IdentitiesOnly=yes
            -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no
            -o KbdInteractiveAuthentication=no
            -o BatchMode=yes
            -o ConnectTimeout=140
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=30
            -o IPQoS=none
            -o Compression=no
            -o KexAlgorithms=curve25519-sha256
            -o HostKeyAlgorithms=ssh-ed25519
            -o PubkeyAcceptedAlgorithms=ssh-ed25519
            -o Ciphers=aes128-ctr
            -o MACs=hmac-sha2-256
          )

          launch_nonce="$(openssl rand -hex 16)"
          printf '%s' "$launch_nonce" | grep -Eq '^[0-9a-f]{32}$'
          test -s "$SOURCE_ARCHIVE"
          test "$(sha256sum "$SOURCE_ARCHIVE" | cut -d ' ' -f 1)" = "$SOURCE_SHA256"
          runner_payload="$(base64 -w0 <<'REMOTE'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          umask 077
          worker_pid=""

          write_result() {
            local result=$1
            printf '%s\n' "$result" > "$JOB_DIR/status.tmp"
            mv "$JOB_DIR/status.tmp" "$JOB_DIR/status"
          }

          if [ "${1:-}" = worker ]; then
            printf '%s\n' "$$" > "$JOB_DIR/worker-pid.tmp"
            mv "$JOB_DIR/worker-pid.tmp" "$JOB_DIR/worker-pid"
            test ! -e "$JOB_DIR/cancel-request"
            printf 'started:%s\n' "$LAUNCH_NONCE" > "$JOB_DIR/ack.tmp"
            mv "$JOB_DIR/ack.tmp" "$JOB_DIR/ack"
            test ! -e "$JOB_DIR/cancel-request"
            exec timeout --signal=TERM --kill-after=600s 3000s \
              bash "$JOB_DIR/cutover.sh"
          fi

          terminate_worker() {
            local signal_status=$1
            local worker_status=$signal_status
            trap - HUP INT TERM
            set +e
            if [ -f "$JOB_DIR/status" ]; then
              exit "$signal_status"
            fi
            if [[ "$worker_pid" =~ ^[0-9]+$ ]]; then
              if kill -0 "$worker_pid" 2>/dev/null; then
                kill -TERM -- "-$worker_pid" 2>/dev/null || kill -TERM "$worker_pid" 2>/dev/null || true
              fi
              wait "$worker_pid"
              worker_status=$?
            fi
            if [ "$worker_status" -eq 0 ]; then
              write_result "success:$DELIVERY_REF:$LAUNCH_NONCE"
              exit 0
            fi
            write_result "failed:$worker_status:$LAUNCH_NONCE"
            exit "$signal_status"
          }

          trap 'terminate_worker 129' HUP
          trap 'terminate_worker 130' INT
          trap 'terminate_worker 143' TERM
          printf '%s\n' "$$" > "$JOB_DIR/pid.tmp"
          mv "$JOB_DIR/pid.tmp" "$JOB_DIR/pid"
          if [ -e "$JOB_DIR/cancel-request" ]; then
            write_result "failed:143:$LAUNCH_NONCE"
            exit 143
          fi
          status=0
          setsid bash "$JOB_DIR/run.sh" worker &
          worker_pid=$!
          wait "$worker_pid" || status=$?
          if [ "$status" -eq 0 ]; then
            result="success:$DELIVERY_REF:$LAUNCH_NONCE"
          else
            result="failed:$status:$LAUNCH_NONCE"
          fi
          write_result "$result"
          exit "$status"
          REMOTE
          )"
          cancel_payload="$(base64 -w0 <<'REMOTE_CANCEL'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          : "${JOB_DIR:?}"
          : "${LAUNCH_NONCE:?}"
          job_parent=/tmp/school-curriculum-deploy-jobs
          job_name=${JOB_DIR##*/}
          [[ "$job_name" =~ ^[0-9a-f]{40}-[0-9]+-[0-9]+$ ]]
          test "$JOB_DIR" = "$job_parent/$job_name"
          [[ "$LAUNCH_NONCE" =~ ^[0-9a-f]{32}$ ]]
          if [ ! -e "$job_parent" ]; then
            mkdir -m 0700 "$job_parent" 2>/dev/null || true
          fi
          test -d "$job_parent"
          test ! -L "$job_parent"
          test "$(stat -c %u "$job_parent")" = "$(id -u)"
          test "$(stat -c %a "$job_parent")" = 700
          if [ ! -e "$JOB_DIR" ]; then
            mkdir -m 0700 "$JOB_DIR" 2>/dev/null || true
          fi
          test -d "$JOB_DIR"
          test ! -L "$JOB_DIR"
          test "$(stat -c %u "$JOB_DIR")" = "$(id -u)"
          test "$(stat -c %a "$JOB_DIR")" = 700
          printf 'cancel:%s\n' "$LAUNCH_NONCE" > "$JOB_DIR/cancel-request.tmp.$$"
          mv "$JOB_DIR/cancel-request.tmp.$$" "$JOB_DIR/cancel-request"

          process_matches() {
            local candidate_pid=$1
            [[ "$candidate_pid" =~ ^[0-9]+$ ]] || return 1
            test -r "/proc/$candidate_pid/environ" || return 1
            tr '\0' '\n' < "/proc/$candidate_pid/environ" | grep -Fx "JOB_DIR=$JOB_DIR" >/dev/null || return 1
            tr '\0' '\n' < "/proc/$candidate_pid/environ" | grep -Fx "LAUNCH_NONCE=$LAUNCH_NONCE" >/dev/null || return 1
          }

          worker_signaled=0
          worker_pid=""
          if [ -f "$JOB_DIR/worker-pid" ]; then
            worker_pid=$(cat "$JOB_DIR/worker-pid" 2>/dev/null || true)
          fi
          if process_matches "$worker_pid" \
            && [ "$(ps -o pgid= -p "$worker_pid" | tr -d ' ')" = "$worker_pid" ] \
            && kill -TERM -- "-$worker_pid" 2>/dev/null; then
            worker_signaled=1
          fi

          if [ "$worker_signaled" -eq 0 ]; then
            controller_pid=""
            if [ -f "$JOB_DIR/pid" ]; then
              controller_pid=$(cat "$JOB_DIR/pid" 2>/dev/null || true)
            fi
            if process_matches "$controller_pid" \
              && [ "$(ps -o sid= -p "$controller_pid" | tr -d ' ')" = "$controller_pid" ]; then
              kill -TERM "$controller_pid" 2>/dev/null || true
            fi
          fi
          printf 'cancel-requested:%s\n' "$LAUNCH_NONCE"
          REMOTE_CANCEL
          )"
          test -n "$runner_payload"
          test -n "$cancel_payload"

          remote_job_active=0
          remote_job_complete=0
          commit_detected=0
          probe_remote_commit() {
            local max_attempts=${1:-6}
            local probe_timeout=${2:-180}
            local probe_kill_after=${3:-5}
            local commit_state=""
            local probe_rc=0
            if [ "$commit_detected" -eq 1 ]; then
              return 0
            fi
            for probe_attempt in $(seq 1 "$max_attempts"); do
              if commit_state="$(
                timeout --signal=TERM --kill-after="${probe_kill_after}s" "${probe_timeout}s" \
                  ssh -n "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
                    "set -Eeuo pipefail; if test -f '$job_dir/commit-state'; then test ! -L '$job_dir/commit-state'; test \"\$(stat -c %u '$job_dir/commit-state')\" = \"\$(id -u)\"; test \"\$(stat -c %a '$job_dir/commit-state')\" = 400; cat '$job_dir/commit-state'; fi" \
                    </dev/null 2>/dev/null
              )"; then
                probe_rc=0
              else
                probe_rc=$?
              fi
              if [ "$probe_rc" -eq 0 ] &&
                [ "$commit_state" = "committed:$RELEASE_SHA:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" ]; then
                printf 'committed=true\n' >> "$GITHUB_OUTPUT" || return 1
                printf 'SCHOOL_REMOTE_COMMIT_MARKER=VERIFIED\n' | tee -a "$log_file" || return 1
                commit_detected=1
                return 0
              fi
              commit_state=""
              if [ "$probe_attempt" -lt "$max_attempts" ]; then
                sleep 2
              fi
            done
            return 1
          }

          reconcile_remote_job() {
            local exit_code=$?
            trap - EXIT
            trap '' HUP INT TERM
            if [ "$remote_job_active" -eq 1 ] && [ "$remote_job_complete" -ne 1 ]; then
              set +e
              timeout --signal=TERM --kill-after=1s 2s \
                ssh -n "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
                  "printf '%s' '$cancel_payload' | base64 -d | env JOB_DIR='$job_dir' LAUNCH_NONCE='$launch_nonce' bash" \
                  </dev/null >/dev/null 2>&1
              cancel_rc=$?
              if [ "$cancel_rc" -eq 0 ]; then
                printf 'SCHOOL_REMOTE_CANCEL=REQUESTED\n' | tee -a "$log_file"
              else
                printf 'SCHOOL_REMOTE_CANCEL=NOT_ACTIVE_OR_UNREACHABLE\n' | tee -a "$log_file"
              fi
              probe_remote_commit 1 2 1 || true
              terminal_status=0
              for reconcile_attempt in $(seq 1 90); do
                reconciled_status="$(
                  timeout --signal=TERM --kill-after=2s 15s \
                    ssh -n "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
                      "test -f '$job_dir/status' && cat '$job_dir/status' || true" \
                      </dev/null 2>/dev/null
                )"
                case "$reconciled_status" in
                  success:*:"$launch_nonce"|failed:*:"$launch_nonce")
                    terminal_status=1
                    break
                    ;;
                esac
                sleep 2
              done
              probe_remote_commit || true
              if [ "$terminal_status" -eq 1 ]; then
                remote_job_complete=1
              fi
            fi
            exit "$exit_code"
          }
          trap reconcile_remote_job EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          printf 'SCHOOL_DEPLOY_TRANSPORT=PROTECTED_SSH\n' | tee "$log_file"
          timeout --signal=TERM --kill-after=5s 240s \
            ssh -n "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
              "set -Eeuo pipefail; job_parent=/tmp/school-curriculum-deploy-jobs; if test ! -e \"\$job_parent\"; then mkdir -m 0700 \"\$job_parent\" 2>/dev/null || true; fi; test -d \"\$job_parent\"; test ! -L \"\$job_parent\"; test \"\$(stat -c %u \"\$job_parent\")\" = \"\$(id -u)\"; test \"\$(stat -c %a \"\$job_parent\")\" = 700; test ! -e '$job_dir'; mkdir -m 0700 '$job_dir'" \
              </dev/null >/dev/null
          timeout --signal=TERM --kill-after=5s 1200s \
            scp "${scp_args[@]}" "$SOURCE_ARCHIVE" \
              "$DEPLOY_USER@$DEPLOY_HOST:$job_dir/school-release.tar.gz.upload"
          timeout --signal=TERM --kill-after=5s 600s \
            scp "${scp_args[@]}" controls/deploy/school-curriculum-standalone-cutover.sh \
              "$DEPLOY_USER@$DEPLOY_HOST:$job_dir/cutover.sh.upload"
          timeout --signal=TERM --kill-after=5s 600s \
            scp "${scp_args[@]}" controls/deploy/verify-school-release.mjs \
              "$DEPLOY_USER@$DEPLOY_HOST:$job_dir/verify-school-release.mjs.upload"
          timeout --signal=TERM --kill-after=5s 240s \
            ssh -n "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
              "set -Eeuo pipefail; test \"\$(sha256sum '$job_dir/school-release.tar.gz.upload' | cut -d ' ' -f 1)\" = '$SOURCE_SHA256'; test \"\$(sha256sum '$job_dir/cutover.sh.upload' | cut -d ' ' -f 1)\" = '$CUTOVER_SHA256'; test \"\$(sha256sum '$job_dir/verify-school-release.mjs.upload' | cut -d ' ' -f 1)\" = '$VERIFY_SHA256'; mv '$job_dir/school-release.tar.gz.upload' '$job_dir/school-release.tar.gz'; mv '$job_dir/cutover.sh.upload' '$job_dir/cutover.sh'; mv '$job_dir/verify-school-release.mjs.upload' '$job_dir/verify-school-release.mjs'; chmod 0400 '$job_dir/school-release.tar.gz' '$job_dir/verify-school-release.mjs'; chmod 0500 '$job_dir/cutover.sh'" \
              </dev/null >/dev/null
          printf 'SCHOOL_REMOTE_PAYLOAD=VERIFIED\n' | tee -a "$log_file"

          launch_rc=0
          launch_started_at="$(date +%s)"
          remote_job_active=1
          timeout --signal=TERM --kill-after=5s 240s \
            ssh -n "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
              "set -Eeuo pipefail; test -d '$job_dir'; test \"\$(stat -c %u '$job_dir')\" = \"\$(id -u)\"; test \"\$(stat -c %a '$job_dir')\" = 700; printf '%s' '$runner_payload' | base64 -d > '$job_dir/run.sh'; chmod 0500 '$job_dir/run.sh'; : > '$job_dir/deploy.log'; nohup setsid env DELIVERY_REF='$RELEASE_SHA' RUN_ID='$GITHUB_RUN_ID' RUN_ATTEMPT='$GITHUB_RUN_ATTEMPT' WORKFLOW_SHA='$GITHUB_SHA' RELEASE_SHA='$RELEASE_SHA' RELEASE_TREE='$RELEASE_TREE' SOURCE_ARCHIVE='$job_dir/school-release.tar.gz' SOURCE_SHA256='$SOURCE_SHA256' VERIFY_SCRIPT='$job_dir/verify-school-release.mjs' VERIFY_SHA256='$VERIFY_SHA256' OFFLINE_BASE_REF='$OFFLINE_BASE_REF' SCHOOL_ORIGIN='$SCHOOL_ORIGIN' ARTHELLO_ORIGIN='$ARTHELLO_ORIGIN' JOB_DIR='$job_dir' LAUNCH_NONCE='$launch_nonce' bash '$job_dir/run.sh' > '$job_dir/deploy.log' 2>&1 < /dev/null &" \
              </dev/null >/dev/null 2>&1 || launch_rc=$?
          launch_elapsed="$(( $(date +%s) - launch_started_at ))"
          printf 'SCHOOL_REMOTE_LAUNCH_RETURN=%s elapsed=%ss\n' "$launch_rc" "$launch_elapsed" | tee -a "$log_file"

          remote_ack=""
          for ack_attempt in $(seq 1 12); do
            set +e
            remote_ack="$(
              timeout --signal=TERM --kill-after=5s 180s \
                ssh -n "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
                  "test -f '$job_dir/ack' && cat '$job_dir/ack' || true" \
                  </dev/null 2>/dev/null
            )"
            ack_rc=$?
            set -e
            if [ "$ack_rc" -eq 0 ] && [ "$remote_ack" = "started:$launch_nonce" ]; then
              break
            fi
            remote_ack=""
            sleep 5
          done
          test "$remote_ack" = "started:$launch_nonce"
          printf 'SCHOOL_REMOTE_LAUNCH=ACKNOWLEDGED\n' | tee -a "$log_file"

          fetch_remote_log() {
            timeout --signal=TERM --kill-after=5s 180s \
              ssh -n "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
                "grep -E '^(SCHOOL_|Error:|error:|curl:|ssh:|Permission denied|Host key|Connection closed)' '$job_dir/deploy.log' 2>/dev/null | tail -n 400 | sed -E 's/(PASSWORD|TOKEN|SECRET|PRIVATE_KEY)=.*/\\1=[REDACTED]/Ig' || true" \
                </dev/null 2>/dev/null || true
          }

          remote_status=""
          for attempt in $(seq 1 390); do
            set +e
            remote_status="$(
              timeout --signal=TERM --kill-after=5s 180s \
                ssh -n "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
                  "test -f '$job_dir/status' && cat '$job_dir/status' || true" \
                  </dev/null 2>/dev/null
            )"
            poll_rc=$?
            set -e
            if [ "$poll_rc" -ne 0 ]; then
              remote_status=""
              sleep 10
              continue
            fi
            case "$remote_status" in
              "success:$RELEASE_SHA:$launch_nonce")
                break
                ;;
              failed:*:"$launch_nonce")
                fetch_remote_log | tee -a "$log_file"
                printf 'SCHOOL_REMOTE_STATUS=%s\n' "$remote_status" | tee -a "$log_file"
                if probe_remote_commit; then
                  remote_job_complete=1
                fi
                exit 1
                ;;
            esac
            if [ "$attempt" -eq 390 ]; then
              fetch_remote_log | tee -a "$log_file"
              printf 'SCHOOL_REMOTE_STATUS=timeout\n' | tee -a "$log_file"
              exit 1
            fi
            sleep 10
          done

          test "$remote_status" = "success:$RELEASE_SHA:$launch_nonce"
          probe_remote_commit
          remote_job_complete=1
          fetch_remote_log | tee -a "$log_file"
          grep -Fx 'SCHOOL_STANDALONE_SOURCE=VERIFIED' "$log_file" >/dev/null
          grep -Fx 'SCHOOL_STANDALONE_OFFLINE_BASE=VERIFIED' "$log_file" >/dev/null
          grep -Fx 'SCHOOL_STANDALONE_PREFLIGHT=PASS' "$log_file" >/dev/null
          grep -Fx 'SCHOOL_STANDALONE_PROTECTED_SCHEDULE_PREFLIGHT=PASS' "$log_file" >/dev/null
          grep -Fx 'SCHOOL_STANDALONE_FINAL_BACKUP=VERIFIED' "$log_file" >/dev/null
          grep -Fx 'SCHOOL_STANDALONE_LIVE_IMPORT=VERIFIED' "$log_file" >/dev/null
          grep -Fx 'SCHOOL_STANDALONE_PROTECTED_SCHEDULE_LIVE=PASS' "$log_file" >/dev/null
          grep -Fx 'SCHOOL_STANDALONE_COMMIT=ROLLBACK_DISABLED' "$log_file" >/dev/null
          grep -Fx 'SCHOOL_RELEASE_DATA=PASS' "$log_file" >/dev/null
          grep -Fx 'SCHOOL_PUBLIC_HTTPS=OK' "$log_file" >/dev/null
          grep -Fx 'SCHOOL_FULLSCREEN_CSS=VERIFIED' "$log_file" >/dev/null
          grep -Fx 'SCHOOL_PUBLIC_SSO=VERIFIED' "$log_file" >/dev/null
          grep -Fx 'SCHOOL_PUBLIC_FAMILY_LOGIN=VERIFIED' "$log_file" >/dev/null
          grep -Fx 'SCHOOL_MAINTENANCE=RELEASED' "$log_file" >/dev/null
          grep -Fx 'SCHOOL_STANDALONE_CUTOVER=PASS' "$log_file" >/dev/null
          grep -Fx "SCHOOL_DELIVERY_REF=$RELEASE_SHA" "$log_file" >/dev/null
          grep -Fx 'SCHOOL_RELEASE_SCHEDULE_ROWS=189' "$log_file" >/dev/null
          grep -Fx 'SCHOOL_RELEASE_CALENDAR_PERIODS=4' "$log_file" >/dev/null
          grep -Fx 'SCHOOL_RELEASE_CURRICULUM_TOPICS=170' "$log_file" >/dev/null
          grep -Fx 'SCHOOL_RELEASE_CURRICULUM_SESSIONS=170' "$log_file" >/dev/null
          grep -Fx 'SCHOOL_STANDALONE_BACKUP=VERIFIED' "$log_file" >/dev/null
          grep -Fx 'SCHOOL_STANDALONE_DATA_VOLUME=PRESERVED' "$log_file" >/dev/null
          printf 'SCHOOL_REMOTE_JOB=SUCCESS\n' | tee -a "$log_file"

      - name: Verify public School release
        id: verify_public
        if: steps.deploy_school.outputs.committed == 'true'
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          healthy=0
          for attempt in $(seq 1 60); do
            health="$(curl --fail --silent --show-error --max-time 30 "$SCHOOL_ORIGIN/api/health" || true)"
            if grep -F '"status":"ok"' <<<"$health" >/dev/null \
              && grep -F '"maintenance":false' <<<"$health" >/dev/null; then
              healthy=1
              break
            fi
            sleep 3
          done
          test "$healthy" -eq 1
          login_html="$RUNNER_TEMP/school-curriculum-login.html"
          css_file="$RUNNER_TEMP/school-curriculum.css"
          curl --fail --silent --show-error --max-time 60 \
            -H 'Cache-Control: no-cache' \
            "$SCHOOL_ORIGIN/login?release=$RELEASE_SHA" > "$login_html"
          : > "$css_file"
          css_count=0
          while IFS= read -r css_path; do
            test -n "$css_path"
            curl --fail --silent --show-error --max-time 60 \
              "$SCHOOL_ORIGIN$css_path" >> "$css_file"
            printf '\n' >> "$css_file"
            css_count=$((css_count + 1))
          done < <(grep -oE '/_next/static/css/[^"?]+\.css' "$login_html" | sort -u)
          test "$css_count" -gt 0
          grep -F '.l0-stage{width:100%;height:100svh;overflow:hidden' "$css_file" >/dev/null
          grep -F 'student-dashboard-hero-v1.webp' "$css_file" >/dev/null
          sso_headers="$RUNNER_TEMP/school-curriculum-sso.headers"
          curl --silent --show-error --max-time 30 --dump-header "$sso_headers" --output /dev/null "$SCHOOL_ORIGIN/auth/central/start"
          test "$(awk 'NR==1 {print $2}' "$sso_headers")" = 303
          sso_location="$(tr -d '\r' < "$sso_headers" | sed -n 's/^location: //Ip' | tail -n1)"
          python3 - "$sso_location" "$ARTHELLO_ORIGIN" <<'PY'
          import sys
          from urllib.parse import parse_qs, urlparse
          location=urlparse(sys.argv[1])
          authority=urlparse(sys.argv[2])
          assert location.scheme == authority.scheme
          assert location.netloc == authority.netloc
          assert location.path == '/api/school-sso/authorize'
          query=parse_qs(location.query)
          assert len(query.get('state',[''])[0]) >= 40
          assert len(query.get('code_challenge',[''])[0]) >= 40
          PY
          grep -Eiq '^set-cookie:[[:space:]]*school_sso_tx=' "$sso_headers"
          family_status="$(curl --silent --show-error --max-time 30 --output "$RUNNER_TEMP/school-curriculum-family.json" --write-out '%{http_code}' --request POST "$SCHOOL_ORIGIN/api/auth/login" --header "Origin: $SCHOOL_ORIGIN" --header 'Content-Type: application/json' --data '{"login":"nobody@example.invalid","password":"InvalidPassword1"}')"
          test "$family_status" = 401
          printf 'SCHOOL_PUBLIC_HTTPS=OK\n'
          printf 'SCHOOL_FULLSCREEN_CSS=VERIFIED\n'
          printf 'SCHOOL_PUBLIC_SSO=VERIFIED\n'
          printf 'SCHOOL_PUBLIC_FAMILY_LOGIN=VERIFIED\n'
          printf 'SCHOOL_MAINTENANCE=RELEASED\n'

      - name: Re-gate after failed external verification
        id: regate_public_failure
        if: >-
          always() &&
          steps.configure_ssh.outcome == 'success' &&
          (steps.deploy_school.outcome != 'success' ||
            (steps.deploy_school.outputs.committed == 'true' &&
              steps.verify_public.outcome != 'success'))
        env:
          DEPLOY_HOST: ${{ secrets.ARTHELLO_RU_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ARTHELLO_RU_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.ARTHELLO_RU_DEPLOY_PORT }}
          SSH_KEY_PATH: ${{ steps.configure_ssh.outputs.key_path }}
          SSH_KNOWN_HOSTS_PATH: ${{ steps.configure_ssh.outputs.known_hosts_path }}
        run: |
          set -Eeuo pipefail
          deploy_port="${DEPLOY_PORT:-2222}"
          ssh_args=(
            -T
            -p "$deploy_port"
            -i "$SSH_KEY_PATH"
            -o UserKnownHostsFile="$SSH_KNOWN_HOSTS_PATH"
            -o GlobalKnownHostsFile=/dev/null
            -o StrictHostKeyChecking=yes
            -o IdentitiesOnly=yes
            -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no
            -o KbdInteractiveAuthentication=no
            -o BatchMode=yes
            -o ConnectTimeout=140
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=30
            -o IPQoS=none
            -o Compression=no
            -o KexAlgorithms=curve25519-sha256
            -o HostKeyAlgorithms=ssh-ed25519
            -o PubkeyAcceptedAlgorithms=ssh-ed25519
            -o Ciphers=aes128-ctr
            -o MACs=hmac-sha2-256
          )
          job_dir="/tmp/school-curriculum-deploy-jobs/${RELEASE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          remote_payload="$(base64 -w0 <<'REMOTE'
          set -Eeuo pipefail
          : "${RELEASE_SHA:?}"
          : "${RUN_ID:?}"
          : "${RUN_ATTEMPT:?}"
          : "${JOB_DIR:?}"
          test "$JOB_DIR" = "/tmp/school-curriculum-deploy-jobs/${RELEASE_SHA}-${RUN_ID}-${RUN_ATTEMPT}"
          if [ ! -e "$JOB_DIR" ]; then
            printf 'SCHOOL_EXTERNAL_VERIFICATION_REGATE=NOT_COMMITTED\n'
            exit 0
          fi
          test -d "$JOB_DIR"
          test ! -L "$JOB_DIR"
          test "$(stat -c %u "$JOB_DIR")" = "$(id -u)"
          test "$(stat -c %a "$JOB_DIR")" = 700
          if [ ! -e "$JOB_DIR/commit-state" ]; then
            printf 'SCHOOL_EXTERNAL_VERIFICATION_REGATE=NOT_COMMITTED\n'
            exit 0
          fi
          test -f "$JOB_DIR/commit-state"
          test ! -L "$JOB_DIR/commit-state"
          test "$(stat -c %u "$JOB_DIR/commit-state")" = "$(id -u)"
          test "$(stat -c %a "$JOB_DIR/commit-state")" = 400
          test "$(cat "$JOB_DIR/commit-state")" = "committed:${RELEASE_SHA}:${RUN_ID}:${RUN_ATTEMPT}"
          production=school-1-11
          origin=https://school-188-225-38-55.sslip.io
          test "$(docker inspect "$production" --format '{{.State.Running}}')" = true
          data_volume="$(docker inspect "$production" --format '{{range .Mounts}}{{if eq .Destination "/data"}}{{.Name}}{{end}}{{end}}')"
          image_id="$(docker inspect "$production" --format '{{.Image}}')"
          [[ "$data_volume" =~ ^[A-Za-z0-9_.-]+$ ]]
          [[ "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker run --rm \
            --network none \
            --read-only \
            --user 0:0 \
            --security-opt no-new-privileges:true \
            --volume "$data_volume:/data" \
            --entrypoint /bin/sh \
            "$image_id" -c '
              set -eu
              target=/data/.school-deploy-read-only
              tmp="${target}.tmp.$$"
              rm -f "$tmp"
              umask 022
              printf "deployment read-only\n" > "$tmp"
              chmod 0444 "$tmp"
              mv -f "$tmp" "$target"
              test -f "$target"
              sync
            '
          docker exec "$production" test -f /data/.school-deploy-read-only
          body="$(mktemp)"
          headers="$(mktemp)"
          trap 'rm -f -- "$body" "$headers"' EXIT
          verified=0
          for attempt in $(seq 1 15); do
            : > "$body"
            : > "$headers"
            status="$(curl --silent --show-error --max-time 20 \
              --output "$body" --dump-header "$headers" --write-out '%{http_code}' \
              --request POST "$origin/api/school" \
              --header "Origin: $origin" \
              --header 'Content-Type: application/json' \
              --data '{"action":"deployment.external-verification-failed"}' || true)"
            if test "$status" = 503 \
              && grep -Eq '"code"[[:space:]]*:[[:space:]]*"deployment_read_only"' "$body" \
              && grep -Eiq '^Retry-After:[[:space:]]*30' "$headers"; then
              verified=1
              break
            fi
            sleep 2
          done
          test "$verified" -eq 1
          health="$(curl --fail --silent --show-error --max-time 30 "$origin/api/health")"
          grep -F '"status":"ok"' <<<"$health" >/dev/null
          grep -F '"maintenance":true' <<<"$health" >/dev/null
          printf 'SCHOOL_EXTERNAL_VERIFICATION_REGATE=PASS\n'
          REMOTE
          )"
          timeout --signal=TERM --kill-after=30s 480s \
            ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "printf '%s' '$remote_payload' | base64 -d | env RELEASE_SHA='$RELEASE_SHA' RUN_ID='$GITHUB_RUN_ID' RUN_ATTEMPT='$GITHUB_RUN_ATTEMPT' JOB_DIR='$job_dir' bash" \
            </dev/null

      - name: Remove temporary SSH material
        if: always()
        run: |
          rm -f \
            "$RUNNER_TEMP/school-curriculum-ssh/id_ed25519" \
            "$RUNNER_TEMP/school-curriculum-ssh/known_hosts"

      - name: Publish sanitized production result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIGURE_OUTCOME: ${{ steps.configure_ssh.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy_school.outcome }}
          PUBLIC_OUTCOME: ${{ steps.verify_public.outcome }}
          REGATE_OUTCOME: ${{ steps.regate_public_failure.outcome }}
        run: |
          set -Eeuo pipefail
          log_file="$RUNNER_TEMP/school-curriculum-deploy.log"
          report_file="$RUNNER_TEMP/school-curriculum-report.md"
          {
            printf 'School curriculum deployment run: %s\n\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            printf -- '- Immutable release: `%s`\n' "$RELEASE_SHA"
            printf -- '- Protected SSH configuration: `%s`\n' "$CONFIGURE_OUTCOME"
            printf -- '- Release deployment: `%s`\n' "$DEPLOY_OUTCOME"
            printf -- '- Public verification: `%s`\n\n' "$PUBLIC_OUTCOME"
            printf -- '- Failure re-gate: `%s`\n\n' "$REGATE_OUTCOME"
            printf 'Sanitized deployment markers:\n\n```text\n'
            if [ -f "$log_file" ]; then
              grep -E '^(SCHOOL_|Error:|error:|curl:|ssh:|Permission denied|Host key|Connection closed)' "$log_file" \
                | tail -n 180 \
                | sed -E 's/(PASSWORD|TOKEN|SECRET|PRIVATE_KEY)=.*/\1=[REDACTED]/Ig' || true
            else
              printf 'No deployment log was produced.\n'
            fi
            printf '```\n'
          } > "$report_file"
          issue_number="${{ steps.issue.outputs.issue_number }}"
          test -n "$issue_number"
          payload="$(jq -n --rawfile body "$report_file" '{body: $body}')"
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$issue_number" \
            >/dev/null

      - name: Enforce successful production result
        if: always()
        env:
          CONFIGURE_OUTCOME: ${{ steps.configure_ssh.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy_school.outcome }}
          PUBLIC_OUTCOME: ${{ steps.verify_public.outcome }}
        run: |
          set -Eeuo pipefail
          test "$CONFIGURE_OUTCOME" = success
          test "$DEPLOY_OUTCOME" = success
          test "$PUBLIC_OUTCOME" = success
