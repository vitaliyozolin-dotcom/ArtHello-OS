name: School KTP import targeted

on:
  push:
    branches:
      - codex/school-ktp-xlsx-import-20260831
    paths:
      - app/**
      - db/**
      - data/**
      - deploy/**
      - drizzle/**
      - lib/**
      - scripts/**
      - server/**
      - tests/**
      - .dockerignore
      - package.json
      - package-lock.json
      - proxy.ts
      - Dockerfile
      - .github/workflows/school-ktp-import-targeted.yml
  pull_request:
    branches:
      - school/staging-foundation-20260827
    paths:
      - app/**
      - db/**
      - data/**
      - deploy/**
      - drizzle/**
      - lib/**
      - scripts/**
      - server/**
      - tests/**
      - .dockerignore
      - package.json
      - package-lock.json
      - proxy.ts
      - Dockerfile
      - .github/workflows/school-ktp-import-targeted.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: school-ktp-import-targeted
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, linux, x64, arthello-gateway]
    timeout-minutes: 50
    steps:
      - name: Check out exact School candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact offline production runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/offline-runtime-v5-delta.tar.gz"
          expected=b451004c5d1584546233ba39d6ea37c0701a1653c1fd8f7b5ba2d21bd6b201d2
          test "$(find deploy -maxdepth 1 -type f -name 'offline-runtime-v5-delta.part-*' | wc -l)" -eq 6
          for index in 000 001 002 003 004 005; do
            test -s "deploy/offline-runtime-v5-delta.part-$index"
          done
          cat deploy/offline-runtime-v5-delta.part-* > "$archive"
          test "$(sha256sum "$archive" | cut -d ' ' -f 1)" = "$expected"
          grep -Fx "$expected  offline-runtime-v5-delta.tar.gz" \
            deploy/offline-runtime-v5-delta.sha256 >/dev/null
          grep -F "'$expected'" deploy/Dockerfile.offline >/dev/null
          grep -F "RELEASE_DELTA_SHA256=$expected" deploy/repair-deploy.sh >/dev/null
          gzip -t "$archive"
          entries="$(tar -tzf "$archive")"
          for required in \
            './.next/server/middleware.js' \
            './.next/server/functions-config-manifest.json' \
            './lib/maintenance-gate.mjs' \
            './lib/curriculum-allocation.mjs' \
            './scripts/import-school-schedule.mjs' \
            './scripts/import-school-curriculum.mjs' \
            './data/schedules/school-1-11-2026-2027.json' \
            './data/curricula/school-1-11-2-math-2026-2027.json'; do
            grep -Fx "$required" <<<"$entries" >/dev/null
          done
          tar -xOf "$archive" ./.next/server/middleware.js \
            | grep -aF 'deployment_read_only' >/dev/null
          tar -xOf "$archive" ./.next/server/middleware.js \
            | grep -aF 'school-deploy-read-only' >/dev/null
          tar --wildcards -xOf "$archive" './.next/static/css/*.css' \
            | grep -aF '.l0-stage{width:100%;height:100svh;overflow:hidden' >/dev/null
          printf 'SCHOOL_OFFLINE_RUNTIME=PASS\n'

      - name: Prepare deterministic School build context
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 0755 -d .openai
          printf '%s\n' '{"d1": null, "r2": null}' > .openai/hosting.json
          cat > .dockerignore <<'EOF'
          .git
          .next
          .openai/*
          !.openai/hosting.json
          .sites-runtime
          .wrangler
          .migration
          data/*
          !data/schedules
          !data/schedules/**
          !data/curricula
          !data/curricula/**
          deploy/offline-runtime-*.part-*
          deploy/offline-runtime-*.tar.gz
          dist
          node_modules
          npm-debug.log*
          EOF

      - name: Reclaim unused Docker build cache
        shell: bash
        run: |
          set -Eeuo pipefail
          docker image prune --force
          docker builder prune --force
          docker system df

      - name: Build candidate, lint and run contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          private_compose="$RUNNER_TEMP/school-candidate-private.yml"
          CENTRAL_ACCESS_SECRET=ci-contract-secret \
            docker compose \
              -p school-1-11 \
              -f deploy/docker-compose.yml \
              -f deploy/compose.candidate-private.yml \
              config > "$private_compose"
          grep -F 'school_candidate:' "$private_compose" >/dev/null
          grep -F 'internal: true' "$private_compose" >/dev/null
          if grep -F 'arthello-os_public' "$private_compose" >/dev/null; then
            printf 'Private candidate unexpectedly has public routing.\n' >&2
            exit 1
          fi
          builder="school-ktp-builder:${GITHUB_SHA}"
          runtime="school-ktp-runtime:${GITHUB_SHA}"
          if ! docker build --pull --target builder --build-arg NEXT_PUBLIC_SCHOOL_DESIGN_V1=true --tag "$builder" .; then
            printf 'Cached builder failed; retrying without Docker cache.\n' >&2
            docker build --pull --no-cache --target builder --build-arg NEXT_PUBLIC_SCHOOL_DESIGN_V1=true --tag "$builder" .
          fi
          docker run --rm --network none --entrypoint npm "$builder" run lint
          docker run --rm --network none --entrypoint node "$builder" \
            --test \
            tests/registration-contract.test.mjs \
            tests/school-structure-contract.test.mjs \
            tests/phone-auth-contract.test.mjs \
            tests/central-access-contract.test.mjs \
            tests/central-family-directory.test.mjs \
            tests/identity-broker-contract.test.mjs \
            tests/design-code-contract.test.mjs \
            tests/methodist-role-contract.test.mjs \
            tests/maintenance-gate.test.mjs \
            tests/curriculum-import.test.mjs \
            tests/curriculum-release-import.test.mjs \
            tests/schedule-import.test.mjs
          if ! docker build --build-arg NEXT_PUBLIC_SCHOOL_DESIGN_V1=true --tag "$runtime" .; then
            printf 'Cached runtime failed; retrying without Docker cache.\n' >&2
            docker build --no-cache --build-arg NEXT_PUBLIC_SCHOOL_DESIGN_V1=true --tag "$runtime" .
          fi
          printf 'SCHOOL_KTP_BUILD=PASS\n'

      - name: Verify isolated runtime and both migrations
        shell: bash
        run: |
          set -Eeuo pipefail
          runtime="school-ktp-runtime:${GITHUB_SHA}"
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container="school-ktp-check-${suffix}"
          data="school_ktp_check_${suffix}_data"
          secret="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          delivery="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            docker volume rm "$data" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker volume create "$data" >/dev/null
          docker run -d \
            --name "$container" \
            --network none \
            --security-opt no-new-privileges:true \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e DATABASE_PATH=/data/school-1-11.sqlite \
            -e PUBLIC_APP_ORIGIN=http://127.0.0.1:3000 \
            -e ARTHELLO_PUBLIC_ORIGIN=https://arthello.invalid \
            -e CENTRAL_ACCESS_SECRET="$secret" \
            -e PASSWORDLESS_PEPPER="$secret" \
            -e PASSWORDLESS_DELIVERY_URL=https://delivery.invalid/school-passwordless \
            -e PASSWORDLESS_DELIVERY_TOKEN="$delivery" \
            -v "$data:/data" \
            "$runtime" >/dev/null

          ready=0
          for attempt in $(seq 1 90); do
            if docker exec "$container" node -e "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"; then
              ready=1
              break
            fi
            if [ "$(docker inspect "$container" --format '{{.State.Running}}' 2>/dev/null || true)" != true ]; then
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker logs "$container" --tail 160 >&2 || true
            exit 1
          fi

          marker=/data/.school-deploy-read-only
          docker exec "$container" touch "$marker"
          docker exec -i "$container" node --input-type=module - <<'VERIFY_MAINTENANCE_GATE'
          const origin = 'http://127.0.0.1:3000';
          const writers = [
            ['GET', '/api/school'],
            ['POST', '/api/school'],
            ['POST', '/api/auth/activate'],
            ['POST', '/api/auth/login'],
            ['GET', '/api/auth/logout'],
            ['GET', '/api/auth/passwordless/magic'],
            ['POST', '/api/auth/passwordless/request'],
            ['POST', '/api/auth/passwordless/verify'],
            ['POST', '/api/internal/family-access-sync'],
            ['POST', '/api/internal/staff-sync'],
            ['GET', '/auth/central/callback'],
            ['GET', '/auth/central/start'],
          ];
          for (const [method, path] of writers) {
            const response = await fetch(origin + path, { method, redirect: 'manual' });
            const payload = await response.json();
            if (
              response.status !== 503 ||
              response.headers.get('cache-control') !== 'no-store' ||
              response.headers.get('retry-after') !== '30' ||
              payload.code !== 'deployment_read_only'
            ) {
              throw new Error(`Maintenance gate failed for ${method} ${path}: ${response.status}`);
            }
          }
          const health = await fetch(origin + '/api/health');
          const healthPayload = await health.json();
          if (!health.ok || healthPayload.status !== 'ok' || healthPayload.maintenance !== true) {
            throw new Error('Health is not maintenance-aware');
          }
          const login = await fetch(origin + '/login');
          if (!login.ok) throw new Error('Read-only login page was blocked');
          console.log('SCHOOL_MAINTENANCE_GATE=PASS');
          VERIFY_MAINTENANCE_GATE
          docker exec "$container" rm -f "$marker"
          docker exec -i "$container" node --input-type=module - <<'VERIFY_MAINTENANCE_RELEASE'
          const health = await fetch('http://127.0.0.1:3000/api/health');
          const payload = await health.json();
          if (!health.ok || payload.maintenance !== false) {
            throw new Error('Maintenance gate did not release');
          }
          const school = await fetch('http://127.0.0.1:3000/api/school');
          if (school.status === 503) {
            throw new Error('School API remained behind the maintenance gate');
          }
          console.log('SCHOOL_MAINTENANCE_RELEASE=PASS');
          VERIFY_MAINTENANCE_RELEASE

          docker exec -i "$container" node --input-type=module - <<'VERIFY_RUNTIME'
          import { DatabaseSync } from 'node:sqlite';
          const db = new DatabaseSync('/data/school-1-11.sqlite', { readOnly: true });
          const required = [
            'passwordless_challenges',
            'academic_calendar_periods',
            'program_imports',
            'program_topics',
            'program_topic_sessions',
            'schedule_imports',
            'schedule_exceptions',
          ];
          const tables = db.prepare(
            "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name"
          ).all().map((row) => row.name);
          const integrity = db.prepare('PRAGMA integrity_check').get().integrity_check;
          db.close();
          for (const table of required) {
            if (!tables.includes(table)) throw new Error('Missing table: ' + table);
          }
          if (integrity !== 'ok') throw new Error('SQLite integrity failed');
          console.log('SCHOOL_KTP_RUNTIME=PASS');
          VERIFY_RUNTIME

          cleanup
          trap - EXIT

      - name: Cleanup candidate images
        if: always()
        shell: bash
        run: |
          docker image rm "school-ktp-runtime:${GITHUB_SHA}" >/dev/null 2>&1 || true
          docker image rm "school-ktp-builder:${GITHUB_SHA}" >/dev/null 2>&1 || true

      - name: Publish commit status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.sha,
              state: process.env.JOB_STATUS === 'success' ? 'success' : 'failure',
              context: 'school/ktp-import-targeted',
              description: 'School KTP import targeted ' + process.env.JOB_STATUS,
              target_url: process.env.GITHUB_SERVER_URL + '/' + process.env.GITHUB_REPOSITORY + '/actions/runs/' + process.env.GITHUB_RUN_ID,
            });
