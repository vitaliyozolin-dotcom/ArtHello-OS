name: D060 Tochka production hotfix v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/d060-tochka-production-hotfix-v2.yml

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: gateway-38-55-arthello-production
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: vitaliyozolin-dotcom/ArtHello-OS
  EXPECTED_D060_MERGE: 75ba98c3cf89f28ebe4214179d3e034154530641
  EXPECTED_FAILED_ROLLOUT: 7e59de144abf5eb6c4ef76888d5ffba58ebbe586
  EXPECTED_D060_PR: '329'
  PUBLIC_URL: https://arthello-188-225-38-55.sslip.io
  DATA_VOLUME: arthello-direct-v44-data

jobs:
  deploy-d060-v2:
    if: >-
      github.repository == 'vitaliyozolin-dotcom/ArtHello-OS' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      github.actor == 'vitaliyozolin-dotcom' &&
      github.run_attempt == 1
    runs-on: [self-hosted, linux, x64, arthello-gateway]
    timeout-minutes: 180
    environment: production-ru
    concurrency:
      group: school-1-11-production
      cancel-in-progress: false

    steps:
      - name: Check out exact rollout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 4
          persist-credentials: false

      - name: Verify D-060 provenance and retry boundary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_ACTOR" = vitaliyozolin-dotcom
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_D060_MERGE" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_FAILED_ROLLOUT" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_FAILED_ROLLOUT"
          git merge-base --is-ancestor "$EXPECTED_D060_MERGE" HEAD

          mapfile -t retry_changed < <(git diff --name-only "$EXPECTED_FAILED_ROLLOUT" HEAD)
          test "${#retry_changed[@]}" -eq 1
          test "${retry_changed[0]}" = .github/workflows/d060-tochka-production-hotfix-v2.yml

          mapfile -t d060_changed < <(git diff --name-only "$EXPECTED_D060_MERGE" HEAD)
          test "${#d060_changed[@]}" -eq 2
          printf '%s\n' "${d060_changed[@]}" | sort > "$RUNNER_TEMP/d060-workflow-diff.txt"
          printf '%s\n' \
            .github/workflows/d060-tochka-production-hotfix-v2.yml \
            .github/workflows/d060-tochka-production-hotfix.yml | sort > "$RUNNER_TEMP/d060-workflow-expected.txt"
          cmp "$RUNNER_TEMP/d060-workflow-expected.txt" "$RUNNER_TEMP/d060-workflow-diff.txt"

          test -f docs/decisions/D-060-tochka-customer-permission-fallback.md
          grep -q 'patch-tochka-customer-permission-fallback.mjs' deploy/v52/Dockerfile
          grep -q 'TOCHKA_CUSTOMER_DIRECTORY_OPTIONAL' deploy/v52/overrides/scripts/patch-tochka-customer-permission-fallback.mjs

          pr_json="$(curl --fail-with-body --silent --show-error --max-time 30 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$EXPECTED_D060_PR")"
          jq -e \
            --arg sha "$EXPECTED_D060_MERGE" \
            --argjson number "$EXPECTED_D060_PR" '
              .number == $number and
              .state == "closed" and
              .merged == true and
              .merge_commit_sha == $sha and
              .base.ref == "main" and
              .head.ref == "codex/d060-tochka-account-fallback-20260903" and
              .user.login == "vitaliyozolin-dotcom"
            ' <<<"$pr_json" >/dev/null

          parent_json="$(curl --fail-with-body --silent --show-error --max-time 30 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$EXPECTED_D060_MERGE")"
          jq -e --arg parent 78886d8a1610d734681244c4e89359fadf7692cc '
            (.parents | length) == 1 and .parents[0].sha == $parent
          ' <<<"$parent_json" >/dev/null
          printf 'D060_V2_PROVENANCE=VERIFIED\n'

      - name: Prove live production is healthy before mutation
        run: |
          set -Eeuo pipefail
          mapfile -t live_ids < <(docker ps -q --filter "volume=$DATA_VOLUME")
          test "${#live_ids[@]}" -eq 1
          live_id="${live_ids[0]}"
          test "$(docker inspect "$live_id" --format '{{.State.Running}}')" = true
          test "$(docker inspect "$live_id" --format '{{range .Mounts}}{{if eq .Destination "/data"}}{{.Name}}{{end}}{{end}}')" = "$DATA_VOLUME"
          docker exec "$live_id" node -e "fetch('http://127.0.0.1:8081/api/health',{redirect:'error'}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
          curl --fail --silent --show-error --max-time 20 "$PUBLIC_URL/" >/dev/null
          docker volume rm arthello-d060-rollback-33780208695 >/dev/null 2>&1 || true
          printf 'D060_PREVIOUS_PRODUCTION=HEALTHY\n'

      - name: Build immutable D-060 candidate
        run: |
          set -Eeuo pipefail
          image="arthello-d060-hotfix-v2:$GITHUB_SHA"
          docker build \
            --pull=false \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "arthello.release.sha=$GITHUB_SHA" \
            -f deploy/v52/Dockerfile \
            -t "$image" \
            .
          image_id="$(docker image inspect "$image" --format '{{.Id}}')"
          test -n "$image_id"
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          printf 'D060_IMAGE=%s\nD060_IMAGE_ID=%s\n' "$image" "$image_id" >> "$GITHUB_ENV"

      - name: Backup live data and activate candidate
        id: activate
        run: |
          set -Eeuo pipefail
          work="$RUNNER_TEMP/arthello-d060-v2-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$work"
          chmod 0700 "$work"
          rollback_volume="arthello-d060-v2-rollback-$GITHUB_RUN_ID"
          rollback_container=""
          candidate_id=""
          live_name=""
          old_image_id=""
          old_restart_name=""
          old_restart_max="0"
          candidate_may_mutate=0

          cleanup_on_failure() {
            status=$?
            if [ "$status" -eq 0 ]; then return 0; fi
            set +e
            printf '::error::D-060 v2 rollout failed; starting rollback\n'
            if [ -n "$candidate_id" ]; then docker rm -f "$candidate_id" >/dev/null 2>&1 || true; fi
            if [ "$candidate_may_mutate" -eq 1 ] && [ -n "$old_image_id" ] && docker volume inspect "$rollback_volume" >/dev/null 2>&1; then
              docker run --rm --network none --user 0:0 \
                -v "$DATA_VOLUME:/to" \
                -v "$rollback_volume:/from:ro" \
                --entrypoint /bin/sh "$old_image_id" -ceu '
                  find /to -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
                  cd /from
                  tar -cf - . | tar -xf - -C /to
                ' >/dev/null 2>&1 || true
            fi
            if [ -n "$rollback_container" ] && docker inspect "$rollback_container" >/dev/null 2>&1; then
              if [ -n "$live_name" ]; then docker rename "$rollback_container" "$live_name" >/dev/null 2>&1 || true; fi
              if [ -n "$live_name" ]; then docker start "$live_name" >/dev/null 2>&1 || true; fi
              if [ -n "$live_name" ] && [ -n "$old_restart_name" ]; then
                if [ "$old_restart_name" = on-failure ]; then
                  docker update --restart="on-failure:$old_restart_max" "$live_name" >/dev/null 2>&1 || true
                else
                  docker update --restart="$old_restart_name" "$live_name" >/dev/null 2>&1 || true
                fi
              fi
            fi
            exit "$status"
          }
          trap cleanup_on_failure EXIT INT TERM HUP

          mapfile -t live_ids < <(docker ps -q --filter "volume=$DATA_VOLUME")
          test "${#live_ids[@]}" -eq 1
          live_id="${live_ids[0]}"
          live_name="$(docker inspect "$live_id" --format '{{.Name}}' | sed 's#^/##')"
          test -n "$live_name"
          old_image_id="$(docker inspect "$live_id" --format '{{.Image}}')"
          old_restart_name="$(docker inspect "$live_id" --format '{{.HostConfig.RestartPolicy.Name}}')"
          old_restart_max="$(docker inspect "$live_id" --format '{{.HostConfig.RestartPolicy.MaximumRetryCount}}')"
          test -n "$old_image_id"
          test -n "$old_restart_name"
          test "$(docker inspect "$live_id" --format '{{.State.Running}}')" = true
          test "$(docker inspect "$live_id" --format '{{range .Mounts}}{{if eq .Destination "/data"}}{{.Name}}{{end}}{{end}}')" = "$DATA_VOLUME"

          docker inspect "$live_id" > "$work/live.json"
          python3 - "$work/live.json" "$work/live.env" "$work/run.args" <<'PY'
          import json
          import os
          import sys

          inspect_path, env_path, args_path = sys.argv[1:]
          data = json.load(open(inspect_path, encoding="utf-8"))[0]
          env = data.get("Config", {}).get("Env") or []
          with open(env_path, "w", encoding="utf-8", newline="\n") as out:
              for item in env:
                  if not isinstance(item, str) or "\n" in item or "\r" in item:
                      raise SystemExit("unsafe environment entry")
                  out.write(item + "\n")
          os.chmod(env_path, 0o600)

          args = []
          mounts = data.get("Mounts") or []
          for mount in mounts:
              typ = mount.get("Type")
              dst = mount.get("Destination")
              if typ not in {"volume", "bind"} or not isinstance(dst, str) or not dst or "," in dst or "\n" in dst:
                  raise SystemExit("unsupported mount")
              src = mount.get("Name") if typ == "volume" else mount.get("Source")
              if not isinstance(src, str) or not src or "," in src or "\n" in src:
                  raise SystemExit("unsafe mount source")
              spec = f"type={typ},src={src},dst={dst}"
              if not mount.get("RW", False):
                  spec += ",readonly"
              args += ["--mount", spec]

          host = data.get("HostConfig") or {}
          if host.get("ReadonlyRootfs"):
              args.append("--read-only")
          for dst, opts in (host.get("Tmpfs") or {}).items():
              if not isinstance(dst, str) or not isinstance(opts, str) or "\n" in dst or "\n" in opts:
                  raise SystemExit("unsafe tmpfs")
              args += ["--tmpfs", f"{dst}:{opts}" if opts else dst]
          user = data.get("Config", {}).get("User") or ""
          if user:
              if "\n" in user:
                  raise SystemExit("unsafe user")
              args += ["--user", user]
          workdir = data.get("Config", {}).get("WorkingDir") or ""
          if workdir:
              if "\n" in workdir:
                  raise SystemExit("unsafe workdir")
              args += ["--workdir", workdir]
          networks = list((data.get("NetworkSettings", {}).get("Networks") or {}).keys())
          if len(networks) != 1 or not networks[0] or "\n" in networks[0]:
              raise SystemExit("expected exactly one Docker network")
          args += ["--network", networks[0]]
          with open(args_path, "wb") as out:
              for arg in args:
                  out.write(arg.encode("utf-8") + b"\0")
          PY

          chmod 0600 "$work/live.json" "$work/live.args"
          test -s "$work/live.env"
          test -s "$work/run.args"
          mapfile -d '' -t run_args < "$work/run.args"

          docker volume create \
            --label arthello.scope=production-rollback \
            --label "arthello.release.sha=$GITHUB_SHA" \
            --label "arthello.rollback.source=$live_name" \
            "$rollback_volume" >/dev/null

          docker pause "$live_id" >/dev/null
          backup_ok=0
          if docker run --rm --network none --user 0:0 \
            -v "$DATA_VOLUME:/from:ro" \
            -v "$rollback_volume:/to" \
            --entrypoint /bin/sh "$old_image_id" -ceu '
              cd /from
              tar -cf - . | tar -xf - -C /to
            '
          then
            backup_ok=1
          fi
          docker unpause "$live_id" >/dev/null
          test "$backup_ok" -eq 1
          docker run --rm --network none --user 0:0 -v "$rollback_volume:/backup:ro" \
            --entrypoint /bin/sh "$old_image_id" -ceu 'test -n "$(find /backup -mindepth 1 -maxdepth 2 -print -quit)"'
          printf 'D060_V2_BACKUP=VERIFIED volume=%s\n' "$rollback_volume"

          rollback_container="${live_name}-rollback-d060-v2-${GITHUB_RUN_ID}"
          docker update --restart=no "$live_id" >/dev/null
          docker stop --time 30 "$live_id" >/dev/null
          docker rename "$live_id" "$rollback_container"

          candidate_may_mutate=1
          docker run -d \
            --name "$live_name" \
            --restart=no \
            --env-file "$work/live.env" \
            "${run_args[@]}" \
            --label "arthello.release.sha=$GITHUB_SHA" \
            --label "arthello.release.kind=d060-tochka-hotfix-v2" \
            "$D060_IMAGE_ID" >/dev/null
          candidate_id="$(docker inspect "$live_name" --format '{{.Id}}')"
          test -n "$candidate_id"
          test "$(docker inspect "$live_name" --format '{{.State.Running}}')" = true
          test "$(docker inspect "$live_name" --format '{{range .Mounts}}{{if eq .Destination "/data"}}{{.Name}}{{end}}{{end}}')" = "$DATA_VOLUME"

          ready=0
          for _ in $(seq 1 45); do
            if docker exec "$live_name" node -e "fetch('http://127.0.0.1:8081/api/health',{redirect:'error'}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))" >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1

          public_ok=0
          for _ in $(seq 1 20); do
            if curl --fail --silent --show-error --max-time 10 "$PUBLIC_URL/" >/dev/null; then
              public_ok=1
              break
            fi
            sleep 2
          done
          test "$public_ok" -eq 1

          if [ "$old_restart_name" = on-failure ]; then
            docker update --restart="on-failure:$old_restart_max" "$live_name" >/dev/null
          else
            docker update --restart="$old_restart_name" "$live_name" >/dev/null
          fi
          test "$(docker inspect "$live_name" --format '{{index .Config.Labels "arthello.release.sha"}}')" = "$GITHUB_SHA"
          printf 'D060_V2_RELEASE_ACTIVE=%s\nD060_V2_CONTAINER=%s\nD060_V2_ROLLBACK_CONTAINER=%s\nD060_V2_ROLLBACK_VOLUME=%s\n' \
            "$GITHUB_SHA" "$live_name" "$rollback_container" "$rollback_volume"
          printf 'live_name=%s\nrollback_container=%s\nrollback_volume=%s\n' \
            "$live_name" "$rollback_container" "$rollback_volume" >> "$GITHUB_OUTPUT"
          trap - EXIT INT TERM HUP

      - name: Verify public production after activation
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --max-time 20 "$PUBLIC_URL/" >/dev/null
          live_name='${{ steps.activate.outputs.live_name }}'
          test -n "$live_name"
          test "$(docker inspect "$live_name" --format '{{.State.Running}}')" = true
          test "$(docker inspect "$live_name" --format '{{index .Config.Labels "arthello.release.sha"}}')" = "$GITHUB_SHA"
          printf 'D060_V2_PRODUCTION=VERIFIED sha=%s\n' "$GITHUB_SHA"

      - name: Publish rollout summary
        if: always()
        run: |
          {
            echo '## D-060 Tochka production rollout v2'
            echo
            echo "- source: $GITHUB_SHA"
            echo "- D-060 merge: $EXPECTED_D060_MERGE"
            echo "- result: ${{ job.status }}"
            echo "- production: $PUBLIC_URL"
          } >> "$GITHUB_STEP_SUMMARY"
