name: Validate School SSO production image

on:
  push:
    branches:
      - ops/deploy-school-sso-origin-20260902
    paths:
      - server/central-sso.ts
      - tests/**
      - Dockerfile
      - package.json
      - package-lock.json
      - deploy/Dockerfile.sso-origin-hotfix
      - .github/workflows/validate-school-sso-production-image-20260902.yml

permissions:
  contents: read
  statuses: write

concurrency:
  group: validate-school-sso-production-image
  cancel-in-progress: true

env:
  PRODUCT_RELEASE_SHA: 165a549d84779e1239dec254e6ac9914b40581c2
  ARTHELLO_ORIGIN: https://arthello-188-225-38-55.sslip.io

jobs:
  validate:
    if: >-
      github.repository == 'vitaliyozolin-dotcom/ArtHello-OS' &&
      github.actor == 'vitaliyozolin-dotcom' &&
      github.triggering_actor == 'vitaliyozolin-dotcom'
    runs-on: [self-hosted, linux, x64, arthello-gateway]
    timeout-minutes: 70
    steps:
      - name: Check out exact deployment candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable product source and scoped controls
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          git cat-file -e "$PRODUCT_RELEASE_SHA^{commit}"
          mapfile -t changed < <(git diff --name-only "$PRODUCT_RELEASE_SHA..$GITHUB_SHA")
          test "${#changed[@]}" -ge 1
          for path in "${changed[@]}"; do
            case "$path" in
              deploy/Dockerfile.sso-origin-hotfix|.github/workflows/validate-school-sso-production-image-20260902.yml)
                ;;
              *)
                printf 'Unexpected deployment-branch change: %s\n' "$path" >&2
                exit 1
                ;;
            esac
          done
          grep -F 'origin: exchangeUrl.origin' server/central-sso.ts >/dev/null
          printf 'SCHOOL_SSO_PRODUCT_SOURCE=VERIFIED\n'

      - name: Prepare deterministic build context
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 0755 -d .openai
          printf '%s\n' '{"d1": null, "r2": null}' > .openai/hosting.json
          sed -i '/^\.openai$/d' .dockerignore
          printf 'SCHOOL_SSO_BUILD_CONTEXT=READY\n'

      - name: Build builder and run contract suite
        shell: bash
        run: |
          set -Eeuo pipefail
          builder="school-sso-production-builder:${GITHUB_SHA}"
          docker build \
            --file Dockerfile \
            --build-arg NEXT_PUBLIC_SCHOOL_DESIGN_V1=true \
            --build-arg NEXT_PUBLIC_SCHOOL_PARENT_OTP_ENABLED=false \
            --target builder \
            --tag "$builder" .
          docker run --rm --network none --entrypoint node "$builder" \
            --test \
            tests/phone-auth-contract.test.mjs \
            tests/central-access-contract.test.mjs \
            tests/central-family-directory.test.mjs \
            tests/identity-broker-contract.test.mjs \
            tests/design-code-contract.test.mjs \
            tests/school-structure-contract.test.mjs \
            tests/methodist-role-contract.test.mjs \
            tests/schedule-import.test.mjs \
            tests/curriculum-import.test.mjs \
            tests/curriculum-release-import.test.mjs \
            tests/maintenance-gate.test.mjs
          printf 'SCHOOL_SSO_CONTRACTS=PASS\n'

      - name: Build production-compatible runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          docker image inspect arthello-os-api:local >/dev/null
          image="school-sso-production:${GITHUB_SHA}"
          docker build \
            --file deploy/Dockerfile.sso-origin-hotfix \
            --build-arg NEXT_PUBLIC_SCHOOL_DESIGN_V1=true \
            --build-arg NEXT_PUBLIC_SCHOOL_PARENT_OTP_ENABLED=false \
            --build-arg SCHOOL_RELEASE_SHA="$PRODUCT_RELEASE_SHA" \
            --tag "$image" .
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "school.release.sha"}}')" = "$PRODUCT_RELEASE_SHA"
          test "$(docker image inspect "$image" --format '{{.Config.User}}')" = node
          test "$(docker image inspect "$image" --format '{{.Config.WorkingDir}}')" = /school
          test "$(docker image inspect "$image" --format '{{json .Config.Entrypoint}}')" = '["./scripts/container-entrypoint.sh"]'
          test "$(docker image inspect "$image" --format '{{json .Config.Cmd}}')" = '["node","server.js"]'
          printf 'SCHOOL_SSO_COMPATIBILITY_IMAGE=BUILT\n'

      - name: Verify isolated production-compatible runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          image="school-sso-production:${GITHUB_SHA}"
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container="school-sso-production-check-$suffix"
          volume="school_sso_production_check_${suffix}_data"
          secret="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker volume create "$volume" >/dev/null
          docker run --rm \
            --network none \
            --user 0:0 \
            --volume "$volume:/data" \
            --entrypoint /bin/sh \
            "$image" \
            -c 'cp /school/bootstrap/school-1-11.sqlite /data/school-1-11.sqlite && chown node:node /data/school-1-11.sqlite && chmod 0660 /data/school-1-11.sqlite'
          docker run -d \
            --name "$container" \
            --network none \
            --security-opt no-new-privileges:true \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e DATABASE_PATH=/data/school-1-11.sqlite \
            -e PUBLIC_APP_ORIGIN=http://127.0.0.1:3000 \
            -e ARTHELLO_PUBLIC_ORIGIN="$ARTHELLO_ORIGIN" \
            -e CENTRAL_ACCESS_SECRET="$secret" \
            -v "$volume:/data" \
            "$image" >/dev/null
          ready=0
          for attempt in $(seq 1 90); do
            if docker exec "$container" node -e \
              "fetch('http://127.0.0.1:3000/api/health').then(async r=>{const t=await r.text();if(!r.ok||!t.includes('\\\"status\\\":\\\"ok\\\"'))process.exit(1)}).catch(()=>process.exit(1))"; then
              ready=1
              break
            fi
            test "$(docker inspect "$container" --format '{{.State.Running}}' 2>/dev/null || true)" = true || break
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker logs "$container" --tail 200 >&2 || true
            exit 1
          fi
          docker exec -i "$container" node --input-type=module <<'VERIFY'
          import { DatabaseSync } from 'node:sqlite';
          const base='http://127.0.0.1:3000';
          const health=await fetch(base+'/api/health');
          if(!health.ok || !(await health.text()).includes('"status":"ok"')) throw new Error('health failed');
          const login=await fetch(base+'/login');
          const html=await login.text();
          if(!login.ok || !html.includes('Вход для сотрудников')) throw new Error('login marker missing');
          const sso=await fetch(base+'/auth/central/start',{redirect:'manual'});
          const location=sso.headers.get('location')||'';
          if(sso.status!==303 || !location.startsWith('https://arthello-188-225-38-55.sslip.io/api/school-sso/authorize')) throw new Error('SSO start failed');
          const db=new DatabaseSync(process.env.DATABASE_PATH,{readOnly:true});
          const integrity=db.prepare('PRAGMA integrity_check').get().integrity_check;
          db.close();
          if(integrity!=='ok') throw new Error('database integrity failed');
          console.log('SCHOOL_SSO_ISOLATED_RUNTIME=PASS');
          VERIFY
          cleanup
          trap - EXIT

      - name: Cleanup validation images
        if: always()
        shell: bash
        run: |
          docker image rm "school-sso-production:${GITHUB_SHA}" >/dev/null 2>&1 || true
          docker image rm "school-sso-production-builder:${GITHUB_SHA}" >/dev/null 2>&1 || true

      - name: Publish exact validation status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.sha,
              state: process.env.JOB_STATUS === 'success' ? 'success' : 'failure',
              context: 'school/sso-production-image',
              description: 'School SSO production image ' + process.env.JOB_STATUS,
              target_url: process.env.GITHUB_SERVER_URL + '/' + process.env.GITHUB_REPOSITORY + '/actions/runs/' + process.env.GITHUB_RUN_ID,
            });
