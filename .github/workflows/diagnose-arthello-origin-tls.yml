name: Diagnose ArtHello origin TLS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arthello-production-ru
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-ru
    env:
      DEPLOY_HOST: ${{ secrets.ARTHELLO_RU_DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.ARTHELLO_RU_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.ARTHELLO_RU_DEPLOY_PORT }}
    steps:
      - name: Configure pinned SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ARTHELLO_RU_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ARTHELLO_RU_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 0700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts.previous
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

          route_device="$(ip -4 route show default | awk '{print $5; exit}')"
          test -n "$route_device"
          sudo ip link set dev "$route_device" mtu 1200
          deploy_port="${DEPLOY_PORT:-2222}"
          scanned_hosts="$RUNNER_TEMP/arthello-known-hosts"
          : > "$scanned_hosts"
          chmod 0600 "$scanned_hosts"
          for attempt in 1 2 3; do
            ssh -p "$deploy_port" \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile="$scanned_hosts" \
              -o GlobalKnownHostsFile=/dev/null \
              -o PreferredAuthentications=none \
              -o PubkeyAuthentication=no \
              -o PasswordAuthentication=no \
              -o KbdInteractiveAuthentication=no \
              -o ConnectTimeout=30 \
              -o HostKeyAlgorithms=ssh-ed25519 \
              "$DEPLOY_USER@$DEPLOY_HOST" true </dev/null >/dev/null 2>&1 || true
            test -s "$scanned_hosts" && break
            sleep 5
          done
          test -s "$scanned_hosts"
          actual_fingerprint="$(ssh-keygen -lf "$scanned_hosts" -E sha256 | awk '{print $2; exit}')"
          printf 'ARTHELLO_SSH_HOST_FINGERPRINT=%s\n' "$actual_fingerprint"
          test "$actual_fingerprint" = 'SHA256:/kBNohTF+5g8U+jQt+PzOCoWZ9yCSFjBnEP3Oc3MwRI'
          mv "$scanned_hosts" ~/.ssh/known_hosts

      - name: Collect sanitized Caddy diagnostics
        run: |
          set -Eeuo pipefail
          deploy_port="${DEPLOY_PORT:-2222}"
          route_device="$(ip -4 route show default | awk '{print $5; exit}')"
          test -n "$route_device"
          sudo ip link set dev "$route_device" mtu 1200
          ssh_args=(
            -p "$deploy_port"
            -i ~/.ssh/id_ed25519
            -o IdentitiesOnly=yes
            -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no
            -o KbdInteractiveAuthentication=no
            -o BatchMode=yes
            -o ConnectTimeout=20
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=20
            -o IPQoS=none
            -o Compression=no
            -o KexAlgorithms=curve25519-sha256
            -o HostKeyAlgorithms=ssh-ed25519
            -o PubkeyAcceptedAlgorithms=ssh-ed25519
            -o Ciphers=aes128-ctr
            -o MACs=hmac-sha2-256
          )
          payload="$(base64 -w0 <<'REMOTE'
          set -Eeuo pipefail
          web_id="$(docker ps --filter 'label=com.docker.compose.service=web' --format '{{.ID}}' | head -n 1)"
          test -n "$web_id"
          printf 'ARTHELLO_WEB_IMAGE=%s\n' "$(docker inspect --format '{{.Config.Image}}' "$web_id")"
          printf 'ARTHELLO_WEB_PORTS=%s\n' "$(docker inspect --format '{{json .NetworkSettings.Ports}}' "$web_id")"
          docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$web_id" \
            | grep '^ARTHELLO_HOST=' \
            | sed 's/^/ARTHELLO_WEB_ENV_/' || true
          printf 'ARTHELLO_CERT_PATHS_BEGIN\n'
          docker exec "$web_id" sh -lc \
            'find /data/caddy/certificates -type f -name "*.crt" -print 2>/dev/null || true' \
            | sed 's#^/data/caddy/certificates/#ARTHELLO_CERT_PATH=#'
          printf 'ARTHELLO_CERT_PATHS_END\n'
          docker exec "$web_id" sh -lc 'wget -qO- http://127.0.0.1:2019/config/' > /tmp/arthello-caddy-live.json
          python3 - /tmp/arthello-caddy-live.json <<'PY'
          import json
          import pathlib
          import sys

          config = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          servers = config.get("apps", {}).get("http", {}).get("servers", {})
          for name, server in servers.items():
              print(f"ARTHELLO_CADDY_LISTEN={name}:{','.join(server.get('listen', []))}")

          hosts = set()
          def walk(value):
              if isinstance(value, dict):
                  for key, item in value.items():
                      if key == "host" and isinstance(item, list):
                          hosts.update(str(host) for host in item)
                      walk(item)
              elif isinstance(value, list):
                  for item in value:
                      walk(item)
          walk(config.get("apps", {}).get("http", {}))
          for host in sorted(hosts):
              print(f"ARTHELLO_CADDY_HOST={host}")

          policies = config.get("apps", {}).get("tls", {}).get("automation", {}).get("policies", [])
          for policy in policies:
              for subject in policy.get("subjects", []):
                  print(f"ARTHELLO_TLS_SUBJECT={subject}")
          PY
          for file in /srv/arthello/ui-route-jobs/*/status; do
            test -f "$file" || continue
            printf 'ARTHELLO_ROUTE_STATUS=%s:%s\n' "$(basename "$(dirname "$file")")" "$(tr -d '\r\n' < "$file")"
          done
          printf 'ARTHELLO_DIAGNOSTICS=COMPLETE\n'
          REMOTE
          )"
          test -n "$payload"
          output_file="$RUNNER_TEMP/arthello-origin-diagnostics.log"
          for attempt in 1 2 3; do
            : > "$output_file"
            set +e
            timeout --signal=TERM --kill-after=5s 150s \
              ssh -n "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
                "printf '%s' '$payload' | base64 -d | bash" \
                </dev/null 2>&1 | tee "$output_file"
            ssh_rc=${PIPESTATUS[0]}
            set -e
            if grep -F 'ARTHELLO_DIAGNOSTICS=COMPLETE' "$output_file" >/dev/null; then
              exit 0
            fi
            printf 'ARTHELLO_DIAGNOSTIC_ATTEMPT=%s SSH_RC=%s\n' "$attempt" "$ssh_rc"
            sleep 10
          done
          exit 1
