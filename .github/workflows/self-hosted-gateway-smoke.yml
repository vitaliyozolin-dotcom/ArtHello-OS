name: Self-hosted gateway smoke

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/self-hosted-gateway-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, linux, x64, arthello-gateway]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true
          persist-credentials: false
      - name: Inspect auth bootstrap
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$RUNNER_TEMP/v44-diag" && mkdir -p "$RUNNER_TEMP/v44-diag"
          cat deploy/v44/arthello-sites-v44-source.tar.gz.part-* > "$RUNNER_TEMP/v44-source.tar.gz"
          tar -xzf "$RUNNER_TEMP/v44-source.tar.gz" -C "$RUNNER_TEMP/v44-diag"
          echo '=== AUTH GATE FULL ==='
          sed -n '1,180p' "$RUNNER_TEMP/v44-diag/app/components/ProductionAuthGate.tsx"
          echo '=== API AUTH REFERENCES ==='
          grep -R -n -B 4 -A 8 --exclude-dir=node_modules --exclude-dir=.git '/api/auth' "$RUNNER_TEMP/v44-diag" || true
          echo '=== AUTH FILES ==='
          find "$RUNNER_TEMP/v44-diag" -type f | grep -Ei '/auth|auth\.' | head -n 100 || true
          echo '=== LIVE AUTH ENDPOINTS ==='
          for p in /api/auth/session /api/auth/me /api/auth/login /api/health; do
            echo "--- $p"
            curl -sS -D - -o "$RUNNER_TEMP/auth-body" --max-time 20 "https://arthello-188-225-38-55.sslip.io$p" || true
            head -c 800 "$RUNNER_TEMP/auth-body" || true
            echo
          done
          echo '=== DIAG COMPLETE ==='
