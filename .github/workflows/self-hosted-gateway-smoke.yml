name: Self-hosted gateway smoke

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/self-hosted-gateway-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, linux, x64, arthello-gateway]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true
          persist-credentials: false
      - name: Inspect API and DB conventions
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$RUNNER_TEMP/v44-diag" && mkdir -p "$RUNNER_TEMP/v44-diag"
          cat deploy/v44/arthello-sites-v44-source.tar.gz.part-* > "$RUNNER_TEMP/v44-source.tar.gz"
          tar -xzf "$RUNNER_TEMP/v44-source.tar.gz" -C "$RUNNER_TEMP/v44-diag"
          cd "$RUNNER_TEMP/v44-diag"
          echo '=== HEALTH ROUTE ==='
          sed -n '1,220p' app/api/health/route.ts
          echo '=== REQUEST USER ==='
          sed -n '1,260p' lib/request-user.ts
          echo '=== CHATGPT AUTH ==='
          sed -n '1,260p' app/chatgpt-auth.ts
          echo '=== DB INDEX ==='
          sed -n '1,260p' db/index.ts
          echo '=== AUTH/USER SCHEMA HITS ==='
          grep -n -E -B 3 -A 12 'user|User|employee|Employee|access|Access|session|Session|password|Password' db/schema.ts | head -n 500 || true
          echo '=== PACKAGE ==='
          cat package.json
          echo '=== DIAG COMPLETE ==='
