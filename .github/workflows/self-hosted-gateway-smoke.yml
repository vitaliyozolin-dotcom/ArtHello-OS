name: Self-hosted gateway smoke

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/self-hosted-gateway-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, linux, x64, arthello-gateway]
    timeout-minutes: 10
    steps:
      - name: Inspect cached production candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          image="arthello-direct:46271f531f969bd684cfd654acd8a32ad5dec9b4"
          test -n "$(docker image inspect "$image" --format '{{.Id}}')"
          caddy=stroios-caddy-1
          network="$(docker inspect "$caddy" --format '{{range $name, $_ := .NetworkSettings.Networks}}{{println $name}}{{end}}' | head -n1)"
          name="arthello-acceptance-diag"
          docker rm -f "$name" >/dev/null 2>&1 || true
          docker volume create arthello-acceptance-diag-data >/dev/null
          docker run -d --name "$name" --read-only --tmpfs /tmp \
            --tmpfs /app/node_modules/.mf:rw,uid=1000,gid=1000,mode=0700 \
            --network "$network" -e NODE_ENV=production -e PORT=8081 \
            -e ARTHELLO_D1_PATH=/data/d1 \
            -v arthello-acceptance-diag-data:/data "$image" >/dev/null
          cleanup() { docker rm -f "$name" >/dev/null 2>&1 || true; docker volume rm arthello-acceptance-diag-data >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          sleep 3
          docker exec -i "$name" node - <<'NODE'
          const base='http://127.0.0.1:8081';
          async function show(label, url) {
            try {
              const r=await fetch(url);
              const text=await r.text();
              console.log(label, 'status='+r.status, 'type='+(r.headers.get('content-type')||''), 'len='+text.length, 'body='+text.slice(0,180).replace(/\s+/g,' '));
              return {r,text};
            } catch(e) { console.log(label,'ERROR',String(e)); return null; }
          }
          const health=await show('HEALTH',base+'/api/health');
          const root=await show('ROOT',base+'/');
          if (root) {
            const refs=[...root.text.matchAll(/(?:src|href)="(\/assets\/[^"]+)"/g)].map(m=>m[1]);
            console.log('ASSET_REFS',refs.length,[...new Set(refs)].slice(0,20));
            for (const p of [...new Set(refs)].slice(0,20)) await show('ASSET '+p,base+p);
          }
          await show('AUTH_ME',base+'/api/auth/me');
          await show('AUTH_LOGIN_GET',base+'/api/auth/login');
          NODE
          echo '=== CONTAINER LOG ==='
          docker logs "$name" --tail 120 || true
