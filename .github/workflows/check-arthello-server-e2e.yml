name: Check ArtHello server browser prerequisites

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Quality gates]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: gateway-38-55-arthello-production
  cancel-in-progress: false
  queue: max

jobs:
  prerequisites:
    if: >-
      github.repository == 'vitaliyozolin-dotcom/ArtHello-OS' &&
      github.actor == 'vitaliyozolin-dotcom' &&
      github.triggering_actor == 'vitaliyozolin-dotcom' && (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.name == 'Quality gates' &&
         github.event.workflow_run.path == '.github/workflows/quality.yml' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.repository.id == github.event.repository.id &&
         github.event.workflow_run.head_repository.id == github.event.repository.id)
      )
    runs-on: [self-hosted, linux, x64, arthello-gateway]
    environment: production-ru
    timeout-minutes: 5
    concurrency:
      group: school-1-11-production
      cancel-in-progress: false
      queue: max
    env:
      CHECKED_SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Verify current main before repository execution
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$CHECKED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          current_main="$(curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/vitaliyozolin-dotcom/ArtHello-OS/git/ref/heads/main | jq -er '.object.sha')"
          test "$current_main" = "$CHECKED_SOURCE_SHA"
          # D-056: the gateway has no system Node. Use only an existing runtime,
          # including the Node 24 bundled with this trusted Actions runner.
          precheck_node="$(command -v node || true)"
          if [[ -z "$precheck_node" ]]; then
            runner_root="$(realpath "$RUNNER_TEMP/../..")"
            precheck_node="$runner_root/externals/node24/bin/node"
          fi
          [[ -x "$precheck_node" ]] || { echo 'BLOCKED: existing Node runtime unavailable; no installation attempted'; exit 2; }
          "$precheck_node" --input-type=module -e 'if (Number(process.versions.node.split(".")[0]) < 22) process.exit(2)'
          printf 'PRECHECK_NODE=%s\n' "$precheck_node" >> "$GITHUB_ENV"

      - name: Check out exact trusted source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CHECKED_SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Verify checkout and prerequisite regression suite
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$CHECKED_SOURCE_SHA"
          "$PRECHECK_NODE" --test scripts/test/server-e2e-preflight.test.mjs
          python3 -I .github/scripts/test-d082-route-diagnostic.py

      - name: Diagnose rejected R9 route without changing gateway
        if: >-
          github.event_name == 'workflow_run' &&
          startsWith(github.event.workflow_run.head_commit.message, 'D082: read-only route diagnostic')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          current_main="$(curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/vitaliyozolin-dotcom/ArtHello-OS/git/ref/heads/main | jq -er '.object.sha')"
          test "$current_main" = "$CHECKED_SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$CHECKED_SOURCE_SHA"
          test "$(hostname -I | tr ' ' '\n' | grep -Fx '188.225.38.55' | head -n1)" = 188.225.38.55
          mapfile -t live_ids < <(docker ps --filter 'name=^/arthello-direct-' --format '{{.ID}}')
          test "${#live_ids[@]}" -eq 1
          live_id="$(docker inspect "${live_ids[0]}" --format '{{.Id}}')"
          [[ "$live_id" =~ ^[a-f0-9]{64}$ ]]
          test "$(docker inspect "$live_id" --format '{{index .Config.Labels "arthello.release.sha"}}')" = 6596f69390ad539577ec2640e8ef40c7e12c22dc
          live_name="$(docker inspect "$live_id" --format '{{.Name}}')"
          live_name="${live_name#/}"
          [[ "$live_name" =~ ^arthello-direct-[A-Za-z0-9._-]+$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ && "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          caddy_id="$(docker inspect stroios-caddy-1 --format '{{.Id}}')"
          [[ "$caddy_id" =~ ^[a-f0-9]{64}$ ]]
          test "$(docker inspect "$caddy_id" --format '{{.State.Running}}')" = true
          diagnostic_work="$(mktemp -d "$RUNNER_TEMP/arthello-route-diagnostic.XXXXXXXX")"
          cleanup() {
            rm -f -- "$diagnostic_work/routes.caddy" "$diagnostic_work/main.caddy"
            rmdir -- "$diagnostic_work"
          }
          trap cleanup EXIT
          docker cp "$caddy_id:/data/external-routes.caddy" "$diagnostic_work/routes.caddy" >/dev/null
          docker cp "$caddy_id:/etc/caddy/Caddyfile" "$diagnostic_work/main.caddy" >/dev/null
          chmod 0600 "$diagnostic_work/routes.caddy" "$diagnostic_work/main.caddy"
          set +e
          python3 -I .github/scripts/d082-route-diagnostic.py \
            --input "$diagnostic_work/routes.caddy" --main-config "$diagnostic_work/main.caddy" \
            --old-upstream "$live_name:8081" \
            --candidate-upstream "arthello-direct-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT:8081"
          result=$?
          set -e
          test "$(docker inspect stroios-caddy-1 --format '{{.Id}}')" = "$caddy_id"
          test "$(docker inspect "$live_id" --format '{{.State.Running}}')" = true
          exit "$result"

      - name: Inventory browser image and dedicated test access without logging in
        env:
          ARTHELLO_E2E_LOGIN: ${{ secrets.ARTHELLO_E2E_LOGIN }}
          ARTHELLO_E2E_PASSWORD: ${{ secrets.ARTHELLO_E2E_PASSWORD }}
          ARTHELLO_E2E_ACCOUNT_CONFIRMED: ${{ vars.ARTHELLO_E2E_ACCOUNT_CONFIRMED }}
          ARTHELLO_E2E_IMAGE_ID: ${{ vars.ARTHELLO_E2E_IMAGE_ID }}
          ARTHELLO_E2E_IMAGE_SOURCE_SHA: ${{ vars.ARTHELLO_E2E_IMAGE_SOURCE_SHA }}
        shell: bash
        run: |
          set -Eeuo pipefail
          report="$RUNNER_TEMP/arthello-browser-prerequisites-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          umask 077
          set +e
          "$PRECHECK_NODE" scripts/server-e2e-preflight.mjs | tee "$report"
          result=${PIPESTATUS[0]}
          set -e
          {
            echo '## Browser prerequisites only — live acceptance NOT RUN'
            echo 'No login, account creation, image execution, package installation or production changes were performed.'
            echo '```json'
            cat "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$result"

