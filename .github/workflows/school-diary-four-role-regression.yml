name: School diary four-role regression

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/school-diary-four-role-regression.yml
      - .github/scripts/school-four-role-regression.sh

permissions:
  contents: read
  statuses: write

concurrency:
  group: school-diary-four-role-regression
  cancel-in-progress: false

env:
  CANDIDATE_SHA: 034be78c5cb30402ebb7d3786133d0f3be390be9
  CANDIDATE_IMAGE: school-1-11-design-v1:034be78c5cb3
  CANDIDATE_IMAGE_ID: sha256:cfa869407edd53b4d54dfffef5ba12c16cd1f3e9ee2430d6975e89bfd64075b3
  SCHOOL_ORIGIN: https://school-188-225-38-55.sslip.io
  STAGING_ORIGIN: http://127.0.0.1:3211

jobs:
  regress:
    runs-on: [self-hosted, linux, x64, arthello-gateway]
    timeout-minutes: 30
    environment: production-ru
    steps:
      - name: Check out regression controls
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Configure confirmed School SSH host
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ARTHELLO_RU_SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.ARTHELLO_RU_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ARTHELLO_RU_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.ARTHELLO_RU_DEPLOY_PORT }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          ssh_dir="$RUNNER_TEMP/school-four-role-ssh-$GITHUB_RUN_ID"
          ssh_key="$ssh_dir/id_ed25519"
          known_hosts="$ssh_dir/known_hosts"
          install -m 0700 -d "$ssh_dir"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_key"
          chmod 0600 "$ssh_key"
          test -s "$ssh_key"
          ssh-keygen -y -f "$ssh_key" >/dev/null

          deploy_port="${DEPLOY_PORT:-2222}"
          scanned_hosts="$ssh_dir/known_hosts.scan"
          : > "$scanned_hosts"
          chmod 0600 "$scanned_hosts"
          for attempt in 1 2; do
            printf 'SCHOOL_SSH_HOST_PROBE_ATTEMPT=%s\n' "$attempt"
            timeout --signal=TERM --kill-after=5s 150s \
              ssh -p "$deploy_port" \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile="$scanned_hosts" \
              -o GlobalKnownHostsFile=/dev/null \
              -o PreferredAuthentications=none \
              -o PubkeyAuthentication=no \
              -o PasswordAuthentication=no \
              -o KbdInteractiveAuthentication=no \
              -o ConnectTimeout=140 \
              -o HostKeyAlgorithms=ssh-ed25519 \
              "$DEPLOY_USER@$DEPLOY_HOST" true </dev/null >/dev/null 2>&1 || true
            test -s "$scanned_hosts" && break
            sleep 5
          done
          test -s "$scanned_hosts"
          actual_fingerprint="$(ssh-keygen -lf "$scanned_hosts" -E sha256 | awk '{print $2; exit}')"
          test "$actual_fingerprint" = 'SHA256:/kBNohTF+5g8U+jQt+PzOCoWZ9yCSFjBnEP3Oc3MwRI'
          mv "$scanned_hosts" "$known_hosts"
          printf 'SCHOOL_FOUR_ROLE_SSH=VERIFIED\n'

      - name: Run four-role regression on ephemeral data clone
        id: regress
        env:
          DEPLOY_HOST: ${{ secrets.ARTHELLO_RU_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ARTHELLO_RU_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.ARTHELLO_RU_DEPLOY_PORT }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          ssh_dir="$RUNNER_TEMP/school-four-role-ssh-$GITHUB_RUN_ID"
          ssh_key="$ssh_dir/id_ed25519"
          known_hosts="$ssh_dir/known_hosts"
          test -s "$ssh_key"
          test -s "$known_hosts"
          deploy_port="${DEPLOY_PORT:-2222}"
          ssh_args=(
            -p "$deploy_port"
            -i "$ssh_key"
            -o IdentitiesOnly=yes
            -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no
            -o KbdInteractiveAuthentication=no
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$known_hosts"
            -o GlobalKnownHostsFile=/dev/null
            -o ConnectTimeout=140
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=12
            -o IPQoS=none
            -o Compression=no
            -o KexAlgorithms=curve25519-sha256
            -o HostKeyAlgorithms=ssh-ed25519
            -o PubkeyAcceptedAlgorithms=ssh-ed25519
            -o Ciphers=aes128-ctr
            -o MACs=hmac-sha2-256
          )
          log_file="$RUNNER_TEMP/school-four-role-regression.log"
          timeout --signal=TERM --kill-after=15s 900s \
            ssh -T "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
              "env RUN_ID='$GITHUB_RUN_ID' CANDIDATE_SHA='$CANDIDATE_SHA' CANDIDATE_IMAGE='$CANDIDATE_IMAGE' CANDIDATE_IMAGE_ID='$CANDIDATE_IMAGE_ID' SCHOOL_ORIGIN='$SCHOOL_ORIGIN' STAGING_ORIGIN='$STAGING_ORIGIN' bash -s" \
              < .github/scripts/school-four-role-regression.sh | tee "$log_file"

          expect_marker() {
            local key="$1"
            local expected="$2"
            local actual

            actual="$(
              awk -v key="$key" '
                index($0, key "=") == 1 {
                  count += 1
                  value = substr($0, length(key) + 2)
                }
                END {
                  if (count != 1) exit 1
                  print value
                }
              ' "$log_file"
            )"
            test "$actual" = "$expected"
          }

          expect_marker SCHOOL_FOUR_ROLE_REGRESSION OK
          expect_marker SCHOOL_FOUR_ROLE_CANDIDATE_IMAGE_ID "$CANDIDATE_IMAGE_ID"
          expect_marker SCHOOL_FOUR_ROLE_IMAGE_PIN IMMUTABLE
          for role in DIRECTOR TEACHER PARENT STUDENT; do
            expect_marker "SCHOOL_ROLE_${role}" OK
          done
          expect_marker SCHOOL_FOUR_ROLE_AUTH OK
          expect_marker SCHOOL_FOUR_ROLE_SCOPE OK
          expect_marker SCHOOL_FOUR_ROLE_PERMISSIONS OK
          expect_marker SCHOOL_FOUR_ROLE_LOGOUT OK
          expect_marker SCHOOL_FOUR_ROLE_NETWORK isolated
          expect_marker SCHOOL_FOUR_ROLE_CLEANUP OK
          expect_marker SCHOOL_FOUR_ROLE_STAGING_FINGERPRINT UNCHANGED\n          expect_marker SCHOOL_FOUR_ROLE_STAGING_CHANGED no
          expect_marker SCHOOL_FOUR_ROLE_PRODUCTION_RESTARTED no
          expect_marker SCHOOL_FOUR_ROLE_PRODUCTION_HEALTH OK
          printf 'result=OK\n' >> "$GITHUB_OUTPUT"

      - name: Enforce run-scoped regression cleanup
        id: cleanup
        if: always()
        env:
          DEPLOY_HOST: ${{ secrets.ARTHELLO_RU_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ARTHELLO_RU_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.ARTHELLO_RU_DEPLOY_PORT }}
        shell: bash
        run: |
          set -Eeuo pipefail

          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$CANDIDATE_IMAGE_ID" =~ ^sha256:[a-f0-9]{64}$ ]]

          ssh_dir="$RUNNER_TEMP/school-four-role-ssh-$GITHUB_RUN_ID"
          ssh_key="$ssh_dir/id_ed25519"
          known_hosts="$ssh_dir/known_hosts"
          test -s "$ssh_key"
          test -s "$known_hosts"
          deploy_port="${DEPLOY_PORT:-2222}"
          ssh_args=(
            -p "$deploy_port"
            -i "$ssh_key"
            -o IdentitiesOnly=yes
            -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no
            -o KbdInteractiveAuthentication=no
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$known_hosts"
            -o GlobalKnownHostsFile=/dev/null
            -o ConnectTimeout=140
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=12
            -o IPQoS=none
            -o Compression=no
            -o KexAlgorithms=curve25519-sha256
            -o HostKeyAlgorithms=ssh-ed25519
            -o PubkeyAcceptedAlgorithms=ssh-ed25519
            -o Ciphers=aes128-ctr
            -o MACs=hmac-sha2-256
          )

          timeout --signal=TERM --kill-after=10s 240s \
            ssh -T "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
              "env RUN_ID='$GITHUB_RUN_ID' CANDIDATE_SHA='$CANDIDATE_SHA' CANDIDATE_IMAGE_ID='$CANDIDATE_IMAGE_ID' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          regression="school-1-11-role-regression-$RUN_ID"
          regression_data="school-1-11_role_regression_${RUN_ID}_data"
          isolation_ok=1

          case "$regression:$regression_data" in
            school-1-11-role-regression-*:school-1-11_role_regression_*_data) ;;
            *) exit 1 ;;
          esac

          container_id="$(docker ps -aq --filter "name=^/$regression$")"
          if [ -n "$container_id" ]; then
            test "$(docker inspect "$regression" --format '{{.Image}}')" \
              = "$CANDIDATE_IMAGE_ID"
            run_marker_count="$(
              docker inspect "$regression" \
                --format '{{range .Config.Env}}{{println .}}{{end}}' |
              awk -v expected="REGRESSION_RUN_ID=$RUN_ID" \
                '$0 == expected { count++ } END { print count + 0 }'
            )"
            test "$run_marker_count" -eq 1
            network_mode="$(
              docker inspect "$regression" --format '{{.HostConfig.NetworkMode}}'
            )"
            [ "$network_mode" = none ] || isolation_ok=0
            docker rm -f "$regression" >/dev/null
          fi

          if docker volume inspect "$regression_data" >/dev/null 2>&1; then
            test "$(docker volume inspect "$regression_data" \
              --format '{{index .Labels "school.system"}}')" = school-1-11
            test "$(docker volume inspect "$regression_data" \
              --format '{{index .Labels "school.environment"}}')" \
              = ephemeral-regression
            test "$(docker volume inspect "$regression_data" \
              --format '{{index .Labels "school.purpose"}}')" \
              = four-role-regression
            test "$(docker volume inspect "$regression_data" \
              --format '{{index .Labels "school.candidate-sha"}}')" \
              = "$CANDIDATE_SHA"
            docker volume rm "$regression_data" >/dev/null
          fi

          test -z "$(docker ps -aq --filter "name=^/$regression$")"
          if docker volume inspect "$regression_data" >/dev/null 2>&1; then
            exit 1
          fi
          test "$isolation_ok" -eq 1
          printf 'SCHOOL_FOUR_ROLE_WORKFLOW_CLEANUP=OK\n'
          REMOTE

          printf 'result=OK\n' >> "$GITHUB_OUTPUT"

      - name: Remove run-scoped SSH material
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          ssh_dir="$RUNNER_TEMP/school-four-role-ssh-$GITHUB_RUN_ID"
          case "$ssh_dir" in
            "$RUNNER_TEMP"/school-four-role-ssh-*) ;;
            *) exit 1 ;;
          esac
          if [ -d "$ssh_dir" ]; then
            rm -f -- \
              "$ssh_dir/id_ed25519" \
              "$ssh_dir/known_hosts" \
              "$ssh_dir/known_hosts.scan"
            rmdir -- "$ssh_dir"
          fi

      - name: Publish four-role result
        if: always()
        shell: bash
        env:
          REGRESSION_RESULT: ${{ steps.regress.outputs.result }}
          CLEANUP_RESULT: ${{ steps.cleanup.outputs.result }}
        run: |
          {
            echo '## School diary four-role regression'
            echo
            printf -- '- Candidate: %s\n' "$CANDIDATE_SHA"
            printf -- '- Immutable image ID: %s\n' "$CANDIDATE_IMAGE_ID"
            printf -- '- Director: login, scope, UI, permissions, logout\n'
            printf -- '- Teacher: login, scope, UI, permissions, logout\n'
            printf -- '- Parent: login, child scope, UI, permissions, logout\n'
            printf -- '- Student: login, self scope, UI, permissions, logout\n'
            printf -- '- Run-scoped cleanup: %s\n' "${CLEANUP_RESULT:-failed}"
            if [ "${REGRESSION_RESULT:-}" = OK ]; then
              printf -- '- Staging changed: no (verified)\n'
              printf -- '- Production UI/data/restart changed: no (verified)\n'
            else
              printf -- '- Staging/production invariants: not proven\n'
            fi
            printf -- '- Result: %s\n' "${REGRESSION_RESULT:-failed}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report four-role regression as commit status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          CANDIDATE_SHA: ${{ env.CANDIDATE_SHA }}
        with:
          script: |
            const state =
              process.env.JOB_STATUS === "success" ? "success" : "failure";
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: process.env.CANDIDATE_SHA,
              state,
              context: "school-diary/four-role-regression",
              description: "Four-role regression " + process.env.JOB_STATUS,
              target_url:
                process.env.GITHUB_SERVER_URL +
                "/" +
                process.env.GITHUB_REPOSITORY +
                "/actions/runs/" +
                process.env.GITHUB_RUN_ID,
            });
