name: School diary auth run reporter

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/school-diary-auth-run-reporter.yml

permissions:
  actions: read
  contents: read
  statuses: write

concurrency:
  group: school-diary-auth-run-reporter
  cancel-in-progress: false

jobs:
  report:
    runs-on: [self-hosted, linux, x64, arthello-gateway]
    timeout-minutes: 35
    steps:
      - name: Report exact auth staging run as commit status
        uses: actions/github-script@v7
        with:
          script: |
            const targetSha = "b80c103c786861f5761e26d95c920e8b1567d720";
            const workflowId = "school-diary-auth-candidate.yml";
            const { owner, repo } = context.repo;
            const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            let run;
            for (let attempt = 1; attempt <= 20; attempt += 1) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflowId,
                branch: "main",
                event: "push",
                per_page: 20,
              });
              run = response.data.workflow_runs.find(
                (item) => item.head_sha === targetSha,
              );
              if (run) break;
              core.info("Waiting for the exact auth staging run to appear");
              await wait(15000);
            }
            if (!run) throw new Error("Exact auth staging run was not found");

            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: targetSha,
              state: "pending",
              context: "school-diary/auth-staging",
              description: "Exact reviewed auth candidate is being validated",
              target_url: run.html_url,
            });

            for (let attempt = 1; attempt <= 100; attempt += 1) {
              const response = await github.rest.actions.getWorkflowRun({
                owner,
                repo,
                run_id: run.id,
              });
              run = response.data;
              if (run.status === "completed") break;
              core.info("Waiting for auth staging run " + run.id);
              await wait(15000);
            }
            if (run.status !== "completed")
              throw new Error("Auth staging run did not complete before reporter timeout");

            const state = run.conclusion === "success" ? "success" : "failure";
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: targetSha,
              state,
              context: "school-diary/auth-staging",
              description: "Auth staging run " + run.conclusion,
              target_url: run.html_url,
            });
            core.info(
              "SCHOOL_AUTH_RUN_REPORTED=" +
                run.id +
                " conclusion=" +
                run.conclusion,
            );
