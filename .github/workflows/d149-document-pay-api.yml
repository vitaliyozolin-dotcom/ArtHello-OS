name: D149 seal ArtHello Pay contract inventory

on:
  push:
    branches:
      - codex/arthello-pay-web-d149-20260911

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Install exact workspace
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm install --frozen-lockfile
      - name: Refresh server-only contract inventory
        run: |
          pnpm run typecheck:libs
          node --import ./artifacts/api-server/node_modules/tsx/dist/loader.mjs scripts/contract-drift.mjs --refresh-inventory
          node --import ./artifacts/api-server/node_modules/tsx/dist/loader.mjs scripts/contract-drift.mjs
      - name: Commit inventory once and retire workflow
        run: |
          git config user.name "arthello-pay-bot"
          git config user.email "arthello-pay-bot@users.noreply.github.com"
          git rm .github/workflows/d149-document-pay-api.yml
          git add -A quality-gates/contract-server-only.json .github/workflows
          git commit -m "D149: register ArtHello Pay server contract"
          git push origin HEAD:${GITHUB_REF_NAME}
