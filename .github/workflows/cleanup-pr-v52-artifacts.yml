name: Cleanup non-production v52 artifacts

on:
  push:
    branches:
      - ops/cleanup-pr-v52-artifacts-20260904

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete only non-main v52 verification artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts"
          ids="$(mktemp)"
          trap 'rm -f "$ids"' EXIT
          : > "$ids"

          page=1
          while :; do
            response="$(curl --fail-with-body --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api}?per_page=100&page=${page}")"
            count="$(jq '.artifacts | length' <<<"$response")"
            test "$count" -ge 0
            if [ "$count" -eq 0 ]; then
              break
            fi

            jq -r '.artifacts[]
              | select(.expired == false)
              | select(.name | startswith("arthello-v52-verification-"))
              | select(.workflow_run.head_branch != "main")
              | [.id, .size_in_bytes, .name, (.workflow_run.head_branch // "unknown")]
              | @tsv' <<<"$response" >> "$ids"
            page=$((page + 1))
          done

          deleted=0
          bytes=0
          while IFS=$'\t' read -r id size name branch; do
            [ -n "${id:-}" ] || continue
            curl --fail-with-body --silent --show-error \
              -X DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api}/${id}"
            deleted=$((deleted + 1))
            bytes=$((bytes + size))
            printf 'Deleted non-production artifact id=%s branch=%s size=%s name=%s\n' "$id" "$branch" "$size" "$name"
          done < "$ids"

          printf 'ARTHELLO_ARTIFACT_CLEANUP=VERIFIED deleted=%s bytes=%s\n' "$deleted" "$bytes"
