name: D060 repin release controller

on:
  push:
    branches: [codex/d060-tochka-account-fallback-20260903]

permissions:
  contents: write

concurrency:
  group: d060-release-controller-repin
  cancel-in-progress: true

jobs:
  repin:
    if: github.repository == 'vitaliyozolin-dotcom/ArtHello-OS' && github.actor == 'vitaliyozolin-dotcom'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out D-060 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/d060-tochka-account-fallback-20260903
          fetch-depth: 0
          persist-credentials: true

      - name: Repin guarded production controller
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          branch = "codex/d060-tochka-account-fallback-20260903"
          previous = "78886d8a1610d734681244c4e89359fadf7692cc"

          def replace_required(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count < 1:
                  raise SystemExit(f"missing D-060 repin target: {label}: {old!r}")
              return text.replace(old, new)

          deploy_path = Path(".github/workflows/deploy-arthello-direct-38-55.yml")
          deploy = deploy_path.read_text()
          deploy = replace_required(deploy, "D-059", "D-060", "deploy decision")
          deploy = replace_required(deploy, "codex/d059-tochka-binding-redirect-20260903", branch, "deploy branch")
          deploy = replace_required(deploy, "EXPECTED_RELEASE_PR: '328'", "EXPECTED_RELEASE_PR: '329'", "deploy PR env")
          deploy = replace_required(deploy, "number == fromJSON('328')", "number == fromJSON('329')", "deploy PR condition")
          deploy = replace_required(deploy, "7e926f4c29aa7e3c3208a55451db035714861e28", previous, "deploy previous parent")
          deploy_path.write_text(deploy)

          verify_path = Path(".github/workflows/verify-arthello-v52.yml")
          verify = verify_path.read_text()
          verify = replace_required(verify, "D-059", "D-060", "verify decision")
          verify = replace_required(verify, "codex/d059-tochka-binding-redirect-20260903", branch, "verify branch")
          verify = replace_required(verify, '"328"', '"329"', "verify quoted PR")
          verify = replace_required(verify, "'328'", "'329'", "verify single-quoted PR")
          verify = replace_required(verify, "7e926f4c29aa7e3c3208a55451db035714861e28", previous, "verify previous parent")
          verify_path.write_text(verify)
          PY

          git diff --check
          git diff -- .github/workflows/deploy-arthello-direct-38-55.yml .github/workflows/verify-arthello-v52.yml

      - name: Commit repinned controller
        run: |
          set -Eeuo pipefail
          test -n "$(git status --porcelain -- .github/workflows/deploy-arthello-direct-38-55.yml .github/workflows/verify-arthello-v52.yml)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/deploy-arthello-direct-38-55.yml .github/workflows/verify-arthello-v52.yml
          git commit -m "D-060: pin production controller to PR #329"
          git push origin HEAD:codex/d060-tochka-account-fallback-20260903
