name: D149 sync and split payment route

on:
  push:
    branches:
      - codex/arthello-pay-web-d149-20260911
    paths:
      - .github/workflows/d149-sync-split.yml

permissions:
  contents: write

jobs:
  sync-split:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/arthello-pay-web-d149-20260911
          fetch-depth: 0
          persist-credentials: true

      - name: Sync D148 and split route implementation
        run: |
          set -Eeuo pipefail
          git config user.name "arthello-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch --force --no-tags origin \
            '+refs/heads/codex/arthello-pay-d148-20260911:refs/remotes/origin/codex/arthello-pay-d148-20260911'

          git merge --no-ff --no-edit origin/codex/arthello-pay-d148-20260911

          python3 - <<'PY'
          from pathlib import Path

          source = Path('artifacts/api-server/src/routes/payments.ts')
          feature = Path('artifacts/api-server/src/features/payments/router.ts')
          text = source.read_text(encoding='utf-8')
          if len(text.splitlines()) <= 1000:
              raise SystemExit('payments.ts no longer requires split')
          moved = text.replace('from "../lib/', 'from "../../lib/')
          feature.parent.mkdir(parents=True, exist_ok=True)
          feature.write_text(moved, encoding='utf-8')
          source.write_text('export { paymentsRouter } from "../features/payments/router.js";\n', encoding='utf-8')
          PY

          rm .github/workflows/d149-sync-split.yml
          git add -A
          git commit -m "D149: split ArtHello Pay route implementation"
          git push origin HEAD:codex/arthello-pay-web-d149-20260911
