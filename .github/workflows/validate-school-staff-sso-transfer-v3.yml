name: Validate School staff SSO transfer v3

on:
  push:
    branches:
      - ops/fix-school-staff-sso-transfer-v3-20260831
    paths:
      - .github/workflows/validate-school-staff-sso-transfer-v3.yml
      - .github/scripts/school-staff-sso-production-cutover-v3.sh.gz.b64.part-*
      - .github/scripts/school-staff-sso-workflow-controller-v3.sh.gz.b64
      - .github/workflows/deploy-school-staff-sso-production-v3-20260831.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and verify exact scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf -- "$work"' EXIT

          mapfile -t parts < <(printf '%s\n' .github/scripts/school-staff-sso-production-cutover-v3.sh.gz.b64.part-* | sort)
          test "${#parts[@]}" -eq 10
          cat "${parts[@]}" | tr -d '\r\n\t ' | base64 -d | gzip -d > "$work/cutover.sh"
          base64 -d .github/scripts/school-staff-sso-workflow-controller-v3.sh.gz.b64 | gzip -d > "$work/controller.sh"

          printf '%s  %s\n' '6c8d945addce8644a0bcfbfaff555463042c6b2bbb46d09df06f52820fa93b25' "$work/cutover.sh" | sha256sum -c -
          printf '%s  %s\n' 'c164a3a935efdd305b56af3c35f2efd17c63cb7ea885485e80bb23b1fd6c303b' "$work/controller.sh" | sha256sum -c -
          bash -n "$work/cutover.sh"
          bash -n "$work/controller.sh"
          grep -F '/tmp/school-staff-sso-release.$RUN_ID' "$work/cutover.sh" >/dev/null
          ! grep -F '/srv/school-1-11/releases/' "$work/cutover.sh" >/dev/null
          grep -F 'school-staff-sso-production-cutover-v3.sh.gz.b64.part-*' "$work/controller.sh" >/dev/null
          printf 'SCHOOL_STAFF_SSO_TRANSFER_V3=PASS\n'
