name: Build closed RU release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Package legacy release or install a verified Alfa component
        required: true
        default: package
        type: choice
        options: [package, alfa-central, alfa-atlas, alfa-school, alfa-audit]
      ref:
        description: Immutable application commit SHA to package
        required: true
        type: string
      confirmation:
        description: For installation type DEPLOY ALFA UPDATE TO PRODUCTION
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: arthello-production-ru
  cancel-in-progress: false

jobs:
  verify-build:
    if: inputs.operation == 'package' || inputs.operation == ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: arthello_test
          POSTGRES_USER: arthello_test
          POSTGRES_PASSWORD: sandbox-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U arthello_test -d arthello_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://arthello_test:sandbox-only-password@127.0.0.1:5432/arthello_test
      TEST_DATABASE_URL: postgresql://arthello_test:sandbox-only-password@127.0.0.1:5432/arthello_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Verify immutable application source
        env:
          RELEASE_REF: ${{ inputs.ref }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_REF"
          test "$(printf %s "$RELEASE_REF" | wc -c)" -eq 40
          printf %s "$RELEASE_REF" | grep -Eq '^[0-9a-f]{40}$'
          git fetch --force --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main'
          git merge-base --is-ancestor "$RELEASE_REF" refs/remotes/origin/main

      - name: Checkout release infrastructure
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-infrastructure
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: corepack enable
      - run: corepack prepare pnpm@11.7.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:full
      - run: pnpm run test:postgres
      - run: pnpm run build:full

      - name: Build immutable runtime images
        env:
          RELEASE_REF: ${{ inputs.ref }}
        run: |
          set -Eeuo pipefail
          # pnpm test/build steps create workspace node_modules before the
          # image build. Never send those host artifacts into Docker: pnpm
          # must install a clean dependency tree inside the image.
          cat > .dockerignore <<'EOF'
          .git
          .github
          .release-infrastructure
          node_modules
          **/node_modules
          coverage
          **/coverage
          EOF
          docker build \
            --file .release-infrastructure/deploy/Dockerfile \
            --target api \
            --label "org.opencontainers.image.revision=$RELEASE_REF" \
            --tag "arthello-os-api:$RELEASE_REF" \
            .
          docker build \
            --file .release-infrastructure/deploy/Dockerfile \
            --target web \
            --label "org.opencontainers.image.revision=$RELEASE_REF" \
            --tag "arthello-os-web:$RELEASE_REF" \
            .
          docker pull postgres:16-alpine
          docker image tag "arthello-os-api:$RELEASE_REF" arthello-os-api:local
          docker image tag "arthello-os-web:$RELEASE_REF" arthello-os-web:local

      - name: Package closed release assets
        env:
          RELEASE_REF: ${{ inputs.ref }}
        run: |
          set -Eeuo pipefail
          bundle="arthello-ru-images-$RELEASE_REF.tar.gz"
          manifest="arthello-ru-images-$RELEASE_REF.manifest"
          checksums="arthello-ru-images-$RELEASE_REF.sha256"
          mkdir -p /tmp/arthello-release

          docker image save \
            "arthello-os-api:$RELEASE_REF" arthello-os-api:local \
            "arthello-os-web:$RELEASE_REF" arthello-os-web:local \
            postgres:16-alpine \
            | gzip -1 > "/tmp/arthello-release/$bundle"

          {
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'source_sha=%s\n' "$RELEASE_REF"
            printf 'source_tree=%s\n' "$(git rev-parse HEAD^{tree})"
            printf 'workflow_run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'workflow_run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'api_image_id=%s\n' "$(docker image inspect --format '{{.Id}}' "arthello-os-api:$RELEASE_REF")"
            printf 'web_image_id=%s\n' "$(docker image inspect --format '{{.Id}}' "arthello-os-web:$RELEASE_REF")"
            printf 'postgres_image_id=%s\n' "$(docker image inspect --format '{{.Id}}' postgres:16-alpine)"
            printf 'real_data=not_loaded\n'
            printf 'integrations=disabled\n'
            printf 'first_owner=not_created\n'
            printf 'dns=not_changed\n'
          } > "/tmp/arthello-release/$manifest"

          (
            cd /tmp/arthello-release
            sha256sum "$bundle" "$manifest" > "$checksums"
            sha256sum --check "$checksums"
          )

      - uses: actions/upload-artifact@v4
        with:
          name: arthello-ru-images-${{ inputs.ref }}
          path: /tmp/arthello-release/
          if-no-files-found: error
          retention-days: 7

  publish-private-release:
    needs: verify-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: release-infrastructure

      - uses: actions/download-artifact@v4
        with:
          name: arthello-ru-images-${{ inputs.ref }}
          path: /tmp/arthello-release

      - name: Add and verify deployment infrastructure
        env:
          RELEASE_REF: ${{ inputs.ref }}
        run: |
          set -Eeuo pipefail
          cd /tmp/arthello-release
          script="arthello-ru-pull-release-$RELEASE_REF.sh"
          cp "$GITHUB_WORKSPACE/release-infrastructure/deploy/pull-release.sh" "$script"
          chmod 0755 "$script"
          printf 'infrastructure_sha=%s\n' "$GITHUB_SHA" >> "arthello-ru-images-$RELEASE_REF.manifest"
          sha256sum \
            "arthello-ru-images-$RELEASE_REF.tar.gz" \
            "arthello-ru-images-$RELEASE_REF.manifest" \
            "$script" \
            > "arthello-ru-images-$RELEASE_REF.sha256"
          sha256sum --check "arthello-ru-images-$RELEASE_REF.sha256"
          bash -n "$script"
          grep -Fx "source_sha=$RELEASE_REF" "arthello-ru-images-$RELEASE_REF.manifest"
          grep -Fx "infrastructure_sha=$GITHUB_SHA" "arthello-ru-images-$RELEASE_REF.manifest"
          test "$(printf %s "$RELEASE_REF" | wc -c)" -eq 40
          printf %s "$RELEASE_REF" | grep -Eq '^[0-9a-f]{40}$'

      - name: Publish immutable private release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ inputs.ref }}
        run: |
          set -Eeuo pipefail
          tag="arthello-ru-$RELEASE_REF"
          cd /tmp/arthello-release

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite immutable assets." >&2
            exit 1
          fi

          cat > release-notes.md <<EOF
          Closed ArtHello OS RU runtime images.

          - application source: \`$RELEASE_REF\`
          - real data: not loaded
          - integrations: disabled
          - first owner: not created
          - DNS: not changed
          EOF

          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_REF" \
            --title "ArtHello OS RU $RELEASE_REF" \
            --notes-file release-notes.md \
            --prerelease \
            "arthello-ru-images-$RELEASE_REF.tar.gz" \
            "arthello-ru-images-$RELEASE_REF.manifest" \
            "arthello-ru-images-$RELEASE_REF.sha256" \
            "arthello-ru-pull-release-$RELEASE_REF.sh"

  install-alfa:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' && github.sha == inputs.ref &&
      github.repository == 'vitaliyozolin-dotcom/ArtHello-OS' &&
      github.actor == 'vitaliyozolin-dotcom' && github.triggering_actor == 'vitaliyozolin-dotcom' &&
      github.run_attempt == 1 &&
      (inputs.operation == 'alfa-central' || inputs.operation == 'alfa-atlas') &&
      inputs.confirmation == 'DEPLOY ALFA UPDATE TO PRODUCTION'
    runs-on: [self-hosted, linux, x64, arthello-gateway]
    environment: production-ru
    permissions:
      contents: read
      actions: read
    concurrency:
      group: gateway-38-55-arthello-production
      cancel-in-progress: false
      queue: max
    timeout-minutes: 45
    env:
      RELEASE_SHA: ${{ inputs.ref }}
      RELEASE_SYSTEM: ${{ inputs.operation == 'alfa-central' && 'central' || 'atlas' }}
      CUTOVER_CONFIRMATION: ${{ inputs.confirmation }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify current main before checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          current="$(curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/vitaliyozolin-dotcom/ArtHello-OS/git/ref/heads/main | jq -er '.object.sha')"
          test "$current" = "$RELEASE_SHA"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref }}
          path: alfa-release-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify controller and install exact artifact with retained data
        working-directory: alfa-release-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -I -B deploy/test_alfa_release.py
          python3 -I -B deploy/test_alfa_artifact.py
          python3 -I -B deploy/alfa_release.py

  install-school:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' && github.sha == inputs.ref &&
      github.repository == 'vitaliyozolin-dotcom/ArtHello-OS' &&
      github.actor == 'vitaliyozolin-dotcom' && github.triggering_actor == 'vitaliyozolin-dotcom' &&
      github.run_attempt == 1 &&
      inputs.operation == 'alfa-school' &&
      inputs.confirmation == 'DEPLOY ALFA UPDATE TO PRODUCTION'
    runs-on: [self-hosted, linux, x64, arthello-gateway]
    environment: production-ru
    permissions:
      contents: read
      actions: read
    concurrency:
      group: gateway-38-55-arthello-production
      cancel-in-progress: false
      queue: max
    timeout-minutes: 45
    env:
      RELEASE_SHA: ${{ inputs.ref }}
      RELEASE_SYSTEM: school
      CUTOVER_CONFIRMATION: ${{ inputs.confirmation }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify current main before checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          current="$(curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/vitaliyozolin-dotcom/ArtHello-OS/git/ref/heads/main | jq -er '.object.sha')"
          test "$current" = "$RELEASE_SHA"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref }}
          path: alfa-release-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify controller and install exact artifact with retained data
        working-directory: alfa-release-${{ github.run_id }}-${{ github.run_attempt }}
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ARTHELLO_RU_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ARTHELLO_RU_SSH_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.ARTHELLO_RU_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ARTHELLO_RU_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.ARTHELLO_RU_DEPLOY_PORT }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -I -B deploy/test_alfa_release.py
          python3 -I -B deploy/test_alfa_artifact.py
          python3 -I -B deploy/test_alfa_audit.py
          python3 -I -B deploy/test_school_release.py
          python3 -I -B deploy/school_release.py

  audit-alfa:
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      github.sha == inputs.ref && github.repository == 'vitaliyozolin-dotcom/ArtHello-OS' &&
      github.actor == 'vitaliyozolin-dotcom' && github.triggering_actor == 'vitaliyozolin-dotcom' &&
      github.run_attempt == 1 && inputs.operation == 'alfa-audit' &&
      inputs.confirmation == 'AUDIT ALFA WITHOUT APPLY'
    runs-on: [self-hosted, linux, x64, arthello-gateway]
    environment: production-ru
    permissions:
      contents: read
      actions: read
    concurrency:
      group: gateway-38-55-arthello-production
      cancel-in-progress: false
      queue: max
    timeout-minutes: 25
    env:
      RELEASE_SHA: ${{ inputs.ref }}
      ALFA_AUDIT_CONFIRMATION: ${{ inputs.confirmation }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref }}
          path: alfa-audit-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
          fetch-depth: 1
      - name: Read Alfa source, OS preview and both diary boundaries
        working-directory: alfa-audit-${{ github.run_id }}-${{ github.run_attempt }}
        env:
          ARTHELLO_OWNER_LOGIN: ${{ secrets.ARTHELLO_FINANCE_IMPORT_LOGIN }}
          ARTHELLO_OWNER_PASSWORD: ${{ secrets.ARTHELLO_FINANCE_IMPORT_PASSWORD }}
          SSH_PRIVATE_KEY: ${{ secrets.ARTHELLO_RU_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ARTHELLO_RU_SSH_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.ARTHELLO_RU_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ARTHELLO_RU_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.ARTHELLO_RU_DEPLOY_PORT }}
        run: python3 -I -B deploy/alfa_audit.py
