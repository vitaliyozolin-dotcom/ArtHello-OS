        steps\")\n  build_index = verify_steps.index { |step| step[\"id\"] == \"image\" }\n  raise \"immutable image\
        \ build step is missing\" unless build_index\n  restore_index = verify_steps.index { |step| step[\"name\"\
        ] == \"Restore exact source immediately before build\" }\n  raise \"fresh exact checkout must immediately\
        \ precede the pristine build gate\" unless restore_index && restore_index + 2 == build_index\n  restore\
        \ = verify_steps.fetch(restore_index)\n  raise \"pre-build checkout action is not pinned\" unless restore.fetch(\"\
        uses\") == \"actions/checkout@11d5960a326750d5838078e36cf38b85af677262\"\n  restore_with = restore.fetch(\"\
