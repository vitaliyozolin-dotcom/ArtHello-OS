          --header 'Accept: application/vnd.github+json' \
          --header 'X-GitHub-Api-Version: 2022-11-28' \
          "https://api.github.com/repos/vitaliyozolin-dotcom/ArtHello-OS/git/commits/$EXPECTED_SOURCE_SHA" \
          | jq -er '.tree.sha')"
        test "$candidate_tree" = "$EXPECTED_SOURCE_TREE"
        printf 'ARTHELLO_ISOLATED_CANDIDATE_BOUNDARY=VERIFIED sha=%s tree=%s\n' "$EXPECTED_SOURCE_SHA" "$EXPECTED_SOURCE_TREE"
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ inputs.source_sha }}
        fetch-depth: 0
        clean: true
        persist-credentials: false
    - name: Verify exact source head
      env:
        EXPECTED_HEAD_SHA: ${{ inputs.source_sha }}
      run: |
        actual_head="$(git rev-parse HEAD)"
        test "$actual_head" = "$EXPECTED_HEAD_SHA"
    - name: Validate production pull-deployment script
      run: bash -n deploy/pull-release.sh
    - name: Validate offline API runtime contract
      run: |
        set -Eeuo pipefail
        bash -n deploy/activate-git-transport.sh
        sh -n deploy/api-entrypoint.sh
        grep -F 'db_workspace=/app/lib/db' deploy/api-entrypoint.sh
        grep -F 'cd "$db_workspace"' deploy/api-entrypoint.sh
        grep -F '"$drizzle_bin" migrate --config ./drizzle.config.ts' deploy/api-entrypoint.sh
        grep -F 'ARTHELLO_API_STARTUP_ERROR=alfacrm_domain_missing_with_credentials' deploy/api-entrypoint.sh
        grep -F 'export ALFACRM_DOMAIN=disabled.invalid' deploy/api-entrypoint.sh
        if grep -Eq '(^|[[:space:]])pnpm([[:space:]]|$)|corepack|registry\.npmjs\.org' \
          deploy/api-entrypoint.sh; then
          echo 'Production API entrypoint must not invoke a package manager or registry.' >&2
          exit 1
        fi
        api_stage="$(awk '
          /^FROM .* AS api$/ { in_api=1 }
          /^FROM .* AS web$/ { in_api=0 }
          in_api { print }
        ' deploy/Dockerfile)"
        if grep -Eq 'corepack|pnpm|registry\.npmjs\.org' <<<"$api_stage"; then
          echo 'Final API image stage must remain package-manager-free.' >&2
          exit 1
        fi
        grep -F 'test -x /app/lib/db/node_modules/.bin/drizzle-kit' \
          deploy/Dockerfile
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - run: corepack enable
    - run: corepack prepare pnpm@11.7.0 --activate
    - run: pnpm install --frozen-lockfile
    - run: pnpm run test:full
    - run: pnpm run test:postgres
    - run: pnpm run build:full
    - name: Build immutable provenance evidence
      run: |
        mkdir -p ci-provenance
        head_sha="$(git rev-parse HEAD)"
        tree_sha="$(git rev-parse HEAD^{tree})"
        source_archive_sha256="$(git archive --format=tar HEAD | sha256sum | cut -d ' ' -f 1)"
        sites_artifact_sha256="$(tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -cf - dist | sha256sum | cut -d ' ' -f 1)"
        {
          echo "runner_trust=self-hosted-isolated-ephemeral"
          echo "production_capability=false"
          echo "repository=${GITHUB_REPOSITORY}"
          echo "workflow_run_id=${GITHUB_RUN_ID}"
          echo "workflow_run_attempt=${GITHUB_RUN_ATTEMPT}"
          echo "head_sha=${head_sha}"
          echo "tree_sha=${tree_sha}"
          echo "source_archive_sha256=${source_archive_sha256}"
          echo "sites_artifact_sha256=${sites_artifact_sha256}"
        } | tee ci-provenance/provenance.txt
        sha256sum ci-provenance/provenance.txt > ci-provenance/provenance.txt.sha256
    - name: Upload immutable provenance evidence
      uses: actions/upload-artifact@v4
      with:
        name: arthello-provenance-${{ github.run_id }}
        path: ci-provenance/
        if-no-files-found: error
        retention-days: 3
    name: quality
    if: github.event_name == 'workflow_dispatch' && github.repository == 'vitaliyozolin-dotcom/ArtHello-OS' && github.ref
