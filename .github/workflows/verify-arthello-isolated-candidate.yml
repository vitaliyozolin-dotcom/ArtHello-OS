        NODE
    - name: Restore exact source immediately before build
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ inputs.source_sha }}
        fetch-depth: 0
        clean: true
        persist-credentials: false
    - name: Prove pristine exact build context
      env:
        EXPECTED_SHA: ${{ inputs.source_sha }}
      run: |
        set -Eeuo pipefail
        test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
        test "$(git rev-parse --is-shallow-repository)" = false
        test -z "$(git status --porcelain=v1 --untracked-files=all)"
        test -z "$(git clean -ndx)"
        printf 'ARTHELLO_PRE_BUILD_SOURCE=PRISTINE sha=%s tree=%s\n' \
          "$EXPECTED_SHA" "$(git rev-parse HEAD^{tree})"
    - name: Build exact v52 candidate on an ephemeral runner
      id: image
      env:
        EXPECTED_SHA: ${{ inputs.source_sha }}
      run: |
        set -Eeuo pipefail
        image="arthello-v52-verify:$EXPECTED_SHA"
        docker build \
          --pull=false \
          --label "org.opencontainers.image.revision=$EXPECTED_SHA" \
          --label "org.opencontainers.image.source-tree=$(git rev-parse HEAD^{tree})" \
          --tag "$image" \
          --file deploy/v52/Dockerfile \
          .
        test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$EXPECTED_SHA"
        test "$(docker image inspect "$image" --format '{{.Config.User}}')" = node
        test "$(docker image inspect "$image" --format '{{json .Config.Cmd}}')" = '["node","production/runtime-server.mjs"]'
        test "$(docker image inspect "$image" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -Fc 'NODE_EXTRA_CA_CERTS=/app/production/russian-trusted-root-ca.pem')" -eq 1
        test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
        test -z "$(git status --porcelain=v1 --untracked-files=all)"
        test -z "$(git clean -ndx)"
        printf 'ARTHELLO_POST_BUILD_SOURCE=PRISTINE sha=%s tree=%s\n' \
          "$EXPECTED_SHA" "$(git rev-parse HEAD^{tree})"
        printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"
        printf 'image_id=%s\n' "$(docker image inspect "$image" --format '{{.Id}}')" >> "$GITHUB_OUTPUT"
    - name: Prove fail-closed key startup and isolated runtime readiness
      env:
        IMAGE: ${{ steps.image.outputs.image }}
      run: |
        set -Eeuo pipefail
        volume="arthello-v52-verify-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        container="arthello-v52-verify-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        key_file="$(mktemp)"
        bootstrap_file="$(mktemp)"
        central_file="$(mktemp)"
        openai_file="$(mktemp)"
        missing_key_log="$(mktemp)"
        cleanup() {
          rc=$?
          trap - EXIT INT TERM HUP
          docker rm -f "$container" >/dev/null 2>&1 || true
          docker volume rm -f "$volume" >/dev/null 2>&1 || true
          rm -f "$key_file" "$bootstrap_file" "$central_file" "$openai_file" "$missing_key_log"
          exit "$rc"
        }
        trap cleanup EXIT INT TERM HUP

        set +e
        timeout 20s docker run --rm --network none "$IMAGE" >"$missing_key_log" 2>&1
        missing_key_status=$?
        set -e
        test "$missing_key_status" -ne 0
        grep -F 'INTEGRATION_CREDENTIALS_KEY' "$missing_key_log" >/dev/null

        integration_key="$(python3 -I -c 'import secrets; print(secrets.token_urlsafe(48), end="")')"
        bootstrap_password="$(python3 -I -c 'import secrets; print(secrets.token_urlsafe(24), end="")')"
        central_access_secret="$(python3 -I -c 'import secrets; print(secrets.token_urlsafe(48), end="")')"
        openai_api_key="sk-ci-$(python3 -I -c 'import secrets; print(secrets.token_urlsafe(36), end="")')"
        echo "::add-mask::$integration_key"
        echo "::add-mask::$bootstrap_password"
        echo "::add-mask::$central_access_secret"
        echo "::add-mask::$openai_api_key"
        printf '%s' "$integration_key" > "$key_file"
        printf '%s' "$bootstrap_password" > "$bootstrap_file"
        printf '%s' "$central_access_secret" > "$central_file"
        printf '%s' "$openai_api_key" > "$openai_file"
        chmod 0444 "$key_file" "$bootstrap_file" "$central_file" "$openai_file"
        docker volume create --label arthello.scope=ci-v52 "$volume" >/dev/null
        docker run -d \
          --name "$container" \
          --restart no \
          --read-only \
          --tmpfs /tmp \
          --tmpfs /app/node_modules/.mf:rw,uid=1000,gid=1000,mode=0700 \
          --network bridge \
          -e NODE_ENV=production \
          -e PORT=8081 \
          -e ARTHELLO_D1_PATH=/data/d1 \
          -e ARTHELLO_PUBLIC_ORIGIN=https://verify.arthello.invalid \
          -e ARTHELLO_BOOTSTRAP_LOGIN=owner \
          -e ARTHELLO_BOOTSTRAP_PASSWORD_FILE=/run/secrets/bootstrap-password \
          -e INTEGRATION_CREDENTIALS_KEY_FILE=/run/secrets/integration-credentials-key \
          -e SCHOOL_PUBLIC_ORIGIN=https://school.verify.arthello.invalid \
          -e SCHOOL_DIARY_SYNC_URL=https://school.verify.arthello.invalid \
          -e SCHOOL_DIARY_ALLOWED_ORIGINS=https://school.verify.arthello.invalid \
          -e CENTRAL_ACCESS_SECRET_FILE=/run/secrets/central-access-secret \
          -e OPENAI_API_KEY_FILE=/run/secrets/openai-api-key \
          -e OPENAI_OCR_MODEL=gpt-4.1-mini \
          -e TBANK_EGRESS_IP=8.8.8.8 \
          --mount "type=bind,src=$key_file,dst=/run/secrets/integration-credentials-key,readonly" \
          --mount "type=bind,src=$bootstrap_file,dst=/run/secrets/bootstrap-password,readonly" \
          --mount "type=bind,src=$central_file,dst=/run/secrets/central-access-secret,readonly" \
          --mount "type=bind,src=$openai_file,dst=/run/secrets/openai-api-key,readonly" \
          -v "$volume:/data" \
          "$IMAGE" >/dev/null

        configured="$(docker inspect "$container" --format '{{range .Config.Env}}{{println .}}{{end}}')"
        if grep -Eq '^(ARTHELLO_BOOTSTRAP_PASSWORD|INTEGRATION_CREDENTIALS_KEY|CENTRAL_ACCESS_SECRET|OPENAI_API_KEY)=' <<<"$configured"; then
          echo 'Plaintext runtime secret found in container configuration' >&2
          exit 1
        fi
        assert_exact_ci_env() {
          local variable="$1" expected="$2" count
          count="$(awk -F= -v variable="$variable" '$1 == variable { matches += 1 } END { print matches + 0 }' <<<"$configured")"
          test "$count" -eq 1
          grep -Fx "$variable=$expected" <<<"$configured" >/dev/null
        }
        assert_exact_ci_env ARTHELLO_BOOTSTRAP_PASSWORD_FILE /run/secrets/bootstrap-password
        assert_exact_ci_env INTEGRATION_CREDENTIALS_KEY_FILE /run/secrets/integration-credentials-key
        assert_exact_ci_env SCHOOL_PUBLIC_ORIGIN https://school.verify.arthello.invalid
        assert_exact_ci_env SCHOOL_DIARY_SYNC_URL https://school.verify.arthello.invalid
        assert_exact_ci_env SCHOOL_DIARY_ALLOWED_ORIGINS https://school.verify.arthello.invalid
        assert_exact_ci_env CENTRAL_ACCESS_SECRET_FILE /run/secrets/central-access-secret
        assert_exact_ci_env OPENAI_API_KEY_FILE /run/secrets/openai-api-key
        assert_exact_ci_env OPENAI_OCR_MODEL gpt-4.1-mini
        assert_exact_ci_env TBANK_EGRESS_IP 8.8.8.8
        assert_exact_ci_env NODE_EXTRA_CA_CERTS /app/production/russian-trusted-root-ca.pem
        for secret_destination in \
          /run/secrets/bootstrap-password \
          /run/secrets/integration-credentials-key \
          /run/secrets/central-access-secret \
          /run/secrets/openai-api-key
        do
          docker inspect "$container" | jq -e --arg destination "$secret_destination" '
            [.[0].Mounts[]
              | select(
                  .Type == "bind" and
                  .Destination == $destination and
                  .RW == false
                )
            ] | length == 1
          ' >/dev/null
        done

        ready=0
        for attempt in $(seq 1 90); do
          if docker exec -i "$container" node - <<'NODE'
        const { X509Certificate } = await import('node:crypto');
        const { getCACertificates } = await import('node:tls');
        const expectedTochkaRoot = 'D2:6D:2D:02:31:B7:C3:9F:92:CC:73:85:12:BA:54:10:35:19:E4:40:5D:68:B5:BD:70:3E:97:88:CA:8E:CF:31';
        const extraRoots = getCACertificates('extra').map((pem) => new X509Certificate(pem));
        if (!extraRoots.some((certificate) => certificate.fingerprint256 === expectedTochkaRoot && certificate.ca && certificate.subject === certificate.issuer && certificate.verify(certificate.publicKey))) process.exit(1);
        const base = 'http://127.0.0.1:8081';
        const publicOrigin = 'https://verify.arthello.invalid';
        try {
          const health = await fetch(base + '/api/health');
          const healthBody = await health.json();
          if (!health.ok || healthBody.status !== 'ok' || healthBody.database !== 'available') process.exit(1);
          const root = await fetch(base + '/');
          const html = await root.text();
          const refs = [...html.matchAll(/(?:src|href)="(\/assets\/[^"]+)"/g)].map((match) => match[1]);
          if (!root.ok || refs.length < 2) process.exit(1);
          for (const path of [...new Set(refs)]) {
            if (!(await fetch(base + path)).ok) process.exit(1);
          }
          if ((await fetch(base + '/api/auth/me')).status !== 401) process.exit(1);
          const forged = await fetch(base + '/api/settings', {
            headers: {
              'oai-authenticated-user-email': 'forged@example.invalid',
              'x-arthello-role': 'OWNER',
            },
          });
          if (forged.status !== 401) process.exit(1);
          const wrongMethod = await fetch(base + '/api/auth/login');
          if (wrongMethod.status !== 405 || wrongMethod.headers.get('allow') !== 'POST') process.exit(1);
          if ((await fetch(base + '/api/auth/not-a-route')).status !== 404) process.exit(1);
          const crossOrigin = await fetch(base + '/api/auth/login', {
            method: 'POST',
            headers: { 'content-type': 'application/json', origin: 'https://invalid.example' },
            body: JSON.stringify({ login: 'owner', password: 'invalid' }),
          });
          if (crossOrigin.status !== 403) process.exit(1);

          const { readFileSync } = await import('node:fs');
          const bootstrapPassword = readFileSync('/run/secrets/bootstrap-password', 'utf8').trim();
          const login = await fetch(base + '/api/auth/login', {
            method: 'POST',
            headers: { 'content-type': 'application/json', origin: publicOrigin },
            body: JSON.stringify({ login: 'owner', password: bootstrapPassword }),
          });
          const loginBody = await login.json();
          if (!login.ok || loginBody.isSystemOwner !== true) process.exit(1);
          const setCookies = typeof login.headers.getSetCookie === 'function'
            ? login.headers.getSetCookie()
            : [login.headers.get('set-cookie') || ''];
          const cookies = setCookies.join(',');
          const session = cookies.match(/__Host-arthello_session=([^;,\s]+)/);
          const csrf = cookies.match(/__Host-arthello_csrf=([^;,\s]+)/);
          if (!session || !csrf) process.exit(1);
          const cookie = `${session[0]}; ${csrf[0]}`;
          const authenticated = await fetch(base + '/api/auth/me', { headers: { cookie } });
          if (!authenticated.ok || !(await authenticated.json()).isSystemOwner) process.exit(1);
          const logout = await fetch(base + '/api/auth/logout', {
            method: 'POST',
            headers: {
              cookie,
              origin: publicOrigin,
              'x-csrf-token': decodeURIComponent(csrf[1]),
            },
          });
          if (!logout.ok) process.exit(1);
          if ((await fetch(base + '/api/auth/me', { headers: { cookie } })).status !== 401) process.exit(1);
        } catch {
          process.exit(1);
        }
        NODE
          then
            ready=1
            break
          fi
          sleep 2
        done
        test "$ready" -eq 1
        printf 'ARTHELLO_V52_ISOLATED_RUNTIME=VERIFIED\n'
    - name: Build immutable verification evidence
      env:
        IMAGE: ${{ steps.image.outputs.image }}
        IMAGE_ID: ${{ steps.image.outputs.image_id }}
        EXPECTED_SHA: ${{ inputs.source_sha }}
      run: |
        set -Eeuo pipefail
        install -d -m 0700 ci-provenance
        tree_sha="$(git rev-parse HEAD^{tree})"
        dockerfile_sha256="$(sha256sum deploy/v52/Dockerfile | cut -d ' ' -f 1)"
        runtime_lock_sha256="$(sha256sum deploy/v52/runtime/package-lock.json | cut -d ' ' -f 1)"
        inventory_sha256="$(sha256sum deploy/v52/maintenance/production-data-inventory.py | cut -d ' ' -f 1)"
        tochka_ca_sha256="$(sha256sum deploy/v52/certificates/russian-trusted-root-ca.pem | cut -d ' ' -f 1)"
        docker save "$IMAGE" | gzip -1 -n > ci-provenance/arthello-v52-image.tar.gz
        test -s ci-provenance/arthello-v52-image.tar.gz
        image_archive_sha256="$(sha256sum ci-provenance/arthello-v52-image.tar.gz | cut -d ' ' -f 1)"
        fingerprint_filter_sha256="$(sha256sum deploy/v52/maintenance/image-runtime-fingerprint.jq | cut -d ' ' -f 1)"
        runtime_fingerprint_sha256="$(
          docker image inspect "$IMAGE" \
            | jq -cS -f deploy/v52/maintenance/image-runtime-fingerprint.jq \
            | sha256sum \
            | cut -d ' ' -f 1
        )"
        [[ "$runtime_fingerprint_sha256" =~ ^[a-f0-9]{64}$ ]]
        jq -n \
          --arg repository "$GITHUB_REPOSITORY" \
          --arg workflow_run_id "$GITHUB_RUN_ID" \
          --arg workflow_run_attempt "$GITHUB_RUN_ATTEMPT" \
          --arg head_sha "$EXPECTED_SHA" \
          --arg tree_sha "$tree_sha" \
          --arg dockerfile_sha256 "$dockerfile_sha256" \
          --arg runtime_lock_sha256 "$runtime_lock_sha256" \
          --arg inventory_sha256 "$inventory_sha256" \
          --arg tochka_ca_sha256 "$tochka_ca_sha256" \
          --arg fingerprint_filter_sha256 "$fingerprint_filter_sha256" \
          --arg image_archive_sha256 "$image_archive_sha256" \
          --arg image_id "$IMAGE_ID" \
          --arg runtime_fingerprint_sha256 "$runtime_fingerprint_sha256" \
          '{
            repository: $repository,
            workflowRunId: $workflow_run_id,
            workflowRunAttempt: $workflow_run_attempt,
            headSha: $head_sha,
            treeSha: $tree_sha,
            dockerfileSha256: $dockerfile_sha256,
            runtimeLockSha256: $runtime_lock_sha256,
            inventorySha256: $inventory_sha256,
            tochkaCaSha256: $tochka_ca_sha256,
            fingerprintFilterSha256: $fingerprint_filter_sha256,
            imageArchiveSha256: $image_archive_sha256,
            imageId: $image_id,
            runtimeFingerprintSha256: $runtime_fingerprint_sha256,
            runnerTrust: "self-hosted-isolated-ephemeral",
            productionCapability: false
          }' > ci-provenance/arthello-v52.json
        (cd ci-provenance && sha256sum arthello-v52.json > arthello-v52.json.sha256)
    - name: Upload immutable verification evidence
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: arthello-v52-verification-${{ github.run_id }}
        path: ci-provenance/
        if-no-files-found: error
        retention-days: 3
        compression-level: 0
    - name: Run repository maintenance tests after immutable upload
      run: |
        set -Eeuo pipefail
        python3 -m py_compile deploy/v52/maintenance/production-data-inventory.py
        python3 deploy/v52/maintenance/test_production_data_inventory.py
        test "$(python3 deploy/v52/maintenance/production-data-inventory.py --print-active-database-relative-path)" = \
          "d1/miniflare-D1DatabaseObject/5a499c55f63d6b9f725547d510cf454e288954b6f3c2d5024eb1443f29c97730.sqlite"
        python3 -I - <<'PY'
        import pathlib
        import re

        database_source = pathlib.Path("deploy/v52/overrides/db/index.ts").read_text(encoding="utf-8")
        inventory_source = pathlib.Path("deploy/v52/maintenance/production-data-inventory.py").read_text(encoding="utf-8")
        match = re.search(r'const integrationCredentialPrefix = "([^"]+)";', database_source)
        if match is None or match.group(1) not in inventory_source:
            raise SystemExit("Inventory is not synchronized with the encrypted credential namespace")
        PY
    if: github.event_name == 'workflow_dispatch' && github.repository == 'vitaliyozolin-dotcom/ArtHello-OS' && github.ref
      == 'refs/heads/main' && github.actor == 'vitaliyozolin-dotcom'
    needs:
    - quality
    - secret-scan
    - proof
