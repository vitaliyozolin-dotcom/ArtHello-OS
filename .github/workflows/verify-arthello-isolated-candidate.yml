        python3 -I /opt/arthello-builder/check-ready.py
        current_main="$(curl --fail --silent --show-error --max-time 30 \
          --header "Authorization: Bearer $GH_TOKEN" \
          --header 'Accept: application/vnd.github+json' \
          --header 'X-GitHub-Api-Version: 2022-11-28' \
          https://api.github.com/repos/vitaliyozolin-dotcom/ArtHello-OS/git/ref/heads/main \
          | jq -er '.object.sha')"
        test "$current_main" = "$GITHUB_SHA"
        candidate_head="$(curl --fail --silent --show-error --max-time 30 \
          --header "Authorization: Bearer $GH_TOKEN" \
          --header 'Accept: application/vnd.github+json' \
          --header 'X-GitHub-Api-Version: 2022-11-28' \
          https://api.github.com/repos/vitaliyozolin-dotcom/ArtHello-OS/git/ref/heads/codex/recovery-release-20260908 \
          | jq -er '.object.sha')"
        if [ "$EXPECTED_SOURCE_SHA" != "$current_main" ]; then
