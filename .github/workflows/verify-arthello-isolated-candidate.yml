        \ merged, exact-SHA gated main code.\nruby -ryaml -e '\n  document = YAML.safe_load(File.read(ARGV.fetch(0)),\
        \ aliases: true)\n  jobs = document.fetch(\"jobs\")\n  raise \"verification workflow must contain jobs\"\
        \ if jobs.empty?\n  jobs.each_value do |job|\n    raise \"verification must use an ephemeral hosted runner\"\
