# Manual reviewed-candidate verification only; controller workflow must run from main.
# No deployment trigger or production access. D-061 external VM isolation is required.
name: ArtHello isolated candidate gates
'on':
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed codex/recovery-release-20260908 SHA
        required: true
        type: string
      source_tree:
        description: Exact reviewed candidate tree SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: arthello-isolated-candidate-${{ inputs.source_sha }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  secret-scan:
    name: secret-scan
    runs-on:
    - arthello-build-only-linux-x64
    timeout-minutes: 10
    steps:
    - name: Verify build-only machine and reviewed candidate before checkout
      env:
        GH_TOKEN: ${{ github.token }}
        EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        EXPECTED_SOURCE_TREE: ${{ inputs.source_tree }}
      run: |
        set -Eeuo pipefail
        test "$GITHUB_EVENT_NAME" = workflow_dispatch
        test "$GITHUB_REPOSITORY" = vitaliyozolin-dotcom/ArtHello-OS
        test "$GITHUB_REF" = refs/heads/main
        test "$GITHUB_ACTOR" = vitaliyozolin-dotcom
        [[ "$EXPECTED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
        [[ "$EXPECTED_SOURCE_TREE" =~ ^[a-f0-9]{40}$ ]]
        test -z "${DOCKER_HOST:-}"
        test -z "${DOCKER_CONTEXT:-}"
        test -z "${SSH_AUTH_SOCK:-}"
        # This provisioner-owned marker records a fresh VM; it does not replace the
        # hypervisor network boundary or permit production credentials on this host.
        python3 -I /opt/arthello-builder/check-ready.py
        current_main="$(curl --fail --silent --show-error --max-time 30 \
          --header "Authorization: Bearer $GH_TOKEN" \
          --header 'Accept: application/vnd.github+json' \
          --header 'X-GitHub-Api-Version: 2022-11-28' \
          https://api.github.com/repos/vitaliyozolin-dotcom/ArtHello-OS/git/ref/heads/main \
          | jq -er '.object.sha')"
        test "$current_main" = "$GITHUB_SHA"
        candidate_head="$(curl --fail --silent --show-error --max-time 30 \
          --header "Authorization: Bearer $GH_TOKEN" \
          --header 'Accept: application/vnd.github+json' \
          --header 'X-GitHub-Api-Version: 2022-11-28' \
          https://api.github.com/repos/vitaliyozolin-dotcom/ArtHello-OS/git/ref/heads/codex/recovery-release-20260908 \
          | jq -er '.object.sha')"
        if [ "$EXPECTED_SOURCE_SHA" != "$current_main" ]; then
          test "$candidate_head" = "$EXPECTED_SOURCE_SHA"
        fi
        candidate_tree="$(curl --fail --silent --show-error --max-time 30 \
          --header "Authorization: Bearer $GH_TOKEN" \
          --header 'Accept: application/vnd.github+json' \
          --header 'X-GitHub-Api-Version: 2022-11-28' \
          "https://api.github.com/repos/vitaliyozolin-dotcom/ArtHello-OS/git/commits/$EXPECTED_SOURCE_SHA" \
          | jq -er '.tree.sha')"
        test "$candidate_tree" = "$EXPECTED_SOURCE_TREE"
        printf 'ARTHELLO_ISOLATED_CANDIDATE_BOUNDARY=VERIFIED sha=%s tree=%s\n' "$EXPECTED_SOURCE_SHA" "$EXPECTED_SOURCE_TREE"
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ inputs.source_sha }}
        fetch-depth: 0
        clean: true
        persist-credentials: false
    - name: Verify exact source head and complete history
      env:
        EXPECTED_HEAD_SHA: ${{ inputs.source_sha }}
      run: |
        set -Eeuo pipefail
        actual_head="$(git rev-parse HEAD)"
        test "$actual_head" = "$EXPECTED_HEAD_SHA"
        test "$(git rev-parse --is-shallow-repository)" = "false"
        test "$(git rev-list --count HEAD)" -gt 0
        git fsck --full --strict
        git log -p --no-ext-diff --full-history HEAD >/dev/null
    - name: Scan current tree and reachable Git history
      env:
        GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
      run: |
        set -Eeuo pipefail

        smoke_dir="$(mktemp -d)"
        trap 'rm -rf "$smoke_dir"' EXIT
        cat > "$smoke_dir/gitleaks.toml" <<'EOF'
        title = "CI secret scanner self-test"

        [[rules]]
        id = "ci-synthetic-leak"
        description = "CI-only synthetic finding"
        regex = '''SYNTHETIC_LEAK_[A-Z0-9]{16}'''
        EOF
        printf '%s%s\n' 'SYNTHETIC_' 'LEAK_A1B2C3D4E5F6G7H8' > "$smoke_dir/synthetic-leak.txt"

        set +e
        docker run --rm --user "$(id -u):$(id -g)" \
          -v "$smoke_dir:/scan:ro" \
          "$GITLEAKS_IMAGE" dir --config /scan/gitleaks.toml --no-banner --redact --exit-code 23 /scan
        smoke_status=$?
        set -e
        if [[ "$smoke_status" -ne 23 ]]; then
          echo "Gitleaks fail-closed self-test failed with status $smoke_status" >&2
          exit 1
        fi

        docker run --rm --user "$(id -u):$(id -g)" \
          -v "$PWD:/repo:ro" \
          "$GITLEAKS_IMAGE" dir --no-banner --redact --verbose /repo

        docker run --rm --user "$(id -u):$(id -g)" \
          -v "$PWD:/repo:ro" \
          -w /repo \
          "$GITLEAKS_IMAGE" git --no-banner --redact --verbose --log-opts="--full-history HEAD" /repo
    if: github.event_name == 'workflow_dispatch' && github.repository == 'vitaliyozolin-dotcom/ArtHello-OS' && github.ref
      == 'refs/heads/main' && github.actor == 'vitaliyozolin-dotcom'
  quality:
    runs-on:
    - arthello-build-only-linux-x64
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: arthello_test
          POSTGRES_USER: arthello_test
          POSTGRES_PASSWORD: sandbox-only-password
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U arthello_test -d arthello_test" --health-interval 5s --health-timeout
          5s --health-retries 12
    env:
      DATABASE_URL: postgresql://arthello_test:sandbox-only-password@127.0.0.1:5432/arthello_test
      TEST_DATABASE_URL: postgresql://arthello_test:sandbox-only-password@127.0.0.1:5432/arthello_test
      NODE_ENV: test
    steps:
    - name: Verify build-only machine and reviewed candidate before checkout
      env:
        GH_TOKEN: ${{ github.token }}
        EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        EXPECTED_SOURCE_TREE: ${{ inputs.source_tree }}
      run: |
        set -Eeuo pipefail
