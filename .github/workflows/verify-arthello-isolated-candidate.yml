        )\n  [\n    \"SCHOOL_PUBLIC_ORIGIN=%s\", \"SCHOOL_DIARY_SYNC_URL=%s\",\n    \"SCHOOL_DIARY_ALLOWED_ORIGINS=%s\"\
        \n  ].each do |variable|\n    line = source.lines.find { |candidate| candidate.include?(variable) && candidate.include?(\"\
        printf\") }\n    raise \"school runtime origin policy missing: #{variable}\" unless line && line.include?(\"\
        $SCHOOL_URL\")\n  end\n  [\n    \"CENTRAL_ACCESS_SECRET_FILE=/run/secrets/central-access-secret\",\n   \
        \ \"OPENAI_OCR_MODEL=gpt-4.1-mini\"\n  ].each do |required|\n    raise \"required runtime environment policy\
        \ missing: #{required}\" unless source.include?(required)\n  end\n' .github/workflows/deploy-arthello-direct-38-55.yml\n\
        printf 'ARTHELLO_V52_SOURCE_SHA=%s\\n' \"$EXPECTED_SHA\"\n"
    - name: Validate release files without exposing data
