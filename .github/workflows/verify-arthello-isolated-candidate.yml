        secrets.OPENAI\")\n  raise \"OpenAI file binding is missing\" unless source.include?(\"OPENAI_API_KEY_FILE=/run/secrets/openai-api-key\"\
        )\n  raise \"OpenAI model allowlist pin missing\" unless source.include?(\"OPENAI_OCR_MODEL=gpt-4.1-mini\"\
        )\n  runtime_env_start = source.index(%q{runtime_env=\"$work/runtime.env\"}, tbank_start || 0)\n  raise\
        \ \"optional T-Bank policy block missing\" unless tbank_start && runtime_env_start && runtime_env_start\
        \ > tbank_start\n  tbank_policy = source[tbank_start...runtime_env_start]\n  [\n    %q{if [ -L \"$tbank_egress_ip_file\"\
        \ ]}, %q{elif [ -e \"$tbank_egress_ip_file\" ]},\n    %q{test -f \"$tbank_egress_ip_file\"}, %q{test -r\
        \ \"$tbank_egress_ip_file\"},\n    %q{test -s \"$tbank_egress_ip_file\"}, \"stat -c\",\n    \"3 <= len(raw)\
        \ <= 45\", \"ipaddress.ip_address(value)\",\n    \"address.is_global\", \"address.is_multicast\", %q{str(address)\
        \ != value}, \"tbank_enabled=1\"\n  ].each do |required|\n    raise \"optional T-Bank egress validation\
        \ missing: #{required}\" unless tbank_policy.include?(required)\n  end\n  raise \"T-Bank egress must not\
