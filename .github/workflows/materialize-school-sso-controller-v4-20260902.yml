name: Materialize corrected School SSO controller

on:
  push:
    branches:
      - ops/fix-school-sso-controller-dockerignore-20260902
    paths:
      - .github/workflows/materialize-school-sso-controller-v4-20260902.yml

permissions:
  contents: read

concurrency:
  group: materialize-school-sso-controller-v4
  cancel-in-progress: true

jobs:
  materialize:
    if: >-
      github.repository == 'vitaliyozolin-dotcom/ArtHello-OS' &&
      github.actor == 'vitaliyozolin-dotcom' &&
      github.triggering_actor == 'vitaliyozolin-dotcom'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact controls branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ops/fix-school-sso-controller-dockerignore-20260902
          fetch-depth: 1
          persist-credentials: false

      - name: Patch, repack, validate and pin the controller
        shell: bash
        run: python3 .github/scripts/materialize-school-sso-controller-v4.py

      - name: Upload exact corrected controls
        uses: actions/upload-artifact@v4
        with:
          name: school-sso-controller-v4
          path: generated-school-sso-controller
          if-no-files-found: error
          retention-days: 1
