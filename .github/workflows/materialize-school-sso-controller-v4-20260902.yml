name: Materialize corrected School SSO controller

on:
  push:
    branches:
      - ops/fix-school-sso-controller-dockerignore-20260902
    paths:
      - .github/workflows/materialize-school-sso-controller-v4-20260902.yml

permissions:
  contents: write

concurrency:
  group: materialize-school-sso-controller-v4
  cancel-in-progress: true

jobs:
  materialize:
    if: >-
      github.repository == 'vitaliyozolin-dotcom/ArtHello-OS' &&
      github.actor == 'vitaliyozolin-dotcom' &&
      github.triggering_actor == 'vitaliyozolin-dotcom'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact controls branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ops/fix-school-sso-controller-dockerignore-20260902
          fetch-depth: 1
          persist-credentials: true

      - name: Patch, repack and pin the deployment controller
        env:
          TARGET_BRANCH: ops/fix-school-sso-controller-dockerignore-20260902
          GENERATOR_PATH: .github/workflows/materialize-school-sso-controller-v4-20260902.yml
          DEPLOY_WORKFLOW: .github/workflows/deploy-school-sso-origin-hotfix-production-20260902.yml
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF_NAME" = "$TARGET_BRANCH"
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test -z "$(git status --porcelain --untracked-files=all)"

          work="$(mktemp -d)"
          trap 'rm -rf -- "$work"' EXIT
          mapfile -t parts < <(
            printf '%s\n' .github/scripts/school-staff-sso-workflow-controller-v3.sh.gz.b64.part-* | sort
          )
          test "${#parts[@]}" -eq 5

          cat "${parts[@]}" | tr -d '\r\n\t ' | base64 -d | gzip -d > "$work/controller.before.sh"
          cp "$work/controller.before.sh" "$work/controller.after.sh"
          python3 - "$work/controller.after.sh" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()
          old = """cat > school-source/.dockerignore <<'EOF'
          .git
          .next
          .openai/*
          !.openai/hosting.json
          .sites-runtime
          .wrangler
          .migration
          data
          dist
          node_modules
          npm-debug.log*
          EOF
          """
          new = """cat > school-source/.dockerignore <<'EOF'
          .git
          .next
          .openai/*
          !.openai/hosting.json
          .sites-runtime
          .wrangler
          .migration
          data/*
          !data/schedules
          !data/schedules/**
          !data/curricula
          !data/curricula/**
          dist
          node_modules
          npm-debug.log*
          EOF
          """
          if text.count(old) != 1:
              raise SystemExit(f"Expected exactly one unsafe Docker context block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY

          bash -n "$work/controller.after.sh"
          grep -Fx 'data/*' "$work/controller.after.sh" >/dev/null
          grep -Fx '!data/schedules' "$work/controller.after.sh" >/dev/null
          grep -Fx '!data/schedules/**' "$work/controller.after.sh" >/dev/null
          grep -Fx '!data/curricula' "$work/controller.after.sh" >/dev/null
          grep -Fx '!data/curricula/**' "$work/controller.after.sh" >/dev/null
          ! grep -Fx 'data' "$work/controller.after.sh" >/dev/null
          test "$(cmp -s "$work/controller.before.sh" "$work/controller.after.sh"; printf '%s' "$?")" = 1

          controller_sha="$(sha256sum "$work/controller.after.sh" | awk '{print $1}')"
          [[ "$controller_sha" =~ ^[a-f0-9]{64}$ ]]
          gzip -n -c "$work/controller.after.sh" | base64 -w0 > "$work/controller.b64"
          test -s "$work/controller.b64"

          python3 - "$work/controller.b64" "${parts[@]}" <<'PY'
          from pathlib import Path
          import sys

          encoded = Path(sys.argv[1]).read_text().strip()
          paths = [Path(value) for value in sys.argv[2:]]
          if len(paths) != 5 or not encoded:
              raise SystemExit("Invalid controller payload or part inventory")
          size, remainder = divmod(len(encoded), len(paths))
          cursor = 0
          for index, path in enumerate(paths):
              length = size + (1 if index < remainder else 0)
              chunk = encoded[cursor:cursor + length]
              cursor += length
              if not chunk:
                  raise SystemExit(f"Generated empty controller part: {path}")
              path.write_text(chunk + "\n")
          if cursor != len(encoded):
              raise SystemExit("Controller payload was not split completely")
          PY

          workflow="$DEPLOY_WORKFLOW"
          python3 - "$workflow" "$controller_sha" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          digest = sys.argv[2]
          text = path.read_text()
          text, digest_count = re.subn(
              r"(?m)^  CONTROLLER_SCRIPT_SHA256: [a-f0-9]{64}$",
              f"  CONTROLLER_SCRIPT_SHA256: {digest}",
              text,
          )
          if digest_count != 1:
              raise SystemExit(f"Expected one controller digest pin, found {digest_count}")

          old = '''          bash -n "$work/controller.sh"
          bash -n "$work/cutover.sh"
'''
          new = '''          bash -n "$work/controller.sh"
          bash -n "$work/cutover.sh"
          grep -Fx 'data/*' "$work/controller.sh" >/dev/null
          grep -Fx '!data/schedules' "$work/controller.sh" >/dev/null
          grep -Fx '!data/schedules/**' "$work/controller.sh" >/dev/null
          grep -Fx '!data/curricula' "$work/controller.sh" >/dev/null
          grep -Fx '!data/curricula/**' "$work/controller.sh" >/dev/null
          ! grep -Fx 'data' "$work/controller.sh" >/dev/null
          printf 'SCHOOL_SSO_CONTROLLER_DOCKER_CONTEXT=PASS\\n'
'''
          if text.count(old) != 1:
              raise SystemExit(f"Expected one validation insertion point, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY

          reconstructed="$work/controller.reconstructed.sh"
          cat "${parts[@]}" | tr -d '\r\n\t ' | base64 -d | gzip -d > "$reconstructed"
          printf '%s  %s\n' "$controller_sha" "$reconstructed" | sha256sum -c -
          cmp -s "$work/controller.after.sh" "$reconstructed"
          bash -n "$reconstructed"
          bash -n "$workflow"
          grep -F "CONTROLLER_SCRIPT_SHA256: $controller_sha" "$workflow" >/dev/null
          grep -F "SCHOOL_SSO_CONTROLLER_DOCKER_CONTEXT=PASS" "$workflow" >/dev/null

          git rm "$GENERATOR_PATH"
          git add "$workflow" "${parts[@]}"
          mapfile -t staged < <(git diff --cached --name-only | sort)
          test "${#staged[@]}" -eq 7
          printf '%s\n' "${staged[@]}" | grep -Fx "$GENERATOR_PATH" >/dev/null
          printf '%s\n' "${staged[@]}" | grep -Fx "$workflow" >/dev/null
          for part in "${parts[@]}"; do
            printf '%s\n' "${staged[@]}" | grep -Fx "$part" >/dev/null
          done

          git config user.name 'vitaliyozolin-dotcom'
          git config user.email 'vitaliyozolin@gmail.com'
          git commit -m 'Fix School SSO deployment controller Docker context'
          git push origin "HEAD:$TARGET_BRANCH"
          printf 'SCHOOL_SSO_CONTROLLER_SHA256=%s\n' "$controller_sha"
          printf 'SCHOOL_SSO_CONTROLLER_REPACK=PASS\n'
