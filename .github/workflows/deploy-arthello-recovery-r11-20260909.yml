        docker exec --user 1000:1000 -i "${gateway_live_ids[0]}" node <<'D069_SOURCE_READONLY'
        const fs = require('node:fs');
        const source = '/data/d1/miniflare-D1DatabaseObject/5a499c55f63d6b9f725547d510cf454e288954b6f3c2d5024eb1443f29c97730.sqlite';
        let fd;
        let proof = { schemaVersion: 1, sourceReadable: false, sourceOwnershipVerified: false };
        try {
          if (process.getuid() !== 1000 || process.getgid() !== 1000 || fs.realpathSync(source) !== source) throw Error('SOURCE_PRECONDITION');
          fd = fs.openSync(source, fs.constants.O_RDONLY | fs.constants.O_NOFOLLOW | fs.constants.O_NONBLOCK);
          const info = fs.fstatSync(fd);
          const pathInfo = fs.lstatSync(source);
          proof = { ...proof, sourceUid: info.uid, sourceGid: info.gid, sourceMode: (info.mode & 0o7777).toString(8).padStart(4, '0'), sourceReadable: true };
          if (!info.isFile() || info.uid !== 1000 || info.gid !== 1000 || (info.mode & 0o002) !== 0 || info.dev !== pathInfo.dev || info.ino !== pathInfo.ino) throw Error('SOURCE_PRECONDITION');
          proof.sourceOwnershipVerified = true;
        } catch {
          process.exitCode = 1;
        } finally {
          if (fd !== undefined) fs.closeSync(fd);
          console.log(JSON.stringify(proof));
        }
        D069_SOURCE_READONLY
        printf '{"gatewayUid":%s,"dockerApiRead":true,"backupWorkerReady":false,"scope":"existing-deployment-authority"}\n' "$gateway_uid"
