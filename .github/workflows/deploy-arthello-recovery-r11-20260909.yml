          fi
          if [ "$tbank_enabled" -eq 1 ]; then
            printf 'TBANK_EGRESS_IP=%s\n' "$tbank_egress_ip"
          fi
        } > "$runtime_env"
        chmod 0600 "$runtime_env"
        runtime_configuration="$(cat "$runtime_env")"
        if grep -Eq '^(ARTHELLO_BOOTSTRAP_PASSWORD|INTEGRATION_CREDENTIALS_KEY|CENTRAL_ACCESS_SECRET|OPENAI_API_KEY)=' <<<"$runtime_configuration"; then
          echo 'Plaintext secret found in runtime.env' >&2
          exit 1
        fi
        assert_exact_runtime_env "$runtime_configuration" ARTHELLO_BOOTSTRAP_PASSWORD_FILE /run/secrets/bootstrap-password
        assert_exact_runtime_env "$runtime_configuration" INTEGRATION_CREDENTIALS_KEY_FILE /run/secrets/integration-credentials-key
        assert_exact_runtime_env "$runtime_configuration" CENTRAL_ACCESS_SECRET_FILE /run/secrets/central-access-secret
        assert_exact_runtime_env "$runtime_configuration" SCHOOL_PUBLIC_ORIGIN "$SCHOOL_URL"
        assert_exact_runtime_env "$runtime_configuration" SCHOOL_DIARY_SYNC_URL "$SCHOOL_URL"
        assert_exact_runtime_env "$runtime_configuration" SCHOOL_DIARY_ALLOWED_ORIGINS "$SCHOOL_URL"
        assert_exact_runtime_env "$runtime_configuration" OPENAI_OCR_MODEL gpt-4.1-mini
        if [ "$openai_enabled" -eq 1 ]; then
          assert_exact_runtime_env "$runtime_configuration" OPENAI_API_KEY_FILE /run/secrets/openai-api-key
        elif grep -q '^OPENAI_API_KEY_FILE=' <<<"$runtime_configuration"; then
