        chmod 0600 "$work/Caddyfile.before"
        # D084_GATEWAY_OBSERVATION_BEGIN
        observed_gateway_id="$(docker inspect "$CADDY_CONTAINER" --format '{{.Id}}')"
        [[ "$observed_gateway_id" =~ ^[a-f0-9]{64}$ ]]
        python3 -I .github/scripts/d083-maintenance-route.py observe-gateway \
          --gateway-id "$observed_gateway_id" --input "$work/external-routes.before.caddy" \
          --main-config "$work/Caddyfile.before" --gateway-env-evidence "$work/gateway-evidence.json"
        # D084_GATEWAY_OBSERVATION_END
        python3 -I - "$gate_nonce_file" <<'D080_PRIVATE_NONCE'
        import os, secrets, sys
        descriptor = os.open(sys.argv[1], os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
        with os.fdopen(descriptor, 'w', encoding='ascii') as stream:
            stream.write(secrets.token_hex(32) + '\n')
            stream.flush()
            os.fsync(stream.fileno())
        D080_PRIVATE_NONCE
        python3 -I .github/scripts/d083-maintenance-route.py render \
          --input "$work/external-routes.before.caddy" --main-config "$work/Caddyfile.before" \
          --normal-output "$work/external-routes.candidate.caddy" \
          --maintenance-output "$work/external-routes.maintenance.caddy" \
          --old-upstream "$live_name:8081" --candidate-upstream "$candidate:8081" \
          --gateway-env-evidence "$work/gateway-evidence.json" --nonce-file "$gate_nonce_file"
        # D080_MAINTENANCE_RENDER_END

        docker volume create \
          --label arthello.scope=preflight \
          --label "arthello.release.sha=$RELEASE_SHA" \
          --label "arthello.release.run=$GITHUB_RUN_ID" \
          "$clone_volume" >/dev/null
        require_current_main_release
        docker pause "$live_id" >/dev/null
        live_paused=1
        copy_volume "$DATA_VOLUME" "$clone_volume"
        docker unpause "$live_id" >/dev/null
        live_paused=0

        snapshot_volume "$clone_volume" "$work/preflight-before"
        python3 "$inventory_script" "$work/preflight-before" \
          --github-output "$work/inventory-before.env" >/dev/null
        encrypted_credentials_present="$(sed -n 's/^encrypted_credentials_present=//p' "$work/inventory-before.env")"
        encrypted_credentials_count="$(sed -n 's/^encrypted_credentials_count=//p' "$work/inventory-before.env")"
        encrypted_credentials_digest="$(sed -n 's/^encrypted_credentials_digest=//p' "$work/inventory-before.env")"
        case "$encrypted_credentials_present" in true|false) ;; *) exit 1 ;; esac
        [[ "$encrypted_credentials_count" =~ ^[0-9]+$ ]]
        [[ "$encrypted_credentials_digest" =~ ^[a-f0-9]{64}$ ]]
        if [ "$encrypted_credentials_present" = true ]; then
          test "$encrypted_credentials_count" -gt 0
        else
          test "$encrypted_credentials_count" -eq 0
        fi

        current_file_key=""
        current_legacy_key=""
        current_key_path="$(docker inspect "$live_id" --format '{{range .Config.Env}}{{println .}}{{end}}' \
          | sed -n 's/^INTEGRATION_CREDENTIALS_KEY_FILE=//p' | head -n1)"
        if [ -n "$current_key_path" ]; then
          case "$current_key_path" in /run/secrets/*) ;; *) echo 'Unsafe integration key file path in current container' >&2; exit 1 ;; esac
          current_file_key="$(docker exec "$live_id" sh -ceu 'cat -- "$1"' sh "$current_key_path")"
          test -n "$current_file_key"
          mask_secret "$current_file_key"
        fi
        current_legacy_key="$(docker inspect "$live_id" --format '{{range .Config.Env}}{{println .}}{{end}}' \
          | sed -n 's/^INTEGRATION_CREDENTIALS_KEY=//p' | head -n1)"
        if [ -n "$current_legacy_key" ]; then mask_secret "$current_legacy_key"; fi
        if [ -n "$current_file_key" ] && [ -n "$current_legacy_key" ]; then
          test "$current_file_key" = "$current_legacy_key"
        fi
        current_integration_key="${current_file_key:-$current_legacy_key}"

        if [ -L "$integration_key_file" ]; then echo 'Integration key file must not be a symlink' >&2; exit 1; fi
        if [ -s "$integration_key_file" ]; then
          integration_key="$(cat "$integration_key_file")"
          mask_secret "$integration_key"
          if [ -n "$current_integration_key" ]; then test "$integration_key" = "$current_integration_key"; fi
        elif [ -n "$current_integration_key" ]; then
          integration_key="$current_integration_key"
          atomic_secret_write "$integration_key_file" "$integration_key"
        elif [ "$encrypted_credentials_present" = true ]; then
          echo 'Encrypted credentials exist but their runtime key is unavailable' >&2
          exit 1
        else
          integration_key="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48), end="")')"
          mask_secret "$integration_key"
          atomic_secret_write "$integration_key_file" "$integration_key"
        fi
        test "${#integration_key}" -ge 32
        [[ "$integration_key" != *[$'\r\n\t ']* ]]
        chmod 0444 "$integration_key_file"
        test "$(stat -c '%a' "$integration_key_file")" = 444

        current_bootstrap_file=""
        current_bootstrap_legacy=""
        current_bootstrap_path="$(docker inspect "$live_id" --format '{{range .Config.Env}}{{println .}}{{end}}' \
          | sed -n 's/^ARTHELLO_BOOTSTRAP_PASSWORD_FILE=//p' | head -n1)"
        if [ -n "$current_bootstrap_path" ]; then
          case "$current_bootstrap_path" in /run/secrets/*) ;; *) echo 'Unsafe bootstrap password file path in current container' >&2; exit 1 ;; esac
          current_bootstrap_file="$(docker exec "$live_id" sh -ceu 'cat -- "$1"' sh "$current_bootstrap_path")"
          test -n "$current_bootstrap_file"
          mask_secret "$current_bootstrap_file"
        fi
        current_bootstrap_legacy="$(docker inspect "$live_id" --format '{{range .Config.Env}}{{println .}}{{end}}' \
          | sed -n 's/^ARTHELLO_BOOTSTRAP_PASSWORD=//p' | head -n1)"
        if [ -n "$current_bootstrap_legacy" ]; then mask_secret "$current_bootstrap_legacy"; fi
        if [ -n "$current_bootstrap_file" ] && [ -n "$current_bootstrap_legacy" ]; then
          test "$current_bootstrap_file" = "$current_bootstrap_legacy"
        fi
        current_bootstrap="${current_bootstrap_file:-$current_bootstrap_legacy}"
        if [ -L "$bootstrap_file" ]; then echo 'Bootstrap password file must not be a symlink' >&2; exit 1; fi
        if [ -s "$bootstrap_file" ]; then
          bootstrap_password="$(cat "$bootstrap_file")"
          mask_secret "$bootstrap_password"
          if [ -n "$current_bootstrap" ]; then test "$bootstrap_password" = "$current_bootstrap"; fi
        elif [ -n "$current_bootstrap" ]; then
          bootstrap_password="$current_bootstrap"
          atomic_secret_write "$bootstrap_file" "$bootstrap_password"
        else
          bootstrap_password="$(python3 -c 'import secrets; print(secrets.token_urlsafe(24), end="")')"
          mask_secret "$bootstrap_password"
          atomic_secret_write "$bootstrap_file" "$bootstrap_password"
        fi
        test -n "$bootstrap_password"
        chmod 0444 "$bootstrap_file"
        test "$(stat -c '%a' "$bootstrap_file")" = 444

        runtime_env="$work/runtime.env"
        {
          printf 'NODE_ENV=production\n'
          printf 'PORT=8081\n'
          printf 'ARTHELLO_D1_PATH=/data/d1\n'
          printf 'ARTHELLO_PUBLIC_ORIGIN=%s\n' "$PUBLIC_URL"
          printf 'ARTHELLO_BOOTSTRAP_LOGIN=owner\n'
          printf 'ARTHELLO_BOOTSTRAP_PASSWORD_FILE=/run/secrets/bootstrap-password\n'
          printf 'INTEGRATION_CREDENTIALS_KEY_FILE=/run/secrets/integration-credentials-key\n'
          printf 'SCHOOL_PUBLIC_ORIGIN=%s\n' "$SCHOOL_URL"
          printf 'SCHOOL_DIARY_SYNC_URL=%s\n' "$SCHOOL_URL"
          printf 'SCHOOL_DIARY_ALLOWED_ORIGINS=%s\n' "$SCHOOL_URL"
          printf 'CENTRAL_ACCESS_SECRET_FILE=/run/secrets/central-access-secret\n'
          printf 'OPENAI_OCR_MODEL=gpt-4.1-mini\n'
          if [ "$openai_enabled" -eq 1 ]; then
