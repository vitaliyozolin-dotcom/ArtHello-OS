        fi
        if [ "$tbank_enabled" -eq 1 ]; then
          assert_exact_runtime_env "$runtime_configuration" TBANK_EGRESS_IP "$tbank_egress_ip"
        elif grep -q '^TBANK_EGRESS_IP=' <<<"$runtime_configuration"; then
          exit 1
        fi

        runtime_secret_mounts=(
          --mount "type=bind,src=$integration_key_file,dst=/run/secrets/integration-credentials-key,readonly"
          --mount "type=bind,src=$bootstrap_file,dst=/run/secrets/bootstrap-password,readonly"
          --mount "type=bind,src=$central_access_secret_file,dst=/run/secrets/central-access-secret,readonly"
        )
        if [ "$openai_enabled" -eq 1 ]; then
          runtime_secret_mounts+=(
            --mount "type=bind,src=$openai_api_key_file,dst=/run/secrets/openai-api-key,readonly"
          )
        fi

        docker run --rm \
          --network none \
          --read-only \
          -e ARTHELLO_OPENAI_ENABLED="$openai_enabled" \
          "${runtime_secret_mounts[@]}" \
          --entrypoint /bin/sh \
          "$immutable_image_id" -ceu '
            test -r /run/secrets/integration-credentials-key
            test "$(wc -c < /run/secrets/integration-credentials-key)" -ge 32
            test -r /run/secrets/bootstrap-password
            test -s /run/secrets/bootstrap-password
            test -r /run/secrets/central-access-secret
            test "$(wc -c < /run/secrets/central-access-secret)" -ge 32
            test "$(wc -c < /run/secrets/central-access-secret)" -le 4096
            if grep -q "[[:space:]]" /run/secrets/central-access-secret; then
              echo "Central access secret contains whitespace" >&2
              exit 1
            fi
            if [ "$ARTHELLO_OPENAI_ENABLED" -eq 1 ]; then
