        DEPLOY_USER: ${{ secrets.ARTHELLO_RU_DEPLOY_USER }}
        DEPLOY_PORT: ${{ secrets.ARTHELLO_RU_DEPLOY_PORT }}
        GH_TOKEN: ${{ github.token }}
        SCHOOL_REPAIR_CONFIG_SHA256: ${{ steps.school_repair.outputs.config_sha256 }}
