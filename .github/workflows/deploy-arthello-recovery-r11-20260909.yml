        trap 'exit 130' INT
        trap 'exit 143' TERM
        trap 'exit 129' HUP
        test ! -e "$ssh_dir"
        test ! -L "$ssh_dir"
        install -m 0700 -d "$ssh_dir"
        printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_dir/id_ed25519"
