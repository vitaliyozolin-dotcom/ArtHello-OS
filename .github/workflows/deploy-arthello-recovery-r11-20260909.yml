        [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
        [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
        [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,2}$ ]]
        bootstrap_base64="$(base64 -w0 .github/scripts/verify-installed-school-relay-r6.py)"
        [[ "$bootstrap_base64" =~ ^[A-Za-z0-9+/=]+$ ]]
        # Public identities and a reviewed bootstrap are the only remote environment.
        # Bundle bytes use stdin, stay below the fixed size cap, and are hash checked
        # before any trusted repair source can execute on the School host.
        # Recheck current main immediately before installed R5 verification.
        current_main="$(curl --fail-with-body --silent --show-error --max-time 30 \
