              test "$(wc -c < /run/secrets/openai-api-key)" -ge 20
              test "$(wc -c < /run/secrets/openai-api-key)" -le 4096
              if grep -q "[[:space:]]" /run/secrets/openai-api-key; then
                echo "OpenAI key contains whitespace" >&2
                exit 1
              fi
            else
              test ! -e /run/secrets/openai-api-key
            fi
          '

        network="$(docker inspect "$CADDY_CONTAINER" --format '{{range $name, $_ := .NetworkSettings.Networks}}{{println $name}}{{end}}' | head -n1)"
        test -n "$network"
        probe_tochka_tls_egress "$network"
        docker run -d \
          --name "$clone_container" \
          --restart no \
          --read-only \
          --tmpfs /tmp \
          --tmpfs /app/node_modules/.mf:rw,uid=1000,gid=1000,mode=0700 \
          --network none \
          --env-file "$runtime_env" \
          -e TOCHKA_AUTOSYNC_ENABLED=0 \
