name: D149 format payment feature router

on:
  push:
    branches:
      - codex/arthello-pay-web-d149-20260911
    paths:
      - .github/workflows/d149-format-payment-router.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/arthello-pay-web-d149-20260911
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@11.7.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Format moved payment router and remove one-shot workflow
        run: |
          set -Eeuo pipefail
          pnpm exec prettier --write artifacts/api-server/src/features/payments/router.ts
          rm .github/workflows/d149-format-payment-router.yml
          git config user.name "arthello-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "D149: format ArtHello Pay feature router"
          git push origin HEAD:codex/arthello-pay-web-d149-20260911
