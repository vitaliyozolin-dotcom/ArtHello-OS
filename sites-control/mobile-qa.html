<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>ArtHello OS — mobile QA frame</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 24px;
        background: #24202d;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      .qa-frame { display: grid; gap: 10px; }
      .qa-label { color: #d5cfdf; font-size: 12px; text-align: center; }
      iframe {
        width: 390px;
        height: 844px;
        border: 0;
        border-radius: 28px;
        background: #f5f6fa;
        box-shadow: 0 24px 70px rgba(0,0,0,.38);
      }
    </style>
  </head>
  <body>
    <div class="qa-frame">
      <div class="qa-label">Внутренний QA · viewport 390 × 844</div>
      <iframe src="/#pulse" title="ArtHello OS — mobile viewport"></iframe>
    </div>
  </body>
</html>
